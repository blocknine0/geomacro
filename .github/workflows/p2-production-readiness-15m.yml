name: P2 Production Readiness 15m

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "workers/control-plane/src/gro-evidence-enrichment.mjs"
      - "workers/control-plane/src/website-incremental-feed.mjs"
      - "workers/control-plane/src/index.mjs"
      - "workers/control-plane/migrations/0120_gro_archival_evidence_outbox.sql"
      - "src/lib/public-derived-news-client.ts"
      - "src/routes/intelligence.tsx"
      - "src/components/intelligence/stateless-live-desk.tsx"
      - ".github/workflows/p2-production-readiness-15m.yml"
      - "scripts/ops/verify-p2-production-readiness.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geomacro-p2-real-production-observer
  cancel-in-progress: false

jobs:
  actual-production-observer:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Demand real live Worker SHA, website SHA, 3 category D1, GRO and verified edges
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/verify-p2-production-readiness.mjs
      - name: Upload exact external observed P2 receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2-production-observer
          path: artifacts/p2-production/latest.json
          if-no-files-found: warn
          retention-days: 7
