name: Step3 Protected Local Shadow and Stage2 Orchestrator
# Distinct immutable owner issue is a separately verifiable one-shot review.
# Legacy manual workflow_dispatch still requires protected reviewed SHA variable.
run-name: "Step3 owner issue #${{ inputs.owner_dispatch_issue || 'manual' }}"
on:
  pull_request:
    paths:
      - ".github/workflows/production-rollout-orchestrator.yml"
      - "scripts/lib/d1-step3-receipt-admission.mjs"
      - "scripts/ops/run-step3-protected-d1-migrations.mjs"
      - "scripts/ops/run-step3-local-workerd-rehearsal.mjs"
      - "scripts/tests/d1-step3-receipt-admission.test.mjs"
      - "scripts/lib/d1-step3-real-shadow-proofs.mjs"
      - "scripts/lib/d1-step3-shadow-pointer-seed.mjs"
      - "scripts/lib/d1-step3-0213-safe-resume.mjs"
      - "scripts/tests/d1-step3-0213-safe-resume.test.mjs"
      - "scripts/tests/d1-step3-shadow-pointer-seed.test.mjs"
      - "scripts/lib/d1-step3-production-final-acceptance.mjs"
      - "scripts/tests/d1-step3-production-final-acceptance.test.mjs"
      - "scripts/ops/verify-owner-dispatch-reviewed-sha.mjs"
      - "scripts/tests/owner-dispatch-reviewed-sha.test.mjs"
      - "scripts/ops/owner-issue-dispatch-gateway.mjs"
      - "scripts/tests/d1-step3-real-shadow-proofs.test.mjs"
      - "scripts/tests/step3-hot50-physical-parity-wiring.test.mjs"
      - "scripts/ops/audit-hot50-b2-d1-parity.mjs"
      - "scripts/ops/hot50-parity-proof.mjs"
      - "scripts/ops/check-d1-paid-monthly-headroom.mjs"
      - "scripts/tests/step3-orchestrator-dedicated-billing-read.test.mjs"
      - "scripts/ops/seed-step3-shadow-nonfact-index-fixture.mjs"
      - "scripts/tests/seed-step3-shadow-nonfact-index-fixture.test.mjs"
      - ".github/workflows/step3-shadow-0204-nonfact-index-fixture.yml"
  workflow_dispatch:
    inputs:
      approval:
        description: "Type REHEARSE_D1_SHADOW_ONLY_NO_PRODUCTION_SQL"
        required: true
        type: string
      execute_stage2:
        description: "Stage2 only if signed real-provider shadow PASS"
        required: true
        type: boolean
        default: false
      verify_hot50:
        description: "Run live Hot50 audit after migration"
        required: true
        type: boolean
        default: false
      owner_dispatch_issue:
        description: "Optional verified owner gateway issue number; manual runs keep protected SHA pin"
        required: false
        type: string
      owner_dispatch_gateway_run:
        description: "Optional real owner gateway Actions run ID; requires issue number"
        required: false
        type: string
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: geomacro-d1-control-plane-production
  cancel-in-progress: false
jobs:
  local-workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm install --prefix scripts/ops --no-save --ignore-scripts --package-lock=false miniflare@3
      - run: >-
          node --test
          scripts/tests/d1-step3-receipt-admission.test.mjs
          scripts/tests/d1-step3-dual-worker-expand-contract.test.mjs
          scripts/tests/d1-step3-real-shadow-proofs.test.mjs
          scripts/tests/d1-step3-shadow-pointer-seed.test.mjs
          scripts/tests/step3-hot50-physical-parity-wiring.test.mjs
          scripts/tests/step3-orchestrator-dedicated-billing-read.test.mjs
          scripts/tests/seed-step3-shadow-nonfact-index-fixture.test.mjs
          scripts/tests/d1-step3-shadow-pointer-seed.test.mjs
          scripts/tests/d1-step3-durable-recovery.test.mjs
          scripts/tests/d1-step3-0213-safe-resume.test.mjs
          scripts/tests/d1-step3-production-final-acceptance.test.mjs
          scripts/tests/step3-protected-binding-readiness.test.mjs
          scripts/tests/owner-dispatch-reviewed-sha.test.mjs
      - run: node --check scripts/ops/run-step3-protected-d1-migrations.mjs
      - run: bash -n scripts/ops/setup-step3-github-bindings.sh
      - run: node scripts/ops/run-step3-local-workerd-rehearsal.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-local-only
          path: artifacts/release/step3-shadow-local-rehearsal-receipt.json
          retention-days: 14
          if-no-files-found: error

  shadow-physical:
    needs: local-workerd
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      inputs.approval == 'REHEARSE_D1_SHADOW_ONLY_NO_PRODUCTION_SQL'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 55
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Dedicated read-only account subscription proof; never authorize plan changes.
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_TARGET_APPROVED: "YES"
      GEOMACRO_STEP3_SHADOW_POINTER_SEED_APPROVED: ${{ vars.GEOMACRO_STEP3_SHADOW_POINTER_SEED_APPROVED }}
      GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET: ${{ vars.GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET }}
      GEOMACRO_STEP3_EXACT_SHA: ${{ vars.GEOMACRO_STEP3_REVIEWED_SHA }}
      GEOMACRO_D1_RECOVERY_AES256_KEY_B64: ${{ secrets.GEOMACRO_D1_RECOVERY_AES256_KEY_B64 }}
      GEOMACRO_D1_RECOVERY_R2_BUCKET: ${{ vars.GEOMACRO_D1_RECOVERY_R2_BUCKET }}
      GEOMACRO_D1_RECOVERY_R2_PRIVATE_APPROVED: ${{ vars.GEOMACRO_D1_RECOVERY_R2_PRIVATE_APPROVED }}
      SIGNING_JWK: ${{ secrets.SIGNING_JWK }}
      # Stage1 shadow-only credential; never reuse or rotate the live bearer token.
      CONTROL_PLANE_TOKEN: ${{ secrets.GEOMACRO_STEP3_SHADOW_CONTROL_PLANE_TOKEN }}
      # Shadow-only HMAC, never the production pointer signing key.
      PHASE2H_R2_REFERENCE_HMAC_KEY: ${{ secrets.PHASE2H_SHADOW_R2_REFERENCE_HMAC_KEY }}
      GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: "step3_shadow_rehearsal"
      B2_REQUEST_BUDGET: "12"
    steps:
      # Effective production-environment vars are resolved after job admission.
      # No checkout or Cloudflare/D1 work precedes this fail-closed check.
      - name: Require protected Shadow rehearsal approval after environment admission
        shell: bash
        env:
          # Step-level vars resolve on the protected production runner.
          SHADOW_APPROVAL_VALUE: ${{ vars.GEOMACRO_STEP3_SHADOW_REHEARSAL_APPROVED }}
        run: |
          set -euo pipefail
          if [[ "${SHADOW_APPROVAL_VALUE:-}" != "YES" ]]; then
            echo "::error title=Shadow authorization HOLD::Step3 Shadow rehearsal approval is not YES in the effective production environment"
            exit 3
          fi
          # Export the verified authorization only to subsequent steps.
          # This is not a default or bypass: the assertion above must pass.
          printf '%s\n' 'GEOMACRO_STEP3_SHADOW_REHEARSAL_APPROVED=YES' >> "$GITHUB_ENV"
          echo "Protected Shadow approval verified; all provider gates remain in force."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Authenticate owner issue exact-main SHA or retain manual protected SHA pin
        env:
          OWNER_DISPATCH_ISSUE: ${{ inputs.owner_dispatch_issue }}
          OWNER_DISPATCH_GATEWAY_RUN: ${{ inputs.owner_dispatch_gateway_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/verify-owner-dispatch-reviewed-sha.mjs
      - name: Require reviewed main SHA and genuine private bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GEOMACRO_STEP3_EXACT_SHA"
          test -f config/d1-hotspot-v2-canary.hold
          test -n "$GEOMACRO_D1_RECOVERY_AES256_KEY_B64"
          test -n "$GEOMACRO_D1_RECOVERY_R2_BUCKET"
          test -n "$SIGNING_JWK"
          test -n "$CONTROL_PLANE_TOKEN"
          test -n "$PHASE2H_R2_REFERENCE_HMAC_KEY"
          test "$GEOMACRO_D1_RECOVERY_R2_PRIVATE_APPROVED" = YES
          test "$GEOMACRO_STEP3_SHADOW_POINTER_SEED_APPROVED" = YES
          test -n "$GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET"
          test -n "$GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST"
          test -n "$GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST"
          test -n "$B2_ARCHIVE_READ_KEY_ID"
          test -n "$B2_ARCHIVE_READ_APPLICATION_KEY"
          test "$D1_DATABASE_ID" != "$GEOMACRO_D1_SHADOW_DATABASE_ID"
      - run: node scripts/ops/check-d1-paid-monthly-headroom.mjs --check
      - run: node scripts/ops/run-step3-protected-d1-migrations.mjs --rehearse-shadow
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-real-shadow
          path: |
            artifacts/release/step3-shadow-rehearsal-receipt.json
            artifacts/release/d1-paid-monthly-headroom.json
          retention-days: 14
          if-no-files-found: warn

  stage2-production:
    needs: shadow-physical
    if: >-
      needs.shadow-physical.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.execute_stage2 == true
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 55
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Dedicated read-only account subscription proof; never authorize plan changes.
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_TARGET_APPROVED: "YES"
      GEOMACRO_STEP3_EXACT_SHA: ${{ vars.GEOMACRO_STEP3_REVIEWED_SHA }}
      GEOMACRO_STEP3_APPLY: "APPROVE_ONLY_0204_0211_0212_0213"
      GEOMACRO_STEP3_RECOVERY_V2_APPROVED: ${{ vars.GEOMACRO_STEP3_RECOVERY_V2_APPROVED }}
      GEOMACRO_STEP3_TRUSTED_SIGNER_PUBLIC_JWK: ${{ secrets.GEOMACRO_STEP3_TRUSTED_SIGNER_PUBLIC_JWK }}
      GEOMACRO_D1_RECOVERY_AES256_KEY_B64: ${{ secrets.GEOMACRO_D1_RECOVERY_AES256_KEY_B64 }}
      GEOMACRO_D1_RECOVERY_R2_BUCKET: ${{ vars.GEOMACRO_D1_RECOVERY_R2_BUCKET }}
      GEOMACRO_D1_RECOVERY_R2_PRIVATE_APPROVED: ${{ vars.GEOMACRO_D1_RECOVERY_R2_PRIVATE_APPROVED }}
      SIGNING_JWK: ${{ secrets.SIGNING_JWK }}
      CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
      PHASE2H_R2_REFERENCE_HMAC_KEY: ${{ secrets.PHASE2H_R2_REFERENCE_HMAC_KEY }}
      GEOMACRO_STEP3_VERIFIED_WORKER_HOST: "api.geomacro.live"
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: "step3_production_verify"
      B2_REQUEST_BUDGET: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: geomacro-step3-real-shadow
          path: artifacts/release
      - name: Authenticate owner issue exact-main SHA or retain manual protected SHA pin
        env:
          OWNER_DISPATCH_ISSUE: ${{ inputs.owner_dispatch_issue }}
          OWNER_DISPATCH_GATEWAY_RUN: ${{ inputs.owner_dispatch_gateway_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/verify-owner-dispatch-reviewed-sha.mjs
      - name: Authenticate existing live Control Plane bearer without rotation
        if: github.event_name == 'workflow_dispatch' && inputs.execute_stage2 == true
        shell: bash
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          # The existing ledger root is already protected in this environment.
          # Only a matching live Worker admin GET exports the HMAC-derived
          # bearer to subsequent steps via runner-local GITHUB_ENV.
          # Never alter Cloudflare Worker secret, GitHub secret, D1, or HOLD.
          node scripts/ops/prepare-five-gate-control-token.mjs
      - name: Check signed receipt before any D1 provider call
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from "node:child_process";
          import {step3SqlManifests} from "./scripts/lib/d1-step3-migration-contract.mjs";
          import {admitSignedStep3ShadowReceipt} from "./scripts/lib/d1-step3-receipt-admission.mjs";
          const result=admitSignedStep3ShadowReceipt({
            currentHead:execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),
            manifests:step3SqlManifests()
          });
          console.log(JSON.stringify({status:result.status,sha:result.reviewed_source_sha}));
          NODE
      - run: node scripts/ops/run-step3-protected-d1-migrations.mjs --apply
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-production
          path: |
            artifacts/release/d1-step3-migration-execution.json
            artifacts/release/step3-production-physical-pass.json
            artifacts/release/d1-paid-monthly-headroom.json
          retention-days: 14
          if-no-files-found: warn

  hot50-readback:
    needs: stage2-production
    if: >-
      needs.stage2-production.result == 'success' &&
      inputs.verify_hot50 == true
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      ROOT_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      RISK_GATE_TIERED_TOKEN: ${{ secrets.RISK_GATE_TIERED_TOKEN }}
      GROQ_API_KEY_FOR_ASK_CACHE: ${{ secrets.GROQ_API_KEY }}
      GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_PEM }}
      GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_SHA256 }}
      RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: "step3_hot50_parity"
      B2_REQUEST_BUDGET: "250"
      PARITY_MAX_B2_READS: "240"
      GEOMACRO_CONTROL_PLANE_URL: https://geomacro-control-plane.daspallab202391.workers.dev
      B2_PARITY_VERIFIED_RECEIPT_JSON: /tmp/hot50-proof/parity.json
      ACTIVATION_RUN_IDEMPOTENT_REDRIVE: "0"
      HOT50_TIER_FULL_CENSUS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      # Use the exact existing owner-scoped HMAC derivation as the independent
      # Hot50 production proof workflow. Never rotate or print the capability.
      - name: Derive existing no-funds B2 audit capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hot50-proof
          node --input-type=module <<'NODE'
          import {createHmac} from "node:crypto";
          import {appendFileSync} from "node:fs";
          const root=process.env.ROOT_LEDGER_TOKEN??"";
          if(root.length<32)throw Error("HOT50_EXISTING_ROOT_CAPABILITY_MISSING");
          for(const [name,scope] of [
            ["CONTROL_PLANE_TOKEN","geomacro-control-plane-v1"],
            ["B2_SPOOL_ENCRYPTION_KEY","geomacro-p0b-private-spool-aes-gcm-v1"]
          ]){
            const value=createHmac("sha256",root).update(scope).digest("hex");
            console.log("::add-mask::"+value);
            appendFileSync(process.env.GITHUB_ENV,name+"="+value+"\n");
          }
          NODE
      # Do not reserve even one B2 operation against a missing, stale, or
      # misbound D1 quota ledger. This is read-only and fail-closed.
      - name: Verify exact main and canonical D1 quota ledger identity before B2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id=String(process.env.D1_DATABASE_ID??"");
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID??"");
          const cloudflare=String(process.env.CLOUDFLARE_API_TOKEN??"");
          const gh=String(process.env.GITHUB_TOKEN??"");
          const expected=String(process.env.GITHUB_SHA??"");
          if(!/^[a-f0-9-]{36}$/i.test(id)||
             !/^[a-f0-9]{32}$/i.test(account)||
             cloudflare.length<20||gh.length<20||
             !/^[a-f0-9]{40}$/.test(expected))
            throw Error("HOT50_PROTECTED_D1_OR_SHA_BINDING_MISSING");
          const auth=await fetch("https://api.github.com/repos/blocknine0/geomacro/branches/main",{
            headers:{Authorization:"Bearer "+gh,Accept:"application/vnd.github+json"},
            redirect:"error",signal:AbortSignal.timeout(15000)});
          if(auth.status!==200)throw Error("HOT50_CURRENT_MAIN_SHA_UNAVAILABLE");
          const main=await auth.json();
          if(main.commit?.sha!==expected)throw Error("HOT50_EXACT_MAIN_CHANGED");
          const endpoint="https://api.cloudflare.com/client/v4/accounts/"+account+
            "/d1/database?per_page=100";
          const provider=await fetch(endpoint,{redirect:"error",headers:{
            Authorization:"Bearer "+cloudflare,Accept:"application/json"
          },signal:AbortSignal.timeout(15000)});
          if(provider.status!==200)throw Error("HOT50_CANONICAL_D1_INVENTORY_UNAVAILABLE");
          const doc=await provider.json();
          if(doc?.success!==true||!Array.isArray(doc.result)||
             (doc.result_info?.total_pages??1)!==1)
            throw Error("HOT50_CANONICAL_D1_INVENTORY_INCOMPLETE");
          const matches=doc.result.filter(row=>row.name==="geomacro-control-plane");
          if(matches.length!==1||matches[0].uuid!==id)
            throw Error("HOT50_D1_CANONICAL_BINDING_MISMATCH");
          // A newer local B2 quota policy must not silently outrun the
          // deployed Control Plane's account-wide atomic reservation ceiling.
          // No B2 calls are permitted until both governors agree.
          const {B2_DAILY_LIMITS}=await import("./workers/control-plane/src/b2-account-quota.mjs");
          const worker=String(process.env.GEOMACRO_CONTROL_PLANE_URL??"");
          const bearer=String(process.env.CONTROL_PLANE_TOKEN??"");
          if(!/^https:\/\/[a-z0-9.-]+\\.workers\\.dev$/i.test(worker)||
             !/^[a-f0-9]{64}$/.test(bearer))
            throw Error("HOT50_QUOTA_WORKER_AUTH_UNAVAILABLE");
          const quotaResponse=await fetch(worker+"/v1/b2-quota/status",{
            headers:{Authorization:"Bearer "+bearer,Accept:"application/json"},
            redirect:"error",signal:AbortSignal.timeout(15000)});
          if(quotaResponse.status!==200)throw Error("HOT50_LIVE_B2_GOVERNOR_UNAVAILABLE");
          const quota=await quotaResponse.json();
          const kinds=["total","GET","PUT","HEAD","NATIVE_AUTH"];
          if(quota?.ok!==true||
             quota.day_utc!==new Date().toISOString().slice(0,10)||
             kinds.some(k=>quota.limits?.[k]!==B2_DAILY_LIMITS[k]||
               !Number.isSafeInteger(quota.used?.[k])||quota.used[k]<0||
               quota.used[k]>B2_DAILY_LIMITS[k]))
            throw Error("HOT50_B2_LIVE_GOVERNOR_POLICY_DRIFT");
          if(quota.used.GET>=B2_DAILY_LIMITS.GET||
             quota.used.total>=B2_DAILY_LIMITS.total)
            throw Error("HOT50_B2_LIVE_QUOTA_EXHAUSTED");
          console.log(JSON.stringify({status:"PASS",
            code:"HOT50_EXACT_MAIN_AND_CANONICAL_D1_LEDGER_MATCHED",
            head_sha:expected,quota_governor_required:true,no_funds:true}));
          NODE
      # This is a REAL provider B2 S3 GET/AES-GCM/D1 manifest comparison.
      # A failed/partial/quota-limited audit stays FAIL: the next step still
      # runs to report the missing independent evidence and cannot emit PASS.
      - name: Produce same-run bounded genuine B2-D1 parity receipt
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/audit-hot50-b2-d1-parity.mjs > /tmp/hot50-proof/parity.json 2> /tmp/hot50-proof/parity-error.json
      - name: Require all five genuine Hot50 production gates
        run: node scripts/ops/verify-hot50-production-activation.mjs
      - name: Require all 150 live signed country-category cells across priced risk-gate tiers
        run: node scripts/ops/verify-hot50-risk-gate-tiers.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-hot50-150-cell-proof
          path: |
            artifacts/hot50-risk-gate/latest.json
            /tmp/hot50-proof/*.json
          if-no-files-found: warn
          retention-days: 14

