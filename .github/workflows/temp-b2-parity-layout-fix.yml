name: Temporary B2 Parity Layout Fix

on:
  push:
    branches:
      - fix/b2-data-parity-20261003
    paths:
      - ".github/workflows/temp-b2-parity-layout-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/b2-data-parity-20261003
          fetch-depth: 0
      - name: Keep current feed strict and render verified context separately
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              if old not in value:
                  raise SystemExit(f"{label} anchor missing")
              return value.replace(old, new, 1)

          source_path = Path("src/lib/use-intelligence.ts")
          source_text = source_path.read_text()
          source_text = replace_once(
              source_text,
              '''  const explicitResearch = Boolean(q) || category !== "all";\n  const current = [...rows]\n    .filter((r) => r.isCurrent)\n    .sort((a, b) => timeOf(b) - timeOf(a))\n    .slice(0, 12);\n  const latestVerifiedContext = [...rows]\n    .filter((r) => !r.isCurrent && r.publicStatus === "verified_b2")\n    .sort((a, b) => timeOf(b) - timeOf(a))\n    .slice(0, 12);\n  let out = explicitResearch\n    ? rows\n    : current.length > 0\n      ? [...current, ...latestVerifiedContext]\n      : [...rows]\n          .filter((r) => Number.isFinite(timeOf(r)))\n          .sort((a, b) => timeOf(b) - timeOf(a))\n          .slice(0, 24);''',
              '''  const explicitResearch = Boolean(q) || category !== "all";\n  const current = rows.filter((r) => r.isCurrent);\n  let out = explicitResearch\n    ? rows\n    : current.length > 0\n      ? current\n      : [...rows]\n          .filter((r) => Number.isFinite(timeOf(r)))\n          .sort((a, b) => timeOf(b) - timeOf(a))\n          .slice(0, 24);''',
              "filter parity",
          )
          source_path.write_text(source_text)

          route_path = Path("src/routes/intelligence.tsx")
          route_text = route_path.read_text()
          route_text = replace_once(
              route_text,
              '''                  {hasLiveObserved && usesVerifiedContext ? "Fresh observed + latest verified scored set" : hasLiveObserved ? "Fresh observed + verified event set" : latestVerifiedFallback ? "Latest verified event set" : "Current event set"}''',
              '''                  {hasLiveObserved ? "Fresh observed event set" : latestVerifiedFallback ? "Latest verified event set" : "Current event set"}''',
              "current set label",
          )
          route_text = replace_once(
              route_text,
              '''                    : hasLiveObserved && usesVerifiedContext\n                      ? "Current + latest verified intelligence"\n                      : hasLiveObserved\n                        ? "Current intelligence"\n                      : latestVerifiedFallback''',
              '''                    : hasLiveObserved\n                      ? "Current intelligence"\n                      : latestVerifiedFallback''',
              "current intelligence heading",
          )

          grid_anchor = '''            {filtered.length ? (\n              <div className="grid gap-4 md:grid-cols-2">\n                {filtered.slice(0, 24).map((event) => <IntelCard key={event.id} event={event} />)}\n              </div>\n            ) : (\n              <div className="rounded-2xl border border-dashed border-border p-8 text-center">\n                <p className="font-medium">No matching intelligence</p>\n                <p className="mt-2 text-sm text-muted-foreground">Try a broader search or a different category.</p>\n              </div>\n            )}\n          </div>'''
          grid_replacement = '''            {filtered.length ? (\n              <div className="grid gap-4 md:grid-cols-2">\n                {filtered.slice(0, 24).map((event) => <IntelCard key={event.id} event={event} />)}\n              </div>\n            ) : (\n              <div className="rounded-2xl border border-dashed border-border p-8 text-center">\n                <p className="font-medium">No matching intelligence</p>\n                <p className="mt-2 text-sm text-muted-foreground">Try a broader search or a different category.</p>\n              </div>\n            )}\n\n            {!query.trim() && category === "all" && intel.data.verifiedRiskContext.length > 0 ? (\n              <section className="mt-10 border-t border-border/60 pt-8" aria-labelledby="verified-risk-context-heading">\n                <div className="mb-4 flex flex-wrap items-end justify-between gap-3">\n                  <div>\n                    <p className="font-mono text-[10px] uppercase tracking-[0.16em] text-primary">Verified B2 continuity</p>\n                    <h2 id="verified-risk-context-heading" className="mt-1 text-2xl font-semibold">Latest verified scored context</h2>\n                    <p className="mt-2 max-w-2xl text-sm leading-relaxed text-muted-foreground">\n                      Recent durable scored records are shown separately from today&apos;s live observations. Their original timestamps are preserved; they are context, not current-event claims.\n                    </p>\n                  </div>\n                  <p className="text-sm text-muted-foreground">{intel.data.verifiedRiskContext.length} verified record{intel.data.verifiedRiskContext.length === 1 ? "" : "s"}</p>\n                </div>\n                <div className="grid gap-4 md:grid-cols-2">\n                  {intel.data.verifiedRiskContext.slice(0, 8).map((event) => <IntelCard key={`verified-context-${event.id}`} event={event} />)}\n                </div>\n              </section>\n            ) : null}\n          </div>'''
          route_text = replace_once(route_text, grid_anchor, grid_replacement, "intelligence grid")
          route_path.write_text(route_text)

          test_path = Path("src/__tests__/b2-public-data-parity-static.test.ts")
          test_text = test_path.read_text()
          test_text = replace_once(
              test_text,
              'expect(source).toContain("[...current, ...latestVerifiedContext]");',
              'expect(source).toContain("verifiedRiskContext");\n    expect(source).toContain("current.length > 0");',
              "parity source assertion",
          )
          test_text = replace_once(
              test_text,
              '    expect(route).toContain("Current + latest verified intelligence");',
              '    expect(route).toContain("Latest verified scored context");\n    expect(route).toContain("context, not current-event claims");',
              "parity route assertion",
          )
          test_path.write_text(test_text)
          PY

      - name: Commit layout parity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "geomacro-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/use-intelligence.ts src/routes/intelligence.tsx src/__tests__/b2-public-data-parity-static.test.ts
          git commit -m "fix: render verified B2 context separately from current feed"
          git push origin HEAD:fix/b2-data-parity-20261003
