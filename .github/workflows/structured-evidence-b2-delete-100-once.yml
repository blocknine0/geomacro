name: Structured Evidence B2 Delete 100 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/structured-evidence-b2-delete-100-once.yml"

permissions:
  contents: read

concurrency:
  group: structured-evidence-b2-delete
  cancel-in-progress: false

jobs:
  delete-batch:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      STRUCTURED_EVIDENCE_DELETE_OLDER_DAYS: "7"
      STRUCTURED_EVIDENCE_DELETE_LIMIT: "100"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify bounded cleanup configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test "$STRUCTURED_EVIDENCE_DELETE_LIMIT" = "100"
      - name: Delete one hundred rows one at a time with independent verification
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 "$STRUCTURED_EVIDENCE_DELETE_LIMIT"); do
            echo "Verified cleanup iteration $i/$STRUCTURED_EVIDENCE_DELETE_LIMIT"
            node scripts/ops/b2-delete-structured-evidence-canary.mjs
          done
