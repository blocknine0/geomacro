name: One-Time Geopolitics Published Official GET
on:
  push:
    branches:
      - diag/geopolitics-published-coverage-20261013
permissions:
  contents: read
jobs:
  no-funds-readback:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_CANONICAL_SHA: ce6c5e1c9388aa449d82d8bc16d9b6be718bb2c9
      GEOMACRO_BASE_URL: https://geomacro.live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Verify exact published SHA and all 3 unsigned category GETs
        run: node scripts/ops/verify-three-category-live-official-api.mjs
