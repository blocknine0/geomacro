name: Commercial Preflight Maintenance Sync

on:
  push:
    branches:
      - feat/commercial-distribution-foundation
    paths:
      - ".github/workflows/commercial-preflight-maintenance-temp.yml"

permissions:
  contents: write

jobs:
  patch-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-distribution-foundation
      - name: Add missing preflight trigger and env coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/commercial-coordinated-launch-preflight.yml')
          s = p.read_text()
          replacements = [
              (
                  '      - "config/commercial-launch-manifest.json"\n',
                  '      - "config/commercial-launch-manifest.json"\n      - "config/agent-marketplace-distribution.json"\n      - "docs/AGENT_MARKETPLACE_LAUNCH_PACKAGE.md"\n',
              ),
              (
                  '      - "server/api/internal/commercial-growth.post.ts"\n',
                  '      - "server/api/internal/commercial-growth.post.ts"\n      - "server/routes/internal/commercial-ops.get.ts"\n',
              ),
              (
                  "          grep -q '^COINBASE_X402_MAINNET_ACK=$' .env.example\n",
                  "          grep -q '^COINBASE_X402_MAINNET_ACK=$' .env.example\n          grep -q '^NEVERMINED_X402_ENVIRONMENT=$' .env.example\n          grep -q '^NEVERMINED_NVM_API_KEY=$' .env.example\n          grep -q '^NEVERMINED_PLAN_ID=$' .env.example\n",
              ),
              (
                  "          if grep -Eq '^GOATX402_MAINNET_COMMERCIAL_ENABLED=true$' .env.example; then\n",
                  "          if grep -Eq '^NEVERMINED_X402_ENVIRONMENT=live$' .env.example; then\n            echo 'ERROR: Nevermined live must remain disabled before coordinated launch.' >&2\n            exit 1\n          fi\n          if grep -Eq '^GOATX402_MAINNET_COMMERCIAL_ENABLED=true$' .env.example; then\n",
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing preflight patch anchor: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify scope and required assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'config/agent-marketplace-distribution.json' .github/workflows/commercial-coordinated-launch-preflight.yml
          grep -q 'docs/AGENT_MARKETPLACE_LAUNCH_PACKAGE.md' .github/workflows/commercial-coordinated-launch-preflight.yml
          grep -q 'server/routes/internal/commercial-ops.get.ts' .github/workflows/commercial-coordinated-launch-preflight.yml
          grep -q "NEVERMINED_X402_ENVIRONMENT=live" .github/workflows/commercial-coordinated-launch-preflight.yml
          git diff --check
          changed="$(git diff --name-only)"
          if [[ "$changed" != ".github/workflows/commercial-coordinated-launch-preflight.yml" ]]; then
            echo "ERROR: unexpected changed files: $changed" >&2
            exit 1
          fi
      - name: Commit preflight maintenance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/commercial-coordinated-launch-preflight.yml
          git commit -m "ci: cover marketplace and growth surfaces in preflight"
          git push origin HEAD:feat/commercial-distribution-foundation
