name: Temporary x402 Extension Fix

on:
  push:
    branches:
      - x402-industry-ready-production-v1
    paths:
      - ".github/workflows/temporary-x402-extension-fix.yml"

permissions:
  contents: write

jobs:
  normalize-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: x402-industry-ready-production-v1
          fetch-depth: 0
      - name: Apply exact source transformation
        run: python scripts/temporary-fix-x402-extension.py
      - name: Verify transformed contract
        run: grep -q 'const info = extension.info' src/routes/api.x402.intelligence.ts
      - name: Commit fix
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add src/routes/api.x402.intelligence.ts && git commit -m 'Normalize adaptive x402 extension contract' && git push origin HEAD:x402-industry-ready-production-v1
