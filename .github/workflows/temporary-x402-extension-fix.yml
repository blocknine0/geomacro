name: Temporary x402 Extension Fix

on:
  push:
    branches:
      - x402-industry-ready-production-v1
    paths:
      - ".github/workflows/temporary-x402-extension-fix.yml"

permissions:
  contents: write

jobs:
  normalize-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: x402-industry-ready-production-v1
          fetch-depth: 0
      - name: Normalize Geomacro x402 extension shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/api.x402.intelligence.ts')
          s = p.read_text()
          old = '''    geomacro: {
                product: PRODUCT_ID,
                query_plan_hash: planHash,
                execution_authorized: false,
              },'''
          if old not in s:
              old = '''    geomacro: {
      product: PRODUCT_ID,
      query_plan_hash: planHash,
      execution_authorized: false,
    },'''
          new = '''    geomacro: {
      info: {
        product: PRODUCT_ID,
        query_plan_hash: planHash,
        execution_authorized: false,
      },
      schema: {
        $schema: "https://json-schema.org/draft/2020-12/schema",
        type: "object",
        properties: {
          product: { type: "string" },
          query_plan_hash: { type: "string" },
          execution_authorized: { type: "boolean", const: false },
        },
        required: ["product", "query_plan_hash", "execution_authorized"],
      },
    },'''
          if old not in s:
              raise SystemExit('expected geomacro extension block not found')
          s = s.replace(old, new, 1)
          old2 = '''  const binding = geomacro as Record<string, unknown>;
  if (binding.product !== PRODUCT_ID || binding.query_plan_hash !== planHash) {
    throw new Error("PAYMENT_QUERY_PLAN_MISMATCH");
  }'''
          new2 = '''  const extension = geomacro as Record<string, unknown>;
  const info = extension.info;
  if (!info || typeof info !== "object" || Array.isArray(info)) {
    throw new Error("PAYMENT_QUERY_BINDING_EXTENSION_MISSING");
  }
  const binding = info as Record<string, unknown>;
  if (binding.product !== PRODUCT_ID || binding.query_plan_hash !== planHash) {
    throw new Error("PAYMENT_QUERY_PLAN_MISMATCH");
  }'''
          if old2 not in s:
              raise SystemExit('expected binding block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          grep -q 'const info = extension.info' src/routes/api.x402.intelligence.ts
          grep -q 'schema: {' src/routes/api.x402.intelligence.ts
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api.x402.intelligence.ts
          git commit -m "Normalize adaptive x402 extension contract"
          git push origin HEAD:x402-industry-ready-production-v1
