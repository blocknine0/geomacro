name: Post Listing Health

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact canonical main SHA whose listings were independently observed"
        required: true
        type: string
      marketplace_observation_run_id:
        description: "Successful Marketplace Listing Observation run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: post-listing-health
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEOMACRO_PRODUCTION_ACCEPTANCE_SHA: ${{ inputs.candidate_sha }}
      GEOMACRO_PUBLIC_PRODUCTION_BASE_URL: https://geomacro.live
      GEOMACRO_POST_LISTING_HEALTH_OUTPUT: /tmp/post-listing-health.json
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Require exact current main SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${DISPATCH_SHA,,}" ]]

      - name: Verify independent marketplace observation happened first
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          MARKETPLACE_RUN: ${{ inputs.marketplace_observation_run_id }}
        with:
          script: |
            const runId = Number(process.env.MARKETPLACE_RUN);
            if (!Number.isInteger(runId) || runId <= 0) core.setFailed('marketplace_observation_run_id must be numeric');
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.path !== '.github/workflows/marketplace-listing-observation.yml') core.setFailed('Referenced run is not Marketplace Listing Observation');
            if (run.event !== 'workflow_dispatch' || run.head_branch !== 'main') core.setFailed('Marketplace observation must be a manual main run');
            if (String(run.head_sha || '').toLowerCase() !== String(process.env.EXPECTED_SHA).toLowerCase()) core.setFailed('Marketplace observation SHA mismatch');
            if (run.status !== 'completed' || run.conclusion !== 'success') core.setFailed('Marketplace observation is not successful');

      - name: Verify exact-SHA public production after listing
        run: node scripts/commerce/post-listing-health.mjs

      - name: Upload sanitized post-listing health evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-listing-health-${{ github.run_id }}
          path: /tmp/post-listing-health.json
          if-no-files-found: error
          retention-days: 14
