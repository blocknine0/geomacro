# Automatic approval means derived-input ingestion and signed readback audit.
# Human numerical review, upstream rights grants and payments keep their own
# actual authority requirements; this workflow never claims those approvals.
name: Standing Delegated Derived Contract No Funds
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standing-delegated-derived-attestation.yml'
      - 'scripts/ops/verify-all-news-signed-publications.mjs'
      - 'src/lib/public-derived-news-client.ts'
      - 'src/__tests__/public-derived-news-client.test.ts'
      - 'scripts/ops/publish-automated-intelligence-inputs.ts'
      - 'scripts/ops/verify-gri-news-wakeup.mjs'
      - 'scripts/tests/gri-news-wakeup.test.mjs'
      - 'scripts/tests/automated-approval-continuation.test.mjs'
      - 'scripts/lib/signed-news-safe-diagnostic.mjs'
      - 'scripts/tests/signed-news-safe-diagnostic.test.mjs'
      - 'scripts/ops/sign-verified-derived-readback.mjs'
      - 'scripts/lib/standing-delegated-cloud-safe-reasons.mjs'
      - 'scripts/tests/standing-delegated-cloud-safe-reasons.test.mjs'
      - 'scripts/lib/standing-derived-cloud-enrollment.mjs'
      - 'scripts/tests/standing-derived-cloud-enrollment.test.mjs'
      - 'scripts/lib/standing-delegation-role-separation.mjs'
      - 'scripts/tests/standing-delegation-role-separation.test.mjs'
      - 'scripts/lib/standing-derived-delegation.mjs'
      - 'scripts/lib/gri-automated-derived-policy-review.mjs'
      - 'scripts/lib/complete-intelligence-gri-review.mjs'
      - 'scripts/lib/complete-intelligence-gri-review.test.mjs'
      - 'scripts/ops/triage-all-website-intelligence-for-gri.ts'
      - 'scripts/tests/standing-derived-cleanup-contract.test.mjs'
      - 'scripts/ops/sign-gri-automated-derived-policy-readback.mjs'
      - 'scripts/tests/gri-automated-derived-policy-review.test.mjs'
      - 'scripts/tests/standing-derived-delegation.test.mjs'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Auto Ingest News"
      - "Five-Minute Original News Fastlane"
      # Both real D1 derived-news writers can publish new rows independent
      # of the 5-minute fastlane. Complete retained-item signing/reconciliation
      # on success, using exactly the existing protected issuer and hourly cron.
      - "Website Derived News Continuity"
      - "Website Derived News Cadence Backstop"
      - "Current Original Private Signing Review Intake (No Funds)"
      - "Africa Country Source Sweep (Every 2 Hours)"
      - "Asia Country Source Sweep (Every 2 Hours)"
      - "Europe Country Source Sweep (Every 2 Hours)"
      - "North America Country Source Sweep (Every 2 Hours)"
      - "South America Country Source Sweep (Every 2 Hours)"
      - "Oceania Country Source Sweep (Every 2 Hours)"
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: |
          node --check scripts/ops/sign-gri-automated-derived-policy-readback.mjs
          node --test scripts/tests/gri-automated-derived-policy-review.test.mjs
          node --test scripts/lib/complete-intelligence-gri-review.test.mjs
          node --test scripts/tests/standing-derived-cleanup-contract.test.mjs
          node --check scripts/ops/enroll-standing-derived-cloud.mjs
          node --test scripts/tests/automated-approval-continuation.test.mjs scripts/tests/gri-news-wakeup.test.mjs scripts/tests/standing-derived-delegation.test.mjs scripts/tests/standing-derived-cloud-enrollment.test.mjs scripts/tests/signed-news-safe-diagnostic.test.mjs scripts/tests/standing-delegated-cloud-safe-reasons.test.mjs scripts/tests/standing-delegation-role-separation.test.mjs

  approve-retained-derived-inputs:
    needs: contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    concurrency:
      # Every run examines the complete retained journal. Coalesce overlapping
      # wakeups; the latest audit still covers all retained stories.
      group: geomacro-retained-derived-automatic-approval
      cancel-in-progress: false
    env:
      GEOMACRO_STANDING_DELEGATION_ENABLED: ${{ vars.GEOMACRO_STANDING_DELEGATION_ENABLED }}
      GEOMACRO_STANDING_DELEGATION_REVOKED: ${{ vars.GEOMACRO_STANDING_DELEGATION_REVOKED }}
    steps:
      - name: Honor existing opt-in and revocation before automatic approval
        id: optin
        run: |
          if [ "$GEOMACRO_STANDING_DELEGATION_ENABLED" = "YES_DELEGATED_DERIVED_ONLY" ] && [ "$GEOMACRO_STANDING_DELEGATION_REVOKED" != "YES" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo STANDING_DELEGATION_NOT_ACTIVE_NO_AUTOMATIC_APPROVAL
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.optin.outputs.active == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.optin.outputs.active == 'true'
        with:
          bun-version: '1.4.2'
      - name: Admit only canonical main and genuine completed-news ancestry
        if: steps.optin.outputs.active == 'true'
        run: node scripts/ops/verify-gri-news-wakeup.mjs
      - name: Install locked signing dependencies
        if: steps.optin.outputs.active == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Automatically approve and sign every unique retained derived input
        if: steps.optin.outputs.active == 'true'
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
          RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
          RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
          RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
          RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
          RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
        run: bun scripts/ops/publish-automated-intelligence-inputs.ts
      - name: Independently verify all retained signed inputs before delegated attestation
        if: steps.optin.outputs.active == 'true'
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
          RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
          RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
          RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
          RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
        run: bun scripts/ops/verify-all-news-signed-publications.mjs

  cloud-derived-only:
    needs: [contract, approve-retained-derived-inputs]
    # Privacy lock: delegated machine must never consume GeoMacro-only
    # original/source verdict proof. Re-enable only after a new vetted,
    # content-redacted owner attestation contract is independently accepted.
    if: >-
      false &&
      github.repository == 'blocknine0/geomacro' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    env:
      GEOMACRO_STANDING_DELEGATION_ENABLED: ${{ vars.GEOMACRO_STANDING_DELEGATION_ENABLED }}
      GEOMACRO_STANDING_DELEGATION_REVOKED: ${{ vars.GEOMACRO_STANDING_DELEGATION_REVOKED }}
      GEOMACRO_GRI_AUTO_ENROLLED: ${{ vars.GEOMACRO_GRI_AUTO_ENROLLED }}
      GEOMACRO_GRI_AUTO_REVOKED: ${{ vars.GEOMACRO_GRI_AUTO_REVOKED }}
      GEOMACRO_STANDING_DELEGATION_ENVELOPE_B64: ${{ secrets.GEOMACRO_STANDING_DELEGATION_ENVELOPE_B64 }}
      GEOMACRO_DELEGATION_OWNER_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_DELEGATION_OWNER_PUBLIC_KEY_PEM }}
      GEOMACRO_DELEGATION_OWNER_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_DELEGATION_OWNER_PUBLIC_KEY_SHA256 }}
      GEOMACRO_DELEGATION_SUMAN_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_DELEGATION_SUMAN_PUBLIC_KEY_PEM }}
      GEOMACRO_DELEGATION_SUMAN_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_DELEGATION_SUMAN_PUBLIC_KEY_SHA256 }}
      GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_PEM }}
      GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_SHA256 }}
      GEOMACRO_DELEGATED_MACHINE_PRIVATE_PKCS8_B64: ${{ secrets.GEOMACRO_DELEGATED_MACHINE_PRIVATE_PKCS8_B64 }}
      GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256 }}
      GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256 }}
      RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
      RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
      GEOMACRO_VERIFIED_DERIVED_RECEIPT_PATH: /home/runner/work/_temp/verified-derived.json
      GEOMACRO_DELEGATED_RECEIPT_OUTPUT_PATH: /home/runner/work/_temp/delegated-derived.json
    steps:
      - name: Check one-time governance opt-in
        id: optin
        run: |
          if [ "$GEOMACRO_STANDING_DELEGATION_ENABLED" = "YES_DELEGATED_DERIVED_ONLY" ] && [ "$GEOMACRO_STANDING_DELEGATION_REVOKED" != "YES" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo STANDING_DELEGATION_NOT_ACTIVE_NO_SIGNATURE
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.optin.outputs.active == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify trusted source ancestry for delegated processing
        if: steps.optin.outputs.active == 'true'
        run: node scripts/ops/verify-gri-news-wakeup.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.optin.outputs.active == 'true'
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        if: steps.optin.outputs.active == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Independently read back all current derived input signatures
        if: steps.optin.outputs.active == 'true'
        run: |
          # DISABLED by enclosing job privacy gate. Delegated machine has
          # no issuer/root credentials and cannot fetch owner-only news proof.
          umask 077
          bun scripts/ops/verify-all-news-signed-publications.mjs
      - name: Route EVERY retained three-domain website news card to bounded private GRI materiality review
        if: steps.optin.outputs.active == 'true'
        env:
          GEOMACRO_COMPLETE_GRI_REVIEW_PATH: ${{ runner.temp }}/complete-intelligence-gri-review.json
        run: |
          set -euo pipefail
          umask 077
          bun scripts/ops/triage-all-website-intelligence-for-gri.ts --triage-all-intelligence-no-funds
      - name: Retain private source-free complete Intelligence to GRI review worklist
        if: steps.optin.outputs.active == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-intelligence-gri-review-${{ github.run_id }}
          path: ${{ runner.temp }}/complete-intelligence-gri-review.json
          retention-days: 3
          if-no-files-found: error
      - name: Sign only derived-readback audit aggregate
        if: steps.optin.outputs.active == 'true'
        run: node scripts/ops/sign-verified-derived-readback.mjs --sign-verified-derived
      - name: Apply once-consented Pallab and Suman automated policy to ACTUAL verified original-derived audit
        if: >-
          steps.optin.outputs.active == 'true' &&
          env.GEOMACRO_GRI_AUTO_ENROLLED == 'YES_CONSENT_ONLY' &&
          env.GEOMACRO_GRI_AUTO_REVOKED != 'YES'
        env:
          GEOMACRO_GRI_AUTO_POLICY_ENVELOPE_B64: ${{ secrets.GEOMACRO_GRI_AUTO_POLICY_ENVELOPE_B64 }}
          GEOMACRO_GRI_AUTO_OWNER_MACHINE_PUBLIC_PEM: ${{ secrets.GEOMACRO_GRI_AUTO_OWNER_MACHINE_PUBLIC_PEM }}
          GEOMACRO_GRI_AUTO_REVIEW_MACHINE_PUBLIC_PEM: ${{ secrets.GEOMACRO_GRI_AUTO_REVIEW_MACHINE_PUBLIC_PEM }}
          GEOMACRO_GRI_AUTO_OWNER_MACHINE_PRIVATE_PKCS8_B64: ${{ secrets.GEOMACRO_GRI_AUTO_OWNER_MACHINE_PRIVATE_PKCS8_B64 }}
          GEOMACRO_GRI_AUTO_REVIEW_MACHINE_PRIVATE_PKCS8_B64: ${{ secrets.GEOMACRO_GRI_AUTO_REVIEW_MACHINE_PRIVATE_PKCS8_B64 }}
          GEOMACRO_GRI_AUTO_DERIVED_APPROVAL_PATH: ${{ runner.temp }}/gri-auto-policy-derived.json
        run: node scripts/ops/sign-gri-automated-derived-policy-readback.mjs --sign-current-verified-derived-audit-no-funds
      - name: Retain only no-funds dual-machine policy research receipt, not source materials
        if: >-
          steps.optin.outputs.active == 'true' &&
          env.GEOMACRO_GRI_AUTO_ENROLLED == 'YES_CONSENT_ONLY' &&
          env.GEOMACRO_GRI_AUTO_REVOKED != 'YES'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gri-automated-derived-policy-${{ github.run_id }}
          path: ${{ runner.temp }}/gri-auto-policy-derived.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save safe signed no-funds audit receipt
        if: steps.optin.outputs.active == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delegated-derived-only-${{ github.run_id }}
          path: ${{ runner.temp }}/delegated-derived.json
          retention-days: 7
          if-no-files-found: error
      - name: Delete temporary receipt bytes
        if: always()
        run: |
          set -euo pipefail
          rm -f -- \
            "$GEOMACRO_VERIFIED_DERIVED_RECEIPT_PATH" \
            "$GEOMACRO_DELEGATED_RECEIPT_OUTPUT_PATH" \
            "${RUNNER_TEMP}/gri-auto-policy-derived.json" \
            "${RUNNER_TEMP}/complete-intelligence-gri-review.json"
