name: Standing Delegated Derived Attestation (No Funds)
# Signed policy from TWO humans enables dedicated derived-only machine receipts.
# No human private key or third-party legal/scored attestations on GitHub.
on:
  pull_request:
    paths:
      - ".github/workflows/standing-delegated-derived-attestation.yml"
      - "scripts/lib/standing-derived-delegation.mjs"
      - "scripts/tests/standing-derived-delegation.test.mjs"
      - "scripts/ops/sign-standing-derived-delegation.mjs"
      - "scripts/ops/sign-verified-derived-readback.mjs"
      - "docs/ops/STANDING_DELEGATED_DERIVED_NO_FUNDS.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/standing-delegated-derived-attestation.yml"
      - "scripts/lib/standing-derived-delegation.mjs"
      - "scripts/tests/standing-derived-delegation.test.mjs"
      - "scripts/ops/sign-standing-derived-delegation.mjs"
      - "scripts/ops/sign-verified-derived-readback.mjs"
      - "docs/ops/STANDING_DELEGATED_DERIVED_NO_FUNDS.md"
  workflow_dispatch: {}
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows: ["Five-Minute Original News Fastlane"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
concurrency:
  group: geomacro-standing-delegated-derived-cloud
  cancel-in-progress: false

jobs:
  standing-governance-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Test exact two-human governance, scope and cloud signer
        run: |
          node --check scripts/lib/standing-derived-delegation.mjs
          node --check scripts/ops/sign-standing-derived-delegation.mjs
          node --check scripts/ops/sign-verified-derived-readback.mjs
          node --test scripts/tests/standing-derived-delegation.test.mjs

  delegated-derived-receipt:
    needs: standing-governance-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      vars.GEOMACRO_STANDING_DELEGATION_ENABLED == 'YES_DELEGATED_DERIVED_ONLY' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    env:
      GEOMACRO_STANDING_DELEGATION_ENABLED: ${{ vars.GEOMACRO_STANDING_DELEGATION_ENABLED }}
      GEOMACRO_STANDING_DELEGATION_REVOKED: ${{ vars.GEOMACRO_STANDING_DELEGATION_REVOKED }}
      GEOMACRO_STANDING_DELEGATION_ENVELOPE_B64: ${{ secrets.GEOMACRO_STANDING_DELEGATION_ENVELOPE_B64 }}
      GEOMACRO_OWNER_HUMAN_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_OWNER_HUMAN_PUBLIC_KEY_PEM }}
      GEOMACRO_OWNER_HUMAN_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_OWNER_HUMAN_PUBLIC_KEY_SHA256 }}
      GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_PEM }}
      GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_SHA256 }}
      GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_PEM }}
      GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_DELEGATED_MACHINE_PUBLIC_KEY_SHA256 }}
      GEOMACRO_DELEGATED_MACHINE_PRIVATE_PKCS8_B64: ${{ secrets.GEOMACRO_DELEGATED_MACHINE_PRIVATE_PKCS8_B64 }}
      GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256 }}
      GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256 }}
      RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
      RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
      GEOMACRO_VERIFIED_DERIVED_RECEIPT_PATH: ${{ runner.temp }}/verified-derived.json
      GEOMACRO_DELEGATED_RECEIPT_OUTPUT_PATH: ${{ runner.temp }}/delegated-derived.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read back every existing signed free derived input
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bun scripts/ops/verify-all-news-signed-publications.mjs > "$GEOMACRO_VERIFIED_DERIVED_RECEIPT_PATH"
      - name: Verify one-time signatures and sign derived-only machine receipt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/sign-verified-derived-readback.mjs --sign-verified-derived
      - name: Retain sanitized, signed zero-funds receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delegated-derived-only-${{ github.run_id }}
          path: ${{ runner.temp }}/delegated-derived.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary readback files
        if: always()
        run: rm -f -- "$GEOMACRO_VERIFIED_DERIVED_RECEIPT_PATH" "$GEOMACRO_DELEGATED_RECEIPT_OUTPUT_PATH"
