name: Standing Delegated Derived Contract No Funds
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node --test scripts/tests/standing-derived-delegation.test.mjs
