name: One-Time State Department Original Travel Advisory Readback
on:
  push:
    branches: [diag/state-travel-advisory-live-20261013]
permissions:
  contents: read
jobs:
  native-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/us-state-travel-advisory-original.test.ts src/lib/category-open-data.server.test.ts
      - name: Actual State Department RSS native-date original items no funds
        run: bun scripts/ops/diag-us-state-advisory-native.ts
