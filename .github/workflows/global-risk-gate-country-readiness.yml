name: Global Risk Gate Country Readiness

on:
  pull_request:
    paths:
      - "scripts/global-risk-gate-country-census.ts"
      - "scripts/ingest-wgi-political-stability-live.ts"
      - "scripts/record-ucdp-candidate-release-manifest.mjs"
      - "src/lib/risk-gate-v2-request-readiness.ts"
      - "src/lib/risk-gate-v2-geopolitical-security-module-state.server.ts"
      - "src/__tests__/risk-gate-v2-request-readiness.test.ts"
      - "src/__tests__/risk-gate-v2-global-country-readiness-static.test.ts"
      - "supabase/migrations/919_risk_gate_v2_global_source_manifests.sql"
      - ".github/workflows/global-risk-gate-country-readiness.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run readiness regression tests
        run: |
          bun test \
            src/__tests__/risk-gate-v2-request-readiness.test.ts \
            src/__tests__/risk-gate-v2-global-country-readiness-static.test.ts \
            src/__tests__/risk-gate-v2-governed-module-builders.test.ts \
            src/__tests__/risk-gate-v2-conflict-module-state.test.ts \
            src/__tests__/risk-gate-v2-support-readiness.test.ts

  census:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GLOBAL_RISK_GATE_CENSUS_OUTPUT: global-risk-gate-country-census.json
      GLOBAL_RISK_GATE_CENSUS_CONCURRENCY: "3"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate live country readiness proof
        run: bun scripts/global-risk-gate-country-census.ts --require-any-accepted

      - name: Publish summary to job output
        shell: bash
        run: |
          set -euo pipefail
          jq '{generated_at,denominator,summary,claim_boundary}' global-risk-gate-country-census.json

      - name: Upload country readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-risk-gate-country-readiness
          path: global-risk-gate-country-census.json
          if-no-files-found: error
          retention-days: 30
