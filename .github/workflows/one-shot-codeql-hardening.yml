name: One-shot CodeQL credential hardening

on:
  push:
    branches:
      - security/codeql-credential-hardening

permissions:
  contents: write

concurrency:
  group: one-shot-codeql-credential-hardening
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/codeql-credential-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact hardening transforms
        run: node scripts/security/apply-codeql-credential-hardening.mjs
      - name: Remove one-shot patch machinery
        run: |
          git rm scripts/security/apply-codeql-credential-hardening.mjs
          git rm .github/workflows/one-shot-codeql-hardening.yml
      - name: Commit hardened sources
        run: |
          set -euo pipefail
          git config user.name "geomacro-security-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: remove browser secret storage and harden API auth"
          git push origin HEAD:security/codeql-credential-hardening
