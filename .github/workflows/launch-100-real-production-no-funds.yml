name: Audit Exact 100 Live GeoMacro Questions (No Funds)
on:
  pull_request:
    paths:
      - "scripts/tests/data/launch-100-original-questions.zlib.b64"
      - "scripts/ops/audit-100-live-original-questions-no-funds.mjs"
      - ".github/workflows/launch-100-real-production-no-funds.yml"
  push:
    branches: [main]
    paths:
      - "scripts/tests/data/launch-100-original-questions.zlib.b64"
      - "scripts/ops/audit-100-live-original-questions-no-funds.mjs"
      - ".github/workflows/launch-100-real-production-no-funds.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-100-live-no-funds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-exact-questions:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Validate 100 original questions, SHA and distributions offline
        run: |
          node --check scripts/ops/audit-100-live-original-questions-no-funds.mjs
          node scripts/ops/audit-100-live-original-questions-no-funds.mjs --self-test

  live-production-audit:
    needs: verify-exact-questions
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Audit real public production API without wallets or signatures
        env:
          GEOMACRO_LIVE_AUDIT_DELAY_MS: "3800"
        run: node scripts/ops/audit-100-live-original-questions-no-funds.mjs
      - name: Preserve actual 100 HTTP response audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-100-exact-live-production-no-funds
          path: ${{ runner.temp }}/geomacro-100-live-no-funds/
          if-no-files-found: error
          retention-days: 30
