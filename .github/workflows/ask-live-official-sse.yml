name: Ask Live Official SSE Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ask-live-official-sse.yml"
      - "scripts/ops/verify-live-ask-sse.mjs"
      - "server/api/ask/v2/turn.post.ts"
      - "src/lib/ask-official-numeric.server.ts"
      - "src/lib/ask-sse-client.ts"
      - "src/__tests__/ask-live-sse-acceptance.test.ts"
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-ask-live-official-sse
  cancel-in-progress: false

jobs:
  live-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify official numerical question and completed SSE from production
        run: node scripts/ops/verify-live-ask-sse.mjs
