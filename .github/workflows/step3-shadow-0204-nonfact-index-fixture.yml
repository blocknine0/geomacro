name: Step3 Isolated Shadow 0204 Nonfact Index Fixture — Protected
on:
  pull_request:
    paths:
      - ".github/workflows/step3-shadow-0204-nonfact-index-fixture.yml"
      - "scripts/ops/seed-step3-shadow-nonfact-index-fixture.mjs"
      - "scripts/tests/seed-step3-shadow-nonfact-index-fixture.test.mjs"
  workflow_dispatch:
    inputs:
      approval:
        description: "Type SEED_NONFACT_0204_SHADOW_ONLY; never authorizes production SQL or commercial data"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: geomacro-d1-control-plane-production
  cancel-in-progress: false
jobs:
  offline-nonfact-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: node --check scripts/ops/seed-step3-shadow-nonfact-index-fixture.mjs
      - run: node --test scripts/tests/seed-step3-shadow-nonfact-index-fixture.test.mjs
  physical-shadow-nonfact-fixture:
    needs: offline-nonfact-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      inputs.approval == 'SEED_NONFACT_0204_SHADOW_ONLY'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
      GEOMACRO_STEP3_EXACT_SHA: ${{ vars.GEOMACRO_STEP3_REVIEWED_SHA }}
      GEOMACRO_STEP3_SHADOW_REHEARSAL_APPROVED: ${{ vars.GEOMACRO_STEP3_SHADOW_REHEARSAL_APPROVED }}
      GEOMACRO_SHADOW_SCHEMA_BOOTSTRAP_APPROVED: ${{ vars.GEOMACRO_SHADOW_SCHEMA_BOOTSTRAP_APPROVED }}
      GEOMACRO_D1_RECOVERY_AES256_KEY_B64: ${{ secrets.GEOMACRO_D1_RECOVERY_AES256_KEY_B64 }}
      GEOMACRO_D1_RECOVERY_R2_BUCKET: ${{ vars.GEOMACRO_D1_RECOVERY_R2_BUCKET }}
      GEOMACRO_D1_RECOVERY_R2_PRIVATE_APPROVED: ${{ vars.GEOMACRO_D1_RECOVERY_R2_PRIVATE_APPROVED }}
      SIGNING_JWK: ${{ secrets.SIGNING_JWK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: ${{ github.sha }},persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Require exact reviewed main, isolated Shadow UUID and existing canary HOLD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GEOMACRO_STEP3_EXACT_SHA" = "$GITHUB_SHA"
          test "$GEOMACRO_STEP3_SHADOW_REHEARSAL_APPROVED" = "YES"
          test "$GEOMACRO_SHADOW_SCHEMA_BOOTSTRAP_APPROVED" = "YES"
          test "$D1_DATABASE_ID" != "$GEOMACRO_D1_SHADOW_DATABASE_ID"
          test -f config/d1-hotspot-v2-canary.hold
          node --test scripts/tests/seed-step3-shadow-nonfact-index-fixture.test.mjs
      - name: Require independent all-account real Paid monthly headroom before any Shadow write
        run: node scripts/ops/check-d1-paid-monthly-headroom.mjs --check
      - name: Real private R2 AES recovery checkpoint then isolated nonfact Shadow-only rows
        run: node scripts/ops/seed-step3-shadow-nonfact-index-fixture.mjs --apply
      - name: Retain signed fixture-only receipt and exact provider headroom even on HOLD
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-shadow-0204-nonfact-fixture-${{ github.run_id }}
          path: |
            artifacts/release/step3-shadow-index-nonfact-fixture.json
            artifacts/release/d1-paid-monthly-headroom.json
          retention-days: 14
          if-no-files-found: warn
