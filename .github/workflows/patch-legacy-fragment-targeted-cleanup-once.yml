name: Patch legacy fragment targeted cleanup once
on:
  push:
    branches:
      - fix/legacy-fragment-targeted-cleanup-20260930
permissions:
  contents: write
concurrency:
  group: patch-legacy-fragment-targeted-cleanup-once
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/legacy-fragment-targeted-cleanup-20260930
          fetch-depth: 1
      - run: node scripts/ops/patch-legacy-fragment-targeted-cleanup-once.mjs
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/ops/b2-fragment-targeted-cleanup.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ops/b2-fragment-targeted-cleanup.mjs
          git commit -m "Allow verified legacy fragment cleanup"
          git push origin HEAD:fix/legacy-fragment-targeted-cleanup-20260930
