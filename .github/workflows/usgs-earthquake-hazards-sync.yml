name: USGS Earthquake Hazards Governed Sync

on:
  pull_request:
    paths:
      - "scripts/ingest-usgs-earthquake-hazards-live.mjs"
      - "scripts/lib-live-source-utils.mjs"
      - "scripts/commercial-source-policy.mjs"
      - "supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql"
      - ".github/workflows/usgs-earthquake-hazards-sync.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/ingest-usgs-earthquake-hazards-live.mjs"
      - "scripts/lib-live-source-utils.mjs"
      - "scripts/commercial-source-policy.mjs"
      - "supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql"
      - ".github/workflows/usgs-earthquake-hazards-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: usgs-earthquake-hazards-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live USGS dry-run
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ingest-usgs-earthquake-hazards-live.mjs 2>&1 | tee usgs-earthquake-dry-run.log
          grep -q 'PASS: USGS EARTHQUAKE DRY RUN CLEAN; DATABASE UNCHANGED' usgs-earthquake-dry-run.log
          grep -q '"country_mapped_rows": 0' usgs-earthquake-dry-run.log
          grep -q '"risk_gate_signal_activation": false' usgs-earthquake-dry-run.log
          count="$(awk '/"earthquake_observations":/{gsub(/[^0-9]/,"",$0); print $0; exit}' usgs-earthquake-dry-run.log)"
          test -n "$count"
          test "$count" -gt 0

      - name: Guard schema, country mapping and scoring boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'MULTI_DOMAIN'" supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql
          grep -q 'enabled_for_ingestion = true' supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql
          grep -q 'enabled_for_commercial_signals = false' supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql
          grep -q 'countryIso3: null' scripts/ingest-usgs-earthquake-hazards-live.mjs
          grep -q 'NOT_ASSIGNED_COORDINATE_ONLY' scripts/ingest-usgs-earthquake-hazards-live.mjs
          grep -q 'commercial signals must remain disabled' scripts/ingest-usgs-earthquake-hazards-live.mjs
          echo 'PASS: USGS is governed ingestion-only with no synthetic country attribution.'

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usgs-earthquake-hazards-dry-run
          path: usgs-earthquake-dry-run.log
          if-no-files-found: warn
          retention-days: 30

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate authoritative production database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_SUPABASE_PROJECT_REF" || { echo "::error::Wrong production project id"; exit 1; }
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const db = new URL(process.env.SUPABASE_DB_URL);
          const api = new URL(process.env.SUPABASE_URL);
          const direct = db.hostname === `db.${ref}.supabase.co` && db.username === 'postgres';
          const pooler = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          if (!['postgres:', 'postgresql:'].includes(db.protocol) || (!direct && !pooler)) {
            throw new Error('SUPABASE_DB_URL is not the authoritative production database');
          }
          if (!db.password || db.pathname !== '/postgres') throw new Error('Invalid production database URL');
          if (api.hostname !== `${ref}.supabase.co`) throw new Error('SUPABASE_URL is not the authoritative production API');
          console.log('PASS: authoritative production database and API identities confirmed.');
          NODE

      - name: Apply only migration 922 on first canonical push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql
          echo 'PASS: migration 922 applied without broad db push.'

      - name: Verify source and schema state
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select commercial_usage_status || '|' || enabled_for_ingestion::text || '|' || enabled_for_commercial_signals::text from public.live_external_sources where source_id='usgs_earthquake_hazards'")"
          test "$state" = 'COMMERCIAL_OK|true|false' || { echo "::error::Unexpected USGS source state: $state"; exit 1; }
          multi="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select case when pg_get_constraintdef(oid) like '%MULTI_DOMAIN%' then 'true' else 'false' end from pg_constraint where conrelid='public.live_external_observations'::regclass and conname='live_external_observations_category_check'")"
          test "$multi" = 'true' || { echo "::error::MULTI_DOMAIN observation category is not active"; exit 1; }
          echo 'PASS: USGS source is ingestion-enabled, scoring-disabled, and MULTI_DOMAIN schema is active.'

      - name: Dry-run current USGS feed before write
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ingest-usgs-earthquake-hazards-live.mjs 2>&1 | tee usgs-earthquake-dry-run.log
          grep -q 'PASS: USGS EARTHQUAKE DRY RUN CLEAN; DATABASE UNCHANGED' usgs-earthquake-dry-run.log

      - name: Persist governed observations and release manifest
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ingest-usgs-earthquake-hazards-live.mjs --write 2>&1 | tee usgs-earthquake-write.log
          grep -q 'PASS: USGS EARTHQUAKE GOVERNED OBSERVATIONS + RELEASE MANIFEST WRITTEN' usgs-earthquake-write.log

      - name: Verify production observations and fail-closed country boundary
        shell: bash
        run: |
          set -euo pipefail
          verified="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.live_external_observations where source_id='usgs_earthquake_hazards' and event_type='earthquake' and quality_status='VERIFIED' and commercial_eligibility_status='VERIFIED'")"
          test "$verified" -gt 0 || { echo "::error::No governed USGS earthquake observations found"; exit 1; }
          country_assigned="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.live_external_observations where source_id='usgs_earthquake_hazards' and country_iso3 is not null")"
          test "$country_assigned" = '0' || { echo "::error::USGS observations unexpectedly contain country attribution"; exit 1; }
          manifest="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select verified_rows || '|' || unmapped_rows || '|' || write_completed::text from public.live_source_release_manifests where source_id='usgs_earthquake_hazards' order by retrieved_at desc limit 1")"
          manifest_verified="${manifest%%|*}"
          rest="${manifest#*|}"
          unmapped="${rest%%|*}"
          written="${rest##*|}"
          test "$manifest_verified" -gt 0 || { echo "::error::Latest USGS manifest has zero verified rows"; exit 1; }
          test "$unmapped" = "$manifest_verified" || { echo "::error::USGS country boundary must leave every current row unmapped; got $unmapped/$manifest_verified"; exit 1; }
          test "$written" = 'true' || { echo "::error::Latest USGS manifest is not write-complete"; exit 1; }
          printf '{"verified_observations":%s,"country_assigned":0,"manifest_verified_rows":%s,"manifest_unmapped_rows":%s,"write_completed":true,"risk_gate_signal_activation":false}\n' "$verified" "$manifest_verified" "$unmapped" | tee usgs-earthquake-production-evidence.json
          echo 'PASS: governed USGS production evidence verified without synthetic country attribution.'

      - name: Upload governed production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usgs-earthquake-hazards-governed-sync
          path: |
            usgs-earthquake-dry-run.log
            usgs-earthquake-write.log
            usgs-earthquake-production-evidence.json
          if-no-files-found: warn
          retention-days: 30
