name: Dependency Audit Temp

on:
  push:
    branches:
      - fix/dependabot-12-2026-09
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependabot-12-2026-09
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Upgrade patched direct dependencies
        run: |
          bun add -d vite@7.3.6 vitest@4.1.11
          bun add ai@6.0.280 @ai-sdk/openai-compatible@2.0.75 @circle-fin/app-kit@1.14.0
      - name: Apply in-range vulnerability fixes
        run: bun audit fix || true
      - name: Show dependency changes
        run: git diff -- package.json bun.lock package-lock.json
      - name: App tests
        run: bun run test:app
      - name: Production build
        run: bun run build
      - name: Re-audit
        run: bun audit || true
      - name: Commit remediated dependency graph
        run: |
          if git diff --quiet -- package.json bun.lock package-lock.json; then
            echo "No dependency file changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock package-lock.json
          git commit -m "fix(security): remediate dependency vulnerabilities"
          git push origin HEAD:fix/dependabot-12-2026-09
