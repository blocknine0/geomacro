name: Live Structure Runtime Diagnostic

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/diagnose-live-structure-runtime.mjs"
      - ".github/workflows/live-structure-runtime-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify authoritative Supabase target
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: node scripts/db/assert-authoritative-supabase.mjs

      - name: Classify latest private structuring failure without leaking raw diagnostics
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-live-structure-runtime.mjs
