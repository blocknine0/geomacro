name: Global Source Registry Read-only Audit

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/audit-global-source-registry-readonly.mjs"
      - ".github/workflows/global-source-registry-readonly-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-production-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate authoritative production database target
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}"
          test -n "${SUPABASE_DB_URL:-}"
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_SUPABASE_PROJECT_REF"
          node --input-type=module <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const db = new URL(process.env.SUPABASE_DB_URL);
          const directHost = `db.${ref}.supabase.co`;
          const poolerMatch = db.hostname.endsWith(".pooler.supabase.com") && db.username === `postgres.${ref}`;
          const directMatch = db.hostname === directHost && db.username === "postgres";
          if (!["postgres:", "postgresql:"].includes(db.protocol) || (!directMatch && !poolerMatch)) {
            throw new Error("SUPABASE_DB_URL is not the authoritative production database");
          }
          if (!db.password || db.pathname !== "/postgres") throw new Error("Invalid production database URL");
          console.log("PASS: authoritative production database identity confirmed.");
          NODE
      - name: Run complete read-only source registry audit
        run: node scripts/audit-global-source-registry-readonly.mjs
      - name: Upload registry audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-source-registry-audit-${{ github.sha }}
          path: artifacts/global-source-registry-audit/
          if-no-files-found: error
          retention-days: 30
