name: Prepare optimized Worker candidate (zero traffic)
on:
  pull_request:
    paths:
      - '.github/workflows/geomacro-optimized-worker-candidate.yml'
      - 'scripts/ops/prepare-optimized-worker-candidate.mjs'
      - 'scripts/tests/optimized-worker-candidate.test.mjs'
      - 'workers/control-plane/src/**'
      - 'src/workers/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/geomacro-optimized-worker-candidate.yml'
      - 'scripts/ops/prepare-optimized-worker-candidate.mjs'
      - 'workers/control-plane/src/**'
      - 'src/workers/**'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test scripts/tests/optimized-worker-candidate.test.mjs scripts/tests/p1-source-fanout.test.mjs
  candidate:
    needs: contract
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: geomacro-d1-control-plane-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Upload exact-main version with inherited production bindings and zero traffic
        run: node scripts/ops/prepare-optimized-worker-candidate.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: geomacro-optimized-worker-candidate
          path: |
            artifacts/protected-canary/optimized-worker-candidate.json
            artifacts/protected-canary/worker-promotion-preflight.json
          if-no-files-found: warn
          retention-days: 14
