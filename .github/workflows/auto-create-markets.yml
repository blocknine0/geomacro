name: Create Markets (Technical Proof)
# Prediction markets are a secondary Arc Testnet technical-proof surface.
# Do not continuously create new markets from the flagship intelligence feed.
# Manual dispatch remains available for deliberate demos and controlled tests.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # All workflows using OWNER_PRIVATE_KEY share this group. Queue rather than
  # cancel so a manual operation cannot interrupt another transaction.
  group: arc-owner-wallet-state-change
  cancel-in-progress: false

jobs:
  create-markets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Verify Arc Testnet and contract before exposing owner credentials
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: node scripts/ops/verify-arc-testnet-target.mjs
      - name: Verify authoritative Supabase target before privileged writes
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: node scripts/db/assert-authoritative-supabase.mjs
      - name: Run market creation script
        env:
          OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OLD_CONTRACT_ADDRESS: ${{ secrets.OLD_CONTRACT_ADDRESS }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_2: ${{ secrets.ARC_RPC_URL_2 }}
          ARC_RPC_URL_3: ${{ secrets.ARC_RPC_URL_3 }}
          ARC_RPC_URL_4: ${{ secrets.ARC_RPC_URL_4 }}
          ARC_RPC_URL_5: ${{ secrets.ARC_RPC_URL_5 }}
          RUN_TIME_BUDGET_MS: "360000"
        run: node scripts/create-markets.js
