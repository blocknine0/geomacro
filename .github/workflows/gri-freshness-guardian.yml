name: GRI Freshness Guardian

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gri-production-publisher
  cancel-in-progress: false

jobs:
  guard-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GRI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install GRI runtime dependencies
        run: npm install --no-save --ignore-scripts @supabase/supabase-js dotenv

      - name: Check verified GRI freshness
        id: freshness
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) {
            console.error('Missing authoritative Supabase runtime configuration');
            process.exit(1);
          }

          const db = createClient(url, key, {
            auth: { persistSession: false, autoRefreshToken: false },
          });

          const { data, error } = await db
            .from('gri_snapshots')
            .select('id,as_of,methodology_version,proof_version,verification_status,status')
            .eq('status', 'published')
            .eq('verification_status', 'verified')
            .order('as_of', { ascending: false })
            .limit(1)
            .maybeSingle();

          if (error) {
            console.error(`Freshness check failed: ${error.message}`);
            process.exit(1);
          }

          let shouldPublish = true;
          let ageMinutes = Number.POSITIVE_INFINITY;

          if (data?.as_of) {
            const asOfMs = Date.parse(data.as_of);
            if (Number.isFinite(asOfMs)) {
              ageMinutes = (Date.now() - asOfMs) / 60000;
              shouldPublish = ageMinutes >= 90;
            }
          }

          const output = process.env.GITHUB_OUTPUT;
          if (!output) throw new Error('GITHUB_OUTPUT is unavailable');

          const fs = await import('node:fs');
          fs.appendFileSync(output, `should_publish=${shouldPublish ? 'true' : 'false'}\n`);
          fs.appendFileSync(output, `age_minutes=${Number.isFinite(ageMinutes) ? ageMinutes.toFixed(1) : 'unknown'}\n`);

          console.log(JSON.stringify({
            latest_verified_snapshot_id: data?.id ?? null,
            latest_verified_as_of: data?.as_of ?? null,
            age_minutes: Number.isFinite(ageMinutes) ? Number(ageMinutes.toFixed(1)) : null,
            threshold_minutes: 90,
            should_publish: shouldPublish,
          }, null, 2));
          NODE

      - name: Correlate canonical GRI events into immutable stories
        if: steps.freshness.outputs.should_publish == 'true'
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
        run: node scripts/cluster-gri-stories-v12.js

      - name: Compute, reconcile and publish immutable GRI v1.2 snapshot
        if: steps.freshness.outputs.should_publish == 'true'
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/compute-gri-v12.js

      - name: Independently verify the latest published proof package
        if: steps.freshness.outputs.should_publish == 'true'
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-gri-snapshot-v12.js

      - name: Emit freshness status
        run: |
          echo "GRI verified snapshot age before guard: ${{ steps.freshness.outputs.age_minutes }} minutes"
          echo "Guardian publish required: ${{ steps.freshness.outputs.should_publish }}"
