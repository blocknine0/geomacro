name: Early Warning Governance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/early-warning-*.ts"
      - "src/lib/early-warning-proof-metrics.ts"
      - "src/lib/early-warning-proof-metrics.test.ts"
      - "src/lib/early-warning-source-eligibility.server.ts"
      - "src/lib/early-warning-source-eligibility.server.test.ts"
      - "src/lib/early-warning-event-family.ts"
      - "src/lib/early-warning-event-family.test.ts"
      - "src/lib/early-warning-governed-service.server.ts"
      - "src/lib/early-warning-governed-service.server.test.ts"
      - "config/early-warning-watchers.json"
      - "scripts/early-warning/**"
      - "docs/EARLY_WARNING_ENGINE.md"
      - "docs/EARLY_WARNING_PROOF_METRICS.md"
      - "docs/EARLY_WARNING_SOURCE_GOVERNANCE.md"
      - "docs/source-reviews/**"
      - "supabase/migrations/937_early_warning_alert_ledger.sql"
      - ".github/workflows/early-warning-governance.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/early-warning-*.ts"
      - "src/lib/early-warning-proof-metrics.ts"
      - "src/lib/early-warning-source-eligibility.server.ts"
      - "src/lib/early-warning-event-family.ts"
      - "src/lib/early-warning-governed-service.server.ts"
      - "config/early-warning-watchers.json"
      - "scripts/early-warning/**"
      - "docs/EARLY_WARNING_ENGINE.md"
      - "docs/EARLY_WARNING_PROOF_METRICS.md"
      - "docs/EARLY_WARNING_SOURCE_GOVERNANCE.md"
      - "docs/source-reviews/**"
      - "supabase/migrations/937_early_warning_alert_ledger.sql"
      - ".github/workflows/early-warning-governance.yml"

permissions:
  contents: read

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.scope.outputs.core }}
      proof: ${{ steps.scope.outputs.proof }}
      source: ${{ steps.scope.outputs.source }}
    steps:
      - name: Checkout commit range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect affected governance domains
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          core=false
          proof=false
          source=false

          if [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "${HEAD_SHA}^" "${HEAD_SHA}")"
          else
            changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            case "${file}" in
              src/lib/early-warning-proof-metrics.ts|src/lib/early-warning-proof-metrics.test.ts|docs/EARLY_WARNING_PROOF_METRICS.md)
                proof=true ;;
              src/lib/early-warning-source-eligibility.server.ts|src/lib/early-warning-source-eligibility.server.test.ts|src/lib/early-warning-event-family.ts|src/lib/early-warning-event-family.test.ts|src/lib/early-warning-governed-service.server.ts|src/lib/early-warning-governed-service.server.test.ts|config/early-warning-watchers.json|scripts/early-warning/*|docs/EARLY_WARNING_SOURCE_GOVERNANCE.md|docs/source-reviews/*)
                source=true ;;
              src/lib/early-warning-*.ts|docs/EARLY_WARNING_ENGINE.md|supabase/migrations/937_early_warning_alert_ledger.sql)
                core=true ;;
              .github/workflows/early-warning-governance.yml)
                core=true
                proof=true
                source=true ;;
            esac
          done <<< "${changed}"

          {
            echo "core=${core}"
            echo "proof=${proof}"
            echo "source=${source}"
          } >> "$GITHUB_OUTPUT"

  core:
    needs: detect-scope
    if: needs.detect-scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test deterministic CEWS and canonical alert builder
        run: bunx vitest run src/lib/early-warning-contract.test.ts src/lib/early-warning-service.server.test.ts
      - name: Verify ledger safety invariants
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/937_early_warning_alert_ledger.sql"
          grep -q "methodology_calibrated boolean not null default false" "$file"
          grep -q "published early warning core fields are immutable" "$file"
          grep -q "early_warning_distribution_unique_channel" "$file"
          grep -q "enable row level security" "$file"
          grep -q "revoke all on table public.early_warning_alerts from PUBLIC, anon, authenticated" "$file"
          echo "PASS: Early Warning ledger is provisional, immutable-after-publication, idempotent and service-role only."

  proof:
    needs: detect-scope
    if: needs.detect-scope.outputs.proof == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test proof metrics and publication gate
        run: bunx vitest run src/lib/early-warning-proof-metrics.test.ts
      - name: Verify statistical claim boundaries
        shell: bash
        run: |
          set -euo pipefail
          file=src/lib/early-warning-proof-metrics.ts
          grep -q 'RESOLVED_ALERTS_ONLY_NOT_RECALL' "$file"
          grep -q 'methodology_not_calibrated' "$file"
          grep -q 'material_event_universe_not_complete' "$file"
          grep -q 'control_period_sampling_not_documented' "$file"
          grep -q 'no_alert_samples_missing' "$file"
          grep -q 'control_period_universe_not_demonstrated' "$file"
          grep -q 'minimum_resolved_samples ?? 100' "$file"
          grep -q 'minimum_material_events ?? 30' "$file"
          grep -q 'minimum_countries ?? 5' "$file"
          echo 'PASS: proof metrics cannot manufacture recall from alerts-only data or publish an uncalibrated or undocumented evaluation claim.'

  source:
    needs: detect-scope
    if: needs.detect-scope.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run source policy and event-family tests
        run: bunx vitest run src/lib/early-warning-source-eligibility.server.test.ts src/lib/early-warning-event-family.test.ts src/lib/early-warning-governed-service.server.test.ts scripts/early-warning/ecb-rss-core.test.mjs
      - name: Verify watcher registry remains prelaunch and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/early-warning-watchers.json', 'utf8'));
          if (config.mode !== 'prelaunch') throw new Error('watcher registry must remain prelaunch');
          if (config.live_watcher_activation !== false) throw new Error('live watcher activation must remain false');
          const allowedAdapterStates = new Set(['NOT_IMPLEMENTED', 'DRY_RUN_IMPLEMENTED']);
          for (const [id, candidate] of Object.entries(config.official_source_candidates || {})) {
            if (candidate.enabled !== false) throw new Error(`${id} candidate must remain disabled`);
            if (candidate.rights_status !== 'REVIEW_REQUIRED') throw new Error(`${id} candidate must remain review-required`);
            if (!allowedAdapterStates.has(candidate.adapter_status)) throw new Error(`${id} has unsupported prelaunch adapter status`);
            if (candidate.adapter_status === 'DRY_RUN_IMPLEMENTED') {
              if (candidate.database_write !== false) throw new Error(`${id} dry-run adapter must not write database`);
              if (candidate.commercial_signal_activation !== false) throw new Error(`${id} dry-run adapter must not activate commercial signals`);
            }
          }
          for (const [id, source] of Object.entries(config.governed_existing_sources || {})) {
            if (source.runtime_commercial_signal_activation !== false) throw new Error(`${id} must not be promoted by config`);
          }
          console.log('PASS: watcher registry is prelaunch, disabled and review-gated.');
          NODE
      - name: Verify existing governed source migrations still keep commercial signals disabled
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enabled_for_commercial_signals = false' supabase/migrations/923_enable_gdelt_v2_event_ingestion.sql
          grep -q 'enabled_for_commercial_signals = false' supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql
          echo 'PASS: GDELT and USGS remain governed ingestion-only.'
      - name: Verify governed persistence cannot bypass source gate
        shell: bash
        run: |
          set -euo pipefail
          file=src/lib/early-warning-governed-service.server.ts
          grep -q 'assertEarlyWarningDerivedSourcesEligible' "$file"
          grep -q 'if (!sourceGate.eligible)' "$file"
          grep -q 'persistEarlyWarningAlert' "$file"
          grep -q 'public Early Warning requires a classified canonical event family' "$file"
          echo 'PASS: governed persistence gates sources and public event classification before ledger write.'
