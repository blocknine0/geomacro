name: Public D1 Hot Serving Root Cause

# Isolated read-only production health diagnosis. Public GET plus one narrow
# authenticated D1 metadata SELECT (no payload_json, hashes, raw sources).
# This workflow does not mutate B2, Supabase, D1, x402, or website deployment.
on:
  workflow_dispatch: {}
  # A SHA-parity failure in the normal website health job must not prevent
  # independent public-current D1 metadata diagnosis. Read-only, no B2 GET.
  workflow_run:
    workflows: ["Production Website Health"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-hot-serving-diagnostic.yml"
      - "scripts/ops/diagnose-public-hot-serving.mjs"
      - "scripts/ops/classify-d1-hot-metadata.mjs"
      - "src/__tests__/diagnose-public-hot-serving.test.ts"
      - "src/__tests__/classify-d1-hot-metadata.test.ts"
      - "scripts/ops/reconcile-public-hot-recovery.mjs"
      - "scripts/ops/reconcile-public-hot-recovery.test.mjs"
      # Re-audit public B2/D1 metadata when no-charge diagnostics change;
      # no direct B2 GET, no D1 write, no tokens or private source payload.
      - "scripts/ops/verify-failed-health-x402-no-funds.mjs"
      - "src/__tests__/failed-health-x402-no-funds.test.ts"

permissions:
  contents: read

concurrency:
  # Separate push and workflow_run lanes: an ineligible/skipped website
  # completion must not cancel a useful current-main push diagnostic.
  # At most one active read-only metadata diagnostic per trigger class.
  group: geomacro-public-hot-serving-diagnostic-${{ github.event_name }}
  cancel-in-progress: true

# A failed same-repo main health may finish after main advances. This
# read-only diagnostic must then inspect the current main rather than skip.
jobs:
  diagnose:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'failure' &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          ) &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
          github.event.workflow_run.head_sha != ''
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '22'

      - name: Verify read-only diagnostic script syntax
        run: |
          node --check scripts/ops/diagnose-public-hot-serving.mjs
          node --check scripts/ops/classify-d1-hot-metadata.mjs
          node --check scripts/ops/reconcile-public-hot-recovery.mjs
          node --test scripts/ops/reconcile-public-hot-recovery.test.mjs

      - name: Diagnose public site and all 3 D1 hot-snapshot products
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          # Nonzero means production NOT ready, not "CI flaky". No raw JSON
          # payload, API token, paid request or direct B2 GET is printed.
          node scripts/ops/diagnose-public-hot-serving.mjs

      - name: Check three D1 publisher timestamps and expiry windows (metadata-only)
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::D1_READ_TOKEN_REQUIRED"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::D1_READ_ACCOUNT_REQUIRED"; exit 2; }
          # ONE remote SELECT; do not fetch payload_json or complete hashes.
          # Never print Wrangler raw response / Cloudflare stderr in logs.
          sql="SELECT product, schema_name, generated_at, source_as_of, expires_at, b2_object_key, proof_schema, source_run_id, length(b2_sha256) AS b2_hash_length, length(payload_sha256) AS payload_hash_length, length(CAST(payload_json AS BLOB)) AS payload_bytes FROM public_b2_hot_snapshot WHERE product IN ('intelligence','global-risk','risk-indices') LIMIT 3;"
          raw="$(mktemp)"
          err="$(mktemp)"
          trap 'rm -f "$raw" "$err"' EXIT
          if ! npx -y "wrangler@4.136.3" d1 execute geomacro-control-plane \
            --remote --json --command "$sql" >"$raw" 2>"$err"; then
            echo "::error::D1_READONLY_METADATA_SELECT_FAILED"
            exit 2
          fi
          node scripts/ops/classify-d1-hot-metadata.mjs < "$raw"

      - name: Classify missing approved current publisher inputs (read-only, no SHA exposure)
        if: always()
        shell: bash
        env:
          # Existing backstop pointer hints only. Never expose values in output.
          GRI_READY_REVIEWED_SHA256: ${{ vars.GRI_READY_REVIEWED_SHA256 }}
          GRI_READY_CERTIFICATES_SHA256: ${{ vars.GRI_READY_CERTIFICATES_SHA256 }}
          GRI_READY_APPROVED_AT: ${{ vars.GRI_READY_APPROVED_AT }}
          MACHINE_INTELLIGENCE_READY_INPUT_SHA256: ${{ vars.MACHINE_INTELLIGENCE_READY_INPUT_SHA256 }}
          MACHINE_INTELLIGENCE_READY_APPROVED_AT: ${{ vars.MACHINE_INTELLIGENCE_READY_APPROVED_AT }}
        run: |
          set -euo pipefail
          # Uses only already-scrubbed public and D1 reports. Missing D1 report
          # remains UNKNOWN, never silently deemed fresh. No network or writes.
          node scripts/ops/reconcile-public-hot-recovery.mjs

      - name: Upload scrubbed production status regardless of health
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: public-serving-diagnostic-${{ github.run_id }}
          path: |
            artifacts/public-serving/diagnostic.json
            artifacts/public-serving/d1-metadata.json
            artifacts/public-serving/recovery.json
          if-no-files-found: warn
          retention-days: 7
