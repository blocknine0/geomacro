name: Temporary MARAD CodeQL diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/marad-codeql-diagnostic-temporary.yml"
permissions:
  contents: read
  checks: read
jobs:
  annotations:
    if: github.repository == 'blocknine0/geomacro' && github.event.pull_request.number == 2515
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Read existing CodeQL check annotations without secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url="https://api.github.com/repos/blocknine0/geomacro/check-runs/118470729571/annotations?per_page=10";
          const response=await fetch(url,{
            headers:{Authorization:"Bearer "+process.env.GITHUB_TOKEN,
              Accept:"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"}
          });
          if(!response.ok){
            console.log(JSON.stringify({codeql_annotation_access:"NOT_AVAILABLE",status:response.status}));
            process.exit(0);
          }
          const rows=await response.json();
          console.log(JSON.stringify({codeql_annotations:(Array.isArray(rows)?rows:[]).map(x=>({
            path:x.path,start_line:x.start_line,end_line:x.end_line,
            title:String(x.title??"").slice(0,150),
            message:String(x.message??"").slice(0,600)
          }))}));
          NODE
