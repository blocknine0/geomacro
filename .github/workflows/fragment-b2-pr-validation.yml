name: Fragment B2 PR Validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: |
          node --check scripts/ops/b2-fragment-archive-offload.mjs
          node --check scripts/ops/b2-fragment-restore.mjs
          node --check scripts/ops/b2-fragment-select-archived.mjs
          bash -n scripts/ops/b2-fragment-archive-canary.sh
          grep -q 'B2_FRAGMENT_DELETE_SOURCE: "0"' .github/workflows/fragment-b2-archive-canary.yml
