name: Partner Commercial Readiness

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "public/.well-known/geomacro-partner-verification.json"
      - "docs/PARTNER_VERIFICATION_AND_COMMERCIAL_INTEGRATION.md"
      - "scripts/check-partner-commercial-readiness.mjs"
      - "scripts/invinoveritas-risk-object-preflight.ts"
      - "scripts/partner-assurance-adapter.ts"
      - "scripts/ops/final-launch-gate-core.mjs"
      - "scripts/ops/simulate-final-launch-failures.mjs"
      - "config/partner-assurance.v1.json"
      - "test-vectors/federico-strict-positive-control-v1.json"
      - ".github/workflows/federico-strict-positive-control.yml"
      - ".github/workflows/partner-commercial-readiness.yml"
      - "src/__tests__/partner-commercial-readiness-static.test.ts"
      - "src/__tests__/day6-day7-final-assurance-static.test.ts"
  push:
    branches: [main]
    paths:
      - "public/.well-known/geomacro-partner-verification.json"
      - "docs/PARTNER_VERIFICATION_AND_COMMERCIAL_INTEGRATION.md"
      - "scripts/check-partner-commercial-readiness.mjs"
      - "scripts/invinoveritas-risk-object-preflight.ts"
      - "scripts/partner-assurance-adapter.ts"
      - "scripts/ops/final-launch-gate-core.mjs"
      - "scripts/ops/simulate-final-launch-failures.mjs"
      - "config/partner-assurance.v1.json"
      - "test-vectors/federico-strict-positive-control-v1.json"
      - ".github/workflows/federico-strict-positive-control.yml"
      - ".github/workflows/partner-commercial-readiness.yml"
      - "src/__tests__/partner-commercial-readiness-static.test.ts"
      - "src/__tests__/day6-day7-final-assurance-static.test.ts"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify partner commercial contract
        run: node scripts/check-partner-commercial-readiness.mjs

      - name: Run partner static tests
        run: |
          bunx vitest run src/__tests__/partner-commercial-readiness-static.test.ts
          bunx vitest run src/__tests__/day6-day7-final-assurance-static.test.ts

      - name: Simulate final launch failure classes
        run: node scripts/ops/simulate-final-launch-failures.mjs

      - name: Verify Federico strict positive control
        run: bun scripts/check-federico-positive-control.ts
