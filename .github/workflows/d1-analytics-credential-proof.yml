name: GeoMacro Protected D1 Analytics Credential Proof (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-analytics-credential-proof.yml'
      - 'scripts/release-common.ts'
      - 'scripts/verify-d1-quota-proof.ts'
      - 'scripts/tests/verify-d1-existing-credentials.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geomacro-readonly-d1-analytics-credential-proof
  cancel-in-progress: false
jobs:
  account-wide-d1-proof:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SIGNING_JWK: ${{ secrets.SIGNING_JWK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Enforce exact reviewed main and unmodified canary HOLD
        shell: bash
        run: |
          set -euo pipefail
          test -f config/d1-hotspot-v2-canary.hold
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/blocknine0/geomacro.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Probe only real closed UTC-day account-wide D1 analytics
        shell: bash
        run: |
          set -euo pipefail
          # Up to two HTTP GraphQL analytics queries, no D1 SQL requests or
          # writes, no Workers deploy, no B2/R2 requests and no funds.
          # A second existing token is tried ONLY on genuine access denial;
          # no partial data, cached counts, or unauthorized fallback pass.
          node --experimental-strip-types scripts/verify-d1-quota-proof.ts
      - name: Retain real provider-signed PASS or over-budget HOLD receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-closed-utc-d1-analytics-credential-proof
          path: artifacts/release/d1-quota-proof-*.json
          retention-days: 14
          if-no-files-found: warn
