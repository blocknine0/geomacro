name: Derived Risk Gate Discovery 20m

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ops/ingest-derived-risk-gate-discovery.mjs"
      - "scripts/tests/derived-risk-gate-runner-isolation.test.mjs"
      - ".github/workflows/derived-risk-gate-discovery-20m.yml"
  pull_request:
    paths:
      - "scripts/ops/ingest-derived-risk-gate-discovery.mjs"
      - "scripts/tests/derived-risk-gate-runner-isolation.test.mjs"
      - ".github/workflows/derived-risk-gate-discovery-20m.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('geomacro-derived-risk-gate-contract-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('geomacro-derived-risk-gate-contract-push-{0}', github.sha) || 'geomacro-derived-risk-gate-scheduled-consumer' }}
  cancel-in-progress: false

jobs:
  failure-isolation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: node --test scripts/tests/derived-risk-gate-runner-isolation.test.mjs
  protected-five-lane-intake:
    # PR/push verification cannot starve the protected 20m source cursor.
    concurrency:
      group: geomacro-derived-risk-gate-single-production-consumer
      cancel-in-progress: false
    needs: failure-isolation-regression
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: production
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Test rights and ingestion bridge before processing
        run: |
          node --test scripts/tests/derived-risk-gate-runner-isolation.test.mjs \
            scripts/lib/derived-risk-gate-review-loop.test.mjs \
            scripts/lib/facts-only-gri-v12-dual-attestation.test.mjs \
            scripts/tests/derived-risk-gate-discovery-bridge.test.mjs \
            scripts/tests/derived-risk-gate-website-raw.test.mjs
      - name: Read existing D1 lanes, hold noncommercial signals, readback-ack
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_DERIVED_DISCOVERY_SUMMARY_PATH: artifacts/derived-risk-gate-discovery/latest.json
        run: node scripts/ops/ingest-derived-risk-gate-discovery.mjs
      - name: Upload aggregate metadata receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: derived-risk-gate-discovery-counts
          path: artifacts/derived-risk-gate-discovery/latest.json
          if-no-files-found: warn
          retention-days: 7
