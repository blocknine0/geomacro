name: Derived Risk Gate Discovery 20m

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ops/ingest-derived-risk-gate-discovery.mjs"
      - "scripts/tests/derived-risk-gate-runner-isolation.test.mjs"
      - "scripts/tests/derived-discovery-queue.test.mjs"
      - "scripts/tests/derived-discovery-transient-retry.test.mjs"
      - "scripts/lib/derived-discovery-transient-retry.mjs"
      - "scripts/lib/derived-discovery-cloudflare-direct.mjs"
      - "scripts/tests/derived-discovery-cloudflare-direct.test.mjs"
      - "scripts/tests/derived-discovery-collector-integration.test.mjs"
      - "workers/control-plane/src/derived-discovery-queue.mjs"
      - "workers/control-plane/src/derived-risk-gate-website-raw.mjs"
      - ".github/workflows/derived-risk-gate-discovery-20m.yml"
  pull_request:
    paths:
      - "scripts/ops/ingest-derived-risk-gate-discovery.mjs"
      - "scripts/tests/derived-risk-gate-runner-isolation.test.mjs"
      - "scripts/tests/derived-discovery-queue.test.mjs"
      - "scripts/tests/derived-discovery-transient-retry.test.mjs"
      - "scripts/lib/derived-discovery-transient-retry.mjs"
      - "scripts/lib/derived-discovery-cloudflare-direct.mjs"
      - "scripts/tests/derived-discovery-cloudflare-direct.test.mjs"
      - "scripts/tests/derived-discovery-collector-integration.test.mjs"
      - "workers/control-plane/src/derived-discovery-queue.mjs"
      - "workers/control-plane/src/derived-risk-gate-website-raw.mjs"
      - ".github/workflows/derived-risk-gate-discovery-20m.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-derived-risk-gate-discovery-single-consumer
  cancel-in-progress: false

jobs:
  failure-isolation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: |
          node --check scripts/ops/ingest-derived-risk-gate-discovery.mjs
          node --check scripts/lib/derived-discovery-transient-retry.mjs
          node --check scripts/lib/derived-discovery-cloudflare-direct.mjs
          node --check workers/control-plane/src/derived-discovery-queue.mjs
          node --check workers/control-plane/src/derived-risk-gate-discovery-bridge.mjs
          node --test scripts/tests/derived-risk-gate-runner-isolation.test.mjs \
            scripts/tests/derived-discovery-transient-retry.test.mjs \
            scripts/tests/derived-discovery-cloudflare-direct.test.mjs \
            scripts/tests/derived-discovery-queue.test.mjs \
            scripts/tests/derived-discovery-collector-integration.test.mjs
  protected-five-lane-intake:
    needs: failure-isolation-regression
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: production
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Test rights and ingestion bridge before processing
        run: |
          node --test scripts/tests/derived-risk-gate-runner-isolation.test.mjs \
            scripts/lib/derived-risk-gate-review-loop.test.mjs \
            scripts/lib/facts-only-gri-v12-dual-attestation.test.mjs \
            scripts/tests/derived-risk-gate-discovery-bridge.test.mjs \
            scripts/tests/derived-risk-gate-website-raw.test.mjs \
            scripts/tests/derived-discovery-transient-retry.test.mjs \
            scripts/tests/derived-discovery-cloudflare-direct.test.mjs \
            scripts/tests/derived-discovery-queue.test.mjs \
            scripts/tests/derived-discovery-collector-integration.test.mjs
      - name: Read existing D1 lanes, hold noncommercial signals, readback-ack
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
          GEOMACRO_DERIVED_DISCOVERY_QUEUE_ID: ${{ vars.GEOMACRO_DERIVED_DISCOVERY_QUEUE_ID }}
          # Only when the genuine Worker POST returns 503: Queue REST +
          # exact remote D1 receipt are protected, never unverified ACK.
          GEOMACRO_DERIVED_DISCOVERY_REST_FALLBACK: "1"
          GEOMACRO_DERIVED_DISCOVERY_SUMMARY_PATH: artifacts/derived-risk-gate-discovery/latest.json
        run: node scripts/ops/ingest-derived-risk-gate-discovery.mjs
      - name: Upload aggregate metadata receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: derived-risk-gate-discovery-counts
          path: artifacts/derived-risk-gate-discovery/latest.json
          if-no-files-found: warn
          retention-days: 7
