name: One-time country GRO self-heal canary

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/lib/agent-query-external-modules.server.ts"
      - "scripts/ops/country-gro-self-heal-canary.ts"
      - ".github/workflows/one-time-country-gro-self-heal-canary.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-country-gro-self-heal-canary
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
      GRO_SELF_HEAL_CANARY_COUNTRY: IND

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require authoritative free-tier write headroom
        run: node scripts/ops/supabase-free-tier-budget.mjs --require-bulk-write

      - name: Derive current public verification key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RISK_OBJECT_SIGNING_KEY_ID:-}"
          test -n "${RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64:-}"
          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require('node:crypto');
          const fs = require('node:fs');
          const privateKey = createPrivateKey({
            key: Buffer.from(process.env.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64.trim(), 'base64'),
            format: 'der',
            type: 'pkcs8',
          });
          if (privateKey.asymmetricKeyType !== 'ed25519') throw new Error('Risk Object signing key must be Ed25519');
          const publicB64 = Buffer.from(
            createPublicKey(privateKey).export({ format: 'der', type: 'spki' }),
          ).toString('base64');
          fs.appendFileSync(process.env.GITHUB_ENV, `RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64=${publicB64}\n`);
          NODE

      - name: Regenerate one current canonical country GRO and prove cache reuse
        run: bun scripts/ops/country-gro-self-heal-canary.ts | tee country-gro-self-heal-canary.json

      - name: Verify canary proof
        run: |
          jq -e '.ok == true and .country_iso3 == "IND" and .verification_status == "VERIFIED" and .commercial_eligibility_status == "VERIFIED" and .second_read_same_object == true and .payment_performed == false and .execution_authorized == false' country-gro-self-heal-canary.json >/dev/null

      - name: Upload canary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: country-gro-self-heal-canary-${{ github.run_id }}
          path: country-gro-self-heal-canary.json
          if-no-files-found: error
          retention-days: 30
