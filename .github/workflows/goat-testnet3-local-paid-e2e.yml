name: GOAT Testnet3 Local Paid E2E Proof

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly GOAT_TESTNET3_USDC to authorize one Testnet3 test payment'
        required: true
        type: string
      client_request_id:
        description: 'Optional deterministic client request ID'
        required: false
        default: 'geomacro-goat-local-e2e-20260911-01'
        type: string

permissions:
  contents: read

concurrency:
  group: goat-testnet3-local-paid-e2e
  cancel-in-progress: false

jobs:
  local-paid-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: goat-testnet3-paid-proof
    env:
      GOATX402_ENVIRONMENT: testnet3
      GOATX402_API_URL: https://flow-api.testnet3.goat.network
      GOATX402_API_KEY: ${{ secrets.GOATX402_API_KEY }}
      GOATX402_API_SECRET: ${{ secrets.GOATX402_API_SECRET }}
      GOATX402_MERCHANT_ID: ${{ secrets.GOATX402_MERCHANT_ID }}
      GOATX402_PILOT_ACCESS_TOKEN: ${{ secrets.GEOMACRO_GOAT_PILOT_ACCESS_TOKEN }}
      GOATX402_PILOT_TOKEN_SYMBOL: USDC
      GOATX402_PILOT_AMOUNT_ATOMIC: '100000'
      GOATX402_MAINNET_COMMERCIAL_ENABLED: 'false'
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      GEOMACRO_GOAT_PILOT_BASE_URL: http://127.0.0.1:4173
      GEOMACRO_GOAT_PILOT_EXPECTED_HOST: 127.0.0.1
      GEOMACRO_GOAT_PILOT_ACCESS_TOKEN: ${{ secrets.GEOMACRO_GOAT_PILOT_ACCESS_TOKEN }}
      GEOMACRO_GOAT_TEST_PAYER_PRIVATE_KEY: ${{ secrets.GEOMACRO_GOAT_TEST_PAYER_PRIVATE_KEY }}
      GEOMACRO_GOAT_TEST_PAYER_ADDRESS: ${{ secrets.GEOMACRO_GOAT_TEST_PAYER_ADDRESS }}
      GEOMACRO_GOAT_TESTNET_E2E_ACK: ${{ inputs.confirmation }}
      GEOMACRO_GOAT_CLIENT_REQUEST_ID: ${{ inputs.client_request_id }}
      GEOMACRO_GOAT_E2E_ARTIFACT_DIR: artifacts/goat-testnet3-local-paid

    steps:
      - name: Validate explicit Testnet payment acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GEOMACRO_GOAT_TESTNET_E2E_ACK" != "GOAT_TESTNET3_USDC" ]; then
            echo "::error::Paid Testnet3 proof requires exact acknowledgement GOAT_TESTNET3_USDC."
            exit 1
          fi
          echo "Explicit Testnet3 payment acknowledgement accepted." >> "$GITHUB_STEP_SUMMARY"
          echo "This run is testnet proof only and cannot be counted as commercial revenue." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout main
        uses: actions/checkout@v7

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            GOATX402_API_KEY \
            GOATX402_API_SECRET \
            GOATX402_MERCHANT_ID \
            GOATX402_PILOT_ACCESS_TOKEN \
            APP_SUPABASE_URL \
            APP_SUPABASE_SERVICE_ROLE_KEY \
            RISK_OBJECT_SIGNING_KEY_ID \
            RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 \
            GEOMACRO_GOAT_TEST_PAYER_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done
          if [ "$RISK_OBJECT_SIGNING_KEY_ID" != "geomacro-risk-2026-02" ]; then
            echo "::error::Unexpected Risk Object signing generation"
            exit 1
          fi

      - name: Derive matching Risk Object public key
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require('node:crypto');
          const fs = require('node:fs');
          const privateKey = createPrivateKey({
            key: Buffer.from(process.env.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64.trim(), 'base64'),
            format: 'der',
            type: 'pkcs8',
          });
          if (privateKey.asymmetricKeyType !== 'ed25519') throw new Error('Risk Object signing key must be Ed25519');
          const publicB64 = Buffer.from(
            createPublicKey(privateKey).export({ format: 'der', type: 'spki' }),
          ).toString('base64');
          fs.appendFileSync(process.env.GITHUB_ENV, `RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64=${publicB64}\n`);
          NODE

      - name: Refresh signed USA and CHN corridor intelligence
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/test-corridor-risk-gate-preflight.ts USA CHN > /tmp/corridor-refresh.log
          grep -q 'signature_valid' /tmp/corridor-refresh.log

      - name: Start isolated local Geomacro server
        shell: bash
        run: |
          set -euo pipefail
          bun run dev --host 127.0.0.1 --port 4173 > /tmp/geomacro-local.log 2>&1 &
          echo $! > /tmp/geomacro-local.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 /tmp/geomacro-local.log || true
            echo "::error::Local Geomacro server did not become ready"
            exit 1
          fi

      - name: Execute one paid GOAT Testnet3 E2E against local current source
        run: node scripts/goat/testnet3-e2e.mjs

      - name: Upload sanitized paid-proof evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goat-testnet3-local-paid-proof-${{ github.run_id }}
          path: artifacts/goat-testnet3-local-paid/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload sanitized local server log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/geomacro-local.log ]; then
            sed -E 's/(Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g' /tmp/geomacro-local.log | tail -300 > /tmp/geomacro-local-sanitized.log
          fi

      - name: Record proof boundary
        if: always()
        shell: bash
        run: |
          echo "Network: GOAT Testnet3 / eip155:48816" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: isolated loopback server from current main source" >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Buyer-wallet custody by Geomacro: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution authorization from Risk Gate: false" >> "$GITHUB_STEP_SUMMARY"
