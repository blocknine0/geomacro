name: Structured Event B2 Compact 100 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/structured-event-b2-compact-100-once.yml"

permissions:
  contents: read

concurrency:
  group: structured-event-b2-verified-compaction
  cancel-in-progress: false

jobs:
  compact-batch:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      STRUCTURED_EVENT_COMPACT_OLDER_DAYS: "7"
      STRUCTURED_EVENT_COMPACT_LIMIT: "10"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify required archive configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test "$STRUCTURED_EVENT_COMPACT_LIMIT" = "10"
      - name: Compact up to one hundred payloads in independently verified batches
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "Verified compaction batch $i/10"
            node scripts/ops/b2-compact-structured-event-payload.mjs
          done
