name: Geomacro Open Realtime Source Mesh

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false
jobs:
  sync-and-structure:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEOMACRO_SUPABASE_RESTRICTED_MODE: "true"
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve existing D1 without creating a database
        run: |
          bun - <<'TS'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('SOURCE_RUNTIME_CLOUDFLARE_CONFIG_REQUIRED');
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/d1/database`,{
            headers:{Authorization:`Bearer ${token}`},redirect:'error',signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('SOURCE_RUNTIME_D1_DISCOVERY_UNAVAILABLE');
          const d=await r.json();
          const db=d.success===true&&Array.isArray(d.result)?d.result.find(x=>x.name==='geomacro-control-plane'):null;
          if(!db||!/^[0-9a-f-]{36}$/i.test(db.uuid))throw Error('SOURCE_RUNTIME_EXISTING_D1_NOT_FOUND');
          appendFileSync(process.env.GITHUB_ENV,`D1_DATABASE_ID=${db.uuid}\n`);
          TS
      - name: Read sources and verify exact D1 derived context
        run: bun scripts/ops/run-supabase-free-source-runtime.ts > source-runtime.json
      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geomacro-open-realtime-source-mesh
          path: source-runtime.json
          if-no-files-found: warn
          retention-days: 14
