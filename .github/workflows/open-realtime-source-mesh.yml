name: Geomacro Open Realtime Source Mesh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/sync-open-live-source-mesh.mjs"
      - "supabase/functions/live-structure-intelligence/**"
      - "supabase/migrations/964_stage1_realtime_source_mesh.sql"
      - ".github/workflows/open-realtime-source-mesh.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-live-intelligence-mesh-production
  cancel-in-progress: false

jobs:
  sync-and-structure:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RELIEFWEB_APP_NAME: ${{ secrets.RELIEFWEB_APP_NAME }}
      OPEN_LIVE_SOURCE_SYNC_OUTPUT: open-live-source-mesh.json
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aa5fe8019c6242189c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative runtime
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY LIVE_STRUCTURE_TOKEN; do
            test -n "${!name:-}" || { echo "::error::${name} missing"; exit 1; }
          done
          node scripts/db/assert-authoritative-supabase.mjs
          bun --check scripts/sync-open-live-source-mesh.mjs

      - name: Sync open realtime sources
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/sync-open-live-source-mesh.mjs

      - name: Structure source fragments
        shell: bash
        run: |
          set -euo pipefail
          : > open-source-structure-summary.ndjson
          for i in 1 2 3 4 5 6; do
            response_file="open-source-structure-${i}.json"
            curl --fail-with-body -sS               --retry 3               --retry-all-errors               --retry-delay 2               --retry-max-time 90               -X POST               "${APP_SUPABASE_URL%/}/functions/v1/live-structure-intelligence"               -H "x-geomacro-structure-token: ${LIVE_STRUCTURE_TOKEN}"               -H "Content-Type: application/json"               -o "$response_file"
            jq -e '.ok == true' "$response_file" >/dev/null
            jq -c '{ok,status,fragment_id:(.fragment_id // null),fragment_total:(.fragment_total // null),remaining:(.remaining // 0),evidence_structured:(.evidence_structured // 0),evidence_excluded:(.evidence_excluded // 0),events_created:(.events_created // 0),events_updated:(.events_updated // 0)}' "$response_file" | tee -a open-source-structure-summary.ndjson
          done

      - name: Prove source-private structured delivery boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f open-live-source-mesh.json
          jq -e '.ok == true' open-live-source-mesh.json >/dev/null
          jq -e '.sources | length >= 3' open-live-source-mesh.json >/dev/null
          for file in open-source-structure-*.json; do
            jq -e '.ok == true' "$file" >/dev/null
          done

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geomacro-open-realtime-source-mesh
          path: |
            open-live-source-mesh.json
            open-source-structure-summary.ndjson
            open-source-structure-*.json
          if-no-files-found: warn
          retention-days: 30
