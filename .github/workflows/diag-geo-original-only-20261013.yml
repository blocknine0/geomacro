name: One-Time Geopolitical Original-Source Coverage Probe
on:
  push:
    branches: [diag/geo-official-readback-20261013]
permissions:
  contents: read
jobs:
  real-originals:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Parse actual original publisher release clocks, no funds
        run: bun scripts/ops/diagnose-one-time-geo-originals.ts
