name: One-Time All-Nine No-Key Source Diagnostic

# One-time, exact-branch zero-funds network observation.
# Does not change the scheduled production rotation or register any source.
on:
  push:
    branches:
      - diag/free-source-all-nine-20261013

permissions:
  contents: read

jobs:
  real-network:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test scripts/tests/operator-commercial-free-source-lineup.test.mjs
      - name: Three groups, nine free/no-card URLs, only aggregate metadata logged
        shell: bash
        run: |
          set +e
          failed=0
          for group in 0 1 2; do
            FREE_SOURCE_GROUP="$group" node scripts/ops/probe-commercial-free-source-lineup.mjs || failed=1
          done
          exit "$failed"
