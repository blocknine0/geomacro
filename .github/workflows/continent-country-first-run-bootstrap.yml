name: Six-Continent Country Sweep Bootstrap (Main No Funds)

# Scheduled GitHub Actions are best-effort and can be skipped. When the
# continent automation source changes, run a bounded 6-continent canary
# immediately instead of waiting for the next unreliable cron.
# Smoke-check five lanes and the full smallest continent (South America).
# Scheduled workflows always cover their entire continent. This is not a publisher.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continent-country-*-2h.yml'
      - '.github/workflows/continent-country-original-probe-reusable.yml'
      - '.github/workflows/continent-country-first-run-bootstrap.yml'
      - 'scripts/lib/continent-country-195-rotation.mjs'
      - 'scripts/lib/continent-country-full-sweep.mjs'
      - 'scripts/lib/continent-news-publication.mjs'
      - 'scripts/ops/publish-last-24-hour-website-news.ts'
      - 'src/lib/last-24-hour-news-backfill.server.ts'
      - 'src/lib/last-24-hour-news-backfill.server.test.ts'
      - 'src/lib/continent-derived-news.server.ts'
      - 'src/lib/continent-derived-news.server.test.ts'
      - 'src/__tests__/continent-news-publication.test.ts'
      - 'scripts/ops/run-full-continent-country-sweep.mjs'
      - 'scripts/tests/continent-country-full-sweep.test.mjs'
      - 'scripts/ops/verify-live-195-country-batch.ts'
      - 'scripts/lib/continent-country-resume.mjs'
      - 'scripts/ops/restore-continent-country-cursor.mjs'
      - 'scripts/tests/continent-country-resume.test.mjs'
      - 'scripts/ops/plan-continent-country-195-rotation.mjs'
      - 'scripts/tests/continent-country-195-rotation.test.mjs'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

# Never auto-cancel 1 of the 6 region canaries on a fresh main commit.
concurrency:
  group: continent-country-initialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  six-real-country-source-canaries:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        continent: [africa, asia, europe, north_america, south_america, oceania]
    uses: ./.github/workflows/continent-country-original-probe-reusable.yml
    secrets:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    with:
      continent: ${{ matrix.continent }}
      country_iso3: ''
      canary_only: ${{ matrix.continent != 'south_america' }}
