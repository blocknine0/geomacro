name: Early Warning Core Check

on:
  pull_request:
    paths:
      - "src/lib/early-warning-*.ts"
      - "supabase/migrations/936_early_warning_alert_ledger.sql"
      - "docs/EARLY_WARNING_ENGINE.md"
      - ".github/workflows/early-warning-core-check.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/early-warning-*.ts"
      - "supabase/migrations/936_early_warning_alert_ledger.sql"
      - ".github/workflows/early-warning-core-check.yml"

permissions:
  contents: read

jobs:
  contract-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test deterministic CEWS and canonical alert builder
        run: bunx vitest run src/lib/early-warning-contract.test.ts src/lib/early-warning-service.server.test.ts
      - name: Verify ledger safety invariants
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/936_early_warning_alert_ledger.sql"
          grep -q "methodology_calibrated boolean not null default false" "$file"
          grep -q "published early warning core fields are immutable" "$file"
          grep -q "early_warning_distribution_unique_channel" "$file"
          grep -q "enable row level security" "$file"
          grep -q "revoke all on table public.early_warning_alerts from PUBLIC, anon, authenticated" "$file"
          echo "PASS: Early Warning ledger is provisional, immutable-after-publication, idempotent and service-role only."
