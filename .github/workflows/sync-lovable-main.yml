name: Sync Canonical Main to Lovable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-canonical-main-to-lovable
  cancel-in-progress: true

jobs:
  mirror:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOVABLE_MIRROR_REPOSITORY: blocknine0/geomacro-160c8e56
      LOVABLE_MIRROR_TOKEN: ${{ secrets.LOVABLE_MIRROR_TOKEN }}
      GH_TOKEN: ${{ secrets.LOVABLE_MIRROR_TOKEN }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: canonical

      - name: Verify published website lock before mirror sync
        shell: bash
        working-directory: canonical
        run: node scripts/ops/verify-website-lock.mjs

      - name: Detect mirror credential
        id: mirror-token
        shell: bash
        run: |
          if [[ -n "${LOVABLE_MIRROR_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Lovable mirror credential is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LOVABLE_MIRROR_TOKEN is not configured. The canonical repository remains authoritative, but automatic Lovable mirroring is paused."
          fi

      - name: Mirror canonical tree into Lovable-linked repository
        if: steps.mirror-token.outputs.configured == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          gh auth setup-git
          gh repo clone "$LOVABLE_MIRROR_REPOSITORY" lovable-mirror -- --branch main --single-branch --depth 1

          # The Lovable-linked repository is a deployment mirror only.
          # Never allow canonical scheduled/privileged GitHub Actions or
          # dependency-update automation to execute there.
          rm -rf lovable-mirror/.github/workflows
          rm -f lovable-mirror/.github/dependabot.yml

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            --exclude '.github/dependabot.yml' \
            --exclude '.lovable/' \
            canonical/ lovable-mirror/

          cd lovable-mirror
          printf '%s\n' "${GITHUB_SHA}" > .geomacro-canonical-main

          # This public marker is deployment evidence only. Lovable still requires
          # an explicit Publish changes action after Git sync. The live acceptance
          # workflow reads this file to prove the published site corresponds to the
          # exact canonical main SHA being accepted.
          mkdir -p public/.well-known
          cat > public/.well-known/geomacro-build.json <<EOF
          {
            "schema_version": "geomacro.deployment-build.v1",
            "canonical_repository": "blocknine0/geomacro",
            "canonical_main_sha": "${GITHUB_SHA}",
            "production_activation_performed": false
          }
          EOF

          git config user.name "Geomacro Canonical Sync"
          git config user.email "160921639+blocknine0@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Lovable mirror already matches canonical main ${GITHUB_SHA}."
            exit 0
          fi

          git commit -m "sync: canonical main ${GITHUB_SHA:0:12}"
          # A remote 5xx can reject a correct, non-force Git push. Retry ONLY
          # transport/server failures; auth, branch divergence and other
          # errors remain fail-closed. No secrets are printed in the log.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main > "$RUNNER_TEMP/geomacro-mirror-push.log" 2>&1; then
              pushed=true
              break
            fi
            if ! grep -Eiq 'Internal Server Error|HTTP (500|502|503|504)|remote end hung up unexpectedly' "$RUNNER_TEMP/geomacro-mirror-push.log"; then
              echo "::error::LOVABLE_MIRROR_NON_RETRYABLE_PUSH_FAILURE"
              exit 2
            fi
            echo "::warning::LOVABLE_MIRROR_TRANSIENT_REMOTE_ERROR attempt=$attempt"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          if [ "$pushed" != true ]; then
            echo "::error::LOVABLE_MIRROR_REMOTE_UNAVAILABLE_AFTER_RETRIES"
            exit 2
          fi
          echo "Mirrored canonical main ${GITHUB_SHA} to ${LOVABLE_MIRROR_REPOSITORY}:main."
