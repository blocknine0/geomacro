name: Deploy Global Risk Edge

# Do not deploy from a frozen publisher or add a recurring source check.
# A narrow verified code-only main push can use a PREVIOUS successful
# full-B2-readback artifact; the existing source-run/manual paths remain.
on:
  workflow_dispatch: {}
  # A worker-code-only redeploy is independent of a NEW publisher snapshot.
  # It must still materialize an already full-B2-readback-verified main-run
  # artifact before secrets are used or Cloudflare deployment is attempted.
  # Never deploy for ordinary source/workflow commits or on a schedule.
  push:
    branches: [main]
    paths:
      - "workers/global-risk-edge/src/index.mjs"
      - "workers/global-risk-edge/wrangler.jsonc"
      - "workers/shared/current-source-clock.mjs"
      - "workers/shared/b2-origin-negative-cache.mjs"
      - "workers/shared/governed-b2-origin-retry.mjs"
      - "scripts/ops/configure-global-risk-edge-d1-quota.mjs"
      - ".github/workflows/deploy-global-risk-edge.yml"
  workflow_run:
    workflows: ["GRI Realtime Direct Postgres"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: geomacro-global-risk-edge-production
  cancel-in-progress: false

jobs:
  deploy-accept:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      WRANGLER_VERSION: "4.136.3"
      EXPECTED_URL: https://geomacro-global-risk.daspallab202391.workers.dev
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Require existing production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 2; }
          test -n "$B2_ARCHIVE_READ_KEY_ID" || { echo "B2_ARCHIVE_READ_KEY_ID is required"; exit 2; }
          test -n "$B2_ARCHIVE_READ_APPLICATION_KEY" || { echo "B2_ARCHIVE_READ_APPLICATION_KEY is required"; exit 2; }

      - name: Materialize latest B2-readback-verified Global Risk continuity
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          bash scripts/ops/prepare-edge-continuity.sh \
            global-risk \
            gri-realtime-direct-postgres.yml \
            geomacro.public-global-risk-direct-postgres-publish.v1 \
            workers/global-risk-edge/src/continuity.mjs

      - name: Bind main-owned D1 global B2 quota and verify schema v5
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          D1_DATABASE_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let data="";
            process.stdin.on("data", part=>data+=part);
            process.stdin.on("end",()=>{
              const databases=JSON.parse(data);
              const matched=databases.filter(x=>x.name==="geomacro-control-plane");
              if(matched.length!==1)process.exit(2);
              process.stdout.write(String(matched[0].uuid??matched[0].id??""));
            });
          ')"
          test -n "$D1_DATABASE_ID" || { echo "Shared D1 control plane missing"; exit 2; }
          export D1_DATABASE_ID
          node scripts/ops/configure-global-risk-edge-d1-quota.mjs
          PROOF="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 execute B2_QUOTA_DB \
            --remote --json \
            --config workers/global-risk-edge/wrangler.runtime.jsonc \
            --command "SELECT (SELECT version FROM schema_meta WHERE name='control-plane') AS version, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='b2_account_daily_request_quota') AS quota_table;")"
          printf '%s' "$PROOF" | node -e '
            let data="";
            process.stdin.on("data",part=>data+=part);
            process.stdin.on("end",()=>{
              const body=JSON.parse(data);
              const result=Array.isArray(body)?body:body?.result;
              const rows=Array.isArray(result)?result.flatMap(x=>x?.results??[]):[];
              if(rows.length!==1 || Number(rows[0].version)<5 ||
                Number(rows[0].quota_table)!==1)
                throw new Error("GLOBAL_RISK_SHARED_B2_D1_SCHEMA_V5_REQUIRED");
              console.log("PASS: Global Risk origin fallback uses main-owned shared B2 GET ledger.");
            });
          '

      - name: Deploy read-only Global Risk Worker with pinned Wrangler
        id: deploy
        working-directory: workers/global-risk-edge
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_LOG="$(mktemp)"
          npx -y "wrangler@${WRANGLER_VERSION}" deploy --config wrangler.runtime.jsonc 2>&1 | tee "$DEPLOY_LOG"
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)"
          test -n "$DEPLOYMENT_URL" || { echo "Wrangler deploy did not emit a workers.dev URL"; exit 3; }
          test "$DEPLOYMENT_URL" = "$EXPECTED_URL" || { echo "Unexpected worker URL: $DEPLOYMENT_URL"; exit 3; }
          printf '%s' "$B2_ARCHIVE_READ_KEY_ID" | npx -y "wrangler@${WRANGLER_VERSION}" secret put B2_KEY_ID --config wrangler.runtime.jsonc >/tmp/global-risk-edge-b2-key.log
          printf '%s' "$B2_ARCHIVE_READ_APPLICATION_KEY" | npx -y "wrangler@${WRANGLER_VERSION}" secret put B2_APPLICATION_KEY --config wrangler.runtime.jsonc >/tmp/global-risk-edge-b2-secret.log
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Global Risk code separately from signed-product availability
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geomacro-edge-code-check
          headers="/tmp/geomacro-edge-code-check/global-risk.headers"
          body="/tmp/geomacro-edge-code-check/global-risk.json"
          code="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$DEPLOYMENT_URL/global-risk" || true)"
          node scripts/ops/verify-signed-edge-code-only.mjs "global-risk" "$code" "$headers" "$body"
          echo "PASS: deployed Worker code verified; the next signed-product step remains independently fail-closed."

      - name: Require verified package through public-safe edge
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          CODE=''
          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -sS -D /tmp/global-risk-edge.headers -o /tmp/global-risk-edge.json -w '%{http_code}' --max-time 15 "$DEPLOYMENT_URL/global-risk" || true)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep $((attempt * 2))
          done
          test "$CODE" = "200" || { echo "Global Risk edge acceptance failed: HTTP $CODE"; cat /tmp/global-risk-edge.json || true; exit 4; }
          grep -qi '^x-geomacro-authority: backblaze-b2-verified-edge' /tmp/global-risk-edge.headers || { echo "Verified edge authority header missing"; exit 4; }
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/global-risk-edge.json', 'utf8'));
          const d = body?.data;
          if (body?.schema !== 'geomacro.public-global-risk-live.v1') throw new Error('EDGE_SCHEMA_INVALID');
          if (body?.source_project !== 'ldpwajisioljyjtojvfx') throw new Error('EDGE_PROJECT_INVALID');
          if (d?.verificationStatus !== 'verified' || d?.methodologyVersion !== 'gri-v1.2.0') throw new Error('EDGE_RISK_NOT_VERIFIED');
          for (const key of ['geopolitics','macro','rare_earth']) {
            const buckets = d?.domainIndices?.[key]?.series?.['7D']?.buckets;
            if (!Array.isArray(buckets) || buckets.length < 2) throw new Error(`EDGE_DOMAIN_HISTORY_INVALID:${key}`);
          }
          console.log(JSON.stringify({ ok: true, snapshot_id: d.snapshotId, snapshot_as_of: d.snapshotAsOf }));
          NODE

      - name: Require new Worker version and native current signed GRI
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {originalSourceIsCurrent} from "./workers/shared/current-source-clock.mjs";
          const body=JSON.parse(fs.readFileSync("/tmp/global-risk-edge.json","utf8"));
          const raw=fs.readFileSync("/tmp/global-risk-edge.headers","utf8");
          const header=(name)=>raw.split(/\r?\n/).filter(s=>s.toLowerCase().startsWith(name+":")).at(-1)?.slice(name.length+1).trim()??"";
          const source=body?.data?.snapshotAsOf;
          if(header("x-geomacro-native-clock-contract")!=="live-60m-v1")throw Error("GRI_WORKER_CODE_NOT_ACTIVE");
          if(!originalSourceIsCurrent(source)||!originalSourceIsCurrent(header("x-geomacro-source-as-of"))||
             Date.parse(source)!==Date.parse(header("x-geomacro-source-as-of")))
            throw Error("GRI_ORIGINAL_SOURCE_OLDER_THAN_60M");
          if(!(
             header("x-geomacro-b2-verification")==="full-readback-hash-exact-restore"||
             /^(github-actions-b2-readback-verified|d1-b2-readback-verified-hot-snapshot)$/.test(header("x-geomacro-continuity"))
          ))throw Error("GRI_PUBLIC_PROOF_MISSING");
          if(/stale-while-revalidate|stale-if-error/.test(header("cache-control")))
            throw Error("GRI_EXPIRED_CDN_REPLAY_ENABLED");
          console.log("PASS: fresh GRI original source and new proof-gated Worker code");
          NODE

      - name: Confirm narrow non-destructive serving boundary
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/global-risk-edge-deny.json -w '%{http_code}' --max-time 10 "$EXPECTED_URL/not-allowed" || true)"
          test "$CODE" = "404" || { echo "Unexpected generic read surface: HTTP $CODE"; exit 5; }
          echo "Global Risk edge serves live B2 or bounded B2-readback-verified continuity only; no B2 write/delete, Supabase mutation, or payment action occurred."
