name: Distributed 40k Observability Closure

on:
  workflow_run:
    workflows: ['Distributed 40k Staging Execution']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: distributed-40k-observability-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  bind-capacity-evidence:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      candidate_sha: ${{ steps.bind.outputs.candidate_sha }}
      deployment_id: ${{ steps.bind.outputs.deployment_id }}
      target_host: ${{ steps.bind.outputs.target_host }}
      burst_run_group_id: ${{ steps.bind.outputs.burst_run_group_id }}
      burst_barrier_epoch_ms: ${{ steps.bind.outputs.burst_barrier_epoch_ms }}
      soak_run_group_id: ${{ steps.bind.outputs.soak_run_group_id }}
      soak_barrier_epoch_ms: ${{ steps.bind.outputs.soak_barrier_epoch_ms }}
    steps:
      - name: Checkout exact capacity-tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download source capacity validation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: distributed-validation-*
          path: artifacts/source-validation
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download source final capacity artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: distributed-40k-capacity-pass-*
          path: artifacts/source-capacity
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Bind exact source run, candidate, deployment and time windows
        id: bind
        env:
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const head = String(process.env.SOURCE_HEAD_SHA || '').toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(head)) throw new Error('source capacity run head SHA is invalid');
          const burst = JSON.parse(fs.readFileSync('artifacts/source-validation/distributed-40k-validation-million_burst_40k.json','utf8'));
          const soak = JSON.parse(fs.readFileSync('artifacts/source-validation/distributed-40k-validation-soak_40k_5m.json','utf8'));
          const capacity = JSON.parse(fs.readFileSync('artifacts/source-capacity/distributed-40k-capacity-pass.json','utf8'));
          for (const evidence of [burst, soak, capacity]) {
            if (evidence?.pass !== true || String(evidence?.candidate_sha || '').toLowerCase() !== head) throw new Error('source capacity evidence is not PASS on triggering SHA');
          }
          if (burst.deployment_id !== soak.deployment_id || capacity.operator_deployment_id !== burst.deployment_id) throw new Error('source deployment identity mismatch');
          if (burst.target_host !== soak.target_host || capacity.target_host !== burst.target_host) throw new Error('source target host mismatch');
          if (burst.profile !== 'million_burst_40k' || soak.profile !== 'soak_40k_5m') throw new Error('source profile mismatch');
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `candidate_sha=${head}\n`);
          fs.appendFileSync(out, `deployment_id=${burst.deployment_id}\n`);
          fs.appendFileSync(out, `target_host=${burst.target_host}\n`);
          fs.appendFileSync(out, `burst_run_group_id=${burst.run_group_id}\n`);
          fs.appendFileSync(out, `burst_barrier_epoch_ms=${burst.orchestrator_barrier_epoch_ms}\n`);
          fs.appendFileSync(out, `soak_run_group_id=${soak.run_group_id}\n`);
          fs.appendFileSync(out, `soak_barrier_epoch_ms=${soak.orchestrator_barrier_epoch_ms}\n`);
          console.log(`PASS: source 40k run ${process.env.SOURCE_RUN_ID} bound to ${head.slice(0,12)} and deployment ${burst.deployment_id}.`);
          NODE

  control-plane-proof:
    needs: bind-capacity-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging-capacity
    env:
      RISK_GATE_DISTRIBUTED_CANDIDATE_SHA: ${{ needs.bind-capacity-evidence.outputs.candidate_sha }}
      RISK_GATE_DISTRIBUTED_DEPLOYMENT_ID: ${{ needs.bind-capacity-evidence.outputs.deployment_id }}
      RISK_GATE_DISTRIBUTED_STAGING_BASE_URL: ${{ vars.RISK_GATE_DISTRIBUTED_STAGING_BASE_URL }}
      RISK_GATE_DISTRIBUTED_EXPECTED_HOST: ${{ vars.RISK_GATE_DISTRIBUTED_EXPECTED_HOST }}
      RISK_GATE_DISTRIBUTED_API_KEYS_JSON: ${{ secrets.RISK_GATE_DISTRIBUTED_API_KEYS_JSON }}
    steps:
      - name: Checkout exact capacity-tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bind-capacity-evidence.outputs.candidate_sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Prove post-load auth, exact replay and conflict behavior
        run: node scripts/scale/probe-distributed-staging-control-plane.mjs
      - name: Upload post-load control-plane proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributed-40k-control-plane-${{ github.run_id }}
          path: artifacts/distributed-40k-control-plane-proof.json
          if-no-files-found: error
          retention-days: 90

  infrastructure-telemetry:
    needs: bind-capacity-evidence
    runs-on: [self-hosted, linux, x64, geomacro-capacity-observer]
    timeout-minutes: 12
    environment: staging-capacity
    env:
      RISK_GATE_DISTRIBUTED_EXPECTED_CANDIDATE_SHA: ${{ needs.bind-capacity-evidence.outputs.candidate_sha }}
      RISK_GATE_DISTRIBUTED_EXPECTED_DEPLOYMENT_ID: ${{ needs.bind-capacity-evidence.outputs.deployment_id }}
      RISK_GATE_DISTRIBUTED_EXPECTED_BURST_RUN_GROUP_ID: ${{ needs.bind-capacity-evidence.outputs.burst_run_group_id }}
      RISK_GATE_DISTRIBUTED_EXPECTED_SOAK_RUN_GROUP_ID: ${{ needs.bind-capacity-evidence.outputs.soak_run_group_id }}
      TARGET_HOST: ${{ needs.bind-capacity-evidence.outputs.target_host }}
      BURST_BARRIER_EPOCH_MS: ${{ needs.bind-capacity-evidence.outputs.burst_barrier_epoch_ms }}
      SOAK_BARRIER_EPOCH_MS: ${{ needs.bind-capacity-evidence.outputs.soak_barrier_epoch_ms }}
    steps:
      - name: Checkout exact capacity-tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bind-capacity-evidence.outputs.candidate_sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Require dedicated infrastructure observer adapter
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/geomacro/bin/export-capacity-telemetry || { echo '::error title=Observer adapter missing::Install the staging provider observability adapter at /opt/geomacro/bin/export-capacity-telemetry before any 40k proof can close.'; exit 1; }
          /opt/geomacro/bin/export-capacity-telemetry --self-test
      - name: Export DB pool, edge/runtime, auth/rate-limit and provider telemetry for exact load windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          /opt/geomacro/bin/export-capacity-telemetry \
            --candidate-sha "$RISK_GATE_DISTRIBUTED_EXPECTED_CANDIDATE_SHA" \
            --deployment-id "$RISK_GATE_DISTRIBUTED_EXPECTED_DEPLOYMENT_ID" \
            --target-host "$TARGET_HOST" \
            --burst-run-group "$RISK_GATE_DISTRIBUTED_EXPECTED_BURST_RUN_GROUP_ID" \
            --burst-start-ms "$BURST_BARRIER_EPOCH_MS" \
            --burst-duration-seconds 25 \
            --soak-run-group "$RISK_GATE_DISTRIBUTED_EXPECTED_SOAK_RUN_GROUP_ID" \
            --soak-start-ms "$SOAK_BARRIER_EPOCH_MS" \
            --soak-duration-seconds 300 \
            --output artifacts/distributed-40k-infra-telemetry.json
      - name: Fail closed unless infrastructure telemetry passes every capacity gate
        env:
          RISK_GATE_DISTRIBUTED_TELEMETRY_PATH: artifacts/distributed-40k-infra-telemetry.json
        run: node scripts/scale/validate-distributed-capacity-telemetry.mjs
      - name: Upload raw and validated infrastructure telemetry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributed-40k-infra-telemetry-${{ github.run_id }}
          path: |
            artifacts/distributed-40k-infra-telemetry.json
            artifacts/distributed-40k-infra-telemetry-validation.json
          if-no-files-found: error
          retention-days: 90

  close-capacity-proof:
    needs: [bind-capacity-evidence, control-plane-proof, infrastructure-telemetry]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download original capacity pass from source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: distributed-40k-capacity-pass-*
          path: artifacts/source-capacity
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download post-load control-plane proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: distributed-40k-control-plane-*
          path: artifacts/control
          merge-multiple: true
      - name: Download validated infrastructure telemetry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: distributed-40k-infra-telemetry-*
          path: artifacts/telemetry
          merge-multiple: true
      - name: Bind every evidence layer to one exact candidate and deployment
        env:
          EXPECTED_SHA: ${{ needs.bind-capacity-evidence.outputs.candidate_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.bind-capacity-evidence.outputs.deployment_id }}
          SOURCE_CAPACITY_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const paths = {
            capacity: 'artifacts/source-capacity/distributed-40k-capacity-pass.json',
            control: 'artifacts/control/distributed-40k-control-plane-proof.json',
            telemetry: 'artifacts/telemetry/distributed-40k-infra-telemetry-validation.json',
          };
          const raw = Object.fromEntries(Object.entries(paths).map(([k,p]) => [k, fs.readFileSync(p)]));
          const json = Object.fromEntries(Object.entries(raw).map(([k,b]) => [k, JSON.parse(b.toString('utf8'))]));
          const sha = process.env.EXPECTED_SHA.toLowerCase();
          const deployment = process.env.EXPECTED_DEPLOYMENT_ID;
          if (json.capacity?.pass !== true || json.capacity?.candidate_sha !== sha || json.capacity?.operator_deployment_id !== deployment) throw new Error('capacity-pass binding failed');
          if (json.control?.pass !== true || json.control?.candidate_sha !== sha || json.control?.deployment_id !== deployment) throw new Error('control-plane binding failed');
          if (json.telemetry?.pass !== true || json.telemetry?.candidate_sha !== sha || json.telemetry?.deployment_id !== deployment) throw new Error('telemetry binding failed');
          if (json.capacity.target_host !== json.control.target_host || json.capacity.target_host !== json.telemetry.target_host) throw new Error('target-host evidence mismatch');
          const digest = (buffer) => crypto.createHash('sha256').update(buffer).digest('hex');
          const closure = {
            schema_version: 'geomacro.distributed-40k-capacity-closure.v1',
            generated_at: new Date().toISOString(),
            source_capacity_run_id: Number(process.env.SOURCE_CAPACITY_RUN_ID),
            candidate_sha: sha,
            deployment_id: deployment,
            target_host: json.capacity.target_host,
            exact_1m_burst_40k_rps: true,
            exact_12m_five_minute_soak_40k_rps: true,
            latency_slo_pass: true,
            zero_5xx_timeouts_drops: true,
            db_pool_capacity_pass: true,
            edge_runtime_capacity_pass: true,
            auth_rate_limit_boundary_pass: true,
            provider_saturation_pass: true,
            data_leakage_gate_pass: true,
            idempotency_replay_conflict_pass: true,
            evidence_sha256: {
              capacity_pass: digest(raw.capacity),
              control_plane: digest(raw.control),
              infrastructure_telemetry: digest(raw.telemetry),
            },
            production_load: false,
            real_payment: false,
            mainnet_activation: false,
            pass: true,
            limitation: 'First-party isolated-staging 40k arrival-rate evidence for this exact release/deployment. Not a claim of 40,000 simultaneous open connections, unlimited production capacity, or third-party certification.',
          };
          fs.mkdirSync('artifacts/final', { recursive: true });
          fs.writeFileSync('artifacts/final/distributed-40k-capacity-closure.json', JSON.stringify(closure, null, 2) + '\n');
          console.log('PASS: 40k capacity, control-plane and infrastructure telemetry evidence are bound to one exact candidate/deployment.');
          NODE
      - name: Upload final observability-closed capacity proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributed-40k-capacity-closure-${{ github.run_id }}
          path: artifacts/final/distributed-40k-capacity-closure.json
          if-no-files-found: error
          retention-days: 90
      - name: Record evidence boundary
        shell: bash
        run: |
          {
            echo '## Distributed 40k Observability Closure'
            echo
            echo '- Same-SHA 1M burst + 12M soak capacity artifact: PASS'
            echo '- Missing/invalid auth rejection + exact replay + conflict: PASS'
            echo '- DB pool utilization/wait/errors/exhaustion: PASS'
            echo '- Edge/runtime CPU/memory/saturation/errors: PASS'
            echo '- Auth/rate-limit unexpected failures or bypass: PASS'
            echo '- Upstream-provider saturation/timeouts/errors: PASS'
            echo '- Data leakage + replay mismatch/duplicate effects: PASS'
            echo '- Production load / payment / mainnet activation: false'
          } >> "$GITHUB_STEP_SUMMARY"
