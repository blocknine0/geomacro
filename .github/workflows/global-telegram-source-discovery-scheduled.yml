name: Global Telegram Raw Source Discovery (Scheduled)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/global-telegram-source-discovery-scheduled.yml"
      - "workers/telegram-flash/global_discovery.py"
      - "supabase/migrations/969_telegram_global_discovery_metadata.sql"

permissions:
  contents: read

concurrency:
  group: geomacro-global-telegram-discovery
  cancel-in-progress: false

jobs:
  trigger-guard:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    steps:
      - name: Accept main execution or safely no-op for non-main push
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "PASS: production Telegram discovery invocation is on canonical main."
          else
            echo "INFO: non-main workflow invocation detected; production discovery is intentionally skipped."
          fi

  discover:
    needs: trigger-guard
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Telegram discovery dependencies
        run: pip install -r workers/telegram-flash/requirements.txt

      - name: Validate authoritative environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL:-}"
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${TELEGRAM_API_ID:-}"
          test -n "${TELEGRAM_API_HASH:-}"
          test -n "${TELEGRAM_SESSION:-}"
          test "$(python - <<'PY'
from urllib.parse import urlparse
from os import environ
print(urlparse(environ["APP_SUPABASE_URL"]).hostname.split(".")[0])
PY
)" = "ldpwajisioljyjtojvfx"

      - name: Discover public Telegram channels for all country/category targets
        run: python workers/telegram-flash/global_discovery.py
