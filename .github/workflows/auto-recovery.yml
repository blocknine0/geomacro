name: Auto Recovery (Prediction Markets Paused)

# Prediction-market runtime is intentionally paused by founder instruction.
# No recovery, stake sync, resolution, or market creation jobs run until re-enabled.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Prediction-market recovery is paused."
