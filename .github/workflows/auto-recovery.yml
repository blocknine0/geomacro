name: Auto Recovery
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose the recovery operation'
        required: true
        default: 'sync-stakes'
        type: choice
        options:
          - sync-stakes
          - resolve-markets
          - create-markets

permissions:
  contents: read

concurrency:
  # Recovery can use OWNER_PRIVATE_KEY. Share the same owner-wallet lock as
  # scheduled state-changing workflows and never cancel a run mid-operation.
  group: arc-owner-wallet-state-change
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Verify Arc Testnet and contract before any recovery operation
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: node scripts/ops/verify-arc-testnet-target.mjs
      - name: Verify authoritative Supabase target before privileged writes
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: node scripts/db/assert-authoritative-supabase.mjs
      - name: Sync missing stakes
        if: ${{ github.event.inputs.action == 'sync-stakes' }}
        run: DEPLOY_BLOCK=49000000 node scripts/sync-stakes.js
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Resolve due markets
        if: ${{ github.event.inputs.action == 'resolve-markets' }}
        run: node scripts/resolve-markets.js
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_2: ${{ secrets.ARC_RPC_URL_2 }}
          ARC_RPC_URL_3: ${{ secrets.ARC_RPC_URL_3 }}
          ARC_RPC_URL_4: ${{ secrets.ARC_RPC_URL_4 }}
          ARC_RPC_URL_5: ${{ secrets.ARC_RPC_URL_5 }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      - name: Create new markets
        if: ${{ github.event.inputs.action == 'create-markets' }}
        run: node scripts/create-markets.js
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_2: ${{ secrets.ARC_RPC_URL_2 }}
          ARC_RPC_URL_3: ${{ secrets.ARC_RPC_URL_3 }}
          ARC_RPC_URL_4: ${{ secrets.ARC_RPC_URL_4 }}
          ARC_RPC_URL_5: ${{ secrets.ARC_RPC_URL_5 }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
