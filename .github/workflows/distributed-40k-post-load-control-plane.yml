name: Distributed 40k Post-load Control Plane

on:
  workflow_run:
    workflows: ["Distributed 40k Staging Execution"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: distributed-40k-post-load-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  operational-closure:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging-capacity
    env:
      RISK_GATE_DISTRIBUTED_STAGING_BASE_URL: ${{ vars.RISK_GATE_DISTRIBUTED_STAGING_BASE_URL }}
      RISK_GATE_DISTRIBUTED_EXPECTED_HOST: ${{ vars.RISK_GATE_DISTRIBUTED_EXPECTED_HOST }}
      RISK_GATE_DISTRIBUTED_API_KEYS_JSON: ${{ secrets.RISK_GATE_DISTRIBUTED_API_KEYS_JSON }}
    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Download the triggering run final capacity artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributed-40k-capacity-pass-${{ github.event.workflow_run.id }}
          path: artifacts/upstream
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate upstream capacity proof lineage before any control-plane request
        id: lineage
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'artifacts/upstream/distributed-40k-capacity-pass.json';
          const capacity = JSON.parse(fs.readFileSync(file, 'utf8'));
          const sha = String(process.env.TRIGGER_SHA || '').toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('triggering workflow head SHA is invalid');
          if (capacity?.schema_version !== 'geomacro.distributed-40k-capacity-pass.v1' || capacity?.pass !== true) throw new Error('upstream final capacity artifact is not a valid PASS');
          if (capacity?.candidate_sha !== sha || capacity?.verified_staging_sha !== sha) throw new Error('upstream capacity artifact SHA lineage mismatch');
          if (capacity?.burst?.total_requests !== 1000000 || capacity?.burst?.aggregate_rate_per_second !== 40000 || capacity?.burst?.duration_seconds !== 25) throw new Error('upstream burst profile mismatch');
          if (capacity?.soak?.total_requests !== 12000000 || capacity?.soak?.aggregate_rate_per_second !== 40000 || capacity?.soak?.duration_seconds !== 300) throw new Error('upstream soak profile mismatch');
          if (capacity?.authentication_and_abuse_controls_preserved !== true || capacity?.zero_error_and_response_security_gates_passed !== true) throw new Error('upstream security gates are incomplete');
          if (capacity?.production_load !== false || capacity?.real_payment !== false || capacity?.mainnet_activation !== false) throw new Error('upstream capacity artifact crossed a forbidden production boundary');
          const deploymentId = String(capacity?.operator_deployment_id || '').trim();
          if (!/^[A-Za-z0-9._:/-]{1,256}$/.test(deploymentId)) throw new Error('upstream deployment ID is missing or unsafe');
          const targetHost = String(capacity?.target_host || '').trim().toLowerCase();
          if (!targetHost || targetHost !== String(process.env.RISK_GATE_DISTRIBUTED_EXPECTED_HOST || '').trim().toLowerCase()) throw new Error('upstream target host does not match configured staging host');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate_sha=${sha}\ndeployment_id=${deploymentId}\ntarget_host=${targetHost}\ncapacity_run_id=${process.env.TRIGGER_RUN_ID}\n`);
          console.log('PASS: upstream 40k capacity artifact is exact-SHA, exact-profile, security-gated isolated-staging evidence. No request sent by this step.');
          NODE

      - name: Re-prove auth, replay, idempotency and response security after heavy load
        env:
          RISK_GATE_DISTRIBUTED_CANDIDATE_SHA: ${{ steps.lineage.outputs.candidate_sha }}
          RISK_GATE_DISTRIBUTED_DEPLOYMENT_ID: ${{ steps.lineage.outputs.deployment_id }}
        run: node scripts/scale/probe-distributed-staging-control-plane.mjs

      - name: Bind post-load control-plane proof to the capacity run
        env:
          EXPECTED_SHA: ${{ steps.lineage.outputs.candidate_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.lineage.outputs.deployment_id }}
          EXPECTED_HOST: ${{ steps.lineage.outputs.target_host }}
          CAPACITY_RUN_ID: ${{ steps.lineage.outputs.capacity_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const capacity = JSON.parse(fs.readFileSync('artifacts/upstream/distributed-40k-capacity-pass.json', 'utf8'));
          const control = JSON.parse(fs.readFileSync('artifacts/distributed-40k-control-plane-proof.json', 'utf8'));
          if (control?.schema_version !== 'geomacro.distributed-capacity-control-plane.v2' || control?.pass !== true) throw new Error('post-load control-plane proof is not PASS');
          if (control?.candidate_sha !== process.env.EXPECTED_SHA || control?.verified_staging_sha !== process.env.EXPECTED_SHA) throw new Error('post-load candidate SHA mismatch');
          if (control?.operator_deployment_id !== process.env.EXPECTED_DEPLOYMENT_ID) throw new Error('post-load deployment ID mismatch');
          if (control?.target_host !== process.env.EXPECTED_HOST || capacity?.target_host !== process.env.EXPECTED_HOST) throw new Error('post-load target host mismatch');
          const requiredTrue = [
            'missing_auth_rejected',
            'invalid_auth_rejected',
            'authenticated_request_http_200',
            'exact_replay_http_200',
            'exact_replay_same_audit_id',
            'exact_replay_marker',
            'mutated_replay_http_409',
            'secure_response_headers_preserved',
          ];
          for (const key of requiredTrue) if (control?.[key] !== true) throw new Error(`post-load control-plane gate failed: ${key}`);
          if (control?.mutated_replay_error_code !== 'IDEMPOTENCY_CONFLICT') throw new Error('post-load idempotency conflict code mismatch');
          if (control?.execution_authorized !== false || control?.api_key_echoed !== false || control?.production_target !== false || control?.real_payment !== false || control?.mainnet_activation !== false) throw new Error('post-load control-plane safety boundary failed');
          const operational = {
            schema_version: 'geomacro.distributed-40k-operational-pass.v1',
            generated_at: new Date().toISOString(),
            capacity_workflow_run_id: Number(process.env.CAPACITY_RUN_ID),
            candidate_sha: process.env.EXPECTED_SHA,
            verified_staging_sha: process.env.EXPECTED_SHA,
            operator_deployment_id: process.env.EXPECTED_DEPLOYMENT_ID,
            target_host: process.env.EXPECTED_HOST,
            capacity_profiles_passed: true,
            post_load_auth_boundary_passed: true,
            post_load_replay_idempotency_passed: true,
            post_load_response_security_passed: true,
            execution_authorized: false,
            production_load: false,
            real_payment: false,
            mainnet_activation: false,
            pass: true,
          };
          fs.writeFileSync('artifacts/distributed-40k-operational-pass.json', JSON.stringify(operational, null, 2) + '\n');
          console.log('PASS: post-load operational closure is bound to the successful 40k capacity run and exact candidate SHA.');
          NODE

      - name: Upload post-load operational closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributed-40k-operational-pass-${{ github.event.workflow_run.id }}
          path: |
            artifacts/distributed-40k-control-plane-proof.json
            artifacts/distributed-40k-operational-pass.json
          if-no-files-found: error
          retention-days: 90

      - name: Record truthful post-load boundary
        shell: bash
        run: |
          {
            echo '## Distributed 40k Post-load Operational Closure'
            echo
            echo '- Triggering 40k capacity workflow: success'
            echo '- Exact candidate/deployment/host lineage: PASS'
            echo '- Missing + invalid authentication rejected after load: PASS'
            echo '- Exact replay preserves audit identity: PASS'
            echo '- Mutated replay fails closed with IDEMPOTENCY_CONFLICT: PASS'
            echo '- Security response headers + no credential echo: PASS'
            echo '- Production load / real payment / mainnet activation by this workflow: false'
          } >> "$GITHUB_STEP_SUMMARY"
