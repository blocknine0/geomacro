name: B2 Historical Raw Drain

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: b2-historical-raw-drain
  cancel-in-progress: false

jobs:
  verified-historical-drain:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_REQUEST_BUDGET: "100"
      B2_INGEST_LOOKBACK_HOURS: "72"
      B2_INGEST_RAW_BUNDLE_LIMIT: "50"
      B2_INGEST_RAW_ROUNDS: "20"
      B2_INGEST_HISTORICAL_DRAIN: "1"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate bounded historical drain configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test "$B2_REQUEST_BUDGET" = "100"
          test "$B2_INGEST_LOOKBACK_HOURS" = "72"
          test "$B2_INGEST_RAW_BUNDLE_LIMIT" = "50"
          test "$B2_INGEST_RAW_ROUNDS" = "20"
          test "$B2_INGEST_HISTORICAL_DRAIN" = "1"
          node --check scripts/ops/b2-country-ingest-offload.mjs

      - name: Drain historical raw objects only after verified B2 readback
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/b2-country-ingest-offload.mjs | tee b2-historical-raw-drain.json
          jq -e '.ok == true' b2-historical-raw-drain.json >/dev/null
          jq -e '.mode == "historical-b2-primary-drain"' b2-historical-raw-drain.json >/dev/null
          jq -e '.historical_drain == true' b2-historical-raw-drain.json >/dev/null
          jq -e '.verification == "full-b2-readback-before-pointer-update-and-source-delete"' b2-historical-raw-drain.json >/dev/null
          jq -e '.pre_write_b2_read_preflight_verified == true' b2-historical-raw-drain.json >/dev/null

      - name: Upload drain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b2-historical-raw-drain-${{ github.run_id }}
          path: b2-historical-raw-drain.json
          if-no-files-found: warn
          retention-days: 14
