name: Live x402 Prelaunch Availability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e7c7c0e2bff7c1a9f7c74bf54d6f3b8b4a # v7.0.1
        with:
          persist-credentials: false

      - name: Verify live no-charge deliverability
        run: node scripts/agentic/verify-live-x402-prelaunch-availability.mjs

      - name: Record safety boundary
        run: |
          echo "Payment performed: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Real funds touched: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Production activation changed: false" >> "$GITHUB_STEP_SUMMARY"
