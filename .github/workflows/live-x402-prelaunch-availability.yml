name: Live x402 Prelaunch Safety
# Re-run this no-charge production probe after governed intelligence refreshes.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify live no-charge prelaunch safety boundary
        run: node scripts/agentic/verify-live-x402-prelaunch-availability.mjs

      - name: Record safety boundary
        run: |
          echo "Payment performed: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Real funds touched: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Production activation changed: false" >> "$GITHUB_STEP_SUMMARY"
