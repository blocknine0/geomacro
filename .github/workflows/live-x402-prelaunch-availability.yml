name: Live x402 Prelaunch Safety
# PRs prove the no-funds fail-closed contract against live production.
# Enforced main acceptance is serialized after Production Website Health proves
# that the exact canonical SHA is actually published. A Git mirror alone is not
# deployment evidence.

on:
  pull_request:
  workflow_run:
    workflows:
      - Production Website Health
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact deployed canonical SHA
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="${WORKFLOW_RUN_SHA:-}"
          else
            sha="${EVENT_SHA:-}"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::X402_EXACT_DEPLOYED_SHA_INVALID"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Exact x402 proof SHA: $sha"

      - name: Checkout exact deployed canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Verify workflow-run source is exact successful Production Website Health
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          [[ "$RUN_CONCLUSION" == "success" ]] || { echo "::error::X402_DEPLOYMENT_HEALTH_NOT_SUCCESS"; exit 1; }
          [[ "$RUN_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::X402_DEPLOYMENT_SHA_BINDING_MISMATCH"; exit 1; }
          case "$RUN_EVENT" in
            push|workflow_dispatch|schedule) ;;
            *) echo "::error::X402_UNAPPROVED_DEPLOYMENT_HEALTH_EVENT:$RUN_EVENT"; exit 1 ;;
          esac

      - name: Verify live build marker still matches accepted deployment
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 2 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' https://geomacro.live/.well-known/geomacro-build.json)"
          [[ "$code" == "200" ]] || { echo "::error::X402_LIVE_BUILD_MARKER_HTTP_$code"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs=require("fs");
          const marker=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const expected=String(process.env.EXPECTED_SHA||"").toLowerCase();
          const observed=String(marker?.canonical_main_sha||"").toLowerCase();
          if(marker?.schema_version!=="geomacro.deployment-build.v1") throw new Error("X402_LIVE_BUILD_MARKER_SCHEMA_MISMATCH");
          if(marker?.canonical_repository!=="blocknine0/geomacro") throw new Error("X402_LIVE_BUILD_MARKER_REPOSITORY_MISMATCH");
          if(observed!==expected) throw new Error(`X402_LIVE_BUILD_MARKER_SHA_MISMATCH:${observed}:${expected}`);
          NODE

      - name: Verify live no-charge prelaunch safety boundary
        env:
          GEOMACRO_X402_REQUIRE_REPRESENTATIVE_AVAILABLE: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: node scripts/agentic/verify-live-x402-prelaunch-availability.mjs

      - name: Verify live no-charge 195+ country paid-path availability
        env:
          GEOMACRO_X402_COUNTRY_CENSUS_ENFORCE: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: node scripts/agentic/verify-live-x402-country-availability-census.mjs

      - name: Upload global country availability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: live-x402-country-census-${{ github.run_id }}
          path: artifacts/live-x402-country-availability-census.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record safety boundary
        run: |
          echo "Payment performed: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Real funds touched: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Production activation changed: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Accepted deployed SHA: ${{ steps.release.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

  failed-health-no-funds:
    # Normal main acceptance must remain SKIPPED when the site is unready.
    # Instead emit an independent, explicitly RED, no-payment production
    # evidence receipt, without running the paid availability census.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout exact failed production health commit, read only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify failed health SHA still binds to checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          case "$EXPECTED_EVENT" in
            push|schedule|workflow_dispatch) ;;
            *) echo "::error::X402_FAILED_HEALTH_UNAPPROVED_SOURCE_EVENT"; exit 3 ;;
          esac
      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Prove live x402 remains no-charge while fresh data unavailable
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ops/verify-failed-health-x402-no-funds.mjs
          # Returns RED even when it safely proves no funds can be charged.
          node scripts/ops/verify-failed-health-x402-no-funds.mjs
      - name: Upload scrubbed failure proof (never raw response or provider URL)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: x402-failed-production-health-no-funds-${{ github.run_id }}
          path: artifacts/x402/failed-health-no-funds.json
          retention-days: 7
          if-no-files-found: warn
