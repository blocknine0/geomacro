name: First Earnings Zero-Funds Live Acceptance

on:
  workflow_run:
    workflows: ["Production Website Health"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/lib/agent-query-plan.ts"
      # Current first-party source qualification can change buyer eligibility.
      # Rerun the same zero-funds three-category buyer preflight on source changes.
      - "src/lib/on-demand-global-discovery.server.ts"
      - "scripts/lib/global-official-release-feeds.mjs"
      - "src/lib/agent-query-response.server.ts"
      - "src/lib/earn-first-structural-offers.server.ts"
      # The security classifier for unpaid POST and both fallback module
      # gateways materially determine buyer eligibility. Re-test exact-main
      # no-funds behavior whenever they change, not only when the public
      # availability route source is edited.
      - "src/lib/central-security.server.ts"
      - "src/lib/agent-query-deliverability.server.ts"
      - "src/lib/store-product-availability.server.ts"
      - "src/lib/store-195x3-revenue-preflight.mock.test.ts"
      - "src/lib/structural-context.server.ts"
      - "src/lib/agent-query-world-bank-modules.server.ts"
      - "src/lib/agent-query-critical-minerals.server.ts"
      - "src/lib/qualified-bls-us-cpi.server.ts"
      - "src/lib/qualified-bls-us-cpi.server.test.ts"
      - "scripts/ops/probe-brazil-bcb-ipca-original.mjs"
      - "scripts/tests/brazil-bcb-ipca-original.test.mjs"
      - "scripts/ops/probe-ukraine-presidential-rss-original.mjs"
      - "scripts/tests/ukraine-presidential-original-rss.test.mjs"
      - "src/lib/store-structural-release-context.server.ts"
      - "src/lib/commercial-source-eligibility.server.ts"
      - "src/lib/coinbase-x402.server.ts"
      - "src/lib/mainnet-intelligence-endpoint.server.ts"
      - "src/lib/verified-capability-coinbase-binding.server.ts"
      - "src/lib/capability-pricing-verified-plan.server.ts"
      - "src/lib/capability-pricing-catalog.ts"
      - "src/routes/api.v1.intelligence.availability.ts"
      - "scripts/agentic/verify-earn-first-live-no-funds.mjs"
      - "scripts/agentic/first-sale-price-proof.mjs"
      - "scripts/tests/first-sale-price-proof.test.mjs"
      - "src/__tests__/earn-first-live-no-funds-acceptance.test.ts"
      - "docs/ops/FIRST_REVENUE_NO_SUBSCRIPTIONS_20261020.md"
      - ".github/workflows/earn-first-live-no-funds-acceptance.yml"
  pull_request:
    paths:
      - "src/lib/agent-query-plan.ts"
      # Current first-party source qualification can change buyer eligibility.
      # Rerun the same zero-funds three-category buyer preflight on source changes.
      - "src/lib/on-demand-global-discovery.server.ts"
      - "scripts/lib/global-official-release-feeds.mjs"
      - "src/lib/agent-query-response.server.ts"
      - "src/lib/earn-first-structural-offers.server.ts"
      - "src/routes/api.v1.intelligence.availability.ts"
      - "scripts/agentic/verify-earn-first-live-no-funds.mjs"
      - "src/__tests__/earn-first-live-no-funds-acceptance.test.ts"
      - "docs/ops/FIRST_REVENUE_NO_SUBSCRIPTIONS_20261020.md"
      - "src/__tests__/earn-first-live-no-funds-acceptance.test.ts"
      - "src/lib/central-security.server.ts"
      - "src/lib/agent-query-deliverability.server.ts"
      - "src/lib/store-product-availability.server.ts"
      - "src/lib/store-195x3-revenue-preflight.mock.test.ts"
      - "src/lib/structural-context.server.ts"
      - "src/lib/agent-query-world-bank-modules.server.ts"
      - "src/lib/agent-query-critical-minerals.server.ts"
      - "src/lib/qualified-bls-us-cpi.server.ts"
      - "src/lib/qualified-bls-us-cpi.server.test.ts"
      - "scripts/ops/probe-brazil-bcb-ipca-original.mjs"
      - "scripts/tests/brazil-bcb-ipca-original.test.mjs"
      - "scripts/ops/probe-ukraine-presidential-rss-original.mjs"
      - "scripts/tests/ukraine-presidential-original-rss.test.mjs"
      - "src/lib/store-structural-release-context.server.ts"
      - "src/lib/commercial-source-eligibility.server.ts"
      - "src/lib/coinbase-x402.server.ts"
      - "src/lib/mainnet-intelligence-endpoint.server.ts"
      - "src/lib/verified-capability-coinbase-binding.server.ts"
      - "src/lib/capability-pricing-verified-plan.server.ts"
      - "src/lib/capability-pricing-catalog.ts"
      - ".github/workflows/earn-first-live-no-funds-acceptance.yml"
  # Best-effort read-only earning readiness heartbeat: four small buyer
  # preflights/day, no x402 PAYMENT-SIGNATURE, no source spider, no funds.
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-earn-first-no-funds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-buyer-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify official Brazil BCB original monthly-IPCA adapter safety without funds
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        run: node --test scripts/tests/brazil-bcb-ipca-original.test.mjs
      - name: One bounded Brazil BCB IPCA official-source read, private status only
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        run: node scripts/ops/probe-brazil-bcb-ipca-original.mjs
      - name: Unit-test official Ukraine native RSS source provenance and rejection
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        run: node --test scripts/tests/ukraine-presidential-original-rss.test.mjs
      - name: One bounded Ukraine presidential official original RSS observation
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        run: node scripts/ops/probe-ukraine-presidential-rss-original.mjs
      - name: Verify first-buyer locked pricing only and zero-payments contract
        run: |
          node --check scripts/agentic/first-sale-price-proof.mjs
          node --test scripts/tests/first-sale-price-proof.test.mjs
      # PR mode proves only that the published *base* can be examined without
      # wallets, quotes or payment. A positive diagnostic job is NOT proof
      # of payable evidence. On main push the original strict gate remains.
      - name: Read-only three-domain alternate-country diagnosis (not earning acceptance)
        if: github.event_name == 'pull_request'
        env:
          # The PR base is the comparison point. A stale published SHA
          # is explicitly reported, never accepted as production payable.
          # No static old deployment hash or implicit approval to charge.
          EXPECTED_CANONICAL_SHA: ${{ github.event.pull_request.base.sha }}
        # Only three other fixed markets (UKR/BRA/AUS) are queried in PR
        # diagnostics. Main always checks the canonical owner-selected USA
        # pilot. No double probing, no 195-country enumeration, no wallets.
        run: node scripts/agentic/verify-earn-first-live-no-funds.mjs --diagnostic-only --alternate-country-probe
      - name: Verify exact deployed build, 3 category preflights, no funds
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.event_name != 'workflow_run'
        env:
          EXPECTED_CANONICAL_SHA: ${{ github.sha }}
        run: node scripts/agentic/verify-earn-first-live-no-funds.mjs

      # One of two approved three-country/category cohorts per six-hour slot.
      # This broadens discovery at the SAME three POSTs/run and zero B2 costs.
      # Cron is best-effort, published SHA may lag, and no diagnostic authorizes
      # payable offers or production settlement.
      - name: Six-hourly rotating no-funds buyer availability observation
        if: github.event_name == 'schedule'
        env:
          EXPECTED_CANONICAL_SHA: ${{ github.sha }}
        run: node scripts/agentic/verify-earn-first-live-no-funds.mjs --diagnostic-only --auto-country-probe

      # A failed signed-score health (503) does NOT prove that a separately
      # rights-cleared unscored structural baseline is also unavailable.
      # This diagnostic checks three existing bounded buyer examples, without
      # a paid call, and NEVER claims first earning or commercial settlement.
      - name: Check first-revenue structural candidates after actual site health
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
          github.event.workflow_run.head_branch == 'main'
        env:
          EXPECTED_CANONICAL_SHA: ${{ github.sha }}
        run: node scripts/agentic/verify-earn-first-live-no-funds.mjs --diagnostic-only
