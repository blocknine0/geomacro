name: Temp Testnet Live Smoke

on:
  push:
    branches:
      - chore/testnet-live-smoke-rc

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose Lovable production
        shell: bash
        run: |
          set -u
          base="https://geomacro.lovable.app"
          for path in / /testnet-access /testnet-console /api/testnet-tester/me /api/testnet-tester/config /api/testnet-tester/not-a-real-route; do
            body=$(mktemp)
            code=$(curl -sS -L -o "$body" -w '%{http_code}' "$base$path" || echo curl_error)
            echo "LOVABLE $path status=$code bytes=$(wc -c < "$body")"
            case "$path" in
              /testnet-access)
                grep -q 'GET TESTNET USDC' "$body" && echo '  faucet_marker=yes' || echo '  faucet_marker=no'
                grep -q 'geomacro-logo.png' "$body" && echo '  logo_marker=yes' || echo '  logo_marker=no'
                grep -q '0.50 Testnet USDC' "$body" && echo '  price_marker=yes' || echo '  price_marker=no'
                ;;
              /testnet-console)
                grep -q 'TESTNET INTELLIGENCE' "$body" && echo '  console_marker=yes' || echo '  console_marker=no'
                ;;
              /)
                grep -q '>Testnet Access<' "$body" && echo '  nav_hidden=no' || echo '  nav_hidden=yes'
                ;;
            esac
          done
          card=$(mktemp)
          card_code=$(curl -sS -G -o "$card" -w '%{http_code}' \
            --data-urlencode 'subject=USA > CHN' \
            --data-urlencode 'summary=Professional Testnet risk intelligence preview.' \
            --data-urlencode 'score=73' \
            --data-urlencode 'delta=-2.1' \
            --data-urlencode 'confidence=84' \
            --data-urlencode 'chain=Arc Testnet' \
            "$base/api/testnet-tester/card" || echo curl_error)
          echo "LOVABLE /api/testnet-tester/card status=$card_code bytes=$(wc -c < "$card")"
          grep -q 'TESTNET · RISK INTELLIGENCE' "$card" && echo '  card_brand=yes' || echo '  card_brand=no'
          grep -q 'data:image/png;base64,' "$card" && echo '  embedded_logo=yes' || echo '  embedded_logo=no'

      - name: Diagnose custom domain
        shell: bash
        run: |
          set -u
          base="https://geomacro.live"
          for path in / /testnet-access /testnet-console /api/testnet-tester/me /api/testnet-tester/config; do
            body=$(mktemp)
            code=$(curl -sS -L -o "$body" -w '%{http_code}' "$base$path" || echo curl_error)
            echo "CUSTOM $path status=$code bytes=$(wc -c < "$body")"
            case "$path" in
              /testnet-access)
                grep -q 'GET TESTNET USDC' "$body" && echo '  faucet_marker=yes' || echo '  faucet_marker=no'
                ;;
              /testnet-console)
                grep -q 'TESTNET INTELLIGENCE' "$body" && echo '  console_marker=yes' || echo '  console_marker=no'
                ;;
              /)
                grep -q '>Testnet Access<' "$body" && echo '  nav_hidden=no' || echo '  nav_hidden=yes'
                ;;
            esac
          done
