name: Temp Testnet Live Smoke

on:
  push:
    branches:
      - chore/testnet-live-smoke-rc

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live tester surfaces
        shell: bash
        run: |
          set -euo pipefail
          for base in https://geomacro.lovable.app https://geomacro.live; do
            echo "BASE=$base"
            access=$(mktemp)
            console=$(mktemp)
            home=$(mktemp)
            card=$(mktemp)

            access_code=$(curl -sS -L -o "$access" -w '%{http_code}' "$base/testnet-access")
            console_code=$(curl -sS -L -o "$console" -w '%{http_code}' "$base/testnet-console")
            home_code=$(curl -sS -L -o "$home" -w '%{http_code}' "$base/")
            me_code=$(curl -sS -o /tmp/me.json -w '%{http_code}' "$base/api/testnet-tester/me")
            config_code=$(curl -sS -o /tmp/config.json -w '%{http_code}' "$base/api/testnet-tester/config")
            unknown_code=$(curl -sS -o /tmp/unknown.json -w '%{http_code}' "$base/api/testnet-tester/not-a-real-route")
            card_code=$(curl -sS -L -G -o "$card" -w '%{http_code}' \
              --data-urlencode 'subject=USA > CHN' \
              --data-urlencode 'summary=Professional Testnet risk intelligence preview.' \
              --data-urlencode 'score=73' \
              --data-urlencode 'delta=-2.1' \
              --data-urlencode 'confidence=84' \
              --data-urlencode 'chain=Arc Testnet' \
              "$base/api/testnet-tester/card")

            echo "access=$access_code console=$console_code home=$home_code me=$me_code config=$config_code unknown=$unknown_code card=$card_code card_bytes=$(wc -c < "$card")"
            test "$access_code" = 200
            test "$console_code" = 200
            test "$home_code" = 200
            test "$me_code" = 401
            test "$config_code" = 401
            test "$unknown_code" = 404
            test "$card_code" = 200
            grep -q 'GET TESTNET USDC' "$access"
            grep -q 'geomacro-logo.png' "$access"
            grep -q '0.50 Testnet USDC' "$access"
            grep -q '500 credits' "$access"
            grep -q 'TESTNET INTELLIGENCE' "$console"
            grep -q 'TESTNET · RISK INTELLIGENCE' "$card"
            grep -q 'geomacro.live' "$card"
            grep -q 'data:image/png;base64,' "$card"
            if grep -q '>Testnet Access<' "$home"; then
              echo 'Testnet Access is visible in nav before real E2E acceptance.' >&2
              exit 1
            fi
          done
          echo 'LIVE_TESTER_SMOKE_PASS'
