name: P0 Live Alignment Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact 40-character canonical main SHA expected on geomacro.live after Publish changes'
        required: true
        type: string

permissions:
  contents: read

jobs:
  outside-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEOMACRO_LIVE_BASE_URL: https://geomacro.live
      GEOMACRO_LIVE_EXPECTED_HOST: geomacro.live
      GEOMACRO_EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_sha }}
      GEOMACRO_LIVE_SMOKE_TIMEOUT_MS: '15000'
    steps:
      - name: Checkout canonical main diagnostic code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate expected published SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GEOMACRO_EXPECTED_DEPLOYED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=Invalid expected SHA::Expected an exact 40-character commit SHA."
            exit 1
          fi
          if [[ "${GEOMACRO_EXPECTED_DEPLOYED_SHA,,}" != "${GITHUB_SHA,,}" ]]; then
            echo "::error title=Wrong diagnostic revision::Dispatch this workflow from the exact canonical main SHA that was published."
            echo "workflow_sha=${GITHUB_SHA}"
            echo "expected_sha=${GEOMACRO_EXPECTED_DEPLOYED_SHA}"
            exit 1
          fi
          echo "Expected live canonical SHA: ${GEOMACRO_EXPECTED_DEPLOYED_SHA}"

      - name: Prove live build alignment first
        run: node scripts/ops/live-build-sha-smoke.mjs

      - name: Run read-only outside-in P0 live smoke
        run: node scripts/ops/live-launch-surface-smoke.mjs

      - name: Upload outside-in evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p0-live-alignment-${{ github.run_id }}
          path: artifacts/live-launch-surface-smoke.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record safety boundary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## P0 live alignment diagnostic'
            echo
            echo "- Expected canonical SHA: ${GEOMACRO_EXPECTED_DEPLOYED_SHA}"
            echo "- Workflow canonical SHA: ${GITHUB_SHA}"
            echo '- Target: https://geomacro.live'
            echo '- Post-publish manual gate: true'
            echo '- Build SHA checked before route/API diagnosis: true'
            echo '- Read-only outside-in requests only: true'
            echo '- Production mutation performed: false'
            echo '- Payment or settlement performed: false'
            echo '- Mainnet activation performed: false'
            echo '- Load/capacity test performed: false'
          } >> "$GITHUB_STEP_SUMMARY"
