name: P0 Live Alignment Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-live-alignment-diagnostic.yml'
      - 'scripts/ops/live-launch-surface-smoke.mjs'
      - 'src/routes/institutional.tsx'
      - 'src/routes/global-risk.tsx'
      - 'src/routes/intelligence.tsx'
      - 'src/routes/risk-gate.tsx'
      - 'src/routes/data-api.tsx'
      - 'src/routes/api.early-warning.ts'
      - 'public/.well-known/**'
      - 'public/openapi-x402.json'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact 40-character canonical main SHA expected on geomacro.live'
        required: true
        type: string

permissions:
  contents: read

jobs:
  outside-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEOMACRO_LIVE_BASE_URL: https://geomacro.live
      GEOMACRO_LIVE_EXPECTED_HOST: geomacro.live
      GEOMACRO_EXPECTED_DEPLOYED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.expected_sha }}
      GEOMACRO_LIVE_SMOKE_TIMEOUT_MS: '15000'
    steps:
      - name: Checkout diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate expected published SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GEOMACRO_EXPECTED_DEPLOYED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=Invalid expected SHA::Expected an exact 40-character commit SHA."
            exit 1
          fi
          echo "Expected live canonical SHA: ${GEOMACRO_EXPECTED_DEPLOYED_SHA}"

      - name: Run read-only outside-in P0 live smoke
        run: node scripts/ops/live-launch-surface-smoke.mjs

      - name: Upload outside-in evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p0-live-alignment-${{ github.run_id }}
          path: artifacts/live-launch-surface-smoke.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record safety boundary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## P0 live alignment diagnostic'
            echo
            echo "- Expected canonical SHA: ${GEOMACRO_EXPECTED_DEPLOYED_SHA}"
            echo '- Target: https://geomacro.live'
            echo '- Read-only outside-in requests only: true'
            echo '- Production mutation performed: false'
            echo '- Payment or settlement performed: false'
            echo '- Mainnet activation performed: false'
            echo '- Load/capacity test performed: false'
          } >> "$GITHUB_STEP_SUMMARY"
