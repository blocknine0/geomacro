name: Copernicus STAC scene verification (research-only)
on:
  pull_request:
    paths:
      - "global-intelligence/adapters/copernicus-stac-scenes.mjs"
      - "scripts/tests/copernicus-stac-scenes.test.mjs"
      - "scripts/ops/verify-copernicus-stac-scenes.mjs"
      - ".github/workflows/copernicus-stac-scenes.yml"
  push:
    branches: [main]
    paths:
      - "global-intelligence/adapters/copernicus-stac-scenes.mjs"
      - "scripts/tests/copernicus-stac-scenes.test.mjs"
      - "scripts/ops/verify-copernicus-stac-scenes.mjs"
      - ".github/workflows/copernicus-stac-scenes.yml"
  workflow_dispatch:
  schedule:
    - cron: "19 7 * * *"
permissions:
  contents: read
concurrency:
  group: copernicus-stac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: |
          set -euo pipefail
          node --check global-intelligence/adapters/copernicus-stac-scenes.mjs
          node --check scripts/ops/verify-copernicus-stac-scenes.mjs
          node --test scripts/tests/copernicus-stac-scenes.test.mjs
  actual-source-probe:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: parser-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Fetch one bounded original STAC scene collection
        run: node scripts/ops/verify-copernicus-stac-scenes.mjs
      - name: Upload sanitized result; no imagery or raw STAC material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: copernicus-stac-${{ github.run_id }}
          path: artifacts/copernicus-scenes/receipt.json
          if-no-files-found: warn
          retention-days: 7
