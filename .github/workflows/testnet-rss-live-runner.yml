name: Testnet RSS Live Intelligence Runner

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  rss:
    if: ${{ github.repository == 'blocknine0/geomacro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      TELEGRAM_ENABLED: "false"
      BREAKING_RSS_ENABLED: "true"
      BREAKING_RSS_RUN_ONCE: "true"
      BREAKING_RSS_BOOTSTRAP_MAX_ITEMS: "10"
      BREAKING_FEED_USER_AGENT: "Geomacro/1.0 (+https://geomacro.live; contact=contact@geomacro.live)"
      RSS_LIVE_CYCLE_SUMMARY_OUT: /tmp/testnet-rss-cycle.json

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r workers/telegram-flash/requirements.txt

      - name: Validate direct canonical RSS boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL missing"; exit 1; }
          test "${GRI_DB_MODE}" = "direct_postgres"
          test "${TELEGRAM_ENABLED}" = "false"
          test "${BREAKING_RSS_ENABLED}" = "true"
          test "${BREAKING_RSS_RUN_ONCE}" = "true"
          echo "PASS: Testnet RSS runner uses canonical direct-Postgres transport and does not require Supabase Edge."

      - name: Run one complete governed RSS cycle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-rss-live-cycle.mjs 2>&1 | tee /tmp/testnet-rss-live.log
          jq -e '
            .ok == true and
            .transport == "canonical_direct_postgres" and
            .edge_function_dependency == false and
            .source_summary.configured_source_count == .source_summary.completed_source_count and
            .ingestion.accepted == .spool.payloads and
            .corroboration.ok == true and
            .corroboration.threshold_weakening == false and
            .payment_performed == false and
            .execution_authorized == false
          ' /tmp/testnet-rss-cycle.json >/dev/null

      - name: Upload live Testnet RSS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testnet-rss-live-run
          path: |
            /tmp/testnet-rss-live.log
            /tmp/testnet-rss-cycle.json
          if-no-files-found: warn
          retention-days: 14
