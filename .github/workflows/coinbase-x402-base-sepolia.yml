on:
  pull_request:
    paths:
      - "scripts/agentic/coinbase-x402-adaptive-base-sepolia-e2e.mjs"
      - "scripts/agentic/coinbase-x402-base-sepolia-e2e.mjs"
      - "src/lib/coinbase-x402.server.ts"
      - "src/lib/coinbase-x402.server.test.ts"
      - "src/routes/api.x402.risk.ts"
      - "supabase/migrations/927_coinbase_x402_delivery_ledger.sql"
      - ".github/workflows/coinbase-x402-base-sepolia.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select one Coinbase Base Sepolia operation"
        required: true
        default: public-acceptance
        type: choice
        options:
          - public-acceptance
          - paid-e2e
          - adaptive-paid-e2e
      confirmation:
        description: "Paid modes require the exact mode-specific acknowledgement token"
        required: false
        type: string
      client_request_id:
        description: "Optional deterministic client request ID for paid modes"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-workflow:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate acceptance guardrails
        shell: bash
        run: |
          set -euo pipefail
          file=".github/workflows/coinbase-x402-base-sepolia-acceptance.yml"
          grep -q 'workflow_dispatch:' "$file"
          grep -q "github.ref == 'refs/heads/main'" "$file"
          grep -q 'https://geomacro.live/api/x402/risk' "$file"
          grep -q 'eip155:84532' "$file"
          grep -q '0x036CbD53842c5426634e7929541eC2318f3dCF7e' "$file"

          forbidden_cdp="CDP_API_KEY_"'SECRET'
          forbidden_private="PRIVATE_"'KEY'
          forbidden_seed="SEED_"'PHRASE'
          forbidden_mnemonic="MNEMO"'NIC'
          if grep -Fq "$forbidden_cdp" "$file" || \
             grep -Fq "$forbidden_private" "$file" || \
             grep -Fq "$forbidden_seed" "$file" || \
             grep -Fq "$forbidden_mnemonic" "$file"; then
            echo "::error title=Secret-free acceptance violated::This public acceptance workflow must never require payment signing or private credentials."
            exit 1
          fi
          echo "PASS: public Base Sepolia acceptance workflow is main-only and secret-free."

  public-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'public-acceptance' && github.ref == 'refs/heads/main' }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESOURCE_URL: https://geomacro.live/api/x402/risk
      EXPECTED_NETWORK: eip155:84532
      EXPECTED_USDC: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
    steps:
      - name: Check public readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H 'Accept: application/json' \
            "$RESOURCE_URL" > /tmp/coinbase-x402-get.json

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/coinbase-x402-get.json', 'utf8'));
          if (data.ok !== true) throw new Error(`GET readiness not ok: ${JSON.stringify(data)}`);
          if (data.environment !== 'testnet') throw new Error(`Expected testnet, got ${data.environment}`);
          if (data.network !== process.env.EXPECTED_NETWORK) throw new Error(`Wrong network: ${data.network}`);
          if (data.asset !== 'USDC') throw new Error(`Wrong asset label: ${data.asset}`);
          if (data.facilitator !== 'Coinbase CDP') throw new Error(`Wrong facilitator: ${data.facilitator}`);
          if (data.execution_authorized !== false) throw new Error('Risk Gate execution boundary must remain false');
          console.log('PASS: public Coinbase x402 readiness is Base Sepolia and non-executing.');
          NODE

      - name: Validate unpaid 402 challenge and Bazaar declaration
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/coinbase-x402-request.json <<'JSON'
          {
            "subject": { "type": "country", "country_iso3": "USA" },
            "policy_preset": "balanced",
            "action_type": "agent_payment",
            "amount_usdc": 1000,
            "client_request_id": "github-base-sepolia-acceptance"
          }
          JSON

          status="$(curl --silent --show-error --max-time 20 \
            -X POST "$RESOURCE_URL" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/coinbase-x402-request.json \
            --dump-header /tmp/coinbase-x402-headers.txt \
            --output /tmp/coinbase-x402-402.json \
            --write-out '%{http_code}')"
          if [[ "$status" != "402" ]]; then
            echo "::error title=Unexpected x402 status::Expected HTTP 402, received $status"
            cat /tmp/coinbase-x402-402.json
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const headers = fs.readFileSync('/tmp/coinbase-x402-headers.txt', 'utf8').split(/\r?\n/);
          const line = headers.find(v => v.toLowerCase().startsWith('payment-required:'));
          if (!line) throw new Error('PAYMENT-REQUIRED header missing');
          const encoded = line.slice(line.indexOf(':') + 1).trim();
          const required = JSON.parse(Buffer.from(encoded, 'base64').toString('utf8'));
          if (required.x402Version !== 2) throw new Error(`Wrong x402 version: ${required.x402Version}`);
          if (required.resource?.url !== process.env.RESOURCE_URL) throw new Error(`Wrong resource URL: ${required.resource?.url}`);
          if (!Array.isArray(required.accepts) || required.accepts.length !== 1) throw new Error('Expected exactly one payment requirement');
          const accepted = required.accepts[0];
          if (accepted.scheme !== 'exact') throw new Error(`Wrong scheme: ${accepted.scheme}`);
          if (accepted.network !== process.env.EXPECTED_NETWORK) throw new Error(`Wrong network: ${accepted.network}`);
          if (String(accepted.asset).toLowerCase() !== process.env.EXPECTED_USDC.toLowerCase()) throw new Error(`Wrong Base Sepolia USDC contract: ${accepted.asset}`);
          if (!/^0x[a-fA-F0-9]{40}$/.test(String(accepted.payTo ?? ''))) throw new Error('payTo is not a valid EVM address');
          if (!/^[1-9][0-9]*$/.test(String(accepted.amount ?? ''))) throw new Error(`Payment amount must be positive atomic units: ${accepted.amount}`);
          if (accepted.maxTimeoutSeconds !== 60) throw new Error(`Wrong maxTimeoutSeconds: ${accepted.maxTimeoutSeconds}`);
          if (accepted.extra?.name !== 'USDC' || accepted.extra?.version !== '2') throw new Error('USDC metadata mismatch');
          const bazaar = required.extensions?.bazaar;
          if (bazaar?.info?.input?.type !== 'http') throw new Error('Bazaar HTTP input declaration missing');
          if (bazaar?.info?.input?.method !== 'POST') throw new Error('Bazaar POST declaration missing');
          if (bazaar?.info?.input?.bodyType !== 'json') throw new Error('Bazaar JSON body declaration missing');
          if (!bazaar?.info?.input?.body) throw new Error('Bazaar input example missing');
          const schemaInput = bazaar?.schema?.properties?.input;
          const requiredFields = schemaInput?.required ?? [];
          for (const field of ['type', 'method', 'bodyType', 'body']) {
            if (!requiredFields.includes(field)) throw new Error(`Bazaar schema missing required ${field}`);
          }
          console.log('PASS: unpaid 402 challenge is exactly bound to Base Sepolia USDC and carries Bazaar POST metadata.');
          console.log(JSON.stringify({
            network: accepted.network,
            asset: accepted.asset,
            amount: accepted.amount,
            payTo: accepted.payTo,
            resource: required.resource?.url,
          }, null, 2));
          NODE

      - name: Run Coinbase public endpoint validation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/coinbase-validator-request.json
          console.log(JSON.stringify({ resource: process.env.RESOURCE_URL, method: 'POST' }));
          NODE

          curl --fail --silent --show-error --max-time 30 \
            -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/coinbase-validator-request.json \
            > /tmp/coinbase-validator-response.json

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/coinbase-validator-response.json', 'utf8'));
          if (data.valid !== true) throw new Error(`Coinbase validator rejected endpoint: ${JSON.stringify(data)}`);
          if (data.simulation?.outcome !== 'accepted') throw new Error(`Coinbase simulation not accepted: ${JSON.stringify(data)}`);
          console.log('PASS: Coinbase endpoint validator accepted the public Base Sepolia x402 resource.');
          console.log(JSON.stringify({ valid: data.valid, simulation: data.simulation }, null, 2));
          NODE

      - name: Acceptance boundary
        shell: bash
        run: |
          echo "Public readiness, unpaid challenge, Bazaar declaration and Coinbase validator passed."
          echo "This workflow intentionally does NOT sign or settle a payment. Paid E2E/replay evidence remains a separate launch gate."

  adaptive-paid-validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate paid-proof safety boundary
        shell: bash
        run: |
          set -euo pipefail
          file="scripts/agentic/coinbase-x402-adaptive-base-sepolia-e2e.mjs"
          grep -q 'COINBASE_X402_ADAPTIVE_BASE_SEPOLIA_USDC' "$file"
          grep -q 'https://geomacro.live/api/x402/intelligence' "$file"
          grep -q 'https://geomacro.live/api/x402/risk/availability' "$file"
          grep -q 'EXPECTED_AMOUNT_ATOMIC = 50_000n' "$file"
          grep -q 'duplicate_charge_count: 0' "$file"
          grep -q 'payment_signature_persisted: false' "$file"
          grep -q 'private_key_persisted: false' "$file"
          ! grep -q 'I_ACCEPT_REAL_USDC' "$file"
          echo "Adaptive paid proof is pinned to Base Sepolia and cannot activate real-USDC mainnet."

  adaptive-paid-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'blocknine0' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GEOMACRO_COINBASE_X402_ADAPTIVE_E2E_ACK: ${{ inputs.confirmation }}
      GEOMACRO_COINBASE_X402_CLIENT_REQUEST_ID: ${{ inputs.client_request_id }}
      GEOMACRO_COINBASE_X402_ADAPTIVE_E2E_ARTIFACT_DIR: artifacts/coinbase-x402-adaptive-base-sepolia-paid

    steps:
      - name: Validate explicit Base Sepolia payment acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GEOMACRO_COINBASE_X402_ADAPTIVE_E2E_ACK" != "COINBASE_X402_ADAPTIVE_BASE_SEPOLIA_USDC" ]; then
            echo "::error::Adaptive paid proof requires the exact acknowledgement COINBASE_X402_ADAPTIVE_BASE_SEPOLIA_USDC."
            exit 1
          fi
          echo "Explicit adaptive Base Sepolia test payment acknowledgement accepted." >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum settlement: exactly 0.05 test USDC if the data is deliverable." >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate repository buyer secret without printing it
        env:
          GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY: ${{ secrets.COINBASE_X402_BASE_SEPOLIA_PAID_PROOF }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY" ]; then
            echo "::error::Repository Actions secret COINBASE_X402_BASE_SEPOLIA_PAID_PROOF is not configured."
            exit 1
          fi

      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install exact dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Execute one adaptive paid E2E plus replay and underpayment proof
        env:
          GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY: ${{ secrets.COINBASE_X402_BASE_SEPOLIA_PAID_PROOF }}
        run: node scripts/agentic/coinbase-x402-adaptive-base-sepolia-e2e.mjs

      - name: Upload sanitized adaptive paid-proof evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coinbase-x402-adaptive-base-sepolia-paid-proof-${{ github.run_id }}
          path: artifacts/coinbase-x402-adaptive-base-sepolia-paid/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Record proof boundary
        if: always()
        shell: bash
        run: |
          echo "Network: Base Sepolia / eip155:84532" >> "$GITHUB_STEP_SUMMARY"
          echo "Asset: Base Sepolia USDC" >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum authorized payment per run: 0.05 test USDC" >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Private key persisted in evidence: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw PAYMENT-SIGNATURE persisted in evidence: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Base mainnet acknowledgement changed: false" >> "$GITHUB_STEP_SUMMARY"

  paid-e2e:
    if: ${{ github.actor == 'blocknine0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEOMACRO_COINBASE_X402_E2E_ACK: ${{ inputs.confirmation }}
      GEOMACRO_COINBASE_X402_CLIENT_REQUEST_ID: ${{ inputs.client_request_id }}
      GEOMACRO_COINBASE_X402_E2E_ARTIFACT_DIR: artifacts/coinbase-x402-base-sepolia-paid

    steps:
      - name: Validate explicit Base Sepolia payment acknowledgement
        shell: bash
        run: |
          if [ "$GEOMACRO_COINBASE_X402_E2E_ACK" != "COINBASE_X402_BASE_SEPOLIA_USDC" ]; then
            echo "::error::Paid Base Sepolia proof requires the exact acknowledgement COINBASE_X402_BASE_SEPOLIA_USDC."
            exit 1
          fi
          echo "Explicit Base Sepolia test payment acknowledgement accepted." >> "$GITHUB_STEP_SUMMARY"
          echo "Hard per-run payment cap: 0.05 test USDC." >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate repository buyer secret without printing it
        shell: bash
        env:
          GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY: ${{ secrets.COINBASE_X402_BASE_SEPOLIA_PAID_PROOF }}
        run: |
          if [ -z "$GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY" ]; then
            echo "::error::Repository Actions secret COINBASE_X402_BASE_SEPOLIA_PAID_PROOF is not configured."
            exit 1
          fi

      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install exact dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Execute one explicitly acknowledged paid Base Sepolia E2E plus replay proof
        env:
          GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY: ${{ secrets.COINBASE_X402_BASE_SEPOLIA_PAID_PROOF }}
        run: node scripts/agentic/coinbase-x402-base-sepolia-e2e.mjs

      - name: Upload sanitized paid-proof evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coinbase-x402-base-sepolia-paid-proof-${{ github.run_id }}
          path: artifacts/coinbase-x402-base-sepolia-paid/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Record proof boundary
        if: always()
        shell: bash
        run: |
          echo "Network: Base Sepolia / eip155:84532" >> "$GITHUB_STEP_SUMMARY"
          echo "Asset: Base Sepolia USDC" >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum authorized payment per run: 0.05 test USDC" >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Private key persisted in evidence: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw PAYMENT-SIGNATURE persisted in evidence: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution authorization from Risk Gate: false" >> "$GITHUB_STEP_SUMMARY"

