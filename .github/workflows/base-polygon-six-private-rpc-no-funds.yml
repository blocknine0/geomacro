name: Base Polygon Six Private RPC No-Funds Acceptance

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/lib/no-card-rpc-readiness.server.ts"
      - "src/lib/no-card-rpc-readiness.server.test.ts"
      - "src/routes/api.v1.payments.networks.ts"
      - "scripts/ops/verify-merchant-six-rpc-no-funds.mjs"
      - ".github/workflows/base-polygon-six-private-rpc-no-funds.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-private-six-rpc-read-only
  cancel-in-progress: true

jobs:
  verify-no-funds:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: production
    steps:
      - name: Checkout canonical main (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify owner-backed six production RPC reads without payment or exposed secrets
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/verify-merchant-six-rpc-no-funds.mjs
      - name: Retain sanitized no-funds acceptance or blocker artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-production-six-private-rpc-no-funds
          path: artifacts/base-polygon-rpc-readiness/receipt.json
          if-no-files-found: warn
          retention-days: 7
