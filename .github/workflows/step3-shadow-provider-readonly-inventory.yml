name: Step3 Shadow D1/R2 Worker Inventory — Read Only, No Funds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/step3-shadow-provider-readonly-inventory.yml
      - scripts/ops/audit-step3-shadow-provider-readonly.mjs
  pull_request:
    paths:
      - .github/workflows/step3-shadow-provider-readonly-inventory.yml
      - scripts/ops/audit-step3-shadow-provider-readonly.mjs
      - scripts/tests/audit-step3-shadow-provider-readonly.test.mjs
permissions:
  contents: read
concurrency:
  group: geomacro-step3-shadow-provider-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --check scripts/ops/audit-step3-shadow-provider-readonly.mjs
      - run: node --test scripts/tests/audit-step3-shadow-provider-readonly.test.mjs
  provider-readonly:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
      GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET: ${{ vars.GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET }}
      GEOMACRO_D1_RECOVERY_R2_BUCKET: ${{ vars.GEOMACRO_D1_RECOVERY_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Shadow-only bounded D1 schema/index inventory and private R2 Worker metadata
        run: node scripts/ops/audit-step3-shadow-provider-readonly.mjs
      - name: Preserve sanitized HOLD or inventory receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-shadow-provider-inventory-${{ github.run_id }}
          path: artifacts/release/step3-shadow-provider-readonly-inventory.json
          retention-days: 14
          if-no-files-found: warn
