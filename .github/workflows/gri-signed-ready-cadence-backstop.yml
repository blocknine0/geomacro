name: GRI v1.2 Genuine Signed Ready Cadence Backstop (No Funds)

# Missed-dispatch safety net, NOT an unreviewed ingestion-to-GRI bridge.
# Repository variables carry immutable *hints* only; private reviewer
# signatures and canonical scoring are checked independently downstream.
on:
  schedule:
    # Every 15m, because authentic independently approved hints expire
    # after 28m; a 30m-only cadence could entirely miss a real signed pair.
    # This runs metadata-only until real immutable SHA pointers are present.
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch: {}
  # Event-driven continuation of the ALREADY working free news ingestion.
  # This event is just a wakeup: independently approved pinned signed GRI
  # inputs remain mandatory before the protected publisher can run.
  workflow_run:
    workflows: ["Auto Ingest News"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/gri-signed-ready-cadence-backstop.yml"
      - "scripts/lib/gri-signed-ready-cadence-hint.mjs"
      - "scripts/lib/gri-signed-ready-cadence-hint.test.mjs"
      - "scripts/ops/dispatch-gri-signed-ready-cadence.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gri-signed-ready-cadence-backstop.yml"
      - "scripts/lib/gri-signed-ready-cadence-hint.mjs"
      - "scripts/lib/gri-signed-ready-cadence-hint.test.mjs"
      - "scripts/ops/dispatch-gri-signed-ready-cadence.mjs"

permissions:
  contents: read
concurrency:
  group: geomacro-gri-signed-ready-cadence-backstop
  cancel-in-progress: false

jobs:
  admission-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Fail-closed immutable reviewed input hint tests
        run: node --test scripts/lib/gri-signed-ready-cadence-hint.test.mjs

  enqueue-approved-review:
    needs: admission-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        (github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch' ||
         github.event.workflow_run.event == 'push')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      EXPECTED_CANONICAL_MAIN_SHA: ${{ github.sha }}
      GRI_READY_REVIEWED_SHA256: ${{ vars.GRI_READY_REVIEWED_SHA256 }}
      GRI_READY_CERTIFICATES_SHA256: ${{ vars.GRI_READY_CERTIFICATES_SHA256 }}
      GRI_READY_APPROVED_AT: ${{ vars.GRI_READY_APPROVED_AT }}
      GRI_SOURCE_WORKFLOW_VERIFIED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha && '1' || '0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Require protected exact main and strict canonical GRI target
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_CANONICAL_MAIN_SHA" = "$(git rev-parse HEAD)"
          test -f .github/workflows/gri-v12-supabase-free-reviewed-current.yml
          grep -Fq 'types: [gri_reviewed_current_ready]' .github/workflows/gri-v12-supabase-free-reviewed-current.yml
          grep -Fq 'CURRENT_GRI_IMMUTABLE_INPUT_KEY_SHA_NOT_BOUND' .github/workflows/gri-v12-supabase-free-reviewed-current.yml
      - name: Resume only recently approved independently signed GRI inputs after actual news completion or cadence
        # Metadata-only GitHub recent-run check prevents repeat B2 publication
        # attempts for the same main SHA and external approval timestamp.
        run: node scripts/ops/dispatch-gri-signed-ready-cadence.mjs
