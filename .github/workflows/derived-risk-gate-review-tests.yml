name: Derived Risk Gate Review Tests

on:
  pull_request:
    paths:
      - "scripts/lib/official-original-issuer-rights.mjs"
      - "scripts/lib/derived-risk-gate-review-loop.test.mjs"
      - "scripts/lib/facts-only-gri-v12-dual-attestation.test.mjs"
      - ".github/workflows/derived-risk-gate-review-tests.yml"
      - "workers/control-plane/src/derived-risk-gate-discovery-bridge.mjs"
      - "workers/control-plane/src/index.mjs"
      - "workers/control-plane/migrations/0117_derived_risk_gate_discovery_bridge.sql"
      - "scripts/ops/ingest-derived-risk-gate-discovery.mjs"
      - "scripts/tests/derived-risk-gate-discovery-bridge.test.mjs"
      - "scripts/tests/derived-risk-gate-website-raw.test.mjs"
      - "workers/control-plane/src/derived-risk-gate-website-raw.mjs"
      - "workers/control-plane/migrations/0119_derived_risk_gate_website_raw.sql"
      - "workers/control-plane/src/risk-gate-three-tier-product.mjs"
      - "workers/control-plane/src/unified-risk-gate.mjs"
      - "scripts/tests/risk-gate-three-tier-product.test.mjs"
      - "src/lib/capability-pricing-catalog.ts"
      - "src/lib/capability-structured-output-contract.ts"
      - ".github/workflows/derived-risk-gate-discovery-20m.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/official-original-issuer-rights.mjs"
      - "scripts/lib/derived-risk-gate-review-loop.test.mjs"
      - "scripts/lib/facts-only-gri-v12-dual-attestation.test.mjs"
      - ".github/workflows/derived-risk-gate-review-tests.yml"
      - "workers/control-plane/src/derived-risk-gate-discovery-bridge.mjs"
      - "workers/control-plane/src/index.mjs"
      - "workers/control-plane/migrations/0117_derived_risk_gate_discovery_bridge.sql"
      - "scripts/ops/ingest-derived-risk-gate-discovery.mjs"
      - "scripts/tests/derived-risk-gate-discovery-bridge.test.mjs"
      - "scripts/tests/derived-risk-gate-website-raw.test.mjs"
      - "workers/control-plane/src/derived-risk-gate-website-raw.mjs"
      - "workers/control-plane/migrations/0119_derived_risk_gate_website_raw.sql"
      - "workers/control-plane/src/risk-gate-three-tier-product.mjs"
      - "workers/control-plane/src/unified-risk-gate.mjs"
      - "scripts/tests/risk-gate-three-tier-product.test.mjs"
      - "src/lib/capability-pricing-catalog.ts"
      - "src/lib/capability-structured-output-contract.ts"
      - ".github/workflows/derived-risk-gate-discovery-20m.yml"

permissions:
  contents: read

jobs:
  facts-only-review:
    name: Restricted-source and independent proof policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify Risk Gate review loop and independently signed proof rules
        run: node --test scripts/lib/derived-risk-gate-review-loop.test.mjs scripts/lib/facts-only-gri-v12-dual-attestation.test.mjs scripts/tests/derived-risk-gate-discovery-bridge.test.mjs scripts/tests/derived-risk-gate-website-raw.test.mjs scripts/tests/risk-gate-three-tier-product.test.mjs
