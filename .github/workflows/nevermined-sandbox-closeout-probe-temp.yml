name: Nevermined Sandbox Closeout Probe

on:
  push:
    branches:
      - feat/commercial-prelaunch-closeout
    paths:
      - ".github/workflows/nevermined-sandbox-closeout-probe-temp.yml"

permissions:
  contents: read

jobs:
  sandbox-settlement-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEVERMINED_X402_ENVIRONMENT: sandbox
      NEVERMINED_NVM_API_KEY: ${{ secrets.NEVERMINED_SANDBOX_NVM_API_KEY }}
      NEVERMINED_PLAN_ID: ${{ vars.NEVERMINED_SANDBOX_PLAN_ID }}
      NEVERMINED_X402_SCHEME: nvm:erc4337
      NEVERMINED_X402_MAX_AMOUNT: ${{ vars.NEVERMINED_SANDBOX_MAX_AMOUNT }}
      NEVERMINED_SANDBOX_X402_ACCESS_TOKEN: ${{ secrets.NEVERMINED_SANDBOX_X402_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-prelaunch-closeout
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prove sandbox-only configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${NEVERMINED_X402_ENVIRONMENT}" != "sandbox" ]]; then
            echo "ERROR: probe must remain sandbox-only" >&2
            exit 1
          fi
          if [[ -n "${GEOMACRO_COMMERCIAL_LAUNCH_ACK:-}" ]]; then
            echo "ERROR: coordinated production launch acknowledgement must be absent" >&2
            exit 1
          fi
          missing=0
          for name in NEVERMINED_NVM_API_KEY NEVERMINED_PLAN_ID NEVERMINED_X402_MAX_AMOUNT NEVERMINED_SANDBOX_X402_ACCESS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "MISSING_PRELAUNCH_INPUT=$name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "ERROR: Nevermined sandbox credentials/plan/token are not fully configured" >&2
            exit 2
          fi
      - name: Run real sandbox verify and settle acceptance
        run: bun scripts/nevermined-sandbox-acceptance.ts artifacts/nevermined-sandbox-closeout.json
      - name: Validate non-revenue evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/nevermined-sandbox-closeout.json';
          const e = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (e.environment !== 'sandbox') throw new Error('environment must be sandbox');
          if (e.commercial_revenue !== false) throw new Error('sandbox must be non-revenue');
          if (e.production_activation_performed !== false) throw new Error('production activation must be false');
          if (e.secrets_recorded !== false || e.payer_identity_recorded !== false) throw new Error('privacy boundary failed');
          if (e.verify_valid !== true || e.settlement_evidence_valid !== true) throw new Error('sandbox settlement evidence incomplete');
          NODE
      - name: Upload sandbox evidence
        uses: actions/upload-artifact@v4
        with:
          name: nevermined-sandbox-closeout-${{ github.sha }}
          path: artifacts/nevermined-sandbox-closeout.json
          if-no-files-found: error
          retention-days: 90
