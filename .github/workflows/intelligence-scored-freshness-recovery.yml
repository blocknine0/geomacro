name: Intelligence Scored Freshness Recovery

on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
    inputs:
      force_recovery:
        description: "Force one bounded recovery pass even when the scored feed is current"
        required: true
        default: false
        type: boolean
      lookback_hours:
        description: "Forced recovery lookback in hours (1-168)"
        required: true
        default: "96"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/intelligence-scored-freshness-recovery.yml"
      - "scripts/ingest-news.js"
      - "scripts/lib/direct-postgres-supabase-loader.mjs"
      - "scripts/lib/gri-db-client.mjs"
      - "scripts/lib/no-guardian-node-fetch.mjs"
      - "scripts/ops/publish-b2-public-intelligence-direct-postgres.mjs"
      - "src/lib/public-intelligence-production.server.ts"

permissions:
  contents: read

# Serialize with Auto Ingest News so both paths never consume discovery/classifier
# quotas at the same time. The normal publisher remains isolated and cheap.
concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  recover-stale-scored-intelligence:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      GRI_DB_MODE: direct_postgres
      GEOMACRO_DISABLE_GUARDIAN: "true"
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install locked runtime dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require direct database, B2, and Guardian-disabled boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SUPABASE_PROJECT_REF" = "ldpwajisioljyjtojvfx"
          test "$GRI_DB_MODE" = "direct_postgres"
          test "$GEOMACRO_DISABLE_GUARDIAN" = "true"
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL is required"; exit 2; }
          test -n "${B2_KEY_ID:-}" || { echo "B2_KEY_ID is required"; exit 2; }
          test -n "${B2_APPLICATION_KEY:-}" || { echo "B2_APPLICATION_KEY is required"; exit 2; }

      - name: Require reviewed current discovery source rights
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const { data, error } = await db
            .from('live_external_sources')
            .select('source_id,commercial_usage_status,enabled_for_ingestion,enabled_for_commercial_signals')
            .eq('source_id', 'gdelt_v2_events')
            .limit(1);
          if (error) throw new Error(error.message);
          const row = data?.[0];
          if (!row) throw new Error('PRODUCTION_SOURCE_MISSING:gdelt_v2_events');
          if (row.commercial_usage_status !== 'COMMERCIAL_OK') throw new Error('PRODUCTION_SOURCE_RIGHTS_NOT_OK:gdelt_v2_events');
          if (!row.enabled_for_ingestion || !row.enabled_for_commercial_signals) {
            throw new Error('PRODUCTION_SOURCE_NOT_ENABLED:gdelt_v2_events');
          }
          console.log(JSON.stringify({ ok: true, source_id: row.source_id, guardian_commercial_dependency: false }));
          NODE

      - name: Plan stale-only scored recovery
        id: plan
        shell: bash
        env:
          FORCE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_recovery || false }}
          FORCED_LOOKBACK_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_hours || '96' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/intelligence-freshness
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';

          const categories = ['geopolitics', 'macro', 'rare_earth'];
          const version = 'event-severity-v1.0.5';
          const targetAgeMs = 2 * 60 * 60 * 1000;
          const maxLookbackHours = 168;
          const now = Date.now();
          const db = createGriDbClient();
          const since = new Date(now - 31 * 24 * 60 * 60 * 1000).toISOString();
          const { data, error } = await db
            .from('events')
            .select('category,severity,published_at,created_at,classification_version')
            .in('category', categories)
            .eq('classification_version', version)
            .gte('created_at', since)
            .order('created_at', { ascending: false })
            .limit(600);
          if (error) throw new Error(error.message);

          const latest = Object.fromEntries(categories.map((category) => [category, null]));
          for (const row of data ?? []) {
            if (!categories.includes(row.category)) continue;
            const severity = Number(row.severity);
            if (!Number.isFinite(severity) || severity < 0 || severity > 100) continue;
            const timestamp = Date.parse(String(row.published_at ?? row.created_at ?? ''));
            if (!Number.isFinite(timestamp) || timestamp > now + 5 * 60 * 1000) continue;
            latest[row.category] = Math.max(Number(latest[row.category] ?? 0), timestamp);
          }

          const missing = categories.filter((category) => !latest[category]);
          const ages = categories
            .filter((category) => latest[category])
            .map((category) => Math.max(0, now - Number(latest[category])));
          const oldestAgeMs = missing.length > 0 ? maxLookbackHours * 60 * 60 * 1000 : Math.max(...ages, 0);
          const force = String(process.env.FORCE_RECOVERY ?? '').toLowerCase() === 'true';
          const forcedLookback = Number(process.env.FORCED_LOOKBACK_HOURS ?? 96);
          if (!Number.isInteger(forcedLookback) || forcedLookback < 1 || forcedLookback > maxLookbackHours) {
            throw new Error('FORCED_LOOKBACK_HOURS_INVALID');
          }
          const needsRecovery = force || missing.length > 0 || oldestAgeMs > targetAgeMs;
          const adaptiveLookback = oldestAgeMs > 24 * 60 * 60 * 1000
            ? Math.min(maxLookbackHours, Math.max(96, Math.ceil(oldestAgeMs / 3_600_000) + 6))
            : 12;
          const lookbackHours = force ? forcedLookback : adaptiveLookback;
          const latestIso = Object.fromEntries(
            categories.map((category) => [
              category,
              latest[category] ? new Date(Number(latest[category])).toISOString() : null,
            ]),
          );
          const report = {
            schema: 'geomacro.intelligence-scored-recovery-plan.v1',
            generated_at: new Date(now).toISOString(),
            classification_version: version,
            freshness_target_minutes: targetAgeMs / 60_000,
            needs_recovery: needsRecovery,
            forced: force,
            lookback_hours: lookbackHours,
            latest_by_category: latestIso,
            missing_categories: missing,
            synthetic_score: false,
            guardian_commercial_dependency: false,
            destructive_change: false,
          };
          writeFileSync('artifacts/intelligence-freshness/recovery-plan.json', JSON.stringify(report, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `needs_recovery=${needsRecovery}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `lookback_hours=${lookbackHours}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `max_article_age_ms=${lookbackHours * 3_600_000}\n`);
          console.log(JSON.stringify(report));
          NODE

      - name: Catch up classifier-scored current evidence
        if: steps.plan.outputs.needs_recovery == 'true'
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_INGEST_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_INGEST_MODEL }}
          GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_INGEST_MODEL }}
          CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          GROQ_BATCH_DELAY_MS: ${{ vars.GROQ_BATCH_DELAY_MS }}
          GROQ_MAX_REQUESTS_PER_RUN: "18"
          GROQ_MIN_REMAINING_REQUESTS: ${{ vars.GROQ_MIN_REMAINING_REQUESTS }}
          GROQ_MIN_REMAINING_TOKENS: ${{ vars.GROQ_MIN_REMAINING_TOKENS }}
          GROQ_MAX_WAIT_MS: "180000"
          GROQ_BATCH_SIZE: "2"
          MAX_CANDIDATES_PER_CATEGORY: "6"
          GUARDIAN_QUERY_BUDGET_PER_CATEGORY: "0"
          NEWS_QUERY_DELAY_MS: ${{ vars.NEWS_QUERY_DELAY_MS }}
          NEWS_MAX_RETRIES: "2"
          MAX_ARTICLE_AGE_MS: ${{ steps.plan.outputs.max_article_age_ms }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY }}
          RELIEFWEB_ENABLED: "false"
          GDACS_ENABLED: "true"
        run: node scripts/ingest-news.js

      - name: Publish scored verified Intelligence package to B2
        run: bun scripts/ops/publish-b2-public-intelligence-direct-postgres.mjs | tee artifacts/intelligence-freshness/publish.json

      - name: Require current scored B2 serving after recovery
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for attempt in 1 2 3 4 5 6; do
            body="$(mktemp)"
            code="$(curl -L -sS -o "$body" -w '%{http_code}' --max-time 20 -H 'Accept: application/json' 'https://geomacro.live/api/public/intelligence' || true)"
            if [ "$code" = "200" ] && node - "$body" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(body?.rows) ? body.rows : [];
          const required = new Set(['geopolitics','macro','rare_earth']);
          const seen = new Set();
          const newest = Date.parse(String(body?.newest_at ?? ''));
          let ok = body?.ok === true && body?.mode === 'verified_b2' && body?.current_within_24h === true;
          ok = ok && Number(body?.live_observed_rows) === 0 && Number.isFinite(newest) && newest >= Date.now() - 24 * 60 * 60 * 1000;
          for (const row of rows) {
            const severity = Number(row?.severity);
            const category = String(row?.category ?? '');
            if (!Number.isFinite(severity) || severity < 0 || severity > 100 || row?.public_status !== 'verified_b2') ok = false;
            if (!String(row?.source_title ?? '').startsWith('Geomacro finds ')) ok = false;
            if (required.has(category)) seen.add(category);
          }
          for (const category of required) if (!seen.has(category)) ok = false;
          process.exit(ok ? 0 : 1);
          NODE
            then
              cp "$body" artifacts/intelligence-freshness/public-api.json
              success=true
              break
            fi
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo "::error::Public Intelligence did not become current after bounded recovery; refusing synthetic freshness."
            exit 1
          fi

      - name: Upload Intelligence freshness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: intelligence-freshness-${{ github.run_id }}
          path: artifacts/intelligence-freshness/
          if-no-files-found: error
          retention-days: 30
