name: Risk Stream Evidence-to-GRO Offline Contract
on:
  pull_request:
    paths:
      - 'workers/control-plane/src/risk-stream-*.mjs'
      - 'workers/control-plane/src/risk-gate-global-news-search.mjs'
      - 'workers/control-plane/migrations/0224_risk_stream_search_topic_tags.sql'
      - 'scripts/lib/global-risk-query-taxonomy.mjs'
      - 'scripts/lib/global-risk-query-taxonomy.d.mts'
      - 'scripts/lib/p0b-live-global-search.mjs'
      - 'scripts/lib/p0b-event-grounded-projection.mjs'
      - 'scripts/tests/p0b-live-global-search.test.mjs'
      - 'scripts/tests/risk-gate-global-news-search.test.mjs'
      - 'src/lib/hot-topic-taxonomy.ts'
      - 'src/lib/ask-realtime-query-plan.ts'
      - 'src/lib/ask-realtime-search.server.ts'
      - 'src/__tests__/global-risk-query-taxonomy.test.ts'
      - 'workers/control-plane/src/risk-gap-enrichment.mjs'
      - 'scripts/lib/phase2h-country-originals-195.mjs'
      - 'workers/risk-stream-shadow/**'
      - 'scripts/ops/push-risk-stream-shadow-jsonl.mjs'
      - 'scripts/ops/verify-risk-stream-b2-live-governor.mjs'
      - 'scripts/ops/run-risk-stream-shadow-provider-audit.mjs'
      - 'scripts/lib/risk-stream-source-rights-manifest.mjs'
      - 'scripts/lib/country-source-gap-finder.mjs'
      - 'config/global-institutional-source-candidates.v1.json'
      - 'scripts/ops/discover-global-institutional-sources.mjs'
      - 'scripts/tests/global-institutional-sources.test.mjs'
      - 'scripts/ops/discover-missing-country-sources.mjs'
      - 'scripts/tests/country-source-gap-finder.test.mjs'
      - 'scripts/lib/risk-stream-event-fingerprint.mjs'
      - 'scripts/lib/risk-stream-candidate-builder.mjs'
      - 'scripts/lib/risk-stream-pairing.mjs'
      - 'scripts/ops/emit-risk-stream-candidates.mjs'
      - 'scripts/ops/emit-risk-stream-collector-sidecar.mjs'
      - 'scripts/ops/register-risk-stream-source.mjs'
      - 'scripts/ops/hot50-standard-feasibility.mjs'
      - 'config/risk-stream-source-rights-reviewed.v1.json'
      - '.github/workflows/apply-risk-stream-source-registry.yml'
      - '.github/workflows/risk-stream-shadow-provider-audit.yml'
      - 'workers/control-plane/migrations/0214_risk_stream_event_driven.sql'
      - 'workers/control-plane/migrations/0216_risk_stream_commercial_derived_outbox.sql'
      - 'workers/control-plane/migrations/0217_risk_stream_commercial_issuer_jobs.sql'
      - 'workers/risk-stream-shadow-ack/**'
      - 'workers/risk-stream-facts-attester/**'
      - 'workers/risk-stream-rights-attester/**'
      - 'workers/geomacro-release-reviewer/**'
      - 'workers/unified-ingestor/**'
      - 'scripts/tests/risk-stream-shadow-ack-handshake.test.mjs'
      - 'scripts/tests/risk-stream-attesters.test.mjs'
      - 'scripts/tests/geomacro-release-reviewer.test.mjs'
      - 'scripts/tests/risk-stream-*.test.mjs'
      - '.github/workflows/risk-stream-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-gated-risk-stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install collector test runtime dependencies
        run: python -m pip install "fastapi==0.116.1" "pydantic==2.11.7"
      - name: Parse Worker modules, migration and offline test harness
        run: |
          node --check scripts/lib/global-risk-query-taxonomy.mjs
          node --check scripts/lib/p0b-live-global-search.mjs
          node --check scripts/lib/p0b-event-grounded-projection.mjs
          node --check workers/control-plane/src/risk-gate-global-news-search.mjs
          node --check workers/control-plane/src/risk-stream-autonomous-hot50.mjs
          node --check workers/control-plane/src/risk-stream-pipeline.mjs
          node --check workers/control-plane/src/risk-stream-attester-bridge.mjs
          node --check workers/control-plane/src/risk-stream-seven-day-chain.mjs
          node --check workers/control-plane/src/risk-stream-commercial-license.mjs
          node --check workers/control-plane/src/risk-stream-commercial-outbox.mjs
          node --check workers/control-plane/src/risk-stream-commercial-issuer.mjs
          node --check workers/control-plane/src/risk-stream-item-license-guard.mjs
          node --check workers/risk-stream-shadow/src/commercial-e2e.mjs
          node --check workers/risk-stream-shadow-ack/src/index.mjs
          node --check workers/risk-stream-facts-attester/src/index.mjs
          node --check workers/risk-stream-rights-attester/src/index.mjs
          node --check workers/geomacro-release-reviewer/src/index.mjs
          node --check workers/control-plane/src/risk-stream-index-listener.mjs
          node --check scripts/tests/risk-stream-seven-day-chain.test.mjs
          node --check scripts/tests/risk-stream-commercial-migration.test.mjs
          node --check scripts/tests/risk-stream-commercial-license.test.mjs
          node --check scripts/tests/risk-stream-index-listener.test.mjs
          node --check workers/control-plane/src/risk-stream-open-derived.mjs
          node --check workers/control-plane/src/risk-stream-open-search.mjs
          node --check workers/control-plane/src/risk-gap-enrichment.mjs
          node --check scripts/tests/risk-stream-open-derived.test.mjs
          node --check scripts/tests/risk-stream-pipeline.test.mjs
          node --check workers/control-plane/src/risk-stream-b2-governor.mjs
          node --check scripts/tests/risk-stream-b2-governor.test.mjs
          node --check workers/control-plane/src/risk-stream-delivery.mjs
          node --check scripts/tests/risk-stream-delivery.test.mjs
          node --check scripts/tests/risk-stream-migration.test.mjs
          node --check scripts/ops/push-risk-stream-jsonl.mjs
          node --check workers/risk-stream-shadow/src/index.mjs
          node --check scripts/ops/push-risk-stream-shadow-jsonl.mjs
          node --check scripts/ops/verify-risk-stream-b2-live-governor.mjs
          node --check scripts/ops/run-risk-stream-shadow-provider-audit.mjs
          node --check scripts/ops/verify-risk-stream-b2-d1-shadow-readonly.mjs
          node --check scripts/tests/risk-stream-shadow-contract.test.mjs scripts/tests/risk-stream-open-derived.test.mjs scripts/tests/risk-stream-commercial-license.test.mjs scripts/tests/risk-stream-index-listener.test.mjs
          node --check scripts/lib/risk-stream-source-rights-manifest.mjs
          node --check scripts/ops/register-risk-stream-source.mjs
          node --check scripts/ops/hot50-standard-feasibility.mjs
          node --check scripts/lib/country-source-gap-finder.mjs
          node --check scripts/ops/discover-missing-country-sources.mjs
          node --check scripts/ops/discover-global-institutional-sources.mjs
          node --check scripts/tests/global-institutional-sources.test.mjs
          node --check workers/control-plane/src/risk-stream-dual-audience.mjs
          node --check scripts/tests/country-source-gap-finder.test.mjs
          node --check scripts/tests/risk-stream-source-rights-manifest.test.mjs
          node --check scripts/tests/risk-stream-item-license-guard.test.mjs
          node --check scripts/lib/risk-stream-event-fingerprint.mjs
          node --check scripts/lib/risk-stream-candidate-builder.mjs
          node --check scripts/lib/risk-stream-pairing.mjs
          node --check scripts/ops/emit-risk-stream-candidates.mjs
          node --check scripts/ops/emit-risk-stream-collector-sidecar.mjs
          python -m py_compile workers/unified-ingestor/ingestor.py workers/unified-ingestor/test_risk_stream_candidate_handoff.py
          node --check scripts/tests/risk-stream-event-fingerprint.test.mjs
          node --check scripts/tests/risk-stream-candidate-builder.test.mjs
          node --check scripts/tests/risk-stream-pairing.test.mjs
          node --check scripts/tests/risk-stream-emitter.test.mjs
          node --check scripts/tests/risk-stream-feed-export.test.mjs
          node --check scripts/tests/risk-stream-attesters.test.mjs
          node --check scripts/tests/risk-stream-attester-bridge.test.mjs
          node --check scripts/tests/geomacro-release-reviewer.test.mjs
          node --check scripts/ops/ingest-direct-global-corridors.mjs
          grep -q "CREATE TABLE IF NOT EXISTS risk_stream_signed_gro" workers/control-plane/migrations/0214_risk_stream_event_driven.sql
          grep -Fq "topic_tags_json TEXT NOT NULL DEFAULT '[]'" workers/control-plane/migrations/0224_risk_stream_search_topic_tags.sql
          grep -Fq "affected_assets_json TEXT NOT NULL DEFAULT '[]'" workers/control-plane/migrations/0224_risk_stream_search_topic_tags.sql
      - name: Verify rotating global topic queries and P0-B coverage
        run: node --test scripts/tests/risk-gate-global-news-search.test.mjs scripts/tests/p0b-live-global-search.test.mjs
      - name: Simulate 220 original events, R2 readback, D1 503 and cryptographic signing
        run: node --test scripts/tests/risk-stream-pipeline.test.mjs scripts/tests/risk-stream-b2-governor.test.mjs scripts/tests/risk-stream-delivery.test.mjs scripts/tests/risk-stream-migration.test.mjs scripts/tests/risk-stream-shadow-contract.test.mjs scripts/tests/risk-stream-open-derived.test.mjs scripts/tests/risk-stream-commercial-license.test.mjs scripts/tests/risk-stream-index-listener.test.mjs scripts/tests/risk-stream-seven-day-chain.test.mjs scripts/tests/risk-stream-autonomous-hot50.test.mjs scripts/tests/risk-stream-commercial-migration.test.mjs scripts/tests/risk-stream-commercial-issuer.test.mjs scripts/tests/risk-stream-commercial-shadow-e2e.test.mjs scripts/tests/risk-stream-shadow-ack-handshake.test.mjs scripts/tests/risk-stream-source-rights-manifest.test.mjs scripts/tests/risk-stream-event-fingerprint.test.mjs scripts/tests/risk-stream-candidate-builder.test.mjs scripts/tests/risk-stream-pairing.test.mjs scripts/tests/risk-stream-emitter.test.mjs scripts/tests/risk-stream-feed-export.test.mjs scripts/tests/risk-stream-attesters.test.mjs scripts/tests/risk-stream-attester-bridge.test.mjs scripts/tests/geomacro-release-reviewer.test.mjs scripts/tests/risk-stream-paid-composed-e2e.test.mjs scripts/tests/risk-stream-collector-handoff.test.mjs scripts/tests/country-source-gap-finder.test.mjs scripts/tests/global-institutional-sources.test.mjs
      - name: Verify Render original-candidate handoff accepts no metadata-only items
        run: python workers/unified-ingestor/test_risk_stream_candidate_handoff.py
