name: Auto Ingest News
# Runs every 2 hours as the first step in the flagship intelligence pipeline.
# Fresh admitted evidence is structured and can trigger a verified GRI publish
# when canonical inputs change. Prediction-market creation is not part of this
# scheduled pipeline.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-ingest-news.yml"
      - "supabase/migrations/955_realtime_event_family_lifecycle.sql"
      - "supabase/migrations/956_event_family_version_ledger.sql"
      - "supabase/migrations/957_repair_federico_event_family_schema.sql"
      - "scripts/ingest-news.js"

permissions:
  contents: read

concurrency:
  group: intelligence-ingest
  cancel-in-progress: false

jobs:
  ingest-news:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify authoritative Supabase target before privileged writes
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: node scripts/db/assert-authoritative-supabase.mjs
      - name: Run news ingestion script
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_INGEST_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_INGEST_MODEL }}
          GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_INGEST_MODEL }}
          CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
          GUARDIAN_QUERY_BUDGET_PER_CATEGORY: ${{ vars.GUARDIAN_QUERY_BUDGET_PER_CATEGORY }}
          GUARDIAN_QUERY_ROTATION_HOURS: ${{ vars.GUARDIAN_QUERY_ROTATION_HOURS }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          GROQ_BATCH_DELAY_MS: ${{ vars.GROQ_BATCH_DELAY_MS }}
          GROQ_MAX_REQUESTS_PER_RUN: ${{ vars.GROQ_MAX_REQUESTS_PER_RUN }}
          GROQ_MIN_REMAINING_REQUESTS: ${{ vars.GROQ_MIN_REMAINING_REQUESTS }}
          GROQ_MIN_REMAINING_TOKENS: ${{ vars.GROQ_MIN_REMAINING_TOKENS }}
          GROQ_MAX_WAIT_MS: "900000"
          GROQ_BATCH_SIZE: "4"
          MAX_CANDIDATES_PER_CATEGORY: "12"
          NEWS_QUERY_DELAY_MS: ${{ vars.NEWS_QUERY_DELAY_MS }}
          NEWS_MAX_RETRIES: ${{ vars.NEWS_MAX_RETRIES }}
          MAX_ARTICLE_AGE_MS: ${{ vars.MAX_ARTICLE_AGE_MS }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY }}
        run: node scripts/ingest-news.js

      - name: Export admitted events for structured intelligence
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            log_file="$(mktemp)"
            echo "Structured intelligence export attempt ${attempt}/${max_attempts}"

            set +e
            node scripts/export-admitted-events-for-structure.mjs 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Eqi 'gateway timeout|bad gateway|service unavailable|connection reset|fetch failed|timed? out|status[^0-9]*(502|503|504)' "$log_file"; then
              echo "Non-transient export failure detected; not retrying."
              rm -f "$log_file"
              exit "$status"
            fi

            rm -f "$log_file"

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Transient export failure persisted after ${max_attempts} attempts."
              exit "$status"
            fi

            sleep_seconds=$((attempt * 10))
            echo "Transient Supabase/network failure detected. Retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Structure fresh Geomacro intelligence
        id: structure
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
          LIVE_STRUCTURE_MAX_ATTEMPTS: "4"
          LIVE_STRUCTURE_ATTEMPT_TIMEOUT_MS: "90000"
        run: node scripts/invoke-live-structure-with-retry.mjs

      - name: Diagnose structured-intelligence failure safely
        if: ${{ always() && steps.structure.outcome == 'failure' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-live-structure-runtime.mjs

      - name: Check whether canonical GRI inputs changed
        id: gri_change
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set +e
          node scripts/check-gri-input-change.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "GRI input-change check failed with exit code $code."
          exit "$code"

      - name: Correlate changed canonical GRI evidence
        if: ${{ steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
        run: node scripts/cluster-gri-stories-v12.js

      - name: Publish GRI v1.2 after canonical evidence change
        if: ${{ steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/compute-gri-v12.js

      - name: Verify changed GRI proof package
        if: ${{ steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-gri-snapshot-v12.js
