name: Auto Ingest News
# Runs every 6 hours as the bounded low-write canonical intelligence owner.
# Normal operation uses Supabase REST. If the project is explicitly restricted
# by its egress quota, this same workflow switches the same ingestion/scoring
# code to authoritative direct PostgreSQL instead of creating a second owner.
# Customer packages are then published to verified B2. Unknown failures remain
# fail-closed and no synthetic score or fabricated event is allowed.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-ingest-news.yml"
      - "scripts/ingest-news.js"
      - "scripts/lib/gri-db-client.mjs"
      - "scripts/lib/direct-postgres-supabase-loader.mjs"
      - "scripts/lib/no-guardian-node-fetch.mjs"
      - "scripts/ops/probe-public-intelligence-live-fallback.ts"
      - "scripts/ops/select-missing-gri-discovery-domain.mjs"
      - "scripts/ops/supabase-free-tier-budget.mjs"
      - "scripts/ops/b2-country-ingest-offload.mjs"
      - "scripts/ops/b2-fragment-resolver-backed-offload.mjs"
      - "scripts/ops/b2-compact-structured-event-payload.mjs"
      - "scripts/ops/b2-s3-client.mjs"
      - "scripts/ops/publish-b2-public-intelligence-direct-postgres.mjs"
      - "scripts/ops/publish-b2-global-risk-direct-postgres.mjs"
      - "scripts/cluster-gri-stories-v12.js"
      - "scripts/compute-gri-v12.js"
      - "scripts/verify-gri-snapshot-v12.js"
      - "src/lib/global-risk-assemble.ts"
      - "src/lib/global-risk-continuity.ts"
      - "src/lib/public-intelligence-production.server.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  supabase-preflight:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      available: ${{ steps.classify.outputs.available }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify authoritative Supabase target
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: node scripts/db/assert-authoritative-supabase.mjs
      - name: Classify recurring-write availability
        id: classify
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          state_file="$(mktemp)"
          error_file="$(mktemp)"
          set +e
          node scripts/ops/supabase-free-tier-budget.mjs >"$state_file" 2>"$error_file"
          status=$?
          set -e
          cat "$state_file"
          cat "$error_file" >&2

          # A reachable project may intentionally return exit 78 because this
          # workflow is a recurring writer. Its JSON state is still sufficient
          # to route into the normal B2-headroom recovery path.
          if jq -e '.ok == true and (.mode | type == "string")' "$state_file" >/dev/null 2>&1; then
            mode="$(jq -r '.mode' "$state_file")"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            rm -f "$state_file" "$error_file"
            exit 0
          fi

          # Supabase REST egress restriction is a known transport failure, not a
          # reason to stop the canonical ingestion owner. The ingest job below
          # switches the same source/classifier/scoring code to direct PostgreSQL.
          if grep -Fq 'exceed_egress_quota' "$error_file"; then
            echo "::warning title=Supabase REST egress restricted::Canonical ingestion will continue through authoritative direct PostgreSQL."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "mode=egress_restricted" >> "$GITHUB_OUTPUT"
            rm -f "$state_file" "$error_file"
            exit 0
          fi

          echo "::error title=Supabase preflight failed unexpectedly::Refusing to downgrade an unknown control-plane failure."
          rm -f "$state_file" "$error_file"
          if [ "$status" -eq 0 ]; then exit 1; fi
          exit "$status"

  ingest-news:
    needs: supabase-preflight
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (needs.supabase-preflight.outputs.available == 'true' || needs.supabase-preflight.outputs.mode == 'egress_restricted')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify authoritative Supabase target before privileged writes
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: node scripts/db/assert-authoritative-supabase.mjs

      - name: Prove authoritative direct PostgreSQL recovery path
        if: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' }}
        env:
          GRI_DB_MODE: direct_postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const required = {
            gdelt_v2_events: 'GEOPOLITICS',
            world_bank_indicators: 'MACRO',
            usgs_mcs: 'CRITICAL_MINERALS',
          };
          const { data, error } = await db
            .from('live_external_sources')
            .select('source_id,category,commercial_usage_status,enabled_for_ingestion,enabled_for_commercial_signals')
            .in('source_id', Object.keys(required));
          if (error) throw new Error(error.message);
          const byId = new Map((data ?? []).map((row) => [row.source_id, row]));
          for (const [sourceId, category] of Object.entries(required)) {
            const row = byId.get(sourceId);
            if (!row) throw new Error(`PRODUCTION_SOURCE_MISSING:${sourceId}`);
            if (row.category !== category) throw new Error(`PRODUCTION_SOURCE_CATEGORY_MISMATCH:${sourceId}`);
            if (row.commercial_usage_status !== 'COMMERCIAL_OK') throw new Error(`PRODUCTION_SOURCE_RIGHTS_NOT_OK:${sourceId}`);
            if (!row.enabled_for_ingestion || !row.enabled_for_commercial_signals) {
              throw new Error(`PRODUCTION_SOURCE_NOT_ENABLED:${sourceId}`);
            }
          }
          console.log(JSON.stringify({
            ok: true,
            transport: 'direct_postgres',
            source_discovery_owner: 'auto-ingest-news',
            required_sources: Object.keys(required),
          }));
          NODE

      - name: Recover B2-backed headroom before recurring writes when needed
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_REQUEST_BUDGET: "24"
          B2_INGEST_LOOKBACK_HOURS: "72"
          B2_INGEST_RAW_BUNDLE_LIMIT: "25"
          B2_INGEST_RAW_ROUNDS: "2"
          B2_INGEST_HISTORICAL_DRAIN: "1"
        shell: bash
        run: |
          set -euo pipefail
          state_file="$(mktemp)"
          node scripts/ops/supabase-free-tier-budget.mjs | tee "$state_file"
          mode="$(jq -r '.mode // "unknown"' "$state_file" | tail -n 1)"
          rm -f "$state_file"
          if [ "$mode" = "normal" ]; then
            echo "Supabase already has normal recurring-write headroom; historical B2 drain not needed."
            exit 0
          fi
          echo "Supabase mode is $mode; running bounded verified historical B2 drain before the recurring-write gate."
          node scripts/ops/b2-country-ingest-offload.mjs

      - name: Require normal free-tier headroom before recurring writes
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops/supabase-free-tier-budget.mjs --require-bulk-write --require-normal
      - name: Prioritize any missing GRI discovery domain
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops/select-missing-gri-discovery-domain.mjs
      - name: Enable one-run GDELT missing-domain override and relevance cap
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/ingest-news.js';
          let source = fs.readFileSync(path, 'utf8');

          const categoryMarker = "function gdeltCategoryForCurrentRun(now = new Date()) {\n";
          const categoryInjection =
            categoryMarker +
            "  const forcedCategory = String(process.env.GDELT_FORCE_CATEGORY || '').trim();\n" +
            "  if (GDELT_DISCOVERY_CATEGORY_ORDER.includes(forcedCategory)) {\n" +
            "    return forcedCategory;\n" +
            "  }\n\n";

          if (!source.includes(categoryMarker)) {
            throw new Error('GDELT category selector marker not found; refusing runtime discovery patch.');
          }
          if (!source.includes('GDELT_FORCE_CATEGORY')) {
            source = source.replace(categoryMarker, categoryInjection);
          }

          const sortMarker = `    candidateArticles.sort(\n      (a, b) =>\n        Date.parse(b.publishedAt || 0) -\n        Date.parse(a.publishedAt || 0)\n    );\n\n`;
          const relevanceInjection = `    if (category.name === 'rare_earth') {\n      const anchoredCandidates = candidateArticles.filter((article) =>\n        RARE_EARTH_ANCHOR.test(\n          \`${'${article.title || \'\'} ${article.description || \'\'}'}\`\n        )\n      );\n\n      if (anchoredCandidates.length > 0) {\n        console.log(\n          \`  Critical-mineral anchor prefilter: ${'${anchoredCandidates.length}'}/${'${candidateArticles.length}'} candidate(s) retained before cap.\`\n        );\n        candidateArticles = anchoredCandidates;\n      }\n    }\n\n` + sortMarker;

          if (!source.includes(sortMarker)) {
            throw new Error('Candidate sort marker not found; refusing relevance patch.');
          }
          if (!source.includes('Critical-mineral anchor prefilter')) {
            source = source.replace(sortMarker, relevanceInjection);
          }

          const oldBalance = `      const remainingLimit =\n        safeCandidatesPerCategory() - gdeltLimit;\n\n      const primaryCandidates = [\n        ...guardianCandidates,\n        ...otherCandidates,\n      ]\n        .sort(\n          (a, b) =>\n            Date.parse(b.publishedAt || 0) -\n            Date.parse(a.publishedAt || 0)\n        )\n        .slice(0, remainingLimit);\n\n      candidateArticles = [\n        ...primaryCandidates,\n        ...gdeltCandidates.slice(0, gdeltLimit),\n      ].sort(`;

          const newBalance = `      const remainingLimit =\n        safeCandidatesPerCategory() - gdeltLimit;\n\n      const primaryCandidates = [\n        ...guardianCandidates,\n        ...otherCandidates,\n      ]\n        .sort(\n          (a, b) =>\n            Date.parse(b.publishedAt || 0) -\n            Date.parse(a.publishedAt || 0)\n        )\n        .slice(0, remainingLimit);\n\n      const effectiveGdeltLimit = Math.min(\n        gdeltCandidates.length,\n        safeCandidatesPerCategory() - primaryCandidates.length\n      );\n\n      candidateArticles = [\n        ...primaryCandidates,\n        ...gdeltCandidates.slice(0, effectiveGdeltLimit),\n      ].sort(`;

          if (!source.includes(oldBalance)) {
            throw new Error('Balanced candidate-cap marker not found; refusing backfill patch.');
          }
          if (!source.includes('effectiveGdeltLimit')) {
            source = source.replace(oldBalance, newBalance);
            source = source.replace(
              '`${Math.min(gdeltCandidates.length, gdeltLimit)} GDELT-discovered ` +',
              '`${effectiveGdeltLimit} GDELT-discovered ` +'
            );
          }

          fs.writeFileSync(path, source, 'utf8');
          const verified = fs.readFileSync(path, 'utf8');
          for (const required of ['GDELT_FORCE_CATEGORY', 'Critical-mineral anchor prefilter', 'effectiveGdeltLimit']) {
            if (!verified.includes(required)) {
              throw new Error(`Runtime discovery patch missing required marker: ${required}`);
            }
          }
          NODE
      - name: Run bounded news ingestion script
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GRI_DB_MODE: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' && 'direct_postgres' || '' }}
          NODE_OPTIONS: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' && '--experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs' || '' }}
          GEOMACRO_DISABLE_GUARDIAN: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' && 'true' || 'false' }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          RELIEFWEB_APP_NAME: ${{ secrets.RELIEFWEB_APP_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_INGEST_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_INGEST_MODEL }}
          GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_INGEST_MODEL }}
          CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
          GUARDIAN_QUERY_BUDGET_PER_CATEGORY: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' && '0' || '3' }}
          GUARDIAN_QUERY_ROTATION_HOURS: "6"
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          GROQ_BATCH_DELAY_MS: ${{ vars.GROQ_BATCH_DELAY_MS }}
          GROQ_MAX_REQUESTS_PER_RUN: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' && '18' || '12' }}
          GROQ_MIN_REMAINING_REQUESTS: ${{ vars.GROQ_MIN_REMAINING_REQUESTS }}
          GROQ_MIN_REMAINING_TOKENS: ${{ vars.GROQ_MIN_REMAINING_TOKENS }}
          GROQ_MAX_WAIT_MS: "180000"
          GROQ_BATCH_SIZE: "2"
          MAX_CANDIDATES_PER_CATEGORY: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' && '6' || '4' }}
          NEWS_QUERY_DELAY_MS: ${{ vars.NEWS_QUERY_DELAY_MS }}
          NEWS_MAX_RETRIES: "2"
          MAX_ARTICLE_AGE_MS: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' && '345600000' || vars.MAX_ARTICLE_AGE_MS }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY }}
          RELIEFWEB_ENABLED: "true"
          GDACS_ENABLED: "true"
        run: node scripts/ingest-news.js

      - name: Publish scored verified Intelligence package to B2 through direct PostgreSQL
        if: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: bun scripts/ops/publish-b2-public-intelligence-direct-postgres.mjs

      - name: Export admitted events for structured intelligence
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        id: export_fragment
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            log_file="$(mktemp)"
            echo "Structured intelligence export attempt ${attempt}/${max_attempts}"
            set +e
            node scripts/export-admitted-events-for-structure.mjs 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              manifest_id="$(node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(x.manifest_id||""));' "$log_file")"
              echo "manifest_id=$manifest_id" >> "$GITHUB_OUTPUT"
              rm -f "$log_file"
              exit 0
            fi
            if ! grep -Eqi 'gateway timeout|bad gateway|service unavailable|connection reset|fetch failed|timed? out|status[^0-9]*(502|503|504)' "$log_file"; then
              echo "Non-transient export failure detected; not retrying."; rm -f "$log_file"; exit "$status"
            fi
            rm -f "$log_file"
            if [ "$attempt" -eq "$max_attempts" ]; then echo "Transient export failure persisted after ${max_attempts} attempts."; exit "$status"; fi
            sleep_seconds=$((attempt * 10))
            echo "Transient Supabase/network failure detected. Retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Move freshly sealed admitted fragment to verified B2 before structuring
        if: ${{ needs.supabase-preflight.outputs.available == 'true' && steps.export_fragment.outputs.manifest_id != '' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_FRAGMENT_TARGET_ID: ${{ steps.export_fragment.outputs.manifest_id }}
          B2_FRAGMENT_RESOLVER_DELETE: "1"
          B2_FRAGMENT_RESOLVER_CONFIRM: DELETE_VERIFIED_SOURCE_USING_B2_RESOLVER
          B2_FRAGMENT_MIN_AGE_HOURS: "0"
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/ops/b2-fragment-resolver-backed-offload.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const marker = 'const minAgeHours = Math.max(24, Math.min(24 * 365, Number(process.env.B2_FRAGMENT_MIN_AGE_HOURS ?? 168)));';
          const replacement = 'const minAgeHours = Math.max(0, Math.min(24 * 365, Number(process.env.B2_FRAGMENT_MIN_AGE_HOURS ?? 168)));';
          if (!source.includes(marker)) {
            throw new Error('Fresh-fragment resolver age guard marker not found; refusing runtime patch.');
          }
          source = source.replace(marker, replacement);
          fs.writeFileSync(path, source, 'utf8');
          if (!fs.readFileSync(path, 'utf8').includes(replacement)) {
            throw new Error('Fresh-fragment resolver age override was not applied.');
          }
          NODE
          node scripts/ops/b2-fragment-resolver-backed-offload.mjs

      - name: Structure fresh Geomacro intelligence
        if: ${{ needs.supabase-preflight.outputs.available == 'true' && steps.export_fragment.outputs.manifest_id != '' }}
        id: structure
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
          LIVE_STRUCTURE_FRAGMENT_ID: ${{ steps.export_fragment.outputs.manifest_id }}
          LIVE_STRUCTURE_MAX_ATTEMPTS: "4"
          LIVE_STRUCTURE_ATTEMPT_TIMEOUT_MS: "90000"
        run: node scripts/invoke-live-structure-with-retry.mjs

      - name: Diagnose structured-intelligence failure safely
        if: ${{ needs.supabase-preflight.outputs.available == 'true' && always() && steps.structure.outcome == 'failure' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-live-structure-runtime.mjs

      - name: Check whether canonical GRI inputs changed
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        id: gri_change
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set +e
          node scripts/check-gri-input-change.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" -eq 10 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "GRI input-change check failed with exit code $code."
          exit "$code"

      - name: Correlate changed canonical GRI evidence
        if: ${{ needs.supabase-preflight.outputs.available == 'true' && steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
        run: node scripts/cluster-gri-stories-v12.js

      - name: Publish GRI v1.2 after canonical evidence change
        if: ${{ needs.supabase-preflight.outputs.available == 'true' && steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/compute-gri-v12.js

      - name: Verify changed GRI proof package
        if: ${{ needs.supabase-preflight.outputs.available == 'true' && steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-gri-snapshot-v12.js

      - name: Correlate current canonical GRI evidence through direct PostgreSQL
        if: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' }}
        env:
          GRI_DB_MODE: direct_postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
        run: node scripts/cluster-gri-stories-v12.js

      - name: Compute current verified three-domain GRI through direct PostgreSQL
        if: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' }}
        env:
          GRI_DB_MODE: direct_postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        run: node scripts/compute-gri-v12.js

      - name: Verify current GRI proof package through direct PostgreSQL
        if: ${{ needs.supabase-preflight.outputs.mode == 'egress_restricted' }}
        env:
          GRI_DB_MODE: direct_postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        run: node scripts/verify-gri-snapshot-v12.js

      - name: Publish verified GRI continuity package to B2
        if: ${{ (needs.supabase-preflight.outputs.available == 'true' && steps.gri_change.outputs.changed == 'true') || needs.supabase-preflight.outputs.mode == 'egress_restricted' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: bun scripts/ops/publish-b2-global-risk-direct-postgres.mjs

      - name: Offload settled recent raw ingest buffer to verified B2
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_REQUEST_BUDGET: "32"
          B2_INGEST_LOOKBACK_HOURS: "72"
          B2_INGEST_RAW_BUNDLE_LIMIT: "25"
          B2_INGEST_RAW_ROUNDS: "4"
          B2_INGEST_HISTORICAL_DRAIN: "0"
        run: node scripts/ops/b2-country-ingest-offload.mjs

      - name: Compact bounded cold structured payloads to B2 pointers
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_REQUEST_BUDGET: "40"
          STRUCTURED_EVENT_COMPACT_OLDER_DAYS: "7"
          STRUCTURED_EVENT_COMPACT_LIMIT: "10"
        run: node scripts/ops/b2-compact-structured-event-payload.mjs

      - name: Report final free-tier budget state
        if: ${{ needs.supabase-preflight.outputs.available == 'true' }}
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops/supabase-free-tier-budget.mjs

  public-live-freshness-fallback:
    needs: supabase-preflight
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && needs.supabase-preflight.outputs.mode == 'egress_restricted'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Observe no-write public live freshness while direct recovery runs
        run: bun scripts/ops/probe-public-intelligence-live-fallback.ts
      - name: Upload bounded fallback freshness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-intelligence-live-fallback
          path: artifacts/public-intelligence-live-fallback.json
          if-no-files-found: error
          retention-days: 30
