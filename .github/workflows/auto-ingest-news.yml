name: Auto Ingest News
# Runs at :00 every 2 hours — first step in the pipeline, so fresh events
# are in Supabase before sync-lifecycle/create-markets run afterward.
# Staggered against the other RPC-heavy workflows below to avoid multiple
# GitHub Actions runners hitting the same RPC/API endpoints at once.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
jobs:
  ingest-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install ethers @supabase/supabase-js groq-sdk node-fetch dotenv
      - name: Run news ingestion script
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Optional repository variables; empty/unset values fall back to script defaults.
          GROQ_MODEL: ${{ vars.GROQ_INGEST_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_INGEST_MODEL }}
          GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_INGEST_MODEL }}
          CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
          GUARDIAN_QUERY_BUDGET_PER_CATEGORY: ${{ vars.GUARDIAN_QUERY_BUDGET_PER_CATEGORY }}
          GUARDIAN_QUERY_ROTATION_HOURS: ${{ vars.GUARDIAN_QUERY_ROTATION_HOURS }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          GROQ_BATCH_DELAY_MS: ${{ vars.GROQ_BATCH_DELAY_MS }}
          GROQ_MAX_REQUESTS_PER_RUN: ${{ vars.GROQ_MAX_REQUESTS_PER_RUN }}
          GROQ_MIN_REMAINING_REQUESTS: ${{ vars.GROQ_MIN_REMAINING_REQUESTS }}
          GROQ_MIN_REMAINING_TOKENS: ${{ vars.GROQ_MIN_REMAINING_TOKENS }}
          GROQ_MAX_WAIT_MS: "900000"

          # Production classifier contract.
          # Keep request batching efficient without allowing batch-size
          # changes to inflate daily token consumption.
          GROQ_BATCH_SIZE: "4"
          MAX_CANDIDATES_PER_CATEGORY: "12"
          NEWS_QUERY_DELAY_MS: ${{ vars.NEWS_QUERY_DELAY_MS }}
          NEWS_MAX_RETRIES: ${{ vars.NEWS_MAX_RETRIES }}
          MAX_ARTICLE_AGE_MS: ${{ vars.MAX_ARTICLE_AGE_MS }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY }}
        run: node scripts/ingest-news.js

      - name: Export admitted events for structured intelligence
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/export-admitted-events-for-structure.mjs

      - name: Structure fresh Geomacro intelligence
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${LIVE_STRUCTURE_TOKEN:-}" ]; then
            echo "::error::LIVE_STRUCTURE_TOKEN is required for the structured-intelligence handoff."
            exit 1
          fi

          curl --fail-with-body -sS -X POST \
            "${SUPABASE_URL%/}/functions/v1/live-structure-intelligence" \
            -H "x-geomacro-structure-token: ${LIVE_STRUCTURE_TOKEN}" \
            -H "Content-Type: application/json"

          echo

      - name: Check whether canonical GRI inputs changed
        id: gri_change
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set +e
          node scripts/check-gri-input-change.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "GRI input-change check failed with exit code $code."
          exit "$code"

      - name: Correlate changed canonical GRI evidence
        if: ${{ steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
        run: node scripts/cluster-gri-stories-v12.js

      - name: Publish GRI v1.2 after canonical evidence change
        if: ${{ steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/compute-gri-v12.js

      - name: Verify changed GRI proof package
        if: ${{ steps.gri_change.outputs.changed == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-gri-snapshot-v12.js
