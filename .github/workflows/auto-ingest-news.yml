name: Auto Ingest News
# Supabase-free permanent ingest watchdog. The working primary newsroom owns
# hourly collection at :07 UTC; this separate :37 UTC check only catches
# genuinely missed publications through the SAME canonical D1 recovery writer.
# GitHub cron is best-effort, not an exact-time SLA. No duplicate raw ingestion,
# source article storage, Supabase, x402, or new commercial paid products.
# Previous Supabase/Postgres legacy job remains physically retired below.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-ingest-news.yml"
      - ".github/workflows/website-derived-news-cadence-backstop.yml"
      - "scripts/lib/material-gri-news-review.mjs"
      - "scripts/ops/export-material-gri-review-from-d1.mjs"
      - "scripts/tests/material-gri-news-review.test.mjs"
      - "scripts/lib/material-gri-country-evidence-worklist.mjs"
      - "scripts/ops/build-material-gri-country-worklist.mjs"
      - "scripts/tests/material-gri-country-evidence-worklist.test.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: geomacro-auto-ingest-news-recovery
  cancel-in-progress: false

jobs:
  ingest-supabase-free-derived-news:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    # Reuse the audited backstop, its 70-minute signed-publication proof,
    # same Cloudflare D1 writer lock and no-funds/source-private readbacks.
    # workflow_dispatch intentionally forces one bounded manual recovery;
    # scheduled/push checks will NOT duplicate a recent real publication.
    uses: ./.github/workflows/website-derived-news-cadence-backstop.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  material-gri-derived-review:
    # Runs on every :37/manual/push invocation, including legitimate no-op
    # recovery when the :07 primary is current. Read ONLY the derived D1
    # journal: no duplicate raw collection, quota-heavy B2, or inferred odds.
    # This is a private evidence-review queue, not GRI scoring/publication.
    needs: ingest-supabase-free-derived-news
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && needs.ingest-supabase-free-derived-news.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout canonical event-classification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Test exact 72-hour source-free event review policy
        run: node --test scripts/tests/material-gri-news-review.test.mjs scripts/tests/material-gri-country-evidence-worklist.test.mjs
      - name: Select material developments from actual D1-derived readback
        run: node scripts/ops/export-material-gri-review-from-d1.mjs
      - name: Build 195-country GRI source-qualification worklist (no scoring or signed claims)
        run: node scripts/ops/build-material-gri-country-worklist.mjs
      - name: Preserve bounded private GRI country worklist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auto-ingest-gri-country-review-${{ github.run_id }}
          path: artifacts/derived-news/material-gri-country-evidence-worklist.json
          if-no-files-found: warn
          retention-days: 3

      - name: Save private 72-hour GRI review candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auto-ingest-material-gri-review-${{ github.run_id }}
          path: artifacts/derived-news/material-gri-review.json
          if-no-files-found: warn
          retention-days: 3

  recover-news-ingest:
    # Legacy Supabase recovery retired: never execute from manual dispatch,
    # push or schedule. Keep reviewed historical logic for forensic replay only.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"
      INVINO_API_KEY: ${{ secrets.INVINO_API_KEY }}
      RELIEFWEB_APP_NAME: ${{ secrets.RELIEFWEB_APP_NAME }}
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
      GUARDIAN_QUERY_BUDGET_PER_CATEGORY: ${{ vars.GUARDIAN_QUERY_BUDGET_PER_CATEGORY }}
      GUARDIAN_QUERY_ROTATION_HOURS: ${{ vars.GUARDIAN_QUERY_ROTATION_HOURS }}
      GROQ_BATCH_DELAY_MS: ${{ vars.GROQ_BATCH_DELAY_MS }}
      GROQ_MAX_REQUESTS_PER_RUN: ${{ vars.GROQ_MAX_REQUESTS_PER_RUN }}
      GROQ_MIN_REMAINING_REQUESTS: ${{ vars.GROQ_MIN_REMAINING_REQUESTS }}
      GROQ_MIN_REMAINING_TOKENS: ${{ vars.GROQ_MIN_REMAINING_TOKENS }}
      INTELLIGENCE_ORCHESTRATOR_MAX_TASKS: "1"
      INTELLIGENCE_ORCHESTRATOR_TASK_ALLOWLIST: news_ingest
      INTELLIGENCE_ORCHESTRATOR_FORCE_TASKS: news_ingest

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve production D1 scheduler database
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          LIST_JSON="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const rows = JSON.parse(s);
              const row = rows.find(x => x.name === process.env.D1_DATABASE_NAME);
              process.stdout.write(row?.uuid ?? row?.id ?? "");
            });
          ')"
          test -n "$DB_ID" || { echo "D1 scheduler database not found"; exit 3; }
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Require normal free-tier headroom and Edge availability for this legacy recovery wrapper
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/supabase-free-tier-budget.mjs --require-bulk-write --require-normal | tee supabase-budget.json
          jq -e '.ok == true and .policy.recurring_ingest_allowed == true' supabase-budget.json >/dev/null
          transport="$(jq -r '.transport' supabase-budget.json)"
          test "$transport" = "data_api" || {
            echo "Manual legacy news recovery still needs Supabase Edge structuring; use the D1/B2 orchestrator path while the Edge service is unavailable."
            exit 12
          }
          echo "GEOMACRO_SUPABASE_EDGE_AVAILABLE=true" >> "$GITHUB_ENV"

      - name: Run exactly the canonical news_ingest recovery task
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/intelligence-orchestrator.mjs | tee auto-ingest-news-recovery.json
          jq -e '.ok == true and (.selected | length == 1) and .selected[0].task == "news_ingest" and .selected[0].ok == true' auto-ingest-news-recovery.json >/dev/null

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auto-ingest-news-recovery-${{ github.run_id }}
          path: |
            auto-ingest-news-recovery.json
            supabase-budget.json
          if-no-files-found: warn
          retention-days: 14
