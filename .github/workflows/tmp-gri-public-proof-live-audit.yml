name: Temporary GRI Public Proof Live Audit

on:
  push:
    branches:
      - audit/gri-public-proof-consistency

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GRI_METHOD_VERSION: gri-v1.2.0
      GRI_PROOF_VERSION: gri-proof-v1.2.0
      GRI_MAX_PUBLIC_SNAPSHOT_AGE_HOURS: "3"
      GRI_CONSISTENCY_ARTIFACT: artifacts/gri-public-proof-consistency.json
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Audit persisted public/service GRI parity
        run: node scripts/audit-gri-public-proof-consistency.mjs

      - name: Resolve audited snapshot id
        id: snapshot
        shell: bash
        run: |
          snapshot_id="$(node -e 'const e=require("./artifacts/gri-public-proof-consistency.json"); if(!e.snapshotId) process.exit(1); process.stdout.write(e.snapshotId)')"
          echo "id=$snapshot_id" >> "$GITHUB_OUTPUT"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install locked verifier dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Independently recompute persisted proof
        run: |
          node scripts/verify-gri-snapshot-v12.js --snapshot-id "${{ steps.snapshot.outputs.id }}" \
            > artifacts/gri-public-proof-verifier.json

      - name: Upload sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tmp-gri-public-proof-live-audit-${{ github.run_id }}
          path: |
            artifacts/gri-public-proof-consistency.json
            artifacts/gri-public-proof-verifier.json
          if-no-files-found: warn
