name: GOAT Acceptance Windows

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/__tests__/goat-*'
      - 'src/routes/goat-test-dashboard.tsx'
      - 'scripts/goat/run-acceptance-window.sh'
      - 'scripts/goat/testnet3-provider-dry-run.mjs'
      - '.github/workflows/goat-acceptance-windows.yml'
  schedule:
    # 20-window reliability program. Use minute 7 instead of minute 0 because
    # GitHub documents that scheduled workflows are most likely to be delayed
    # or dropped at the start of the hour.
    # 12-13 Sep IST: nominal 00:30, 03:30, 06:30, 09:30, 12:30, 15:30, 18:30
    # windows now start at 00:37, 03:37, 06:37, 09:37, 12:37, 15:37, 18:37.
    - cron: '7 19,22 11-12 9 *'
    - cron: '7 1,4,7,10,13 12-13 9 *'
    # 14 Sep IST: final nominal windows likewise run seven minutes off-hour.
    - cron: '7 19,22 13 9 *'
    - cron: '7 1,4,7,10 14 9 *'
  workflow_dispatch:
    inputs:
      iterations:
        description: Suite iterations for this window
        required: false
        default: '250'
      window_id:
        description: Optional window identifier
        required: false

permissions:
  contents: read

concurrency:
  group: goat-acceptance-window-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance-window:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOAT_ACCEPTANCE_ITERATIONS: ${{ github.event.inputs.iterations || '250' }}
      GOAT_ACCEPTANCE_WINDOW_ID: ${{ github.event.inputs.window_id || format('run-{0}', github.run_id) }}
      GOAT_ACCEPTANCE_ARTIFACT_DIR: artifacts/goat-acceptance/windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Run acceptance window
        run: bash scripts/goat/run-acceptance-window.sh

      - name: Upload window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goat-acceptance-window-${{ github.run_id }}
          path: artifacts/goat-acceptance/windows/*
          if-no-files-found: error
          retention-days: 90

      - name: Record window
        if: always()
        shell: bash
        run: |
          echo "Target: 20 windows x 250 repeated cases = 5,000" >> "$GITHUB_STEP_SUMMARY"
          echo "Program deadline: 14 September 2026 IST" >> "$GITHUB_STEP_SUMMARY"
          echo "Window id: $GOAT_ACCEPTANCE_WINDOW_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduler hardening: minute 7 UTC offset avoids GitHub's top-of-hour high-load period." >> "$GITHUB_STEP_SUMMARY"

  provider-dry-run:
    # Pull requests do not receive repository secrets. Scheduled/manual acceptance
    # windows do, so attach the live provider observation only to those runs.
    if: github.event_name != 'pull_request'
    needs: acceptance-window
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOATX402_API_KEY: ${{ secrets.GOATX402_API_KEY }}
      GOATX402_API_SECRET: ${{ secrets.GOATX402_API_SECRET }}
      GOATX402_MERCHANT_ID: ${{ secrets.GOATX402_MERCHANT_ID }}
      GOATX402_DRY_RUN_AMOUNT_ATOMIC: '100000'
      GOATX402_DRY_RUN_ARTIFACT_DIR: artifacts/goat-testnet3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate merchant configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GOATX402_API_KEY GOATX402_API_SECRET GOATX402_MERCHANT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing; provider acceptance evidence cannot be collected."
              exit 1
            fi
          done
          echo "Required GOAT Testnet3 merchant secrets are present. Values were not printed." >> "$GITHUB_STEP_SUMMARY"

      - name: Run no-payment Testnet3 provider dry run
        run: node scripts/goat/testnet3-provider-dry-run.mjs

      - name: Upload sanitized provider evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goat-testnet3-provider-dry-run-${{ github.run_id }}
          path: artifacts/goat-testnet3/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Record no-payment boundary
        if: always()
        shell: bash
        run: |
          echo "Provider observation is part of acceptance run $GITHUB_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
          echo "Transaction submitted: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false" >> "$GITHUB_STEP_SUMMARY"
          echo "The provider dry run creates a Testnet3 402 challenge with a random payer address for which no private key exists, then performs an authenticated order read only." >> "$GITHUB_STEP_SUMMARY"

  update-github-dashboard:
    name: Update GOAT GitHub dashboard
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - acceptance-window
      - provider-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Refresh issue #243 from GitHub Actions evidence
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 243;
            const targetWindows = 20;
            const casesPerWindow = 250;
            const targetCases = 5000;

            const { data: runData } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'goat-acceptance-windows.yml',
              branch: 'main',
              event: 'schedule',
              per_page: 100,
            });

            const runs = runData.workflow_runs
              .filter((run) => run.event === 'schedule')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(0, targetWindows);

            const rows = [];
            let acceptedWindows = 0;
            let providerPassed = 0;
            let latestAcceptanceArtifact = null;
            let latestProviderArtifact = null;
            let latestFailure = null;

            const fmtIst = (iso) => new Intl.DateTimeFormat('en-IN', {
              timeZone: 'Asia/Kolkata',
              dateStyle: 'medium',
              timeStyle: 'medium',
              hour12: true,
            }).format(new Date(iso)) + ' IST';

            const short = (sha) => (sha || '').slice(0, 10);
            const safe = (value) => String(value ?? '').replaceAll('|', '\\|').replaceAll('\n', ' ');
            const artifactInfo = (artifact) => {
              if (!artifact) return '⚠️ missing';
              const digest = artifact.digest ? artifact.digest.replace('sha256:', '').slice(0, 16) + '…' : 'digest unavailable';
              const expiry = artifact.expires_at ? fmtIst(artifact.expires_at) : 'unknown expiry';
              return `ID \`${artifact.id}\` · ${artifact.size_in_bytes} B · \`${digest}\` · expires ${expiry}`;
            };

            for (const run of runs) {
              const [{ data: artifactData }, { data: jobData }] = await Promise.all([
                github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 }),
                github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 }),
              ]);

              const artifacts = artifactData.artifacts || [];
              const jobs = jobData.jobs || [];
              const acceptanceArtifact = artifacts.find((a) => a.name === `goat-acceptance-window-${run.id}`);
              const providerArtifact = artifacts.find((a) => a.name === `goat-testnet3-provider-dry-run-${run.id}`);
              const acceptanceJob = jobs.find((j) => j.name.toLowerCase().includes('acceptance'));
              const providerJob = jobs.find((j) => j.name.includes('Provider Dry Run'));

              const acceptancePass = run.conclusion === 'success' && acceptanceJob?.conclusion === 'success' && Boolean(acceptanceArtifact);
              const providerPass = providerJob?.conclusion === 'success' && Boolean(providerArtifact);

              if (acceptancePass) acceptedWindows += 1;
              if (providerPass) providerPassed += 1;
              if (!latestAcceptanceArtifact && acceptanceArtifact) latestAcceptanceArtifact = acceptanceArtifact;
              if (!latestProviderArtifact && providerArtifact) latestProviderArtifact = providerArtifact;

              const failedJob = jobs.find((j) => ['failure', 'cancelled', 'timed_out', 'action_required'].includes(j.conclusion));
              const failedStep = failedJob?.steps?.find((s) => ['failure', 'cancelled', 'timed_out'].includes(s.conclusion));
              const failure = failedJob ? `${failedJob.name}${failedStep ? ` → ${failedStep.name}` : ''}` : null;
              if (!latestFailure && failure) latestFailure = { run, failure };

              const runStatus = run.status === 'completed' ? (run.conclusion === 'success' ? '✅ success' : `❌ ${run.conclusion}`) : `🟦 ${run.status}`;
              const acceptanceStatus = acceptancePass ? '✅ 250 / 250' : (run.conclusion === 'failure' ? '❌ failed' : '⚠️ not verified');
              const matrixStatus = acceptancePass ? '✅ PASS' : '⚠️ not verified';
              const providerStatus = providerPass ? '✅ PASS' : (providerJob?.conclusion === 'failure' ? '❌ FAIL' : '⚠️ incomplete');
              const failedStage = failure ? `❌ ${safe(failure)}` : '—';

              rows.push(`| [#${run.run_number}](${run.html_url}) | ${fmtIst(run.created_at)} | ${runStatus} | ${acceptanceStatus} | ${matrixStatus} | ${providerStatus} | ${acceptanceArtifact ? `\`${acceptanceArtifact.id}\`` : '—'} | ${providerArtifact ? `\`${providerArtifact.id}\`` : '—'} | \`${short(run.head_sha)}\` | ${failedStage} |`);
            }

            const repeatedCases = Math.min(acceptedWindows * casesPerWindow, targetCases);
            const latest = runs[0];
            const overall = acceptedWindows >= targetWindows && repeatedCases >= targetCases && providerPassed > 0
              ? '🟢 PASS'
              : latestFailure ? '🟠 ATTENTION' : '🟡 IN PROGRESS';

            const currentAcceptance = '${{ needs.acceptance-window.result }}';
            const currentProvider = '${{ needs.provider-dry-run.result }}';
            const currentRunUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = `# GOAT Testnet3 Live Acceptance Dashboard

            > **Overall:** ${overall}  
            > **Updated:** ${fmtIst(new Date().toISOString())}  
            > **Source:** GitHub Actions + preserved artifacts  
            > **Safety:** This dashboard only reads GitHub evidence and updates this issue. It does not dispatch a paid workflow, access a payment key, sign a wallet message, or submit a transaction.

            ## Progress

            | Metric | Current | Target | Status |
            |---|---:|---:|---|
            | Accepted scheduled windows | **${acceptedWindows}** | **${targetWindows}** | ${acceptedWindows >= targetWindows ? '✅' : '🟡'} |
            | Repeated cases represented | **${repeatedCases.toLocaleString()}** | **${targetCases.toLocaleString()}** | ${repeatedCases >= targetCases ? '✅' : '🟡'} |
            | Cases per accepted window | **${casesPerWindow}** | **${casesPerWindow}** | ✅ |
            | Provider-passed scheduled windows | **${providerPassed}** | evidence required | ${providerPassed > 0 ? '✅' : '⚠️'} |

            ## Current workflow cycle

            - **Run:** [${context.runId}](${currentRunUrl})
            - **Acceptance job result:** \`${currentAcceptance}\`
            - **Provider dry-run result:** \`${currentProvider}\`
            - **Transaction submitted by provider dry run:** **false**
            - **Commercial revenue:** **false**

            ## Latest scheduled evidence

            ${latest ? `- **Latest scheduled run:** [#${latest.run_number}](${latest.html_url}) / \`${latest.id}\`
            - **Started:** ${fmtIst(latest.created_at)}
            - **Commit:** [\`${short(latest.head_sha)}\`](https://github.com/${owner}/${repo}/commit/${latest.head_sha})` : '- No scheduled run returned.'}
            - **Latest acceptance artifact:** ${artifactInfo(latestAcceptanceArtifact)}
            - **Latest provider artifact:** ${artifactInfo(latestProviderArtifact)}
            ${latestFailure ? `- **Latest failed stage:** [run ${latestFailure.run.id}](${latestFailure.run.html_url}) → **${safe(latestFailure.failure)}**` : '- **Latest failed stage:** none in the displayed scheduled runs'}

            ## Window-by-window detailed report

            A window is counted only when the acceptance job succeeds **and** its acceptance artifact is preserved. Provider status is passed only when the provider job succeeds **and** the provider artifact exists. A failed workflow is never masked by artifact presence.

            | Run | Started (IST) | Workflow | 250 repeated cases | Matrix gate | Provider dry run | Acceptance artifact | Provider artifact | Commit | Failed stage |
            |---|---|---|---|---|---|---|---|---|---|
            ${rows.length ? rows.join('\n') : '| — | — | — | — | — | — | — | — | — | — |'}

            ## Evidence interpretation

            - **250 repeated cases:** a successful acceptance job plus preserved \`goat-acceptance-window-<run_id>\` artifact.
            - **Full matrix:** the acceptance runner fails the job when its full matrix gate does not pass; therefore only an accepted window is shown as matrix PASS.
            - **Provider:** a successful \`GOAT Testnet3 Provider Dry Run (No Payment)\` job plus preserved provider artifact.
            - **Missing scheduled window:** remains missing and is **not** inferred as a pass.
            - **Artifacts:** preserved for 90 days by the workflow. Run links expose exact jobs, steps and logs.

            ## Program configuration

            - Target: **20 windows × 250 repeated cases = 5,000 cases**
            - Schedule hardening: windows are offset to minute **07** to avoid GitHub's top-of-hour high-load period.
            - Provider observation: **no-payment / no-transaction** only.
            - Repository source of truth: \`blocknine0/geomacro\` on \`main\`.

            ---
            _Auto-maintained by \`.github/workflows/goat-acceptance-windows.yml\`. If a stage fails, this issue reports the failed job/step rather than converting it into success._`;

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              body: body.replace(/^            /gm, ''),
            });

            core.summary
              .addHeading('GOAT Testnet3 acceptance dashboard')
              .addRaw(`Overall: ${overall}\n\n`)
              .addRaw(`Accepted windows: ${acceptedWindows}/${targetWindows}\n\n`)
              .addRaw(`Repeated cases represented: ${repeatedCases}/${targetCases}\n\n`)
              .addLink('Open permanent GitHub dashboard', `https://github.com/${owner}/${repo}/issues/${issue_number}`)
              .write();
