name: Sync source API secrets to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      NOAA_NCEI_TOKEN: ${{ secrets.NOAA_NCEI_TOKEN }}
      WTO_API_KEY: ${{ secrets.WTO_API_KEY }}
      OPENSANCTIONS_API_KEY: ${{ secrets.OPENSANCTIONS_API_KEY }}

    steps:
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Validate required secrets and production target
        shell: bash
        run: |
          set -euo pipefail

          expected_ref="ldpwajisioljyjtojvfx"

          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID BLS_API_KEY BEA_API_KEY ALPHA_VANTAGE_API_KEY EIA_API_KEY NOAA_NCEI_TOKEN WTO_API_KEY OPENSANCTIONS_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing GitHub secret::${name} is not configured."
              exit 1
            fi
          done

          if [[ "$SUPABASE_PROJECT_ID" != "$expected_ref" ]]; then
            echo "::error title=Wrong Supabase target::Refusing to sync secrets to a non-authoritative Geomacro production project."
            exit 1
          fi

          echo "PASS: required source secrets and authoritative production target are present."

      - name: Sync source secrets to Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          supabase secrets set \
            BLS_API_KEY="$BLS_API_KEY" \
            BEA_API_KEY="$BEA_API_KEY" \
            ALPHA_VANTAGE_API_KEY="$ALPHA_VANTAGE_API_KEY" \
            EIA_API_KEY="$EIA_API_KEY" \
            NOAA_NCEI_TOKEN="$NOAA_NCEI_TOKEN" \
            WTO_API_KEY="$WTO_API_KEY" \
            OPENSANCTIONS_API_KEY="$OPENSANCTIONS_API_KEY" \
            --project-ref "$SUPABASE_PROJECT_ID"

          echo "PASS: source API secrets synchronized to Supabase Edge Function Secrets."
