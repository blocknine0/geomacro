name: Machine commercial GRO dual-attestation contract (no funds)
on:
  pull_request:
    paths:
      - "src/lib/geomacro-machine-commercial-qualification.server.ts"
      - "src/lib/on-demand-global-discovery.server.ts"
      - "src/lib/signed-publication-recovery-preflight.server.ts"
      - "src/__tests__/signed-publication-recovery-preflight.test.ts"
      - "src/lib/geomacro-machine-commercial-qualification.server.test.ts"
      - "src/lib/geomacro-machine-research-gro.server.ts"
      - "scripts/ops/accept-private-geomacro-machine-commercial-gro.ts"
      - "src/lib/geomacro-machine-commercial-operator.server.test.ts"
      - "src/lib/single-original-private-authority.server.ts"
      - "src/lib/single-original-private-authority.server.test.ts"
      - "src/lib/single-original-private-derived-handoff.server.ts"
      - "scripts/ops/accept-private-single-original-authority.ts"
      - "src/lib/geomacro-machine-source-rights.server.ts"
      - "docs/ops/GEOMACRO_AUTOMATED_COMMERCIAL_GRO_V1.md"
      - ".github/workflows/machine-commercial-gro-no-funds.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/geomacro-machine-commercial-qualification.server.ts"
      - "src/lib/on-demand-global-discovery.server.ts"
      - "src/lib/signed-publication-recovery-preflight.server.ts"
      - "src/__tests__/signed-publication-recovery-preflight.test.ts"
      - "src/lib/geomacro-machine-commercial-qualification.server.test.ts"
      - ".github/workflows/machine-commercial-gro-no-funds.yml"
      - "scripts/ops/accept-private-geomacro-machine-commercial-gro.ts"
      - "src/lib/geomacro-machine-commercial-operator.server.test.ts"
      - "src/lib/single-original-private-authority.server.ts"
      - "src/lib/single-original-private-authority.server.test.ts"
      - "src/lib/single-original-private-derived-handoff.server.ts"
      - "scripts/ops/accept-private-single-original-authority.ts"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: geomacro-machine-commercial-no-funds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-contract-no-funds:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Dual-attestation, canonical GRO and negative source/rights tests
        run: bunx vitest run src/lib/geomacro-machine-commercial-qualification.server.test.ts src/lib/geomacro-machine-research-gro.server.test.ts src/lib/geomacro-machine-source-rights.server.test.ts src/lib/on-demand-qualified-country-risk.server.test.ts src/lib/geomacro-machine-commercial-operator.server.test.ts src/__tests__/signed-publication-recovery-preflight.test.ts src/lib/single-original-private-authority.server.test.ts
      - name: Compile private machine acceptance, without running or supplying secrets
        run: |
          bun build scripts/ops/accept-private-geomacro-machine-commercial-gro.ts --target=bun --outfile=/tmp/geomacro-machine-commercial-operator.js
          test -s /tmp/geomacro-machine-commercial-operator.js
      - name: Explicit no-funds/no-prod-mutation source boundary
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const source=readFileSync("src/lib/geomacro-machine-commercial-qualification.server.ts","utf8");
          for(const forbidden of ["settleCoinbaseX402(","D1.prepare(","publishB2VerifiedHotSnapshot(","requireRiskSupabase(","GEOMACRO_INDEPENDENT_REVIEW_PUBLIC_KEY_PEM"]){
            if(source.includes(forbidden))throw Error("UNSAFE_MACHINE_COMMERCIAL_MUTATION");
          }
          if(!source.includes('input.profile==="FEDERICO_STRICT"')||
             !source.includes("checkGeomacroMachineOriginalRightsPreflight")||
             !source.includes("RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64")||
             !source.includes("facts_signature_b64")||
             !source.includes("rights_signature_b64"))throw Error("MACHINE_PROOF_BOUNDARY_INCOMPLETE");
          console.log("GEOMACRO_MACHINE_DUAL_ATTESTATION_NO_FUNDS_CONTRACT_PASS");
          NODE

  production-authority-preflight:
    # Public verification material and presence booleans only. No private keys,
    # B2/D1 credentials, attestation creation, network source reads or writes.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify actual production machine authority configuration without asserting signed evidence
        env:
          GEOMACRO_PUBLICATION_PROFILE: GEOMACRO_AUTOMATED_CROSS_SOURCE_NOT_EXTERNAL_REVIEWED_V1
          RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
          GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_PEM }}
          GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256 }}
          GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_PEM }}
          GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256 }}
          GRO_SIGNER_PRIVATE_CONFIGURED: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 != '' }}
          B2_WRITER_CONFIGURED: ${{ secrets.B2_KEY_ID != '' && secrets.B2_APPLICATION_KEY != '' }}
          B2_ARCHIVE_READER_CONFIGURED: ${{ secrets.B2_ARCHIVE_READ_KEY_ID != '' && secrets.B2_ARCHIVE_READ_APPLICATION_KEY != '' }}
          D1_CONTROL_PLANE_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
          PUBLICATION_AUTH_CONFIGURED: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN != '' }}
        run: bun scripts/ops/signed-publication-recovery-preflight.ts
      - name: Preserve sanitized production blockers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: machine-publication-authority-preflight-${{ github.run_id }}
          path: artifacts/public-serving/recovery-preflight.json
          if-no-files-found: warn
          retention-days: 7
