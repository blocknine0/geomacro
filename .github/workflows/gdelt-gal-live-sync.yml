name: GDELT GAL Live Hot-Topic Sync

on:
  # Quota-held: never start legacy PostgreSQL writes from a main push.
  workflow_dispatch:
    inputs:
      permit_legacy_supabase_gal:
        description: "Explicit owner-approved recovery after independent normal free-tier budget proof"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.permit_legacy_supabase_gal == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      B2_GDELT_PRIMARY: "1"
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_REQUEST_BUDGET: "4"
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: gdelt_gal_recovery
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      LIVE_STRUCTURE_EXECUTION_MODE: local_direct_postgres
      LIVE_STRUCTURE_DRAIN_CONCURRENCY: "1"
      LIVE_STRUCTURE_MAX_CYCLES: "12"
      GDELT_GAL_CYCLE_OUTPUT_DIR: gdelt-gal-cycle
      GDELT_GAL_CYCLE_MAX_ATTEMPTS: "3"
      GDELT_GAL_CYCLE_BACKOFF_SECONDS: "30"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require current Supabase free-tier budget before any recovery SQL writer
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          err="$(mktemp)"
          trap 'rm -f "$report" "$err"' EXIT
          if ! node scripts/ops/supabase-free-tier-budget.mjs --require-bulk-write --require-normal >"$report" 2>"$err"; then
            echo "::error::FROZEN_SUPABASE_LEGACY_RECOVERY_QUOTA_HELD"
            exit 3
          fi
          jq -e '.ok == true and .policy.recurring_ingest_allowed == true' "$report" >/dev/null ||
            { echo "::error::SUPABASE_NORMAL_HEADROOM_NOT_VERIFIED"; exit 3; }
          echo "PASS: free-tier budget independently cleared before manual legacy writer."

      - name: Resolve existing shared D1 B2 quota ledger (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}" ||
            { echo "::error::GDELT_B2_SHARED_D1_CREDENTIALS_REQUIRED"; exit 6; }
          LIST_JSON="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const rows=JSON.parse(s);
              if(!Array.isArray(rows)) throw Error("GDELT_D1_LIST_INVALID");
              const matches=rows.filter(row=>row.name===process.env.D1_DATABASE_NAME);
              if(matches.length!==1) throw Error("GDELT_SHARED_D1_NOT_FOUND");
              const id=String(matches[0].uuid??matches[0].id??"");
              if(!/^[0-9a-f-]{20,64}$/i.test(id)) throw Error("GDELT_D1_ID_INVALID");
              process.stdout.write(id);
            });
          ')"
          test -n "$DB_ID" || exit 7
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Read-only shared B2 quota preflight before GDELT upstream requests
        shell: bash
        run: |
          set -euo pipefail
          test "${B2_ACCOUNT_QUOTA_REQUIRED:-}" = "1"
          test "${B2_ACCOUNT_QUOTA_WORKFLOW_ID:-}" = "gdelt_gal_recovery"
          node --input-type=module -e '
            import { requireGdeltB2RecoveryHeadroom } from "./scripts/lib/gdelt-b2-shared-quota-guard.mjs";
            const proof=await requireGdeltB2RecoveryHeadroom();
            console.log(JSON.stringify(proof));
          '

      - name: Validate production invocation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL LIVE_STRUCTURE_TOKEN B2_KEY_ID B2_APPLICATION_KEY; do
            test -n "${!name:-}" || { echo "::error::$name missing"; exit 1; }
          done
          node scripts/db/assert-authoritative-supabase.mjs
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const { data, error } = await db
            .from('live_ingestion_cursors')
            .select('source_key,stream_key')
            .eq('source_key', 'gdelt_gal')
            .eq('stream_key', 'global-relevant')
            .maybeSingle();
          if (error) throw new Error(error.message);
          if (!data) throw new Error('GDELT_GAL_CURSOR_MISSING');
          console.log(JSON.stringify({ ok: true, transport: 'direct_postgres', source_key: data.source_key }));
          NODE
          node --check scripts/sync-gdelt-gal-production.mjs
          node --check scripts/run-gdelt-gal-cycle.mjs
          node --check scripts/verify-gdelt-gal-cycle.mjs
          bun build scripts/run-live-structure-local.ts --target=node --outfile=/tmp/run-live-structure-local.mjs >/dev/null

      - name: Run canonical GDELT GAL fresh cycle
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-gdelt-gal-cycle.mjs 2>&1 | tee gdelt-gal-cycle.log
          grep -q 'PASS: GDELT GAL FRESH CYCLE COMPLETE; CURSOR, FRAGMENT, STRUCTURE, RIGHTS AND HOT-TOPIC HEALTH VERIFIED' gdelt-gal-cycle.log
          jq -e '.ok == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.source_lag_within_1800_seconds == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.lag_within_1800_seconds == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.fresh_fragment_created == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.fragment_reached_structured_event_layer == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.structured_event_rights_reconciled == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.hot_topic_pipeline_healthy == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.hot_topic_claim_boundary_safe == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.hot_topic_report_read_only == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.writes_performed_by_verifier == false' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          grep -q 'local_canonical_source_direct_postgres' gdelt-gal-cycle/structure.log

      - name: Upload sanitized GDELT GAL cycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gdelt-gal-live-hot-topic-cycle
          path: |
            gdelt-gal-cycle.log
            gdelt-gal-cycle/*.json
            gdelt-gal-cycle/*.log
          if-no-files-found: warn
          retention-days: 30
