name: GDELT GAL Live Hot-Topic Sync

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/gdelt-gal-live-sync.yml"
      - "scripts/run-gdelt-gal-cycle.mjs"
      - "scripts/sync-gdelt-gal-production.mjs"
      - "scripts/reconcile-structured-event-commercial-rights.mjs"
      - "scripts/verify-gdelt-gal-cycle.mjs"
      - "scripts/audit-agent-hot-topic-readiness.ts"
      - "scripts/lib/gri-db-client.mjs"
      - "scripts/lib/direct-postgres-supabase-loader.mjs"

# The recurring scheduler remains quota-held. This self-scoped push trigger gives
# #1414 one deterministic recovery/proof run when the canonical recovery path changes.

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      B2_GDELT_PRIMARY: "1"
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      GDELT_GAL_CYCLE_OUTPUT_DIR: gdelt-gal-cycle
      GDELT_GAL_CYCLE_MAX_ATTEMPTS: "3"
      GDELT_GAL_CYCLE_BACKOFF_SECONDS: "30"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate production invocation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL LIVE_STRUCTURE_TOKEN; do
            test -n "${!name:-}" || { echo "::error::$name missing"; exit 1; }
          done
          node scripts/db/assert-authoritative-supabase.mjs
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const { data, error } = await db
            .from('live_ingestion_cursors')
            .select('source_key,stream_key')
            .eq('source_key', 'gdelt_gal')
            .eq('stream_key', 'global-relevant')
            .maybeSingle();
          if (error) throw new Error(error.message);
          if (!data) throw new Error('GDELT_GAL_CURSOR_MISSING');
          console.log(JSON.stringify({ ok: true, transport: 'direct_postgres', source_key: data.source_key }));
          NODE
          node --check scripts/sync-gdelt-gal-production.mjs
          node --check scripts/run-gdelt-gal-cycle.mjs
          node --check scripts/verify-gdelt-gal-cycle.mjs

      - name: Run canonical GDELT GAL fresh cycle
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-gdelt-gal-cycle.mjs 2>&1 | tee gdelt-gal-cycle.log
          grep -q 'PASS: GDELT GAL FRESH CYCLE COMPLETE; CURSOR, FRAGMENT, STRUCTURE, RIGHTS AND HOT-TOPIC HEALTH VERIFIED' gdelt-gal-cycle.log
          jq -e '.ok == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.source_lag_within_1800_seconds == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.lag_within_1800_seconds == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.fresh_fragment_created == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.fragment_reached_structured_event_layer == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.structured_event_rights_reconciled == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.hot_topic_pipeline_healthy == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.hot_topic_claim_boundary_safe == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.hot_topic_report_read_only == true' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null
          jq -e '.verification.acceptance.writes_performed_by_verifier == false' gdelt-gal-cycle/gdelt-gal-cycle-summary.json >/dev/null

      - name: Upload sanitized GDELT GAL cycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gdelt-gal-live-hot-topic-cycle
          path: |
            gdelt-gal-cycle.log
            gdelt-gal-cycle/*.json
            gdelt-gal-cycle/*.log
          if-no-files-found: warn
          retention-days: 30
