name: Commercial Release Candidate Evidence

on:
  pull_request:
    paths:
      - "config/commercial-launch-manifest.json"
      - "config/agent-marketplace-distribution.json"
      - "config/auto-distribution.json"
      - "public/.well-known/geomacro-agent.json"
      - "public/.well-known/geomacro-commerce.json"
      - "public/openapi-x402.json"
      - "public/agent-commerce.md"
      - "public/llms.txt"
      - "scripts/marketing/auto-distribute-alert.mjs"
      - "scripts/marketing/distribution-receipt-ledger.mjs"
      - "scripts/marketing/poll-public-early-warning.mjs"
      - "scripts/marketing/public-feed-adapter.mjs"
      - "src/lib/commercial-launch-gate.server.ts"
      - "src/lib/coinbase-x402.server.ts"
      - "src/lib/circle-gateway-x402-production.server.ts"
      - "src/routes/api.x402.circle_.intelligence.ts"
      - "src/lib/nevermined-x402.server.ts"
      - "src/lib/agent-commerce-delivery.server.ts"
      - "src/lib/commercial-growth.server.ts"
      - "supabase/migrations/934_agent_commerce_delivery_ledger.sql"
      - "supabase/migrations/935_commercial_marketing_draft_queue.sql"
      - "supabase/migrations/937_early_warning_alert_ledger.sql"
      - "supabase/migrations/94*_early_warning_distribution*.sql"
      - "scripts/build-commercial-release-candidate.mjs"
      - ".github/workflows/commercial-release-candidate-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact evaluated ref
        uses: actions/checkout@v7
      - name: Build prelaunch release candidate evidence
        env:
          COMMERCIAL_RC_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/build-commercial-release-candidate.mjs artifacts/commercial-release-candidate.json
      - name: Verify evidence remains non-authorizing
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('artifacts/commercial-release-candidate.json', 'utf8'));
          if (e.status !== 'prelaunch_evidence_only') throw new Error('unexpected RC status');
          if (e.production_activation_performed !== false) throw new Error('RC evidence cannot activate production');
          if (e.production_funds_authorized !== false) throw new Error('RC evidence cannot authorize production funds');
          if (e.official_launch_announced !== false) throw new Error('RC evidence cannot announce launch');
          if (JSON.stringify(e.payment_launch_cohort) !== JSON.stringify(['coinbase_x402','circle_gateway_x402','nevermined'])) throw new Error('unexpected payment launch cohort');
          if (!e.deferred_payment_providers?.goat_x402_mainnet) throw new Error('GOAT mainnet deferral is missing');
          const warning = e.public_early_warning_distribution;
          if (warning?.mode !== 'prelaunch-shadow') throw new Error('Early Warning distribution must remain shadow mode in RC evidence');
          if (warning?.default_dry_run !== true) throw new Error('Early Warning distribution must remain dry-run by default');
          if (warning?.live_publish_enabled !== false) throw new Error('Early Warning live push cannot be enabled by RC evidence');
          if (warning?.receipt_worker_wired !== true) throw new Error('Early Warning worker must remain receipt-ledger wired');
          if (warning?.ambiguous_outcome_retry !== 'manual_only') throw new Error('Early Warning ambiguous retry policy drifted');
          if (warning?.stale_unfinalized_claim_retry !== 'manual_only') throw new Error('Early Warning stale-claim retry policy drifted');
          const hashes = e.tracked_file_sha256 || {};
          for (const required of [
            'config/auto-distribution.json',
            'scripts/marketing/auto-distribute-alert.mjs',
            'scripts/marketing/distribution-receipt-ledger.mjs',
            'scripts/marketing/poll-public-early-warning.mjs',
            'supabase/migrations/937_early_warning_alert_ledger.sql',
            'supabase/migrations/940_early_warning_distribution_claims.sql',
            'supabase/migrations/941_early_warning_distribution_attempt_cap.sql',
            'supabase/migrations/942_early_warning_distribution_fail_closed_reclaim.sql',
          ]) {
            if (!/^[0-9a-f]{64}$/.test(hashes[required] || '')) throw new Error(`missing Early Warning RC hash for ${required}`);
          }
          if (Object.keys(hashes).length < 22) throw new Error('tracked-file evidence is incomplete');
          for (const [file, hash] of Object.entries(hashes)) {
            if (!/^[0-9a-f]{64}$/.test(hash)) throw new Error(`invalid hash for ${file}`);
          }
          NODE
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/commercial-release-candidate.json
          if-no-files-found: error
          retention-days: 90
