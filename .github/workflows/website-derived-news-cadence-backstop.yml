name: Website Derived News Cadence Backstop

# Hourly primary :07 UTC; secondary catch-up slots at :22 and :52 UTC.
# GitHub schedules are best effort; publisher success clocks, not time slots,
# determine whether bounded recovery is necessary.
# Only publish if the *last genuinely completed successful D1 writer* is
# stale, never based on a recently visited site or an original news date.
on:
  workflow_call: {}
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Geomacro Intelligence Orchestrator", "Three-Domain 30-Minute Original Publisher Pulse", "Deploy D1 Control Plane", "Global OSINT to Website Intelligence (15-Minute Discovery)"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "22,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-derived-news-cadence-backstop.yml"
      - "scripts/lib/derived-news-readback-policy.mjs"
      - "scripts/tests/derived-news-readback-policy.test.mjs"
      - "scripts/ops/verify-derived-news-public-readback.mjs"
      - "scripts/tests/derived-news-public-readback.test.mjs"
      - "scripts/ops/check-website-derived-news-cadence.mjs"
      - "scripts/lib/five-minute-news-cadence-watch.mjs"
      - "scripts/ops/recover-stalled-five-minute-news.mjs"
      - "scripts/tests/five-minute-news-cadence-watch.test.mjs"
      - "scripts/lib/website-derived-news-failover.mjs"
      - "scripts/lib/news-self-healing-policy.mjs"
      - "scripts/lib/news-self-healing-policy.test.mjs"
      - "scripts/ops/news-self-healing-watchdog.ts"
      - "scripts/ops/refresh-public-news-pages-under-quota.mjs"
      - "scripts/tests/refresh-public-news-pages-under-quota.test.mjs"
      - "scripts/ops/verify-public-d1-materialization-live.mjs"
      - "scripts/tests/verify-public-d1-materialization-live.test.mjs"
      - "scripts/tests/materialized-origin-owner-route.test.mjs"
      - "workers/control-plane/src/materialized-public-news-pages.mjs"
      - "scripts/tests/website-derived-news-failover.test.mjs"
      - "scripts/lib/automated-finds-run-health.mjs"
      - "scripts/tests/automated-finds-run-health.test.mjs"
      - "scripts/lib/derived-news-source-health.mjs"
      - "scripts/tests/derived-news-source-health.test.mjs"
      - "scripts/lib/material-gri-news-review.mjs"
      - "scripts/tests/material-gri-news-review.test.mjs"
      - "scripts/lib/material-gri-country-evidence-worklist.mjs"
      - "scripts/ops/build-material-gri-country-worklist.mjs"
      - "scripts/tests/material-gri-country-evidence-worklist.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/website-derived-news-cadence-backstop.yml"
      - "scripts/lib/derived-news-readback-policy.mjs"
      - "scripts/tests/derived-news-readback-policy.test.mjs"
      - "scripts/ops/verify-derived-news-public-readback.mjs"
      - "scripts/tests/derived-news-public-readback.test.mjs"
      - "scripts/ops/check-website-derived-news-cadence.mjs"
      - "scripts/lib/five-minute-news-cadence-watch.mjs"
      - "scripts/ops/recover-stalled-five-minute-news.mjs"
      - "scripts/tests/five-minute-news-cadence-watch.test.mjs"
      - "scripts/lib/website-derived-news-failover.mjs"
      - "scripts/lib/news-self-healing-policy.mjs"
      - "scripts/lib/news-self-healing-policy.test.mjs"
      - "scripts/ops/news-self-healing-watchdog.ts"
      - "scripts/ops/refresh-public-news-pages-under-quota.mjs"
      - "scripts/tests/refresh-public-news-pages-under-quota.test.mjs"
      - "scripts/ops/verify-public-d1-materialization-live.mjs"
      - "scripts/tests/verify-public-d1-materialization-live.test.mjs"
      - "scripts/tests/materialized-origin-owner-route.test.mjs"
      - "workers/control-plane/src/materialized-public-news-pages.mjs"
      - "scripts/tests/website-derived-news-failover.test.mjs"
      - "scripts/lib/automated-finds-run-health.mjs"
      - "scripts/tests/automated-finds-run-health.test.mjs"
      - "scripts/lib/derived-news-source-health.mjs"
      - "scripts/tests/derived-news-source-health.test.mjs"
      - "scripts/lib/material-gri-news-review.mjs"
      - "scripts/tests/material-gri-news-review.test.mjs"
      - "scripts/lib/material-gri-country-evidence-worklist.mjs"
      - "scripts/ops/build-material-gri-country-worklist.mjs"
      - "scripts/tests/material-gri-country-evidence-worklist.test.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: geomacro-derived-news-cadence-backstop
  cancel-in-progress: false

jobs:
  quota-admission:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    outputs:
      critical: ${{ steps.budget.outputs.critical }}
      research: ${{ steps.budget.outputs.research }}
      source_intake: ${{ steps.budget.outputs.source_intake }}
      snapshot_refresh: ${{ steps.budget.outputs.snapshot_refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Check account-wide D1 headroom before dispatch or catch-up
        id: budget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs

  quota-bounded-public-news-page-refresh:
    needs: quota-admission
    # Reuses existing :22/:52 cadence + authorized event wakeups.
    # No extra cron or source fetch. May run when publisher is quota-held
    # only with a real provider account-wide read/write safety reserve.
    if: >-
      needs.quota-admission.outputs.snapshot_refresh == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    concurrency:
      group: geomacro-public-news-d1-snapshot-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Validate bounded refresh and protected failure contract
        run: |
          node --test scripts/tests/refresh-public-news-pages-under-quota.test.mjs
          node --test scripts/tests/materialized-public-news-pages.test.mjs
      - name: Materialize verified public D1 page snapshots without source ingestion
        id: materialize
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/refresh-public-news-pages-under-quota.mjs
      - name: Prove anonymous materialized read against owner-only direct D1 origin
        if: steps.materialize.outputs.refresh_active == 'true'
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          node --test scripts/tests/verify-public-d1-materialization-live.test.mjs scripts/tests/materialized-origin-owner-route.test.mjs
          node scripts/ops/verify-public-d1-materialization-live.mjs

  cadence-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify privacy-safe missed-tick recovery rules
        run: |
          node --check scripts/lib/website-derived-news-failover.mjs
          node --check scripts/ops/check-website-derived-news-cadence.mjs
          node --check scripts/lib/five-minute-news-cadence-watch.mjs
          node --check scripts/ops/recover-stalled-five-minute-news.mjs
          node --check scripts/lib/news-self-healing-policy.mjs
          node --test scripts/lib/news-self-healing-policy.test.mjs
          node --check scripts/ops/verify-derived-news-public-readback.mjs
          node --test scripts/tests/derived-news-public-readback.test.mjs
          node --test scripts/tests/five-minute-news-cadence-watch.test.mjs
          node --test scripts/tests/website-derived-news-failover.test.mjs scripts/tests/automated-finds-run-health.test.mjs scripts/tests/derived-news-source-health.test.mjs scripts/tests/material-gri-news-review.test.mjs scripts/tests/material-gri-country-evidence-worklist.test.mjs

  automatically-reconcile-public-pipeline:
    # Reuse the existing :22/:52 watchdog and its quota-admission receipt;
    # no additional cron or new D1 writer. Static deployment can recover
    # without research headroom. D1 catch-up requires research=true.
    needs: quota-admission
    if: >-
      always() &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'push' &&
      (needs.quota-admission.result == 'success' ||
       needs.quota-admission.result == 'failure') &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: geomacro-news-self-heal-controller
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Verify bounded self-heal decision and circuit breaker
        run: |
          bun --version
          node --check scripts/lib/news-self-healing-policy.mjs
          node --test scripts/lib/news-self-healing-policy.test.mjs
      - name: Crosscheck live D1, static archive, daily highlights and website; dispatch only permitted repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEOMACRO_RECOVERY_RESEARCH_ADMITTED: ${{ needs.quota-admission.outputs.research }}
          GEOMACRO_RECOVERY_QUOTA_JOB_OK: ${{ needs.quota-admission.result == 'success' }}
        run: bun scripts/ops/news-self-healing-watchdog.ts

  fastlane-actual-publisher-cadence-watch:
    needs: quota-admission
    # Reuse EXISTING :22/:52 cron + original-source pulse workflow_run wakeups,
    # and this workflow's main push, NOT a paid/new poll or unbounded extra cron.
    # An exact D1-publisher JOB success is required, not a green contract job.
    if: >-
      needs.quota-admission.outputs.source_intake == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout immutable watchdog and existing official-source contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify actual current news-publisher run and dispatch ONLY if stale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ops/recover-stalled-five-minute-news.mjs

  catch-up-derived-only:
    needs: quota-admission
    if: needs.quota-admission.outputs.research == 'true' && github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)))
    concurrency:
      group: geomacro-website-derived-news-continuity
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      GEOMACRO_AUTOMATED_FINDS_PUBLICATION: "1"
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: automated_finds
      B2_REQUEST_BUDGET: "12"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
      RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Read latest successful actual primary D1 publication clock
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ops/check-website-derived-news-cadence.mjs
      - name: Install pinned Bun only when recovery is necessary
        if: steps.decide.outputs.should_run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Resolve existing D1 shared B2 quota ledger
        if: steps.decide.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!/^[a-f0-9]{32}$/.test(account||''))throw Error('FINDS_D1_ACCOUNT_MISSING');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?per_page=100',{
            headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          const id=data.result?.find(x=>x.name==='geomacro-control-plane')?.uuid;
          if(!response.ok||data.success!==true||!/^[a-f0-9-]{36}$/.test(id||''))throw Error('FINDS_D1_LEDGER_UNAVAILABLE');
          appendFileSync(process.env.GITHUB_ENV,'D1_DATABASE_ID='+id+'\n');
          NODE
      - name: Publish bounded 3-domain derived news to existing D1 (idempotent)
        if: steps.decide.outputs.should_run == 'true'
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || {
            echo "::error::D1 derived-news recovery authorization missing"
            exit 2
          }
          bun scripts/ops/publish-website-derived-news.ts
      - name: Prepare source-free GRI country evidence tasks after genuine recovered publication
        if: steps.decide.outputs.should_run == 'true'
        run: node scripts/ops/build-material-gri-country-worklist.mjs
      - name: Independently verify signed Finds across combined and category reads
        if: always() && steps.decide.outputs.should_run == 'true'
        # A held B2/archive signer is a separately monitored signed-product
        # degradation, not a failure of the independently verified free D1 feed.
        continue-on-error: true
        shell: bash
        run: |
          bun - <<'TS'
          import {loadRiskObjectVerificationKeysFromEnv} from './src/lib/risk-object-signing.server';
          import {verifyAutomatedFindsEnvelope,FINDS_CATEGORIES} from './src/lib/automated-finds-contract';
          const keys=loadRiskObjectVerificationKeysFromEnv();
          const root='https://geomacro-control-plane.daspallab202391.workers.dev/v1/public/automated-finds';
          for(const category of [null,...FINDS_CATEGORIES]){
            const response=await fetch(root+(category?'?category='+category:''),{
              redirect:'error',cache:'no-store',signal:AbortSignal.timeout(12000)});
            if(!response.ok)throw Error('AUTOMATED_FINDS_INDEPENDENT_READBACK_UNAVAILABLE');
            const raw=await response.text();if(raw.length>300000)throw Error('AUTOMATED_FINDS_READBACK_OVERSIZE');
            const doc=JSON.parse(raw);
            if(doc.ok!==true||doc.schema!=='geomacro.automated-finds-feed.v1'||doc.chargeable!==false||
               doc.independent_reviewed!==false||!Array.isArray(doc.batches)||doc.batches.length!==(category?1:3))
              throw Error('AUTOMATED_FINDS_PUBLIC_READBACK_INVALID');
            for(const envelope of doc.batches){
              await verifyAutomatedFindsEnvelope(envelope,keys);
              if(envelope.payload.source_sha!==process.env.GITHUB_SHA||
                 (category&&envelope.payload.category!==category))throw Error('AUTOMATED_FINDS_EXACT_SOURCE_MISMATCH');
            }
            console.log(JSON.stringify({schema:'geomacro.automated-finds-independent-readback.v1',
              scope:category??'combined',http_status:response.status,signatures_verified:doc.batches.length,
              exact_source_sha:true,current_batch_b2_verified:doc.full_b2_readback_verified,
              prior_archive_available:doc.archive_checkpoint!==null,categories:doc.categories,
              independent_reviewed:false,chargeable:false,supabase_requests:0,payments:0}));
          }
          TS
      - name: Independently prove private-source-free D1 readback after recovery
        if: steps.decide.outputs.should_run == 'true'
        shell: bash
        run: node scripts/ops/verify-derived-news-public-readback.mjs

      - name: Print explicit successful no-write decision
        if: steps.decide.outputs.should_run != 'true'
        run: echo "NEWS_BACKSTOP_SKIPPED_PRIMARY_PUBLISHER_CURRENT"

      - name: Save recovery source-health receipt without upstream data
        if: always() && steps.decide.outputs.should_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: derived-news-recovery-health-${{ github.run_id }}
          path: artifacts/derived-news/source-health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save recovered GRI country/category review tasks
        if: always() && steps.decide.outputs.should_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovered-gri-country-review-${{ github.run_id }}
          path: artifacts/derived-news/material-gri-country-evidence-worklist.json
          if-no-files-found: warn
          retention-days: 3
      - name: Save bounded high-impact GRI evidence-review candidates (no scoring)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: material-gri-original-review-${{ github.run_id }}
          path: artifacts/derived-news/material-gri-review.json
          if-no-files-found: warn
          retention-days: 3
