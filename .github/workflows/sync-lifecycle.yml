name: Sync Market Lifecycle
# Existing Arc Testnet markets still need lifecycle reconciliation while the
# market surface remains secondary technical proof. Run one bounded sync every
# two hours instead of keeping a runner alive for almost the entire hour.
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-lifecycle
  cancel-in-progress: true

jobs:
  sync-lifecycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Verify Arc Testnet and contract target
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: node scripts/ops/verify-arc-testnet-target.mjs
      - name: Verify authoritative Supabase target
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: node scripts/db/assert-authoritative-supabase.mjs
      - name: Run one bounded lifecycle sync
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OLD_CONTRACT_ADDRESS: ${{ secrets.OLD_CONTRACT_ADDRESS }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_2: ${{ secrets.ARC_RPC_URL_2 }}
          ARC_RPC_URL_3: ${{ secrets.ARC_RPC_URL_3 }}
          ARC_RPC_URL_4: ${{ secrets.ARC_RPC_URL_4 }}
          ARC_RPC_URL_5: ${{ secrets.ARC_RPC_URL_5 }}
          SYNC_MULTICALL_CHUNK_SIZE: "150"
          RUN_TIME_BUDGET_MS: "360000"
        run: node scripts/sync-lifecycle.js
