name: Sync Market Lifecycle
# Existing Arc Testnet markets still need lifecycle reconciliation while the
# market surface remains secondary technical proof. Run one bounded sync every
# two hours instead of keeping a runner alive for almost the entire hour.
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch: {}
concurrency:
  group: sync-lifecycle
  cancel-in-progress: true
jobs:
  sync-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install ethers @supabase/supabase-js
      - name: Run one bounded lifecycle sync
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OLD_CONTRACT_ADDRESS: ${{ secrets.OLD_CONTRACT_ADDRESS }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_2: ${{ secrets.ARC_RPC_URL_2 }}
          ARC_RPC_URL_3: ${{ secrets.ARC_RPC_URL_3 }}
          ARC_RPC_URL_4: ${{ secrets.ARC_RPC_URL_4 }}
          ARC_RPC_URL_5: ${{ secrets.ARC_RPC_URL_5 }}
          SYNC_MULTICALL_CHUNK_SIZE: "150"
          RUN_TIME_BUDGET_MS: "360000"
        run: node scripts/sync-lifecycle.js
