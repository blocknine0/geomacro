name: Step3 Genuine Shadow Original B2 ACK - No Production DDL
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type SEED_REAL_SHADOW_B2_ACK_ONLY"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: geomacro-step3-shadow-original-b2-seed
  cancel-in-progress: false
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUESTED_APPROVAL: ${{ inputs.approval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: node --test scripts/tests/step3-shadow-real-original-seed-contract.test.mjs
      - shell: bash
        run: |
          set -euo pipefail
          test "$REQUESTED_APPROVAL" = 'SEED_REAL_SHADOW_B2_ACK_ONLY'
  shadow-source:
    needs: offline-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      inputs.approval == 'SEED_REAL_SHADOW_B2_ACK_ONLY' &&
      vars.GEOMACRO_STEP3_SHADOW_REHEARSAL_APPROVED == 'YES'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_TARGET_APPROVED: "YES"
      GEOMACRO_STEP3_SHADOW_REHEARSAL_APPROVED: "YES"
      GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET: ${{ vars.GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET }}
      GEOMACRO_STEP3_SHADOW_CONTROL_PLANE_TOKEN: ${{ secrets.GEOMACRO_STEP3_SHADOW_CONTROL_PLANE_TOKEN }}
      PHASE2H_PROVIDER_MAINTENANCE: "true"
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: registered_original_archive
      B2_REQUEST_BUDGET: "12"
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Require exact main and existing canary hold
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f config/d1-hotspot-v2-canary.hold
          test "$D1_DATABASE_ID" != "$GEOMACRO_D1_SHADOW_DATABASE_ID"
          bun -e "import('./scripts/ops/seed-step3-shadow-archived-original.mjs').then(x=>x.assertScope(process.env))"
      - name: Paid monthly headroom before globally governed B2 and Shadow D1 writes
        run: bun scripts/ops/check-d1-paid-monthly-headroom.mjs --check
      - name: Genuine first-party original and physical B2 Shadow archive ACK
        run: bun scripts/ops/seed-step3-shadow-archived-original.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-shadow-real-b2-ack-${{ github.run_id }}
          path: artifacts/release/step3-shadow-real-b2-ack-seed.json
          retention-days: 14
          if-no-files-found: warn
