name: Hot Topic Family Readiness

on:
  pull_request:
    paths:
      - "src/lib/hot-topic-taxonomy.ts"
      - "src/lib/hot-topic-taxonomy.test.ts"
      - "src/lib/agent-query-hot-topics.server.ts"
      - "src/__tests__/agent-query-hot-topics-static.test.ts"
      - "src/__tests__/hot-topic-readiness-self-heal-static.test.ts"
      - "scripts/audit-hot-topic-family-readiness.ts"
      - ".github/workflows/hot-topic-family-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/hot-topic-taxonomy.ts"
      - "src/lib/agent-query-hot-topics.server.ts"
      - "src/__tests__/hot-topic-readiness-self-heal-static.test.ts"
      - "scripts/audit-hot-topic-family-readiness.ts"
      - ".github/workflows/hot-topic-family-readiness.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "GDELT GAL Live Hot-Topic Sync"
    types:
      - completed
  schedule:
    - cron: "43 */2 * * *"

permissions:
  contents: read

concurrency:
  group: hot-topic-family-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run taxonomy and delivery boundary tests
        run: bunx vitest run src/lib/hot-topic-taxonomy.test.ts src/__tests__/agent-query-hot-topics-static.test.ts src/__tests__/hot-topic-readiness-self-heal-static.test.ts

      - name: Guard family count and no raw-source delivery
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'HOT_TOPIC_TAXONOMY_VERSION =' src/lib/hot-topic-taxonomy.ts && grep -q 'geomacro.hot-topic-family.v2' src/lib/hot-topic-taxonomy.ts
          grep -q 'raw_source_material_redistributed: false' src/lib/agent-query-hot-topics.server.ts
          grep -q 'article_text_redistributed: false' src/lib/agent-query-hot-topics.server.ts
          grep -q 'unclassified_events_excluded_from_family_specific_results: true' src/lib/agent-query-hot-topics.server.ts
          ! grep -q 'evidence_refs' src/lib/agent-query-hot-topics.server.ts
          ! grep -q 'source_url' src/lib/agent-query-hot-topics.server.ts
          echo 'PASS: governed hot-topic family delivery boundary is static-safe'

  production-readiness:
    # Live readiness requires fresh upstream GDELT state. Serialize with the
    # canonical orchestrator so readiness never races an in-flight fresh cycle.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    concurrency:
      group: geomacro-intelligence-orchestrator
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      HOT_TOPIC_FAMILY_READINESS_OUTPUT: hot-topic-family-readiness.json
      GDELT_GAL_CYCLE_OUTPUT_DIR: gdelt-gal-readiness-repair
      GDELT_GAL_CYCLE_MAX_ATTEMPTS: "3"
      GDELT_GAL_CYCLE_BACKOFF_SECONDS: "30"
    steps:
      - name: Checkout canonical ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate production database target
        run: node scripts/db/assert-authoritative-supabase.mjs

      - name: Self-heal GDELT GAL freshness before readiness proof
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";
          const url = String(process.env.APP_SUPABASE_URL ?? "").trim();
          const key = String(process.env.APP_SUPABASE_SERVICE_ROLE_KEY ?? "").trim();
          if (!url || !key) throw new Error("AUTHORITATIVE_SUPABASE_CREDENTIALS_REQUIRED");
          if (new URL(url).hostname.split(".")[0] !== "ldpwajisioljyjtojvfx") throw new Error("NON_AUTHORITATIVE_SUPABASE_PROJECT");
          const db = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
          const { data, error } = await db
            .from("live_ingestion_cursors")
            .select("status,last_success_at,consecutive_failures")
            .eq("source_key", "gdelt_gal")
            .eq("stream_key", "global-relevant")
            .maybeSingle();
          if (error) throw error;
          const lastSuccessMs = Date.parse(String(data?.last_success_at ?? ""));
          const ageSeconds = Number.isFinite(lastSuccessMs)
            ? Math.max(0, (Date.now() - lastSuccessMs) / 1000)
            : Number.POSITIVE_INFINITY;
          const healthy =
            Number.isFinite(lastSuccessMs) &&
            ageSeconds <= 1200 &&
            String(data?.status ?? "") === "healthy" &&
            Number(data?.consecutive_failures ?? 0) === 0;
          console.log(JSON.stringify({
            source_key: "gdelt_gal",
            stream_key: "global-relevant",
            status: data?.status ?? null,
            last_success_at: data?.last_success_at ?? null,
            age_seconds: Number.isFinite(ageSeconds) ? Math.round(ageSeconds) : null,
            repair_required: !healthy,
            repair_threshold_seconds: 1200,
          }, null, 2));
          process.exit(healthy ? 0 : 2);
          NODE
          probe_status=$?
          set -e

          if [ "$probe_status" -eq 2 ]; then
            test -n "${LIVE_STRUCTURE_TOKEN:-}" || { echo "::error::LIVE_STRUCTURE_TOKEN missing for governed GDELT freshness repair"; exit 1; }
            echo "GDELT GAL is outside the freshness repair buffer; running the canonical fresh cycle."
            node scripts/run-gdelt-gal-cycle.mjs 2>&1 | tee gdelt-gal-readiness-repair.log
            grep -q 'PASS: GDELT GAL FRESH CYCLE COMPLETE; CURSOR, FRAGMENT, STRUCTURE, RIGHTS AND HOT-TOPIC HEALTH VERIFIED' gdelt-gal-readiness-repair.log
          elif [ "$probe_status" -ne 0 ]; then
            exit "$probe_status"
          fi

      - name: Generate family-level hot-topic readiness proof
        run: bun scripts/audit-hot-topic-family-readiness.ts --require-pipeline-healthy --require-taxonomy-complete

      - name: Validate family contract and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.writes_performed == false' hot-topic-family-readiness.json >/dev/null
          jq -e '.source_pipeline.healthy == true' hot-topic-family-readiness.json >/dev/null
          jq -e '.summary.governed_family_count == (.families | length)' hot-topic-family-readiness.json >/dev/null
          jq -e '.summary.taxonomy_supported_family_count == .summary.governed_family_count' hot-topic-family-readiness.json >/dev/null
          jq -e '.summary.future_timestamp_event_count == 0' hot-topic-family-readiness.json >/dev/null
          jq -e '.claim_boundary.raw_article_or_publisher_material_redistributed == false' hot-topic-family-readiness.json >/dev/null
          jq -e '.claim_boundary.event_detection_does_not_substitute_for_required_structural_module == true' hot-topic-family-readiness.json >/dev/null
          jq -e '.claim_boundary.blocked_rights_current_signal_is_not_chargeable_for_that_family == true' hot-topic-family-readiness.json >/dev/null
          jq '{taxonomy_version,generated_at,source_pipeline,summary,families,claim_boundary}' hot-topic-family-readiness.json

      - name: Upload sanitized family readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hot-topic-family-readiness
          path: |
            hot-topic-family-readiness.json
            gdelt-gal-readiness-repair.log
            gdelt-gal-readiness-repair/*.json
            gdelt-gal-readiness-repair/*.log
          if-no-files-found: warn
          retention-days: 30
