name: Database schema safety

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - 'config/production-history-only-migrations.json'
      - 'config/production-history-line-endings.json'
      - '.github/workflows/database-schema-safety.yml'
      - 'package.json'
  push:
    branches: [main, hardening/source-network-risk-gate-production]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - 'config/production-history-only-migrations.json'
      - 'config/production-history-line-endings.json'
      - '.github/workflows/database-schema-safety.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Reject destructive canonical migrations and verify immutable production history
        run: node scripts/db/check-migration-safety-history-aware.mjs

  disposable-migration-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          # Pin the CLI so CI does not depend on GitHub's unauthenticated
          # "latest release" lookup, which can fail under API rate limiting.
          version: 2.117.0
      # The replay must execute the exact Git revision under test; never trust a stale checkout.
      - name: Verify replay revision
        run: |
          echo "Replay revision: $(git rev-parse HEAD)"
          git show -s --format='Replay commit: %H %s' HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify and isolate production-history-only migrations
        run: node scripts/db/production-history-only.mjs quarantine .ci-history-only-migrations
      - name: Start disposable local Supabase
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,kong,gotrue,realtime,postgrest,storage-api,postgres-meta,mailpit
      - name: Replay the canonical migration chain from zero
        run: supabase db reset --local --no-seed
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Record green replay proof
        if: success() && github.ref == 'refs/heads/hardening/source-network-risk-gate-production'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-proofs
          cat > ".ci-proofs/migration-replay-${GITHUB_SHA}.json" <<EOF
          {
            "suite": "geomacro-full-migration-replay",
            "status": "PASS",
            "commit_sha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "cli_version": "2.117.0",
            "replay_command": "supabase db reset --local --no-seed",
            "production_history_only_manifest": "config/production-history-only-migrations.json"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".ci-proofs/migration-replay-${GITHUB_SHA}.json"
          git commit -m "ci: record green migration replay proof [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
