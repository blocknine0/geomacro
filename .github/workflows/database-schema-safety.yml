name: Database schema safety

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - '.github/workflows/database-schema-safety.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - '.github/workflows/database-schema-safety.yml'

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Reject destructive migrations and missing baseline
        run: node scripts/db/check-migration-safety.mjs

  disposable-migration-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pin the CLI so CI does not depend on GitHub's unauthenticated
          # "latest release" lookup, which can fail under API rate limiting.
          version: 2.117.0
      - name: Start disposable local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Replay the full migration chain from zero
        run: supabase db reset --local --no-seed
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
