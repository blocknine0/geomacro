name: Public Production Prelisting Health

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact canonical main SHA published to public production after canary+safety acceptance"
        required: true
        type: string
      canary_cohort_run_id:
        description: "Successful Production Canary Cohort Acceptance run ID"
        required: true
        type: string
      safety_acceptance_run_id:
        description: "Successful Commerce Safety Drill Acceptance run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: public-production-prelisting-health
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEOMACRO_PRODUCTION_ACCEPTANCE_SHA: ${{ inputs.candidate_sha }}
      GEOMACRO_PUBLIC_PRODUCTION_BASE_URL: https://geomacro.live
      GEOMACRO_PUBLIC_PRELISTING_HEALTH_OUTPUT: /tmp/public-prelisting-health.json
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Require exact current main SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${DISPATCH_SHA,,}" ]]

      - name: Verify canary cohort and complete safety drill happened first
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          CANARY_RUN: ${{ inputs.canary_cohort_run_id }}
          SAFETY_RUN: ${{ inputs.safety_acceptance_run_id }}
        with:
          script: |
            const expected = String(process.env.EXPECTED_SHA).toLowerCase();
            const { owner, repo } = context.repo;
            const entries = [
              ['canary', Number(process.env.CANARY_RUN), '.github/workflows/production-canary-cohort-acceptance.yml'],
              ['safety', Number(process.env.SAFETY_RUN), '.github/workflows/commerce-safety-drill-acceptance.yml'],
            ];
            const runs = {};
            for (const [key, runId, path] of entries) {
              if (!Number.isInteger(runId) || runId <= 0) core.setFailed(`${key} run id invalid`);
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              runs[key] = run;
              if (run.path !== path) core.setFailed(`${key}: wrong workflow`);
              if (run.event !== 'workflow_dispatch' || run.head_branch !== 'main') core.setFailed(`${key}: must be manual main run`);
              if (String(run.head_sha || '').toLowerCase() !== expected) core.setFailed(`${key}: SHA mismatch`);
              if (run.status !== 'completed' || run.conclusion !== 'success') core.setFailed(`${key}: run is not successful`);
            }
            if (new Date(runs.safety.created_at).getTime() < new Date(runs.canary.created_at).getTime()) {
              core.setFailed('Safety acceptance predates canary cohort; required launch order violated');
            }

      - name: Verify same exact SHA is now public and all unpaid production 402 contracts are healthy
        run: node scripts/commerce/public-production-prelisting-health.mjs

      - name: Upload sanitized prelisting public-production evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-production-prelisting-health-${{ github.run_id }}
          path: /tmp/public-prelisting-health.json
          if-no-files-found: error
          retention-days: 14
