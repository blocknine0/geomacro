name: Research Risk Gate Official Source-to-State Contract (Supabase Production)

# Supabase pg_cron and Edge Functions now provide the actual independent
# protected 20-minute live producer. GitHub verifies repo source contracts only.
# No duplicate action scheduler needing missing GitHub service-role secrets.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/research-risk-gate-official-stream20m.yml"
      - "scripts/lib/research-gate-official-20m.mjs"
      - "scripts/lib/research-gate-official-20m.test.mjs"
      - "scripts/ops/run-research-risk-gate-official-20m.ts"
      - "src/lib/risk-gate/stream-ingest.ts"
      - "src/__tests__/research-risk-state.test.ts"
      - "config/official-ogl-atom-sources.json"
      - "config/research-risk-gate-official-atom-alternates.v1.json"
      - "scripts/tests/research-supabase-stream20m-security.test.mjs"
      - "scripts/tests/research-hot50-country-attribution.test.mjs"
      - "scripts/ops/probe-supabase-research-original-alternates.mjs"
      - "supabase/functions/gm-research-stream20m/index.ts"
      - "supabase/functions/gm-research-risk-gate/index.ts"
      - "supabase/migrations/20261104121000_research_stream20m_supabase_native_cron.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-risk-gate-official-stream20m.yml"
      - "scripts/lib/research-gate-official-20m.mjs"
      - "scripts/lib/research-gate-official-20m.test.mjs"
      - "scripts/ops/run-research-risk-gate-official-20m.ts"
      - "src/lib/risk-gate/stream-ingest.ts"
      - "scripts/tests/research-supabase-stream20m-security.test.mjs"
      - "scripts/tests/research-hot50-country-attribution.test.mjs"
      - "scripts/ops/probe-supabase-research-original-alternates.mjs"
      - "supabase/functions/gm-research-stream20m/index.ts"
      - "supabase/functions/gm-research-risk-gate/index.ts"
      - "supabase/migrations/20261104121000_research_stream20m_supabase_native_cron.sql"

permissions:
  contents: read
concurrency:
  group: geomacro-research-stream20m-noncommercial
  cancel-in-progress: false

jobs:
  verify-source-state-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install repo-pinned dependencies for Vitest (no unpinned network fallback)
        run: bun install --frozen-lockfile
      - name: Verify original-page first, three categories, zero queue, and rejected tampering
        run: |
          set -euo pipefail
          node --check scripts/lib/research-gate-official-20m.mjs
          bun test scripts/lib/research-gate-official-20m.test.mjs
          bun x vitest run src/__tests__/research-risk-state.test.ts
          node --test scripts/tests/research-supabase-stream20m-security.test.mjs scripts/tests/research-hot50-country-attribution.test.mjs
      - name: Probe four new issuer Atom transports without publisher content or database writes
        if: github.event_name == 'pull_request'
        run: node scripts/ops/probe-supabase-research-original-alternates.mjs
      - name: Preserve native publisher transport states for review
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-research-official-alternate-source-health-${{ github.run_id }}
          path: /tmp/geomacro-research-source-probe.json
          retention-days: 7
          if-no-files-found: warn

