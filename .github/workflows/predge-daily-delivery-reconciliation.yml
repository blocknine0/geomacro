name: Predge Daily Delivery Reconciliation

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      day_utc:
        description: UTC day to reconcile (YYYY-MM-DD; defaults to today)
        required: false
        type: string
      partner_report_path:
        description: Optional repository path to Predge CSV or JSON report
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: geomacro-predge-daily-delivery-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Build daily D1 and optional partner reconciliation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAY_UTC: ${{ inputs.day_utc }}
          PARTNER_REPORT_PATH: ${{ inputs.partner_report_path }}
        run: |
          args=(--out-dir artifacts/predge-daily-delivery)
          if [[ -n "${DAY_UTC}" ]]; then args+=(--day "${DAY_UTC}"); fi
          if [[ -n "${PARTNER_REPORT_PATH}" ]]; then args+=(--partner-report "${PARTNER_REPORT_PATH}"); fi
          node scripts/ops/reconcile-predge-daily-delivery.mjs "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predge-daily-delivery-reconciliation-${{ github.run_id }}
          path: artifacts/predge-daily-delivery/*
          retention-days: 90
          if-no-files-found: error
