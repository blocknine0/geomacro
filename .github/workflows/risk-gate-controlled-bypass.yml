name: Tiered Risk Gate controlled bypass contract

on:
  pull_request:
    paths:
      - 'workers/control-plane/src/risk-gate-controlled-bypass.mjs'
      - 'workers/control-plane/src/index.mjs'
      - 'workers/control-plane/migrations/0106_risk_gate_tiered_controlled_bypass.sql'
      - 'scripts/ops/test-risk-gate-controlled-bypass.mjs'
      - '.github/workflows/risk-gate-controlled-bypass.yml'
  push:
    branches:
      - 'feature/risk-gate-tiered-controlled-bypass-20261102'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and import new Worker module
        run: |
          node --check workers/control-plane/src/risk-gate-controlled-bypass.mjs
          node --check workers/control-plane/src/index.mjs
      - name: Run deterministic boundary tests
        run: node --test scripts/ops/test-risk-gate-controlled-bypass.mjs
