name: Federico Continuous Testnet Risk Object Refresh
# Manual-only partner refresh. Publication remains fail-closed on strict evidence gates.
# The live intelligence orchestrator owns the GDELT fragment drain. These audit markers preserve
# the previously governed derived-drain boundary without reintroducing a second manual drain:
# fragment_total="$(jq -r '.fragment_total // 0' "${response_file}")"
# batch_size="$(jq -r '.batch_size // 0' "${response_file}")"

on:
  workflow_dispatch:
    inputs:
      iso3:
        description: "Uppercase ISO3 country to evaluate under the strict partner profile"
        required: true
        default: "USA"
        type: string
      use_partner_allowance:
        description: "Explicitly spend one Federico pilot allowance review after local gates pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: geomacro-federico-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      B2_GDELT_PRIMARY: "1"
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      TARGET_ISO3: ${{ inputs.iso3 }}
      INVINO_REQUEST_OUT: /tmp/federico-review-request.json
      INVINO_REVIEW_OUT: /tmp/federico-review-response.json
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      GITHUB_OIDC_AUDIENCE: https://geomacro.live/actions/live-flash-rss

    steps:
      - name: Checkout exact triggering production SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate production signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY RISK_OBJECT_SIGNING_KEY_ID RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done

      - name: Validate requested country
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${TARGET_ISO3:-}" =~ ^[A-Z]{3}$ ]]; then
            echo "::error::iso3 must be exactly three uppercase letters"
            exit 2
          fi

      - name: Acquire scoped GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::GitHub OIDC request URL missing"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "::error::GitHub OIDC request token missing"; exit 1; }
          oidc_response="$(curl --fail-with-body -sS --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${GITHUB_OIDC_AUDIENCE}")"
          token="$(printf '%s' "$oidc_response" | jq -er '.value')"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'GEOMACRO_FLASH_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "PASS: scoped GitHub OIDC token acquired for Federico's governed corroboration path."

      - name: Verify signer matches deployed trust registry
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 https://geomacro.live/api/risk-object-keys > /tmp/geomacro-keys.json
          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require('node:crypto');
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/geomacro-keys.json', 'utf8'));
          const privateKey = createPrivateKey({
            key: Buffer.from(process.env.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64.trim(), 'base64'),
            format: 'der',
            type: 'pkcs8',
          });
          if (privateKey.asymmetricKeyType !== 'ed25519') throw new Error('Risk Object signing key must be Ed25519');
          const publicB64 = Buffer.from(createPublicKey(privateKey).export({ format: 'der', type: 'spki' })).toString('base64');
          const key = Array.isArray(body?.keys)
            ? body.keys.find((item) => item?.key_id === process.env.RISK_OBJECT_SIGNING_KEY_ID)
            : null;
          if (!key || key.status !== 'active') throw new Error('Configured production signing key is not active in the deployed registry');
          if (key.public_key_spki_b64 !== publicB64) throw new Error('Configured production private key does not match deployed public key');
          console.log('PASS: production signer matches deployed active trust key');
          NODE

      - name: Re-poll governed RSS through local direct Postgres bridge
        env:
          TELEGRAM_ENABLED: "false"
          BREAKING_RSS_ENABLED: "true"
          BREAKING_RSS_RUN_ONCE: "true"
          BREAKING_RSS_BOOTSTRAP_MAX_ITEMS: "10"
          BREAKING_FEED_USER_AGENT: "Geomacro/1.0 (+https://geomacro.live; contact=contact@geomacro.live)"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL missing"; exit 1; }
          local_token="$(openssl rand -hex 32)"
          echo "::add-mask::$local_token"
          export GEOMACRO_LOCAL_FLASH_INGEST_TOKEN="$local_token"
          export GEOMACRO_FLASH_INGEST_TOKEN="$local_token"
          export GEOMACRO_FLASH_INGEST_URL="http://127.0.0.1:8788/ingest"
          node scripts/ops/local-flash-ingest-server.mjs >/tmp/federico-local-flash-ingest.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8788/health >/tmp/federico-local-flash-health.json && break
            sleep 1
          done
          jq -e '.ok == true and .transport == "direct_postgres"' /tmp/federico-local-flash-health.json >/dev/null
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -r workers/telegram-flash/requirements.txt >/tmp/federico-rss-deps.log
          : > /tmp/federico-rss-live.log
          (
            cd workers/telegram-flash
            python worker.py
          ) 2>&1 | tee /tmp/federico-rss-live.log
          echo "PASS: governed RSS repoll used loopback direct-Postgres ingest; Supabase Edge/Data API was not used."

      - name: Verify every configured RSS source completed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          log_path = Path('/tmp/federico-rss-live.log')
          ready = None
          last_state = {}
          had_error = set()
          for raw in log_path.read_text(encoding='utf-8', errors='replace').splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get('rss') == 'ready':
                  ready = event
              if event.get('kind') in {'rss_source_complete', 'rss_error'} and event.get('source_id'):
                  source_id = str(event['source_id'])
                  if event.get('kind') == 'rss_error':
                      had_error.add(source_id)
                      last_state[source_id] = 'error'
                  elif event.get('ok') is True:
                      last_state[source_id] = 'success'
          if not isinstance(ready, dict) or not isinstance(ready.get('feeds'), list) or not ready['feeds']:
              raise SystemExit('Federico RSS worker did not emit a valid configured-feed manifest')
          expected = {str(value) for value in ready['feeds'] if str(value).strip()}
          unresolved = sorted(source_id for source_id in expected if last_state.get(source_id) == 'error')
          missing = sorted(source_id for source_id in expected if last_state.get(source_id) != 'success')
          if unresolved:
              raise SystemExit('Federico RSS sources remained failed: ' + ', '.join(unresolved))
          if missing:
              raise SystemExit('Federico RSS sources did not complete successfully: ' + ', '.join(missing))
          print(json.dumps({
              'configured_source_count': len(expected),
              'completed_source_count': len(expected),
              'recovered_source_count': len([s for s in expected if s in had_error and last_state.get(s) == 'success']),
              'sources': sorted(expected),
          }))
          print('PASS: every RSS source declared by the worker completed successfully.')
          PY

      - name: Corroborate fresh RSS directly through Postgres
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/local-flash-corroborate.mjs "$TARGET_ISO3" | tee /tmp/federico-corroboration.json
          jq -e '.ok == true and .policy.threshold_weakening == false' /tmp/federico-corroboration.json >/dev/null
          jq -c . /tmp/federico-corroboration.json > /tmp/federico-corroboration-all.ndjson
          echo "PASS: direct-Postgres corroboration completed without Supabase Edge/Data API."

      - name: Check strict evidence readiness before publication
        id: readiness
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bun scripts/check-federico-publication.ts "$TARGET_ISO3" > /tmp/federico-evidence-readiness.json 2> /tmp/federico-evidence-readiness.err
          rc=$?
          set -e
          if [[ -s /tmp/federico-evidence-readiness.json ]]; then
            cat /tmp/federico-evidence-readiness.json
          fi
          if [[ "$rc" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "FEDERICO_EVIDENCE_READY=true" >> "$GITHUB_ENV"
            echo "PASS: strict publication evidence is ready."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "FEDERICO_EVIDENCE_READY=false" >> "$GITHUB_ENV"
            echo "Fail-closed: no qualifying fresh Federico evidence is currently available; no Risk Object will be published."
            sed -n '1,40p' /tmp/federico-evidence-readiness.err || true
          fi

      - name: Build fail-closed no-publication artifact
        if: ${{ steps.readiness.outputs.ready != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/federico-no-publication
          cp /tmp/federico-evidence-readiness.json /tmp/federico-no-publication/evidence-readiness.json || printf '{}\n' > /tmp/federico-no-publication/evidence-readiness.json
          cp /tmp/federico-corroboration-all.ndjson /tmp/federico-no-publication/corroboration.ndjson
          jq -n \
            --arg country_iso3 "$TARGET_ISO3" \
            --arg status "NO_PUBLICATION" \
            --arg reason "strict_evidence_gate_not_met" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg sha "${GITHUB_SHA}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{ok:true,country_iso3:$country_iso3,status:$status,reason:$reason,run_id:$run_id,source_sha:$sha,generated_at:$generated_at,publication_attempted:false}' \
            > /tmp/federico-no-publication/no-publication.json
          (
            cd /tmp/federico-no-publication
            sha256sum corroboration.ndjson evidence-readiness.json no-publication.json > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload fail-closed no-publication artifact
        if: ${{ steps.readiness.outputs.ready != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: federico-no-publication-${{ github.run_id }}
          path: /tmp/federico-no-publication/
          if-no-files-found: error
          retention-days: 14

      - name: Publish fresh production-signed strict country Risk Object
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/publish-country-risk-object.ts "$TARGET_ISO3" FEDERICO_STRICT | tee /tmp/publish.json
          jq -e --arg key_id "$RISK_OBJECT_SIGNING_KEY_ID" '
            .published == true and
            .schema_version == "gro-1.1" and
            .delivery_profile == "FEDERICO_STRICT" and
            (.decision_readiness.status == "READY" or .decision_readiness.status == "DEGRADED") and
            .commercial_eligibility.status == "VERIFIED" and
            .verification.status == "VERIFIED" and
            .integrity.signature_present == true and
            .integrity.signature_valid == true and
            .integrity.signing_key_id == $key_id
          ' /tmp/publish.json >/dev/null

      - name: Export exact persisted signed payload
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          OBJECT_ID="$(jq -r '.object_id' /tmp/publish.json)"
          export OBJECT_ID
          node <<'NODE'
          const fs = require('node:fs');
          const { createClient } = require('@supabase/supabase-js');
          (async () => {
            const db = createClient(process.env.APP_SUPABASE_URL, process.env.APP_SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
            const { data, error } = await db.from('geomacro_risk_objects').select('payload').eq('object_id', process.env.OBJECT_ID).maybeSingle();
            if (error) throw error;
            if (!data?.payload) throw new Error('Persisted Risk Object payload unavailable');
            fs.writeFileSync('/tmp/federico-risk-object.json', JSON.stringify(data.payload, null, 2) + '\n', { mode: 0o600 });
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify local freshness signature tamper and reproducibility
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          unset INVINO_API_KEY || true
          bun scripts/invinoveritas-risk-object-preflight.ts /tmp/federico-risk-object.json | tee /tmp/federico-preflight.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/federico-preflight.json')
          with path.open('r', encoding='utf-8') as handle:
              document = json.load(handle)
          if not isinstance(document, dict):
              raise SystemExit('Federico preflight output must be exactly one JSON object')
          print('PASS: local strict preflight output is exactly one valid JSON document')
          PY
          jq -e '
            .ok == true and
            .gates.deployed_original_verification == "PASS" and
            .gates.tampered_payload_rejected == "PASS" and
            .gates.freshness == "PASS" and
            .gates.partner_request_contract == "PASS" and
            .gates.trust_metadata == "PASS" and
            .gates.reproducibility == "PASS" and
            .gates.live_partner_review == "NOT_RUN" and
            .gates.partner_admission == "NOT_RUN" and
            .gates.partner_proof_verification == "NOT_RUN" and
            .live_review.attempted == false
          ' /tmp/federico-preflight.json >/dev/null

      - name: Run explicitly authorized Federico allowance review
        if: ${{ steps.readiness.outputs.ready == 'true' && inputs.use_partner_allowance == true }}
        env:
          INVINO_API_KEY: ${{ secrets.INVINO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INVINO_API_KEY:-}" || { echo "::error::INVINO_API_KEY is required only when use_partner_allowance=true"; exit 2; }
          bun scripts/invinoveritas-risk-object-preflight.ts /tmp/federico-risk-object.json | tee /tmp/federico-live-preflight.json
          jq -e '
            .ok == true and
            .gates.deployed_original_verification == "PASS" and
            .gates.tampered_payload_rejected == "PASS" and
            .gates.freshness == "PASS" and
            .gates.partner_request_contract == "PASS" and
            .gates.trust_metadata == "PASS" and
            .gates.reproducibility == "PASS" and
            .gates.partner_admission == "PASS" and
            .gates.partner_proof_verification == "PASS" and
            .gates.live_partner_review == "PASS" and
            .live_review.proof_present == true
          ' /tmp/federico-live-preflight.json >/dev/null

      - name: Build handoff artifact
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/federico-handoff
          cp /tmp/federico-risk-object.json /tmp/federico-handoff/federico-risk-object.json
          cp schemas/gro-1.1.schema.json /tmp/federico-handoff/gro-1.1.schema.json
          cp docs/GRO_CANONICAL_JSON_V1.md /tmp/federico-handoff/GRO_CANONICAL_JSON_V1.md
          cp docs/examples/gro-1.1-canonical-v1-test-vector.json /tmp/federico-handoff/gro-1.1-canonical-v1-test-vector.json
          cp docs/examples/gro-1.1-canonical-v1-edge-vectors.json /tmp/federico-handoff/gro-1.1-canonical-v1-edge-vectors.json
          if [ -s /tmp/federico-live-preflight.json ]; then
            cp /tmp/federico-review-request.json /tmp/federico-handoff/review-request.json
            cp /tmp/federico-review-response.json /tmp/federico-handoff/review-response.json
            jq '{ok,gates,object,live_review}' /tmp/federico-live-preflight.json > /tmp/federico-handoff/verification-summary.json
          else
            jq '{ok,gates,object,live_review}' /tmp/federico-preflight.json > /tmp/federico-handoff/verification-summary.json
            jq -n --arg country_iso3 "$TARGET_ISO3" '{
              attempted:false,
              country_iso3:$country_iso3,
              reason:"owner_did_not_authorize_partner_allowance",
              allowance_used:0,
              payment_performed:false,
              execution_authorized:false
            }' > /tmp/federico-handoff/review-not-run.json
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/federico-handoff/verification-summary.json', 'r', encoding='utf-8') as handle:
              document = json.load(handle)
          if document.get('ok') is not True:
              raise SystemExit('verification-summary.json must record ok=true')
          PY
          (
            cd /tmp/federico-handoff
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('/tmp/federico-handoff')
          package = root / 'Geomacro_Federico_Latest_Handoff.zip'
          files = sorted(
              path for path in root.iterdir()
              if path.is_file() and path.name != package.name
          )
          with ZipFile(package, 'w', ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, arcname=path.name)
          PY

      - name: Upload Federico handoff
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: federico-handoff-${{ github.run_id }}
          path: /tmp/federico-handoff/
          if-no-files-found: error
          retention-days: 8

      - name: Publish sanitized summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Federico continuous Testnet Risk Object refresh"
            echo
            echo "Refresh mode: continuous testnet acceptance"
            echo
            if [[ "${FEDERICO_EVIDENCE_READY:-false}" == "true" ]]; then
              echo "Outcome: VERIFIED publication path completed"
              if [[ -s /tmp/federico-live-preflight.json ]]; then
                jq '{object_id: .object.object_id, schema_version: .object.schema_version, expires_at: .object.expires_at, signing_key_id: .object.signing_key_id, gates, live_review}' /tmp/federico-live-preflight.json
              else
                jq '{object_id: .object.object_id, schema_version: .object.schema_version, expires_at: .object.expires_at, signing_key_id: .object.signing_key_id, gates, live_review}' /tmp/federico-preflight.json
                echo "Federico pilot allowance: NOT USED"
              fi
              echo "Artifact: federico-handoff-${{ github.run_id }}"
            else
              echo "Outcome: NO_PUBLICATION"
              echo "Reason: strict_evidence_gate_not_met"
              echo "Artifact: federico-no-publication-${{ github.run_id }}"
            fi
            echo "Run ID: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
