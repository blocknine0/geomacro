name: Federico Continuous Testnet Risk Object Refresh
# Continuous testnet acceptance and partner-refresh path. Publication remains fail-closed on all strict evidence gates.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Auto Ingest News"
      - "Testnet RSS Live Intelligence Runner"
      - "Deploy country flash intelligence to Supabase"
    types:
      - completed

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: federico-seven-day-risk-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      INVINO_API_KEY: ${{ secrets.INVINO_API_KEY }}
      INVINO_REQUEST_OUT: /tmp/federico-review-request.json
      INVINO_REVIEW_OUT: /tmp/federico-review-response.json
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      GITHUB_OIDC_AUDIENCE: https://geomacro.live/actions/live-flash-rss

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Acquire scoped GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::GitHub OIDC request URL missing"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "::error::GitHub OIDC request token missing"; exit 1; }
          oidc_response="$(curl --fail-with-body -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${GITHUB_OIDC_AUDIENCE}"
          )"
          token="$(printf "%s" "$oidc_response" | jq -er ".value")"
          test -n "$token"
          echo "::add-mask::$token"
          printf "GEOMACRO_FLASH_OIDC_TOKEN=%s\n" "$token" >> "$GITHUB_ENV"
          echo "PASS: scoped GitHub OIDC token acquired for Federico's governed corroboration path."
      - name: Reconcile authoritative production event-family schema
        shell: bash
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          expected_project="ldpwajisioljyjtojvfx"

          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }

          if [[ "$SUPABASE_PROJECT_ID" != "$expected_project" ]]; then
            echo "::error::Refusing Federico DB repair against a non-authoritative Supabase project."
            exit 1
          fi

          node <<'NODE'
          const ref = process.env.SUPABASE_PROJECT_ID;
          const raw = process.env.SUPABASE_DB_URL;

          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error('SUPABASE_DB_URL must be a valid percent-encoded postgres connection URL');
          }

          if (!['postgres:', 'postgresql:'].includes(url.protocol)) {
            throw new Error('SUPABASE_DB_URL must use postgres:// or postgresql://');
          }

          const directHost = `db.${ref}.supabase.co`;
          const username = decodeURIComponent(url.username);
          const directMatch =
            url.hostname === directHost &&
            username === 'postgres';
          const poolerMatch =
            url.hostname.endsWith('.pooler.supabase.com') &&
            username === `postgres.${ref}`;

          if (!directMatch && !poolerMatch) {
            throw new Error('SUPABASE_DB_URL does not resolve to the authoritative Geomacro production project');
          }

          if (!url.password || url.pathname !== '/postgres') {
            throw new Error('SUPABASE_DB_URL must contain the database password and target /postgres');
          }

          console.log('PASS: authoritative production DB identity confirmed without printing credentials.');
          NODE

          command -v psql >/dev/null 2>&1 || {
            echo "::error::psql is required on the GitHub runner for authoritative production schema repair."
            exit 1
          }

          export PGSSLMODE="require"

          required_schema="DO \$\$
          BEGIN
            IF to_regclass('public.live_flash_event_families') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_families is missing';
            END IF;
            IF to_regclass('public.live_flash_event_family_members') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_family_members is missing';
            END IF;
            IF to_regclass('public.live_flash_event_family_versions') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_family_versions is missing';
            END IF;
            IF to_regclass('public.live_flash_event_versions') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_versions is missing';
            END IF;
          END \$\$;"

          set +e
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -c "$required_schema" >/tmp/federico-schema-check.txt 2>&1
          schema_rc=$?
          set -e

          cat /tmp/federico-schema-check.txt

          if [[ "$schema_rc" -ne 0 ]]; then
            echo "Authoritative production event-family schema is incomplete. Applying the idempotent repair migration over the canonical production DB URL."
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/migrations/957_repair_federico_event_family_schema.sql

            # Force PostgREST to reload its schema cache after DDL.
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -c "NOTIFY pgrst, 'reload schema';"
          else
            echo "PASS: authoritative production event-family schema already present."
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -c "$required_schema"

          echo "PASS: authoritative production event-family schema is present before Federico publication."

      - name: Validate production signing configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY RISK_OBJECT_SIGNING_KEY_ID RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done

          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require('node:crypto');
          const fs = require('node:fs');

          const privateKey = createPrivateKey({
            key: Buffer.from(process.env.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64.trim(), 'base64'),
            format: 'der',
            type: 'pkcs8',
          });

          if (privateKey.asymmetricKeyType !== 'ed25519') {
            throw new Error('Risk Object signing key must be Ed25519');
          }

          const publicB64 = Buffer.from(
            createPublicKey(privateKey).export({ format: 'der', type: 'spki' }),
          ).toString('base64');

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            'RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64=' + publicB64 + '\n',
          );
          NODE

      - name: Verify signer matches deployed trust registry
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://geomacro.live/api/risk-object-keys > /tmp/geomacro-keys.json

          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/geomacro-keys.json', 'utf8'));

          if (body?.ok !== true || !Array.isArray(body?.keys)) {
            throw new Error('Deployed Geomacro trust registry unavailable');
          }

          const key = body.keys.find(
            (item) => item?.key_id === process.env.RISK_OBJECT_SIGNING_KEY_ID,
          );

          if (!key || key.status !== 'active') {
            throw new Error('Configured production signing key is not active in the deployed registry');
          }

          if (key.public_key_spki_b64 !== process.env.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64) {
            throw new Error('Configured production private key does not match deployed public key');
          }

          console.log('PASS: production signer matches deployed active trust key');
          NODE

      - name: Synchronize fresh independent GDELT evidence
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY LIVE_STRUCTURE_TOKEN GEOMACRO_FLASH_OIDC_TOKEN; do
            test -n "\${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done

          fresh_fragment=""
          max_attempts=30

          for attempt in $(seq 1 "$max_attempts"); do
            response_file="/tmp/federico-gdelt-\${attempt}.json"
            GDELT_GAL_SYNC_OUTPUT="$response_file" bun scripts/sync-gdelt-gal-production.mjs
            jq -e '.ok == true' "$response_file" >/dev/null

            status="$(jq -r '.status // ""' "$response_file")"
            fragment_id="$(jq -r '.fragment_id // ""' "$response_file")"
            latest_source_stamp="$(jq -r '.latest_source_stamp // .last_source_stamp // ""' "$response_file")"

            jq -c --argjson attempt "$attempt" '{attempt:$attempt,ok,status,source_stamp:(.latest_source_stamp // .last_source_stamp // null),source_files:(.source_files // .files_seen // 0),items_seen:(.items_seen // 0),items_accepted:(.items_accepted // 0),fragment_id:(.fragment_id // null)}' "$response_file"

            if [[ "$status" == "sealed" && -n "$fragment_id" ]]; then
              fresh_fragment="$fragment_id"
              break
            fi

            case "$status" in
              no_new_gdelt_file|all_duplicates_or_irrelevant)
                echo "GDELT has not produced a fresh accepted fragment yet (source_stamp=$latest_source_stamp)."
                ;;
              *)
                echo "::error title=Unexpected GDELT sync state::Unsupported sync status '$status'."
                exit 1
                ;;
            esac

            if [[ "$attempt" -lt "$max_attempts" ]]; then
              sleep 30
            fi
          done

          test -n "$fresh_fragment" || {
            echo "::error title=Fresh GDELT fragment unavailable::No newly sealed accepted GDELT fragment arrived within the bounded synchronization window."
            exit 1
          }

          printf "FRESH_GDELT_FRAGMENT_ID=%s\n" "$fresh_fragment" >> "$GITHUB_ENV"
          echo "PASS: fresh accepted GDELT fragment sealed: $fresh_fragment"

      - name: Structure the exact fresh GDELT fragment
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${APP_SUPABASE_URL:-}" || { echo "::error::APP_SUPABASE_URL is missing"; exit 1; }
          test -n "\${LIVE_STRUCTURE_TOKEN:-}" || { echo "::error::LIVE_STRUCTURE_TOKEN is missing"; exit 1; }
          test -n "\${FRESH_GDELT_FRAGMENT_ID:-}" || { echo "::error::FRESH_GDELT_FRAGMENT_ID is missing"; exit 1; }

          structured=false

          for attempt in 1 2 3 4 5 6; do
            response_file="/tmp/federico-structure-\${attempt}.json"
            curl --fail-with-body -sS \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --retry-max-time 90 \
              -X POST \
              "\${APP_SUPABASE_URL%/}/functions/v1/live-structure-intelligence" \
              -H "x-geomacro-structure-token: \${LIVE_STRUCTURE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\\"fragment_id\\":\\"\${FRESH_GDELT_FRAGMENT_ID}\\"}" \
              -o "$response_file"

            jq -e --arg fragment "$FRESH_GDELT_FRAGMENT_ID" '.ok == true and .fragment_id == $fragment' "$response_file" >/dev/null
            jq -c '{ok,status,fragment_id,evidence_structured:(.evidence_structured // 0),evidence_excluded:(.evidence_excluded // 0),remaining:(.remaining // 0),events_created:(.events_created // 0),events_updated:(.events_updated // 0)}' "$response_file"

            remaining="$(jq -r '.remaining // 0' "$response_file")"
            if [[ "$remaining" == "0" ]]; then
              structured=true
              break
            fi
          done

          [[ "$structured" == "true" ]] || {
            echo "::error title=Fresh GDELT structure incomplete::The exact fresh fragment did not fully reach structured state."
            exit 1
          }

          echo "PASS: exact fresh GDELT fragment was structurally processed against authoritative production."

      - name: Re-poll governed RSS after fresh GDELT structure
        env:
          SUPABASE_PROJECT_ID: \${{ secrets.SUPABASE_PROJECT_ID }}
          GEOMACRO_FLASH_INGEST_URL: https://\${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/live-flash-ingest
          GEOMACRO_FLASH_INGEST_TOKEN: \${{ secrets.FLASH_INGEST_TOKEN }}
          TELEGRAM_ENABLED: "false"
          BREAKING_RSS_ENABLED: "true"
          BREAKING_RSS_RUN_ONCE: "true"
          BREAKING_RSS_BOOTSTRAP_MAX_ITEMS: "10"
          BREAKING_FEED_USER_AGENT: "Geomacro/1.0 (+https://geomacro.live; contact=contact@geomacro.live)"
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID missing"; exit 1; }
          test -n "\${GEOMACRO_FLASH_OIDC_TOKEN:-}" || { echo "::error::GEOMACRO_FLASH_OIDC_TOKEN missing"; exit 1; }
          python -m pip install --disable-pip-version-check -r workers/telegram-flash/requirements.txt >/tmp/federico-rss-deps.log
          cd workers/telegram-flash
          python worker.py 2>&1 | tee /tmp/federico-rss-live.log

          for source_id in aljazeera_rss bbc_world_rss xinhua_english_china_rss scmp_china_rss federal_reserve_press_rss forexlive_rss usgs_minerals_news_rss; do
          grep -q "\"source_id\": \"${source_id}" /tmp/federico-rss-live.log || {
              echo "::error::RSS source \${source_id} did not complete a post-structure poll."
              exit 1
            }
          done

          grep -q "\"source_id\": \"${source_id}" /tmp/federico-rss-live.log || {
          grep -Eq '"source_id": "xinhua_english_china_rss".*"iso3": "CHN"' /tmp/federico-rss-live.log || {
            echo "::error title=Xinhua CHN attribution missing::Fresh Xinhua evidence did not produce the required CHN attribution."
            exit 1
          }

          echo "PASS: governed RSS sources were re-polled after the exact fresh GDELT structure, including Xinhua CHN attribution."

      - name: Corroborate fresh RSS and structured evidence
        shell: bash
        run: |
          set -euo pipefail
          base="\${APP_SUPABASE_URL%/}/functions/v1"
          response="\$(curl --silent --show-error \
            --output /tmp/federico-corroborate.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-geomacro-github-oidc-token: \${GEOMACRO_FLASH_OIDC_TOKEN}" \
            --header "Authorization: Bearer \${GEOMACRO_FLASH_OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "\${base}/live-flash-corroborate")"
          cat /tmp/federico-corroborate.json
          echo
          test "\$response" = "200" || { echo "::error::live-flash-corroborate did not return HTTP 200."; exit 1; }
          jq -e '.ok == true' /tmp/federico-corroborate.json >/dev/null
          echo "PASS: fresh RSS and structured evidence corroboration completed."

      - name: Publish fresh production-signed CHN Risk Object
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/publish-country-risk-object.ts CHN FEDERICO_STRICT | tee /tmp/publish.json

          jq -e --arg key_id "$RISK_OBJECT_SIGNING_KEY_ID" '
            .published == true and
            .schema_version == "gro-1.1" and
            .delivery_profile == "FEDERICO_STRICT" and
            .decision_readiness.status == "READY" and
            .commercial_eligibility.status == "VERIFIED" and
            .verification.status == "VERIFIED" and
            .integrity.signature_present == true and
            .integrity.signature_valid == true and
            .integrity.signing_key_id == $key_id
          ' /tmp/publish.json >/dev/null

      - name: Export exact persisted signed payload
        shell: bash
        run: |
          set -euo pipefail
          OBJECT_ID="$(jq -r '.object_id' /tmp/publish.json)"
          export OBJECT_ID

          node <<'NODE'
          const fs = require('node:fs');
          const { createClient } = require('@supabase/supabase-js');

          (async () => {
            const db = createClient(
              process.env.APP_SUPABASE_URL,
              process.env.APP_SUPABASE_SERVICE_ROLE_KEY,
              { auth: { persistSession: false, autoRefreshToken: false } },
            );

            const { data, error } = await db
              .from('geomacro_risk_objects')
              .select('payload')
              .eq('object_id', process.env.OBJECT_ID)
              .maybeSingle();

            if (error) throw error;
            if (!data?.payload) throw new Error('Persisted Risk Object payload unavailable');

            fs.writeFileSync(
              '/tmp/federico-risk-object.json',
              JSON.stringify(data.payload, null, 2) + '\n',
              { mode: 0o600 },
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify freshness, signature and tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/invinoveritas-risk-object-preflight.ts /tmp/federico-risk-object.json             | tee /tmp/federico-preflight.json

          jq -e '
            .ok == true and
            .gates.deployed_original_verification == "PASS" and
            .gates.tampered_payload_rejected == "PASS" and
            .gates.freshness == "PASS" and
            .gates.partner_request_contract == "PASS" and
            .gates.trust_metadata == "PASS" and
            .gates.reproducibility == "PASS" and
            .gates.partner_admission == "PASS" and
            .gates.partner_proof_verification == "PASS" and
            .gates.live_partner_review == "PASS" and
            .live_review.proof_present == true
          ' /tmp/federico-preflight.json >/dev/null

      - name: Build handoff artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/federico-handoff
          cp /tmp/federico-risk-object.json /tmp/federico-handoff/federico-risk-object.json
          cp schemas/gro-1.1.schema.json /tmp/federico-handoff/gro-1.1.schema.json
          cp docs/GRO_CANONICAL_JSON_V1.md /tmp/federico-handoff/GRO_CANONICAL_JSON_V1.md
          cp docs/examples/gro-1.1-canonical-v1-test-vector.json /tmp/federico-handoff/gro-1.1-canonical-v1-test-vector.json
          cp /tmp/federico-review-request.json /tmp/federico-handoff/review-request.json
          cp /tmp/federico-review-response.json /tmp/federico-handoff/review-response.json

          (
            cd /tmp/federico-handoff
            sha256sum GRO_CANONICAL_JSON_V1.md gro-1.1-canonical-v1-test-vector.json gro-1.1.schema.json federico-risk-object.json review-request.json review-response.json > SHA256SUMS.txt
          )

          jq '{
            ok,
            gates,
            object,
            live_review
          }' /tmp/federico-preflight.json > /tmp/federico-handoff/verification-summary.json

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path("/tmp/federico-handoff")
          package = root / "Geomacro_Federico_Latest_Handoff.zip"
          files = [
              "GRO_CANONICAL_JSON_V1.md",
              "gro-1.1-canonical-v1-test-vector.json",
              "gro-1.1.schema.json",
              "federico-risk-object.json",
              "review-request.json",
              "review-response.json",
              "SHA256SUMS.txt",
              "verification-summary.json",
          ]

          with ZipFile(package, "w", ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(root / name, arcname=name)
          PY

          (
            cd /tmp/federico-handoff
            sha256sum Geomacro_Federico_Latest_Handoff.zip > PACKAGE_SHA256.txt
          )

          python3 - <<'PY'
          from zipfile import ZipFile
          package = "/tmp/federico-handoff/Geomacro_Federico_Latest_Handoff.zip"
          with ZipFile(package) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"ZIP integrity failure: {bad}")
              expected = {
                  "GRO_CANONICAL_JSON_V1.md",
                  "gro-1.1-canonical-v1-test-vector.json",
                  "gro-1.1.schema.json",
                  "federico-risk-object.json",
                  "review-request.json",
                  "review-response.json",
                  "SHA256SUMS.txt",
                  "verification-summary.json",
              }
              actual = set(archive.namelist())
              if actual != expected:
                  raise SystemExit(f"Unexpected ZIP contents: {sorted(actual)}")
          print("PASS: fixed Federico handoff ZIP is valid")
          PY

      - name: Upload historical Federico handoff
        uses: actions/upload-artifact@v4
        with:
          name: federico-handoff-${{ github.run_id }}
          path: /tmp/federico-handoff/
          if-no-files-found: error
          retention-days: 8

      - name: Upload fixed latest Federico handoff
        uses: actions/upload-artifact@v4
        with:
          name: federico-latest-handoff
          path: /tmp/federico-handoff/
          if-no-files-found: error
          retention-days: 8

      - name: Remove superseded fixed-name handoff artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARTIFACTS_JSON="$(mktemp)"
          curl -L --silent --show-error --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=federico-latest-handoff&per_page=100"             > "$ARTIFACTS_JSON"

          CURRENT_ARTIFACT_ID="$(
            jq -r --argjson run_id "$GITHUB_RUN_ID" '
              .artifacts[]
              | select(.workflow_run.id == $run_id)
              | .id
            ' "$ARTIFACTS_JSON" | head -n 1
          )"

          test -n "$CURRENT_ARTIFACT_ID" || {
            echo "::error::Current federico-latest-handoff artifact was not found after upload."
            exit 1
          }

          jq -r --argjson current_id "$CURRENT_ARTIFACT_ID" '
            .artifacts[]
            | select(.id != $current_id)
            | .id
          ' "$ARTIFACTS_JSON" | while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            curl -L --silent --show-error --fail               -X DELETE               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done

          echo "PASS: federico-latest-handoff now points to this refresh run only."

      - name: Publish sanitized summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Federico continuous Testnet Risk Object refresh"
            echo
            echo "Refresh mode: continuous testnet acceptance"
            echo
            jq '{
              object_id: .object.object_id,
              schema_version: .object.schema_version,
              expires_at: .object.expires_at,
              signing_key_id: .object.signing_key_id,
              gates
            }' /tmp/federico-preflight.json
            echo
            echo "Artifact: federico-latest-handoff"
            echo "Historical artifact: federico-handoff-${{ github.run_id }}"
            echo "Package: Geomacro_Federico_Latest_Handoff.zip"
            echo "Run ID: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
