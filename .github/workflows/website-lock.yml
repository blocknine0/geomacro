name: Website Lock

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-published-website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify published website lock
        run: node scripts/ops/verify-website-lock.mjs

      - name: Prove website lock fails closed
        shell: bash
        run: |
          set -euo pipefail
          printf '\n/* website-lock-negative-self-test */\n' >> src/styles.css

          if node scripts/ops/verify-website-lock.mjs; then
            echo "::error::Website lock self-test failed: a protected presentation edit was not blocked."
            exit 1
          fi

          git checkout -- src/styles.css
          node scripts/ops/verify-website-lock.mjs
