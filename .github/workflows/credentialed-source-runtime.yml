name: Credentialed source runtime certification

on:
  pull_request:
    paths:
      - "global-intelligence/adapters/credentialed-sources.mjs"
      - "global-intelligence/adapters/http.mjs"
      - "scripts/tests/credentialed-source-bounded-runtime.test.mjs"
      - "global-intelligence/scripts/probe-credentialed-sources.mjs"
      - "src/lib/signed-publication-recovery-preflight.server.ts"
      - "scripts/ops/signed-publication-recovery-preflight.ts"
      - "src/__tests__/signed-publication-recovery-preflight.test.ts"
      - "global-intelligence/package.json"
      - "global-intelligence/sources/source-registry.v1.json"
      - ".github/workflows/credentialed-source-runtime.yml"
      - "scripts/tests/existing-source-runtime-activation.test.mjs"
      - "src/__tests__/credentialed-source-isolation.test.ts"
  push:
    branches:
      - main
    paths:
      - "global-intelligence/adapters/credentialed-sources.mjs"
      - "global-intelligence/adapters/http.mjs"
      - "scripts/tests/credentialed-source-bounded-runtime.test.mjs"
      - "global-intelligence/scripts/probe-credentialed-sources.mjs"
      - "src/lib/signed-publication-recovery-preflight.server.ts"
      - "scripts/ops/signed-publication-recovery-preflight.ts"
      - "src/__tests__/signed-publication-recovery-preflight.test.ts"
      - "global-intelligence/package.json"
      - "global-intelligence/sources/source-registry.v1.json"
      - ".github/workflows/credentialed-source-runtime.yml"
      - "scripts/tests/existing-source-runtime-activation.test.mjs"
  workflow_dispatch:
  schedule:
    # Four bounded observations/day; protect limited free API-key quotas.
    - cron: "41 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-credentialed-source-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate credentialed source probe
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/existing-source-runtime-activation.test.mjs scripts/tests/credentialed-source-bounded-runtime.test.mjs
          node --check global-intelligence/adapters/credentialed-sources.mjs
          node --check global-intelligence/scripts/probe-credentialed-sources.mjs
          grep -q "CREDENTIAL_NOT_CONFIGURED" global-intelligence/scripts/probe-credentialed-sources.mjs
          grep -q "CONFIGURED_BUT_PROBE_FAILED" global-intelligence/scripts/probe-credentialed-sources.mjs
          node -e 'JSON.parse(require("fs").readFileSync("global-intelligence/sources/source-registry.v1.json","utf8")); JSON.parse(require("fs").readFileSync("global-intelligence/package.json","utf8"));'
          grep -q 'BLS_API_KEY' global-intelligence/adapters/credentialed-sources.mjs
          grep -q 'BEA_API_KEY' global-intelligence/adapters/credentialed-sources.mjs
          grep -q 'ALPHA_VANTAGE_API_KEY' global-intelligence/adapters/credentialed-sources.mjs
          grep -q 'EIA_API_KEY' global-intelligence/adapters/credentialed-sources.mjs
          grep -q 'NOAA_NCEI_TOKEN' global-intelligence/adapters/credentialed-sources.mjs
          grep -q 'WTO_API_KEY' global-intelligence/adapters/credentialed-sources.mjs
          grep -q 'UCDP_API_TOKEN' global-intelligence/adapters/credentialed-sources.mjs
          grep -q 'OPENSANCTIONS_API_KEY' global-intelligence/adapters/credentialed-sources.mjs
          echo "PASS: credentialed source runtime contract is syntactically valid."

  runtime:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      NOAA_NCEI_TOKEN: ${{ secrets.NOAA_NCEI_TOKEN }}
      WTO_API_KEY: ${{ secrets.WTO_API_KEY }}
      UCDP_API_TOKEN: ${{ secrets.UCDP_API_TOKEN }}
      OPENSANCTIONS_API_KEY: ${{ secrets.OPENSANCTIONS_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Safely identify which source credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          for name in BLS_API_KEY BEA_API_KEY ALPHA_VANTAGE_API_KEY EIA_API_KEY NOAA_NCEI_TOKEN WTO_API_KEY OPENSANCTIONS_API_KEY UCDP_API_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              configured=$((configured + 1))
            else
              echo "::warning title=Individual source needs credential::${name} not configured; other configured sources will still be probed."
            fi
          done
          echo "Configured source accounts: $configured/8 (no key values logged)."
      - name: Probe all configured sources independently, preserve failed receipts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/credentialed-source-health
          rc=0
          node global-intelligence/scripts/probe-credentialed-sources.mjs > artifacts/credentialed-source-health/receipt.json || rc=$?
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const p=JSON.parse(readFileSync("artifacts/credentialed-source-health/receipt.json","utf8"));
            if(p.schema!=="geomacro.credentialed-source-isolated-readiness.v1" ||
               p.source_count!==8 || p.results.length!==8 ||
               p.supabase_writes!==0 || p.b2_requests!==0 ||
               p.commercial_eligible!==false) process.exit(2);
            console.log(JSON.stringify({status:p.status,configured:p.configured,
              working:p.working,missing_credentials:p.missing_credentials,
              configured_failed:p.configured_failed,per_domain:p.per_domain,results:p.results}));
          ' || exit 2
          exit "$rc"
      - name: Upload source-by-source sanitized health receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: credentialed-source-health-${{ github.run_id }}
          path: artifacts/credentialed-source-health/receipt.json
          if-no-files-found: warn
          retention-days: 7

  publication-preflight:
    # Configuration-only: secret values for B2/private signing never enter this job.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun for approved machine authority verifier
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Identify publication configuration blockers without exposing keys or promoting data
        env:
          RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
          GEOMACRO_PUBLICATION_PROFILE: GEOMACRO_AUTOMATED_CROSS_SOURCE_NOT_EXTERNAL_REVIEWED_V1
          GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_PEM }}
          GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256 }}
          GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_PEM }}
          GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256: ${{ secrets.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256 }}
          GRO_SIGNER_PRIVATE_CONFIGURED: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 != '' }}
          B2_WRITER_CONFIGURED: ${{ secrets.B2_KEY_ID != '' && secrets.B2_APPLICATION_KEY != '' }}
          B2_ARCHIVE_READER_CONFIGURED: ${{ secrets.B2_ARCHIVE_READ_KEY_ID != '' && secrets.B2_ARCHIVE_READ_APPLICATION_KEY != '' }}
          D1_CONTROL_PLANE_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
          PUBLICATION_AUTH_CONFIGURED: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN != '' }}
        run: bun scripts/ops/signed-publication-recovery-preflight.ts

      - name: Preserve sanitized publication blockers independently of source health
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-publication-recovery-preflight-${{ github.run_id }}
          path: artifacts/public-serving/recovery-preflight.json
          if-no-files-found: warn
          retention-days: 7
