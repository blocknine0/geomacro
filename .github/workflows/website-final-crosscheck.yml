name: Public Website and Locked Pricing Crosscheck
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  public-contract:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify public documents, navigation, UI/API price parity and exact live revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/ops/verify-live-website-contract.mjs
