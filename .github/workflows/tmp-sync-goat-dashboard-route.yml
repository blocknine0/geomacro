name: Temporary sync GOAT dashboard route

on:
  push:
    branches:
      - feat/goat-live-status-dashboard

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/goat-live-status-dashboard
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Harden dashboard pass semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/goat-test-dashboard.tsx')
          s = p.read_text()
          old = 'const acceptanceArtifact = run.artifacts.find((artifact) => artifact.name.startsWith("goat-acceptance-window-"));'
          new = 'const acceptanceArtifact = run.conclusion === "success" ? run.artifacts.find((artifact) => artifact.name.startsWith("goat-acceptance-window-")) : undefined;'
          if old not in s:
              raise SystemExit('acceptanceArtifact source pattern not found')
          s = s.replace(old, new, 1)
          old2 = 'return run.artifacts.some((artifact) => artifact.name.startsWith("goat-acceptance-window-"));'
          new2 = 'return run.conclusion === "success" && run.artifacts.some((artifact) => artifact.name.startsWith("goat-acceptance-window-"));'
          if old2 not in s:
              raise SystemExit('hasAcceptanceArtifact source pattern not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Generate route tree through production build
        run: bun run build >/dev/null
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/goat-test-dashboard.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix(goat): sync live dashboard route evidence semantics'
          git push origin HEAD:feat/goat-live-status-dashboard
