name: Private OSINT Encrypted Holding When D1 Quota Held

# Separate Free GitHub Actions artifact capacity is used for short-lived
# AES-GCM ciphertext. Never publish clear source observations or treat this
# archive as D1 delivery. Only protected main and protected production secrets.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-osint-d1-quota-held-spool.yml"
      - "scripts/ops/private-osint-stage-held.ts"
      - "scripts/ops/private-osint-replay-held.mjs"
      - "scripts/lib/private-osint-encrypted-spool.mjs"
      - "scripts/lib/private-osint-r2-encrypted-escrow.mjs"
      - "scripts/lib/private-osint-r2-encrypted-escrow.test.mjs"
      - "scripts/ops/private-osint-mirror-held-to-r2.mjs"
      - "scripts/ops/private-osint-reuse-fresh-stage.mjs"
      - "scripts/tests/private-osint-reuse-fresh-stage.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/private-osint-d1-quota-held-spool.yml"
      - "scripts/ops/private-osint-stage-held.ts"
      - "scripts/ops/private-osint-replay-held.mjs"
      - "scripts/lib/private-osint-encrypted-spool.mjs"
      - "scripts/lib/private-osint-r2-encrypted-escrow.mjs"
      - "scripts/lib/private-osint-r2-encrypted-escrow.test.mjs"
      - "scripts/ops/private-osint-mirror-held-to-r2.mjs"
      - "scripts/ops/private-osint-reuse-fresh-stage.mjs"
      - "scripts/tests/private-osint-reuse-fresh-stage.test.mjs"
      - "scripts/lib/private-osint-encrypted-spool.test.mjs"
      - "scripts/lib/private-osint-shared-read-contract.mjs"
      - "scripts/lib/private-osint-shared-read-contract.test.mjs"
      - "scripts/lib/cloudflare-workers-paid-plan-proof.mjs"
      - "scripts/tests/cloudflare-workers-paid-plan-proof.test.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-private-osint-quota-held-ciphertext
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Ciphertext privacy and tamper regression
        run: |
          set -euo pipefail
          node --check scripts/lib/private-osint-encrypted-spool.mjs
          node --check scripts/ops/private-osint-replay-held.mjs
          node --test scripts/lib/private-osint-encrypted-spool.test.mjs
          node --test scripts/lib/private-osint-shared-read-contract.test.mjs
          node --check scripts/ops/private-osint-mirror-held-to-r2.mjs
          node --test scripts/lib/private-osint-r2-encrypted-escrow.test.mjs
          node --check scripts/ops/private-osint-reuse-fresh-stage.mjs
          node --test scripts/tests/private-osint-reuse-fresh-stage.test.mjs
          node --test scripts/tests/cloudflare-workers-paid-plan-proof.test.mjs

  quota-admission:
    needs: verify
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    outputs:
      state: ${{ steps.quota.outputs.state }}
      critical: ${{ steps.quota.outputs.critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Provider-wide no-D1-query quota observation
        id: quota
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs

  encrypted-holding:
    concurrency:
      group: geomacro-private-osint-held-publisher-fetch
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    needs: [verify, quota-admission]
    if: >-
      needs.quota-admission.outputs.state == 'HELD' &&
      needs.quota-admission.outputs.critical != 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Reuse a successful fifteen-minute same-source encrypted read when current
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
        run: node scripts/ops/private-osint-reuse-fresh-stage.mjs
      - name: Read actual native-dated RSS and AES-GCM seal only safe projections
        if: steps.reuse.outputs.collect == 'true'
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
        run: |
          set -euo pipefail
          bun scripts/ops/private-osint-stage-held.ts
      - name: Optional dedicated R2 private AES-GCM escrow with independent byte readback
        if: ${{ vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET != '' && steps.reuse.outputs.collect == 'true' }}
        id: r2_mirror
        continue-on-error: true
        env:
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEOMACRO_PRIVATE_OSINT_R2_BUCKET: ${{ vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET }}
          GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID }}
          GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ops/private-osint-mirror-held-to-r2.mjs
      - name: Warn when optional R2 evidence mirror failed
        if: ${{ steps.r2_mirror.outcome == 'failure' }}
        run: echo "::warning::PRIVATE_OSINT_R2_ESCROW_FAILED_GITHUB_CIPHERTEXT_RETAINED"
      - name: Save ONLY encrypted private-OSINT temporary artifact
        if: steps.reuse.outputs.collect == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-encrypted-private-osint-held
          path: /tmp/geomacro-encrypted-held-spool/sealed.json
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0
