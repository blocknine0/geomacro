name: Day 6 Authorized Federico Pilot Once

# One-time owner-authorized bridge because the connector cannot issue workflow_dispatch.
# Retriggered only after #1536 permanently removed Supabase Edge from governed RSS.\n# Retriggered after #1543 fixed local canonical ingest npm:jose compatibility.
# Final bounded retrigger after #1548 fixed direct-Postgres optional-column semantics exposed by run 37435599083.
# Final bounded retrigger after #1557 added allowlisted direct-Postgres inner-relationship parity; #1554 pins child assurance to its exact dispatched SHA.
# Final bounded retrigger after direct-Postgres `.contains()` parity fixes country-specific corroboration.
# Final bounded retrigger after #1571 made archived GRO recovery B2-native and split B2 read/write credentials.
# Final bounded retrigger after permanent same-host SCMP /plus article timestamp canonicalization.\n# Partner bootstrap is intentionally limited to the exact five source families used by strict candidate selection.
# Final bounded retrigger after #1767 proved production verified-hot country GRO publication:
# 112 current VERIFIED GROs are D1-hot, B2 GET is no longer a synchronous serving gate,
# and B2 download-cap exhaustion only defers the cold-archive audit.
# This retrigger must still pass the no-B2/no-Supabase signed-GRO canary before any Federico allowance use.
# Final bounded retrigger after the D1 hot reader was made independent of risk-object
# verification-key secrets by validating against the deployed public trust registry.
# The no-B2/no-Supabase canary still runs before any Federico allowance step.
# This file is deleted after the resulting partner proof is verified.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/day6-authorized-federico-pilot-once.yml"
      - "scripts/ops/verify-country-gro-hot-serving.ts"
      - "src/lib/d1-country-gro-hot.server.ts"
      - "src/lib/public-demo-risk-profile.ts"
      - "supabase/functions/live-flash-corroborate/**"
      - "workers/telegram-flash/worker.py"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: day6-authorized-federico-pilot-once
  cancel-in-progress: true

jobs:
  authorize-and-run:
    if: github.repository == 'blocknine0/geomacro' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GRI_DB_MODE: direct_postgres
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      GRO_CONTINUITY_COUNTRY_ISO3: USA
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ARCHIVE_WRITE_KEY_ID: ${{ secrets.B2_ARCHIVE_WRITE_KEY_ID }}
      B2_ARCHIVE_WRITE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_WRITE_APPLICATION_KEY }}

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate one-time prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL B2_KEY_ID B2_APPLICATION_KEY; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 2; }
          done
          if [[ -n "${B2_ARCHIVE_READ_KEY_ID:-}" || -n "${B2_ARCHIVE_READ_APPLICATION_KEY:-}" ]]; then
            test -n "${B2_ARCHIVE_READ_KEY_ID:-}" && test -n "${B2_ARCHIVE_READ_APPLICATION_KEY:-}" || {
              echo "::error::Dedicated B2 archive read credentials must be supplied as a complete pair."
              exit 2
            }
          fi
          if [[ -n "${B2_ARCHIVE_WRITE_KEY_ID:-}" || -n "${B2_ARCHIVE_WRITE_APPLICATION_KEY:-}" ]]; then
            test -n "${B2_ARCHIVE_WRITE_KEY_ID:-}" && test -n "${B2_ARCHIVE_WRITE_APPLICATION_KEY:-}" || {
              echo "::error::Archive B2 read/write credentials must be supplied as a complete pair."
              exit 2
            }
          fi
          echo "B2 archive read path: dedicated read pair, else archive read/write pair, else existing B2 pair."
          test "${GRI_DB_MODE:-}" = "direct_postgres"
          echo "Owner authorization scope: Federico pilot allowance only; no user funds and no execution authorization."
          echo "Governed RSS transport: tokenless loopback spool -> canonical direct Postgres; remote tokenless ingest remains forbidden."

      - name: Prove verified D1 signed GRO hot serving before Federico work
        shell: bash
        run: |
          set -euo pipefail
          HOT_READY=false
          : > /tmp/day6-d1-gro-hot-preflight.err
          for attempt in $(seq 1 12); do
            set +e
            bun scripts/ops/verify-country-gro-hot-serving.ts \
              > /tmp/day6-d1-gro-hot-preflight.json \
              2> /tmp/day6-d1-gro-hot-preflight.err
            rc=$?
            set -e

            if [[ "$rc" -eq 0 ]] && jq -e '
              .ok == true and
              .schema == "geomacro.country-gro-d1-hot-canary.v1" and
              .serving_store == "cloudflare-d1" and
              .archive_store == "backblaze-b2" and
              .b2_credentials_present == false and
              .b2_network_read_required == false and
              .supabase_credentials_present == false and
              .signature_valid == true and
              .commercial_eligibility_verified == true and
              .external_payment_performed == false and
              .execution_authorized == false
            ' /tmp/day6-d1-gro-hot-preflight.json >/dev/null; then
              HOT_READY=true
              echo "PASS: verified signed country GRO hot serving works with B2/Supabase credentials removed (attempt ${attempt}/12)."
              break
            fi

            if [[ "$attempt" -lt 12 ]]; then
              echo "D1 verified-hot country GRO is not ready yet; waiting for the independent main-push deploy/publish lane (attempt ${attempt}/12)."
              sleep 10
            fi
          done

          if [[ "$HOT_READY" != "true" ]]; then
            echo "::error title=Verified D1 country GRO hot set unavailable::The independent deploy/publish lane did not make a verified signed country GRO available within the bounded readiness window. No Federico allowance was used."
            tail -n 20 /tmp/day6-d1-gro-hot-preflight.err || true
            exit 1
          fi

      - name: Re-poll governed RSS without partner allowance
        env:
          TELEGRAM_ENABLED: "false"
          BREAKING_RSS_ENABLED: "true"
          BREAKING_RSS_RUN_ONCE: "true"
          BREAKING_RSS_BOOTSTRAP_MAX_ITEMS: "10"
          BREAKING_RSS_SOURCE_IDS: "un_all_documents_rss,un_human_rights_council_rss,un_geneva_press_rss,un_security_council_docs_rss,un_geneva_meeting_summaries_rss,eu_council_press_rss,ecb_press_rss,ecb_market_information_rss,aljazeera_rss,bbc_world_rss,xinhua_english_china_rss,scmp_china_rss,federal_reserve_press_rss,forexlive_rss,bis_rss_media_releases,bis_rss_central_banker_speeches,nrcan_news_atom,usgs_minerals_news_rss"
          BREAKING_FEED_USER_AGENT: "Geomacro/1.0 (+https://geomacro.live; contact=contact@geomacro.live)"
          RSS_LIVE_CYCLE_SUMMARY_OUT: /tmp/day6-rss-cycle.json
          RSS_LIVE_SKIP_CORROBORATION: "true"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -r workers/telegram-flash/requirements.txt >/tmp/day6-rss-deps.log
          node scripts/run-rss-live-cycle.mjs | tee /tmp/day6-rss-live.log
          jq -e '
            .ok == true and
            .transport == "canonical_direct_postgres" and
            .edge_function_dependency == false and
            .source_summary.configured_source_count == .source_summary.completed_source_count and
            .corroboration.ok == true and
            .corroboration.skipped == true and
            .corroboration.reason == "explicit_partner_bootstrap_country_corroboration_follows" and
            .corroboration.threshold_weakening == false and
            .payment_performed == false and
            .execution_authorized == false
          ' /tmp/day6-rss-cycle.json >/dev/null
          echo "PASS: governed RSS refresh completed through canonical direct-Postgres transport; global corroboration was explicitly skipped because country-specific strict corroboration follows; no partner allowance used."

      - name: Hydrate trusted publisher times before strict candidate selection
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/hydrate-federico-source-times.ts | tee /tmp/day6-source-time-hydration.json
          jq -e '
            .ok == true and
            .execution_mode == "direct_postgres" and
            .policy == "trusted_publisher_metadata_only" and
            .threshold_weakening == false and
            .fake_freshness == false and
            .payment_performed == false and
            .execution_authorized == false
          ' /tmp/day6-source-time-hydration.json >/dev/null

      - name: Select strongest fresh strict candidate set
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/day6-candidates.txt
          with source_map(source_id, source_family) as (
            values
              ('un_all_documents_rss','united_nations'),
              ('un_human_rights_council_rss','united_nations'),
              ('un_geneva_press_rss','united_nations'),
              ('un_security_council_docs_rss','united_nations'),
              ('un_geneva_meeting_summaries_rss','united_nations'),
              ('eu_council_press_rss','council_of_the_european_union'),
              ('ecb_press_rss','european_central_bank'),
              ('ecb_market_information_rss','european_central_bank'),
              ('aljazeera_rss','aljazeera'),
              ('bbc_world_rss','bbc_world'),
              ('xinhua_english_china_rss','xinhua_english_china'),
              ('scmp_china_rss','scmp_china'),
              ('federal_reserve_press_rss','federal_reserve'),
              ('forexlive_rss','forexlive'),
              ('bis_rss_media_releases','bank_for_international_settlements'),
              ('bis_rss_central_banker_speeches','bank_for_international_settlements'),
              ('nrcan_news_atom','natural_resources_canada'),
              ('usgs_minerals_news_rss','usgs')
          ),
          recent as (
            select
              c.country_iso3,
              e.source_id,
              m.source_family,
              e.published_at as evidence_at
            from public.live_flash_events e
            join public.live_flash_event_countries c on c.flash_id=e.flash_id
            join source_map m on m.source_id=e.source_id
            where e.published_at is not null
              and e.published_at >= now() - interval '6 hours'
              and e.published_at <= now()
              and c.country_iso3 ~ '^[A-Z]{3}$'
          )
          select country_iso3
          from recent
          group by country_iso3
          having count(distinct source_family) >= 2
          order by count(distinct source_family) desc, count(*) desc, max(evidence_at) desc, country_iso3
          limit 8;
          SQL
          test -s /tmp/day6-candidates.txt || {
            echo "::error::No country currently has at least two fresh auditable partner source families after governed RSS refresh. Federico allowance was not used."
            exit 3
          }
          printf 'Candidate countries: '; tr '\n' ' ' < /tmp/day6-candidates.txt; echo

      - name: Corroborate candidates and select first genuinely strict-ready country
        id: strict
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/day6-corroboration-all.ndjson
          SELECTED=""
          while IFS= read -r ISO3; do
            test -n "$ISO3" || continue
            offset=0
            window_as_of="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            while true; do
              bun scripts/run-live-flash-corroborate-local.ts \
                --country "$ISO3" \
                --as-of "$window_as_of" \
                --candidate-offset "$offset" \
                > /tmp/day6-corroborate.json
              jq -e '.ok == true and .execution_mode == "local_canonical_corroboration_direct_postgres" and .threshold_weakening == false' /tmp/day6-corroborate.json >/dev/null
              jq -c --arg iso3 "$ISO3" '. + {probe_country_iso3:$iso3}' /tmp/day6-corroborate.json >> /tmp/day6-corroboration-all.ndjson
              next="$(jq -r '.next_candidate_offset' /tmp/day6-corroborate.json)"
              [[ "$next" != "null" ]] || break
              [[ "$next" =~ ^[0-9]+$ && "$next" -gt "$offset" && "$next" -lt 600 ]] || exit 2
              offset="$next"
            done

            set +e
            DAY6_COUNTRY_ISO3="$ISO3" NODE_OPTIONS=--experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs \
              node --import tsx scripts/probe-day6-federico-live-evidence.ts "$ISO3" > /tmp/day6-probe.json
            rc=$?
            set -e
            cat /tmp/day6-probe.json
            if [[ "$rc" -eq 0 ]] && jq -e '.ok == true and .ready == true and .policy.threshold_weakening == false and .partner_allowance_spent == false' /tmp/day6-probe.json >/dev/null; then
              SELECTED="$ISO3"
              cp /tmp/day6-probe.json /tmp/day6-selected-probe.json
              break
            fi
          done < /tmp/day6-candidates.txt

          test -n "$SELECTED" || {
            echo "::error::Fresh sources were repolled and candidates corroborated, but no country passed the unchanged FEDERICO_STRICT local evidence gate. Federico allowance was not used."
            exit 4
          }
          echo "iso3=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "Selected strict-ready country: $SELECTED"

      - name: Dispatch no-allowance current-head local assurance
        id: local
        env:
          TARGET_ISO3: ${{ steps.strict.outputs.iso3 }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run day6-partner-assurance-final.yml --ref main -f iso3="$TARGET_ISO3" -f candidate_sha="$MAIN_SHA" -f use_partner_allowance=false
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow day6-partner-assurance-final.yml --branch main --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt,displayTitle,status \
              | jq -r --arg since "$SINCE" --arg marker "@ $MAIN_SHA allowance=false" '[.[] | select(.createdAt >= $since and (.displayTitle | contains($marker)))] | sort_by(.createdAt) | last | .databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 3
          done
          test -n "${RUN_ID:-}" || { echo "::error::Could not locate no-allowance Day 6 run"; exit 2; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status
          for _ in $(seq 1 12); do
            ARTIFACTS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name' || true)"
            printf '%s\n' "$ARTIFACTS"
            printf '%s\n' "$ARTIFACTS" | grep -q "^day6-global-partner-assurance-${RUN_ID}$" && exit 0
            sleep 5
          done
          echo "::error::No fresh local-assurance handoff was produced. Federico allowance was not used."
          exit 5

      - name: Dispatch exactly one authorized Federico pilot allowance review
        id: live
        env:
          TARGET_ISO3: ${{ steps.strict.outputs.iso3 }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run day6-partner-assurance-final.yml --ref main -f iso3="$TARGET_ISO3" -f candidate_sha="$MAIN_SHA" -f use_partner_allowance=true
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow day6-partner-assurance-final.yml --branch main --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt,displayTitle,status \
              | jq -r --arg since "$SINCE" --arg marker "@ $MAIN_SHA allowance=true" '[.[] | select(.createdAt >= $since and (.displayTitle | contains($marker)))] | sort_by(.createdAt) | last | .databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 3
          done
          test -n "${RUN_ID:-}" || { echo "::error::Could not locate authorized Day 6 run"; exit 2; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status
          for _ in $(seq 1 12); do
            ARTIFACTS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name' || true)"
            printf '%s\n' "$ARTIFACTS"
            printf '%s\n' "$ARTIFACTS" | grep -q "^day6-global-partner-assurance-${RUN_ID}$" && exit 0
            sleep 5
          done
          echo "::error::Authorized review completed without a sealed handoff artifact."
          exit 6

      - name: Seal orchestration summary
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p /tmp/day6-authorized-summary
          cat > /tmp/day6-authorized-summary/summary.json <<JSON
          {
            "schema":"geomacro.day6-authorized-federico-pilot-once.v2",
            "orchestration_run_id":"${GITHUB_RUN_ID}",
            "candidate_sha":"${GITHUB_SHA}",
            "country_iso3":"${{ steps.strict.outputs.iso3 }}",
            "local_assurance_run_id":"${{ steps.local.outputs.run_id }}",
            "authorized_partner_run_id":"${{ steps.live.outputs.run_id }}",
            "owner_authorized_pilot_allowance":true,
            "user_funds_authorized":false,
            "real_money_payment_authorized":false,
            "execution_authorized":false,
            "automatic_retry_of_allowance":false
          }
          JSON
          sha256sum /tmp/day6-authorized-summary/summary.json > /tmp/day6-authorized-summary/SHA256SUMS.txt

      - name: Upload orchestration summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: day6-authorized-federico-pilot-${{ github.run_id }}
          path: /tmp/day6-authorized-summary/
          if-no-files-found: warn
          retention-days: 14

      - name: Record Day 6 outcome on migration tracker
        if: ${{ always() }}
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET_ISO3: ${{ steps.strict.outputs.iso3 }}
          LOCAL_RUN_ID: ${{ steps.local.outputs.run_id }}
          AUTHORIZED_RUN_ID: ${{ steps.live.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/day6-tracker-comment.md <<EOF
          Day 6 authorized Federico pilot orchestration update

          - orchestration run: ${GITHUB_RUN_ID}
          - candidate SHA: ${GITHUB_SHA}
          - job status: ${JOB_STATUS}
          - selected country: ${TARGET_ISO3:-not_selected}
          - no-allowance local assurance run: ${LOCAL_RUN_ID:-not_started}
          - authorized Federico allowance run: ${AUTHORIZED_RUN_ID:-not_started}
          - owner-authorized pilot allowance only: true
          - user funds authorized: false
          - execution authorized: false
          EOF
          gh issue comment 1354 --repo "$GITHUB_REPOSITORY" --body-file /tmp/day6-tracker-comment.md
