name: Verify one GRO bundle restore in production

# Runs once when this workflow is merged. Bulk GRO migration remains manual.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/b2-gro-bundle-live-canary.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-b2-gro-live-canary
  cancel-in-progress: false

jobs:
  verify_one:
    if: ${{ github.repository == 'blocknine0/geomacro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      GRO_ARCHIVE_SUFFIX: "0"
      GRO_BUNDLE_LIMIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify one B2 bundle and production GRO restore
        run: bun scripts/ops/b2-archive-gro-bundle.ts
