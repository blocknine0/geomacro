name: Product CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/product-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout GOAT pilot branch for one-time normalization
        uses: actions/checkout@v7
        with:
          ref: feat/goat-x402-partner-pilot

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify committed lockfile and install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize GOAT provider challenge
        shell: bash
        run: |
          perl -0pi -e 's/  raw: Record<string, unknown>;\n//s' src/lib/goat-flow.server.ts
          perl -0pi -e 's/    expires_at: expiresAt,\n    raw,\n  };/    expires_at: expiresAt,\n  };/s' src/lib/goat-flow.server.ts
          perl -0pi -e 's/  const \{\n    raw: _providerRaw,\n    \.\.\.normalizedChallenge\n  \} = providerChallenge;/  const normalizedChallenge = providerChallenge;/s' src/lib/goat-pilot-service.server.ts
          git add src/lib/goat-flow.server.ts src/lib/goat-pilot-service.server.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(goat): expose normalized payment challenge only"
            git push origin HEAD:feat/goat-x402-partner-pilot
          fi

      - name: App tests
        run: bun run test:app

      - name: Risk Gate phase-1 static contract
        run: node scripts/test-risk-gate-phase1.mjs

      - name: Risk Gate country/corridor API static contract
        run: node scripts/test-risk-gate-corridor-api-static.mjs

      - name: Production build
        run: bun run build

      - name: Verify generated route tree is committed
        shell: bash
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts is stale"
            exit 1
          fi
