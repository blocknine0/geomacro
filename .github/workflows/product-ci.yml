name: Product CI

on:
  # Product CI is the repository-wide merge/push gate. Do not scope this by
  # paths: important agentic/economy contracts also live under supabase/,
  # workers/, config/, schemas/ and other non-src surfaces. A path filter would
  # let a future regression bypass the permanent governance suite.
  pull_request:

  # Keep the same repository-wide invariant for direct pushes to main.
  push:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify permanent workflow inventory and frozen Predge definitions
        run: node scripts/ops/verify-github-workflow-inventory.mjs

      # Pin the exact Bun version that produced and validated the committed
      # lockfile. Do not float on "latest": lockfile semantics can change
      # between Bun releases and create false/intermittent CI failures.
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # This is intentionally frozen. package.json dependency/override changes
      # must be accompanied by a regenerated bun.lock in the same PR.
      - name: Verify committed integrity-pinned public npm tarball registry before network
        run: node --test scripts/tests/bun-locked-registry-integrity.test.mjs

      - name: Verify committed lockfile and install dependencies
        # GitHub runners can inherit Lovable's npm mirror, which returned
        # provider HTTP 429 in production CI on 2026-10-23. Force the public
        # official npm registry for the already-pinned lockfile and cap
        # burst concurrency; do not relax integrity, versions or scripts.
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org/ --network-concurrency=8

      - name: App tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          bun run test:app 2>&1 | tee artifacts/product-ci-tests.log

      - name: Predge owner sealed token-only handoff crypto and authorization (offline)
        run: node --test scripts/ops/predge-sealed-token-handoff.test.mjs

      - name: Groq browser search official-first fallback (offline, no provider calls)
        run: node --test scripts/lib/groq-browser-live-fallback.test.mjs

      - name: Private source handoff SQLite binding and safe rejection contracts (offline)
        run: bun test scripts/tests/private-source-handoff-sqlite.test.ts

      - name: Genuine signed 503 recovery owner-private preflight and historical B2 truth gate (offline)
        run: |
          node --test scripts/tests/owner-private-503-recovery-preflight.test.mjs
          node --test scripts/tests/phase2-gri-recovery-readiness.test.mjs
          node --test scripts/tests/dispatch-gri-immutable-history-once.test.mjs
      - name: Real two-human standing consent, automatic dual-machine derived audit only (offline)
        run: |
          node --test scripts/tests/gri-automation-consent.test.mjs
          node --test scripts/tests/gri-automated-derived-policy-review.test.mjs

      - name: Private handoff D1 production acceptance contract (offline, no funds)
        run: node --test scripts/tests/verify-private-handoff-production.test.mjs

      - name: Safe low-source review operator counters (no private bytes, no funds)
        run: node --test scripts/tests/emit-low-source-review-status.test.mjs

      - name: Private LOW reviewer provisioning boundary (offline, no secret writes)
        run: node --test scripts/ops/provision-private-low-review-authority.test.mjs

      - name: Query-specific capability price health (offline, no funds)
        run: >-
          node --test scripts/commerce/capability-price-health.test.mjs
          scripts/ops/three-launch-blockers-report.test.mjs
          scripts/ops/derived-news-latency-audit.test.mjs
          scripts/tests/country-195-proof-rollup.test.mjs

      - name: Official macro and minerals source-clock integrity (no network)
        run: node --test global-intelligence/scripts/test-statistical-source-clocks.test.mjs

      - name: Setup Node 24 for shared TypeScript contract verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: P0 public hot recovery handoff tests (offline, no funds)
        run: node --test scripts/ops/reconcile-public-hot-recovery.test.mjs

      - name: Native Circle Facilitator verification (offline, no funds)
        run: node --test scripts/lib/circle-facilitator-verification.test.mjs scripts/ops/verify-structural-candidate-vault.test.mjs

      - name: Supabase-free verified Intelligence publication contract (no network or funds)
        run: |
          node --test scripts/ops/supabase-free-public-intelligence-publisher.test.mjs \
            scripts/lib/published-intelligence-readback.test.mjs
          bun test scripts/lib/gri-reviewed-to-current-intelligence.test.mjs
          bun build scripts/ops/publish-supabase-free-public-intelligence.mjs \
            --target=bun --outfile=/tmp/geomacro-verified-intelligence-publisher-smoke.js
          test -s /tmp/geomacro-verified-intelligence-publisher-smoke.js
          bun build scripts/ops/prepare-intelligence-from-reviewed-gri.mjs \
            --target=bun --outfile=/tmp/geomacro-reviewed-gri-intelligence-bridge.js
          test -s /tmp/geomacro-reviewed-gri-intelligence-bridge.js
          bun build scripts/ops/publish-automated-finds.ts \
            --target=bun --outfile=/tmp/geomacro-automated-finds-publisher-smoke.js
          test -s /tmp/geomacro-automated-finds-publisher-smoke.js

      - name: Compile separate machine Intelligence publisher (no credentials or network)
        run: |
          bun build scripts/ops/publish-machine-public-intelligence.mjs \
            --target=bun --outfile=/tmp/geomacro-machine-intelligence-publisher.js
          test -s /tmp/geomacro-machine-intelligence-publisher.js
          bun build scripts/ops/prepare-machine-intelligence-publication.ts \
            --target=bun --outfile=/tmp/geomacro-machine-intelligence-batch.js
          test -s /tmp/geomacro-machine-intelligence-batch.js

      - name: Upload app test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-ci-test-evidence
          path: artifacts/product-ci-tests.log
          if-no-files-found: error
          retention-days: 30

      - name: Risk Gate phase-1 static contract
        run: node scripts/test-risk-gate-phase1.mjs

      - name: Risk Gate country/corridor API static contract
        run: node scripts/test-risk-gate-corridor-api-static.mjs

      - name: Compile critical GRO hot publisher without executing it
        shell: bash
        run: |
          set -euo pipefail
          bun build scripts/ops/publish-country-gro-hot-bundle.ts \
            --target=bun \
            --outfile=/tmp/geomacro-gro-hot-publisher-smoke.js
          test -s /tmp/geomacro-gro-hot-publisher-smoke.js
          bun build scripts/day6-direct-live-federico-gro.ts \
            --target=bun \
            --outfile=/tmp/geomacro-day6-direct-federico-smoke.js
          test -s /tmp/geomacro-day6-direct-federico-smoke.js
          bun build scripts/invinoveritas-risk-object-preflight.ts \
            --target=bun \
            --outfile=/tmp/geomacro-invino-preflight-smoke.js
          test -s /tmp/geomacro-invino-preflight-smoke.js

      - name: Production build
        run: bun run build

      - name: Verify generated route tree is committed
        shell: bash
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts is stale. Regenerate it with the current TanStack Router source routes and commit the generated file."
            echo "----- BEGIN GENERATED ROUTE TREE -----"
            cat src/routeTree.gen.ts
            echo "----- END GENERATED ROUTE TREE -----"
            exit 1
          fi
