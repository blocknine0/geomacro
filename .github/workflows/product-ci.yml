name: Product CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/product-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/product-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head for one-time provider-boundary normalization
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify committed lockfile and install dependencies
        run: bun install --frozen-lockfile

      - name: One-time remove raw GOAT provider response from public contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flow_path = Path('src/lib/goat-flow.server.ts')
          flow = flow_path.read_text()
          old_type = '  raw: Record<string, unknown>;\n'
          if old_type in flow:
              flow = flow.replace(old_type, '', 1)
          old_return = '    expires_at: expiresAt,\n    raw,\n  };'
          if old_return in flow:
              flow = flow.replace(old_return, '    expires_at: expiresAt,\n  };', 1)
          flow_path.write_text(flow)

          service_path = Path('src/lib/goat-pilot-service.server.ts')
          service = service_path.read_text()
          old = '''  const {
            raw: _providerRaw,
            ...normalizedChallenge
          } = providerChallenge;'''
          if old not in service:
              old = '''  const {
    raw: _providerRaw,
    ...normalizedChallenge
  } = providerChallenge;'''
          if old in service:
              service = service.replace(old, '  const normalizedChallenge = providerChallenge;', 1)
          service_path.write_text(service)
          PY

          git add src/lib/goat-flow.server.ts src/lib/goat-pilot-service.server.ts
          if git diff --cached --quiet; then
            echo "Provider boundary already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(goat): expose normalized payment challenge only"
          git push origin HEAD:${{ github.head_ref }}

      - name: App tests
        run: bun run test:app

      - name: Risk Gate phase-1 static contract
        run: node scripts/test-risk-gate-phase1.mjs

      - name: Risk Gate country/corridor API static contract
        run: node scripts/test-risk-gate-corridor-api-static.mjs

      - name: Production build
        run: bun run build

      - name: Verify generated route tree is committed
        shell: bash
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts is stale. Regenerate it with the current TanStack Router source routes and commit the generated file."
            exit 1
          fi
