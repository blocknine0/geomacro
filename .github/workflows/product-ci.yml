name: Product CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/product-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/product-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pin the exact Bun version that produced and validated the committed
      # lockfile. Do not float on "latest": lockfile semantics can change
      # between Bun releases and create false/intermittent CI failures.
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # This is intentionally frozen. package.json dependency/override changes
      # must be accompanied by a regenerated bun.lock in the same PR.
      - name: Verify committed lockfile and install dependencies
        run: bun install --frozen-lockfile

      - name: App tests
        run: bun run test:app

      - name: Risk Gate phase-1 static contract
        run: node scripts/test-risk-gate-phase1.mjs

      - name: Risk Gate country/corridor API static contract
        run: node scripts/test-risk-gate-corridor-api-static.mjs

      - name: Production build
        run: bun run build

      # TEMPORARY branch-only diagnostic: capture the exact TanStack Router
      # output produced by the successful build so the stale committed
      # routeTree.gen.ts can be reconciled without hand-editing generated code.
      # Remove this step immediately after the generated file is committed.
      - name: Capture generated route tree
        run: |
          echo "::group::GENERATED_ROUTE_TREE"
          cat src/routeTree.gen.ts
          echo "::endgroup::"
