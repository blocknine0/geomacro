name: Product CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/product-ci.yml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/product-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pin the exact Bun version that produced and validated the committed
      # lockfile. Do not float on "latest": lockfile semantics can change
      # between Bun releases and create false/intermittent CI failures.
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # This is intentionally frozen. package.json dependency/override changes
      # must be accompanied by a regenerated bun.lock in the same PR.
      - name: Verify committed lockfile and install dependencies
        run: bun install --frozen-lockfile

      - name: App tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          bun run test:app 2>&1 | tee artifacts/product-ci-tests.log

      - name: Upload app test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-ci-test-evidence
          path: artifacts/product-ci-tests.log
          if-no-files-found: error
          retention-days: 30

      - name: Risk Gate phase-1 static contract
        run: node scripts/test-risk-gate-phase1.mjs

      - name: Risk Gate country/corridor API static contract
        run: node scripts/test-risk-gate-corridor-api-static.mjs

      - name: Production build
        run: bun run build

      - name: Verify generated route tree is committed
        shell: bash
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts is stale. Regenerate it with the current TanStack Router source routes and commit the generated file."
            echo "----- BEGIN GENERATED ROUTE TREE -----"
            cat src/routeTree.gen.ts
            echo "----- END GENERATED ROUTE TREE -----"
            exit 1
          fi
