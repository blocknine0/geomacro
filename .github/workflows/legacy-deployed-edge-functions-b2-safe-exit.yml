name: Preserve Deployed Legacy Supabase Edge Functions to Private B2
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-deployed-edge-functions-b2-safe-exit.yml"
      - "scripts/ops/legacy-deployed-edge-functions-b2-safe-exit.mjs"
      - "scripts/ops/legacy-edge-source-body-format.mjs"
      - "scripts/ops/legacy-edge-source-body-format.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/legacy-deployed-edge-functions-b2-safe-exit.yml"
      - "scripts/ops/legacy-deployed-edge-functions-b2-safe-exit.mjs"
permissions:
  contents: read
concurrency:
  group: geomacro-legacy-deployed-edge-safe-exit
  cancel-in-progress: false
jobs:
  no-secret-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ""
      SUPABASE_PROJECT_ID: ""
      B2_KEY_ID: ""
      B2_APPLICATION_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Confirm fail-closed without credentials
        run: |
          set -euo pipefail
          node --check scripts/ops/legacy-deployed-edge-functions-b2-safe-exit.mjs
          node --test scripts/ops/legacy-edge-source-body-format.test.mjs
          node scripts/ops/legacy-deployed-edge-functions-b2-safe-exit.mjs || test "$?" -eq 3
          node - <<'NODE'
          const r=require("./artifacts/legacy-exit/deployed-edge-b2-verified.json");
          if(r.status!=="BLOCKED_NO_DELETION"||
             r.old_supabase_writes!==0||r.old_supabase_deletes!==0||
             r.b2_deletes!==0||r.payments!==0||
             r.old_supabase_deletion_authorized!==false)throw Error("EDGE_SAFE_EXIT_FENCE_FAILED");
          NODE
  read-only-source-preservation:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_LEGACY_EDGE_READ_TOKEN: ${{ secrets.SUPABASE_LEGACY_EDGE_READ_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Resolve shared B2 quota D1 ledger from existing Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!/^[a-f0-9]{32}$/u.test(account??""))throw Error("EDGE_B2_ACCOUNT_MISSING");
          const res=await fetch("https://api.cloudflare.com/client/v4/accounts/"+
            account+"/d1/database?per_page=100",{
             headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN},
             redirect:"error",signal:AbortSignal.timeout(15000)});
          const body=await res.json();
          const id=body?.result?.find(x=>x.name==="geomacro-control-plane")?.uuid;
          if(!res.ok||body.success!==true||!/^[a-f0-9-]{36}$/u.test(id??""))
            throw Error("EDGE_B2_ACCOUNT_SHARED_QUOTA_UNAVAILABLE");
          appendFileSync(process.env.GITHUB_ENV,"D1_DATABASE_ID="+id+"\n");
          NODE
      - name: Capture actual deployed source and immutable B2 independent byte readback
        run: |
          set -euo pipefail
          node scripts/ops/legacy-deployed-edge-functions-b2-safe-exit.mjs
          node - <<'NODE'
          const r=require("./artifacts/legacy-exit/deployed-edge-b2-verified.json");
          if(r.old_supabase_deletion_authorized!==false||
             r.old_supabase_writes!==0||r.old_supabase_deletes!==0||
             r.b2_deletes!==0||r.payments!==0)throw Error("EDGE_MUTATION_FENCE_FAILED");
          if(r.b2_verified!==true)process.exitCode=3;
          NODE
      - name: Upload redacted counts only, never deployed source or secrets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: legacy-edge-function-preservation-${{ github.run_id }}
          path: artifacts/legacy-exit/deployed-edge-b2-verified.json
          if-no-files-found: warn
          retention-days: 14
