name: One-time FX response alias repair

on:
  push:
    branches:
      - fix/global-fx-structural-alias
    paths:
      - ".github/workflows/one-time-fx-response-alias.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/global-fx-structural-alias
          persist-credentials: true

      - name: Patch response alias exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/agent-query-response.server.ts')
          s = p.read_text()
          old = '  external_fx: ["external_fx", "fx", "external", "currency"],'
          new = '  external_fx: ["external_fx", "currency_capital_mobility", "fx", "external", "currency", "capital_mobility"],'
          if new in s:
              print('response alias already patched')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print('response alias patched')
          else:
              raise SystemExit('expected response alias line not found')
          PY

      - name: Install and test
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bunx vitest run src/lib/agent-query-deliverability.server.test.ts src/lib/agent-query-plan.test.ts

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/agent-query-response.server.ts; then
            echo "No response alias change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agent-query-response.server.ts
          git commit -m "Align FX response alias with governed currency module"
          git push origin HEAD:fix/global-fx-structural-alias
