name: Step3 Native D1 Backend Read-Only Diagnosis (NO FUNDS)

# Independent diagnostic of the production D1 backend label and actual native
# Time Travel API. No migration, SQL execute, recovery restore or deployment.
on:
  pull_request:
    paths:
      - ".github/workflows/step3-d1-native-backend-readonly.yml"
      - "scripts/ops/step3-d1-native-backend-readonly.mjs"
      - "scripts/tests/step3-d1-native-backend-readonly.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/step3-d1-native-backend-readonly.yml"
      - "scripts/ops/step3-d1-native-backend-readonly.mjs"
      - "scripts/tests/step3-d1-native-backend-readonly.test.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-step3-native-d1-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: "24"}
      - run: node --check scripts/ops/step3-d1-native-backend-readonly.mjs
      - run: node --test scripts/tests/step3-d1-native-backend-readonly.test.mjs

  provider-diagnostic:
    needs: offline-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: "24"}
      - name: Inspect exact production D1 metadata and real native Time Travel bookmark (never log bookmark)
        run: node scripts/ops/step3-d1-native-backend-readonly.mjs
