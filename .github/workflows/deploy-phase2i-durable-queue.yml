name: Deploy Phase2I Durable R2 DO
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "workers/phase2i-durable-queue/**"
      - "scripts/lib/phase2i-durable-queue-client.mjs"
      - "scripts/tests/phase2i-durable-queue.test.mjs"
      - ".github/workflows/deploy-phase2i-durable-queue.yml"
permissions:
  contents: read
concurrency:
  group: geomacro-phase2i-private-durable-deploy
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: |
          set -euo pipefail
          node --check workers/phase2i-durable-queue/worker.mjs
          node --check scripts/lib/phase2i-durable-queue-client.mjs
          node --test scripts/tests/phase2i-durable-queue.test.mjs
  deploy:
    needs: offline
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.GEOMACRO_PHASE2I_DURABLE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PHASE2I_DURABLE_TOKEN: ${{ secrets.GEOMACRO_PHASE2I_DURABLE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Require dedicated private bucket and production secret
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(printf '%s' "$PHASE2I_DURABLE_TOKEN" | wc -c)" -ge 32
          npx -y wrangler@4.136.3 r2 bucket info geomacro-private-osint-phase2i >/dev/null
      - name: Deploy SQLite Durable Object with R2 ciphertext binding
        run: npx -y wrangler@4.136.3 deploy --config workers/phase2i-durable-queue/wrangler.toml
      - name: Set dedicated token without logging its value
        run: |
          set -euo pipefail
          printf '%s' "$PHASE2I_DURABLE_TOKEN" |
            npx -y wrangler@4.136.3 secret put PHASE2I_DURABLE_TOKEN --config workers/phase2i-durable-queue/wrangler.toml >/dev/null
      - name: Verify authenticated status without original publisher access
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 \
            -H "Authorization: Bearer $PHASE2I_DURABLE_TOKEN" \
            https://geomacro-phase2i-durable-queue.daspallab202391.workers.dev/v1/phase2i/status |
            jq -e '.ok == true and .schema == "geomacro.phase2i.durable-health.v1" and .source_news_exposed == false' >/dev/null
          echo "PHASE2I_DURABLE_QUEUE_STATUS_VERIFIED"
