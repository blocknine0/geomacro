name: GeoMacro Protected D1 Canary Stage A — Read-only No Funds
# Stage A runs on the exact reviewed main SHA and consumes no D1 query rows.
# A green Stage A is only eligibility for a separately authorized 0%-version
# upload, NOT deployment success or permission to shift production traffic.
on:
  push:
    branches: [main]
    paths:
      - "scripts/ops/protected-d1-repair-plan.mjs"
      - "scripts/ops/run-protected-d1-repair.mjs"
      - "scripts/tests/protected-d1-repair-plan.test.mjs"
      - ".github/workflows/geomacro-protected-d1-canary-preflight.yml"
      - "scripts/ops/verify-protected-d1-zero-canary-preflight.mjs"
      - "scripts/ops/verify-protected-d1-migration-gate.mjs"
      - "scripts/ops/verify-protected-d1-migration-headroom.mjs"
      - "scripts/tests/verify-protected-d1-migration-headroom.test.mjs"
      - "scripts/tests/verify-protected-d1-migration-gate.test.mjs"
      - "scripts/tests/verify-protected-d1-index-build-bound.test.mjs"
      - "workers/control-plane/migrations/0204_d1_read_hotspot_optimization.sql"
      - "scripts/lib/d1-owner-daily-envelope.mjs"
      - "scripts/lib/d1-owner-daily-envelope.test.mjs"
      - "scripts/ops/plan-d1-bundled-work.mjs"
      - "config/geomacro-cloudflare-five-usd-budget.json"
      - "scripts/tests/owner-d1-total-140k-policy.test.mjs"
      - "scripts/tests/verify-protected-d1-zero-canary-preflight.test.mjs"
      - "workers/control-plane/src/hot50-production-activation-census.mjs"
      - "workers/control-plane/src/p0b-ingestion-status.mjs"
      - "workers/control-plane/migrations/0211_p0b_daily_committed_count.sql"
      - "src/workers/backlog-drain-cron.ts"
      - "workers/control-plane/src/index.mjs"
  # Automatic provider-only eligibility recheck after UTC reset and the
  # first hour of actual production load. It cannot upload a Worker version,
  # change traffic, migrate D1, touch B2 or activate funds.
  schedule:
    - cron: "15,35,55 * * * *"
    # Early-UTC corrective schema window before old Worker burns daily headroom.
    # Provider counters still independently gate every real migration.
    - cron: "4 0 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/ops/protected-d1-repair-plan.mjs"
      - "scripts/ops/run-protected-d1-repair.mjs"
      - "scripts/tests/protected-d1-repair-plan.test.mjs"
      - ".github/workflows/geomacro-protected-d1-canary-preflight.yml"
      - "scripts/ops/verify-protected-d1-zero-canary-preflight.mjs"
      - "scripts/ops/verify-protected-d1-migration-gate.mjs"
      - "scripts/ops/verify-protected-d1-migration-headroom.mjs"
      - "scripts/tests/verify-protected-d1-migration-headroom.test.mjs"
      - "scripts/tests/verify-protected-d1-migration-gate.test.mjs"
      - "scripts/tests/verify-protected-d1-index-build-bound.test.mjs"
      - "workers/control-plane/migrations/0204_d1_read_hotspot_optimization.sql"
      - "scripts/tests/verify-protected-d1-zero-canary-preflight.test.mjs"
      - "scripts/lib/d1-owner-daily-envelope.mjs"
      - "scripts/lib/d1-owner-daily-envelope.test.mjs"
      - "scripts/ops/plan-d1-bundled-work.mjs"
      - "config/geomacro-cloudflare-five-usd-budget.json"
      - "scripts/tests/owner-d1-total-140k-policy.test.mjs"
      - "workers/control-plane/src/hot50-production-activation-census.mjs"
      - "workers/control-plane/src/p0b-ingestion-status.mjs"
      - "workers/control-plane/migrations/0211_p0b_daily_committed_count.sql"
      - "src/workers/backlog-drain-cron.ts"
      - "workers/control-plane/src/index.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-protected-d1-canary-stage-a
  cancel-in-progress: false

jobs:
  no-funds-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify exact Hot50 SQL plan, cheap health and canary hold decisions
        run: |
          node --test scripts/tests/protected-d1-repair-plan.test.mjs scripts/tests/owner-d1-total-140k-policy.test.mjs scripts/tests/verify-protected-d1-migration-headroom.test.mjs scripts/tests/verify-protected-d1-migration-gate.test.mjs scripts/tests/verify-protected-d1-index-build-bound.test.mjs scripts/lib/d1-owner-daily-envelope.test.mjs scripts/tests/hot50-production-activation.test.mjs scripts/tests/p0b-production-readiness.test.mjs scripts/tests/verify-protected-d1-zero-canary-preflight.test.mjs
          test -f config/d1-hotspot-v2-canary.hold

  provider-readonly-preflight:
    needs: no-funds-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify current D1 Time Travel bookmark, deployed 100% baseline and 140k/day capacity
        run: node scripts/ops/verify-protected-d1-zero-canary-preflight.mjs
      - name: Save nonsecret PASS or HOLD receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-protected-d1-canary-preflight-no-funds
          path: artifacts/protected-canary/preflight-no-funds.json
          retention-days: 7
          if-no-files-found: ignore


  # Separate migration-only read-only proof: existing Worker can burn hourly
  # pacing faster than a corrective schema migration can be applied.
  # This does NOT change the regular Stage A outcome or unlock Worker traffic.
  provider-migration-headroom:
    needs: no-funds-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify real baseline, bookmark, paid plan and 80k read/write repair reserve
        run: node scripts/ops/verify-protected-d1-migration-headroom.mjs
      - name: Save nonsecret migration-only headroom receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-protected-d1-migration-headroom
          path: artifacts/protected-canary/migration-preflight-only.json
          retention-days: 7
          if-no-files-found: ignore

  # Stage B repairs the reviewed 0204–0211 chain one migration per budget check.
  # Stage B executes only after fresh independent migration-only headroom PASS.
  # A normal 0%-canary Stage A pacing HOLD is not silently treated as a PASS.
  # There is no Worker upload, traffic promotion, payment or destructive restore.
  protected-0204-0211-migration:
    needs: provider-migration-headroom
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.provider-migration-headroom.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: geomacro-d1-control-plane-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      WRANGLER_VERSION: "4.136.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Recheck current main SHA and 80k-row migration budget
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/blocknine0/geomacro.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -f config/d1-hotspot-v2-canary.hold
          node scripts/ops/verify-protected-d1-migration-gate.mjs
      - name: Resolve canonical existing D1 without creating databases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx -y "wrangler@$WRANGLER_VERSION" d1 list --json > "$RUNNER_TEMP/d1-list.json" 2>/dev/null
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const all=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/d1-list.json','utf8'));
          const matches=all.filter(x=>x.name==='geomacro-control-plane');
          if(matches.length!==1||!/^[0-9a-f-]{36}$/i.test(matches[0].uuid??''))
            throw Error('CANARY_D1_BINDING_NOT_UNIQUE');
          const t=JSON.parse(readFileSync('workers/control-plane/wrangler.example.jsonc','utf8'));
          const db=t.d1_databases?.find(x=>x.binding==='DB');
          if(!db||db.database_name!=='geomacro-control-plane')
            throw Error('CANARY_D1_TEMPLATE_BINDING_MISMATCH');
          // D1-only config cannot accidentally deploy or alter queues/routes/secrets.
          writeFileSync('workers/control-plane/wrangler.canary-d1.jsonc',
            JSON.stringify({name:t.name,main:t.main,compatibility_date:t.compatibility_date,
              d1_databases:[{...db,database_id:matches[0].uuid}]})+'\n',{mode:0o600});
          NODE
      - name: Confirm D1 production Time Travel backup before migration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd workers/control-plane
          npx -y "wrangler@$WRANGLER_VERSION" d1 info DB --json \
            --config wrangler.canary-d1.jsonc > "$RUNNER_TEMP/d1-info.json" 2>/dev/null
          npx -y "wrangler@$WRANGLER_VERSION" d1 time-travel info DB --json \
            --config wrangler.canary-d1.jsonc > "$RUNNER_TEMP/d1-bookmark.json" 2>/dev/null
          cd ../..
          node scripts/ops/verify-protected-d1-migration-gate.mjs \
            --backup "$RUNNER_TEMP/d1-info.json" "$RUNNER_TEMP/d1-bookmark.json"
      - name: Apply reviewed repair migrations individually with fresh quota and backup
        run: node scripts/ops/run-protected-d1-repair.mjs
      - name: Verify migrations empty and exact schema objects present
        shell: bash
        run: |
          set -euo pipefail
          cd workers/control-plane
          npx -y "wrangler@$WRANGLER_VERSION" d1 migrations list DB --remote \
            --config wrangler.canary-d1.jsonc > "$RUNNER_TEMP/d1-after.txt" 2>/dev/null
          npx -y "wrangler@$WRANGLER_VERSION" d1 execute DB --remote --json \
            --config wrangler.canary-d1.jsonc \
            --command "SELECT name FROM sqlite_master WHERE name IN ('materialized_cache','idx_private_osint_country_category_clock_v2','idx_private_osint_check_category_status_v2','idx_website_derived_hot_order_v2','p0b_committed_day_totals','trg_p0b_day_committed_insert','trg_p0b_day_committed_delete','trg_p0b_day_committed_clock_change')" \
            > "$RUNNER_TEMP/d1-schema.json" 2>/dev/null
          cd ../..
          node scripts/ops/verify-protected-d1-migration-gate.mjs \
            --schema "$RUNNER_TEMP/d1-after.txt" "$RUNNER_TEMP/d1-schema.json"
      - name: Retain nonsecret UTC budget and schema receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-protected-migration-0204-0211
          path: |
            artifacts/protected-canary/migration-*.json
            artifacts/protected-canary/repair-*.json
          if-no-files-found: ignore
          retention-days: 7
