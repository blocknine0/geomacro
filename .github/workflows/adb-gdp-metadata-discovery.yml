name: ADB GDP Metadata Discovery

on:
  pull_request:
    paths:
      - "scripts/discover-adb-kidb-gdp-indicator.mjs"
      - ".github/workflows/adb-gdp-metadata-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover GDP-like DF_NA metadata
        shell: bash
        run: node scripts/discover-adb-kidb-gdp-indicator.mjs
