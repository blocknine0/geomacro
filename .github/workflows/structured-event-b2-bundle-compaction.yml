name: Structured Event B2 Bundle Compaction

on:
  workflow_dispatch:
    inputs:
      older_days:
        description: "Archive/compact structured payloads older than this many days (minimum 7)"
        required: false
        default: "7"
        type: string
      limit:
        description: "Maximum rows in this verified bundle run (1-1000; start with 25)"
        required: false
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: structured-event-b2-bundle-compaction
  cancel-in-progress: false

jobs:
  bundle-compact:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_REQUEST_BUDGET: "8"
      STRUCTURED_EVENT_BUNDLE_OLDER_DAYS: ${{ inputs.older_days }}
      STRUCTURED_EVENT_BUNDLE_LIMIT: ${{ inputs.limit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify bounded production archive configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test "$B2_REQUEST_BUDGET" = "8"
          case "$STRUCTURED_EVENT_BUNDLE_OLDER_DAYS" in (*[!0-9]*|'') exit 1;; esac
          case "$STRUCTURED_EVENT_BUNDLE_LIMIT" in (*[!0-9]*|'') exit 1;; esac
          test "$STRUCTURED_EVENT_BUNDLE_OLDER_DAYS" -ge 7
          test "$STRUCTURED_EVENT_BUNDLE_OLDER_DAYS" -le 3650
          test "$STRUCTURED_EVENT_BUNDLE_LIMIT" -ge 1
          test "$STRUCTURED_EVENT_BUNDLE_LIMIT" -le 1000
      - name: Bundle only after full B2 readback, then verify again after compaction
        run: node scripts/ops/b2-compact-structured-event-bundle.mjs
