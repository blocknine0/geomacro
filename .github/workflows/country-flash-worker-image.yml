name: Build country flash worker image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "workers/telegram-flash/**"
      - ".github/workflows/country-flash-worker-image.yml"
  push:
    branches:
      - main
    paths:
      - "workers/telegram-flash/**"
      - ".github/workflows/country-flash-worker-image.yml"

concurrency:
  group: country-flash-worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build worker container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file workers/telegram-flash/Dockerfile \
            --tag geomacro-country-flash:test \
            workers/telegram-flash

      - name: Verify container starts with configuration guardrails
        shell: bash
        run: |
          set -euo pipefail

          set +e
          output="$(timeout 15s docker run --rm geomacro-country-flash:test 2>&1)"
          code=$?
          set -e

          printf '%s\n' "$output"

          if [[ "$code" -eq 124 ]]; then
            echo "::error title=Worker startup guardrail check failed::Container stayed alive without required runtime configuration."
            exit 1
          fi

          if [[ "$code" -eq 0 ]]; then
            echo "::error title=Worker startup guardrail check failed::Container exited successfully even though required runtime configuration was absent."
            exit 1
          fi

          if ! grep -Eqi 'missing|required|configure|environment|TELEGRAM|GEOMACRO' <<<"$output"; then
            echo "::error title=Startup error not recognized::Container failed without secrets, but not for a recognized configuration guardrail."
            exit 1
          fi

          echo "Worker image built and refused to run without production secrets, as expected."

  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve image name
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/geomacro-country-flash" >> "$GITHUB_ENV"

      - name: Sign in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Build and publish immutable commit tag
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --file workers/telegram-flash/Dockerfile \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            workers/telegram-flash

          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "Published immutable worker image ${IMAGE}:${GITHUB_SHA}"
