name: One-time wire critical minerals

on:
  push:
    branches: [fix/adaptive-critical-minerals-derived]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/adaptive-critical-minerals-derived
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Patch agent deliverability and response
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/lib/agent-query-deliverability.server.ts")
          t = p.read_text()
          anchor = 'import type { AgentQueryPlan } from "./agent-query-plan";\n'
          block = anchor + '''import {\n  AGENT_CRITICAL_MINERALS_SOURCE_ID,\n  loadAgentCriticalMineralsModule,\n} from "./agent-query-critical-minerals.server";\n'''
          if "loadAgentCriticalMineralsModule" not in t:
              if anchor not in t: raise SystemExit("deliverability import anchor missing")
              t = t.replace(anchor, block, 1)

          logic_anchor = '''      if (context.status !== "AVAILABLE" || !available.has(module)) {\n        missing.add(module);\n      } else {\n        stale.add(module);\n      }\n'''
          logic = '''      if (module === "critical_minerals") {\n        let fallback: Awaited<ReturnType<typeof loadAgentCriticalMineralsModule>> | null = null;\n        try {\n          fallback = await loadAgentCriticalMineralsModule({\n            subject,\n            as_of: asOf,\n            max_age_seconds: plan.module_max_age_seconds[module],\n          });\n        } catch {\n          fallback = null;\n        }\n        if (fallback?.deliverable) {\n          available.add(module);\n          governedFallbackModules.add(module);\n          governedFallbackSourceIds.add(AGENT_CRITICAL_MINERALS_SOURCE_ID);\n          const fallbackTime = fallback.source_observed_at\n            ? Date.parse(fallback.source_observed_at)\n            : Number.NaN;\n          if (Number.isFinite(fallbackTime)) {\n            latestEvidence = latestEvidence === null\n              ? fallbackTime\n              : Math.max(latestEvidence, fallbackTime);\n          }\n          continue;\n        }\n        if (fallback?.code === "SOURCE_NOT_ELIGIBLE") {\n          ineligibleSources.add(AGENT_CRITICAL_MINERALS_SOURCE_ID);\n          continue;\n        }\n        if (fallback?.code === "OBSERVATION_STALE") {\n          stale.add(module);\n          continue;\n        }\n      }\n\n''' + logic_anchor
          if "module === \"critical_minerals\"" not in t.split(logic_anchor)[0] if logic_anchor in t else True:
              if logic_anchor not in t: raise SystemExit("deliverability logic anchor missing")
              t = t.replace(logic_anchor, logic, 1)
          p.write_text(t)

          p = Path("src/lib/agent-query-response.server.ts")
          t = p.read_text()
          anchor = 'import type { AgentQueryPlan } from "./agent-query-plan";\n'
          block = anchor + 'import { loadAgentCriticalMineralsModule } from "./agent-query-critical-minerals.server";\n'
          if "loadAgentCriticalMineralsModule" not in t:
              if anchor not in t: raise SystemExit("response import anchor missing")
              t = t.replace(anchor, block, 1)

          response_anchor = '''    if (context.status !== "AVAILABLE") {\n      throw new Error("STRUCTURAL_CONTEXT_NOT_DELIVERABLE");\n    }\n    intelligence[module] = { observations, coverage };\n'''
          response_logic = '''    if (module === "critical_minerals" && !structuralFresh) {\n      const fallback = await loadAgentCriticalMineralsModule({\n        subject,\n        as_of: asOf,\n        max_age_seconds: maxAgeSeconds,\n      });\n      if (!fallback.deliverable || !fallback.state) {\n        throw new Error(`CRITICAL_MINERALS_NOT_DELIVERABLE:${fallback.code}`);\n      }\n      governedFallbackHashes.push(...fallback.source_normalized_hashes);\n      governedFallbackDimensions.add(module);\n      if (fallback.source_observed_at) governedFallbackTimes.push(fallback.source_observed_at);\n      intelligence[module] = {\n        delivery: "GOVERNED_USGS_DERIVED_STATE",\n        source_id: fallback.source_id,\n        source_observed_at: fallback.source_observed_at,\n        source_contract: fallback.source_contract,\n        state: fallback.state,\n        limitations: {\n          derived_intelligence_only: true,\n          raw_source_material_redistributed: false,\n        },\n      };\n      continue;\n    }\n\n''' + response_anchor
          if "CRITICAL_MINERALS_NOT_DELIVERABLE" not in t:
              if response_anchor not in t: raise SystemExit("response logic anchor missing")
              t = t.replace(response_anchor, response_logic, 1)
          p.write_text(t)
      - name: Validate
        run: |
          bunx vitest run src/lib/agent-query-deliverability.server.test.ts
          bun run build
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/agent-query-deliverability.server.ts src/lib/agent-query-response.server.ts
          git commit -m "Wire derived critical-minerals agent fallback"
          git push origin HEAD:fix/adaptive-critical-minerals-derived
