name: Risk Gate Core Resilience

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: In-process decision evaluations
        required: false
        default: "50000"
  pull_request:
    paths:
      - "src/lib/risk-gate-engine.ts"
      - "src/lib/risk-gate-contract.ts"
      - "src/lib/risk-gate-explainability.ts"
      - "src/lib/risk-object-contract.ts"
      - "scripts/stress-risk-gate-core.ts"
      - ".github/workflows/risk-gate-core-resilience.yml"

permissions:
  contents: read

jobs:
  stress-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic Risk Gate core stress harness
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '30000' }}
        run: bunx tsx scripts/stress-risk-gate-core.ts --iterations "$ITERATIONS"

      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: risk-gate-core-stress
          path: artifacts/risk-gate-core-stress.json
          if-no-files-found: error
          retention-days: 30
