name: Diagnose ReliefWeb Secret Alias

on:
  push:
    branches:
      - launch/1414-reliefweb-secret-alias-20261004

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured ReliefWeb secret aliases without exposing values
        env:
          RELIEFWEB_APP_NAME: ${{ secrets.RELIEFWEB_APP_NAME }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RELIEFWEB_APP_NAME:-}" ]]; then
            echo "RELIEFWEB_APP_NAME_CONFIGURED=true"
          else
            echo "RELIEFWEB_APP_NAME_CONFIGURED=false"
          fi
          if [[ -n "${RELIEFWEB_APPNAME:-}" ]]; then
            echo "RELIEFWEB_APPNAME_CONFIGURED=true"
          else
            echo "RELIEFWEB_APPNAME_CONFIGURED=false"
          fi
