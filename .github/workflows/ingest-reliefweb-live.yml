name: Ingest ReliefWeb live metadata into canonical private D1

on:
  workflow_dispatch: {}
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-reliefweb-private-d1
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      RELIEFWEB_TRANSPORT: d1_private
      RELIEFWEB_APPROVED_APPNAME: ${{ secrets.RELIEFWEB_APPROVED_APPNAME }}
      RELIEFWEB_MAX_REPORTS: "250"
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout canonical source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify source and D1 adapter syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ingest-reliefweb-live.mjs
          node --check scripts/lib/reliefweb-private-d1.mjs
          node --check scripts/lib/private-unscored-source-d1.mjs
          node --test scripts/lib/private-unscored-source-d1.test.mjs
      - name: Require approved appname and canonical private D1 credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELIEFWEB_APPROVED_APPNAME:-}" || { echo "::error::RELIEFWEB_APPROVED_APPNAME_REQUIRED"; exit 2; }
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || { echo "::error::PRIVATE_D1_AUTH_REQUIRED"; exit 2; }
      - name: Fetch native-dated report metadata and verify D1 readback
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ingest-reliefweb-live.mjs
