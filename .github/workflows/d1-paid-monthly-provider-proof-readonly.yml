name: Cloudflare Paid D1 Billing-Month Proof — Read Only
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type CHECK_PAID_D1_MONTHLY_QUOTA_READ_ONLY"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/d1-paid-monthly-provider-proof-readonly.yml"
      - "scripts/tests/d1-paid-monthly-provider-proof-workflow.test.mjs"
      - "config/github-workflow-inventory.v1.json"
permissions:
  contents: read
concurrency:
  group: geomacro-paid-d1-monthly-readonly
  cancel-in-progress: false
jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prove manual-only read-only Cloudflare billing scope and SHA pin
        run: node --test scripts/tests/d1-paid-monthly-provider-proof-workflow.test.mjs
  provider-monthly:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.approval == 'CHECK_PAID_D1_MONTHLY_QUOTA_READ_ONLY'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      GEOMACRO_D1_PAID_READONLY_SHA: '42ddf05c4466d69bd02ff92a01ddeb67c7d3d543'
    steps:
      - name: Checkout exact reviewed monthly provider governor code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '42ddf05c4466d69bd02ff92a01ddeb67c7d3d543'
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify pinned read-only source before any external API
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GEOMACRO_D1_PAID_READONLY_SHA"
          test -f config/d1-hotspot-v2-canary.hold
          test -f scripts/lib/d1-workers-paid-monthly-governor.mjs
          test -f config/d1-workers-paid-monthly-policy.v1.json
          node --check scripts/ops/check-d1-paid-monthly-headroom.mjs
          node --test scripts/tests/d1-workers-paid-monthly-governor.test.mjs
      - name: Read actual Cloudflare Paid entitlement and all-account D1 billing-cycle rows
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/check-d1-paid-monthly-headroom.mjs --check
      - name: Preserve sanitized verification or HOLD receipt without tokens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-paid-d1-monthly-readonly-${{ github.run_id }}
          path: artifacts/release/d1-paid-monthly-headroom.json
          retention-days: 14
          if-no-files-found: warn
