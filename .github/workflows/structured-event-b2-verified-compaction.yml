name: Structured Event B2 Verified Compaction

on:
  workflow_dispatch:
    inputs:
      older_days:
        description: "Compact structured payloads older than this many days"
        required: false
        default: "7"
        type: string
      limit:
        description: "Maximum payloads to compact in this run (1-10)"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: structured-event-b2-verified-compaction
  cancel-in-progress: false

jobs:
  compact:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      STRUCTURED_EVENT_COMPACT_OLDER_DAYS: ${{ inputs.older_days }}
      STRUCTURED_EVENT_COMPACT_LIMIT: ${{ inputs.limit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify required archive configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"

      - name: Compact only after verified B2 archive and restore
        run: node scripts/ops/b2-compact-structured-event-payload.mjs
