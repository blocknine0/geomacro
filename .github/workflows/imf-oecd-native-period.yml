name: IMF OECD native statistical reference verification
on:
  pull_request:
    paths:
      - "global-intelligence/adapters/imf-sdmx.mjs"
      - "global-intelligence/adapters/imf-oecd-exact-reference.mjs"
      - "scripts/tests/imf-oecd-native-period.test.mjs"
      - "scripts/ops/verify-imf-oecd-native-period.mjs"
      - ".github/workflows/imf-oecd-native-period.yml"
  push:
    branches: [main]
    paths:
      - "global-intelligence/adapters/imf-sdmx.mjs"
      - "global-intelligence/adapters/imf-oecd-exact-reference.mjs"
      - "scripts/tests/imf-oecd-native-period.test.mjs"
      - "scripts/ops/verify-imf-oecd-native-period.mjs"
      - ".github/workflows/imf-oecd-native-period.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"
permissions:
  contents: read
concurrency:
  group: imf-oecd-native-period-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: |
          set -euo pipefail
          node --check global-intelligence/adapters/imf-sdmx.mjs
          node --check global-intelligence/adapters/imf-oecd-exact-reference.mjs
          node --test scripts/tests/imf-oecd-native-period.test.mjs
  real-source-read:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verified-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: node scripts/ops/verify-imf-oecd-native-period.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: imf-oecd-native-period-${{ github.run_id }}
          path: artifacts/imf-oecd-reference/receipt.json
          retention-days: 7
          if-no-files-found: warn
