name: B2 country GRO continuity

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/b2-country-gro-continuity.yml"
      - "scripts/ops/publish-b2-country-gro-continuity.ts"
      - "scripts/ops/verify-b2-country-gro-direct-read.ts"
      - "scripts/ops/sync-current-country-gro-to-d1.ts"
      - "scripts/publish-country-risk-object.ts"
      - "scripts/lib/gri-db-client.mjs"
      - "scripts/lib/direct-postgres-supabase-loader.mjs"
      - "src/lib/b2-country-gro.server.ts"
      - "src/lib/country-gro-resolver.server.ts"
      - "src/lib/agent-query-external-modules.server.ts"
      - "src/lib/risk-gate-service.server.ts"
      - "src/lib/country-risk-publisher.server.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-b2-country-gro-continuity
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      GRO_CONTINUITY_COUNTRY_ISO3: USA
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify authoritative direct PostgreSQL source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/db/assert-authoritative-supabase.mjs
          test -n "${SUPABASE_DB_URL:-}"
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const { data, error } = await db
            .from('live_country_registry')
            .select('iso3,enabled')
            .eq('iso3', process.env.GRO_CONTINUITY_COUNTRY_ISO3)
            .eq('enabled', true)
            .maybeSingle();
          if (error) throw new Error(error.message);
          if (!data || data.iso3 !== process.env.GRO_CONTINUITY_COUNTRY_ISO3 || data.enabled !== true) {
            throw new Error('GRO_CONTINUITY_COUNTRY_NOT_ENABLED');
          }
          console.log(JSON.stringify({ ok: true, transport: 'direct_postgres', country_iso3: data.iso3 }));
          NODE
      - name: Refresh one bounded commercially verified canonical GRO
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/publish-country-risk-object.ts USA CANONICAL | tee /tmp/current-country-gro.json
          jq -e '
            .delivery_profile == "CANONICAL"
            and .subject.type == "country"
            and .subject.id == "USA"
            and .verification.status == "VERIFIED"
            and .commercial_eligibility.status == "VERIFIED"
            and .integrity.signature_valid == true
          ' /tmp/current-country-gro.json >/dev/null
      - name: Publish current verified canonical country GROs to private B2
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        run: node --import tsx scripts/ops/publish-b2-country-gro-continuity.ts
      - name: Prove runtime GRO read works after removing Supabase credentials
        run: bun scripts/ops/verify-b2-country-gro-direct-read.ts
      - name: Sync independently verified current country GRO to D1
        run: bun scripts/ops/sync-current-country-gro-to-d1.ts
