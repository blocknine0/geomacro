name: B2 country GRO continuity

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/b2-country-gro-continuity.yml"
      - "scripts/ops/publish-b2-country-gro-continuity.ts"
      - "scripts/ops/verify-b2-country-gro-direct-read.ts"
      - "src/lib/b2-country-gro.server.ts"
      - "src/lib/country-gro-resolver.server.ts"
      - "src/lib/agent-query-external-modules.server.ts"
      - "src/lib/risk-gate-service.server.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-b2-country-gro-continuity
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify authoritative Supabase source
        run: node scripts/db/assert-authoritative-supabase.mjs
      - name: Publish current verified canonical country GROs to private B2
        run: bun scripts/ops/publish-b2-country-gro-continuity.ts
      - name: Prove runtime GRO read works after removing Supabase credentials
        run: bun scripts/ops/verify-b2-country-gro-direct-read.ts
