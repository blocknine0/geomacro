name: B2 country GRO continuity

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}
  # The final commercial gate is exact-head and may start immediately after a
  # canonical merge. Refresh the full country-like commercial subject universe
  # on every main advance so B2/D1 serving does not collapse to a single USA
  # object. The hourly schedule remains the steady-state freshness owner.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geomacro-b2-country-gro-continuity
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ARCHIVE_WRITE_KEY_ID: ${{ secrets.B2_ARCHIVE_WRITE_KEY_ID }}
      B2_ARCHIVE_WRITE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_WRITE_APPLICATION_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      GLOBAL_CANONICAL_REFRESH_OUTPUT: artifacts/global-gro-continuity/canonical-risk-objects.json
      GLOBAL_CANONICAL_MIN_COUNTRY_LIKE_DENOMINATOR: "195"
      GLOBAL_CANONICAL_MIN_READY: "195"
      GLOBAL_GRO_D1_MIN_INDEXED: "195"
      GRO_CONTINUITY_COUNTRY_ISO3: USA
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify authoritative direct PostgreSQL source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/db/assert-authoritative-supabase.mjs
          test -n "${SUPABASE_DB_URL:-}"
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const { data, error } = await db
            .from('live_country_registry')
            .select('iso3,enabled')
            .eq('enabled', true)
            .order('iso3', { ascending: true });
          if (error) throw new Error(error.message);
          const enabled = (data ?? []).filter((row) => /^[A-Z]{3}$/.test(String(row.iso3 ?? '')));
          if (enabled.length < 195) throw new Error(`GRO_CONTINUITY_COUNTRY_UNIVERSE_REGRESSION:${enabled.length}`);
          console.log(JSON.stringify({ ok: true, transport: 'direct_postgres', enabled_country_like_candidates: enabled.length }));
          NODE

      - name: Check whether verified D1 country GRO hot serving already exists
        id: hot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/global-gro-continuity
          set +e
          bun scripts/ops/verify-country-gro-hot-serving.ts             > artifacts/global-gro-continuity/pre-refresh-hot-canary.json             2> artifacts/global-gro-continuity/pre-refresh-hot-canary.err
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] && jq -e '
            .ok == true
            and .serving_store == "cloudflare-d1"
            and .archive_store == "backblaze-b2"
            and .b2_network_read_required == false
            and .signature_valid == true
            and .commercial_eligibility_verified == true
          ' artifacts/global-gro-continuity/pre-refresh-hot-canary.json >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "PASS: verified D1 country GRO hot serving already exists; no pre-refresh archive write needed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Verified D1 hot set is absent or expired; bounded seed will run from current VERIFIED DB objects."
          fi

      - name: Seed existing VERIFIED current GROs before the long global refresh
        id: seed
        if: steps.hot.outputs.ready != 'true'
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
          GLOBAL_GRO_D1_MIN_INDEXED: "1"
          COUNTRY_GRO_HOT_PUBLISH_OUTPUT: artifacts/global-gro-continuity/country-gro-hot-seed.json
          B2_REQUEST_BUDGET: "8"
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --import tsx scripts/ops/publish-country-gro-hot-bundle.ts             > artifacts/global-gro-continuity/country-gro-hot-seed.stdout.json             2> artifacts/global-gro-continuity/country-gro-hot-seed.err
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            if grep -q 'COUNTRY_GRO_HOT_READY_FLOOR_BREACH:0<1' artifacts/global-gro-continuity/country-gro-hot-seed.err; then
              echo "seeded=false" >> "$GITHUB_OUTPUT"
              echo "No pre-existing current VERIFIED GRO is available; continue to fresh generation without inventing a hot object."
            else
              cat artifacts/global-gro-continuity/country-gro-hot-seed.err
              exit "$rc"
            fi
          else
            jq -e '
              .ok == true
              and .country_count >= 1
              and .minimum_required == 1
              and .global_195_coverage_claimed == false
              and .only_verified_current_objects_admitted == true
              and .b2_bundle_put_acknowledged == true
              and .b2_manifest_put_acknowledged == true
              and .b2_get_count_for_hot_serving == 0
              and .d1_signed_gro_hot_verified == true
              and .d1_readback_verified == true
              and .signature_verified == true
              and .commercial_eligibility_verified == true
              and .raw_source_material_emitted == false
              and .external_payment_performed == false
              and .execution_authorized == false
              and .destructive_b2_change == false
            ' artifacts/global-gro-continuity/country-gro-hot-seed.json >/dev/null
            echo "seeded=true" >> "$GITHUB_OUTPUT"
            echo "PASS: seeded only existing current VERIFIED commercial GROs; this does not claim 195-country coverage."
          fi

      - name: Refresh global commercially governed canonical GROs
        id: refresh
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/global-gro-continuity
          set +e
          node --import tsx scripts/refresh-global-canonical-risk-objects.ts
          refresh_status=$?
          set -e
          test -f "$GLOBAL_CANONICAL_REFRESH_OUTPUT"
          jq -e '
            .schema_version == "geomacro-global-canonical-refresh-v1"
            and .denominator.type == "enabled_country_like_entities"
            and .denominator.count >= 195
            and .denominator.sovereign_count >= 194
            and .denominator.special_country_like_count == 2
            and (.denominator.special_country_like_iso3 | sort) == ["PSE","TWN"]
            and .boundaries.all_enabled_country_like_subjects_evaluated == true
            and .boundaries.payment_not_performed_by_refresh == true
            and .boundaries.raw_source_material_emitted == false
            and .boundaries.execution_authorized == false
          ' "$GLOBAL_CANONICAL_REFRESH_OUTPUT" >/dev/null
          ready="$(jq -r '.summary.paid_ready_country_count // 0' "$GLOBAL_CANONICAL_REFRESH_OUTPUT")"
          echo "ready_count=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" -gt 0 ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$refresh_status" -eq 0 ] && [ "$ready" -ge 195 ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "coverage_floor_met=true" >> "$GITHUB_OUTPUT"
            echo "PASS: global canonical refresh produced ${ready} commercially deliverable country-like GROs."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "coverage_floor_met=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Global commercial GRO floor not met::Ready=${ready}; required=195; refresh_status=${refresh_status}. VERIFIED countries may be hot-served individually, but the 195-country launch gate remains fail-closed."
          fi

      - name: Publish all currently VERIFIED GROs after refresh
        if: steps.refresh.outputs.publishable == 'true'
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
          GLOBAL_GRO_D1_MIN_INDEXED: "1"
          COUNTRY_GRO_HOT_PUBLISH_OUTPUT: artifacts/global-gro-continuity/country-gro-hot-publish.json
          B2_REQUEST_BUDGET: "8"
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/ops/publish-country-gro-hot-bundle.ts | tee artifacts/global-gro-continuity/country-gro-hot-publish.stdout.json
          jq -e '
            .ok == true
            and .country_count >= 1
            and .minimum_required == 1
            and .global_195_coverage_claimed == false
            and .only_verified_current_objects_admitted == true
            and .b2_bundle_put_acknowledged == true
            and .b2_manifest_put_acknowledged == true
            and .b2_put_count == 2
            and .b2_get_count_for_hot_serving == 0
            and .archive_readback_deferred == true
            and .archive_readback_required_for_hot_serving == false
            and .d1_signed_gro_hot_verified == true
            and .d1_readback_verified == true
            and .signature_verified == true
            and .commercial_eligibility_verified == true
            and .raw_source_material_emitted == false
            and .external_payment_performed == false
            and .execution_authorized == false
            and .destructive_b2_change == false
          ' artifacts/global-gro-continuity/country-gro-hot-publish.stdout.json >/dev/null
          published="$(jq -r '.country_count' artifacts/global-gro-continuity/country-gro-hot-publish.json)"
          ready="${{ steps.refresh.outputs.ready_count }}"
          test "$published" -ge "${ready:-0}" || {
            echo "::error::Verified hot publish count ${published} is below fresh paid-ready count ${ready:-0}."
            exit 2
          }
          echo "PASS: published ${published} current VERIFIED GROs to D1 hot state; 195-country coverage is evaluated separately."

      - name: Audit bundled B2 cold archive when read capacity is available
        if: steps.refresh.outputs.publishable == 'true'
        env:
          B2_REQUEST_BUDGET: "4"
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bun scripts/ops/verify-country-gro-cold-bundle.ts > artifacts/global-gro-continuity/cold-archive-audit.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            cat artifacts/global-gro-continuity/cold-archive-audit.log
            exit 0
          fi
          if grep -q 'B2_DOWNLOAD_CAP_EXCEEDED' artifacts/global-gro-continuity/cold-archive-audit.log; then
            echo "::warning title=B2 cold archive audit deferred::Download cap is exhausted. Verified D1 hot serving remains available; no archive data is deleted or reclassified."
            cat > artifacts/global-gro-continuity/cold-archive-audit-deferred.json <<'JSON'
          {"ok":true,"schema":"geomacro.country-gro-cold-archive-audit-deferred.v1","reason":"B2_DOWNLOAD_CAP_EXCEEDED","hot_serving_blocked":false,"archive_readback_verified":false,"destructive_b2_change":false}
          JSON
            exit 0
          fi
          cat artifacts/global-gro-continuity/cold-archive-audit.log
          exit "$rc"

      - name: Upload global GRO continuity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-gro-continuity-${{ github.run_id }}
          path: artifacts/global-gro-continuity/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce #1414 195+ commercial GRO floor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ready="${{ steps.refresh.outputs.ready_count }}"
          if [ "${ready:-0}" -lt 195 ]; then
            echo "::error title=#1414 country GRO coverage incomplete::Only ${ready:-0} country-like subjects are commercially deliverable; 195 are required. Existing VERIFIED countries remain individually hot-servable, but this workflow stays red."
            exit 1
          fi
          test "${{ steps.refresh.outputs.coverage_floor_met }}" = "true"
          test -f artifacts/global-gro-continuity/country-gro-hot-publish.json
          jq -e '.ok == true and .country_count >= 195 and .d1_signed_gro_hot_verified == true and .b2_get_count_for_hot_serving == 0 and .global_195_coverage_claimed == false' artifacts/global-gro-continuity/country-gro-hot-publish.json >/dev/null
