name: Apply Critical Minerals Agent Wiring

on:
  push:
    branches:
      - feat/agent-critical-minerals-derived-serving
    paths:
      - ".github/workflows/apply-critical-minerals-agent-wiring.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/agent-critical-minerals-derived-serving
          fetch-depth: 0

      - name: Wire derived critical-minerals serving
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}")
              p.write_text(text.replace(old, new, 1))

          deliverability = "src/lib/agent-query-deliverability.server.ts"
          replace_once(
              deliverability,
              '''import {\n  AGENT_WORLD_BANK_SOURCE_ID,\n  loadAgentWorldBankModule,\n  type AgentWorldBankModuleName,\n} from "./agent-query-world-bank-modules.server";\n''',
              '''import {\n  AGENT_WORLD_BANK_SOURCE_ID,\n  loadAgentWorldBankModule,\n  type AgentWorldBankModuleName,\n} from "./agent-query-world-bank-modules.server";\nimport {\n  AGENT_CRITICAL_MINERALS_SOURCE_ID,\n  loadAgentCriticalMineralsModule,\n} from "./agent-query-critical-minerals.server";\n''',
          )
          replace_once(
              deliverability,
              '''    const governedFallbackModules = new Set<string>();\n    const governedFallbackSourceIds = new Set<string>();\n    let latestEvidence: number | null = null;\n''',
              '''    const governedFallbackModules = new Set<string>();\n    const governedFallbackSourceIds = new Set<string>();\n    const governedDerivedFallbackSourceIds = new Set<string>();\n    let latestEvidence: number | null = null;\n''',
          )
          critical_block = '''\n      if (module === "critical_minerals") {\n        let fallback: Awaited<ReturnType<typeof loadAgentCriticalMineralsModule>> | null = null;\n        try {\n          fallback = await loadAgentCriticalMineralsModule({\n            subject,\n            as_of: asOf,\n            max_age_seconds: plan.module_max_age_seconds[module],\n          });\n        } catch {\n          // Derived critical-minerals evidence never broadens delivery when the\n          // governed source store is unavailable.\n          fallback = null;\n        }\n        if (fallback?.deliverable && fallback.state && fallback.source_contract) {\n          available.add(module);\n          governedFallbackModules.add(module);\n          governedDerivedFallbackSourceIds.add(AGENT_CRITICAL_MINERALS_SOURCE_ID);\n          sourceContracts.set(AGENT_CRITICAL_MINERALS_SOURCE_ID, {\n            source_id: AGENT_CRITICAL_MINERALS_SOURCE_ID,\n            commercial_usage_status: fallback.source_contract.commercial_usage_status,\n            raw_redistribution_allowed: fallback.source_contract.raw_redistribution_allowed,\n            attribution_required: fallback.source_contract.attribution_required,\n            licence_name: fallback.source_contract.licence_name,\n          });\n          const fallbackTime = fallback.source_observed_at\n            ? Date.parse(fallback.source_observed_at)\n            : Number.NaN;\n          if (Number.isFinite(fallbackTime)) {\n            latestEvidence =\n              latestEvidence === null\n                ? fallbackTime\n                : Math.max(latestEvidence, fallbackTime);\n          }\n          continue;\n        }\n        if (fallback?.code === "SOURCE_NOT_ELIGIBLE") {\n          ineligibleSources.add(AGENT_CRITICAL_MINERALS_SOURCE_ID);\n          continue;\n        }\n        if (fallback?.code === "OBSERVATION_STALE") {\n          stale.add(module);\n          continue;\n        }\n      }\n\n'''
          replace_once(
              deliverability,
              '''      if (context.status !== "AVAILABLE" || !available.has(module)) {\n''',
              critical_block + '''      if (context.status !== "AVAILABLE" || !available.has(module)) {\n''',
          )
          replace_once(
              deliverability,
              '''    const sourceIds = [\n      ...new Set([\n        ...requiredSourceIds(context, [...structuralModulesUsed]),\n        ...governedFallbackSourceIds,\n      ]),\n    ].sort();\n\n    if (sourceIds.length > 0) {\n      const sourceEligibility = await sourceChecker(sourceIds);\n''',
              '''    const rawSourceIds = [\n      ...new Set([\n        ...requiredSourceIds(context, [...structuralModulesUsed]),\n        ...governedFallbackSourceIds,\n      ]),\n    ].sort();\n    const sourceIds = [\n      ...new Set([...rawSourceIds, ...governedDerivedFallbackSourceIds]),\n    ].sort();\n\n    if (rawSourceIds.length > 0) {\n      const sourceEligibility = await sourceChecker(rawSourceIds);\n''',
          )
          replace_once(
              deliverability,
              '''    } else if (\n      requiredStructural.length > 0 &&\n      !requiredStructural.every((module) => missing.has(module) || stale.has(module))\n    ) {\n''',
              '''    } else if (\n      requiredStructural.length > 0 &&\n      governedFallbackModules.size === 0 &&\n      !requiredStructural.every((module) => missing.has(module) || stale.has(module))\n    ) {\n''',
          )

          response = "src/lib/agent-query-response.server.ts"
          replace_once(
              response,
              '''import { loadAgentPoliticalGovernanceModule } from "./agent-query-political-governance.server";\n''',
              '''import { loadAgentPoliticalGovernanceModule } from "./agent-query-political-governance.server";\nimport { loadAgentCriticalMineralsModule } from "./agent-query-critical-minerals.server";\n''',
          )
          response_block = '''\n    if (module === "critical_minerals" && !structuralFresh) {\n      const fallback = await loadAgentCriticalMineralsModule({\n        subject,\n        as_of: asOf,\n        max_age_seconds: maxAgeSeconds,\n      });\n      if (!fallback.deliverable || !fallback.state || !fallback.source_contract) {\n        throw new Error(`CRITICAL_MINERALS_NOT_DELIVERABLE:${fallback.code}`);\n      }\n      governedFallbackHashes.push(...fallback.source_normalized_hashes);\n      governedFallbackDimensions.add(module);\n      if (fallback.source_observed_at) governedFallbackTimes.push(fallback.source_observed_at);\n      intelligence[module] = {\n        delivery: "GOVERNED_USGS_CRITICAL_MINERALS_EVIDENCE",\n        source_id: fallback.source_id,\n        source_observed_at: fallback.source_observed_at,\n        source_contract: fallback.source_contract,\n        state: fallback.state,\n        limitations: {\n          derived_evidence_only: true,\n          raw_numeric_source_rows_redistributed: false,\n          risk_score_produced: false,\n          methodology_scope: fallback.state.methodology_version,\n        },\n      };\n      continue;\n    }\n\n'''
          replace_once(
              response,
              '''    if (context.status !== "AVAILABLE") {\n      throw new Error("STRUCTURAL_CONTEXT_NOT_DELIVERABLE");\n    }\n''',
              response_block + '''    if (context.status !== "AVAILABLE") {\n      throw new Error("STRUCTURAL_CONTEXT_NOT_DELIVERABLE");\n    }\n''',
          )

          test = Path("src/__tests__/agent-query-critical-minerals-derived-serving-static.test.ts")
          test.write_text('''import fs from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst loader = fs.readFileSync("src/lib/agent-query-critical-minerals.server.ts", "utf8");\nconst availability = fs.readFileSync("src/lib/agent-query-deliverability.server.ts", "utf8");\nconst response = fs.readFileSync("src/lib/agent-query-response.server.ts", "utf8");\n\ndescribe("critical-minerals adaptive derived serving", () => {\n  it("keeps the USGS customer boundary derived-only", () => {\n    expect(loader).toContain('delivery_boundary: "DERIVED_ONLY"');\n    expect(loader).toContain("raw_payload_allowed: false");\n    expect(loader).not.toContain("value_numeric");\n    expect(response).toContain("raw_numeric_source_rows_redistributed: false");\n    expect(response).toContain("risk_score_produced: false");\n  });\n\n  it("uses the same governed loader for availability and response", () => {\n    expect(availability).toContain("loadAgentCriticalMineralsModule");\n    expect(response).toContain("loadAgentCriticalMineralsModule");\n    expect(availability).toContain("governedDerivedFallbackSourceIds");\n    expect(response).toContain("GOVERNED_USGS_CRITICAL_MINERALS_EVIDENCE");\n  });\n\n  it("does not send derived-only USGS through the raw redistribution checker", () => {\n    expect(availability).toContain("const rawSourceIds");\n    expect(availability).toContain("sourceChecker(rawSourceIds)");\n    expect(availability).toContain("...governedDerivedFallbackSourceIds");\n  });\n});\n''')
          PY

      - name: Remove one-time wiring workflow
        run: git rm .github/workflows/apply-critical-minerals-agent-wiring.yml

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agent-query-deliverability.server.ts src/lib/agent-query-response.server.ts src/__tests__/agent-query-critical-minerals-derived-serving-static.test.ts
          git commit -m "Wire derived critical minerals into adaptive agent serving"
          git push origin HEAD:feat/agent-critical-minerals-derived-serving
