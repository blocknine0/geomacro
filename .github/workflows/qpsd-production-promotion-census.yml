name: QPSD Production Promotion Census

on:
  pull_request:
    paths:
      - "scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs"
      - "src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.ts"
      - "src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.server.ts"
      - "src/lib/risk-gate-v2-macro-module-state.server.ts"
      - "src/__tests__/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.test.ts"
      - "src/__tests__/risk-gate-v2-world-bank-qpsd-production-static.test.ts"
      - "supabase/migrations/938_world_bank_qpsd_production_source.sql"
      - "scripts/commercial-source-rights-evidence.mjs"
      - "scripts/global-risk-gate-country-census.ts"
      - ".github/workflows/qpsd-production-promotion-census.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qpsd-production-promotion-census-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate fail-closed QPSD production contract
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/938_world_bank_qpsd_production_source.sql
          test -s scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs
          test -s src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.server.ts
          grep -q "world_bank_qpsd" scripts/commercial-source-rights-evidence.mjs
          grep -q "DP.DOD.DECT.CR.GG.Z1" scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs
          grep -q "DP.DOD.DECT.CR.CG.Z1" scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs
          grep -q "cross_concept_peer_pooling_allowed: false" scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs
          grep -q "raw_cross_source_value_pooling_allowed: false" scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs
          grep -q "live_world_bank_qpsd_latest" src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.server.ts
          grep -q "generateRiskGateV2WorldBankQpsdSovereignFiscalModuleState" src/lib/risk-gate-v2-macro-module-state.server.ts
          grep -q "enabled_for_commercial_signals = excluded.enabled_for_commercial_signals" supabase/migrations/938_world_bank_qpsd_production_source.sql
          if grep -q "I_ACCEPT_REAL_USDC" scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.server.ts supabase/migrations/938_world_bank_qpsd_production_source.sql; then
            echo "::error title=Launch-gate boundary violated::QPSD data promotion must not activate Base mainnet payments."
            exit 1
          fi

      - name: Run QPSD unit and production-contract tests
        run: >-
          bunx vitest run
          src/__tests__/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.test.ts
          src/__tests__/risk-gate-v2-world-bank-qpsd-production-static.test.ts

  promote-and-census:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORLD_BANK_QPSD_BULK_CSV: qpsd-bulk/QPSDCSV.csv
      WORLD_BANK_QPSD_PRODUCTION_MAX_AGE_DAYS: "550"
      GLOBAL_RISK_GATE_CENSUS_OUTPUT: qpsd-production-global-country-census.json
      GLOBAL_RISK_GATE_CENSUS_CONCURRENCY: "3"
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative production target
        run: node scripts/db/assert-authoritative-supabase.mjs

      - name: Verify QPSD migration is applied and scoring is locked
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
          const source = await db.from('live_external_sources').select('source_id,enabled_for_ingestion,enabled_for_commercial_signals,commercial_usage_status,licence_name').eq('source_id', 'world_bank_qpsd').maybeSingle();
          if (source.error) throw source.error;
          if (!source.data || source.data.enabled_for_ingestion !== true || source.data.commercial_usage_status !== 'COMMERCIAL_OK' || source.data.licence_name !== 'CC BY 4.0') {
            throw new Error('Migration 938 is not applied to the authoritative production database. Apply production migrations first.');
          }
          if (source.data.enabled_for_commercial_signals !== false) {
            throw new Error('QPSD commercial signals are already enabled. Refusing first-promotion workflow because activation ownership is ambiguous.');
          }
          console.log('PASS: QPSD source is registered for governed ingestion and remains scoring-locked.');
          NODE

      - name: Download official QPSD bulk CSV
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qpsd-bulk qpsd-bulk.zip
          mkdir -p qpsd-bulk
          curl --fail --show-error --silent --location --retry 3 \
            'https://databank.worldbank.org/data/download/QPSD_CSV.zip' \
            --output qpsd-bulk.zip
          unzip -q qpsd-bulk.zip -d qpsd-bulk
          test -s "$WORLD_BANK_QPSD_BULK_CSV"
          sha256sum qpsd-bulk.zip | tee qpsd-bulk-download.sha256

      - name: Ingest and verify fresh QPSD while scoring stays locked
        id: ingest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ingest-world-bank-qpsd-sovereign-fiscal-live.mjs | tee qpsd-production-ingest.log
          grep -q 'PASS: WORLD BANK QPSD GOVERNED PRODUCTION INGEST COMPLETE' qpsd-production-ingest.log
          grep -q '"source_commercial_signals_enabled_during_ingest": false' qpsd-production-ingest.log
          grep -q '"production_scoring_changed_by_ingest": false' qpsd-production-ingest.log
          grep -q '"base_mainnet_gate_changed": false' qpsd-production-ingest.log

      - name: Enable QPSD as a reversible production candidate
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
          const updated = await db.from('live_external_sources')
            .update({ enabled_for_commercial_signals: true, updated_at: new Date().toISOString() })
            .eq('source_id', 'world_bank_qpsd')
            .eq('commercial_usage_status', 'COMMERCIAL_OK')
            .eq('enabled_for_ingestion', true)
            .eq('enabled_for_commercial_signals', false)
            .select('source_id,enabled_for_commercial_signals');
          if (updated.error) throw updated.error;
          if ((updated.data ?? []).length !== 1 || updated.data[0].enabled_for_commercial_signals !== true) {
            throw new Error('QPSD candidate promotion compare-and-set failed; no census will run.');
          }
          console.log('PASS: QPSD candidate scoring enabled for controlled production census.');
          NODE

      - name: Run full four-module production country census
        id: census
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/global-risk-gate-country-census.ts --require-any-accepted | tee qpsd-production-global-country-census.log
          test -s "$GLOBAL_RISK_GATE_CENSUS_OUTPUT"

      - name: Enforce 100-plus accepted countries and QPSD contribution
        id: enforce
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.denominator.type == "enabled_sovereign_countries"' "$GLOBAL_RISK_GATE_CENSUS_OUTPUT" >/dev/null
          jq -e '.summary.accepted_country_count >= 100' "$GLOBAL_RISK_GATE_CENSUS_OUTPUT" >/dev/null
          jq -e '.claim_boundary.missing_or_unverified_input_fails_closed == true' "$GLOBAL_RISK_GATE_CENSUS_OUTPUT" >/dev/null
          jq -e '.claim_boundary.execution_authorized_is_false == true' "$GLOBAL_RISK_GATE_CENSUS_OUTPUT" >/dev/null
          jq -e '[.countries[] | select(.status == "ACCEPTED") | .risk_gate.execution_authorized] | all(. == false)' "$GLOBAL_RISK_GATE_CENSUS_OUTPUT" >/dev/null
          jq -e '[.countries[] | select(.status == "ACCEPTED") | .module_states[] | select(.module == "sovereign_fiscal" and (.methodology_version | startswith("risk-gate-v2-sovereign-fiscal-world-bank-qpsd-source-specific-")))] | length >= 1' "$GLOBAL_RISK_GATE_CENSUS_OUTPUT" >/dev/null
          jq '{generated_at,denominator,summary,claim_boundary}' "$GLOBAL_RISK_GATE_CENSUS_OUTPUT" | tee qpsd-production-promotion-summary.json
          echo 'PASS: QPSD PROMOTION PRESERVES >=100 PRODUCTION-READY COUNTRIES WITH FAIL-CLOSED GATES'

      - name: Verify successful QPSD promotion remains active
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
          const source = await db.from('live_external_sources').select('enabled_for_commercial_signals').eq('source_id', 'world_bank_qpsd').single();
          if (source.error) throw source.error;
          if (source.data.enabled_for_commercial_signals !== true) throw new Error('QPSD promotion unexpectedly inactive after passing census');
          console.log('PASS: QPSD production source remains active after >=100-country acceptance proof.');
          NODE

      - name: Roll back QPSD candidate on any failed promotion gate
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
          const rolled = await db.from('live_external_sources')
            .update({ enabled_for_commercial_signals: false, updated_at: new Date().toISOString() })
            .eq('source_id', 'world_bank_qpsd')
            .eq('enabled_for_commercial_signals', true)
            .select('source_id,enabled_for_commercial_signals');
          if (rolled.error) throw rolled.error;
          if ((rolled.data ?? []).length !== 1 || rolled.data[0].enabled_for_commercial_signals !== false) {
            throw new Error('CRITICAL: QPSD promotion failed and automatic rollback did not confirm the source lock.');
          }
          console.log('PASS: Failed QPSD promotion was rolled back to scoring-disabled state.');
          NODE

      - name: Upload sanitized QPSD production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qpsd-production-promotion-census
          path: |
            qpsd-bulk-download.sha256
            qpsd-production-ingest.log
            qpsd-production-global-country-census.json
            qpsd-production-global-country-census.log
            qpsd-production-promotion-summary.json
          if-no-files-found: warn
          retention-days: 30
