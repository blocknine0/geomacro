name: One-time fix GDELT transient timeout recovery

on:
  push:
    branches: [fix/gdelt-transient-timeout-recovery]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/gdelt-transient-timeout-recovery
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Patch GDELT timeout handling
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/sync-gdelt-gal-production.mjs")
          t = p.read_text()
          t = t.replace(
            'const UPSTREAM_FETCH_TIMEOUT_SECONDS = 8;',
            'const UPSTREAM_FETCH_TIMEOUT_SECONDS = Math.max(8, Math.min(60, Number(process.env.GDELT_GAL_FETCH_TIMEOUT_SECONDS ?? 20)));'
          )
          anchor = '''      const probeResults = await Promise.allSettled(\n        probeStamps.map((stamp) => fetchGalFile(stamp)),\n      );\n\n      for (const result of probeResults) {\n'''
          replacement = '''      const probeResults = await Promise.allSettled(\n        probeStamps.map((stamp) => fetchGalFile(stamp)),\n      );\n\n      const rejectedProbes = probeResults.filter((result) => result.status === "rejected");\n      if (probeStamps.length > 0 && rejectedProbes.length === probeResults.length) {\n        const reasons = rejectedProbes\n          .map((result) => result.reason instanceof Error ? result.reason.message : String(result.reason))\n          .slice(0, 3);\n        throw new Error(`GDELT_UPSTREAM_FETCH: all ${probeResults.length} probes failed: ${reasons.join(" | ")}`);\n      }\n\n      for (const result of probeResults) {\n'''
          if anchor not in t:
              raise SystemExit("probe anchor missing")
          t = t.replace(anchor, replacement, 1)
          p.write_text(t)

          p = Path("scripts/run-gdelt-gal-cycle.mjs")
          t = p.read_text()
          old = '''function syncFailureIsRetryable(payload) {\n  const failureClass = String(payload?.failure_class ?? "");\n  const status = String(payload?.status ?? "");\n  return failureClass === "UPSTREAM_TEMPORARY_OUTAGE"\n    || failureClass === "UPSTREAM_SOURCE_DELAYED"\n    || status === "no_new_gdelt_file";\n}\n'''
          new = '''function syncFailureIsRetryable(payload, result = null) {\n  const failureClass = String(payload?.failure_class ?? "");\n  const status = String(payload?.status ?? "");\n  const transportText = `${result?.stdout ?? ""}\\n${result?.stderr ?? ""}`;\n  return failureClass === "UPSTREAM_TEMPORARY_OUTAGE"\n    || failureClass === "UPSTREAM_SOURCE_DELAYED"\n    || status === "no_new_gdelt_file"\n    || /GDELT_(?:UPSTREAM_FETCH|REQUEST_FAILED)|aborted due to timeout|AbortError|TimeoutError/i.test(transportText);\n}\n'''
          if old not in t:
              raise SystemExit("retry function anchor missing")
          t = t.replace(old, new, 1)
          t = t.replace('syncFailureIsRetryable(sync.payload)', 'syncFailureIsRetryable(sync.payload, sync.result)')
          t = t.replace('syncFailureIsRetryable(syncPayload)', 'syncFailureIsRetryable(syncPayload, sync?.result)')
          p.write_text(t)
      - name: Validate syntax and contracts
        run: |
          node --check scripts/sync-gdelt-gal-production.mjs
          node --check scripts/run-gdelt-gal-cycle.mjs
          grep -q 'GDELT_GAL_FETCH_TIMEOUT_SECONDS' scripts/sync-gdelt-gal-production.mjs
          grep -q 'all .* probes failed' scripts/sync-gdelt-gal-production.mjs
          grep -q 'aborted due to timeout' scripts/run-gdelt-gal-cycle.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/sync-gdelt-gal-production.mjs scripts/run-gdelt-gal-cycle.mjs
          git commit -m "Recover from transient GDELT probe timeouts"
          git push origin HEAD:fix/gdelt-transient-timeout-recovery
