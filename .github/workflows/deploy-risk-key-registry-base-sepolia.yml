name: Deploy Base Sepolia Risk Key Registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-risk-key-registry-base-sepolia.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-risk-key-registry-base-sepolia
  cancel-in-progress: false

jobs:
  deploy-and-anchor:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: geomacro-testnet-e2e
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      RISK_OBJECT_SIGNING_KEY_ID: geomacro-risk-2026-02
      RISK_OBJECT_JWKS_URI: https://geomacro.live/.well-known/jwks.json

    steps:
      - name: Checkout canonical main with Foundry dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate registry contract before broadcast
        run: forge test --match-path test/RiskKeyRegistry.t.sol

      - name: Validate required signing and deployment material
        env:
          SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
          OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SIGNING_PRIVATE_KEY_PKCS8_B64:-}" || { echo '::error::Risk Object signing key is not configured.'; exit 1; }
          test -n "${OWNER_PRIVATE_KEY:-}" || { echo '::error::OWNER_PRIVATE_KEY is not configured.'; exit 1; }

      - name: Ensure owner wallet has Base Sepolia gas
        id: gas
        env:
          OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER_ADDRESS="$(cast wallet address --private-key "$OWNER_PRIVATE_KEY")"
          BALANCE_WEI="$(cast balance "$OWNER_ADDRESS" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          echo "Owner wallet: $OWNER_ADDRESS"
          echo "Base Sepolia ETH before bootstrap (wei): $BALANCE_WEI"
          echo "owner_address=$OWNER_ADDRESS" >> "$GITHUB_OUTPUT"

          if [ "$BALANCE_WEI" != "0" ]; then
            echo "provider=existing_balance" >> "$GITHUB_OUTPUT"
            echo "balance_wei=$BALANCE_WEI" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS_FILE="$RUNNER_TEMP/a2awire-faucet-status.json"
          ONBOARD_FILE="$RUNNER_TEMP/a2awire-onboard.json"
          DRIP_FILE="$RUNNER_TEMP/a2awire-drip.json"
          umask 077

          curl -fsS https://a2awire.com/api/v1/faucet/status -o "$STATUS_FILE"
          if [ "$(jq -r '.enabled // false' "$STATUS_FILE")" != "true" ]; then
            echo '::error::A2AWire Base Sepolia faucet is not enabled.'
            rm -f "$STATUS_FILE" "$ONBOARD_FILE" "$DRIP_FILE"
            exit 1
          fi

          ONBOARD_BODY="$(jq -nc --arg n "geomacro-risk-registry-${GITHUB_RUN_ID}" --arg a "$OWNER_ADDRESS" '{agent_name:$n,capabilities:["testnet-contract-deployment"],withdrawal_address:$a}')"
          curl -fsS -X POST https://a2awire.com/api/v1/onboard \
            -H 'Content-Type: application/json' \
            --data "$ONBOARD_BODY" \
            -o "$ONBOARD_FILE"

          A2A_KEY="$(jq -r '.api_key // empty' "$ONBOARD_FILE")"
          A2A_AGENT_ID="$(jq -r '.agent_id // empty' "$ONBOARD_FILE")"
          if [ -z "$A2A_KEY" ] || [ -z "$A2A_AGENT_ID" ]; then
            echo '::error::A2AWire onboarding did not return provisional agent credentials.'
            rm -f "$STATUS_FILE" "$ONBOARD_FILE" "$DRIP_FILE"
            exit 1
          fi

          cleanup_agent() {
            curl -sS -o /dev/null -X DELETE "https://a2awire.com/api/v1/agents/$A2A_AGENT_ID" \
              -H "X-API-Key: $A2A_KEY" || true
            rm -f "$STATUS_FILE" "$ONBOARD_FILE" "$DRIP_FILE"
          }
          trap cleanup_agent EXIT

          curl -fsS -X POST https://a2awire.com/api/v1/faucet/drip \
            -H "X-API-Key: $A2A_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg a "$OWNER_ADDRESS" '{address:$a}')" \
            -o "$DRIP_FILE"

          FAUCET_TX="$(jq -r '.tx_hash // empty' "$DRIP_FILE")"
          if ! [[ "$FAUCET_TX" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo '::error::A2AWire faucet did not return a valid Base Sepolia transaction hash.'
            exit 1
          fi

          echo "A2AWire Base Sepolia gas drip submitted: $FAUCET_TX"
          echo "provider=a2awire_ephemeral_agent" >> "$GITHUB_OUTPUT"
          echo "faucet_tx=$FAUCET_TX" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 45); do
            BALANCE_WEI="$(cast balance "$OWNER_ADDRESS" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
            if [ "$BALANCE_WEI" != "0" ]; then
              echo "Base Sepolia ETH after bootstrap (wei): $BALANCE_WEI"
              echo "balance_wei=$BALANCE_WEI" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

          echo '::error::Testnet faucet transaction was submitted but owner wallet still has zero Base Sepolia ETH.'
          exit 1

      - name: Derive current public Risk Object key locally
        env:
          SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const {createHash,createPrivateKey,createPublicKey}=require("node:crypto");const fs=require("node:fs");const raw=process.env.SIGNING_PRIVATE_KEY_PKCS8_B64?.trim();if(!raw)throw new Error("Risk Object signing private key is missing");const priv=createPrivateKey({key:Buffer.from(raw,"base64"),format:"der",type:"pkcs8"});if(priv.asymmetricKeyType!=="ed25519")throw new Error("Risk Object signing key must be Ed25519");const spki=Buffer.from(createPublicKey(priv).export({format:"der",type:"spki"}));fs.writeFileSync(process.env.RUNNER_TEMP+"/risk-object-public-spki.b64",spki.toString("base64"),{mode:0o600});fs.writeFileSync(process.env.RUNNER_TEMP+"/risk-object-public-fingerprint.txt",createHash("sha256").update(spki).digest("hex"),{mode:0o600});'

      - name: Deploy RiskKeyRegistry on Base Sepolia
        id: deploy
        env:
          PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          EXPECTED_DEPLOYER="${{ steps.gas.outputs.owner_address }}"
          if [ "${DEPLOYER,,}" != "${EXPECTED_DEPLOYER,,}" ]; then
            echo '::error::Deployment wallet does not match the funded owner wallet.'
            exit 1
          fi

          forge script script/DeployRiskKeyRegistry.s.sol:DeployRiskKeyRegistry \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --broadcast

          BROADCAST_JSON='broadcast/DeployRiskKeyRegistry.s.sol/84532/run-latest.json'
          test -f "$BROADCAST_JSON"
          REGISTRY="$(jq -r '.transactions[] | select(.contractName == "RiskKeyRegistry" and .contractAddress != null) | .contractAddress' "$BROADCAST_JSON" | head -n1)"
          DEPLOY_TX="$(jq -r '.transactions[] | select(.contractName == "RiskKeyRegistry" and .hash != null) | .hash' "$BROADCAST_JSON" | head -n1)"
          if ! [[ "$REGISTRY" =~ ^0x[0-9a-fA-F]{40}$ ]] || ! [[ "$DEPLOY_TX" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo '::error::Unable to resolve deployment evidence from Foundry broadcast.'
            exit 1
          fi
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "deployer=$DEPLOYER" >> "$GITHUB_OUTPUT"
          echo "deploy_tx=$DEPLOY_TX" >> "$GITHUB_OUTPUT"

      - name: Publish and activate current Ed25519 key hash
        id: publish
        env:
          PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
          RISK_KEY_REGISTRY_ADDRESS: ${{ steps.deploy.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          export RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64="$(cat "$RUNNER_TEMP/risk-object-public-spki.b64")"
          forge script script/PublishRiskKey.s.sol:PublishRiskKey \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --broadcast

          BROADCAST_JSON='broadcast/PublishRiskKey.s.sol/84532/run-latest.json'
          test -f "$BROADCAST_JSON"
          PUBLISH_TXS="$(jq -r '[.transactions[] | select(.hash != null) | .hash] | join(",")' "$BROADCAST_JSON")"
          PUBLIC_KEY_HASH="$(cast keccak "$RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64")"
          test -n "$PUBLISH_TXS"
          echo "publish_txs=$PUBLISH_TXS" >> "$GITHUB_OUTPUT"
          echo "public_key_hash=$PUBLIC_KEY_HASH" >> "$GITHUB_OUTPUT"

      - name: Verify deployed trust anchor independently
        env:
          REGISTRY: ${{ steps.deploy.outputs.registry }}
          EXPECTED_OWNER: ${{ steps.deploy.outputs.deployer }}
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(cast code "$REGISTRY" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          test -n "$CODE" && test "$CODE" != '0x'

          OWNER="$(cast call "$REGISTRY" 'owner()(address)' --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          [ "${OWNER,,}" = "${EXPECTED_OWNER,,}" ] || { echo '::error::Registry owner mismatch.'; exit 1; }

          ACTIVE="$(cast call "$REGISTRY" 'activeKeyIdHash()(bytes32)' --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          EXPECTED_ACTIVE="$(cast keccak "$RISK_OBJECT_SIGNING_KEY_ID")"
          [ "${ACTIVE,,}" = "${EXPECTED_ACTIVE,,}" ] || { echo '::error::Active key ID mismatch.'; exit 1; }

          USABLE="$(cast call "$REGISTRY" 'isKeyUsable(string,uint64)(bool)' "$RISK_OBJECT_SIGNING_KEY_ID" "$(date +%s)" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          [ "$USABLE" = 'true' ] || { echo '::error::Published Risk Object signing key is not usable.'; exit 1; }

      - name: Write sanitized deployment evidence
        env:
          REGISTRY: ${{ steps.deploy.outputs.registry }}
          DEPLOYER: ${{ steps.deploy.outputs.deployer }}
          DEPLOY_TX: ${{ steps.deploy.outputs.deploy_tx }}
          PUBLISH_TXS: ${{ steps.publish.outputs.publish_txs }}
          PUBLIC_KEY_HASH: ${{ steps.publish.outputs.public_key_hash }}
          GAS_PROVIDER: ${{ steps.gas.outputs.provider }}
          FAUCET_TX: ${{ steps.gas.outputs.faucet_tx }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          FINGERPRINT="$(cat "$RUNNER_TEMP/risk-object-public-fingerprint.txt")"
          jq -n \
            --arg network 'Base Sepolia' \
            --arg caip2 'eip155:84532' \
            --arg registry "$REGISTRY" \
            --arg owner "$DEPLOYER" \
            --arg deploy_tx "$DEPLOY_TX" \
            --arg publish_txs "$PUBLISH_TXS" \
            --arg key_id "$RISK_OBJECT_SIGNING_KEY_ID" \
            --arg public_key_hash "$PUBLIC_KEY_HASH" \
            --arg public_key_fingerprint_sha256 "$FINGERPRINT" \
            --arg jwks_uri "$RISK_OBJECT_JWKS_URI" \
            --arg gas_provider "$GAS_PROVIDER" \
            --arg faucet_tx "$FAUCET_TX" \
            --arg deployed_from_commit "$GITHUB_SHA" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{network:$network,caip2:$caip2,registry:$registry,owner:$owner,deploy_tx:$deploy_tx,publish_txs:($publish_txs|split(",")|map(select(length>0))),key_id:$key_id,public_key_hash:$public_key_hash,public_key_fingerprint_sha256:$public_key_fingerprint_sha256,jwks_uri:$jwks_uri,gas_provider:$gas_provider,faucet_tx:(if $faucet_tx=="" then null else $faucet_tx end),deployed_from_commit:$deployed_from_commit,deployed_at:$deployed_at,private_key_persisted:false,execution_authorized:false}' \
            > artifacts/base-sepolia-risk-key-registry.json

          {
            echo '# Base Sepolia Risk Key Registry'
            echo
            echo "- Registry: \`$REGISTRY\`"
            echo "- Owner: \`$DEPLOYER\`"
            echo "- Deploy tx: \`$DEPLOY_TX\`"
            echo "- Key ID: \`$RISK_OBJECT_SIGNING_KEY_ID\`"
            echo "- Public-key hash: \`$PUBLIC_KEY_HASH\`"
            echo "- Gas bootstrap: \`$GAS_PROVIDER\`"
            echo "- JWKS: $RISK_OBJECT_JWKS_URI"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized registry deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: base-sepolia-risk-key-registry-${{ github.run_id }}
          path: artifacts/base-sepolia-risk-key-registry.json
          if-no-files-found: error
          retention-days: 90
