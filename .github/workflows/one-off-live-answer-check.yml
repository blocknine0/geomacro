name: One-off live intelligence output check
on:
  push:
    branches:
      - feat/production-intelligence-watch
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@4efb2c93c8c64c3c78f4d9d5f6d5b4c1e7fd4ef # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run live answer probes
        run: bun run scripts/production-watch/one-off-live-answer-check.ts
      - name: Upload answer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-off-live-answer-check-${{ github.run_id }}
          path: one-off-live-answer-check.log
          retention-days: 7