name: Tameion Agent Readiness

on:
  pull_request:
    paths:
      - "src/lib/tameion-agent-contract.ts"
      - "src/lib/tameion-agent-service.server.ts"
      - "src/routes/tameion.tsx"
      - "src/routes/api.tameion.*.ts"
      - "src/__tests__/tameion-agent.test.ts"
      - "supabase/migrations/980_tameion_agent_workflow.sql"
      - "docs/TAMEION_AGENT_WORKFLOW.md"
      - ".github/workflows/tameion-agent-readiness.yml"
      - "src/routeTree.gen.ts"
  push:
    branches: [main]
    paths:
      - "src/lib/tameion-agent-contract.ts"
      - "src/lib/tameion-agent-service.server.ts"
      - "src/routes/tameion.tsx"
      - "src/routes/api.tameion.*.ts"
      - "src/__tests__/tameion-agent.test.ts"
      - "supabase/migrations/980_tameion_agent_workflow.sql"
      - "src/routeTree.gen.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tameion-agent-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Tameion policy and security tests
        run: bunx vitest run src/__tests__/tameion-agent.test.ts
      - name: Build application and regenerate route tree
        run: bun run build
      - name: Upload generated route tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tameion-route-tree
          path: src/routeTree.gen.ts
          if-no-files-found: error
          retention-days: 1
      - name: Verify generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts
