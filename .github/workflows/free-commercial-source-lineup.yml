name: Free Commercial Source Lineup No-Funds Rotation

# Bounded one-source-per-category GET/HEAD probes; no B2, D1, Supabase or payment.
# Scheduled twice daily (~6 requests per category per 72 hours); this is
# transport observation, NOT a live intelligence publication SLA.
on:
  pull_request:
    paths:
      - "scripts/lib/operator-commercial-free-source-lineup.mjs"
      - "scripts/lib/free-no-key-source-probe.mjs"
      - "scripts/tests/operator-commercial-free-source-lineup.test.mjs"
      - "scripts/ops/probe-commercial-free-source-lineup.mjs"
      - ".github/workflows/free-commercial-source-lineup.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/operator-commercial-free-source-lineup.mjs"
      - "scripts/lib/free-no-key-source-probe.mjs"
      - "scripts/tests/operator-commercial-free-source-lineup.test.mjs"
      - "scripts/ops/probe-commercial-free-source-lineup.mjs"
      - ".github/workflows/free-commercial-source-lineup.yml"
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-free-commercial-lineup
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Exact dataset rights plus 3-category source transport contracts
        run: node --test scripts/tests/operator-commercial-free-source-lineup.test.mjs

  read-only-production-mesh:
    needs: source-contract
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Probe one free/no-card source per launch category, no writes or funds
        run: node scripts/ops/probe-commercial-free-source-lineup.mjs
