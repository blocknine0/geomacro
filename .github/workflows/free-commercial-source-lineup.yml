name: Free Commercial Source Lineup No-Funds Rotation

# Bounded existing free readers: 30-minute feed target, daily reference data.
# Hash-only checkpoints in existing D1; no B2, Supabase, payment or signing.
# GitHub scheduling is best effort, not a real-time delivery SLA.
on:
  pull_request:
    paths:
      - "scripts/lib/global-official-release-feeds.mjs"
      - "scripts/tests/global-official-release-feeds.test.mjs"
      - "scripts/lib/operator-commercial-free-source-lineup.mjs"
      - "scripts/lib/free-no-key-source-probe.mjs"
      - "scripts/lib/gdelt-free-batch-manifest.mjs"
      - "scripts/tests/gdelt-free-batch-manifest.test.mjs"
      - "scripts/lib/free-source-production-updates.mjs"
      - "scripts/lib/marad-official-corridor-context.mjs"
      - "scripts/tests/marad-official-corridor-context.test.mjs"
      - "scripts/lib/zoho-maritime-subscription-mail.mjs"
      - "scripts/tests/zoho-maritime-subscription-mail.test.mjs"
      - "scripts/ops/observe-zoho-maritime-subscriptions.mjs"
      - "scripts/lib/free-source-operational-verdict.mjs"
      - "scripts/tests/free-source-operational-verdict.test.mjs"
      - "scripts/tests/free-source-production-updates.test.mjs"
      - "scripts/tests/operator-commercial-free-source-lineup.test.mjs"
      - "scripts/lib/free-source-production-failure.mjs"
      - "scripts/tests/free-source-production-failure.test.mjs"
      - "scripts/ops/probe-commercial-free-source-lineup.mjs"
      - "scripts/ops/verify-wdi-site-deployment.mjs"
      - "scripts/tests/verify-wdi-site-deployment.test.mjs"
      - ".github/workflows/free-commercial-source-lineup.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/global-official-release-feeds.mjs"
      - "scripts/tests/global-official-release-feeds.test.mjs"
      - "scripts/lib/operator-commercial-free-source-lineup.mjs"
      - "scripts/lib/free-no-key-source-probe.mjs"
      - "scripts/lib/gdelt-free-batch-manifest.mjs"
      - "scripts/tests/gdelt-free-batch-manifest.test.mjs"
      - "scripts/lib/free-source-production-updates.mjs"
      - "scripts/lib/marad-official-corridor-context.mjs"
      - "scripts/tests/marad-official-corridor-context.test.mjs"
      - "scripts/lib/zoho-maritime-subscription-mail.mjs"
      - "scripts/tests/zoho-maritime-subscription-mail.test.mjs"
      - "scripts/ops/observe-zoho-maritime-subscriptions.mjs"
      - "scripts/lib/free-source-operational-verdict.mjs"
      - "scripts/tests/free-source-operational-verdict.test.mjs"
      - "scripts/tests/free-source-production-updates.test.mjs"
      - "scripts/tests/operator-commercial-free-source-lineup.test.mjs"
      - "scripts/lib/free-source-production-failure.mjs"
      - "scripts/tests/free-source-production-failure.test.mjs"
      - "scripts/ops/probe-commercial-free-source-lineup.mjs"
      - "scripts/ops/verify-wdi-site-deployment.mjs"
      - "scripts/tests/verify-wdi-site-deployment.test.mjs"
      - ".github/workflows/free-commercial-source-lineup.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-free-commercial-lineup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22"
      - name: Exact dataset rights plus 3-category source transport contracts
        run: node --test scripts/tests/gdelt-free-batch-manifest.test.mjs scripts/tests/operator-commercial-free-source-lineup.test.mjs scripts/tests/free-source-production-updates.test.mjs scripts/tests/global-official-release-feeds.test.mjs scripts/tests/free-source-operational-verdict.test.mjs scripts/tests/free-source-production-failure.test.mjs scripts/tests/marad-official-corridor-context.test.mjs scripts/tests/verify-wdi-site-deployment.test.mjs scripts/tests/zoho-maritime-subscription-mail.test.mjs
      - name: Validate WDI public build checker syntax
        run: node --check scripts/ops/verify-wdi-site-deployment.mjs

  read-only-production-mesh:
    needs: source-contract
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22"
      - name: Resolve existing control-plane checkpoint database
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          list="$(npx -y wrangler@4.136.3 d1 list --json)"
          db_id="$(printf '%s' "$list" | node -e '
            let data="";
            process.stdin.on("data",d=>data+=d);
            process.stdin.on("end",()=>{
              const found=JSON.parse(data).filter(x=>x.name===process.env.D1_DATABASE_NAME);
              if(found.length!==1)process.exit(2);
              process.stdout.write(found[0].uuid??found[0].id??"");
            });
          ')"
          test -n "$db_id"
          echo "D1_DATABASE_ID=$db_id" >> "$GITHUB_ENV"
      - name: Collect bounded source changes and verify D1 checkpoint readback
        run: node scripts/ops/probe-commercial-free-source-lineup.mjs --production-updates
      # Main-only outside-in readback of the published website build marker.
      # No extra World Bank provider read, customer API, rights or payment.
      # Recording a stale deployment must not undo successful D1 checkpoints.
      - name: Check actual published main build for WDI source changes
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        run: node scripts/ops/verify-wdi-site-deployment.mjs
      - name: Retain source-free update receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: free-source-updates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/free-source-updates/receipt.json
            artifacts/free-source-updates/deployed-main-readback.json
          if-no-files-found: ignore
          retention-days: 3

  zoho-subscribed-maritime-candidates:
    # Reuses existing 30-minute source schedule, not a second cron or new API.
    # No unapproved mail moves, original body, website publications or payment.
    needs: source-contract
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 4
    env:
      # Pinned to the mailbox's actual mail.zoho.in data centre.
      ZOHO_MAIL_REGION: in
      ZOHO_MAIL_CLIENT_ID: ${{ secrets.ZOHO_MAIL_CLIENT_ID }}
      ZOHO_MAIL_CLIENT_SECRET: ${{ secrets.ZOHO_MAIL_CLIENT_SECRET }}
      ZOHO_MAIL_REFRESH_TOKEN: ${{ secrets.ZOHO_MAIL_REFRESH_TOKEN }}
      ZOHO_MAIL_ACCOUNT_ID: ${{ secrets.ZOHO_MAIL_ACCOUNT_ID }}
      ZOHO_MAIL_FOLDER_ID: ${{ secrets.ZOHO_MAIL_FOLDER_ID }}
      ZOHO_UKMTO_APPROVED_SENDER: ${{ secrets.ZOHO_UKMTO_APPROVED_SENDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Observe official subscription mail metadata, never store raw messages
        run: node scripts/ops/observe-zoho-maritime-subscriptions.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zoho-maritime-private-candidates-${{ github.run_id }}
          path: artifacts/zoho-maritime-subscribed-alerts/private-receipt.json
          retention-days: 3
          if-no-files-found: warn
