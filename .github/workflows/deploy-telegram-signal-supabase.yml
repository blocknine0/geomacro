name: Deploy Telegram signal ingest to isolated Supabase

# SUPABASE_WORKDIR=supabase/isolated-signal is retained as a static isolation marker only.
# Runtime deployment uses the collision-free temporary ISOLATED_WORKDIR below.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan or apply
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  schedule:
    - cron: "17 1,9,17 * * *"
  pull_request:
    paths:
      - ".github/workflows/deploy-telegram-signal-supabase.yml"
      - "supabase/isolated-signal/**"
      - "supabase/functions/live-flash-ingest/**"
      - "supabase/functions/live-flash-corroborate/**"
      - "supabase/functions/live-flash-archive/**"
      - "scripts/prepare-telegram-isolated-migration-workdir.mjs"
      - "workers/telegram-flash/**"
      - "src/__tests__/telegram-signal-supabase-isolation.test.ts"
      - "src/__tests__/telegram-authorized-production-boundary-static.test.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-telegram-signal-supabase.yml"
      - "supabase/isolated-signal/**"
      - "supabase/functions/live-flash-ingest/**"
      - "supabase/functions/live-flash-corroborate/**"
      - "supabase/functions/live-flash-archive/**"
      - "scripts/prepare-telegram-isolated-migration-workdir.mjs"
      - "workers/telegram-flash/**"
      - "src/__tests__/telegram-signal-supabase-isolation.test.ts"
      - "src/__tests__/telegram-authorized-production-boundary-static.test.ts"

permissions:
  contents: read

concurrency:
  group: deploy-telegram-signal-supabase
  cancel-in-progress: false

env:
  EXPECTED_SIGNAL_SUPABASE_PROJECT_REF: qogpagklwbfdmrgnrhzi
  ISOLATED_WORKDIR: /tmp/geomacro-signal-supabase

jobs:
  validate-workflow:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate workflow contract
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/deploy-telegram-signal-supabase.yml
          grep -q 'qogpagklwbfdmrgnrhzi' "$file"
          grep -q 'ISOLATED_WORKDIR=/tmp/geomacro-signal-supabase' "$file" || grep -q 'ISOLATED_WORKDIR: /tmp/geomacro-signal-supabase' "$file"
          grep -q 'prepare-telegram-isolated-migration-workdir.mjs' "$file"
          grep -q 'supabase --workdir "$ISOLATED_WORKDIR" link' "$file"
          grep -q 'supabase --workdir "$ISOLATED_WORKDIR" db push --dry-run' "$file"
          grep -q 'supabase --workdir "$ISOLATED_WORKDIR" db push' "$file"
          ! grep -Eq 'supabase[[:space:]]+migration[[:space:]]+repair' "$file"
          grep -q '980_telegram_signal_ingest_isolation.sql' "$file"
          grep -q '984_telegram_authorized_publisher_only.sql' "$file"
          grep -q '985_breaking_feed_registry_parity.sql' "$file"
          grep -q -- '--no-verify-jwt' "$file"
          grep -q 'live-flash-corroborate' "$file"
          grep -q 'source_record_id_and_headline_required' "$file"
          grep -q 'Ingest smoke check failed' "$file"
          grep -q 'Corroborate smoke check failed' "$file"

  keepalive:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Keep isolated signal project active
        shell: bash
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.TELEGRAM_SIGNAL_SUPABASE_PROJECT_ID }}
          FLASH_INGEST_TOKEN: ${{ secrets.TELEGRAM_SIGNAL_FLASH_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_PROJECT_ID:-}" || -z "${FLASH_INGEST_TOKEN:-}" ]]; then
            echo "::error title=Missing keepalive secret::Signal-project ref or flash token is missing."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_ID" != "$EXPECTED_SIGNAL_SUPABASE_PROJECT_REF" ]]; then
            echo "::error title=Wrong keepalive target::Refusing to call a non-isolated project."
            exit 1
          fi
          base="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1"
          code="$(curl --silent --show-error --output /tmp/keepalive.json --write-out '%{http_code}' --request POST --header "x-geomacro-flash-token: ${FLASH_INGEST_TOKEN}" --header 'Content-Type: application/json' --data '{}' "${base}/live-flash-corroborate")"
          cat /tmp/keepalive.json
          if [[ "$code" != "200" ]] || ! grep -q '"ok":true' /tmp/keepalive.json; then
            echo "::error title=Telegram signal keepalive failed::Isolated project may be paused or unhealthy."
            exit 1
          fi
          echo "PASS: isolated Telegram signal Supabase keepalive succeeded."

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.TELEGRAM_SIGNAL_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.TELEGRAM_SIGNAL_SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.TELEGRAM_SIGNAL_SUPABASE_DB_PASSWORD }}
      FLASH_INGEST_TOKEN: ${{ secrets.TELEGRAM_SIGNAL_FLASH_INGEST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate required signal-project secrets and target
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing signal-project secret::${name} is not configured."
              missing=1
            fi
          done
          if [[ "${{ inputs.mode }}" == "apply" && -z "${FLASH_INGEST_TOKEN:-}" ]]; then
            echo "::error title=Missing signal-project secret::FLASH_INGEST_TOKEN is required for apply mode."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
          if [[ "$SUPABASE_PROJECT_ID" != "$EXPECTED_SIGNAL_SUPABASE_PROJECT_REF" ]]; then
            echo "::error title=Wrong signal-project target::Refusing to deploy outside the dedicated Telegram signal Supabase project."
            exit 1
          fi
          echo "PASS: isolated Telegram signal Supabase project confirmed."
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0
      - name: Prepare collision-free isolated migration workdir
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-telegram-isolated-migration-workdir.mjs
          test -f "$ISOLATED_WORKDIR/migrations/000_remote_history_placeholder.sql"
          test -f "$ISOLATED_WORKDIR/migrations/054_remote_history_placeholder.sql"
          test -f "$ISOLATED_WORKDIR/migrations/900_remote_history_placeholder.sql"
          test -f "$ISOLATED_WORKDIR/migrations/951_remote_history_placeholder.sql"
          test -f "$ISOLATED_WORKDIR/migrations/980_telegram_signal_ingest_isolation.sql"
          test -f "$ISOLATED_WORKDIR/migrations/984_telegram_authorized_publisher_only.sql"
          test -f "$ISOLATED_WORKDIR/migrations/985_breaking_feed_registry_parity.sql"
          if find "$ISOLATED_WORKDIR/migrations" -maxdepth 1 -type f -name '95[2-9]_*.sql' | grep -q .; then
            echo "::error title=Unsafe migration boundary::Authoritative migration >=952 leaked into isolated workdir."
            exit 1
          fi
          echo "PASS: isolated migration workdir contains exact remote-history placeholders plus signal-only 980-985."
      - name: Link isolated signal project
        run: supabase --workdir "$ISOLATED_WORKDIR" link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show pending database migrations
        run: supabase --workdir "$ISOLATED_WORKDIR" db push --dry-run
      - name: Stop after deployment plan
        if: ${{ inputs.mode == 'plan' }}
        run: echo "Plan completed. No signal-project database or function changes were applied."
      - name: Apply signal database migrations
        if: ${{ inputs.mode == 'apply' }}
        run: supabase --workdir "$ISOLATED_WORKDIR" db push
      - name: Configure isolated function secrets
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          supabase secrets set FLASH_INGEST_TOKEN="$FLASH_INGEST_TOKEN" SIGNAL_DB_MODE="true" --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy isolated live flash ingest function
        if: ${{ inputs.mode == 'apply' }}
        run: supabase functions deploy live-flash-ingest --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Deploy isolated live flash corroboration function
        if: ${{ inputs.mode == 'apply' }}
        run: supabase functions deploy live-flash-corroborate --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Deploy isolated live flash archive function
        if: ${{ inputs.mode == 'apply' }}
        run: supabase functions deploy live-flash-archive --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Smoke-check isolated endpoints without synthetic inserts
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1"

          ingest_code="$(curl --silent --show-error --output /tmp/flash-ingest.json --write-out '%{http_code}' --request POST --header "x-geomacro-flash-token: ${FLASH_INGEST_TOKEN}" --header 'Content-Type: application/json' --data '{"source_id":"aljazeera_rss"}' "${base}/live-flash-ingest")"
          cat /tmp/flash-ingest.json
          if [[ "$ingest_code" != "400" ]] || ! grep -q 'source_record_id_and_headline_required' /tmp/flash-ingest.json; then
            echo "::error title=Ingest smoke check failed::Expected authenticated validation response from live-flash-ingest."
            exit 1
          fi

          corroborate_code="$(curl --silent --show-error --output /tmp/flash-corroborate.json --write-out '%{http_code}' --request POST --header "x-geomacro-flash-token: ${FLASH_INGEST_TOKEN}" --header 'Content-Type: application/json' --data '{}' "${base}/live-flash-corroborate")"
          cat /tmp/flash-corroborate.json
          if [[ "$corroborate_code" != "200" ]] || ! grep -q '"ok":true' /tmp/flash-corroborate.json; then
            echo "::error title=Corroborate smoke check failed::Expected authenticated success response from live-flash-corroborate."
            exit 1
          fi

          echo "Isolated Telegram signal Supabase smoke checks passed."
