name: Geomacro Intelligence Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/intelligence-orchestrator.yml"
      - "scripts/intelligence-orchestrator.mjs"
      - "scripts/run-rss-live-cycle.mjs"
      - "scripts/run-live-flash-ingest-local.ts"
      - "scripts/run-live-flash-corroborate-local.ts"
      - "supabase/functions/live-flash-ingest/**"
      - "supabase/functions/live-flash-corroborate/**"
      - "scripts/lib/intelligence-scheduler.mjs"
      - "scripts/lib/direct-postgres-supabase-loader.mjs"
      - "scripts/lib/d1-control-plane-state.mjs"
      - "scripts/lib/d1-orchestrator-supabase-shim.mjs"
      - "scripts/ops/supabase-free-tier-budget.mjs"
      - "scripts/sync-country-raw-source-mesh.mjs"
      - "scripts/ops/run-intelligence-current-scoring-cycle.mjs"
      - "scripts/ops/sync-fastlane-scored-intelligence.mjs"
      - "scripts/ops/run-b2-public-intelligence-publisher.mjs"
      - "scripts/ops/refresh-gdelt-coverage-runtime-after-b2.mjs"
      - "workers/control-plane/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      # Legacy Supabase values remain available only for tasks that have not yet
      # been migrated. Scheduler/control-state authority is D1, not Supabase.
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"

      B2_GDELT_PRIMARY: "1"
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      RAW_SOURCE_ARCHIVE_MODE: b2
      GRI_DB_MODE: direct_postgres
      LIVE_STRUCTURE_EXECUTION_MODE: local_direct_postgres
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      GEOMACRO_FLASH_INGEST_TOKEN: ${{ secrets.FLASH_INGEST_TOKEN }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
      INVINO_API_KEY: ${{ secrets.INVINO_API_KEY }}
      RELIEFWEB_APP_NAME: ${{ secrets.RELIEFWEB_APP_NAME }}
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      LIVE_STRUCTURE_MAX_ATTEMPTS: "4"
      LIVE_STRUCTURE_ATTEMPT_TIMEOUT_MS: "90000"
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
      GUARDIAN_QUERY_BUDGET_PER_CATEGORY: ${{ vars.GUARDIAN_QUERY_BUDGET_PER_CATEGORY }}
      GUARDIAN_QUERY_ROTATION_HOURS: ${{ vars.GUARDIAN_QUERY_ROTATION_HOURS }}
      GROQ_BATCH_DELAY_MS: ${{ vars.GROQ_BATCH_DELAY_MS }}
      GROQ_MAX_REQUESTS_PER_RUN: ${{ vars.GROQ_MAX_REQUESTS_PER_RUN }}
      GROQ_MIN_REMAINING_REQUESTS: ${{ vars.GROQ_MIN_REMAINING_REQUESTS }}
      GROQ_MIN_REMAINING_TOKENS: ${{ vars.GROQ_MIN_REMAINING_TOKENS }}
      GRI_PUBLISH_ENABLED: ${{ vars.GRI_PUBLISH_ENABLED }}
      BREAKING_RSS_ENABLED: "true"
      BREAKING_RSS_RUN_ONCE: "true"
      BREAKING_RSS_BOOTSTRAP_MAX_ITEMS: "10"
      TELEGRAM_ENABLED: "false"
      BREAKING_FEED_USER_AGENT: "Geomacro/1.0 (+https://geomacro.live; contact=contact@geomacro.live)"
      INTELLIGENCE_ORCHESTRATOR_MAX_TASKS: "8"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install locked Node/Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install RSS/Telegram worker dependencies
        run: python -m pip install --disable-pip-version-check -r workers/telegram-flash/requirements.txt

      - name: Resolve production D1 control-plane database
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is required for D1 scheduler state"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is required for D1 scheduler state"; exit 2; }
          LIST_JSON="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const rows = JSON.parse(s);
              const row = rows.find(x => x.name === process.env.D1_DATABASE_NAME);
              process.stdout.write(row?.uuid ?? row?.id ?? "");
            });
          ')"
          test -n "$DB_ID" || { echo "Production D1 control-plane database not found"; exit 3; }
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "PASS: D1 scheduler state authority resolved."

      - name: Validate Supabase-independent scheduler runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${D1_DATABASE_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${B2_KEY_ID:-}"
          test -n "${B2_APPLICATION_KEY:-}"
          test "${GRI_DB_MODE:-}" = "direct_postgres"
          test "${RAW_SOURCE_ARCHIVE_MODE:-}" = "b2"
          test "${LIVE_STRUCTURE_EXECUTION_MODE:-}" = "local_direct_postgres"
          node --check scripts/lib/d1-control-plane-state.mjs
          node --check scripts/lib/d1-orchestrator-supabase-shim.mjs
          node --check scripts/intelligence-orchestrator.mjs
          echo "PASS: D1/B2 scheduler runtime validated without requiring Supabase availability."

      - name: Probe optional Supabase data plane without blocking D1/B2 heartbeat
        shell: bash
        run: |
          set -euo pipefail
          rm -f supabase-budget.json
          set +e
          node scripts/ops/supabase-free-tier-budget.mjs --require-bulk-write --require-normal > supabase-budget.json 2>supabase-budget.stderr
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] && jq -e '.ok == true and .policy.recurring_ingest_allowed == true' supabase-budget.json >/dev/null 2>&1; then
            transport="$(jq -r '.transport' supabase-budget.json)"
            case "${transport}" in
              data_api)
                echo "GEOMACRO_SUPABASE_EDGE_AVAILABLE=true" >> "$GITHUB_ENV"
                echo "GEOMACRO_SUPABASE_DATA_AVAILABLE=true" >> "$GITHUB_ENV"
                ;;
              direct_postgres_fallback)
                echo "GEOMACRO_SUPABASE_EDGE_AVAILABLE=false" >> "$GITHUB_ENV"
                echo "GEOMACRO_SUPABASE_DATA_AVAILABLE=true" >> "$GITHUB_ENV"
                ;;
              *)
                echo "::error::Unknown Supabase budget transport: ${transport}"
                exit 1
                ;;
            esac
          else
            # Supabase is optional for heartbeat and public serving. Until each
            # remaining ingestion task is B2/D1-native, freeze those writers
            # rather than fabricating freshness or failing the whole scheduler.
            echo "GEOMACRO_SUPABASE_EDGE_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "GEOMACRO_SUPABASE_DATA_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "INTELLIGENCE_ORCHESTRATOR_TASK_ALLOWLIST=__d1_control_only" >> "$GITHUB_ENV"
            echo '{"ok":false,"transport":"unavailable","policy":{"recurring_ingest_allowed":false}}' > supabase-budget.json
            echo "Supabase unavailable: D1/B2 heartbeat remains live; Supabase-backed writers are fail-closed."
          fi

      - name: Derive current public verification key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RISK_OBJECT_SIGNING_KEY_ID:-}"
          test -n "${RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64:-}"
          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require('node:crypto');
          const fs = require('node:fs');
          const privateKey = createPrivateKey({
            key: Buffer.from(process.env.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64.trim(), 'base64'),
            format: 'der',
            type: 'pkcs8',
          });
          if (privateKey.asymmetricKeyType !== 'ed25519') {
            throw new Error('Risk Object signing key must be Ed25519');
          }
          const publicB64 = Buffer.from(
            createPublicKey(privateKey).export({ format: 'der', type: 'spki' }),
          ).toString('base64');
          fs.appendFileSync(process.env.GITHUB_ENV, `RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64=${publicB64}\n`);
          console.log('PASS: current Risk Object public verification key derived from configured private key.');
          NODE

      - name: Run due intelligence tasks serially
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 52m node scripts/intelligence-orchestrator.mjs > intelligence-orchestrator.json
          jq -e . intelligence-orchestrator.json > /dev/null
          cat intelligence-orchestrator.json

      - name: Publish scheduler summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f intelligence-orchestrator.json ]; then
            jq . intelligence-orchestrator.json
            {
              echo "## Geomacro Intelligence Orchestrator"
              echo
              jq . intelligence-orchestrator.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scheduler summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scheduler evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intelligence-orchestrator-${{ github.run_id }}
          path: |
            intelligence-orchestrator.json
            supabase-budget.json
            supabase-budget.stderr
            gdelt-gal-cycle/**
            country-raw-source-sync.json
            artifacts/intelligence-current-scoring-cycle/**
            artifacts/intelligence-fastlane-publication.json
          if-no-files-found: warn
          retention-days: 30
