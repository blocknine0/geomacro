name: UCDP Candidate Current Sync

on:
  pull_request:
    paths:
      - "scripts/fetch-ucdp-ged-dry-run.mjs"
      - "scripts/ingest-ucdp-candidate-live.mjs"
      - "scripts/record-ucdp-candidate-release-manifest.mjs"
      - ".github/workflows/ucdp-candidate-sync.yml"
      - "supabase/migrations/053_ucdp_candidate_live_ingest.sql"
      - "supabase/migrations/054_ucdp_candidate_transport_alignment.sql"
      - "supabase/migrations/919_risk_gate_v2_global_source_manifests.sql"
  workflow_dispatch:
    inputs:
      candidate_version:
        description: "Monthly UCDP Candidate version, for example 26.0.7"
        required: false
        default: "26.0.7"
  schedule:
    - cron: "17 3 16 * *"

permissions:
  contents: read

concurrency:
  group: ucdp-candidate-current-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UCDP_API_TOKEN: ${{ secrets.UCDP_API_TOKEN }}
      UCDP_CANDIDATE_VERSION: ${{ inputs.candidate_version || vars.UCDP_CANDIDATE_VERSION || '26.0.7' }}
      UCDP_MAX_UNMAPPED_ROWS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record Dependabot live-source boundary
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: echo "Dependabot pull requests do not receive repository secrets; authenticated UCDP live validation is intentionally skipped for this dependency-only run." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required UCDP configuration
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::APP_SUPABASE_URL is required for UCDP validation"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for UCDP validation"; exit 1; }
          test -n "$UCDP_API_TOKEN" || { echo "::error::UCDP_API_TOKEN is required for UCDP validation"; exit 1; }

      - name: Validate authenticated UCDP Candidate API access
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: bun scripts/fetch-ucdp-ged-dry-run.mjs

      - name: Validate full Candidate release without database writes
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: bun scripts/ingest-ucdp-candidate-live.mjs

      - name: Sync governed current Candidate evidence
        if: github.event_name != 'pull_request'
        run: bun scripts/ingest-ucdp-candidate-live.mjs --write

      - name: Record clean global release completeness manifest
        if: github.event_name != 'pull_request'
        run: bun scripts/record-ucdp-candidate-release-manifest.mjs --write
