name: Free Tier Recovery Finalize

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type I_ACCEPT_VERIFIED_EVIDENCE_COLD_DELETE to run verified final recovery"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: geomacro-free-tier-final-recovery
  cancel-in-progress: false

jobs:
  verified-recovery:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      STRUCTURED_EVIDENCE_PHASE_B_ACK: ${{ inputs.confirmation }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify production target and explicit owner acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test "$STRUCTURED_EVIDENCE_PHASE_B_ACK" = "I_ACCEPT_VERIFIED_EVIDENCE_COLD_DELETE"
          node --check scripts/ops/b2-country-ingest-offload.mjs
          node --check scripts/ops/b2-archive-structured-evidence-bundle.mjs
          node --check scripts/ops/b2-delete-verified-structured-evidence-bundles.mjs
          mkdir -p recovery-evidence

      - name: Historical raw drain canary
        shell: bash
        run: |
          set -euo pipefail
          env \
            B2_REQUEST_BUDGET=10 \
            B2_INGEST_LOOKBACK_HOURS=72 \
            B2_INGEST_RAW_BUNDLE_LIMIT=10 \
            B2_INGEST_RAW_ROUNDS=1 \
            B2_INGEST_HISTORICAL_DRAIN=1 \
            node scripts/ops/b2-country-ingest-offload.mjs | tee recovery-evidence/raw-canary.json
          jq -e '.ok == true and .mode == "historical-b2-primary-drain" and .historical_drain == true' recovery-evidence/raw-canary.json >/dev/null
          jq -e '.verification == "full-b2-readback-before-pointer-update-and-source-delete" and .pre_write_b2_read_preflight_verified == true' recovery-evidence/raw-canary.json >/dev/null

      - name: Drain bounded historical raw backlog
        shell: bash
        run: |
          set -euo pipefail
          : > recovery-evidence/raw-drain.jsonl
          complete=0
          for pass in $(seq 1 5); do
            out="recovery-evidence/raw-drain-${pass}.json"
            env \
              B2_REQUEST_BUDGET=100 \
              B2_INGEST_LOOKBACK_HOURS=72 \
              B2_INGEST_RAW_BUNDLE_LIMIT=50 \
              B2_INGEST_RAW_ROUNDS=16 \
              B2_INGEST_HISTORICAL_DRAIN=1 \
              node scripts/ops/b2-country-ingest-offload.mjs | tee "$out"
            cat "$out" >> recovery-evidence/raw-drain.jsonl
            jq -e '.ok == true and .mode == "historical-b2-primary-drain" and .historical_drain == true' "$out" >/dev/null
            jq -e '.verification == "full-b2-readback-before-pointer-update-and-source-delete" and .pre_write_b2_read_preflight_verified == true' "$out" >/dev/null
            processed=$(jq -r '.raw.processed' "$out")
            if [ "$processed" -eq 0 ]; then
              complete=1
              break
            fi
          done
          test "$complete" -eq 1 || { echo "HISTORICAL_RAW_DRAIN_BOUNDED_LIMIT_REACHED" >&2; exit 1; }

      - name: Structured evidence archive canary
        shell: bash
        run: |
          set -euo pipefail
          env \
            B2_REQUEST_BUDGET=8 \
            STRUCTURED_EVIDENCE_ARCHIVE_OLDER_DAYS=7 \
            STRUCTURED_EVIDENCE_ARCHIVE_LIMIT=100 \
            node scripts/ops/b2-archive-structured-evidence-bundle.mjs | tee recovery-evidence/evidence-archive-canary.json
          jq -e '.ok == true' recovery-evidence/evidence-archive-canary.json >/dev/null

      - name: Complete verified structured evidence archive coverage
        shell: bash
        run: |
          set -euo pipefail
          : > recovery-evidence/evidence-archive.jsonl
          complete=0
          for pass in $(seq 1 50); do
            out="recovery-evidence/evidence-archive-${pass}.json"
            env \
              B2_REQUEST_BUDGET=8 \
              STRUCTURED_EVIDENCE_ARCHIVE_OLDER_DAYS=7 \
              STRUCTURED_EVIDENCE_ARCHIVE_LIMIT=1000 \
              node scripts/ops/b2-archive-structured-evidence-bundle.mjs | tee "$out"
            cat "$out" >> recovery-evidence/evidence-archive.jsonl
            jq -e '.ok == true' "$out" >/dev/null
            status=$(jq -r '.status // ""' "$out")
            if [ "$status" = "complete" ]; then
              complete=1
              break
            fi
          done
          test "$complete" -eq 1 || { echo "STRUCTURED_EVIDENCE_ARCHIVE_BOUNDED_LIMIT_REACHED" >&2; exit 1; }

      - name: Verified Phase B cold-delete canary
        shell: bash
        run: |
          set -euo pipefail
          env \
            B2_REQUEST_BUDGET=8 \
            STRUCTURED_EVIDENCE_PHASE_B_BATCH_LIMIT=50 \
            STRUCTURED_EVIDENCE_PHASE_B_ROUNDS=1 \
            node scripts/ops/b2-delete-verified-structured-evidence-bundles.mjs | tee recovery-evidence/phase-b-canary.jsonl
          tail -n 1 recovery-evidence/phase-b-canary.jsonl | jq -e '.ok == true' >/dev/null

      - name: Complete bounded verified Phase B cold cleanup
        shell: bash
        run: |
          set -euo pipefail
          : > recovery-evidence/phase-b.jsonl
          complete=0
          for pass in $(seq 1 12); do
            out="recovery-evidence/phase-b-${pass}.jsonl"
            env \
              B2_REQUEST_BUDGET=30 \
              STRUCTURED_EVIDENCE_PHASE_B_BATCH_LIMIT=500 \
              STRUCTURED_EVIDENCE_PHASE_B_ROUNDS=8 \
              node scripts/ops/b2-delete-verified-structured-evidence-bundles.mjs | tee "$out"
            cat "$out" >> recovery-evidence/phase-b.jsonl
            tail -n 1 "$out" | jq -e '.ok == true' >/dev/null
            deleted=$(tail -n 1 "$out" | jq -r '.total_deleted // -1')
            if [ "$deleted" -eq 0 ]; then
              complete=1
              break
            fi
          done
          test "$complete" -eq 1 || { echo "STRUCTURED_EVIDENCE_PHASE_B_BOUNDED_LIMIT_REACHED" >&2; exit 1; }

      - name: Upload final recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: free-tier-final-recovery-${{ github.run_id }}
          path: recovery-evidence/
          if-no-files-found: warn
          retention-days: 14
