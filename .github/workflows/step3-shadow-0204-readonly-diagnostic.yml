name: Step3 Shadow 0204 — Physical Read-Only Diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step3-shadow-0204-readonly-diagnostic.yml"
      - "scripts/ops/step3-shadow-0204-readonly-diagnostic.mjs"
      - "scripts/lib/d1-step3-index-parity.mjs"
      - "scripts/lib/d1-step3-supported-integrity.mjs"
      - "scripts/lib/d1-step3-next-migration-inventory.mjs"
      - "scripts/tests/d1-step3-next-migration-inventory.test.mjs"
      - "scripts/tests/d1-step3-supported-integrity.test.mjs"
      - "scripts/tests/d1-step3-index-parity.test.mjs"
      - "scripts/tests/step3-shadow-0204-readonly-diagnostic.test.mjs"
  workflow_dispatch:
  # After owner-approved, successfully completed Shadow-only fixture: repeat
  # provider readback automatically, but do not import event-supplied code.
  workflow_run:
    workflows:
      - "Step3 Isolated Shadow 0204 Nonfact Index Fixture — Protected"
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/step3-shadow-0204-readonly-diagnostic.yml"
      - "scripts/ops/step3-shadow-0204-readonly-diagnostic.mjs"
      - "scripts/tests/step3-shadow-0204-readonly-diagnostic.test.mjs"
permissions:
  contents: read
concurrency:
  group: geomacro-step3-shadow-0204-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: node --test scripts/tests/step3-shadow-0204-readonly-diagnostic.test.mjs scripts/tests/d1-step3-index-parity.test.mjs scripts/tests/d1-step3-supported-integrity.test.mjs scripts/tests/d1-step3-next-migration-inventory.test.mjs
  physical-shadow-readonly:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha)) &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Require immutable main, Shadow identity and canary HOLD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/blocknine0/geomacro.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -f config/d1-hotspot-v2-canary.hold
          test "$D1_DATABASE_ID" != "$GEOMACRO_D1_SHADOW_DATABASE_ID"
          node --test scripts/tests/step3-shadow-0204-readonly-diagnostic.test.mjs scripts/tests/d1-step3-index-parity.test.mjs scripts/tests/d1-step3-supported-integrity.test.mjs scripts/tests/d1-step3-next-migration-inventory.test.mjs
      - name: Independent Paid monthly account-wide provider headroom before any Shadow read
        run: node scripts/ops/check-d1-paid-monthly-headroom.mjs --check
      - name: Read only Shadow 0204 integrity and next migrations schema, ledger, index/size caps
        run: node scripts/ops/step3-shadow-0204-readonly-diagnostic.mjs
      - name: Preserve sanitized diagnostic and strict headroom receipts on HOLD
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-shadow-0204-readonly-${{ github.run_id }}
          path: |
            artifacts/release/step3-shadow-0204-readonly-diagnostic.json
            artifacts/release/d1-paid-monthly-headroom.json
          retention-days: 14
          if-no-files-found: warn
