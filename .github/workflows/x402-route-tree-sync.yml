name: Temporary x402 route tree sync

on:
  push:
    branches:
      - feat/coinbase-x402-bazaar
    paths:
      - src/routes/api.x402.risk.ts
      - .github/workflows/x402-route-tree-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate route tree with the production build
        run: bun run build
      - name: Commit generated route tree when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: sync generated route tree"
          git push origin "HEAD:${GITHUB_REF_NAME}"
