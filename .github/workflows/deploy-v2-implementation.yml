name: Verify AgentArena V2 Upgrade Candidate (Legacy Entry)

on:
  workflow_dispatch:
    inputs:
      new_implementation:
        description: "Already deployed AgentArenaV2 implementation address"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-v2-upgrade-candidate
  cancel-in-progress: true

jobs:
  verify-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify candidate without signing
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ vars.ARC_V2_PROXY_ADDRESS }}
          NEW_IMPLEMENTATION: ${{ inputs.new_implementation }}
          VERIFY_MODE: candidate
        run: node scripts/ops/verify-v2-upgrade-readiness.mjs

# Retained only so old workflow bookmarks remain valid. This legacy entry is
# verify-only and intentionally has no private-key access or transaction path.
