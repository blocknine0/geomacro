name: Deploy Updated AgentArena V2 Implementation

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build and test
        run: |
          forge build
          forge test

      - name: Deploy implementation only
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        run: |
          forge script script/DeployAgentArenaV2Implementation.s.sol:DeployAgentArenaV2Implementation \
            --rpc-url "$ARC_RPC_URL" \
            --broadcast \
            -vvvv
