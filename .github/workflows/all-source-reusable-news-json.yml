name: All Registered Source Reusable JSON Production

on:
  workflow_dispatch: {}
  schedule:
    # Quarter-hour recovery slot; the existing trusted five-minute news
    # fastlane is the primary wakeup. GitHub scheduling is best effort.
    - cron: "4,19,34,49 * * * *"
  workflow_run:
    workflows: ["Deploy D1 Control Plane", "Five-Minute Original News Fastlane"]
    branches: [main]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/all-source-reusable-news-json.yml"
      - "scripts/lib/registered-reusable-news-source-collector.mjs"
      - "scripts/lib/private-osint-national-primary-scope.mjs"
      - "scripts/lib/phase2h-original-metadata.mjs"
      - "scripts/lib/p0b-event-grounded-projection.mjs"
      - "scripts/lib/private-osint-gdelt-global.mjs"
      - "scripts/tests/private-osint-gdelt-static.test.mjs"
      - "scripts/ops/phase2h-b2-first-private-raw.mjs"
      - "scripts/tests/phase2h-b2-first-private-raw.test.mjs"
      - "scripts/tests/phase2h-original-metadata.test.mjs"
      - "scripts/lib/phase2h-raw-original-records.mjs"
      - "scripts/ops/collect-registered-source-health-only.mjs"
      - "scripts/lib/direct-global-corridor-sources.mjs"
      - "config/global-corridor-supplied-links.v1.json"
      - "scripts/lib/direct-global-corridor-sources.test.mjs"
      - "scripts/lib/country-news-mentions-195.mjs"
      - "scripts/lib/country-news-mentions-195.test.mjs"
      - "scripts/lib/observed-country-category-coverage.mjs"
      - "scripts/lib/observed-country-category-coverage.test.mjs"
      - "src/lib/reusable-news-json.ts"
      - "scripts/lib/registered-reusable-news-source-collector.test.mjs"
      - "scripts/lib/registered-news-15m-cadence.test.mjs"
      - "scripts/ops/publish-all-source-reusable-news-json.ts"
      - "scripts/lib/phase2h-registered-private-quota.mjs"
      - "scripts/tests/phase2h-registered-private-quota.test.mjs"
      - "workers/control-plane/src/reusable-source-news.mjs"
      - "workers/control-plane/migrations/0026_reusable_source_news.sql"
      - "src/lib/news-product-factory.ts"
      - "workers/control-plane/src/news-product-factory.mjs"
      - "scripts/tests/news-product-factory.test.mjs"
      - "scripts/lib/prepare-reusable-news-batches.mjs"
      - "scripts/tests/prepare-reusable-news-batches.test.mjs"
      - "scripts/lib/reusable-source-news-d1.test.mjs"
      - "scripts/ops/plan-d1-bundled-work.mjs"
      - "scripts/tests/plan-d1-bundled-work.test.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-all-source-reusable-json-production
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify source reader and D1 contract (no network)
        run: |
          set -euo pipefail
          node --check scripts/lib/registered-reusable-news-source-collector.mjs
          node --check scripts/lib/phase2h-original-metadata.mjs
          node --check scripts/ops/phase2h-b2-first-private-raw.mjs
          node --test scripts/tests/phase2h-b2-first-private-raw.test.mjs
          node --test scripts/tests/phase2h-original-metadata.test.mjs
          node --test scripts/tests/private-osint-gdelt-static.test.mjs
          node --test scripts/tests/p0a-evidence-quality.test.mjs
          node --test scripts/tests/p0b-live-global-search.test.mjs
          node --check scripts/ops/collect-registered-source-health-only.mjs
          node --check scripts/lib/direct-global-corridor-sources.mjs
          node --check scripts/lib/country-news-mentions-195.mjs
          node --check workers/control-plane/src/reusable-source-news.mjs
          node --test scripts/tests/news-product-factory.test.mjs
          node --test scripts/lib/registered-reusable-news-source-collector.test.mjs
          node --test scripts/lib/direct-global-corridor-sources.test.mjs
          node --test scripts/lib/registered-news-15m-cadence.test.mjs
          node --test scripts/lib/country-news-mentions-195.test.mjs
          node --test scripts/lib/observed-country-category-coverage.test.mjs
          node --test scripts/lib/reusable-source-news-d1.test.mjs
          node --test scripts/tests/prepare-reusable-news-batches.test.mjs
          node --test scripts/tests/plan-d1-bundled-work.test.mjs
          node --test scripts/tests/phase2h-registered-private-quota.test.mjs

  collect-and-publish:
    needs: offline-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
          (
            (github.event.workflow_run.name == 'Deploy D1 Control Plane' &&
             (github.event.workflow_run.event == 'push' ||
              github.event.workflow_run.event == 'workflow_dispatch')) ||
            (github.event.workflow_run.name == 'Five-Minute Original News Fastlane' &&
             (github.event.workflow_run.event == 'schedule' ||
              github.event.workflow_run.event == 'workflow_dispatch'))
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout trusted canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Check existing protected D1 credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEOMACRO_COMMERCE_LEDGER_TOKEN" ||
            { echo "::error::Missing protected D1 publisher secret"; exit 2; }
      - name: Gate bundled factual D1 production on account-wide Free headroom
        id: quota
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/ops/plan-d1-bundled-work.mjs
      - name: Resolve canonical D1 identity for independently governed B2-first attempts
        id: b2-db
        if: steps.quota.outputs.source_intake == 'true' && steps.quota.outputs.phase2h_raw_archive == 'true' && steps.quota.outputs.registered_private_max_new_rows != '0'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[0-9a-f]{32}$/.test(account??"")||(token??"").length<20)
           throw Error("B2_FIRST_D1_ACCOUNT_IDENTITY_UNAVAILABLE");
          const response=await fetch(
            "https://api.cloudflare.com/client/v4/accounts/"+account+
            "/d1/database?per_page=100",{
             headers:{Authorization:"Bearer "+token},
             signal:AbortSignal.timeout(15000),
            });
          const doc=await response.json();
          const matches=doc?.result?.filter(x=>x.name==="geomacro-control-plane")??[];
          const uuid=matches[0]?.uuid;
          if(!response.ok||doc.success!==true||matches.length!==1||
             !/^[a-f0-9-]{36}$/iu.test(uuid??""))
           throw Error("B2_FIRST_CANONICAL_D1_NOT_VERIFIED");
          appendFileSync(process.env.GITHUB_ENV,"D1_DATABASE_ID="+uuid+"\n");
          appendFileSync(process.env.GITHUB_OUTPUT,"verified=true\n");
          NODE
      - name: Report held source intake without claiming a new news cycle
        if: steps.quota.outputs.source_intake != 'true' || steps.quota.outputs.registered_private_max_new_rows == '0'
        env:
          QUOTA_STATE: ${{ steps.quota.outputs.state }}
        run: echo "::notice::D1_FACTUAL_INTAKE_HELD_${QUOTA_STATE}; source fetch and D1 write intentionally not executed."
      - name: Keep registered-source discovery alive without D1 writes during holds
        if: steps.quota.outputs.source_intake != 'true' || steps.quota.outputs.registered_private_max_new_rows == '0'
        run: bun scripts/ops/collect-registered-source-health-only.mjs
      - name: Collect, publish and read back factual JSON
        if: steps.quota.outputs.source_intake == 'true' && steps.quota.outputs.registered_private_max_new_rows != '0'
        shell: bash
        env:
          GEOMACRO_REGISTERED_PRIVATE_MAX_NEW_ROWS: ${{ steps.quota.outputs.registered_private_max_new_rows }}
          PHASE2H_PROVIDER_MAINTENANCE: ${{ steps.b2-db.outputs.verified == 'true' && steps.quota.outputs.phase2h_raw_archive == 'true' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
          B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
          B2_ACCOUNT_QUOTA_REQUIRED: "1"
          B2_ACCOUNT_QUOTA_WORKFLOW_ID: registered_original_archive
          B2_REQUEST_BUDGET: "12"
        run: |
          set -euo pipefail
          bun scripts/ops/publish-all-source-reusable-news-json.ts
      - name: Upload verified bounded all-source factual JSON
        if: steps.quota.outputs.source_intake == 'true' && steps.quota.outputs.registered_private_max_new_rows != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-all-source-reusable-json
          path: |
            artifacts/reusable-source-news/news.json
            artifacts/reusable-source-news/products.json
            artifacts/reusable-source-news/coverage.json
          if-no-files-found: error
          retention-days: 3
