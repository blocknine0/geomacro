name: Global Realtime Production Repair
# Production repair trigger: run only on this isolated repair branch; all existing authoritative/fail-closed gates remain enforced.

on:
  push:
    branches:
      - fix/global-realtime-source-runtime
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: global-realtime-production-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      INVINO_API_KEY: ${{ secrets.INVINO_API_KEY }}
      RELIEFWEB_APP_NAME: ${{ secrets.RELIEFWEB_APP_NAME }}
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      LIVE_STRUCTURE_MAX_ATTEMPTS: 4
      LIVE_STRUCTURE_ATTEMPT_TIMEOUT_MS: 90000
      BREAKING_RSS_ENABLED: true
      BREAKING_RSS_RUN_ONCE: true
      TELEGRAM_ENABLED: false
      GRI_PUBLISH_ENABLED: false
      RAW_SOURCE_SYNC_CONCURRENCY: 12
      RAW_SOURCE_CELL_MAX_ATTEMPTS: 3
      GEOMACRO_FLASH_INGEST_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/live-flash-ingest
      GITHUB_OIDC_AUDIENCE: "https://geomacro.live/actions/live-flash-rss"

    steps:
      - name: Checkout repair revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned RSS worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input -r workers/telegram-flash/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify authoritative production target
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL}"
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY}"
          test "${SUPABASE_PROJECT_ID}" = "ldpwajisioljyjtojvfx"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Deploy realtime flash functions
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          supabase functions deploy live-flash-ingest --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt
          supabase functions deploy live-flash-corroborate --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt

      - name: Smoke-check realtime corroboration OIDC
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          response="$(curl --fail-with-body -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://geomacro.live/actions/live-flash-rss")"
          token="$(printf "%s" "$response" | jq -er ".value")"
          echo "::add-mask::$token"
          printf "GEOMACRO_FLASH_OIDC_TOKEN=%s\n" "$token" >> "$GITHUB_ENV"
          code="$(curl --silent --show-error --output /tmp/realtime-corroborate-health.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $token" -H "x-geomacro-github-oidc-token: $token" -H 'Content-Type: application/json' "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/live-flash-corroborate?mode=health")"
          cat /tmp/realtime-corroborate-health.json
          test "$code" = "200"
          grep -q '"authenticated":true' /tmp/realtime-corroborate-health.json

      - name: Refresh GEOPOLITICS MACRO CRITICAL_MINERALS in parallel
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              export RAW_SOURCE_CATEGORY_ALLOWLIST="$category"
              timeout 15m bun scripts/sync-country-raw-source-mesh.mjs > "country-raw-source-sync-${category}.json" 2>&1
            ) > "category-${category}.log" 2>&1 &
          done
          wait

      - name: Validate all three category refreshes are complete
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"); for (const category of ["GEOPOLITICS","MACRO","CRITICAL_MINERALS"]) { const f="country-raw-source-sync-"+category+".json"; if(!fs.existsSync(f)) throw new Error("MISSING_"+f); const x=JSON.parse(fs.readFileSync(f,"utf8")); if(x.ok!==true || x.failed_cells!==0 || x.missing_non_gdelt_paths.length!==0 || x.processed_cells+x.already_fresh_non_gdelt_cells!==195 || x.categories.length!==1 || x.categories[0]!==category) { console.error(JSON.stringify(x,null,2)); process.exit(1); } console.log(JSON.stringify({category,expected_cells:x.expected_cells,processed_cells:x.processed_cells,already_fresh_non_gdelt_cells:x.already_fresh_non_gdelt_cells,failed_cells:x.failed_cells,missing_non_gdelt_paths:x.missing_non_gdelt_paths.length,fragment_ids:x.fragment_ids.length})); }'

      - name: Drain all three category fragment queues in parallel
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              timeout 15m node scripts/drain-live-structure.mjs --fragment-ids-file "country-raw-source-sync-${category}.json"
            ) >> "category-${category}.log" 2>&1 &
          done
          wait

      - name: Final freshness convergence pass after structure drain
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              export RAW_SOURCE_CATEGORY_ALLOWLIST="$category"
              export RAW_SOURCE_FRESHNESS_SAFETY_MARGIN_SECONDS="0"
              timeout 15m bun scripts/sync-country-raw-source-mesh.mjs > "country-raw-source-convergence-${category}.json" 2>&1
            ) > "category-convergence-${category}.log" 2>&1 &
          done
          wait
          node -e 'const fs=require("node:fs"); for (const category of ["GEOPOLITICS","MACRO","CRITICAL_MINERALS"]) { const f="country-raw-source-convergence-"+category+".json"; if(!fs.existsSync(f)) throw new Error("MISSING_"+f); const x=JSON.parse(fs.readFileSync(f,"utf8")); if(x.ok!==true || x.failed_cells!==0 || x.missing_non_gdelt_paths.length!==0 || x.processed_cells+x.already_fresh_non_gdelt_cells!==195 || x.categories.length!==1 || x.categories[0]!==category) { console.error(JSON.stringify(x,null,2)); process.exit(1); } console.log(JSON.stringify({category,expected_cells:x.expected_cells,processed_cells:x.processed_cells,already_fresh_non_gdelt_cells:x.already_fresh_non_gdelt_cells,failed_cells:x.failed_cells,missing_non_gdelt_paths:x.missing_non_gdelt_paths.length,fragment_ids:x.fragment_ids.length})); }'

      - name: Drain final freshness convergence fragments in parallel
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              timeout 15m node scripts/drain-live-structure.mjs --fragment-ids-file "country-raw-source-convergence-${category}.json"
            ) >> "category-convergence-${category}.log" 2>&1 &
          done
          wait
      - name: Verify three-category runtime and GDELT independence
        run: |
          set -euo pipefail
          timeout 10m node scripts/audit-global-raw-source-runtime.mjs
          timeout 10m node scripts/audit-gdelt-dependency-live.mjs

      - name: Run remaining launch-critical realtime tasks
        env:
          INTELLIGENCE_ORCHESTRATOR_MAX_TASKS: 8
          INTELLIGENCE_ORCHESTRATOR_TASK_ALLOWLIST: gdelt_gal,gdelt_v2,open_realtime_mesh,rss_live,realtime_fanout,production_readiness,source_evidence
          INTELLIGENCE_ORCHESTRATOR_FORCE_TASKS: gdelt_gal,rss_live,realtime_fanout
        run: |
          set -euo pipefail
          node scripts/intelligence-orchestrator.mjs 2>&1 | tee intelligence-orchestrator-repair.log

      - name: Final GDELT first-break and scope fanout convergence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/run-gdelt-gal-cycle.mjs 2>&1 | tee gdelt-gal-cycle-final.log
          cycle_status=${PIPESTATUS[0]}
          set -e

          if (( cycle_status != 0 )); then
            echo "GDELT GAL cycle did not seal a new upstream file; checking the authoritative first-break freshness window before failing."
            node --input-type=module -e '
              import { createClient } from "@supabase/supabase-js";
              const url = String(process.env.APP_SUPABASE_URL ?? process.env.SUPABASE_URL ?? "").trim();
              const key = String(process.env.APP_SUPABASE_SERVICE_ROLE_KEY ?? process.env.SUPABASE_SERVICE_ROLE_KEY ?? "").trim();
              if (!url || !key) throw new Error("AUTHORITATIVE_SUPABASE_CREDENTIALS_REQUIRED");
              if (new URL(url).hostname.split(".")[0] !== "ldpwajisioljyjtojvfx") throw new Error("NON_AUTHORITATIVE_SUPABASE_PROJECT");
              const db = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
              const { data, error } = await db.from("live_ingestion_cursors").select("source_key,stream_key,status,last_success_at,last_item_at,consecutive_failures").eq("source_key","gdelt_gal").eq("stream_key","global-relevant").limit(1).maybeSingle();
              if (error) throw new Error(error.message);
              const lastSuccessMs = Date.parse(String(data?.last_success_at ?? ""));
              const ageSeconds = Number.isFinite(lastSuccessMs) ? Math.max(0, (Date.now() - lastSuccessMs) / 1000) : Infinity;
              const fresh = Number.isFinite(lastSuccessMs) && ageSeconds <= 1800 && ["healthy","degraded"].includes(String(data?.status ?? "")) && Number(data?.consecutive_failures ?? 0) === 0;
              console.log(JSON.stringify({ fallback:"UPSTREAM_SOURCE_DELAYED_WITHIN_STRICT_FRESHNESS_WINDOW", source_key:data?.source_key ?? null, stream_key:data?.stream_key ?? null, status:data?.status ?? null, last_success_at:data?.last_success_at ?? null, age_seconds:Math.round(ageSeconds), consecutive_failures:Number(data?.consecutive_failures ?? 0), max_age_seconds:1800, accepted:fresh }, null, 2));
              if (!fresh) process.exit(1);
            '
          fi

      - name: Final freshness convergence after orchestrator
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              export RAW_SOURCE_CATEGORY_ALLOWLIST="$category"
              timeout 15m bun scripts/sync-country-raw-source-mesh.mjs > "country-raw-source-final-${category}.json" 2>&1
            ) > "category-final-${category}.log" 2>&1 &
          done
          wait
          node -e 'const fs=require("node:fs"); for (const category of ["GEOPOLITICS","MACRO","CRITICAL_MINERALS"]) { const f="country-raw-source-final-"+category+".json"; if(!fs.existsSync(f)) throw new Error("MISSING_"+f); const x=JSON.parse(fs.readFileSync(f,"utf8")); if(x.ok!==true || x.failed_cells!==0 || x.missing_non_gdelt_paths.length!==0 || x.processed_cells+x.already_fresh_non_gdelt_cells!==195 || x.categories.length!==1 || x.categories[0]!==category) { console.error(JSON.stringify(x,null,2)); process.exit(1); } console.log(JSON.stringify({category,expected_cells:x.expected_cells,processed_cells:x.processed_cells,already_fresh_non_gdelt_cells:x.already_fresh_non_gdelt_cells,failed_cells:x.failed_cells,missing_non_gdelt_paths:x.missing_non_gdelt_paths.length,fragment_ids:x.fragment_ids.length})); }'

      - name: Drain final orchestrator-convergence fragments in parallel
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              timeout 15m node scripts/drain-live-structure.mjs --fragment-ids-file "country-raw-source-final-${category}.json"
            ) >> "category-final-${category}.log" 2>&1 &
          done
          wait

      - name: Verify final realtime contracts
        run: |
          set -euo pipefail
          timeout 10m node scripts/audit-global-raw-source-runtime.mjs
          timeout 10m node scripts/audit-realtime-scope-fanout.mjs
          timeout 10m node scripts/audit-gdelt-dependency-live.mjs

      - name: Run strict Global Realtime Intelligence 100 gate
        run: |
          set -euo pipefail
          node scripts/audit-global-raw-source-runtime.mjs
          node scripts/audit-gdelt-dependency-live.mjs --strict
          node scripts/audit-realtime-scope-fanout.mjs
          node scripts/audit-global-realtime-source-freshness.mjs
          node scripts/audit-source-certification-census.mjs
          node scripts/audit-global-realtime-intelligence-100.mjs

          jq -e '
            .scope.country_category_cells == 585
            and .scope.expected_country_category_cells == 585
            and .summary.runtime_gdelt_independent_cells == 585
            and .summary.gdelt_only_cells == 0
            and .summary.missing_cells == 0
            and .summary.runtime_non_gdelt_gaps == 0
          ' artifacts/gdelt-dependency-audit/audit.json >/dev/null

          jq -e '
            all(.[]; (.enabled_for_commercial_signals != true or .certification_state == "CERTIFIED"))
          ' artifacts/source-certification-census/sources.json >/dev/null

          jq -e '
            all(.[];
              (.fail_closed == true)
              or (
                .certification_state == "CERTIFIED"
                and .endpoint_check == "PASS"
                and (.rights_check == "COMMERCIAL_OK" or .rights_check == "DERIVED_ONLY")
                and .schema_check == "PASS"
                and .freshness_check == "PASS"
                and .independence_check == "PASS"
              )
            )
          ' artifacts/source-certification-census/paths.json >/dev/null

          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";

          const url = String(process.env.APP_SUPABASE_URL ?? "").trim();
          const key = String(process.env.APP_SUPABASE_SERVICE_ROLE_KEY ?? "").trim();
          if (!url || !key) throw new Error("AUTHORITATIVE_SUPABASE_CREDENTIALS_REQUIRED");
          if (new URL(url).hostname.split(".")[0] !== "ldpwajisioljyjtojvfx") {
            throw new Error("NON_AUTHORITATIVE_SUPABASE_PROJECT");
          }

          const requiredTasks = [
            "gdelt_gal",
            "gdelt_v2",
            "open_realtime_mesh",
            "rss_live",
            "realtime_fanout",
            "production_readiness",
            "source_evidence",
          ];
          const db = createClient(url, key, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const { data, error } = await db
            .from("live_ingestion_cursors")
            .select("stream_key,status,last_success_at,consecutive_failures,cursor")
            .in("stream_key", requiredTasks.map((task) => "orchestrator:" + task));
          if (error) throw error;

          const rows = new Map((data ?? []).map((row) => [String(row.stream_key), row]));
          const bad = [];
          for (const task of requiredTasks) {
            const row = rows.get("orchestrator:" + task);
            const cursor = row?.cursor && typeof row.cursor === "object" ? row.cursor : {};
            if (!row) bad.push({ task, reason: "missing_state" });
            else if (row.status !== "healthy") bad.push({ task, reason: "status", status: row.status });
            else if (Number(row.consecutive_failures ?? 0) !== 0) bad.push({ task, reason: "consecutive_failures", value: row.consecutive_failures });
            else if (cursor.retry_pending === true) bad.push({ task, reason: "retry_pending" });
            else if (!row.last_success_at) bad.push({ task, reason: "missing_last_success_at" });
          }
          if (bad.length) {
            console.error(JSON.stringify({ ok: false, bad }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            ok: true,
            orchestrator_continuity: "GREEN",
            required_tasks: requiredTasks,
          }));
          NODE

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-realtime-production-repair-${{ github.sha }}
          path: |
            country-raw-source-sync-GEOPOLITICS.json
            country-raw-source-sync-MACRO.json
            country-raw-source-sync-CRITICAL_MINERALS.json
            category-GEOPOLITICS.log
            category-MACRO.log
            category-CRITICAL_MINERALS.log
            intelligence-orchestrator-repair.log
          if-no-files-found: warn
          retention-days: 30
