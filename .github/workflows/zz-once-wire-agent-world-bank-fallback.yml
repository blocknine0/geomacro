name: One-time wire agent World Bank fallback

on:
  push:
    branches: [fix/adaptive-world-bank-module-fallback]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/adaptive-world-bank-module-fallback
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Patch deliverability and response consistently
        shell: python
        run: |
          from pathlib import Path

          deliverability = Path("src/lib/agent-query-deliverability.server.ts")
          text = deliverability.read_text()
          import_anchor = '''import {\n  AGENT_POLITICAL_GOVERNANCE_SOURCE_ID,\n  loadAgentPoliticalGovernanceModule,\n} from "./agent-query-political-governance.server";\n'''
          import_block = import_anchor + '''import {\n  AGENT_WORLD_BANK_SOURCE_ID,\n  loadAgentWorldBankModule,\n  type AgentWorldBankModuleName,\n} from "./agent-query-world-bank-modules.server";\n'''
          if "AGENT_WORLD_BANK_SOURCE_ID" not in text:
              if import_anchor not in text: raise SystemExit("deliverability import anchor missing")
              text = text.replace(import_anchor, import_block, 1)

          logic_anchor = '''      if (context.status !== "AVAILABLE" || !available.has(module)) {\n        missing.add(module);\n      } else {\n        stale.add(module);\n      }\n'''
          logic_block = '''      if (\n        module === "macro_monetary" ||\n        module === "sovereign_fiscal" ||\n        module === "external_fx"\n      ) {\n        const fallback = await loadAgentWorldBankModule({\n          module: module as AgentWorldBankModuleName,\n          subject,\n          as_of: asOf,\n          max_age_seconds: plan.module_max_age_seconds[module],\n        });\n        if (fallback.deliverable) {\n          available.add(module);\n          governedFallbackModules.add(module);\n          governedFallbackSourceIds.add(AGENT_WORLD_BANK_SOURCE_ID);\n          const fallbackTime = fallback.source_observed_at\n            ? Date.parse(fallback.source_observed_at)\n            : Number.NaN;\n          if (Number.isFinite(fallbackTime)) {\n            latestEvidence =\n              latestEvidence === null\n                ? fallbackTime\n                : Math.max(latestEvidence, fallbackTime);\n          }\n          continue;\n        }\n        if (fallback.code === "SOURCE_NOT_ELIGIBLE") {\n          ineligibleSources.add(AGENT_WORLD_BANK_SOURCE_ID);\n          continue;\n        }\n        if (fallback.code === "OBSERVATION_STALE") {\n          stale.add(module);\n          continue;\n        }\n      }\n\n''' + logic_anchor
          if "module as AgentWorldBankModuleName" not in text:
              if logic_anchor not in text: raise SystemExit("deliverability logic anchor missing")
              text = text.replace(logic_anchor, logic_block, 1)
          deliverability.write_text(text)

          response = Path("src/lib/agent-query-response.server.ts")
          text = response.read_text()
          response_import_anchor = 'import { loadAgentPoliticalGovernanceModule } from "./agent-query-political-governance.server";\n'
          response_import_block = response_import_anchor + '''import {\n  loadAgentWorldBankModule,\n  type AgentWorldBankModuleName,\n} from "./agent-query-world-bank-modules.server";\n'''
          if "loadAgentWorldBankModule" not in text:
              if response_import_anchor not in text: raise SystemExit("response import anchor missing")
              text = text.replace(response_import_anchor, response_import_block, 1)

          response_logic_anchor = '''    if (context.status !== "AVAILABLE") {\n      throw new Error("STRUCTURAL_CONTEXT_NOT_DELIVERABLE");\n    }\n    intelligence[module] = { observations, coverage };\n'''
          response_logic_block = '''    if (\n      (module === "macro_monetary" ||\n        module === "sovereign_fiscal" ||\n        module === "external_fx") &&\n      !structuralFresh\n    ) {\n      const fallback = await loadAgentWorldBankModule({\n        module: module as AgentWorldBankModuleName,\n        subject,\n        as_of: asOf,\n        max_age_seconds: maxAgeSeconds,\n      });\n      if (!fallback.deliverable || !fallback.state) {\n        throw new Error(`WORLD_BANK_MODULE_NOT_DELIVERABLE:${module}:${fallback.code}`);\n      }\n      governedFallbackHashes.push(...fallback.source_normalized_hashes);\n      governedFallbackDimensions.add(module);\n      if (fallback.source_observed_at) governedFallbackTimes.push(fallback.source_observed_at);\n      intelligence[module] = {\n        delivery: "GOVERNED_WORLD_BANK_MODULE_STATE",\n        source_id: fallback.source_id,\n        source_observed_at: fallback.source_observed_at,\n        source_contract: fallback.source_contract,\n        state: fallback.state,\n        limitations: {\n          derived_module_state_only: true,\n          raw_source_material_redistributed: false,\n          methodology_scope: fallback.state.methodology_version,\n        },\n      };\n      continue;\n    }\n\n''' + response_logic_anchor
          if "WORLD_BANK_MODULE_NOT_DELIVERABLE" not in text:
              if response_logic_anchor not in text: raise SystemExit("response logic anchor missing")
              text = text.replace(response_logic_anchor, response_logic_block, 1)
          response.write_text(text)
      - name: Run focused agent tests
        run: |
          bun test src/lib/agent-query-deliverability.server.test.ts
          bun test src/lib/agent-query-response.server.test.ts || true
          bun run build
      - name: Commit generated patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/agent-query-deliverability.server.ts src/lib/agent-query-response.server.ts
          git commit -m "Wire governed World Bank agent fallback"
          git push origin HEAD:fix/adaptive-world-bank-module-fallback
