name: Temporary Global Country Census

on:
  push:
    branches:
      - ops/refresh-gdelt-production-once
    paths:
      - ".github/workflows/temporary-global-country-census.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GLOBAL_RISK_GATE_CENSUS_OUTPUT: global-risk-gate-country-census.json
      GLOBAL_RISK_GATE_CENSUS_CONCURRENCY: "3"
    steps:
      - name: Checkout one-shot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/refresh-gdelt-production-once
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify authoritative production target
        run: node scripts/db/assert-authoritative-supabase.mjs

      - name: Run country readiness regression tests
        run: |
          bun test \
            src/__tests__/risk-gate-v2-request-readiness.test.ts \
            src/__tests__/risk-gate-v2-global-country-readiness-static.test.ts \
            src/__tests__/risk-gate-v2-governed-module-builders.test.ts \
            src/__tests__/risk-gate-v2-conflict-module-state.test.ts \
            src/__tests__/risk-gate-v2-support-readiness.test.ts

      - name: Generate live country readiness proof
        run: bun scripts/global-risk-gate-country-census.ts --require-any-accepted

      - name: Publish sanitized census summary
        shell: bash
        run: |
          set -euo pipefail
          jq '{generated_at,denominator,summary,claim_boundary}' global-risk-gate-country-census.json

      - name: Upload country readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: temporary-global-country-census
          path: global-risk-gate-country-census.json
          if-no-files-found: error
          retention-days: 7
