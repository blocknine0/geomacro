name: Temporary Global Country Census

on:
  push:
    branches:
      - x402-industry-ready-production-v1
    paths:
      - ".github/workflows/temporary-global-country-census.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GLOBAL_RISK_GATE_CENSUS_OUTPUT: global-risk-gate-country-census.json
      GLOBAL_RISK_GATE_CENSUS_CONCURRENCY: "3"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: x402-industry-ready-production-v1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate production country readiness proof
        run: bun scripts/global-risk-gate-country-census.ts --require-any-accepted
      - name: Publish sanitized summary
        run: jq '{generated_at,denominator,summary,claim_boundary}' global-risk-gate-country-census.json
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v7
        with:
          name: temporary-global-risk-gate-country-readiness
          path: global-risk-gate-country-census.json
          if-no-files-found: error
          retention-days: 7
