name: Deploy D1 Control Plane

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "workers/control-plane/**"
      - ".github/workflows/deploy-control-plane-d1.yml"
      - "src/__tests__/cloudflare-d1-bootstrap-static.test.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-d1-control-plane-production
  cancel-in-progress: false

jobs:
  bootstrap-deploy-accept:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOT_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require existing Cloudflare production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 2; }
          test "${#ROOT_LEDGER_TOKEN}" -ge 32 || { echo "GEOMACRO_COMMERCE_LEDGER_TOKEN must be at least 32 characters"; exit 2; }

      - name: Discover or create the single production D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json
          }
          find_id() {
            node -e '
              let s="";
              process.stdin.on("data", d => s += d);
              process.stdin.on("end", () => {
                const rows = JSON.parse(s);
                const row = rows.find(x => x.name === process.env.D1_DATABASE_NAME);
                process.stdout.write(row?.uuid ?? row?.id ?? "");
              });
            '
          }

          LIST_JSON="$(list_db)"
          DB_ID="$(printf '%s' "$LIST_JSON" | find_id)"
          CREATED=false
          if [ -z "$DB_ID" ]; then
            echo "D1 database not present; creating the single bounded control-plane database."
            npx -y "wrangler@${WRANGLER_VERSION}" d1 create "$D1_DATABASE_NAME" --location apac >/tmp/d1-create.txt
            CREATED=true
            LIST_JSON="$(list_db)"
            DB_ID="$(printf '%s' "$LIST_JSON" | find_id)"
          fi
          test -n "$DB_ID" || { echo "Unable to resolve D1 database id after create/list"; exit 3; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "Resolved D1 database: $D1_DATABASE_NAME (created=$CREATED)"

      - name: Build ephemeral Wrangler production config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('workers/control-plane/wrangler.example.jsonc', 'utf8');
          const id = String(process.env.D1_DATABASE_ID || '').trim();
          if (!/^[0-9a-f-]{20,}$/i.test(id)) throw new Error('INVALID_D1_DATABASE_ID');
          const output = source.replace('REPLACE_WITH_D1_DATABASE_ID', id);
          if (output.includes('REPLACE_WITH_D1_DATABASE_ID')) throw new Error('D1_ID_REPLACEMENT_FAILED');
          fs.writeFileSync('workers/control-plane/wrangler.runtime.jsonc', output);
          NODE

      - name: Apply committed D1 migrations remotely
        working-directory: workers/control-plane
        shell: bash
        run: |
          set -euo pipefail
          npx -y "wrangler@${WRANGLER_VERSION}" d1 migrations apply DB --remote --config wrangler.runtime.jsonc

      - name: Verify D1 schema directly
        working-directory: workers/control-plane
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 execute DB --remote --config wrangler.runtime.jsonc --command "SELECT version FROM schema_meta WHERE name='control-plane' AND version=1;")"
          printf '%s' "$OUT" | grep -q '1' || { echo "D1 schema verification failed"; exit 4; }

      - name: Derive domain-separated control-plane token
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_PLANE_TOKEN="$(node -e "const c=require('crypto'); process.stdout.write(c.createHmac('sha256', process.env.ROOT_LEDGER_TOKEN).update('geomacro-control-plane-v1').digest('hex'))")"
          test "${#CONTROL_PLANE_TOKEN}" -eq 64 || { echo "Control-plane token derivation failed"; exit 5; }
          echo "::add-mask::$CONTROL_PLANE_TOKEN"
          echo "CONTROL_PLANE_TOKEN=$CONTROL_PLANE_TOKEN" >> "$GITHUB_ENV"

      - name: Deploy D1 control-plane Worker with pinned Wrangler
        id: deploy
        working-directory: workers/control-plane
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_LOG="$(mktemp)"
          npx -y "wrangler@${WRANGLER_VERSION}" deploy --config wrangler.runtime.jsonc 2>&1 | tee "$DEPLOY_LOG"
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)"
          test -n "$DEPLOYMENT_URL" || { echo "Wrangler deploy did not emit a workers.dev deployment URL"; exit 6; }
          printf '%s' "$CONTROL_PLANE_TOKEN" | npx -y "wrangler@${WRANGLER_VERSION}" secret put CONTROL_PLANE_TOKEN --config wrangler.runtime.jsonc >/tmp/d1-secret-put.log
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "D1 control-plane Worker deployed and server-only secret configured."

      - name: Require HTTPS deployment origin
        id: origin
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_URL" in
            https://*.workers.dev) ;;
            *) echo "Direct Wrangler did not return the expected HTTPS workers.dev origin"; exit 6 ;;
          esac
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Run no-funds D1 control-plane acceptance
        env:
          CONTROL_PLANE_URL: ${{ steps.origin.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=''
          for attempt in 1 2 3 4 5 6; do
            HEALTH="$(curl -fsS --max-time 10 "$CONTROL_PLANE_URL/health" || true)"
            if printf '%s' "$HEALTH" | grep -q '"ok":true'; then break; fi
            sleep $((attempt * 2))
          done
          printf '%s' "$HEALTH" | grep -q '"schema_version":1' || { echo "D1 Worker health acceptance failed"; exit 7; }
          printf '%s' "$HEALTH" | grep -q '"durable_payload_store":"b2"' || { echo "B2 authority contract missing"; exit 7; }
          printf '%s' "$HEALTH" | grep -q '"commerce_ledger":"durable_object"' || { echo "Commerce authority contract missing"; exit 7; }

          CODE="$(curl -sS -o /tmp/unauth.json -w '%{http_code}' --max-time 10 -X PUT "$CONTROL_PLANE_URL/v1/control/bootstrap_smoke" -H 'content-type: application/json' --data '{"value":{"probe":true},"version":1}')"
          test "$CODE" = "401" || { echo "Unauthenticated control-plane write did not fail closed: HTTP $CODE"; cat /tmp/unauth.json; exit 8; }

          CODE="$(curl -sS -o /tmp/auth.json -w '%{http_code}' --max-time 10 -X PUT "$CONTROL_PLANE_URL/v1/control/bootstrap_smoke" -H "authorization: Bearer $CONTROL_PLANE_TOKEN" -H 'content-type: application/json' --data '{"value":{"probe":true},"version":1}')"
          test "$CODE" = "200" || { echo "Authenticated control-plane write failed: HTTP $CODE"; cat /tmp/auth.json; exit 9; }
          grep -q '"ok":true' /tmp/auth.json || { echo "Authenticated response missing ok=true"; exit 9; }

      - name: Remove bootstrap smoke row directly from D1
        if: success()
        working-directory: workers/control-plane
        shell: bash
        run: |
          set -euo pipefail
          npx -y "wrangler@${WRANGLER_VERSION}" d1 execute DB --remote --config wrangler.runtime.jsonc --command "DELETE FROM control_state WHERE key='bootstrap_smoke';"

      - name: Confirm no paid or destructive activation occurred
        shell: bash
        run: |
          set -euo pipefail
          echo "D1 control-plane bootstrap completed without touching x402 settlement, Coinbase/Circle mainnet payment, Supabase deletion, storage.objects SQL deletion, or B2 deletion."
