name: GOAT Prelaunch Validation Order Sync

on:
  push:
    branches:
      - feat/commercial-distribution-foundation
    paths:
      - ".github/workflows/goat-validation-order-temp.yml"

permissions:
  contents: write

jobs:
  patch-goat-validation-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-distribution-foundation
      - name: Move launch lock after official-origin validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/goat-flow.server.ts')
          s = p.read_text()
          old = '''  if (environment === "mainnet") {\n    assertCommercialLaunchAuthorized("goat_x402");\n  }\n\n  const expected = GOAT_FLOW_ENVIRONMENTS[environment];'''
          new = '''  const expected = GOAT_FLOW_ENVIRONMENTS[environment];'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one early launch-lock block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          anchor = '''  if (\n    parsed.protocol !== "https:" ||\n    parsed.origin !== expected.api_url ||\n    parsed.pathname !== "/" ||\n    parsed.search ||\n    parsed.hash\n  ) {\n    throw new Error("GOATX402_API_URL must match the official selected GOAT Flow origin");\n  }\n\n  const apiKey = requiredEnv("GOATX402_API_KEY", 512);'''
          replacement = '''  if (\n    parsed.protocol !== "https:" ||\n    parsed.origin !== expected.api_url ||\n    parsed.pathname !== "/" ||\n    parsed.search ||\n    parsed.hash\n  ) {\n    throw new Error("GOATX402_API_URL must match the official selected GOAT Flow origin");\n  }\n\n  // Validate provider origin before evaluating production authorization so a\n  // misrouted mainnet configuration fails for the precise trust-boundary reason.\n  // A valid GOAT mainnet origin is still blocked unless the coordinated launch\n  // acknowledgement is explicitly present.\n  if (environment === "mainnet") {\n    assertCommercialLaunchAuthorized("goat_x402");\n  }\n\n  const apiKey = requiredEnv("GOATX402_API_KEY", 512);'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one origin-validation anchor, found {s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
      - name: Verify exact security ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('src/lib/goat-flow.server.ts').read_text()
          origin = s.index('GOATX402_API_URL must match the official selected GOAT Flow origin')
          lock = s.index('assertCommercialLaunchAuthorized("goat_x402")')
          creds = s.index('const apiKey = requiredEnv("GOATX402_API_KEY", 512)')
          if not origin < lock < creds:
              raise SystemExit('GOAT validation order must be origin -> global launch lock -> credentials')
          if s.count('assertCommercialLaunchAuthorized("goat_x402")') != 1:
              raise SystemExit('GOAT global launch lock must appear exactly once')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          if [[ "$changed" != "src/lib/goat-flow.server.ts" ]]; then
            echo "ERROR: unexpected changed files: $changed" >&2
            exit 1
          fi
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/goat-flow.server.ts
          git commit -m "security: validate GOAT origin before launch authorization"
          git push origin HEAD:feat/commercial-distribution-foundation
