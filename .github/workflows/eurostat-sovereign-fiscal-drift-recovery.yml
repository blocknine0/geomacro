name: Eurostat Sovereign Fiscal Drift Recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-multi-source-registry-production.yml"
      - ".github/workflows/eurostat-sovereign-fiscal-drift-recovery.yml"
      - "supabase/migrations/920_multi_source_commercial_registry.sql"
      - "supabase/migrations/925_enable_eurostat_sovereign_fiscal_signals.sql"
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  group: eurostat-sovereign-fiscal-drift-recovery
  cancel-in-progress: false

jobs:
  recover-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EUROSTAT_SHADOW_CENSUS_OUTPUT: eurostat-drift-shadow-census.json
      GLOBAL_RISK_GATE_CENSUS_OUTPUT: eurostat-drift-global-census.json

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate authoritative production database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_SUPABASE_PROJECT_REF" || { echo "::error::Wrong production project id"; exit 1; }
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const db = new URL(process.env.SUPABASE_DB_URL);
          const api = new URL(process.env.SUPABASE_URL);
          const direct = db.hostname === `db.${ref}.supabase.co` && db.username === 'postgres';
          const pooler = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          if (!['postgres:', 'postgresql:'].includes(db.protocol) || (!direct && !pooler)) {
            throw new Error('SUPABASE_DB_URL is not the authoritative production database');
          }
          if (!db.password || db.pathname !== '/postgres') throw new Error('Invalid production database URL');
          if (api.hostname !== `${ref}.supabase.co`) throw new Error('SUPABASE_URL is not the authoritative production API');
          console.log('PASS: authoritative production database and API identities confirmed.');
          NODE

      - name: Inspect current source state and release proof
        id: state
        shell: bash
        run: |
          set -euo pipefail
          source_state="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select commercial_usage_status || '|' || enabled_for_ingestion::text || '|' || enabled_for_commercial_signals::text from public.live_external_sources where source_id='eurostat_government_finance'")"
          case "$source_state" in
            'COMMERCIAL_OK|true|false') changed='true' ;;
            'COMMERCIAL_OK|true|true') changed='false' ;;
            *) echo "::error::Eurostat source is outside the governed recovery boundary: $source_state"; exit 1 ;;
          esac

          manifest="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select verified_rows || '|' || partial_rows || '|' || rejected_rows || '|' || unmapped_rows || '|' || write_completed::text from public.live_source_release_manifests where source_id='eurostat_government_finance' order by coverage_end desc nulls last, retrieved_at desc limit 1")"
          IFS='|' read -r verified partial rejected unmapped written <<< "$manifest"
          test "$written" = 'true' || { echo "::error::Eurostat latest release manifest is not write-complete"; exit 1; }
          test "$verified" -ge 20 || { echo "::error::Eurostat latest release has fewer than 20 verified peers: $verified"; exit 1; }
          test "$partial" = '0' && test "$rejected" = '0' && test "$unmapped" = '0' || { echo "::error::Eurostat latest release manifest is not clean: $manifest"; exit 1; }

          rows="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.live_eurostat_government_debt_latest")"
          test "$rows" -ge 20 || { echo "::error::Eurostat latest governed view has fewer than 20 rows: $rows"; exit 1; }

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          printf '{"source_state":"%s","manifest":"%s","latest_view_rows":%s,"activation_needed":%s}\n' "$source_state" "$manifest" "$rows" "$changed" | tee eurostat-drift-source-evidence.json

      - name: Reproduce shadow acceptance before recovery
        if: steps.state.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-eurostat-sovereign-fiscal-shadow-census.ts > eurostat-drift-shadow-census.log 2>&1
          test -s "$EUROSTAT_SHADOW_CENSUS_OUTPUT"
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.EUROSTAT_SHADOW_CENSUS_OUTPUT, 'utf8'));
          const accepted = report.countries?.filter((row) => row.status === 'SHADOW_ACCEPTED') ?? [];
          if ((report.summary?.eurostat_fiscal_candidate_country_count ?? 0) < 20) throw new Error('Fewer than 20 Eurostat candidate countries');
          if (accepted.length < 1) throw new Error('No country passes the Eurostat sovereign-fiscal shadow methodology');
          if (report.source_activation?.commercial_signals_enabled !== false) throw new Error('Shadow census expected commercial signals to be disabled before recovery');
          console.log(JSON.stringify({ shadow_accepted_count: accepted.length }));
          NODE

      - name: Restore only the previously approved Eurostat commercial signal flag
        if: steps.state.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/925_enable_eurostat_sovereign_fiscal_signals.sql
          state="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select commercial_usage_status || '|' || enabled_for_ingestion::text || '|' || enabled_for_commercial_signals::text from public.live_external_sources where source_id='eurostat_government_finance'")"
          test "$state" = 'COMMERCIAL_OK|true|true' || { echo "::error::Eurostat signal recovery failed: $state"; exit 1; }
          echo 'PASS: previously approved Eurostat commercial signal state restored.'

      - name: Prove actual global Risk Gate acceptance after recovery
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/global-risk-gate-country-census.ts --require-any-accepted > eurostat-drift-global-census.log 2>&1
          test -s "$GLOBAL_RISK_GATE_CENSUS_OUTPUT"
          node <<'NODE'
          const fs = require('fs');
          const actual = JSON.parse(fs.readFileSync(process.env.GLOBAL_RISK_GATE_CENSUS_OUTPUT, 'utf8'));
          const accepted = (actual.countries ?? []).filter((row) => row.status === 'ACCEPTED');
          const eurostatAccepted = accepted.filter((row) =>
            row.module_states?.some((state) => state.module === 'sovereign_fiscal' && String(state.methodology_version).includes('eurostat-general-government'))
          );
          if (accepted.length < 1) throw new Error('Global Risk Gate still has zero accepted countries');
          if (eurostatAccepted.length < 1) throw new Error('No accepted country is using the approved Eurostat sovereign-fiscal fallback');
          if (!accepted.every((row) => row.risk_gate?.execution_authorized === false)) {
            throw new Error('An accepted country unexpectedly authorizes execution');
          }
          const evidence = {
            denominator: actual.denominator?.count ?? null,
            accepted_country_count: accepted.length,
            eurostat_accepted_country_count: eurostatAccepted.length,
            eurostat_accepted_countries: eurostatAccepted.map((row) => row.iso3).sort(),
            execution_authorized_is_false: true,
          };
          fs.writeFileSync('eurostat-drift-recovery-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Emergency rollback only if this run changed the source state and proof failed
        if: ${{ failure() && steps.state.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "update public.live_external_sources set enabled_for_commercial_signals=false, updated_at=now() where source_id='eurostat_government_finance' and commercial_usage_status='COMMERCIAL_OK' and enabled_for_ingestion=true;"
          echo 'ROLLBACK: Eurostat commercial signal flag returned to false because recovery proof failed.'

      - name: Verify final governed state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select commercial_usage_status || '|' || enabled_for_ingestion::text || '|' || enabled_for_commercial_signals::text from public.live_external_sources where source_id='eurostat_government_finance'")"
          test "$state" = 'COMMERCIAL_OK|true|true' || { echo "::error::Final Eurostat governed state is not active: $state"; exit 1; }
          test -s eurostat-drift-recovery-evidence.json
          echo 'PASS: Eurostat source state and global country census are production-proven.'

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eurostat-sovereign-fiscal-drift-recovery
          path: |
            eurostat-drift-source-evidence.json
            eurostat-drift-shadow-census.log
            eurostat-drift-shadow-census.json
            eurostat-drift-global-census.log
            eurostat-drift-global-census.json
            eurostat-drift-recovery-evidence.json
          if-no-files-found: warn
          retention-days: 30
