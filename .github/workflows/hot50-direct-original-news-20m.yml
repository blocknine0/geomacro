      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Refuse vacuous schedule success unless actual publisher collection job completed
        run: node scripts/ops/verify-hot50-continuity-run.mjs --scheduled-run
