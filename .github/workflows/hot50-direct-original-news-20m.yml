name: Hot-50 Direct Original News (20-Minute Cron)

# Poll all eligible existing three-domain direct RSS/Atom/JSON publishers,
# Hot-50 first, then global sources; no Google index or Telegram.
# All actual D1 writes use the EXISTING authenticated private source-only
# writer and shared cross-workflow mutex. Github cron is best effort;
# transport success is not proof of native events or B2 archiving.
on:
  schedule:
    - cron: "6,26,46 * * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/hot50-direct-original-news-20m.yml"
      - "scripts/lib/hot-50-direct-20m-sources.mjs"
      - "scripts/lib/hot-50-direct-20m-sources.test.mjs"
      - "scripts/ops/phase2i-source-only-raw-tick.ts"
      - "scripts/lib/phase2i-durable-queue-client.mjs"
      - "scripts/tests/phase2i-durable-queue.test.mjs"
      - "workers/phase2i-durable-queue/worker.mjs"
      - "scripts/ops/plan-d1-bundled-work.mjs"
      - "scripts/tests/minimum-daily-bundled-source.test.mjs"
      - "scripts/ops/preload-phase2i-encrypted-backlog.mjs"
      - "scripts/lib/phase2i-durable-queue-client.mjs"
      - "scripts/tests/phase2i-durable-queue.test.mjs"
      - "workers/phase2i-durable-queue/worker.mjs"
      - "config/hot-50-four-lane-source-crosswalk.v1.json"
      - "config/hot50-pinned-backup-sources.v1.json"
      - "scripts/lib/hot-50-four-lane-source-crosswalk.mjs"
      - "scripts/lib/hot-50-four-lane-source-crosswalk.test.mjs"
      - "scripts/lib/private-osint-15m-collector.mjs"
      - "scripts/lib/private-osint-15m-collector.test.mjs"
      - "scripts/lib/three-domain-global-direct-20m-sources.mjs"
      - "scripts/lib/geopolitics-continuity-sources.mjs"
      - "scripts/lib/geopolitics-continuity-sources.test.mjs"
      - "scripts/lib/macro-minerals-continuity-sources.mjs"
      - "scripts/lib/macro-minerals-continuity-sources.test.mjs"
      - "scripts/lib/hot50-three-category-official-gap-priority.mjs"
      - "scripts/lib/hot50-three-category-official-gap-priority.test.mjs"
      - "config/hot50-three-category-official-gap-priority.v1.json"
      - "scripts/ops/probe-hot50-official-gap-source-health.mjs"
      - "scripts/ops/probe-macro-minerals-continuity-feeds.mjs"
      - "scripts/ops/probe-geopolitics-continuity-feeds.mjs"
      - "scripts/lib/three-domain-global-direct-20m-sources.test.mjs"
      - "scripts/lib/hot-50-retired-backup-sources.mjs"
      - "scripts/lib/hot-50-retired-backup-sources.test.mjs"
      - "scripts/ops/probe-hot50-retired-backup-transports.mjs"
      - "config/hot-50-retired-direct-feed-backups.v1.json"
      - "scripts/tests/hot50-fresh-priority-d1.test.mjs"
      - "scripts/ops/private-osint-stage-held.ts"
      - "scripts/lib/four-lane-free-source-rights.mjs"
      - "scripts/lib/four-lane-free-source-rights.test.mjs"
      - "scripts/tests/hot50-continuity-independent-fallback.test.mjs"
      - "scripts/ops/verify-hot50-continuity-run.mjs"
      - "scripts/tests/hot50-continuity-runtime.test.mjs"
      - "config/four-lane-free-source-rights.v1.json"
      - "scripts/lib/four-lane-free-source-rights.mjs"
      - "scripts/lib/four-lane-free-source-rights.test.mjs"
      - "scripts/tests/hot50-continuity-independent-fallback.test.mjs"
      - "scripts/ops/verify-hot50-continuity-run.mjs"
      - "scripts/tests/hot50-continuity-runtime.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hot50-direct-original-news-20m.yml"
      - "scripts/lib/hot-50-direct-20m-sources.mjs"
      - "scripts/lib/hot-50-direct-20m-sources.test.mjs"
      - "scripts/ops/phase2i-source-only-raw-tick.ts"
      - "scripts/lib/phase2i-durable-queue-client.mjs"
      - "scripts/tests/phase2i-durable-queue.test.mjs"
      - "workers/phase2i-durable-queue/worker.mjs"
      - "scripts/ops/plan-d1-bundled-work.mjs"
      - "scripts/tests/minimum-daily-bundled-source.test.mjs"
      - "scripts/ops/preload-phase2i-encrypted-backlog.mjs"
      - "scripts/lib/phase2i-durable-queue-client.mjs"
      - "scripts/tests/phase2i-durable-queue.test.mjs"
      - "workers/phase2i-durable-queue/worker.mjs"
      - "config/hot-50-four-lane-source-crosswalk.v1.json"
      - "config/hot50-pinned-backup-sources.v1.json"
      - "scripts/lib/hot-50-four-lane-source-crosswalk.mjs"
      - "scripts/lib/hot-50-four-lane-source-crosswalk.test.mjs"
      - "scripts/lib/private-osint-15m-collector.mjs"
      - "scripts/lib/private-osint-15m-collector.test.mjs"
      - "scripts/lib/three-domain-global-direct-20m-sources.mjs"
      - "scripts/lib/geopolitics-continuity-sources.mjs"
      - "scripts/lib/geopolitics-continuity-sources.test.mjs"
      - "scripts/lib/macro-minerals-continuity-sources.mjs"
      - "scripts/lib/macro-minerals-continuity-sources.test.mjs"
      - "scripts/lib/hot50-three-category-official-gap-priority.mjs"
      - "scripts/lib/hot50-three-category-official-gap-priority.test.mjs"
      - "config/hot50-three-category-official-gap-priority.v1.json"
      - "scripts/ops/probe-hot50-official-gap-source-health.mjs"
      - "scripts/ops/probe-macro-minerals-continuity-feeds.mjs"
      - "scripts/ops/probe-geopolitics-continuity-feeds.mjs"
      - "scripts/lib/three-domain-global-direct-20m-sources.test.mjs"
      - "scripts/lib/hot-50-retired-backup-sources.mjs"
      - "scripts/lib/hot-50-retired-backup-sources.test.mjs"
      - "scripts/ops/probe-hot50-retired-backup-transports.mjs"
      - "config/hot-50-retired-direct-feed-backups.v1.json"
      - "scripts/tests/hot50-fresh-priority-d1.test.mjs"
      - "scripts/ops/private-osint-stage-held.ts"
      - "scripts/lib/four-lane-free-source-rights.mjs"
      - "scripts/lib/four-lane-free-source-rights.test.mjs"
      - "config/four-lane-free-source-rights.v1.json"
      - "scripts/lib/four-lane-free-source-rights.mjs"
      - "scripts/lib/four-lane-free-source-rights.test.mjs"

permissions:
  contents: read
  actions: read

# Prevent push/PR verification from replacing an actual 20-minute source run.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'geomacro-hot50-direct20m-scheduled' || github.event_name == 'pull_request' && format('geomacro-hot50-direct20m-pr-{0}', github.event.pull_request.number) || format('geomacro-hot50-direct20m-{0}', github.event_name) }}
  cancel-in-progress: false

jobs:
  source-contract:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify 50-country priority, global native feeds, D1 budget, and 20m cron
        run: |
          set -euo pipefail
          node --check scripts/lib/hot-50-direct-20m-sources.mjs
          node --test scripts/lib/hot-50-direct-20m-sources.test.mjs
          node --test scripts/lib/three-domain-global-direct-20m-sources.test.mjs
          node --test scripts/lib/geopolitics-continuity-sources.test.mjs scripts/lib/macro-minerals-continuity-sources.test.mjs scripts/lib/hot50-three-category-official-gap-priority.test.mjs
          node --check scripts/ops/probe-macro-minerals-continuity-feeds.mjs
          node --check scripts/ops/probe-geopolitics-continuity-feeds.mjs
          node --check scripts/ops/probe-hot50-official-gap-source-health.mjs
          node --test scripts/lib/hot-50-retired-backup-sources.test.mjs
          node --check scripts/ops/probe-hot50-retired-backup-transports.mjs
          node --test scripts/tests/hot50-fresh-priority-d1.test.mjs
          node --test scripts/tests/hot50-continuity-independent-fallback.test.mjs scripts/tests/direct20m-source-health-proof.test.mjs
          node --test scripts/tests/hot50-continuity-runtime.test.mjs
          node --input-type=module -e 'import {threeDomainGlobal20mPublisherRegistry} from "./scripts/lib/three-domain-global-direct-20m-sources.mjs"; console.log(JSON.stringify({schema:"geomacro.global-three-domain-20m-source-census.v1",...threeDomainGlobal20mPublisherRegistry(new Date()).summary}))'
          node --test scripts/lib/four-lane-free-source-rights.test.mjs
          node --test scripts/tests/minimum-daily-bundled-source.test.mjs
          node --check scripts/ops/preload-phase2i-encrypted-backlog.mjs
          node --test scripts/tests/phase2i-durable-queue.test.mjs
          node --check workers/phase2i-durable-queue/worker.mjs
      - name: Read-only transport probe of 14 source-specific backup URLs
        if: github.event_name == 'pull_request'
        run: node scripts/ops/probe-hot50-retired-backup-transports.mjs
      - name: Probe 23 prioritized official original candidates across all three categories (read-only)
        if: github.event_name == 'pull_request'
        run: node scripts/ops/probe-hot50-official-gap-source-health.mjs
      - name: Save source-only first-party native-date/transport states
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-hot50-three-category-official-gap-health-${{ github.run_id }}
          path: /tmp/geomacro-hot50-official-gap-source-health.json
          retention-days: 7
          if-no-files-found: warn
      - name: Probe Macro/FX and Critical Minerals official alternate publisher feeds (read-only)
        if: github.event_name == 'pull_request'
        run: node scripts/ops/probe-macro-minerals-continuity-feeds.mjs
      - name: Save official Macro/Minerals HTTP and native-date states (no article payloads)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-macro-minerals-continuity-probe-${{ github.run_id }}
          path: /tmp/geomacro-macro-minerals-continuity-readonly.json
          retention-days: 7
          if-no-files-found: warn
      - name: Probe 15 geopolitical alternates without ingesting or bypassing denied publishers
        if: github.event_name == 'pull_request'
        run: node scripts/ops/probe-geopolitics-continuity-feeds.mjs
      - name: Save per-source geopolitics HTTP and native candidate states (no article payloads)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-geopolitics-continuity-probe-${{ github.run_id }}
          path: /tmp/geomacro-geopolitics-continuity-readonly.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save real transport statuses (no publisher payloads)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-hot50-backup-live-probe-${{ github.run_id }}
          path: /tmp/geomacro-hot50-backup-live-probe.json
          if-no-files-found: warn
          retention-days: 7


  quota-admission:
    name: Reserved Free D1 source intake for next protected 20-minute microbundle
    needs: source-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    outputs:
      source_intake: ${{ steps.budget.outputs.source_intake }}
      critical: ${{ steps.budget.outputs.critical }}
      research: ${{ steps.budget.outputs.research }}
      source_intake_max_new_rows: ${{ steps.budget.outputs.source_intake_max_new_rows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Check account-wide D1 free quota including all remaining 20m slots
        id: budget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs
      - name: Quota HELD is not ingestion
        if: steps.budget.outputs.source_intake != 'true'
        run: echo "::warning::HOT50_DIRECT_20M_SOURCE_INTAKE_HELD; no D1 news inserted"

  collect-direct-20m:
    name: Fetch pinned direct publishers and stage native originals into canonical private D1
    needs: [source-contract, quota-admission]
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.quota-admission.result == 'success' &&
      needs.quota-admission.outputs.source_intake == 'true'
    # Shared with both existing 15-minute private original producer and the
    # five-minute canonical fastlane, so no simultaneous D1 writer races.
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Recover latest authenticated encrypted original queue from same protected source store
        env:
          GH_TOKEN: ${{ github.token }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_SOURCE_INTAKE_ONLY: "1"
          PHASE2I_PROVIDER_SOURCE_INTAKE: ${{ needs.quota-admission.outputs.source_intake }}
          GEOMACRO_PHASE2I_PRIOR_QUEUE: ${{ runner.temp }}/phase2i-previous-source-queue.json
        run: |
          set -euo pipefail
          node scripts/ops/preload-phase2i-encrypted-backlog.mjs
      - name: Poll three-domain global direct feeds, dedupe with existing queue, read back quota-admitted D1 originals
        env:
          GEOMACRO_SOURCE_REGISTRY_MODE: THREE_DOMAIN_DIRECT_20M
          GEOMACRO_SOURCE_INTAKE_ONLY: "1"
          PHASE2I_PROVIDER_SOURCE_INTAKE: ${{ needs.quota-admission.outputs.source_intake }}
          PHASE2I_PROVIDER_CRITICAL: ${{ needs.quota-admission.outputs.critical }}
          PHASE2I_PROVIDER_RESEARCH: ${{ needs.quota-admission.outputs.research }}
          PHASE2I_PROVIDER_MAX_NEW_ROWS: ${{ needs.quota-admission.outputs.source_intake_max_new_rows }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_PHASE2I_PRIOR_QUEUE: ${{ runner.temp }}/phase2i-previous-source-queue.json
          GEOMACRO_PHASE2I_QUEUE_CIPHERTEXT: ${{ runner.temp }}/phase2i-ciphertext/queue.json
          GEOMACRO_PHASE2I_DURABLE_URL: ${{ vars.GEOMACRO_PHASE2I_DURABLE_URL }}
          GEOMACRO_PHASE2I_DURABLE_TOKEN: ${{ secrets.GEOMACRO_PHASE2I_DURABLE_TOKEN }}
          GEOMACRO_SOURCE_WEBSITE_HANDOFF: ${{ runner.temp }}/geomacro-source-website-handoff.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bun scripts/ops/phase2i-source-only-raw-tick.ts
      - name: Require actual three-category native publisher runtime proof (D1-admitted)
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/geomacro-direct20m-source-proof.json" | \
            node scripts/ops/verify-hot50-continuity-run.mjs --source-health ADMITTED
      - name: Retain source-wise runtime health and D1 readback counts (no publisher article bytes)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-direct20m-source-health-${{ github.run_id }}
          path: ${{ runner.temp }}/geomacro-direct20m-source-proof.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
      - name: Save ONLY 72h AEAD ciphertext; never upload raw original titles/links
        if: vars.GEOMACRO_PHASE2I_DURABLE_URL == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-private-phase2i-72h-ciphertext
          path: ${{ runner.temp }}/phase2i-ciphertext/queue.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Wipe ephemeral decrypted queue and private website handoff
        if: always()
        env:
          GEOMACRO_PHASE2I_PRIOR_QUEUE: ${{ runner.temp }}/phase2i-previous-source-queue.json
          GEOMACRO_SOURCE_WEBSITE_HANDOFF: ${{ runner.temp }}/geomacro-source-website-handoff.json
        run: rm -f -- "$GEOMACRO_PHASE2I_PRIOR_QUEUE" "$GEOMACRO_SOURCE_WEBSITE_HANDOFF"

  encrypted-held-three-domain-20m:
    name: Preserve three-domain Hot50 native source collection when D1 admission or D1 write fails
    # Recovery also runs if D1 admission was SKIPPED or its admitted writer
    # failed or skipped AFTER quota PASS. Source-only; no D1/paid work.
    # It NEVER retries D1, signs GRO or marks an original as D1 archived.
    needs: [source-contract, quota-admission, collect-direct-20m]
    if: >-
      always() &&
      needs.source-contract.result == 'success' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.quota-admission.result == 'failure' ||
       needs.quota-admission.result == 'skipped' ||
       (needs.quota-admission.result == 'success' &&
        (needs.quota-admission.outputs.source_intake != 'true' ||
         needs.collect-direct-20m.result != 'success')))
    concurrency:
      group: geomacro-hot50-held-publisher-fetch
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      GEOMACRO_HELD_R2_CONFIGURED: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID != '' && secrets.GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Poll same global native publishers, seal qualifying items, do not write HELD D1
        env:
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
          GEOMACRO_SOURCE_REGISTRY_MODE: THREE_DOMAIN_DIRECT_20M
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/private-osint-stage-held.ts
      - name: Require actual three-category native publisher runtime proof (quota-held encrypted)
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/geomacro-direct20m-source-proof.json" | \
            node scripts/ops/verify-hot50-continuity-run.mjs --source-health HELD
      - name: Mirror held ciphertext to dedicated private R2 when configured
        id: held_r2_mirror
        continue-on-error: true
        if: vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET != '' && env.GEOMACRO_HELD_R2_CONFIGURED == 'true'
        env:
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
          GEOMACRO_PRIVATE_OSINT_R2_BUCKET: ${{ vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET }}
          GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID }}
          GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/private-osint-mirror-held-to-r2.mjs
      - name: Warn when optional R2 durability is unverified; retain encrypted GitHub artifact
        if: steps.held_r2_mirror.outcome == 'failure'
        run: echo "::warning::HOT50_R2_DURABLE_ESCROW_FAILED; retain GitHub ciphertext and mark remote durability unverified"
      - name: Retain source-wise transport states from quota-held publisher sweep (D1 acknowledgements unknown)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-direct20m-source-health-${{ github.run_id }}
          path: ${{ runner.temp }}/geomacro-direct20m-source-proof.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
      - name: Keep only encrypted eligible native-dated source observations for automated existing replay
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-encrypted-private-osint-held
          path: /tmp/geomacro-encrypted-held-spool/sealed.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0


  # A green push/PR contract alone cannot be called a 20m live collection.
  # This scheduled-only job fails if BOTH real collectors were skipped or
  # failed; independent runtime proof executes before either job succeeds.
  runtime-source-sweep-acceptance:
    needs: [source-contract, quota-admission, collect-direct-20m, encrypted-held-three-domain-20m]
    if: >-
      always() &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      GEOMACRO_HOT50_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
