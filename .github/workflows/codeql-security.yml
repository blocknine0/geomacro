name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Fork pull requests receive a read-only token that cannot upload SARIF.
    # The same commit will still be scanned after merge/push to main.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify security-patched Zod lockfile
        run: node scripts/security/assert-patched-zod.mjs
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:javascript-typescript"
      - name: CodeQL safe finding-location receipt
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const path='../results/javascript.sarif';
          if(!existsSync(path)){console.log('CODEQL_SARIF_NOT_PRESENT');process.exit(0);}
          const doc=JSON.parse(readFileSync(path,'utf8'));
          for(const run of doc.runs??[])for(const finding of run.results??[]){
            const where=finding.locations?.[0]?.physicalLocation;
            const path=where?.artifactLocation?.uri??'';
            if(!path.includes('mineral-statistical-official')&&!path.includes('private-osint-mineral'))continue;
            console.log(JSON.stringify({schema:'geomacro.codeql-safe-rule-location.v1',rule_id:finding.ruleId,
              file:path,line:where?.region?.startLine??null,
              severity:finding.level??null}));
          }
          NODE
