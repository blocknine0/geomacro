name: Temp Testnet RC Generate

on:
  push:
    branches:
      - feat/testnet-e2e-release-candidate

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/testnet-e2e-release-candidate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate embedded official Geomacro logo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://geomacro.live/__l5e/assets-v1/9118c3e7-7750-4173-90cc-dd0445585e92/geomacro-logo.png" -o /tmp/geomacro-logo.png
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('/tmp/geomacro-logo.png')
          data = base64.b64encode(p.read_bytes()).decode('ascii')
          out = Path('src/lib/geomacro-logo-embedded.ts')
          out.write_text(
              '// Official Geomacro logo, same asset used by src/components/wordmark.tsx.\n'
              '// Embedded so server-rendered SVG social cards are self-contained.\n'
              'export const GEOMACRO_LOGO_INTRINSIC_WIDTH = 607;\n'
              'export const GEOMACRO_LOGO_INTRINSIC_HEIGHT = 177;\n'
              'export const GEOMACRO_LOGO_DATA_URI =\n'
              f'  "data:image/png;base64,{data}";\n',
              encoding='utf-8',
          )
          PY
      - name: Regenerate route tree and build
        run: bun run build
      - name: Run focused tests
        run: bunx vitest run src/__tests__/testnet-social-card.test.ts src/__tests__/testnet-tester-route-bridge.test.ts
      - name: Run app tests
        run: bun run test:app
      - name: Commit generated files when changed
        shell: bash
        run: |
          set -euo pipefail
          git add src/lib/geomacro-logo-embedded.ts src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(testnet): generate release candidate assets"
          git push origin HEAD:feat/testnet-e2e-release-candidate
