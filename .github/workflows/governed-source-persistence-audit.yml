name: Governed source persistence audit
on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/audit-governed-source-persistence.mjs"
      - ".github/workflows/governed-source-persistence-audit.yml"
permissions: {contents: read}
concurrency: {group: governed-source-persistence-audit, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Validate production secrets
        run: |
          set -euo pipefail
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY; do test -n "${!name:-}" || { echo "::error::Missing ${name}"; exit 1; }; done
      - name: Audit persisted governed observations
        run: bun run scripts/audit-governed-source-persistence.mjs
