name: Current Original Private Signing Review Intake (No Funds)

# First factual evidence stage only: *real* publisher bytes and native time.
# Never writes protected/private source URL or title to a public artifact.
# NEVER signs a fact, licenses an article, enables x402 or patches hot TTL.
on:
  workflow_dispatch:
    inputs:
      country_iso3:
        description: "Optional canonical ISO3 (default uses current journal leads or canonical 195 rotation)"
        required: false
        type: string
        default: ""
  schedule:
    # One bounded direct-issuer scan/hour to catch genuine <=90min originals
    # before the independently reviewed current GRI clock expires.
    # Best-effort GitHub schedule, not a provider real-time SLA.
    # Per-run hard cap remains 12 discovery + 6 page + 6 byte GETs.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "src/lib/original-verification-policy.ts"
      - "src/lib/priority-original-review-country.test.ts"
      - "src/lib/priority-original-review-country.ts"
      - "src/lib/country-195-search-slot-recovery.test.ts"
      - "src/lib/on-demand-global-index-rescue.server.test.ts"
      - ".github/workflows/current-original-private-signing-intake.yml"
      - "scripts/ops/prepare-first-original-signing-input.ts"
      - "scripts/ops/prepare-first-original-signing-input.test.ts"
      - "scripts/lib/private-original-signing-review-intake.mjs"
      - "scripts/lib/private-original-signing-review-intake.test.mjs"
      - "scripts/lib/private-original-intake-funnel.mjs"
      - "scripts/lib/original-review-opportunity-router.mjs"
      - "scripts/lib/original-review-opportunity-router.test.mjs"
      - "scripts/lib/private-original-review-b2-handoff.mjs"
      - "scripts/lib/private-original-review-b2-handoff.test.mjs"
      - "scripts/ops/export-private-original-review-lead.mjs"
      - "scripts/ops/export-private-original-review-lead.test.mjs"
      - "scripts/lib/private-original-intake-funnel.test.mjs"
      - "scripts/lib/geomacro-original-page-readback.mjs"
      - "scripts/lib/govuk-original-content-clock.mjs"
      - "scripts/lib/govuk-original-content-clock.test.mjs"
      - "scripts/lib/geomacro-original-page-readback.test.mjs"
      - "src/lib/on-demand-global-discovery.server.ts"
      - "scripts/lib/on-demand-country-publisher-mesh.mjs"
      - "config/private-osint-working-sources.v1.json"
      - "config/private-osint-national-gap-feeds.v1.json"
      - "config/private-osint-local-rss-candidates.v1.json"
      - "config/private-osint-official-feed-additions.v1.json"
      - "config/private-osint-macro-minerals-additions.v1.json"
      - "config/private-osint-regional-corridor-additions.v1.json"
      - "scripts/lib/global-official-release-feeds.mjs"
      - "scripts/lib/global-official-release-fallbacks.test.mjs"
      - "src/lib/on-demand-original-feed-freshness.test.ts"
      # First-party original publisher native-clock changes must re-run the
      # *protected main* original review, not just frontend news rendering.
      # PRs still execute offline tests only; no extra cron or source quota.
      - "src/lib/stateless-canada-original.server.ts"
      - "src/lib/stateless-public-intelligence.server.ts"
      - "src/lib/stateless-publisher-text.ts"
      - "scripts/lib/official-original-article-date.mjs"
  pull_request:
    paths:
      - "src/lib/original-verification-policy.ts"
      - "src/lib/priority-original-review-country.test.ts"
      - "src/lib/priority-original-review-country.ts"
      - "src/lib/country-195-search-slot-recovery.test.ts"
      - "src/lib/on-demand-global-index-rescue.server.test.ts"
      - ".github/workflows/current-original-private-signing-intake.yml"
      - "scripts/ops/prepare-first-original-signing-input.ts"
      - "scripts/ops/prepare-first-original-signing-input.test.ts"
      - "scripts/lib/private-original-signing-review-intake.mjs"
      - "scripts/lib/private-original-signing-review-intake.test.mjs"
      - "scripts/lib/private-original-intake-funnel.mjs"
      - "scripts/lib/original-review-opportunity-router.mjs"
      - "scripts/lib/original-review-opportunity-router.test.mjs"
      - "scripts/lib/private-original-review-b2-handoff.mjs"
      - "scripts/lib/private-original-review-b2-handoff.test.mjs"
      - "scripts/ops/export-private-original-review-lead.mjs"
      - "scripts/ops/export-private-original-review-lead.test.mjs"
      - "scripts/lib/private-original-intake-funnel.test.mjs"
      - "scripts/lib/geomacro-original-page-readback.mjs"
      - "scripts/lib/govuk-original-content-clock.mjs"
      - "scripts/lib/govuk-original-content-clock.test.mjs"
      - "scripts/lib/geomacro-original-page-readback.test.mjs"
      - "src/lib/on-demand-global-discovery.server.ts"
      - "scripts/lib/on-demand-country-publisher-mesh.mjs"
      - "config/private-osint-working-sources.v1.json"
      - "config/private-osint-national-gap-feeds.v1.json"
      - "config/private-osint-local-rss-candidates.v1.json"
      - "config/private-osint-official-feed-additions.v1.json"
      - "config/private-osint-macro-minerals-additions.v1.json"
      - "config/private-osint-regional-corridor-additions.v1.json"
      - "scripts/lib/global-official-release-feeds.mjs"
      - "scripts/lib/global-official-release-fallbacks.test.mjs"
      - "src/lib/on-demand-original-feed-freshness.test.ts"
      # First-party original publisher native-clock changes must re-run the
      # *protected main* original review, not just frontend news rendering.
      # PRs still execute offline tests only; no extra cron or source quota.
      - "src/lib/stateless-canada-original.server.ts"
      - "src/lib/stateless-public-intelligence.server.ts"
      - "src/lib/stateless-publisher-text.ts"
      - "scripts/lib/official-original-article-date.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-private-original-signing-review-intake
  cancel-in-progress: false

jobs:
  verify-and-pre-review:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked repository dependencies (no install scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify source authenticity, SHA provenance and protected trust boundaries
        run: |
          node --check scripts/lib/private-original-signing-review-intake.mjs
          node --check scripts/lib/geomacro-original-page-readback.mjs
          node --test scripts/lib/private-original-signing-review-intake.test.mjs
          node --test scripts/lib/private-original-intake-funnel.test.mjs
          node --test scripts/lib/original-review-opportunity-router.test.mjs
          node --test scripts/lib/private-original-review-b2-handoff.test.mjs
          node --test scripts/ops/export-private-original-review-lead.test.mjs
          node --test scripts/lib/govuk-original-content-clock.test.mjs
          node --test scripts/lib/geomacro-original-page-readback.test.mjs
          node --test scripts/lib/global-official-release-fallbacks.test.mjs
          bunx --no-install vitest run scripts/ops/prepare-first-original-signing-input.test.ts src/lib/priority-original-review-country.test.ts src/lib/on-demand-global-index-rescue.server.test.ts src/lib/country-195-search-slot-recovery.test.ts src/lib/on-demand-original-feed-freshness.test.ts
      - name: Attempt genuine 22h publisher original readbacks without charge
        # PR tests NEVER probe official publishers; main only, 12+6+6 GET cap.
        # Without eligible current releases the result is cleanly NO_CANDIDATE,
        # not a false ready-for-signing or a fake source rights statement.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GEOMACRO_REVIEW_COUNTRY_ISO3: ${{ github.event_name == 'workflow_dispatch' && inputs.country_iso3 || '' }}
          # Only genuine privately verified leads justify any B2 operation.
          # Every attempt is admitted by the existing shared D1 atomic quota
          # and original source/private URL bytes never enter Actions artifacts.
          GEOMACRO_ORIGINAL_PRIVATE_ARCHIVE_ENABLED: "1"
          B2_ACCOUNT_QUOTA_REQUIRED: "1"
          B2_ACCOUNT_QUOTA_WORKFLOW_ID: original_review_leads
          B2_REQUEST_BUDGET: "6"
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/ops/prepare-first-original-signing-input.ts
      - name: Upload aggregate-only verification receipt
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: original-pre-review-${{ github.run_id }}
          path: artifacts/original-evidence/pre-review-receipt.json
          retention-days: 14
          if-no-files-found: warn
