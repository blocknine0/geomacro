name: Intelligence Fastlane Publication Sync

# Supabase-scored B2 fastlane remains OWNER-RECOVERY only while new
# Supabase-free scored evidence and full B2 ledger coverage are incomplete.
# No automatic chained B2 GET/PUT on successful legacy workflows or push.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-scored-realtime
  cancel-in-progress: false

jobs:
  publish-fastlane-scored-state:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    environment: production
    env:
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: intelligence_fastlane_legacy_recovery
      B2_REQUEST_BUDGET: "12"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"
      GRI_DB_MODE: direct_postgres
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}

    steps:
      - name: Checkout canonical scoring revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require shared D1 B2 ledger before any fastlane B2 request
        shell: bash
        run: |
          set -euo pipefail
          test "${B2_ACCOUNT_QUOTA_REQUIRED:-}" = "1"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "D1 token missing"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "D1 account missing"; exit 2; }
          list="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          id="$(printf '%s' "$list" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const row=JSON.parse(s).find(x=>x.name===process.env.D1_DATABASE_NAME);
              process.stdout.write(row?.uuid??row?.id??"");
            });
          ')"
          test -n "$id" || { echo "Canonical D1 quota ledger missing"; exit 2; }
          echo "D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
          node --check scripts/ops/b2-d1-account-governor.mjs
          echo "Manual fastlane B2 quota guard ready."

      - name: Require authoritative production publication credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SUPABASE_PROJECT_REF" = "ldpwajisioljyjtojvfx"
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${B2_KEY_ID:-}"
          test -n "${B2_APPLICATION_KEY:-}"
          test -n "${B2_ARCHIVE_READ_KEY_ID:-}" || { echo "B2_ARCHIVE_READ_KEY_ID is required for mandatory readback"; exit 2; }
          test -n "${B2_ARCHIVE_READ_APPLICATION_KEY:-}" || { echo "B2_ARCHIVE_READ_APPLICATION_KEY is required for mandatory readback"; exit 2; }
          command -v unzip >/dev/null

      - name: Publish canonical fastlane scores when public B2 state lags
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/sync-fastlane-scored-intelligence.mjs

      - name: Upload fastlane publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intelligence-fastlane-publication-${{ github.run_id }}
          path: artifacts/intelligence-fastlane-publication.json
          if-no-files-found: error
          retention-days: 30
