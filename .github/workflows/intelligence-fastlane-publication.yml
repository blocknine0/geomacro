name: Intelligence Fastlane Publication Sync

on:
  workflow_run:
    workflows: ["Intelligence Current Scoring Fastlane"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/intelligence-fastlane-publication.yml"
      - "scripts/ops/sync-fastlane-scored-intelligence.mjs"
      - "scripts/ops/republish-b2-public-intelligence-preserve-live.mjs"
      - "scripts/ops/republish-b2-public-intelligence-scored-only.mjs"
      - "src/__tests__/intelligence-fastlane-publication-static.test.ts"
      - "src/__tests__/intelligence-fastlane-preserve-live-publication-static.test.ts"
      - "src/__tests__/intelligence-fastlane-scored-only-publication-static.test.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-scored-realtime
  cancel-in-progress: false

jobs:
  publish-fastlane-scored-state:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    environment: production
    env:
      GRI_DB_MODE: direct_postgres
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Checkout canonical scoring revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require authoritative production publication credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SUPABASE_PROJECT_REF" = "ldpwajisioljyjtojvfx"
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${B2_KEY_ID:-}"
          test -n "${B2_APPLICATION_KEY:-}"
          command -v unzip >/dev/null

      - name: Publish canonical fastlane scores when public B2 state lags
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/sync-fastlane-scored-intelligence.mjs

      - name: Upload fastlane publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intelligence-fastlane-publication-${{ github.run_id }}
          path: artifacts/intelligence-fastlane-publication.json
          if-no-files-found: error
          retention-days: 30
