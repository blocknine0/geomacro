name: Deploy country flash intelligence to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/live-flash-ingest/**"
      - "supabase/functions/live-flash-corroborate/**"
      - ".github/workflows/deploy-country-flash-supabase.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan shows pending migrations only; apply pushes migrations, syncs the flash token, deploys both functions, and runs smoke checks."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  pull_request:
    paths:
      - ".github/workflows/deploy-country-flash-supabase.yml"

permissions:
  contents: read
  id-token: write

jobs:
  validate-workflow:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production safety guardrails
        shell: bash
        run: |
          set -euo pipefail
          file=".github/workflows/deploy-country-flash-supabase.yml"

          grep -q 'workflow_dispatch:' "$file"
          grep -q 'supabase db push --dry-run' "$file"
          grep -q 'FLASH_INGEST_TOKEN' "$file"
          grep -q -- '--no-verify-jwt' "$file"
          grep -q "github.ref == 'refs/heads/main'" "$file"
          grep -q 'ldpwajisioljyjtojvfx' "$file"
          grep -q 'version: 2.117.0' "$file"
          grep -q 'push:' "$file"
          test -f "supabase/migrations/955_realtime_event_family_lifecycle.sql"
          test -f "supabase/migrations/956_event_family_version_ledger.sql"
                                        
          echo "Supabase deployment workflow safety guardrails are present."

  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-country-flash-supabase-production
      cancel-in-progress: false
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      FLASH_INGEST_TOKEN: ${{ secrets.FLASH_INGEST_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required production secrets and target
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD SUPABASE_DB_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing production secret::${name} is not configured."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          if [[ "$SUPABASE_PROJECT_ID" != "$EXPECTED_SUPABASE_PROJECT_REF" ]]; then
            echo "::error title=Wrong production target::Refusing to deploy to a Supabase project other than the authoritative Geomacro production ref."
            exit 1
          fi

          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const raw = process.env.SUPABASE_DB_URL;
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error('SUPABASE_DB_URL must be a valid percent-encoded postgres connection URL');
          }
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) {
            throw new Error('SUPABASE_DB_URL must use postgres:// or postgresql://');
          }
          const directHost = 'db.' + ref + '.supabase.co';
          const username = decodeURIComponent(url.username);
          const directMatch = url.hostname === directHost && username === 'postgres';
          const poolerMatch =
            url.hostname.endsWith('.pooler.supabase.com') &&
            username === 'postgres.' + ref;
          if (!directMatch && !poolerMatch) {
            throw new Error('SUPABASE_DB_URL does not resolve to the authoritative Geomacro production project');
          }
          if (!url.password || url.pathname !== '/postgres') {
            throw new Error('SUPABASE_DB_URL must contain the database password and target /postgres');
          }
          console.log('PASS: authoritative production DB identity confirmed without printing credentials.');
          NODE

          echo "PASS: authoritative production target and DB URL confirmed."

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Show pending database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Stop after deployment plan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'plan' }}
        shell: bash
        run: |
          echo "Plan completed. No production database or function changes were applied."

      - name: Apply database migrations
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Verify authoritative event-family schema
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          command -v psql >/dev/null 2>&1 || {
            echo "::error::psql is required for authoritative production schema verification."
            exit 1
          }

          export PGSSLMODE="require"

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.live_flash_event_families') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_families is missing from authoritative production';
            END IF;
            IF to_regclass('public.live_flash_event_family_members') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_family_members is missing from authoritative production';
            END IF;
            IF to_regclass('public.live_flash_event_family_versions') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_family_versions is missing from authoritative production';
            END IF;
            IF to_regclass('public.live_flash_event_versions') IS NULL THEN
              RAISE EXCEPTION 'live_flash_event_versions is missing from authoritative production';
            END IF;
            IF to_regclass('public.live_structured_events') IS NULL THEN
              RAISE EXCEPTION 'live_structured_events is missing from authoritative production';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'live_structured_events'
                AND column_name = 'last_observed_at'
            ) THEN
              RAISE EXCEPTION 'live_structured_events.last_observed_at is missing from authoritative production';
            END IF;
          END
          $$;
          SQL

          echo "PASS: authoritative event-family lifecycle schema is present."
      - name: Determine flash runtime credential state
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error title=Missing production secret::SUPABASE_ACCESS_TOKEN is required for live-flash-ingest deployment."
            exit 1
          }

          # The canonical production project is never the isolated signal DB.
          # Force this mode explicitly so stale project secrets cannot silently
          # disable country attribution in the production ingest path.
          supabase secrets set SIGNAL_DB_MODE="false" --project-ref "$SUPABASE_PROJECT_ID"

          echo "FLASH_INGEST_DEPLOY_READY=true" >> "${GITHUB_ENV}"

          if [[ -n "${FLASH_INGEST_TOKEN:-}" ]]; then
            echo "FLASH_RUNTIME_READY=true" >> "${GITHUB_ENV}"
            echo "Dedicated FLASH_INGEST_TOKEN configured; static-token Telegram/corroboration paths remain enabled."
          else
            echo "FLASH_RUNTIME_READY=false" >> "${GITHUB_ENV}"
            echo "Dedicated FLASH_INGEST_TOKEN is absent; GitHub OIDC will be the RSS authentication path."
          fi

      - name: Sync flash authentication secret
        if: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && env.FLASH_RUNTIME_READY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            FLASH_INGEST_TOKEN="$FLASH_INGEST_TOKEN" \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy live flash ingest function
        if: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && env.FLASH_INGEST_DEPLOY_READY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy live-flash-ingest \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Deploy live flash corroboration function
        if: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && env.FLASH_INGEST_DEPLOY_READY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy live-flash-corroborate \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Smoke-check live flash ingest authentication without inserting synthetic data
        if: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && env.FLASH_INGEST_DEPLOY_READY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          base="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1"
          auth_header_name="x-geomacro-github-oidc-token"
          auth_header_value=""

          if [[ -n "${FLASH_INGEST_TOKEN:-}" ]]; then
            auth_header_name="x-geomacro-flash-token"
            auth_header_value="${FLASH_INGEST_TOKEN}"
          else
            test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::GitHub OIDC request URL missing"; exit 1; }
            test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "::error::GitHub OIDC request token missing"; exit 1; }
            oidc_response="$(
              curl --fail-with-body -sS \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://geomacro.live/actions/live-flash-rss"
            )"
            auth_header_value="$(printf "%s" "$oidc_response" | jq -er ".value")"
            test -n "$auth_header_value"
            echo "::add-mask::$auth_header_value"

          fi

          ingest_code="$(curl --silent --show-error \
            --output /tmp/flash-ingest.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "${auth_header_name}: ${auth_header_value}" \
            --header "Authorization: Bearer ${auth_header_value}" \
            --header 'Content-Type: application/json' \
            --data '{"source_id":"aljazeera_rss"}' \
            "${base}/live-flash-ingest")"

          cat /tmp/flash-ingest.json
          echo

          if [[ "$ingest_code" != "400" ]] || ! grep -q 'source_record_id_and_headline_required' /tmp/flash-ingest.json; then
            echo "::error title=Ingest smoke check failed::Expected authenticated validation response from live-flash-ingest."
            exit 1
          fi

          corroborate_code="$(curl --silent --show-error \
            --output /tmp/flash-corroborate.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "${auth_header_name}: ${auth_header_value}" \
            --header "Authorization: Bearer ${auth_header_value}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${base}/live-flash-corroborate?mode=health")"

          cat /tmp/flash-corroborate.json
          echo

          if [[ "$corroborate_code" != "200" ]] || ! grep -q '"ok":true' /tmp/flash-corroborate.json; then
            echo "::error title=Corroboration smoke check failed::live-flash-corroborate did not return a successful response."
            exit 1
          fi

          echo "PASS: live-flash-ingest authentication boundary is healthy."
      - name: Verify authoritative country registry
        if: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && env.FLASH_INGEST_DEPLOY_READY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          node scripts/verify-production-country-registry.mjs
      - name: Report deferred flash runtime activation
        if: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && env.FLASH_RUNTIME_READY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Core country-flash schema migrations are applied through the authoritative PostgreSQL connection. Static-token Telegram activation remains disabled when FLASH_INGEST_TOKEN is absent; governed RSS ingest and corroboration use the scoped GitHub OIDC boundary."
