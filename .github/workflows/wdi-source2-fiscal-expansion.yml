name: WDI Source 2 Fiscal Expansion Proof

on:
  pull_request:
    paths:
      - "scripts/audit-wdi-source2-fiscal-expansion.mjs"
      - ".github/workflows/wdi-source2-fiscal-expansion.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit exact WDI source 2 fiscal coverage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-wdi-source2-fiscal-expansion.mjs | tee wdi-source2-fiscal-expansion.log
          grep -q 'PASS: WDI SOURCE 2 FISCAL EXPANSION AUDIT COMPLETE - NO WRITES' wdi-source2-fiscal-expansion.log

      - name: Enforce source and methodology boundaries
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.writes_performed == false' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.source.id == "2" and .source.name == "World Development Indicators"' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.source_activation_changed == false' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.scoring_changed == false' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.country_payability_changed == false' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.methodology_boundary.raw_cross_concept_pooling_allowed == false' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.methodology_boundary.external_debt_is_not_relabelled_as_central_government_debt == true' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.methodology_boundary.public_guaranteed_debt_service_is_a_separate_public_external_debt_pressure_concept == true' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.methodology_boundary.debt_service_is_not_relabelled_as_debt_stock == true' wdi-source2-fiscal-expansion.json >/dev/null
          jq -e '.methodology_boundary.production_sovereign_fiscal_module_changed == false' wdi-source2-fiscal-expansion.json >/dev/null

      - name: Print live coverage summary
        run: jq '{generated_at,source,non_aggregate_source_country_count,coverage_summary,series:[.series[]|{id,metric,family,available,fresh_country_count,error}],methodology_boundary}' wdi-source2-fiscal-expansion.json

      - name: Upload source 2 fiscal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wdi-source2-fiscal-expansion
          path: |
            wdi-source2-fiscal-expansion.json
            wdi-source2-fiscal-expansion.log
          if-no-files-found: warn
          retention-days: 30
