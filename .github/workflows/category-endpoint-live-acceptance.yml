name: Category Endpoint No-Funds Acceptance

on:
  workflow_dispatch: {}
  # Read-only, six HTTP requests, no signature, no payment. Low-quota watch
  # complements (but cannot replace) the separate live-source freshness audit.
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/category-endpoint-live-acceptance.yml'
      - 'scripts/ops/verify-live-category-endpoints.mjs'
      - 'src/lib/category-intelligence-alias.server.ts'
      - 'src/routes/api.v1.intelligence.*.ts'

permissions:
  contents: read

concurrency:
  group: geomacro-category-endpoint-no-funds-acceptance
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify all three live scopes and one-hour data preflight without funds
        run: node scripts/ops/verify-live-category-endpoints.mjs
      - name: Retain source-free failure or acceptance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: category-endpoint-no-funds-${{ github.sha }}
          path: artifacts/category-endpoints/no-funds-proof.json
          retention-days: 7
