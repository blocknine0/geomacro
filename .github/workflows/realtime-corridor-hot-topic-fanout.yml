name: Realtime Corridor and Hot-Topic Fanout

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "GDELT GAL Live Hot-Topic Sync"
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: realtime-corridor-hot-topic-fanout
  cancel-in-progress: false

jobs:
  fanout:
    if: >
      github.repository == 'blocknine0/geomacro' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REALTIME_FANOUT_MAX_BURSTS: "16"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${APP_SUPABASE_URL:-}"
          test -n "\${APP_SUPABASE_SERVICE_ROLE_KEY:-}"
          node scripts/db/assert-authoritative-supabase.mjs
          bun --check scripts/sync-realtime-scope-fanout.mjs
          bun --check scripts/audit-realtime-scope-fanout.mjs

      - name: Run first-break scope fanout
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/sync-realtime-scope-fanout.mjs | tee realtime-scope-fanout.json
          jq -e '.ok == true' realtime-scope-fanout.json >/dev/null

      - name: Validate 100-percent scope contract and live backbone
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-realtime-scope-fanout.mjs | tee realtime-scope-audit.json
          jq -e '.ok == true' realtime-scope-audit.json >/dev/null
          jq -e '.contract.view_contract_complete == true' realtime-scope-audit.json >/dev/null
          jq -e '.global_first_break_backbone.healthy == true' realtime-scope-audit.json >/dev/null
          jq -e '.direct_operational_sources.healthy == true' realtime-scope-audit.json >/dev/null

      - name: Upload sanitized fanout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: realtime-corridor-hot-topic-fanout
          path: |
            realtime-scope-fanout.json
            realtime-scope-audit.json
          if-no-files-found: warn
          retention-days: 30
