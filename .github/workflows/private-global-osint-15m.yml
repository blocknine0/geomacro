      - name: Optional dedicated R2 private AES-GCM escrow with independent byte readback
        if: ${{ vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET != '' }}
        id: r2_mirror
        continue-on-error: true
        env:
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
