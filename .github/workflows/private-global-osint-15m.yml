name: Global OSINT to Website Intelligence (15-Minute Discovery)

# Collects private source observations and durably verifies private D1 first.
# The production collector may publish only safe, derived, deduplicated and
# explicitly unverified/source-credited cards to the existing public 72h
# website journal. Never publish raw private rows, original titles/URLs,
# Telegram messages, Supabase data, signed claims or chargeable products.
# GitHub schedules and publisher clocks are best-effort, not a 15m guarantee.
