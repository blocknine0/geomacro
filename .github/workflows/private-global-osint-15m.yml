          GEOMACRO_PRIVATE_OSINT_R2_BUCKET: ${{ vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET }}
          GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID }}
          GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ops/private-osint-mirror-held-to-r2.mjs
      - name: Warn when optional R2 evidence mirror failed
        if: ${{ steps.r2_mirror.outcome == 'failure' }}
        run: echo "::warning::PRIVATE_OSINT_R2_ESCROW_FAILED_GITHUB_CIPHERTEXT_RETAINED"
      - name: Retain only encrypted original-clock observations, never plaintext
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-encrypted-private-osint-held
          path: /tmp/geomacro-encrypted-held-spool/sealed.json
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0

