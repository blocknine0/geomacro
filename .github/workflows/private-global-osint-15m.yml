permissions:
  contents: read

concurrency:
  group: geomacro-private-global-osint-15m
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Offline source and privacy tests
        run: |
          set -euo pipefail
          node --test scripts/tests/phase2i-source-only-governor.test.mjs
          node --check scripts/lib/phase2i-single-sweep-original-index.mjs
          node --test scripts/tests/phase2i-single-sweep-original-index.test.mjs
          node --check scripts/lib/phase2i-osint-country-fair-raw-staging.mjs
          node --test scripts/tests/phase2i-osint-country-fair-raw-staging.test.mjs
          node --check scripts/lib/private-osint-15m-collector.mjs
          node --check scripts/lib/private-osint-15m-durable-publisher.mjs
          node --check scripts/lib/private-osint-website-bridge.mjs
          node --check scripts/lib/derived-news-readback-policy.mjs
          node --test scripts/tests/derived-news-readback-policy.test.mjs
          node --test scripts/tests/derived-news-worker-policy.test.mjs
          node --test scripts/tests/derived-news-deploy-order.test.mjs
          node --test scripts/lib/private-osint-website-bridge.test.mjs scripts/lib/website-derived-retention-priority.test.mjs
          node --test scripts/lib/private-osint-website-derived-contract.test.mjs
          node --check workers/control-plane/src/private-osint-15m.mjs
          node --check scripts/lib/private-osint-country-rotation.mjs
          node --check scripts/lib/private-osint-local-publisher-rotation.mjs
          node --test scripts/lib/private-osint-country-rotation.test.mjs scripts/tests/launch-news-coverage.test.mjs
          node --test scripts/lib/private-osint-encrypted-spool.test.mjs
          node --test scripts/lib/private-osint-shared-read-contract.test.mjs
          node --check scripts/lib/private-osint-free-r2-guard.mjs
          node --test scripts/lib/private-osint-free-r2-guard.test.mjs
          node --check scripts/ops/private-osint-mirror-held-to-r2.mjs
          node --test scripts/lib/private-osint-r2-encrypted-escrow.test.mjs
          node --check scripts/ops/private-osint-replay-held.mjs
          node --test scripts/tests/private-osint-bounded-replay.test.mjs
          node --test scripts/lib/private-osint-local-publisher-rotation.test.mjs
          node --test scripts/lib/private-osint-15m-collector.test.mjs
          node --test scripts/lib/private-osint-15m-durable-publisher.test.mjs
          node --test scripts/lib/private-osint-15m-d1.test.mjs
          node --test scripts/lib/private-osint-retired-sources.test.mjs
          node --test scripts/lib/private-osint-global-hub-overlay.test.mjs
          node --test scripts/lib/private-osint-global-sources.test.mjs
          node --test scripts/lib/private-osint-national-gap-feeds.test.mjs
          node scripts/ops/audit-private-osint-publisher-coverage.mjs > /tmp/geomacro-osint-publisher-coverage.json
          node --check scripts/lib/private-unverified-osint-intake.mjs
          node --test scripts/lib/private-unverified-osint-intake.test.mjs
          node --test scripts/lib/private-osint-local-gaplane.test.mjs
          node --check scripts/ops/probe-private-osint-local-gaplane.mjs
          node --test scripts/lib/private-osint-bundle.test.mjs
          node --test scripts/tests/plan-d1-bundled-work.test.mjs
          node --test scripts/tests/minimum-daily-bundled-source.test.mjs
          node --test scripts/tests/cloudflare-workers-paid-plan-proof.test.mjs
          node --test scripts/tests/critical-workflow-budget-guards.test.mjs
          node --test scripts/tests/critical-fastlane-d1-pacing-workflows.test.mjs
          node --test scripts/lib/registered-reusable-news-source-collector.test.mjs scripts/lib/registered-news-15m-cadence.test.mjs
  quota-admission:
    name: Account-wide D1 no-query bundled quota gate
    needs: verify
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    outputs:
      critical: ${{ steps.budget.outputs.critical }}
      research: ${{ steps.budget.outputs.research }}
      maintenance: ${{ steps.budget.outputs.maintenance }}
      source_intake: ${{ steps.budget.outputs.source_intake }}
      source_intake_max_new_rows: ${{ steps.budget.outputs.source_intake_max_new_rows }}
      state: ${{ steps.budget.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Observe Cloudflare account-wide D1 rows; reserve for priority lanes
        id: budget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs
      - name: Clearly mark held collector cycles without inventing source news
        if: steps.budget.outputs.critical != 'true' || steps.budget.outputs.research != 'true'
        env:
          D1_ADMISSION_STATE: ${{ steps.budget.outputs.state }}
        run: |
          echo "::notice::D1_BUDGET_ADMISSION_${D1_ADMISSION_STATE}; held source jobs are not completed ingestion. No records or coverage counts invented."

  live-source-probe:
    name: Read-only live OSINT category and 195x3 source-health probe
    needs: verify
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'blocknine0/geomacro') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Probe public RSS/Atom sources without storage or publication
        run: |
          set -euo pipefail
          node --check scripts/ops/probe-private-osint-live-category-coverage.mjs
          node scripts/ops/probe-private-osint-live-category-coverage.mjs
      - name: Build prioritized 585-cell native-feed repair worklist
        run: |
          set -euo pipefail
          node --test scripts/tests/native-country-repair-worklist.test.mjs
          node scripts/ops/build-native-country-repair-worklist.mjs /tmp/geomacro-private-osint-live-coverage.json /tmp/geomacro-private-osint-native-gap-worklist.json
      - name: Build paid-product-driven original source requirements, without activating payments
        run: |
          set -euo pipefail
          node --test scripts/tests/revenue-source-demand-195x3.test.mjs
          node scripts/ops/build-revenue-source-demand-195x3.mjs /tmp/geomacro-private-osint-native-gap-worklist.json /tmp/geomacro-revenue-source-demand-195x3.json
      - name: Save counts-only live coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-private-osint-live-coverage-${{ github.run_id }}
          path: |
            /tmp/geomacro-private-osint-live-coverage.json
            /tmp/geomacro-private-osint-native-gap-worklist.json
            /tmp/geomacro-revenue-source-demand-195x3.json
          if-no-files-found: warn
          retention-days: 7

  live-local-gap-probe:
    name: Read-only 91-country publisher candidate native RSS validation
    needs: verify
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'blocknine0/geomacro') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Probe first-party publisher RSS candidates without secrets or storage
        run: |
          set -euo pipefail
          node scripts/ops/probe-private-osint-local-gaplane.mjs
      - name: Keep private counts-only publisher-country gap diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-private-local-gaplane-${{ github.run_id }}
          path: /tmp/geomacro-private-local-gaplane-probe.json
          if-no-files-found: warn
          retention-days: 7

  collect-private:
    # Only a human dispatch may run the legacy full 768-item research
    # pipeline; daily scheduled ingestion uses five-row micro-bundles.
    # Serialize D1 source writes with the five-minute fastlane; never
    # oversubscribe the same non-atomic Cloudflare Free budget in parallel.
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    needs: [verify, quota-admission]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.quota-admission.outputs.critical == 'true' &&
      needs.quota-admission.outputs.research == 'true' &&
      needs.quota-admission.outputs.source_intake == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Read sources, verify private D1, publish safe derived news to website journal
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/private-osint-15m-tick.ts


  collect-source-intake-only:
    name: Governed source-only original news to canonical D1 when full publication is paced
    # One private micro-bundle per scheduled 15-minute slot only.
    # Push/dispatch/wakeups do not create extra Free D1 write slots.
    # Serialize D1 source writes with the five-minute fastlane; never
    # oversubscribe the same non-atomic Cloudflare Free budget in parallel.
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    needs: [verify, quota-admission]
    if: >-
      needs.quota-admission.result == 'success' &&
      needs.quota-admission.outputs.source_intake == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Stage at most provider-approved new original rows into existing private D1
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_SOURCE_INTAKE_ONLY: "1"
          PHASE2I_PROVIDER_SOURCE_INTAKE: ${{ needs.quota-admission.outputs.source_intake }}
          PHASE2I_PROVIDER_CRITICAL: ${{ needs.quota-admission.outputs.critical }}
          PHASE2I_PROVIDER_RESEARCH: ${{ needs.quota-admission.outputs.research }}
          PHASE2I_PROVIDER_MAX_NEW_ROWS: ${{ needs.quota-admission.outputs.source_intake_max_new_rows }}
        run: |
          set -euo pipefail
          bun scripts/ops/phase2i-source-only-raw-tick.ts

  stage-private-sources-when-d1-held:
    name: Preserve actual native-dated source observations when canonical D1 is held
    concurrency:
      group: geomacro-private-osint-held-publisher-fetch
      cancel-in-progress: false
    needs: [verify, quota-admission]
    if: >-
      needs.quota-admission.outputs.source_intake != 'true' &&
      needs.quota-admission.result == 'success' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Poll country publishers and seal unverified factual JSON without D1
        env:
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/private-osint-stage-held.ts
      - name: Optional dedicated R2 private AES-GCM escrow with independent byte readback
        if: ${{ vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET != '' }}
        id: r2_mirror
        continue-on-error: true
        env:
          GEOMACRO_OSINT_SPOOL_ADMISSION: "HELD"
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEOMACRO_PRIVATE_OSINT_R2_BUCKET: ${{ vars.GEOMACRO_PRIVATE_OSINT_R2_BUCKET }}
          GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_ACCESS_KEY_ID }}
          GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY: ${{ secrets.GEOMACRO_PRIVATE_OSINT_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ops/private-osint-mirror-held-to-r2.mjs
      - name: Warn when optional R2 evidence mirror failed
        if: ${{ steps.r2_mirror.outcome == 'failure' }}
        run: echo "::warning::PRIVATE_OSINT_R2_ESCROW_FAILED_GITHUB_CIPHERTEXT_RETAINED"
      - name: Retain only encrypted original-clock observations, never plaintext
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-encrypted-private-osint-held
          path: /tmp/geomacro-encrypted-held-spool/sealed.json
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0

  replay-quota-held-encrypted-spool:
    name: Recover one encrypted held-source batch into verified canonical D1
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    needs: [verify, quota-admission, collect-source-intake-only]
    if: >-
      needs.collect-source-intake-only.result == 'success' &&
      github.event_name == 'schedule' &&
      needs.quota-admission.outputs.critical == 'true' &&
      needs.quota-admission.outputs.research == 'true' &&
      needs.quota-admission.outputs.source_intake == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Recover bounded authenticated ciphertext after normal fresh D1 write succeeds
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_OSINT_SPOOL_RECOVERY_ADMISSION: "CRITICAL_TRUE"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/ops/private-osint-replay-held.mjs

  collect-unverified-private:
    needs: [verify, quota-admission]
    if: >-
      needs.quota-admission.outputs.research == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Poll only explicitly unverified public candidates and persist private D1
        env:
          GEOMACRO_OSINT_RESEARCH_PRIVATE_ONLY: "1"
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/private-unverified-osint-tick.ts
