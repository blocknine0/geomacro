name: Global OSINT to Website Intelligence (15-Minute Discovery)

# Collects private source observations and durably verifies private D1 first.
# The production collector may publish only safe, derived, deduplicated and
# explicitly unverified/source-credited cards to the existing public 72h
# website journal. Never publish raw private rows, original titles/URLs,
# Telegram messages, Supabase data, signed claims or chargeable products.
# GitHub schedules and publisher clocks are best-effort, not a 15m guarantee.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Deploy D1 Control Plane"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "1-56/5 * * * *"
  pull_request:
    paths:
      - ".github/workflows/private-global-osint-15m.yml"
      - "scripts/lib/private-osint-15m-collector.mjs"
      - "scripts/lib/private-osint-country-rotation.mjs"
      - "scripts/lib/private-osint-country-rotation.test.mjs"
      - "scripts/lib/private-osint-15m-collector.test.mjs"
      - "scripts/lib/derived-news-readback-policy.mjs"
      - "scripts/tests/derived-news-readback-policy.test.mjs"
      - "scripts/tests/derived-news-worker-policy.test.mjs"
      - "scripts/tests/derived-news-deploy-order.test.mjs"
      - "scripts/lib/private-osint-15m-durable-publisher.mjs"
      - "scripts/lib/private-osint-15m-durable-publisher.test.mjs"
      - "scripts/lib/private-osint-website-bridge.mjs"
      - "scripts/lib/private-osint-website-bridge.test.mjs"
      - "scripts/lib/private-osint-website-derived-contract.test.mjs"
      - "scripts/lib/website-derived-retention-priority.test.mjs"
      - "workers/control-plane/src/website-derived-intelligence.mjs"
      - "scripts/lib/private-osint-website-derived-contract.test.mjs"
      - "workers/control-plane/src/website-derived-intelligence.mjs"
      - "src/lib/public-derived-news-client.ts"
      - "workers/control-plane/src/private-osint-15m.mjs"
      - "workers/control-plane/migrations/0028_private_osint_15m_durable.sql"
      - "scripts/ops/private-osint-15m-tick.ts"
      - "scripts/lib/registered-reusable-news-source-collector.mjs"
      - "src/components/intelligence/stateless-live-desk.tsx"
      - "scripts/lib/country-news-mentions-195.mjs"
      - "scripts/lib/private-osint-global-sources.mjs"
      - "scripts/lib/private-osint-global-sources.test.mjs"
      - "scripts/lib/private-osint-15m-d1.test.mjs"
      - "scripts/lib/private-osint-15m-durable-publisher.test.mjs"
      - "scripts/ops/audit-private-osint-publisher-coverage.mjs"
      - "scripts/ops/probe-private-osint-live-category-coverage.mjs"
      - "scripts/lib/private-osint-country-mentions.mjs"
      - "config/private-osint-working-sources.v1.json"
      - "config/private-osint-official-feed-additions.v1.json"
      - "config/private-osint-macro-minerals-additions.v1.json"
      - "config/private-osint-regional-corridor-additions.v1.json"
      - "config/private-osint-local-rss-candidates.v1.json"
      - "config/private-osint-corridor-reference-overlay.v1.json"
      - "config/private-osint-eight-repository-intake.v1.json"
      - "config/operator-country-source-crosswalk.v1.json"
      - "scripts/lib/private-unverified-osint-intake.mjs"
      - "scripts/lib/private-unverified-osint-intake.test.mjs"
      - "scripts/ops/private-unverified-osint-tick.ts"
      - "workers/control-plane/src/private-osint-bundle.mjs"
      - "workers/control-plane/migrations/0029_private_osint_bundle_index.sql"
      - "scripts/lib/private-osint-bundle.test.mjs"
      - "src/lib/reusable-news-json.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-global-osint-15m.yml"
      - "src/lib/public-derived-news-client.ts"
      - "workers/control-plane/src/website-derived-intelligence.mjs"
      - "scripts/lib/private-osint-website-bridge.mjs"
      - "src/lib/stateless-intelligence-model.ts"
      - "scripts/lib/private-osint-15m-collector.mjs"
      - "scripts/lib/private-osint-country-rotation.mjs"
      - "scripts/lib/private-osint-country-rotation.test.mjs"
      - "scripts/lib/private-osint-15m-collector.test.mjs"
      - "scripts/ops/probe-private-osint-live-category-coverage.mjs"
      - "scripts/ops/private-osint-15m-tick.ts"
      - "scripts/lib/private-osint-global-sources.mjs"
      - "scripts/lib/private-osint-country-mentions.mjs"
      - "config/private-osint-working-sources.v1.json"
      - "config/private-osint-official-feed-additions.v1.json"
      - "config/private-osint-macro-minerals-additions.v1.json"
      - "config/private-osint-regional-corridor-additions.v1.json"
      - "config/private-osint-local-rss-candidates.v1.json"
      - "config/private-osint-corridor-reference-overlay.v1.json"
      - "config/operator-country-source-crosswalk.v1.json"
      - "scripts/lib/private-unverified-osint-intake.mjs"
      - "scripts/lib/private-unverified-osint-intake.test.mjs"
      - "scripts/ops/private-unverified-osint-tick.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-private-global-osint-15m
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Offline source and privacy tests
        run: |
          set -euo pipefail
          node --check scripts/lib/private-osint-15m-collector.mjs
          node --check scripts/lib/private-osint-15m-durable-publisher.mjs
          node --check scripts/lib/private-osint-website-bridge.mjs
          node --check scripts/lib/derived-news-readback-policy.mjs
          node --test scripts/tests/derived-news-readback-policy.test.mjs
          node --test scripts/tests/derived-news-worker-policy.test.mjs
          node --test scripts/tests/derived-news-deploy-order.test.mjs
          node --test scripts/lib/private-osint-website-bridge.test.mjs scripts/lib/website-derived-retention-priority.test.mjs
          node --test scripts/lib/private-osint-website-derived-contract.test.mjs
          node --check workers/control-plane/src/private-osint-15m.mjs
          node --check scripts/lib/private-osint-country-rotation.mjs
          node --test scripts/lib/private-osint-country-rotation.test.mjs
          node --test scripts/lib/private-osint-15m-collector.test.mjs
          node --test scripts/lib/private-osint-15m-durable-publisher.test.mjs
          node --test scripts/lib/private-osint-15m-d1.test.mjs
          node --test scripts/lib/private-osint-global-sources.test.mjs
          node scripts/ops/audit-private-osint-publisher-coverage.mjs > /tmp/geomacro-osint-publisher-coverage.json
          node --check scripts/lib/private-unverified-osint-intake.mjs
          node --test scripts/lib/private-unverified-osint-intake.test.mjs
          node --test scripts/lib/private-osint-bundle.test.mjs
          node --test scripts/lib/registered-reusable-news-source-collector.test.mjs scripts/lib/registered-news-15m-cadence.test.mjs
  live-source-probe:
    name: Read-only live OSINT category and 195x3 source-health probe
    needs: verify
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'blocknine0/geomacro') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Probe public RSS/Atom sources without storage or publication
        run: |
          set -euo pipefail
          node --check scripts/ops/probe-private-osint-live-category-coverage.mjs
          node scripts/ops/probe-private-osint-live-category-coverage.mjs
      - name: Save counts-only live coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-private-osint-live-coverage-${{ github.run_id }}
          path: /tmp/geomacro-private-osint-live-coverage.json
          if-no-files-found: warn
          retention-days: 7

  collect-private:
    needs: verify
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Read sources, verify private D1, publish safe derived news to website journal
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/private-osint-15m-tick.ts

  collect-unverified-private:
    needs: verify
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Poll only explicitly unverified public candidates and persist private D1
        env:
          GEOMACRO_OSINT_RESEARCH_PRIVATE_ONLY: "1"
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/private-unverified-osint-tick.ts
