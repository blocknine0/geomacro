  collect-private:
    # Only a human dispatch may run the legacy full 768-item research
    # pipeline; daily scheduled ingestion uses five-row micro-bundles.
    # Serialize D1 source writes with the five-minute fastlane; never
    # oversubscribe the same non-atomic Cloudflare Free budget in parallel.
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    needs: [verify, quota-admission]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.quota-admission.outputs.critical == 'true' &&
      needs.quota-admission.outputs.research == 'true' &&
      needs.quota-admission.outputs.source_intake == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Read sources, verify private D1, publish safe derived news to website journal
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/private-osint-15m-tick.ts


  collect-source-intake-only:
    name: Governed source-only original news and optional canonical-to-static website delivery
    permissions:
      contents: write
    # One quota-admitted private micro-bundle on schedule OR a verified
    # successful same-repo main control-plane deployment. Never from a push
    # or arbitrary workflow wakeup; preserve existing Free D1 admission.
    # Serialize D1 source writes with the five-minute fastlane; never
    # oversubscribe the same non-atomic Cloudflare Free budget in parallel.
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    needs: [verify, quota-admission]
    if: >-
      needs.quota-admission.result == 'success' &&
      needs.quota-admission.outputs.source_intake == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.name == 'Deploy D1 Control Plane' ||
         github.event.workflow_run.name == 'Website Derived News Continuity') &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      # Research-funded public projection is a separate job step; this stage
      # still writes ONLY the original provider-admitted private D1 rows.
      # The private handoff file is never uploaded as a GitHub artifact.
      - name: Stage at most provider-approved new original rows into existing private D1
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_SOURCE_INTAKE_ONLY: "1"
          GEOMACRO_SOURCE_WEBSITE_HANDOFF: ${{ runner.temp }}/geomacro-source-website-handoff.json
          PHASE2I_PROVIDER_SOURCE_INTAKE: ${{ needs.quota-admission.outputs.source_intake }}
          PHASE2I_PROVIDER_CRITICAL: ${{ needs.quota-admission.outputs.critical }}
          PHASE2I_PROVIDER_RESEARCH: ${{ needs.quota-admission.outputs.research }}
          PHASE2I_PROVIDER_MAX_NEW_ROWS: ${{ needs.quota-admission.outputs.source_intake_max_new_rows }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bun scripts/ops/phase2i-source-only-raw-tick.ts
      - name: Publish concrete current source-only findings to FREE public journal only with separate research headroom
        if: needs.quota-admission.outputs.critical == 'true' && needs.quota-admission.outputs.research == 'true'
        env:
          GEOMACRO_SOURCE_INTAKE_ONLY: "1"
          PHASE2I_PROVIDER_SOURCE_INTAKE: ${{ needs.quota-admission.outputs.source_intake }}
          PHASE2I_PROVIDER_CRITICAL: ${{ needs.quota-admission.outputs.critical }}
          PHASE2I_PROVIDER_RESEARCH: ${{ needs.quota-admission.outputs.research }}
          PHASE2I_PROVIDER_MAX_NEW_ROWS: ${{ needs.quota-admission.outputs.source_intake_max_new_rows }}
          GEOMACRO_SOURCE_WEBSITE_HANDOFF: ${{ runner.temp }}/geomacro-source-website-handoff.json
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ops/publish-source-only-website-derived.ts
      # Deliver the SAME already canonical-readback verified, derived-only D1
      # rows into the immutable public archive actually consumed by the site.
      # 15-minute source admission + critical + research quota are mandatory.
      # No extra source GET, no client D1, no PREDGE, no extra cron.
      - name: Append verified fresh three-category D1 findings to public static archive
        id: static-finds
        if: needs.quota-admission.outputs.critical == 'true' && needs.quota-admission.outputs.research == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/derived-news/permanent-archive-candidates.json || {
            echo "::error::SOURCE_WEBSITE_CANONICAL_ARCHIVE_CANDIDATES_MISSING"
            exit 2
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32 || {
            echo "::error::SOURCE_WEBSITE_STATIC_DEPLOY_CREDENTIALS_MISSING"
            exit 2
          }
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          archive_ref="refs/remotes/origin/geomacro-permanent-finds-archive"
          git -c http.extraheader="$auth_header" fetch origin "refs/heads/geomacro-permanent-finds-archive:$archive_ref"
          archive_dir="$RUNNER_TEMP/geomacro-permanent-finds-archive"
          git worktree add --detach "$archive_dir" "$archive_ref"
          assets_dir="$GITHUB_WORKSPACE/workers/public-finds-archive/assets"
          node scripts/ops/publish-permanent-derived-news-archive.mjs \
            "$archive_dir" "$assets_dir" artifacts/derived-news/permanent-archive-candidates.json
          result_file="$RUNNER_TEMP/permanent-derived-news-archive-result.json"
          test -s "$result_file" || exit 2
          deploy_needed="$(jq -r '.deploy_needed == true' "$result_file")"
          git -C "$archive_dir" add data
          if ! git -C "$archive_dir" diff --cached --quiet; then
            git -C "$archive_dir" config user.name "github-actions[bot]"
            git -C "$archive_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$archive_dir" commit -m "Append verified three-domain source-sweep D1 findings"
            git -C "$archive_dir" -c http.extraheader="$auth_header" push origin HEAD:refs/heads/geomacro-permanent-finds-archive
          fi
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          if [[ "$deploy_needed" == "true" ]]; then
            cd workers/public-finds-archive
            npx -y wrangler@4.136.3 deploy --config wrangler.jsonc
          else
            echo "::notice::SOURCE_WEBSITE_PUBLIC_ARCHIVE_ALREADY_EXACT"
          fi
      - name: Verify coherent public website archive cohort and all-category native dates
        # Verify every successful admitted sweep, even when no new archive IDs
        # were appended. A silent static mismatch must never pass as NO-OP.
        if: steps.static-finds.outcome == 'success'
        env:
          GEOMACRO_STATIC_DEPLOY_NEEDED: ${{ steps.static-finds.outputs.deploy_needed }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {verifyConvergedPublicStaticArchiveReadback} from './scripts/lib/verify-public-static-archive-readback.mjs';
          // No-deploy sweeps do not populate Workers assets/. Verify against
          // the canonical immutable archive worktree, not stale workspace files.
          const asset=process.env.GEOMACRO_STATIC_DEPLOY_NEEDED==='true'
            ? 'workers/public-finds-archive/assets/'
            : process.env.RUNNER_TEMP+'/geomacro-permanent-finds-archive/data/';
          const expectedIndex=JSON.parse(readFileSync(asset+'index.json','utf8'));
          const expectedLatest=JSON.parse(readFileSync(asset+'latest.json','utf8'));
          const expectedCoverage=JSON.parse(readFileSync(asset+'coverage-72h.json','utf8'));
          const expectedDaily=JSON.parse(readFileSync(asset+'daily-highlights.json','utf8'));
          const base='https://geomacro-public-finds-archive.daspallab202391.workers.dev';
          const read=async path=>{
            const response=await fetch(base+path,{
              headers:{Accept:'application/json','Cache-Control':'no-cache'},
              signal:AbortSignal.timeout(9_000),redirect:'error',
            });
            if(!response.ok)throw Error('SOURCE_WEBSITE_STATIC_HTTP_'+response.status);
            return response.json();
          };
          const proof=await verifyConvergedPublicStaticArchiveReadback({
            read,expectedIndex,expectedLatest,expectedCoverage,
          });
          // Homepage daily highlights must be readable from this same
          // immutable archive generation, not an older static Worker release.
          const liveDaily=await read('/daily-highlights.json');
          const withoutGeneratedAt=doc=>{
            const {generated_at,...payload}=doc;
            return JSON.stringify(payload);
          };
          if(liveDaily?.schema!=='geomacro.public-daily-official-finds.v1'||
             withoutGeneratedAt(liveDaily)!==withoutGeneratedAt(expectedDaily)||
             !Array.isArray(liveDaily.signals)||liveDaily.signals.length>36)
            throw Error('SOURCE_WEBSITE_DAILY_HIGHLIGHTS_EXACT_READBACK_FAILED');
          const domains=['geopolitics','macro','rare_earth'];
          const latest_by_category=Object.fromEntries(domains.map(c=>[c,
            expectedLatest.signals.filter(s=>s.category===c)
              .map(s=>s.published_at).sort().at(-1)??null
          ]));
          console.log(JSON.stringify({
            schema:'geomacro.source-to-public-static-production-proof.v1',
            ...proof,latest_original_by_category:latest_by_category,
            deploy_required:process.env.GEOMACRO_STATIC_DEPLOY_NEEDED==='true',
            verified_even_on_no_new_ids:true,
            homepage_daily_highlights_exact_readback:true,
            paid_eligible:false,no_new_source_fetch:true,predge_modified:false,
          }));
          NODE
      - name: Always discard private source candidates after same-run projection
        if: always()
        env:
          GEOMACRO_SOURCE_WEBSITE_HANDOFF: ${{ runner.temp }}/geomacro-source-website-handoff.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$GEOMACRO_SOURCE_WEBSITE_HANDOFF"


  stage-private-sources-when-d1-held:
    name: Preserve actual native-dated source observations when canonical D1 is held
    concurrency:
      group: geomacro-private-osint-held-publisher-fetch
      cancel-in-progress: false
    needs: [verify, quota-admission]
    if: >-
      needs.quota-admission.outputs.source_intake != 'true' &&
