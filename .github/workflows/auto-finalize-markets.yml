name: Auto Finalize Markets
# Runs at :15 every 2 hours — after create-markets (:10) so they don't
# collide, and before resolve-markets (:30). This is the step that turns
# 24h-old-dispute-window markets into lifecycle_stage='completed' and
# frees up room in create-markets's MAX_ACTIVE_MARKETS cap.
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}
concurrency:
  group: finalize-markets
  cancel-in-progress: false
jobs:
  finalize-markets:
    runs-on: ubuntu-latest
    # 🛡️ NEW: without this, GitHub Actions' default job timeout is 6 hours.
    # 10 min gives the script's own RUN_TIME_BUDGET_MS (6 min) headroom to
    # exit gracefully before a hard timeout cancels it mid-transaction.
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install ethers @supabase/supabase-js
      - name: Run market finalization script
        env:
          OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
          # 🛡️ FIX: were missing entirely — this workflow's earlier logs
          # ("Legacy: 8, V2: 0") looked correct only by coincidence, since
          # with no CONTRACT_ADDRESS/OLD_CONTRACT_ADDRESS in the environment
          # the script's own fallback default applies to BOTH constants
          # equally (same V1 value), so v2CutoverActive evaluated false and
          # every market got treated as legacy — which happened to be true
          # since no real V2 markets existed yet to expose the gap. Once V2
          # markets exist, this would have silently never finalized them.
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OLD_CONTRACT_ADDRESS: ${{ secrets.OLD_CONTRACT_ADDRESS }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_2: ${{ secrets.ARC_RPC_URL_2 }}
          ARC_RPC_URL_3: ${{ secrets.ARC_RPC_URL_3 }}
          ARC_RPC_URL_4: ${{ secrets.ARC_RPC_URL_4 }}
          ARC_RPC_URL_5: ${{ secrets.ARC_RPC_URL_5 }}
          MAX_EVENTS_PER_RUN: "150"
          RUN_TIME_BUDGET_MS: "360000"
        run: node scripts/finalize-markets.js
