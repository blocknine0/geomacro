name: Validate New First-Party Minerals Original Feeds
on:
  pull_request:
    paths:
      - "scripts/ops/probe-official-mineral-feeds-readonly.ts"
      - ".github/workflows/validate-new-mineral-feeds.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-lane-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Read bounded official feeds only
        run: bun scripts/ops/probe-official-mineral-feeds-readonly.ts
