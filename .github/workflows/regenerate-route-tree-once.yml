name: Regenerate Route Tree Once

on:
  push:
    branches:
      - website/final-commercial-alignment-20260918
    paths:
      - .github/workflows/regenerate-route-tree-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: website/final-commercial-alignment-20260918
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Regenerate exact TanStack route tree
        run: bun run build
      - name: Commit generated route tree only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate TanStack route tree"
          git push origin HEAD:website/final-commercial-alignment-20260918
