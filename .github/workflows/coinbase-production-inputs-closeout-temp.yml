name: Coinbase Production Inputs Closeout Probe

on:
  push:
    branches:
      - feat/commercial-prelaunch-closeout
    paths:
      - ".github/workflows/coinbase-production-inputs-closeout-temp.yml"

permissions:
  contents: read

jobs:
  presence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CDP_API_KEY_ID_SECRET: ${{ secrets.CDP_API_KEY_ID }}
      CDP_API_KEY_SECRET_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
      PAY_TO_SECRET: ${{ secrets.COINBASE_X402_PAY_TO }}
      PAY_TO_VAR: ${{ vars.COINBASE_X402_PAY_TO }}
      PRICE_VAR: ${{ vars.COINBASE_X402_PRICE_USDC }}
    steps:
      - name: Check presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1" value="$2"
            if [[ -n "$value" ]]; then
              echo "PRESENT=$label"
            else
              echo "MISSING=$label"
            fi
          }
          check CDP_API_KEY_ID "$CDP_API_KEY_ID_SECRET"
          check CDP_API_KEY_SECRET "$CDP_API_KEY_SECRET_SECRET"
          if [[ -n "$PAY_TO_SECRET" || -n "$PAY_TO_VAR" ]]; then
            echo 'PRESENT=COINBASE_X402_PAY_TO'
          else
            echo 'MISSING=COINBASE_X402_PAY_TO'
          fi
          if [[ -n "$PRICE_VAR" ]]; then
            echo 'PRESENT=COINBASE_X402_PRICE_USDC'
          else
            echo 'MISSING=COINBASE_X402_PRICE_USDC_VAR (code-approved launch price remains 0.02)'
          fi
          echo 'PRODUCTION_ACTIVATION_PERFORMED=false'
          echo 'PRODUCTION_ACK_READ_OR_SET=false'
