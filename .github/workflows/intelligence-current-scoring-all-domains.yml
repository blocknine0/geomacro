name: Intelligence Current Scoring All Domains

on:
  workflow_run:
    workflows: ["Intelligence Current Scoring Fastlane"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/intelligence-current-scoring-all-domains.yml"
      - "scripts/ops/run-intelligence-current-scoring-cycle.mjs"
      - "scripts/ops/supabase-free-tier-budget.mjs"
      - "scripts/ops/sync-fastlane-scored-intelligence.mjs"
      - "scripts/ops/republish-b2-public-intelligence-scored-only.mjs"
      - "src/lib/public-intelligence-production.server.ts"
      - "src/__tests__/intelligence-current-scoring-all-domains-static.test.ts"
      - "src/__tests__/intelligence-fastlane-publication-static.test.ts"
      - "src/__tests__/intelligence-fastlane-scored-only-publication-static.test.ts"
      - "src/__tests__/public-intelligence-scored-priority-static.test.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  score-current-all-domains:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
      GEOMACRO_GDELT_ONLY: "true"
      GDELT_GAL_FALLBACK_ENABLED: "true"
      GUARDIAN_QUERY_BUDGET_PER_CATEGORY: "0"
      GDACS_ENABLED: "false"
      RELIEFWEB_ENABLED: "false"
      MAX_CANDIDATES_PER_CATEGORY: "1"
      MAX_ARTICLE_AGE_MS: "21600000"
      GROQ_BATCH_SIZE: "1"
      GROQ_MAX_REQUESTS_PER_RUN: "3"
      GROQ_MAX_WAIT_MS: "45000"
      NEWS_QUERY_DELAY_MS: "0"
      INTELLIGENCE_DOMAIN_SCORE_FRESH_MS: "2400000"
      INTELLIGENCE_REQUIRED_FRESH_MS: "86400000"
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require canonical scorer, direct Postgres and B2 publication credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${GROQ_API_KEY:-}${GEMINI_API_KEY:-}${MISTRAL_API_KEY:-}${CEREBRAS_API_KEY:-}" || {
            echo "::error::At least one canonical classifier provider key is required."
            exit 1
          }
          test -n "${B2_KEY_ID:-}"
          test -n "${B2_APPLICATION_KEY:-}"
          command -v unzip >/dev/null
          command -v psql >/dev/null
          node --input-type=module <<'NODE'
          const db = new URL(process.env.SUPABASE_DB_URL);
          const ref = 'ldpwajisioljyjtojvfx';
          const direct = db.hostname === `db.${ref}.supabase.co` && db.username === 'postgres';
          const pooler = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          if (!["postgres:", "postgresql:"].includes(db.protocol) || (!direct && !pooler)) {
            throw new Error('CURRENT_SCORING_DB_NOT_AUTHORITATIVE');
          }
          NODE

      - name: Require real authoritative Supabase write headroom
        shell: bash
        run: |
          set -euo pipefail
          # Legacy classifier writes public.events; do not run when the
          # frozen/free-tier guard says bulk_write_allowed=false.
          node scripts/ops/supabase-free-tier-budget.mjs --require-bulk-write --require-normal

      - name: Score stale current domains and publish verified B2 state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/run-intelligence-current-scoring-cycle.mjs

      - name: Upload current all-domain scoring evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intelligence-current-scoring-all-domains-${{ github.run_id }}
          path: |
            artifacts/intelligence-current-scoring-cycle/
            artifacts/intelligence-fastlane-publication.json
          if-no-files-found: warn
          retention-days: 14
