name: Expanded Official Three-Domain Source Observation
on:
  pull_request:
    paths:
      - "scripts/ops/probe-expanded-official-source-mesh.mjs"
      - "scripts/ops/observe-country-corridor-official-sources.mjs"
      - "scripts/lib/operator-country-corridor-reference.mjs"
      - "config/operator-country-source-crosswalk.v1.json"
      - "config/operator-corridor-source-crosswalk.v1.json"
      - "src/__tests__/operator-country-corridor-crosswalk.test.ts"
      - "scripts/ops/observe-operator-free-feed-rotation.mjs"
      - "src/__tests__/operator-free-feed-rotation.test.ts"
      - "config/operator-76-source-attribution-intake.v1.json"
      - "scripts/ops/probe-operator-official-intake.mjs"
      - "scripts/lib/operator-source-attribution.mjs"
      - "src/__tests__/operator-76-source-attribution-intake.test.ts"
      - "scripts/ops/observe-approved-reliefweb-live.mjs"
      - "src/__tests__/approved-reliefweb-live-observer.test.ts"
      - "src/__tests__/reliefweb-scheduled-failclosed.test.ts"
      - "scripts/ops/audit-official-step1-feed-redundancy.mjs"
      - "scripts/lib/official-source-quarantine.mjs"
      - "src/__tests__/official-step1-feed-redundancy.test.ts"
      - "src/__tests__/expanded-official-source-observation.test.ts"
      - ".github/workflows/expanded-official-source-observation.yml"
      - "scripts/ops/audit-90min-three-domain-coverage.mjs"
      - "src/__tests__/audit-90min-three-domain-coverage.test.ts"
  push:
    branches: [main]
    paths:
      - "scripts/ops/probe-expanded-official-source-mesh.mjs"
      - "scripts/ops/observe-country-corridor-official-sources.mjs"
      - "scripts/lib/operator-country-corridor-reference.mjs"
      - "config/operator-country-source-crosswalk.v1.json"
      - "config/operator-corridor-source-crosswalk.v1.json"
      - "src/__tests__/operator-country-corridor-crosswalk.test.ts"
      - "config/operator-76-source-attribution-intake.v1.json"
      - "scripts/ops/probe-operator-official-intake.mjs"
      - "scripts/lib/operator-source-attribution.mjs"
      - "src/__tests__/operator-76-source-attribution-intake.test.ts"
      - "scripts/ops/audit-official-step1-feed-redundancy.mjs"
      - "scripts/lib/official-source-quarantine.mjs"
      - ".github/workflows/expanded-official-source-observation.yml"
      - "scripts/ops/audit-90min-three-domain-coverage.mjs"
  schedule:
    # Sixteen intended slots/day: every 90 minutes in UTC. GitHub may
    # delay or skip runs; monitor reports observed lag, not guaranteed SLA.
    # 14 source GETs + bounded first-party article-date checks + 1 Eurostat fallback; private only.
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
    - cron: "47 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
concurrency:
  group: geomacro-expanded-official-source-${{ github.ref }}
  # Never cancel a scheduled 90-minute probe because a push landed mid-poll.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  contract-and-live-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Probe twelve active official transports and retain three quarantined routes
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          node scripts/ops/probe-expanded-official-source-mesh.mjs || rc=$?
          proof=artifacts/expanded-official-source/transport.json
          jq -e '
            .schema == "geomacro.expanded-official-source-observation.v1" and
            (.sources|length)==15 and
            .active_source_count==12 and
            .quarantined_source_count==3 and
            .all_registered_sources_transport_healthy==false and
            ([.sources[] | select(.quarantined==true)]|length)==3 and
            ([.sources[] | select(.quarantined==true)]|
              all(.format_valid==false and .publisher_reachable==false and
                .primary_http_status==null and .reason=="QUARANTINED_NOT_POLLED"
                and .commercial_eligible==false)) and
            .domains_observed==["geopolitics","macro","rare_earth"] and
            .globally_current_scored_coverage_verified == false and
            .verified_country_count==0 and
            .verified_current_event_domains==0 and
            .commercial_eligible==false and
            .source_rights_verified==false and
            .source_family_independence_verified==false and
            .supabase_reads==0 and .supabase_writes==0 and
            .d1_writes==0 and .b2_requests==0 and
            .payment_performed==false and
            (.original_publisher_native_24h_topic_counts | keys)==["geopolitics","macro","rare_earth"] and
            (.original_publisher_freshness_windows | keys)==["geopolitics","macro","rare_earth"] and
            ([.original_publisher_freshness_windows[] |
              (.within_90m | type)=="number" and
              (.within_6h | type)=="number" and
              (.within_24h | type)=="number" and
              .within_90m >= 0 and .within_90m <= .within_6h and
              .within_6h <= .within_24h and
              (.original_publisher_transport_healthy | type)=="boolean"] | all) and
            (.independent_original_origin_lanes | keys)==["geopolitics","macro","rare_earth"] and
            ([.independent_original_origin_lanes[] |
              (.organizations_with_6h_originals | type)=="number" and
              (.organizations_with_90m_originals | type)=="number" and
              .organizations_with_90m_originals>=0 and
              .organizations_with_90m_originals<=.organizations_with_6h_originals and
              .organizations_with_6h_originals<=4 and
              .possible_two_independent_origins_in_6h == (.organizations_with_6h_originals>=2) and
              .same_event_independent_corroboration_verified==false and
              .source_rights_verified==false and
              .commercial_eligible==false] | all) and
            ([.original_publisher_native_24h_topic_counts[]]|all(.>=0)) and
            ([.sources[] | select(.source_id=="eurostat_stats_update_official_rss_review") |
              if .format_valid then
                (.eurostat_native_dataset_data_updates_24h | type)=="number" and
                (.eurostat_other_catalogue_changes_24h | type)=="number" and
                .eurostat_native_dataset_data_updates_24h >= 0 and
                .eurostat_other_catalogue_changes_24h >= 0 and
                (.eurostat_native_dataset_data_updates_24h +
                 .eurostat_other_catalogue_changes_24h) == .source_native_24h_release_items
              else
                (.eurostat_native_dataset_data_updates_24h==null and
                 .eurostat_other_catalogue_changes_24h==null)
              end] | all) and
            ([.sources[] | .original_page_precise_date_checks]|all(.>=0 and .<=2)) and
            ([.sources[] | .commercial_eligible]|all(.==false)) and
            ([.sources[] | .current_scored_intelligence_verified]|all(.==false))
          ' "$proof" >/dev/null || exit 1
          if [[ "$rc" == "0" ]]; then
            jq -e '.status=="ACTIVE_SOURCE_TRANSPORT_OBSERVED_WITH_QUARANTINE" and
              .active_source_transport_healthy==true and
              ([.sources[] | select(.quarantined!=true) | .format_valid]|all(.==true))' "$proof" >/dev/null
            echo "::notice title=Active official issuer mesh::12 independent/issuer source endpoints polled; 3 known blocked routes remain QUARANTINED, not healthy. Source rights and event publication remain unverified."
          elif [[ "$rc" == "3" ]]; then
            jq -e '.status=="ACTIVE_SOURCE_TRANSPORT_DEGRADED" and
              .active_source_transport_healthy==false and
              ([.sources[] | select(.quarantined!=true) | .format_valid]|any(.==false))' "$proof" >/dev/null
            echo "::warning title=Active official source unavailable::ACTIVE_SOURCE_TRANSPORT_DEGRADED; no current event or paid intelligence claimed."
          else
            exit 1
          fi
          # Expected upstream transport failures are NOT a code regression on
          # PR; production/scheduled/manual run must stay fail-closed (RED).
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            exit "$rc"
          fi
      - name: Independently audit two working first-party issuers per category
        if: always()
        run: |
          node scripts/ops/audit-official-step1-feed-redundancy.mjs
          # Transport redundancy is NOT country relevance, article reuse
          # permission, multi-source same-event review or paid publication.
      - name: Retain sanitized private transport receipt for 3 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expanded-official-source-transport-${{ github.run_id }}
          path: |
            artifacts/expanded-official-source/transport.json
            artifacts/expanded-official-source/step1-issuer-readiness.json
          if-no-files-found: warn
          retention-days: 3

  approved-reliefweb-live:
    # One provider API request per existing 90-minute official poll (16/day).
    # No extra schedule, no DB. Humanitarian aggregator CONTEXT only.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    env:
      RELIEFWEB_APPROVED_APPNAME: ${{ secrets.RELIEFWEB_APPROVED_APPNAME }}
    steps:
      - name: Checkout current approved source monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 22 for approved ReliefWeb private metadata discovery
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Probe approved ReliefWeb once with no Supabase B2 D1 or x402 traffic
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/observe-approved-reliefweb-live.mjs
          jq -e '
            .schema == "geomacro.reliefweb-approved-private-observation.v1" and
            (.status == "CONFIG_REQUIRED" or .status == "ACCESS_DENIED_OR_QUOTA" or .status == "LIVE_METADATA_TRANSPORT") and
            .supabase_requests==0 and .d1_requests==0 and
            .b2_requests==0 and .usdc_spent==0 and
            .commercial_eligible==false and
            .independent_original_publisher_verified==false and
            .raw_report_bodies_stored==false and
            (.api_requests==0 or .api_requests==1)
          ' artifacts/expanded-official-source/reliefweb-approved.json >/dev/null
          if jq -e '.status == "LIVE_METADATA_TRANSPORT"' artifacts/expanded-official-source/reliefweb-approved.json >/dev/null; then
            echo "::notice title=ReliefWeb accepted::Approved appname reader reached ReliefWeb; original publisher rights, signed intelligence and 195 countries are not proven."
          else
            echo "::warning title=ReliefWeb not activated::Approved appname secret missing, denied or quota exhausted; official source polling continues."
          fi
      - name: Keep private ReliefWeb aggregate receipt for three days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reliefweb-approved-source-transport-${{ github.run_id }}
          path: artifacts/expanded-official-source/reliefweb-approved.json
          if-no-files-found: warn
          retention-days: 3

  operator-official-context:
    # Three additional distinct read-only source families, NOT a new schedule.
    # One bounded request/provider/cycle; NEVER writes to B2/D1/Supabase.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout verified operator context probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Probe USGS, Treasury, Federal Register (context only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/probe-operator-official-intake.mjs
          jq -e '
            .schema=="geomacro.operator-three-domain-official-context.v1" and
            .state=="ALL_THREE_CONTEXT_TRANSPORTS_LIVE" and
            .total_http_requests==3 and
            .raw_data_stored==false and
            .supabase_requests==0 and .d1_requests==0 and
            .b2_requests==0 and .paid_calls==0 and
            .three_domain_scored_intelligence_verified==false and
            ([.sources[] | .state=="LIVE_PRIVATE_METADATA" and
              .api_requests==1 and .commercial_eligible==false and
              .signed_gro==false] | all) and
            ([.sources[].domain] | sort == ["geopolitics","macro","rare_earth"])
          ' artifacts/expanded-official-source/operator-official-intake.json >/dev/null
      - name: Retain aggregate-only official context receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operator-three-domain-context-${{ github.run_id }}
          path: artifacts/expanded-official-source/operator-official-intake.json
          if-no-files-found: warn
          retention-days: 3

  operator-free-feed-initial-acceptance:
    # Only main push/explicit manual action checks all candidate groups.
    # PR must remain offline; scheduled checks use exactly one group below.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        source_group: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      OPERATOR_FREE_FEED_GROUP: ${{ matrix.source_group }}
    steps:
      - name: Checkout candidate source observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Audit actual public HTTP and no-key RSS sources; remain red on unavailable candidates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/observe-operator-free-feed-rotation.mjs
          jq -e '
            .schema=="geomacro.operator-free-rotating-private-feed-metadata.v1" and
            .supabase_requests==0 and .b2_requests==0 and .d1_requests==0 and
            .payments==0 and .raw_publisher_payload_persisted==false and
            .signed_gro_generated==false and
            .http_requests==.source_count and
            ([.sources[]|.commercial_eligible==false and .signed_gro==false]|all)
          ' artifacts/expanded-official-source/operator-free-feed-rotation.json >/dev/null
      - name: Preserve sanitized actual public-source findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operator-public-feed-initial-group-${{ matrix.source_group }}-${{ github.run_id }}
          path: artifacts/expanded-official-source/operator-free-feed-rotation.json
          retention-days: 3
          if-no-files-found: warn

  operator-free-feed-rotation-scheduled:
    # Existing 90-minute workflow slot, only 1 of 3 groups each time.
    # Every listed candidate is attempted approximately each 4.5h if
    # GitHub's best-effort scheduler dispatches all intended runs.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout candidate source observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Probe one rotating bounded public source group
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/observe-operator-free-feed-rotation.mjs
      - name: Retain private sanitized receipt for 3 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operator-public-feed-rotation-${{ github.run_id }}
          path: artifacts/expanded-official-source/operator-free-feed-rotation.json
          if-no-files-found: warn
          retention-days: 3

  operator-country-corridor-official-context:
    # 3 additional read-only no-key PUBLIC first-party sources for the
    # attached country/corridor companion lists. Existing 90-minute cron;
    # no raw event body, score, D1/B2/Supabase or payment transactions.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout source crosswalk and read-only official observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Check MARAD NBU and JOGMEC first-party public context endpoints
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/observe-country-corridor-official-sources.mjs
          jq -e '
            .schema=="geomacro.country-corridor-3domain-private-observation.v1" and
            .status=="ALL_THREE_OFFICIAL_CONTEXT_SOURCES_REACHABLE" and
            .api_requests==3 and
            .supabase_requests==0 and .d1_requests==0 and
            .b2_requests==0 and .x402_payment_attempts==0 and
            .original_report_content_stored==false and
            .signed_intelligence_generated==false and
            .country_and_corridor_scores_certified==false and
            ([.sources[]|.transport_state=="PRIVATE_OFFICIAL_METADATA_OBSERVED" and
              .http_requests==1 and .source_rights_for_paid_use_verified==false and
              .raw_data_stored==false and .commercial_eligible==false] | all) and
            ([.sources[].domain]|sort==["critical_minerals","geopolitics","macro_fx"])
          ' artifacts/expanded-official-source/country-corridor-official-context.json >/dev/null
      - name: Retain sanitized aggregate context proof for 3 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operator-country-corridor-context-${{ github.run_id }}
          path: artifacts/expanded-official-source/country-corridor-official-context.json
          if-no-files-found: warn
          retention-days: 3

  read-only-country-matrix:
    # Run even when upstream official source fails. One read-only D1 query.
    if: ${{ always() && github.repository == 'blocknine0/geomacro' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEOMACRO_EXPECTED_CRON: ${{ github.event.schedule }}
    steps:
      - name: Checkout exact canonical monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Prove 195 country x 3 category D1 readiness metadata without identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}" \
            || { echo "::error::D1_AGGREGATE_READ_AUTH_MISSING"; exit 3; }
          # Exactly one bounded SELECT; no country IDs, source URL, payload,
          # raw article, hash or signed object is ever retrieved.
          sql="SELECT lower(domain) AS domain, readiness_status, count(*) AS row_count, sum(CASE WHEN certified_source_count > 0 THEN 1 ELSE 0 END) AS certified_source_cells, sum(CASE WHEN last_verified_at IS NOT NULL AND unixepoch(last_verified_at) BETWEEN unixepoch('now','-90 minutes') AND unixepoch('now','+5 minutes') THEN 1 ELSE 0 END) AS recent_verified_cells, max(last_verified_at) AS last_verified_at FROM country_domain_state GROUP BY lower(domain), readiness_status ORDER BY domain, readiness_status LIMIT 90;"
          raw="$(mktemp)"; errors="$(mktemp)"
          trap 'rm -f "$raw" "$errors"' EXIT
          if ! npx -y wrangler@4.136.3 d1 execute geomacro-control-plane \
            --remote --json --command "$sql" >"$raw" 2>"$errors"; then
            echo "::error::D1_AGGREGATED_READ_QUERY_FAILED"
            exit 3
          fi
          node scripts/ops/audit-90min-three-domain-coverage.mjs < "$raw"
      - name: Retain derived-only 90-minute matrix receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: three-domain-90min-country-matrix-${{ github.run_id }}
          path: artifacts/expanded-official-source/90min-country-census.json
          if-no-files-found: warn
          retention-days: 3
