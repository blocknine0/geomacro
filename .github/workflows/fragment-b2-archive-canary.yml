name: Fragment B2 Archive Canary
on:
  push:
    branches:
      - ops/fragment-canary-run-once-20260930
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fragment-b2-archive-canary
  cancel-in-progress: false
jobs:
  archive-and-restore-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APP_SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_FRAGMENT_ARCHIVE_LIMIT: "1"
      B2_FRAGMENT_MIN_AGE_HOURS: "168"
      B2_FRAGMENT_DELETE_SOURCE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Archive exactly one old fragment without deleting source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/b2-fragment-archive-offload.mjs | tee "$RUNNER_TEMP/fragment-archive.json"
      - name: Bind restore to the exact archived fragment
        id: archived
        shell: bash
        run: |
          set -euo pipefail
          FRAGMENT_ID="$(node -e 'const fs=require("fs"); const lines=fs.readFileSync(process.env.RUNNER_TEMP+"/fragment-archive.json","utf8").trim().split(/\n/).filter(Boolean); const out=JSON.parse(lines.at(-1)); if(out.ok!==true || out.source_delete_enabled!==false || out.processed!==1 || out.deleted!==0 || !out.results?.[0]?.id) process.exit(2); process.stdout.write(String(out.results[0].id));')"
          test -n "$FRAGMENT_ID"
          echo "B2_FRAGMENT_RESTORE_ID=$FRAGMENT_ID" >> "$GITHUB_ENV"
          echo "fragment_id=$FRAGMENT_ID" >> "$GITHUB_OUTPUT"
      - name: Verify B2 restore path against the same fragment
        run: node scripts/ops/b2-fragment-restore.mjs
      - name: Confirm canary remained non-destructive
        shell: bash
        run: |
          test "${B2_FRAGMENT_DELETE_SOURCE}" = "0"
          echo "Archive + B2 readback + restore verification passed for ${{ steps.archived.outputs.fragment_id }}; source deletion stayed disabled."
