name: Regenerate Global Risk Route Tree Once

on:
  push:
    branches:
      - fix/global-risk-history-recovery-20261003
    paths:
      - .github/workflows/regenerate-global-risk-route-tree-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/global-risk-history-recovery-20261003

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate exact TanStack route tree
        run: bun run build

      - name: Commit generated route tree only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate Global Risk route tree"
          git push origin HEAD:fix/global-risk-history-recovery-20261003
