name: Eurostat Sovereign Fiscal Shadow Evidence

on:
  pull_request:
    paths:
      - "src/lib/country-risk-v02-macro.server.ts"
      - "src/lib/risk-gate-v2-eurostat-sovereign-fiscal.ts"
      - "src/lib/risk-gate-v2-eurostat-sovereign-fiscal.server.ts"
      - "src/__tests__/risk-gate-v2-eurostat-sovereign-fiscal.test.ts"
      - "scripts/audit-eurostat-sovereign-fiscal-shadow-census.ts"
      - "supabase/migrations/924_eurostat_government_debt_latest_view.sql"
      - ".github/workflows/eurostat-sovereign-fiscal-shadow.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/country-risk-v02-macro.server.ts"
      - "src/lib/risk-gate-v2-eurostat-sovereign-fiscal.ts"
      - "src/lib/risk-gate-v2-eurostat-sovereign-fiscal.server.ts"
      - "src/__tests__/risk-gate-v2-eurostat-sovereign-fiscal.test.ts"
      - "scripts/audit-eurostat-sovereign-fiscal-shadow-census.ts"
      - "supabase/migrations/924_eurostat_government_debt_latest_view.sql"
      - ".github/workflows/eurostat-sovereign-fiscal-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eurostat-sovereign-fiscal-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Eurostat sovereign-fiscal methodology tests
        run: bunx vitest run src/__tests__/risk-gate-v2-eurostat-sovereign-fiscal.test.ts

      - name: Guard phase-one activation boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "enabled_for_commercial_signals = false" supabase/migrations/924_eurostat_government_debt_latest_view.sql
          grep -q "expected_signal_activation: false" src/lib/risk-gate-v2-eurostat-sovereign-fiscal.server.ts
          grep -q "wdi_and_eurostat_debt_values_not_mixed: true" scripts/audit-eurostat-sovereign-fiscal-shadow-census.ts
          ! grep -q "generateRiskGateV2EurostatSovereignFiscalModuleState" src/lib/risk-gate-v2-macro-module-state.server.ts
          echo 'PASS: phase one remains shadow-only; production Risk Gate wiring is absent.'

  shadow-production-evidence:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EUROSTAT_SHADOW_CENSUS_OUTPUT: eurostat-sovereign-fiscal-shadow-census.json
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate authoritative production database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_SUPABASE_PROJECT_REF" || { echo "::error::Wrong production project id"; exit 1; }
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const db = new URL(process.env.SUPABASE_DB_URL);
          const api = new URL(process.env.SUPABASE_URL);
          const direct = db.hostname === `db.${ref}.supabase.co` && db.username === 'postgres';
          const pooler = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          if (!['postgres:', 'postgresql:'].includes(db.protocol) || (!direct && !pooler)) throw new Error('SUPABASE_DB_URL is not the authoritative production database');
          if (!db.password || db.pathname !== '/postgres') throw new Error('Invalid production database URL');
          if (api.hostname !== `${ref}.supabase.co`) throw new Error('SUPABASE_URL is not the authoritative production API');
          console.log('PASS: authoritative production database and API identities confirmed.');
          NODE

      - name: Apply only migration 924 on first canonical push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/924_eurostat_government_debt_latest_view.sql
          echo 'PASS: migration 924 applied without broad db push.'

      - name: Verify phase-one source and view state
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select commercial_usage_status || '|' || enabled_for_ingestion::text || '|' || enabled_for_commercial_signals::text from public.live_external_sources where source_id='eurostat_government_finance'")"
          test "$state" = 'COMMERCIAL_OK|true|false' || { echo "::error::Unexpected Eurostat source state: $state"; exit 1; }
          peers="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.live_eurostat_government_debt_latest")"
          test "$peers" -ge 20 || { echo "::error::Eurostat latest view has only $peers rows"; exit 1; }
          printf '{"source_state":"%s","latest_view_rows":%s,"production_scoring_promoted":false}\n' "$state" "$peers" | tee eurostat-shadow-source-evidence.json

      - name: Run full country-review shadow census
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-eurostat-sovereign-fiscal-shadow-census.ts 2>&1 | tee eurostat-sovereign-fiscal-shadow-census.log
          test -s "$EUROSTAT_SHADOW_CENSUS_OUTPUT"

      - name: Verify shadow evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.EUROSTAT_SHADOW_CENSUS_OUTPUT, 'utf8'));
          if (report.source_activation?.commercial_signals_enabled !== false) throw new Error('Shadow run unexpectedly enabled commercial signals');
          if (report.source_activation?.production_scoring_promoted !== false) throw new Error('Shadow run claims production promotion');
          if ((report.summary?.eurostat_fiscal_candidate_country_count ?? 0) < 20) throw new Error('Fewer than 20 Eurostat fiscal candidates');
          if ((report.summary?.shadow_accepted_country_count ?? 0) < 1) throw new Error('Zero end-to-end shadow accepted countries');
          if (report.claim_boundary?.wdi_and_eurostat_debt_values_not_mixed !== true) throw new Error('Debt concept boundary missing');
          console.log(JSON.stringify(report.summary));
          NODE
          echo 'PASS: Eurostat sovereign-fiscal shadow census produced end-to-end evidence without production scoring activation.'

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eurostat-sovereign-fiscal-shadow-evidence
          path: |
            eurostat-shadow-source-evidence.json
            eurostat-sovereign-fiscal-shadow-census.log
            eurostat-sovereign-fiscal-shadow-census.json
          if-no-files-found: warn
          retention-days: 30
