name: Validate Two Independent Mineral Original Article Clocks
on:
  pull_request:
    paths:
      - "scripts/ops/probe-official-mineral-article-original-metadata.ts"
      - ".github/workflows/verify-mineral-original-clocks.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-clocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: 
          bun-version: "1.4.2"
      - run: bun scripts/ops/probe-official-mineral-article-original-metadata.ts
