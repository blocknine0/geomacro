name: Intelligence Scored + Current Evidence

# QUOTA-HELD: This legacy publisher reads frozen Supabase Postgres, and B2
# writes must not be scheduled on unchanged/older inputs. Existing verified
# B2/D1 serving is NOT removed. Recovery is explicit main-only dispatch.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-scored-realtime
  cancel-in-progress: false

jobs:
  publish-scored-intelligence:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      # Mandatory shared account quota; without verified D1 reservation the
      # B2 client fails BEFORE issuing network GET/PUT.
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: intelligence_scored_legacy_recovery
      B2_REQUEST_BUDGET: "12"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"
      GRI_DB_MODE: direct_postgres
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ARCHIVE_WRITE_KEY_ID: ${{ secrets.B2_ARCHIVE_WRITE_KEY_ID }}
      B2_ARCHIVE_WRITE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_WRITE_APPLICATION_KEY }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install locked runtime dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve canonical D1 account-wide B2 quota ledger BEFORE legacy publisher
        shell: bash
        run: |
          set -euo pipefail
          test "${B2_ACCOUNT_QUOTA_REQUIRED:-}" = "1"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "D1 quota token missing: fail closed"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "D1 quota account missing: fail closed"; exit 2; }
          list="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          id="$(printf '%s' "$list" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const row=JSON.parse(s).find(x=>x.name===process.env.D1_DATABASE_NAME);
              process.stdout.write(row?.uuid??row?.id??"");
            });
          ')"
          test -n "$id" || { echo "Canonical D1 quota ledger missing: fail closed"; exit 2; }
          echo "D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
          node --check scripts/ops/b2-d1-account-governor.mjs
          echo "D1 account-wide quota reservation required for every canonical B2 request."

      - name: Require production read and B2 publish credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SUPABASE_PROJECT_REF" = "ldpwajisioljyjtojvfx"
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL is required"; exit 2; }
          test -n "${B2_KEY_ID:-}" || { echo "B2_KEY_ID is required"; exit 2; }
          test -n "${B2_APPLICATION_KEY:-}" || { echo "B2_APPLICATION_KEY is required"; exit 2; }
          test -n "${B2_ARCHIVE_READ_KEY_ID:-}" || { echo "B2_ARCHIVE_READ_KEY_ID is required for mandatory readback"; exit 2; }
          test -n "${B2_ARCHIVE_READ_APPLICATION_KEY:-}" || { echo "B2_ARCHIVE_READ_APPLICATION_KEY is required for mandatory readback"; exit 2; }
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || { echo "GEOMACRO_COMMERCE_LEDGER_TOKEN is required for D1 hot overlay"; exit 2; }
          command -v unzip >/dev/null

      - name: Require permanent production source anchors
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const required = {
            gdelt_v2_events: 'GEOPOLITICS',
            world_bank_indicators: 'MACRO',
            usgs_mcs: 'CRITICAL_MINERALS',
          };
          const { data, error } = await db
            .from('live_external_sources')
            .select('source_id,category,commercial_usage_status,enabled_for_ingestion,enabled_for_commercial_signals')
            .in('source_id', Object.keys(required));
          if (error) throw new Error(error.message);
          const byId = new Map((data ?? []).map((row) => [row.source_id, row]));
          for (const [sourceId, category] of Object.entries(required)) {
            const row = byId.get(sourceId);
            if (!row) throw new Error(`PRODUCTION_SOURCE_MISSING:${sourceId}`);
            if (row.category !== category) throw new Error(`PRODUCTION_SOURCE_CATEGORY_MISMATCH:${sourceId}`);
            if (row.commercial_usage_status !== 'COMMERCIAL_OK') throw new Error(`PRODUCTION_SOURCE_RIGHTS_NOT_OK:${sourceId}`);
            if (!row.enabled_for_ingestion || !row.enabled_for_commercial_signals) {
              throw new Error(`PRODUCTION_SOURCE_NOT_ENABLED:${sourceId}`);
            }
          }
          console.log(JSON.stringify({ ok: true, required_sources: Object.keys(required), source_discovery_owner: 'auto-ingest-news' }));
          NODE

      - name: Publish verified scored context plus certified current observations to B2
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/run-b2-public-intelligence-publisher.mjs | tee /tmp/intelligence-publish.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines = fs.readFileSync('/tmp/intelligence-publish.log', 'utf8').split(/\r?\n/).filter(Boolean);
          let proof = null;
          for (const line of lines) {
            try {
              const value = JSON.parse(line);
              if ([
                'geomacro.public-intelligence-direct-postgres-publish.v2',
                'geomacro.public-intelligence-overlay-recovery.v1',
              ].includes(value?.schema)) proof = value;
            } catch {}
          }
          const sharedValid =
            proof?.ok === true &&
            proof?.live_observed_unscored === true &&
            Number(proof?.live_observed_rows) >= 1 &&
            Boolean(proof?.current_source_batch_at) &&
            proof?.synthetic_score === false;
          if (
            proof?.schema === 'geomacro.public-intelligence-direct-postgres-publish.v2' &&
            (
              proof.b2_readback_verified !== true ||
              proof.live_observed_unscored !== true
            )
          ) {
            throw new Error('PUBLIC_INTELLIGENCE_FULL_B2_READBACK_PROOF_INVALID');
          }
          const fullB2PublishValid =
            proof?.schema === 'geomacro.public-intelligence-direct-postgres-publish.v2' &&
            proof?.authority_serve === 'backblaze-b2' &&
            proof?.scored_only === false &&
            proof?.b2_readback_verified === true;
          const capOverlayRecoveryValid =
            proof?.schema === 'geomacro.public-intelligence-overlay-recovery.v1' &&
            proof?.authority_read === 'verified-intelligence-edge' &&
            proof?.authority_serve === 'cloudflare-d1-hot-overlay' &&
            ['B2_DOWNLOAD_CAP_EXCEEDED','B2_TRANSACTION_CAP_EXCEEDED'].includes(proof?.recovery_reason) &&
            proof?.baseline_b2_readback_verified === true &&
            /^[0-9a-f]{64}$/.test(String(proof?.baseline_b2_sha256 ?? '')) &&
            Number.isFinite(Date.parse(String(proof?.baseline_generated_at ?? ''))) &&
            proof?.current_b2_snapshot_promoted === false &&
            proof?.raw_source_headlines_exposed === false &&
            proof?.provider_identity_exposed === false &&
            proof?.execution_authorized === false;
          if (!sharedValid || (!fullB2PublishValid && !capOverlayRecoveryValid)) {
            throw new Error('PUBLIC_INTELLIGENCE_PUBLISH_PROOF_INVALID');
          }
          fs.writeFileSync('/tmp/intelligence-publish-proof.json', JSON.stringify(proof, null, 2) + '\n');
          NODE

      - name: Require production Intelligence API convergence
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          : > /tmp/intelligence-convergence-diagnostics.jsonl
          # Intelligence edge caches a verified projection for up to 300s.
          # Keep the bounded convergence window strictly longer than that TTL.
          for attempt in $(seq 1 40); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            : > "$headers"
            code="$(curl -L -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 20 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "https://geomacro.live/api/public/intelligence?freshness_proof=${nonce}" || true)"
            if [ "$code" = "200" ] && node - "$body" /tmp/intelligence-publish-proof.json <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const proof = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const rows = Array.isArray(body?.rows) ? body.rows : [];
          const required = ['geopolitics','macro','rare_earth'];
          const requiredSet = new Set(required);
          const latestScored = new Map();
          let verified = 0;
          let live = 0;
          let newestLive = -Infinity;
          let ok = body?.ok === true && rows.length > 0;
          const now = Date.now();
          const dayMs = 24 * 60 * 60 * 1000;
          const futureToleranceMs = 5 * 60 * 1000;
          for (const row of rows) {
            const category = String(row?.category ?? '');
            const title = String(row?.source_title ?? '');
            if ('source_name' in row || 'source_domain' in row || 'source_url' in row) ok = false;
            if (row?.public_status === 'verified_b2') {
              verified++;
              const severity = Number(row?.severity);
              const timestamp = Date.parse(String(row?.published_at ?? row?.created_at ?? ''));
              if (!Number.isFinite(severity) || severity < 0 || severity > 100 || !title.startsWith('Geomacro finds ')) ok = false;
              if (!Number.isFinite(timestamp) || timestamp > now + futureToleranceMs) ok = false;
              if (requiredSet.has(category) && Number.isFinite(timestamp)) {
                latestScored.set(category, Math.max(latestScored.get(category) ?? -Infinity, timestamp));
              }
            } else if (row?.public_status === 'live_observed') {
              live++;
              if (category !== 'geopolitics' || row?.severity !== null || row?.delta !== null || !title.startsWith('Geomacro observes ')) ok = false;
              const timestamp = Date.parse(String(row?.published_at ?? row?.created_at ?? ''));
              if (!Number.isFinite(timestamp) || timestamp > now + futureToleranceMs) ok = false;
              else newestLive = Math.max(newestLive, timestamp);
            } else {
              ok = false;
            }
          }
          for (const category of required) if (!latestScored.has(category)) ok = false;
          const scoredCurrentAcrossAllDomains = required.every((category) => {
            const timestamp = latestScored.get(category) ?? -Infinity;
            return Number.isFinite(timestamp) && timestamp <= now + futureToleranceMs && now - timestamp <= dayMs;
          });
          if (Number(body?.verified_rows) !== verified || Number(body?.live_observed_rows) !== live) ok = false;
          if (body?.current_within_24h !== true) ok = false;
          const expectedBatch = Date.parse(String(proof?.current_source_batch_at ?? ''));
          if (!Number.isFinite(expectedBatch)) ok = false;
          if (scoredCurrentAcrossAllDomains) {
            if (body?.mode !== 'verified_b2' || live !== 0) ok = false;
          } else {
            if (body?.mode !== 'verified_b2_plus_live_observed' || live < 1) ok = false;
            const responseNewest = Date.parse(String(body?.newest_at ?? ''));
            if (!Number.isFinite(responseNewest) || responseNewest < expectedBatch) ok = false;
            if (!Number.isFinite(newestLive) || newestLive < expectedBatch) ok = false;
          }
          process.exit(ok ? 0 : 1);
          NODE
            then
              cp "$body" /tmp/intelligence-current.json
              echo "Production Intelligence API converged under the canonical scored/current serving policy on attempt ${attempt}."
              exit 0
            fi

            node - "$body" "$headers" "$attempt" "$code" /tmp/intelligence-publish-proof.json <<'NODE' | tee -a /tmp/intelligence-convergence-diagnostics.jsonl
          const fs = require('fs');
          const [bodyPath, headerPath, attemptRaw, statusRaw, proofPath] = process.argv.slice(2);
          let body = null;
          let proof = null;
          try { body = JSON.parse(fs.readFileSync(bodyPath, 'utf8')); } catch {}
          try { proof = JSON.parse(fs.readFileSync(proofPath, 'utf8')); } catch {}
          const headerText = fs.readFileSync(headerPath, 'utf8');
          const responseHeaderBlocks = headerText.split(/\r?\n\r?\n/).filter(Boolean);
          const finalHeaderBlock = responseHeaderBlocks.at(-1) ?? '';
          const headerMap = new Map();
          for (const line of finalHeaderBlock.split(/\r?\n/).slice(1)) {
            const index = line.indexOf(':');
            if (index > 0) headerMap.set(line.slice(0, index).trim().toLowerCase(), line.slice(index + 1).trim());
          }
          const rows = Array.isArray(body?.rows) ? body.rows : [];
          const required = ['geopolitics','macro','rare_earth'];
          const latestScored = new Map();
          const liveRows = rows.filter((row) => row?.public_status === 'live_observed');
          const liveTimes = liveRows
            .map((row) => Date.parse(String(row?.published_at ?? row?.created_at ?? '')))
            .filter(Number.isFinite);
          const newestLiveMs = liveTimes.length > 0 ? Math.max(...liveTimes) : NaN;
          for (const row of rows) {
            if (row?.public_status !== 'verified_b2') continue;
            const category = String(row?.category ?? '');
            if (!required.includes(category)) continue;
            const timestamp = Date.parse(String(row?.published_at ?? row?.created_at ?? ''));
            if (Number.isFinite(timestamp)) latestScored.set(category, Math.max(latestScored.get(category) ?? -Infinity, timestamp));
          }
          const now = Date.now();
          const scoredCurrentAcrossAllDomains = required.every((category) => {
            const timestamp = latestScored.get(category) ?? -Infinity;
            return Number.isFinite(timestamp) && timestamp <= now + 5 * 60_000 && now - timestamp <= 24 * 60 * 60 * 1000;
          });
          const expectedBatchMs = Date.parse(String(proof?.current_source_batch_at ?? ''));
          const diagnostic = {
            schema: 'geomacro.intelligence-convergence-diagnostic.v2',
            attempt: Number(attemptRaw),
            http_status: Number(statusRaw) || 0,
            expected_current_source_batch_at: proof?.current_source_batch_at ?? null,
            response: {
              ok: body?.ok ?? null,
              mode: body?.mode ?? null,
              row_count: rows.length,
              verified_rows: body?.verified_rows ?? null,
              live_observed_rows: body?.live_observed_rows ?? null,
              current_within_24h: body?.current_within_24h ?? null,
              newest_at: body?.newest_at ?? null,
              newest_live_at: Number.isFinite(newestLiveMs) ? new Date(newestLiveMs).toISOString() : null,
              scored_current_across_all_domains: scoredCurrentAcrossAllDomains,
              expected_batch_visible: Number.isFinite(expectedBatchMs) && Number.isFinite(newestLiveMs)
                ? newestLiveMs >= expectedBatchMs
                : false,
            },
            cache_headers: {
              cache_control: headerMap.get('cache-control') ?? null,
              cdn_cache_control: headerMap.get('cdn-cache-control') ?? null,
              age: headerMap.get('age') ?? null,
              cf_cache_status: headerMap.get('cf-cache-status') ?? null,
              etag: headerMap.get('etag') ?? null,
              last_modified: headerMap.get('last-modified') ?? null,
              server: headerMap.get('server') ?? null,
            },
          };
          console.log(JSON.stringify(diagnostic));
          NODE

            if [ "$attempt" -lt 40 ]; then sleep 10; fi
          done
          echo "::error::Production Intelligence API did not converge under the canonical scored/current serving policy within the bounded acceptance window."
          exit 1

      - name: Upload Intelligence acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: intelligence-current-${{ github.run_id }}
          path: |
            /tmp/intelligence-current.json
            /tmp/intelligence-publish-proof.json
            /tmp/intelligence-convergence-diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 30
