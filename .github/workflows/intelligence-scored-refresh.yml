name: Intelligence Scored Catch-up

on:
  workflow_dispatch:
    inputs:
      catchup:
        description: "Run bounded scored catch-up before publishing"
        required: true
        default: true
        type: boolean
      lookback_hours:
        description: "Catch-up source lookback in hours"
        required: true
        default: "96"
        type: string

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-scored-catchup
  cancel-in-progress: false

jobs:
  publish-scored-intelligence:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      GRI_DB_MODE: direct_postgres
      GEOMACRO_DISABLE_GUARDIAN: "true"
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install locked runtime dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require production credentials and Guardian-disabled boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SUPABASE_PROJECT_REF" = "ldpwajisioljyjtojvfx"
          test "$GEOMACRO_DISABLE_GUARDIAN" = "true"
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL is required"; exit 2; }
          test -n "${B2_KEY_ID:-}" || { echo "B2_KEY_ID is required"; exit 2; }
          test -n "${B2_APPLICATION_KEY:-}" || { echo "B2_APPLICATION_KEY is required"; exit 2; }

      - name: Require permanent production source anchors
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          const db = createGriDbClient();
          const required = {
            gdelt_v2_events: 'GEOPOLITICS',
            world_bank_indicators: 'MACRO',
            usgs_mcs: 'CRITICAL_MINERALS',
          };
          const { data, error } = await db
            .from('live_external_sources')
            .select('source_id,category,commercial_usage_status,enabled_for_ingestion,enabled_for_commercial_signals')
            .in('source_id', Object.keys(required));
          if (error) throw new Error(error.message);
          const byId = new Map((data ?? []).map((row) => [row.source_id, row]));
          for (const [sourceId, category] of Object.entries(required)) {
            const row = byId.get(sourceId);
            if (!row) throw new Error(`PRODUCTION_SOURCE_MISSING:${sourceId}`);
            if (row.category !== category) throw new Error(`PRODUCTION_SOURCE_CATEGORY_MISMATCH:${sourceId}`);
            if (row.commercial_usage_status !== 'COMMERCIAL_OK') throw new Error(`PRODUCTION_SOURCE_RIGHTS_NOT_OK:${sourceId}`);
            if (!row.enabled_for_ingestion || !row.enabled_for_commercial_signals) {
              throw new Error(`PRODUCTION_SOURCE_NOT_ENABLED:${sourceId}`);
            }
          }
          console.log(JSON.stringify({ ok: true, required_sources: Object.keys(required), guardian_commercial_dependency: false }));
          NODE

      - name: Validate catch-up lookback
        if: inputs.catchup
        shell: bash
        env:
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
        run: |
          set -euo pipefail
          [[ "$LOOKBACK_HOURS" =~ ^[0-9]+$ ]] || { echo "lookback_hours must be an integer"; exit 2; }
          if (( LOOKBACK_HOURS < 1 || LOOKBACK_HOURS > 168 )); then
            echo "lookback_hours must be between 1 and 168" >&2
            exit 2
          fi
          echo "MAX_ARTICLE_AGE_MS=$((LOOKBACK_HOURS * 3600000))" >> "$GITHUB_ENV"

      - name: Catch up classifier-scored events from reviewed GDELT discovery
        if: inputs.catchup
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_INGEST_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_INGEST_MODEL }}
          GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_INGEST_MODEL }}
          CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          GROQ_BATCH_DELAY_MS: ${{ vars.GROQ_BATCH_DELAY_MS }}
          GROQ_MAX_REQUESTS_PER_RUN: "30"
          GROQ_MIN_REMAINING_REQUESTS: ${{ vars.GROQ_MIN_REMAINING_REQUESTS }}
          GROQ_MIN_REMAINING_TOKENS: ${{ vars.GROQ_MIN_REMAINING_TOKENS }}
          GROQ_MAX_WAIT_MS: "180000"
          GROQ_BATCH_SIZE: "2"
          MAX_CANDIDATES_PER_CATEGORY: "12"
          GUARDIAN_QUERY_BUDGET_PER_CATEGORY: "1"
          NEWS_QUERY_DELAY_MS: ${{ vars.NEWS_QUERY_DELAY_MS }}
          NEWS_MAX_RETRIES: "2"
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY }}
          RELIEFWEB_ENABLED: "false"
          GDACS_ENABLED: "false"
        run: node scripts/ingest-news.js

      - name: Publish scored verified three-domain Intelligence to B2
        run: bun scripts/ops/publish-b2-public-intelligence-direct-postgres.mjs

      - name: Verify production Intelligence API is scored-only
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body="$(mktemp)"
            code="$(curl -L -sS -o "$body" -w '%{http_code}' --max-time 20 -H 'Accept: application/json' 'https://geomacro.live/api/public/intelligence' || true)"
            if [ "$code" = "200" ]; then
              if node - "$body" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const body = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = Array.isArray(body?.rows) ? body.rows : [];
          const required = new Set(['geopolitics','macro','rare_earth']);
          const seen = new Set();
          let ok = body?.ok === true && body?.mode === 'verified_b2' && Number(body?.live_observed_rows) === 0 && rows.length > 0;
          for (const row of rows) {
            const severity = Number(row?.severity);
            const category = String(row?.category ?? '');
            if (!Number.isFinite(severity) || severity < 0 || severity > 100 || row?.public_status !== 'verified_b2') ok = false;
            if (required.has(category)) seen.add(category);
          }
          for (const category of required) if (!seen.has(category)) ok = false;
          process.exit(ok ? 0 : 1);
          NODE
              then
                cp "$body" /tmp/intelligence-scored.json
                exit 0
              fi
            fi
            sleep $((attempt * 4))
          done
          echo "Production Intelligence did not expose a scored-only three-domain package" >&2
          exit 1

      - name: Upload scored Intelligence acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: intelligence-scored-${{ github.run_id }}
          path: /tmp/intelligence-scored.json
          if-no-files-found: warn
          retention-days: 30
