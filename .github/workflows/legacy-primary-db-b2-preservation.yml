name: Legacy Primary DB Private B2 Preservation (No Deletion)
# On main, tries ONE complete old-primary pg_dump only after verified
# account-wide versioned B2 free-capacity + existing D1 quota headroom.
# Private dumps NEVER enter GitHub artifacts, logs, pull requests or releases.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-primary-db-b2-preservation.yml"
      - "scripts/ops/legacy-primary-db-b2-preservation.mjs"
  pull_request:
    paths:
      - ".github/workflows/legacy-primary-db-b2-preservation.yml"
      - "scripts/ops/legacy-primary-db-b2-preservation.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-legacy-primary-db-private-preservation
  cancel-in-progress: false

jobs:
  locked-safety-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Require exact pinned source and no deletion without credentials
        env:
          APP_SUPABASE_URL: ""
          SUPABASE_DB_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          B2_KEY_ID: ""
          B2_APPLICATION_KEY: ""
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""
        run: |
          set -euo pipefail
          node --check scripts/ops/legacy-primary-db-b2-preservation.mjs
          node scripts/ops/legacy-primary-db-b2-preservation.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('artifacts/legacy-exit/primary-db-b2-readback.json','utf8'));
          if(r.project_deletion_authorized!==false ||
             r.source_project!=='ldpwajisioljyjtojvfx' ||
             r.copy_completed!==false ||r.b2_exact_full_body_sha256_readback_verified!==false ||
             r.source_db_writes!==0 ||r.source_storage_deletes!==0||
             r.payments!==0||r.status!=='BLOCKED_NO_DELETION')
            throw Error('LEGACY_DB_EXPORT_SAFETY_CONTRACT_FAILED');
          NODE

  governed-private-db-archive:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_LEGACY_INVENTORY_KEY_ID: ${{ secrets.B2_LEGACY_INVENTORY_KEY_ID }}
      B2_LEGACY_INVENTORY_APPLICATION_KEY: ${{ secrets.B2_LEGACY_INVENTORY_APPLICATION_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Resolve EXISTING shared account quota ledger UUID without D1 mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!/^[a-f0-9]{32}$/u.test(account??''))
            throw Error('LEGACY_EXIT_D1_ACCOUNT_UNAVAILABLE');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?per_page=100',{
            headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
            redirect:'error',signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          const id=data?.result?.find(x=>x.name==='geomacro-control-plane')?.uuid;
          if(!response.ok||data.success!==true||!/^[a-f0-9-]{36}$/u.test(id??''))
            throw Error('LEGACY_EXIT_SHARED_D1_LEDGER_UNAVAILABLE');
          appendFileSync(process.env.GITHUB_ENV,'D1_DATABASE_ID='+id+'\n');
          NODE
      - name: Produce protected PG17 export, SSE-B2 and full independent B2 GET readback
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/legacy-primary-db-b2-preservation.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('artifacts/legacy-exit/primary-db-b2-readback.json','utf8'));
          if(r.project_deletion_authorized!==false ||
             r.source_db_writes!==0||r.source_storage_deletes!==0||r.payments!==0)
            throw Error('LEGACY_DB_IRREVERSIBLE_MUTATION_GUARD');
          if(r.copy_completed!==true){
            console.log('::warning::LEGACY_PRIVATE_B2_DB_EXPORT_BLOCKED_'+r.reason);
            // Fail visibly. Only an actual B2 round trip counts as completion.
            process.exitCode=3;
          }
          NODE
      - name: Upload ONLY status and counters, no raw DB bytes, credentials or B2 object key
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: legacy-primary-db-preservation-${{ github.run_id }}
          path: artifacts/legacy-exit/primary-db-b2-readback.json
          if-no-files-found: warn
          retention-days: 14
