name: Daily Three-Category Private Evidence Grading and Digest (No Funds)

# Inherits the existing Phase2H 6-hour B2 archiver (PUT, two GET, SHA D1
# ack). Neither the daily grader nor the scheduled artifact is a payment
# publisher. All raw/derived original records stay private.
on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - ".github/workflows/daily-grounded-intelligence-digest.yml"
      - "src/pipelines/evidence-grader.ts"
      - "src/__tests__/phase2h-daily-evidence-grading.test.ts"
      - "scripts/ops/compile-daily-grounded-digests.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-daily-private-evidence-grading
  cancel-in-progress: false

jobs:
  offline-evidence-contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked test dependencies
        run: bun install --frozen-lockfile
      - name: Verify SHA, B2 archive, five-part, category and no-charge contracts
        run: |
          bunx vitest run src/__tests__/phase2h-daily-evidence-grading.test.ts
          bun build scripts/ops/compile-daily-grounded-digests.ts --target=bun --outdir=/tmp/geomacro-daily-evidence-build
  source-quota-admission:
    if: >-
      github.event_name == 'schedule' &&
      github.event.schedule == '0 0 * * *' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      research: ${{ steps.quota.outputs.research }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Account-wide bundled D1 quota including protected PREDGE reserve
        id: quota
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs
      - name: Explain non-payable quota hold
        if: steps.quota.outputs.research != 'true'
        run: echo "::notice::DAILY_PRIVATE_DIGEST_QUOTA_HELD; no canonical D1 query or paid product"
  compile-private-country-digests:
    needs: source-quota-admission
    if: >-
      needs.source-quota-admission.result == 'success' &&
      needs.source-quota-admission.outputs.research == 'true' &&
      github.event_name == 'schedule' &&
      github.event.schedule == '0 0 * * *' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      GEOMACRO_DAILY_DIGEST_QUOTA_ADMITTED: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Resolve existing canonical control-plane D1 (no new database)
        shell: bash
        run: |
          set -euo pipefail
          bun --eval '
          import {appendFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/.test(account??"")||(token??"").length<20)
            throw Error("DAILY_DIGEST_D1_PROTECTED_CREDENTIALS_MISSING");
          const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+
            account+"/d1/database?per_page=100",{
            headers:{Authorization:"Bearer "+token},signal:AbortSignal.timeout(15000)});
          const body=await response.json();
          const matches=body?.result?.filter(x=>x.name==="geomacro-control-plane")??[];
          if(!response.ok||body.success!==true||matches.length!==1||
             !/^[0-9a-f-]{36}$/i.test(matches[0].uuid??""))
            throw Error("DAILY_DIGEST_CANONICAL_D1_NOT_VERIFIED");
          appendFileSync(process.env.GITHUB_ENV,"D1_DATABASE_ID="+matches[0].uuid+"\n");
          '
      - name: Compile only B2-acknowledged private 72h sources, no automatic paid catalog
        run: bun scripts/ops/compile-daily-grounded-digests.ts
      - name: Retain private short-lived digest and metadata-only receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-private-daily-evidence-digest-${{ github.run_id }}
          path: |
            artifacts/private-daily-intelligence/country-category-digest.json
            artifacts/private-daily-intelligence/receipt.json
          retention-days: 3
          if-no-files-found: warn
