name: Temporary GOAT route-tree sync

on:
  push:
    branches:
      - feat/goat-x402-partner-pilot

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regenerate TanStack route tree
        run: npm run build
      - name: Commit generated route tree only
        run: |
          git add src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Route tree already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(routes): sync generated GOAT pilot routes"
          git push origin HEAD:feat/goat-x402-partner-pilot
