name: Apply Testnet Credential Lifecycle Production

on:
  pull_request:
    paths:
      - "supabase/migrations/928_testnet_developer_credential_lifecycle.sql"
      - ".github/workflows/apply-testnet-credential-lifecycle-production.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/928_testnet_developer_credential_lifecycle.sql"
      - ".github/workflows/apply-testnet-credential-lifecycle-production.yml"

permissions:
  contents: read

concurrency:
  group: testnet-credential-lifecycle-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate exact migration boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/apply-testnet-credential-lifecycle-production.yml"
          migration="supabase/migrations/928_testnet_developer_credential_lifecycle.sql"
          test -f "$migration"
          grep -q '928_testnet_developer_credential_lifecycle.sql' "$workflow"
          grep -q 'EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx' "$workflow"
          grep -q 'issue_testnet_developer_credential' "$migration"
          grep -q 'revoke_testnet_developer_credential' "$migration"
          grep -q 'rotate_testnet_developer_credential' "$migration"
          grep -q 'commercial_api_credential_lifecycle_events' "$migration"
          grep -q 'testnet_developer_one_live_mapping_per_principal' "$migration"
          forbidden="supabase db"' push'
          if grep -Fq "$forbidden" "$workflow"; then
            echo "::error::Credential lifecycle rollout must never apply unrelated pending migrations."
            exit 1
          fi
          echo "PASS: production rollout is scoped to migration 928 only."

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate authoritative production database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_SUPABASE_PROJECT_REF" || { echo "::error::Wrong production project id"; exit 1; }
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const db = new URL(process.env.SUPABASE_DB_URL);
          const directHost = `db.${ref}.supabase.co`;
          const poolerMatch = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          const directMatch = db.hostname === directHost && db.username === 'postgres';
          if (!['postgres:', 'postgresql:'].includes(db.protocol) || (!directMatch && !poolerMatch)) {
            throw new Error('SUPABASE_DB_URL is not the authoritative production database');
          }
          if (!db.password || db.pathname !== '/postgres') throw new Error('Invalid production database URL');
          console.log('PASS: authoritative production database identity confirmed.');
          NODE

      - name: Apply only migration 928
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/928_testnet_developer_credential_lifecycle.sql"
          test -f "$migration"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          echo "PASS: migration 928 applied to authoritative production database."

      - name: Verify lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          table_name="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select coalesce(to_regclass('public.commercial_api_credential_lifecycle_events')::text,'')")"
          test "$table_name" = "commercial_api_credential_lifecycle_events" || test "$table_name" = "public.commercial_api_credential_lifecycle_events"

          issue_fn="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select coalesce(to_regprocedure('public.issue_testnet_developer_credential(uuid,text,text,text[],timestamptz,text,text)')::text,'')")"
          revoke_fn="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select coalesce(to_regprocedure('public.revoke_testnet_developer_credential(uuid,uuid)')::text,'')")"
          rotate_fn="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select coalesce(to_regprocedure('public.rotate_testnet_developer_credential(uuid,uuid,text,text,text[],timestamptz,text,text)')::text,'')")"
          test -n "$issue_fn" && test -n "$revoke_fn" && test -n "$rotate_fn"

          index_count="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_indexes where schemaname='public' and indexname='testnet_developer_one_live_mapping_per_principal'")"
          test "$index_count" = "1"

          rls="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='commercial_api_credential_lifecycle_events'")"
          test "$rls" = "t"

          echo "PASS: credential lifecycle table, RLS, one-live-key index and all three lifecycle RPCs are present."
