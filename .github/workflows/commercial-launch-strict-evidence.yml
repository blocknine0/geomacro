name: Commercial Launch Strict Evidence

on:
  workflow_dispatch:
    inputs:
      published_sha:
        description: 'Exact canonical main SHA already published through Lovable Publish changes'
        required: true
        type: string
      staging_requests:
        description: 'Bounded isolated staging requests (max 2000)'
        required: true
        default: '120'
        type: string
      staging_concurrency:
        description: 'Concurrent staging workers (max 25)'
        required: true
        default: '8'
        type: string
      staging_mode:
        description: 'country, corridor, or mixed'
        required: true
        default: 'mixed'
        type: choice
        options:
          - country
          - corridor
          - mixed

permissions:
  contents: read
  actions: read

concurrency:
  group: commercial-launch-strict-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require dispatched SHA to be exact candidate
        shell: bash
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${PUBLISHED_SHA,,}" == "${GITHUB_SHA,,}" ]]
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify staging safety contracts
        run: |
          bun x tsx scripts/load-test-risk-gate-staging.ts --self-test
          bun x tsx scripts/probe-risk-gate-staging-response-security.ts --self-test
          node scripts/validate-risk-gate-staging-load-report.mjs --self-test
          node scripts/scale/validate-million-agent-distributed-results.mjs --self-test
      - name: Build production boundaries
        run: bun run build
      - name: Audit privileged source and browser bundle boundaries
        env:
          P0_REQUIRE_BROWSER_BUILD: '1'
        run: node scripts/audit-p0-secret-boundaries.mjs
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commercial-launch-strict-contract-${{ github.run_id }}
          path: artifacts/p0-secret-boundary-audit.json
          if-no-files-found: error
          retention-days: 90

  distributed-capacity-proof:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require a successful real 40k burst+soak run on this exact candidate SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ inputs.published_sha }}
        with:
          script: |
            const expectedSha = String(process.env.EXPECTED_SHA || '').trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('published_sha must be a full 40-character SHA');
              return;
            }
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'million-agent-distributed-staging-execution.yml',
              branch: 'main',
              event: 'workflow_dispatch',
              status: 'success',
              per_page: 100,
            });
            const candidates = response.data.workflow_runs
              .filter((run) => String(run.head_sha || '').toLowerCase() === expectedSha && run.conclusion === 'success')
              .sort((a, b) => Number(b.id) - Number(a.id));
            for (const run of candidates) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 });
              const expectedArtifact = `distributed-40k-capacity-pass-${run.id}`;
              const finalEvidence = artifacts.data.artifacts.find((artifact) => artifact.name === expectedArtifact && artifact.expired === false);
              if (finalEvidence) {
                core.info(`PASS: same-SHA real 40k capacity workflow run ${run.id} with final evidence artifact ${expectedArtifact}.`);
                core.summary
                  .addHeading('Same-SHA real distributed capacity proof', 3)
                  .addRaw(`Workflow run: ${run.id}\n`)
                  .addRaw(`Candidate SHA: ${expectedSha}\n`)
                  .addRaw(`Evidence artifact: ${expectedArtifact}\n`)
                  .addRaw('Scope: isolated staging 40k arrival-rate burst + five-minute soak; no production load or mainnet activation.\n');
                await core.summary.write();
                return;
              }
            }
            core.setFailed(`No successful Distributed 40k Staging Execution run with a non-expired final capacity artifact exists for exact candidate SHA ${expectedSha}. Strict commercial launch closure remains blocked.`);

  staging-risk-gate:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      RISK_GATE_STAGING_BASE_URL: ${{ vars.RISK_GATE_STAGING_BASE_URL }}
      RISK_GATE_STAGING_API_KEY: ${{ secrets.RISK_GATE_STAGING_API_KEY }}
      RISK_GATE_LOAD_TEST_ACK: STAGING_ONLY
      RISK_GATE_LOAD_TEST_REQUESTS: ${{ inputs.staging_requests }}
      RISK_GATE_LOAD_TEST_CONCURRENCY: ${{ inputs.staging_concurrency }}
      RISK_GATE_LOAD_TEST_MODE: ${{ inputs.staging_mode }}
      RISK_GATE_LOAD_TEST_COUNTRY_ISO3: USA
      RISK_GATE_LOAD_TEST_CORRIDOR_ORIGIN_ISO3: USA
      RISK_GATE_LOAD_TEST_CORRIDOR_DESTINATION_ISO3: CHN
      RISK_GATE_LOAD_TEST_ALLOW_429: 'false'
      RISK_GATE_LOAD_TEST_TIMEOUT_MS: '10000'
      RISK_GATE_LOAD_TEST_MAX_P95_MS: '3000'
      RISK_GATE_LOAD_TEST_MAX_P99_MS: '8000'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require isolated staging configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RISK_GATE_STAGING_BASE_URL:-}" ]]
          [[ -n "${RISK_GATE_STAGING_API_KEY:-}" ]]
      - name: Probe authenticated staging response security boundary
        run: bun x tsx scripts/probe-risk-gate-staging-response-security.ts
      - name: Run bounded staging Risk Gate HTTP load
        run: bun x tsx scripts/load-test-risk-gate-staging.ts
      - name: Enforce prelaunch latency and zero-error gates
        run: node scripts/validate-risk-gate-staging-load-report.mjs
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commercial-launch-strict-staging-${{ github.run_id }}
          path: |
            artifacts/risk-gate-staging-response-security.json
            artifacts/risk-gate-staging-http-load.json
            artifacts/risk-gate-staging-http-load-validation.json
          if-no-files-found: error
          retention-days: 90

  published-live-surface:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require published SHA to match dispatched main SHA
        shell: bash
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${PUBLISHED_SHA,,}" == "${GITHUB_SHA,,}" ]]
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Verify exact published live surface
        env:
          GEOMACRO_LIVE_BASE_URL: https://geomacro.live
          GEOMACRO_LIVE_EXPECTED_HOST: geomacro.live
          GEOMACRO_EXPECTED_DEPLOYED_SHA: ${{ inputs.published_sha }}
        run: node scripts/ops/live-launch-surface-smoke.mjs
      - name: Run outside-in non-destructive security smoke
        env:
          GEOMACRO_EXTERNAL_SECURITY_BASE_URL: https://geomacro.live
          GEOMACRO_EXTERNAL_SECURITY_EXPECTED_HOST: geomacro.live
        run: node scripts/ops/external-surface-security-smoke.mjs
      - name: Upload published-surface evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commercial-launch-strict-live-${{ github.run_id }}
          path: |
            artifacts/live-launch-surface-smoke.json
            artifacts/external-surface-security-smoke.json
          if-no-files-found: error
          retention-days: 90

  summary:
    if: always()
    needs:
      - contract
      - distributed-capacity-proof
      - staging-risk-gate
      - published-live-surface
    runs-on: ubuntu-latest
    steps:
      - name: Record strict evidence boundary
        shell: bash
        run: |
          {
            echo '## Commercial Launch Strict Evidence'
            echo
            echo '- Exact candidate + build/secret-boundary contract: ${{ needs.contract.result }}'
            echo '- Same-SHA real 40k isolated-staging burst+soak proof: ${{ needs.distributed-capacity-proof.result }}'
            echo '- Isolated staging Risk Gate security/bounded-load/SLO: ${{ needs.staging-risk-gate.result }}'
            echo '- Exact published SHA + outside-in live security: ${{ needs.published-live-surface.result }}'
            echo
            echo 'This workflow never performs production load, payment settlement, mainnet activation, real-funds authorization or public Early Warning activation.'
            echo 'A successful same-SHA 40k evidence run proves only the recorded isolated-staging arrival-rate profiles under their stated SLO/security conditions, not 40,000 simultaneous open connections or unlimited production capacity.'
            echo 'Passing this workflow is first-party launch evidence, not a third-party penetration-test certification.'
          } >> "$GITHUB_STEP_SUMMARY"
