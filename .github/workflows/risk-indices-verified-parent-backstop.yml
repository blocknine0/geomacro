name: Risk Indices Verified GRI Parent Repair Backstop (No Funds)

# Guarantees a missed GRI->indices workflow_run trigger can recover while
# the genuine signed GRI parent is STILL current. No news score, no signatures,
# no Supabase, no B2, no customer payment in this scheduler.
# Verify current GitHub main and signed D1 parent independently of website
# publication; exact website SHA remains a separate launch acceptance.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
  # A second narrowly checked wake-up complements the existing direct
  # downstream trigger; it never creates a numerical index itself.
  workflow_run:
    workflows: ["GRI v1.2 Supabase-Free Current Promotion"]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/risk-indices-verified-parent-backstop.yml"
      - "scripts/ops/risk-indices-verified-parent-backstop.mjs"
      - "scripts/lib/risk-indices-verified-parent-backstop.test.mjs"
      - "scripts/ops/observe-risk-indices-continuity.mjs"
      - "scripts/lib/risk-indices-continuity-watchdog.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/risk-indices-verified-parent-backstop.yml"
      - "scripts/ops/risk-indices-verified-parent-backstop.mjs"
      - "scripts/lib/risk-indices-verified-parent-backstop.test.mjs"
      - "scripts/ops/observe-risk-indices-continuity.mjs"
      - "scripts/lib/risk-indices-continuity-watchdog.test.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-verified-gri-parent-indices-backstop
  cancel-in-progress: false

jobs:
  source-and-negative-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify no-score, no-funds, valid-parent-only backstop
        run: |
          set -euo pipefail
          node --check scripts/ops/risk-indices-verified-parent-backstop.mjs
          node --check scripts/ops/observe-risk-indices-continuity.mjs
          node --test scripts/lib/risk-indices-verified-parent-backstop.test.mjs
          node --test scripts/lib/risk-indices-continuity-watchdog.test.mjs

  read-only-acceptance-on-main-update:
    needs: source-and-negative-tests
    # A canonical deployment changes code, not certification. Check the
    # public signed state once immediately; never dispatch, sign or rewrite.
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      EXPECTED_CANONICAL_MAIN_SHA: ${{ github.sha }}
      GRI_READY_REVIEWED_SHA256: ${{ vars.GRI_READY_REVIEWED_SHA256 }}
      GRI_READY_CERTIFICATES_SHA256: ${{ vars.GRI_READY_CERTIFICATES_SHA256 }}
      GRI_READY_APPROVED_AT: ${{ vars.GRI_READY_APPROVED_AT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Read-only exact main acceptance without source signer or payments
        run: |
          set -euo pipefail
          test "$EXPECTED_CANONICAL_MAIN_SHA" = "$(git rev-parse HEAD)"
          node scripts/ops/observe-risk-indices-continuity.mjs

  dispatch-only-after-verified-parent:
    needs: source-and-negative-tests
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
          (github.event.workflow_run.event == 'repository_dispatch' ||
           github.event.workflow_run.event == 'workflow_dispatch')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      EXPECTED_CANONICAL_MAIN_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Recheck protected exact SHA without source or B2 reads
        run: |
          set -euo pipefail
          test "$EXPECTED_CANONICAL_MAIN_SHA" = "$(git rev-parse HEAD)"
          test -f .github/workflows/risk-indices-verified-d1-parent.yml
          grep -Fq "publish-risk-indices-from-verified-global-risk.mjs --verified-d1-parent-only" \
            .github/workflows/risk-indices-verified-d1-parent.yml
      - name: Dispatch existing governed indices publisher ONLY for verified current GRI with missing indices
        run: node scripts/ops/risk-indices-verified-parent-backstop.mjs
      - name: Independently observe numerical parent and public index delivery without scoring
        # No new scheduler; piggyback existing verified-parent backstop.
        # No B2 direct GET, D1 writes, secret keys or synthetic GRI credentials.
        if: ${{ always() }}
        env:
          GRI_READY_REVIEWED_SHA256: ${{ vars.GRI_READY_REVIEWED_SHA256 }}
          GRI_READY_CERTIFICATES_SHA256: ${{ vars.GRI_READY_CERTIFICATES_SHA256 }}
          GRI_READY_APPROVED_AT: ${{ vars.GRI_READY_APPROVED_AT }}
        run: node scripts/ops/observe-risk-indices-continuity.mjs
