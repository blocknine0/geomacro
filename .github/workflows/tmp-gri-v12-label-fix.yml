name: Temporary GRI v1.2 Label Fix

on:
  push:
    branches:
      - fix/gri-v12-label-drift

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gri-v12-label-fix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact current-v1.2 label corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "scripts/lib/gri-engine-v12.js": [
                  ("GRI v1.1 fail-closed input rejection:", "GRI v1.2 fail-closed input rejection:"),
              ],
              "src/lib/gri-proof-data.ts": [
                  ("current v1.1 proof contract.", "current v1.2 proof contract."),
                  ("current v1.1 provenance contract.", "current v1.2 provenance contract."),
              ],
              "scripts/compute-gri-v12.js": [
                  ("complete v1.1 input/story/weight/proof path", "complete v1.2 input/story/weight/proof path"),
              ],
              "scripts/replay-gri-history-v12.js": [
                  ("Replay v1.1 deliberately uses", "Replay v1.2 deliberately uses"),
              ],
          }

          for raw_path, pairs in replacements.items():
              path = Path(raw_path)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one occurrence of {old!r} in {raw_path}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          git diff --check

      - name: Commit exact replacements
        run: |
          if git diff --quiet; then
            echo "No label drift remained."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/gri-engine-v12.js src/lib/gri-proof-data.ts scripts/compute-gri-v12.js scripts/replay-gri-history-v12.js
          git commit -m "fix: align current GRI v1.2 labels [gri-v12-label-fix]"
          git push origin HEAD:fix/gri-v12-label-drift
