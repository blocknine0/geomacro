name: Intelligence Current Scoring Fastlane
# Manual recovery only. The 20-minute all-domain current-scoring cadence now
# lives inside the single Geomacro Intelligence Orchestrator as current_scoring.
# This wrapper forces exactly that canonical task when an operator needs a
# bounded recovery without creating a second recurring writer.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  recover-current-scoring:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
      MAX_CANDIDATES_PER_CATEGORY: "1"
      MAX_ARTICLE_AGE_MS: "21600000"
      GROQ_BATCH_SIZE: "1"
      GROQ_MAX_REQUESTS_PER_RUN: "3"
      GROQ_MAX_WAIT_MS: "45000"
      INTELLIGENCE_ORCHESTRATOR_MAX_TASKS: "1"
      INTELLIGENCE_ORCHESTRATOR_TASK_ALLOWLIST: current_scoring
      INTELLIGENCE_ORCHESTRATOR_FORCE_TASKS: current_scoring

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require normal free-tier headroom through authoritative direct PostgreSQL
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        run: node scripts/ops/supabase-free-tier-budget.mjs --require-bulk-write --require-normal

      - name: Run exactly the canonical current_scoring recovery task
        env:
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/intelligence-orchestrator.mjs | tee intelligence-current-scoring-recovery.json
          jq -e '.ok == true and (.selected | length == 1) and .selected[0].task == "current_scoring" and .selected[0].ok == true' intelligence-current-scoring-recovery.json >/dev/null

      - name: Upload current scoring recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-scoring-recovery-${{ github.run_id }}
          path: |
            intelligence-current-scoring-recovery.json
            artifacts/intelligence-current-scoring-cycle/**
          if-no-files-found: warn
          retention-days: 14
