name: Intelligence Current Scoring Fastlane

on:
  schedule:
    - cron: "13,33,53 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/intelligence-current-scoring-fastlane.yml"

permissions:
  contents: read

concurrency:
  # Same writer lock as Auto Ingest News / legacy orchestrator. This is the
  # canonical ingest-news scorer at a bounded current-evidence cadence, not a
  # second scoring implementation.
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  score-current-domain:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
      # Current fast lane: one GDELT discovery request, one category, no
      # Guardian/GDACS/ReliefWeb expansion, and at most two classifier inputs.
      GEOMACRO_GDELT_ONLY: "true"
      GUARDIAN_QUERY_BUDGET_PER_CATEGORY: "0"
      GDACS_ENABLED: "false"
      RELIEFWEB_ENABLED: "false"
      MAX_CANDIDATES_PER_CATEGORY: "2"
      MAX_ARTICLE_AGE_MS: "21600000"
      GROQ_BATCH_SIZE: "2"
      GROQ_MAX_REQUESTS_PER_RUN: "4"
      GROQ_MAX_WAIT_MS: "45000"
      NEWS_QUERY_DELAY_MS: "0"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require authoritative direct-Postgres and classifier path
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${GROQ_API_KEY:-}${GEMINI_API_KEY:-}${MISTRAL_API_KEY:-}${CEREBRAS_API_KEY:-}" || {
            echo "::error::At least one canonical classifier provider key is required."
            exit 1
          }
          node --input-type=module <<'NODE'
          const db = new URL(process.env.SUPABASE_DB_URL);
          const ref = 'ldpwajisioljyjtojvfx';
          const direct = db.hostname === `db.${ref}.supabase.co` && db.username === 'postgres';
          const pooler = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          if (!["postgres:", "postgresql:"].includes(db.protocol) || (!direct && !pooler)) {
            throw new Error('FASTLANE_DB_NOT_AUTHORITATIVE');
          }
          NODE

      - name: Select rotating current domain
        shell: bash
        run: |
          set -euo pipefail
          slot=$(( $(date -u +%s) / 1200 % 3 ))
          case "$slot" in
            0) domain=geopolitics ;;
            1) domain=macro ;;
            2) domain=rare_earth ;;
          esac
          echo "GDELT_FORCE_CATEGORY=$domain" >> "$GITHUB_ENV"
          echo "FASTLANE_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "Current scoring domain: $domain"

      - name: Enable bounded GDELT-only mode in canonical scorer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/ingest-news.js';
          let source = fs.readFileSync(path, 'utf8');

          const categoryMarker = "function gdeltCategoryForCurrentRun(now = new Date()) {\n";
          const categoryInjection = categoryMarker +
            "  const forcedCategory = String(process.env.GDELT_FORCE_CATEGORY || '').trim();\n" +
            "  if (GDELT_DISCOVERY_CATEGORY_ORDER.includes(forcedCategory)) return forcedCategory;\n\n";
          if (!source.includes(categoryMarker)) throw new Error('GDELT_SELECTOR_MARKER_MISSING');
          if (!source.includes('GDELT_FORCE_CATEGORY')) source = source.replace(categoryMarker, categoryInjection);

          const guardianMarker = "function guardianQueryPlan(\n  queries,\n  priorityQueries = [],\n) {\n";
          const guardianInjection = guardianMarker +
            "  if (String(process.env.GEOMACRO_GDELT_ONLY || '').toLowerCase() === 'true') {\n" +
            "    return { queries: [], totalQueries: Array.isArray(queries) ? queries.length : 0, budget: 0, totalChunks: 0, chunkIndex: 0, startIndex: 0, endIndex: 0, priorityQueries: [] };\n" +
            "  }\n\n";
          if (!source.includes(guardianMarker)) throw new Error('GUARDIAN_PLAN_MARKER_MISSING');
          if (!source.includes('GEOMACRO_GDELT_ONLY')) source = source.replace(guardianMarker, guardianInjection);

          const historyMarker = ".select('source_url, source_title')\n        .range(from, from + PAGE_SIZE - 1);";
          const historyReplacement = ".select('source_url, source_title')\n        .gte('created_at', new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString())\n        .range(from, from + PAGE_SIZE - 1);";
          if (!source.includes(historyMarker)) throw new Error('FASTLANE_HISTORY_SCAN_MARKER_MISSING');
          if (!source.includes("7 * 24 * 60 * 60 * 1000).toISOString()")) {
            source = source.replace(historyMarker, historyReplacement);
          }

          fs.writeFileSync(path, source, 'utf8');
          const verified = fs.readFileSync(path, 'utf8');
          for (const marker of ['GDELT_FORCE_CATEGORY', 'GEOMACRO_GDELT_ONLY', "7 * 24 * 60 * 60 * 1000).toISOString()"] ) {
            if (!verified.includes(marker)) throw new Error(`FASTLANE_PATCH_MISSING:${marker}`);
          }
          NODE

      - name: Run bounded canonical current scorer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ingest-news.js 2>&1 | tee /tmp/current-scoring.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const log = fs.readFileSync('/tmp/current-scoring.log', 'utf8');
          const matches = [...log.matchAll(/\{"discovery_candidates_classified":(\d+),"events_inserted":(\d+),"candidates_rejected":(\d+)\}/g)];
          if (!matches.length) throw new Error('FASTLANE_SCORER_SUMMARY_MISSING');
          const [, classified, inserted, rejected] = matches.at(-1);
          if (/Guardian discovery:|GDACS discovery:|ReliefWeb discovery:/.test(log)) {
            throw new Error('FASTLANE_NON_GDELT_DISCOVERY_USED');
          }
          const proof = {
            schema: 'geomacro.current-scoring-fastlane.v1',
            ok: true,
            domain: process.env.FASTLANE_DOMAIN,
            classification_version: 'event-severity-v1.0.5',
            classification_prompt_version: 'risk-desk-filter-v1.0.5',
            discovery_provider: 'gdelt',
            raw_feature_score_promotion: false,
            recent_dedupe_window_days: 7,
            classified_candidates: Number(classified),
            inserted_events: Number(inserted),
            rejected_candidates: Number(rejected),
            completed_at: new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/current-scoring-proof.json', JSON.stringify(proof, null, 2) + '\n');
          console.log(JSON.stringify(proof));
          NODE

      - name: Verify latest canonical scored state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createGriDbClient } from './scripts/lib/gri-db-client.mjs';
          import fs from 'node:fs';
          const db = createGriDbClient();
          const domain = process.env.FASTLANE_DOMAIN;
          const { data, error } = await db
            .from('events')
            .select('id,category,severity,confidence,classification_version,classification_prompt_version,published_at,created_at')
            .eq('category', domain)
            .eq('classification_version', 'event-severity-v1.0.5')
            .order('published_at', { ascending: false })
            .limit(1);
          if (error) throw new Error(error.message);
          const latest = data?.[0] ?? null;
          if (latest && (!Number.isFinite(Number(latest.severity)) || Number(latest.severity) < 0 || Number(latest.severity) > 100)) {
            throw new Error('FASTLANE_LATEST_SEVERITY_INVALID');
          }
          const proof = JSON.parse(fs.readFileSync('/tmp/current-scoring-proof.json', 'utf8'));
          proof.latest_canonical_scored_event = latest;
          fs.writeFileSync('/tmp/current-scoring-proof.json', JSON.stringify(proof, null, 2) + '\n');
          console.log(JSON.stringify({ ok: true, domain, latest }));
          NODE

      - name: Upload current scoring proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: current-scoring-fastlane-${{ github.run_id }}
          path: |
            /tmp/current-scoring-proof.json
            /tmp/current-scoring.log
          if-no-files-found: warn
          retention-days: 14
