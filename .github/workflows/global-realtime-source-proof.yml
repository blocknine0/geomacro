name: Global Realtime Source Proof

on:
  pull_request:
    paths:
      - "scripts/audit-global-realtime-source-freshness.mjs"
      - "supabase/migrations/920_multi_source_commercial_registry.sql"
      - ".github/workflows/global-realtime-source-proof.yml"
  workflow_dispatch:
concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove live source freshness
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-global-realtime-source-freshness.mjs | tee global-realtime-source-freshness.log
          grep -q 'PASS: GLOBAL REALTIME SOURCE FRESHNESS PROOF COMPLETE - NO WRITES' global-realtime-source-freshness.log
          jq -e '.writes_performed == false' global-realtime-source-freshness.json >/dev/null
          jq -e '.claim_boundary.source_absence_never_becomes_zero_risk == true' global-realtime-source-freshness.json >/dev/null
          jq -e '.summary.failed_sources == 0' global-realtime-source-freshness.json >/dev/null
          jq -e '.checks | map(.source_id) | index("gdelt_v2_events") != null' global-realtime-source-freshness.json >/dev/null
          jq -e '.checks | map(.source_id) | index("usgs_earthquake_hazards") != null' global-realtime-source-freshness.json >/dev/null

      - name: Upload freshness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-realtime-source-freshness
          path: |
            global-realtime-source-freshness.json
            global-realtime-source-freshness.log
          if-no-files-found: warn
          retention-days: 30

  exact-head-production-realtime-acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      INVINO_API_KEY: ${{ secrets.INVINO_API_KEY }}
      RELIEFWEB_APP_NAME: ${{ secrets.RELIEFWEB_APP_NAME }}
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      LIVE_STRUCTURE_MAX_ATTEMPTS: 4
      LIVE_STRUCTURE_ATTEMPT_TIMEOUT_MS: 90000
      BREAKING_RSS_ENABLED: true
      BREAKING_RSS_RUN_ONCE: true
      TELEGRAM_ENABLED: false
      GRI_PUBLISH_ENABLED: false
      RAW_SOURCE_SYNC_CONCURRENCY: 6
      RAW_SOURCE_CELL_MAX_ATTEMPTS: 3
      INTELLIGENCE_ORCHESTRATOR_MAX_TASKS: 8
      INTELLIGENCE_ORCHESTRATOR_TASK_ALLOWLIST: gdelt_gal,gdelt_v2,open_realtime_mesh,rss_live,realtime_fanout,production_readiness
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned RSS worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input -r workers/telegram-flash/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify authoritative production target
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL}"
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY}"
          test "${SUPABASE_PROJECT_ID}" = "ldpwajisioljyjtojvfx"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Deploy realtime flash functions
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          supabase functions deploy live-flash-ingest --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt
          supabase functions deploy live-flash-corroborate --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt

      - name: Smoke-check realtime corroboration OIDC
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://geomacro.live/actions/live-flash-rss")"
          token="$(printf "%s" "${response}" | jq -er ".value")"
          code="$(curl --silent --show-error --output /tmp/realtime-corroborate-health.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${token}" -H "x-geomacro-github-oidc-token: ${token}" -H 'Content-Type: application/json' "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/live-flash-corroborate?mode=health")"
          cat /tmp/realtime-corroborate-health.json
          test "${code}" = "200"
          grep -q '"authenticated":true' /tmp/realtime-corroborate-health.json

      - name: Refresh all three raw runtime categories
        shell: bash
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              export RAW_SOURCE_CATEGORY_ALLOWLIST="${category}"
              timeout 15m bun scripts/sync-country-raw-source-mesh.mjs > "country-raw-source-acceptance-${category}.json" 2>&1
            ) > "category-acceptance-${category}.log" 2>&1 &
          done
          wait
          node -e 'const fs=require("node:fs"); for (const category of ["GEOPOLITICS","MACRO","CRITICAL_MINERALS"]) { const f="country-raw-source-acceptance-"+category+".json"; if(!fs.existsSync(f)) throw new Error("MISSING_"+f); const x=JSON.parse(fs.readFileSync(f,"utf8")); if(x.ok!==true || x.failed_cells!==0 || x.missing_non_gdelt_paths.length!==0 || x.processed_cells+x.already_fresh_non_gdelt_cells!==195 || x.categories.length!==1 || x.categories[0]!==category) { console.error(JSON.stringify(x,null,2)); process.exit(1); } console.log(JSON.stringify({category,expected_cells:x.expected_cells,processed_cells:x.processed_cells,already_fresh_non_gdelt_cells:x.already_fresh_non_gdelt_cells,failed_cells:x.failed_cells,missing_non_gdelt_paths:x.missing_non_gdelt_paths.length,fragment_ids:x.fragment_ids.length})); }'

      - name: Drain acceptance fragments in parallel
        shell: bash
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              timeout 15m node scripts/drain-live-structure.mjs --fragment-ids-file "country-raw-source-acceptance-${category}.json"
            ) >> "category-acceptance-${category}.log" 2>&1 &
          done
          wait

      - name: Run realtime orchestrator continuity
        run: |
          set -euo pipefail
          node scripts/intelligence-orchestrator.mjs 2>&1 | tee intelligence-orchestrator-acceptance.log

      - name: Final raw freshness convergence
        shell: bash
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              export RAW_SOURCE_CATEGORY_ALLOWLIST="${category}"
              timeout 15m bun scripts/sync-country-raw-source-mesh.mjs > "country-raw-source-final-${category}.json" 2>&1
            ) > "category-final-${category}.log" 2>&1 &
          done
          wait
          node -e 'const fs=require("node:fs"); for (const category of ["GEOPOLITICS","MACRO","CRITICAL_MINERALS"]) { const f="country-raw-source-final-"+category+".json"; if(!fs.existsSync(f)) throw new Error("MISSING_"+f); const x=JSON.parse(fs.readFileSync(f,"utf8")); if(x.ok!==true || x.failed_cells!==0 || x.missing_non_gdelt_paths.length!==0 || x.processed_cells+x.already_fresh_non_gdelt_cells!==195 || x.categories.length!==1 || x.categories[0]!==category) { console.error(JSON.stringify(x,null,2)); process.exit(1); } console.log(JSON.stringify({category,expected_cells:x.expected_cells,processed_cells:x.processed_cells,already_fresh_non_gdelt_cells:x.already_fresh_non_gdelt_cells,failed_cells:x.failed_cells,missing_non_gdelt_paths:x.missing_non_gdelt_paths.length,fragment_ids:x.fragment_ids.length})); }'

      - name: Drain final freshness fragments
        shell: bash
        run: |
          set -euo pipefail
          for category in GEOPOLITICS MACRO CRITICAL_MINERALS; do
            (
              timeout 15m node scripts/drain-live-structure.mjs --fragment-ids-file "country-raw-source-final-${category}.json"
            ) >> "category-final-${category}.log" 2>&1 &
          done
          wait

      - name: Verify final realtime contracts
        run: |
          set -euo pipefail
          node scripts/audit-global-raw-source-runtime.mjs
          node scripts/audit-realtime-scope-fanout.mjs
          node scripts/audit-gdelt-dependency-live.mjs

      - name: Run strict Global Realtime Intelligence 100 gate
        run: |
          set -euo pipefail
          node scripts/audit-global-realtime-intelligence-100.mjs --strict

      - name: Upload exact-head production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.1.0
        with:
          name: global-realtime-intelligence-100-${{ github.event.pull_request.head.sha }}
          path: |
            country-raw-source-acceptance-GEOPOLITICS.json
            country-raw-source-acceptance-MACRO.json
            country-raw-source-acceptance-CRITICAL_MINERALS.json
            country-raw-source-final-GEOPOLITICS.json
            country-raw-source-final-MACRO.json
            country-raw-source-final-CRITICAL_MINERALS.json
            intelligence-orchestrator-acceptance.log
            category-acceptance-*.log
            category-final-*.log
            artifacts/global-realtime-intelligence-100/summary.json
          if-no-files-found: warn
          retention-days: 30
