name: Temporary Route Tree Regeneration

on:
  push:
    branches:
      - codex/pre-mainnet-x402-full-readiness-20260916
    paths:
      - ".github/workflows/temp-route-tree-regenerate.yml"
      - "src/routes/api.x402.circle_.intelligence.ts"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/pre-mainnet-x402-full-readiness-20260916
          fetch-depth: 0
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate exact TanStack route tree
        run: bun run build
      - name: Commit generated route tree only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate route tree for Circle x402 route"
          git push origin HEAD:codex/pre-mainnet-x402-full-readiness-20260916
