name: Geomacro Commercial Production Acceptance

on:
  push:
    branches:
      - hardening/source-network-risk-gate-production
      - ops/commercial-acceptance-run-20260920
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - 'scripts/audit-source-certification-100.mjs'
      - 'scripts/test-global-source-endpoints.mjs'
      - 'scripts/accept-risk-gate-testnet.mjs'
      - 'src/lib/source-certification-contract.ts'
      - 'src/lib/risk-gate-readiness.server.ts'
      - 'src/lib/risk-gate-commercial-readiness.server.ts'
      - 'src/routes/api.risk-gate-readiness.ts'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geomacro-commercial-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RISK_GATE_STAGING_BASE_URL: ${{ vars.RISK_GATE_STAGING_BASE_URL }}
      RISK_GATE_STAGING_API_KEY: ${{ secrets.RISK_GATE_STAGING_API_KEY }}
      RISK_GATE_LOAD_TEST_ACK: STAGING_ONLY

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Verify exact replay revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Replay revision: ${GITHUB_SHA}"
          git show -s --format='Replay commit: %H %s' HEAD

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Full migration replay from zero
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          trap 'supabase stop --no-backup' EXIT
          supabase db reset --local --no-seed

      - name: Validate read-only production audit database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const url = new URL(process.env.SUPABASE_DB_URL);
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) throw new Error('SUPABASE_DB_URL must use postgres:// or postgresql://');
          const directHosts = new Set([`db.${ref}.supabase.co`,`db.${ref}.supabase.com`]);
          const directOk = directHosts.has(url.hostname) && ['postgres', `postgres.${ref}`].includes(url.username);
          const poolerOk = url.hostname.endsWith('.pooler.supabase.com') && url.username === `postgres.${ref}`;
          if (!directOk && !poolerOk) throw new Error('Refusing read-only audit against a database outside the canonical Geomacro production project.');
          if (!url.password || url.pathname !== '/postgres') throw new Error('Invalid production audit database target.');
          if (![5432,6543].includes(Number(url.port || 5432))) throw new Error('Unexpected Supabase database port.');
          console.log('PASS: canonical production audit database identity verified; workflow performs read-only SQL only.');
          NODE

      - name: Probe all source endpoints
        env:
          SOURCE_PROBE_MAX_URLS: '5000'
          SOURCE_PROBE_TIMEOUT_MS: '12000'
          SOURCE_PROBE_CONCURRENCY: '12'
          SOURCE_PROBE_CLASSIFY: 'true'
        run: bun run source:endpoints:probe

      - name: Observe real GDELT GAL freshness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/gdelt-freshness
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -AtF '|' -c "select freshness_1800_complete::text, coalesce(lag_seconds::text,''), coalesce(latest_source_period_end::text,''), coalesce(latest_verified_at::text,'') from public.live_realtime_source_freshness_status" > artifacts/gdelt-freshness/observation.tsv
          cat artifacts/gdelt-freshness/observation.tsv
          IFS='|' read -r fresh lag period verified < artifacts/gdelt-freshness/observation.tsv
          test "${fresh}" = "true"
          test -n "${period}"
          test -n "${verified}"
          test "${lag}" -ge 0
          test "${lag}" -le 1800

      - name: Probe isolated staging Risk Gate response security
        env:
          RISK_GATE_STAGING_BASE_URL: ${{ vars.RISK_GATE_STAGING_BASE_URL }}
          RISK_GATE_STAGING_API_KEY: ${{ secrets.RISK_GATE_STAGING_API_KEY }}
          RISK_GATE_LOAD_TEST_ACK: STAGING_ONLY
        run: bun x tsx scripts/probe-risk-gate-staging-response-security.ts

      - name: Run bounded isolated staging Risk Gate load
        env:
          RISK_GATE_STAGING_BASE_URL: ${{ vars.RISK_GATE_STAGING_BASE_URL }}
          RISK_GATE_STAGING_API_KEY: ${{ secrets.RISK_GATE_STAGING_API_KEY }}
          RISK_GATE_LOAD_TEST_ACK: STAGING_ONLY
          RISK_GATE_LOAD_TEST_REQUESTS: '120'
          RISK_GATE_LOAD_TEST_CONCURRENCY: '8'
          RISK_GATE_LOAD_TEST_MODE: 'mixed'
          RISK_GATE_LOAD_TEST_COUNTRY_ISO3: USA
          RISK_GATE_LOAD_TEST_CORRIDOR_ORIGIN_ISO3: USA
          RISK_GATE_LOAD_TEST_CORRIDOR_DESTINATION_ISO3: CHN
          RISK_GATE_LOAD_TEST_ALLOW_429: 'false'
          RISK_GATE_LOAD_TEST_TIMEOUT_MS: '10000'
          RISK_GATE_LOAD_TEST_MAX_P95_MS: '3000'
          RISK_GATE_LOAD_TEST_MAX_P99_MS: '8000'
        run: bun x tsx scripts/load-test-risk-gate-staging.ts

      - name: Validate staging Risk Gate load evidence
        run: node scripts/validate-risk-gate-staging-load-report.mjs

      - name: Strict source certification audit
        run: node scripts/audit-source-certification-100.mjs --strict

      - name: Live Risk Gate testnet acceptance
        env:
          RISK_GATE_STAGING_BASE_URL: ${{ vars.RISK_GATE_STAGING_BASE_URL }}
          RISK_GATE_STAGING_API_KEY: ${{ secrets.RISK_GATE_STAGING_API_KEY }}
          RISK_GATE_LOAD_TEST_ACK: STAGING_ONLY
        run: bun scripts/accept-risk-gate-testnet.mjs

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geomacro-commercial-acceptance-${{ github.run_id }}
          path: |
            artifacts/source-certification-100
            artifacts/global-source-endpoint-probe
            artifacts/risk-gate-testnet-acceptance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record acceptance proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-proofs
          cat > ".ci-proofs/commercial-acceptance-${GITHUB_SHA}.json" <<EOF
          {
            "suite": "geomacro-commercial-production-acceptance",
            "status": "${{ job.status == 'success' && 'PASS' || 'FAIL' }}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "replay_command": "supabase db reset --local --no-seed",
            "staging_migration": "supabase db push --db-url ...",
            "strict_source_audit": "node scripts/audit-source-certification-100.mjs --strict",
            "risk_gate_acceptance": "bun scripts/accept-risk-gate-testnet.mjs"
          }
          EOF
          cat ".ci-proofs/commercial-acceptance-${GITHUB_SHA}.json"
