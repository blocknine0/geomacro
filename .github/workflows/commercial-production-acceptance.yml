name: Geomacro Commercial Production Acceptance

on:
  push:
    branches:
      - hardening/source-network-risk-gate-production
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - 'scripts/audit-source-certification-100.mjs'
      - 'scripts/test-global-source-endpoints.mjs'
      - 'scripts/accept-risk-gate-testnet.mjs'
      - 'src/lib/source-certification-contract.ts'
      - 'src/lib/risk-gate-readiness.server.ts'
      - 'src/lib/risk-gate-commercial-readiness.server.ts'
      - 'src/routes/api.risk-gate-readiness.ts'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geomacro-commercial-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      EXPECTED_SUPABASE_PROJECT_REF: hencqxkmmcgnothotqpq
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RISK_GATE_STAGING_BASE_URL: ${{ vars.RISK_GATE_STAGING_BASE_URL }}
      RISK_GATE_STAGING_API_KEY: ${{ secrets.RISK_GATE_STAGING_API_KEY }}
      RISK_GATE_LOAD_TEST_ACK: STAGING_ONLY

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Verify exact replay revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Replay revision: ${GITHUB_SHA}"
          git show -s --format='Replay commit: %H %s' HEAD

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Full migration replay from zero
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          trap 'supabase stop --no-backup' EXIT
          supabase db reset --local --no-seed

      - name: Validate isolated staging database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          let url;
          try { url = new URL(process.env.SUPABASE_DB_URL); }
          catch { throw new Error('SUPABASE_DB_URL must be a valid connection URL'); }
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) {
            throw new Error('SUPABASE_DB_URL must use postgres:// or postgresql://');
          }
          const directHost = `db.${ref}.supabase.co`;
          const poolerHost = url.hostname.endsWith('.pooler.supabase.com');
          const directMatch = url.hostname === directHost && url.username === 'postgres';
          const poolerMatch = poolerHost && url.username === `postgres.${ref}`;
          if (!directMatch && !poolerMatch) {
            throw new Error('Refusing database target outside geomacro-staging.');
          }
          if (!url.password || url.pathname !== '/postgres') {
            throw new Error('Invalid staging database target.');
          }
          console.log('PASS: isolated geomacro-staging database identity confirmed.');
          NODE

      - name: Show pending staging migrations
        run: supabase db push --db-url "${SUPABASE_DB_URL}" --dry-run

      - name: Apply staging migrations
        run: supabase db push --db-url "${SUPABASE_DB_URL}"

      - name: Confirm staging migration queue is empty
        run: supabase db push --db-url "${SUPABASE_DB_URL}" --dry-run

      - name: Probe all source endpoints
        env:
          SOURCE_PROBE_MAX_URLS: '5000'
          SOURCE_PROBE_TIMEOUT_MS: '12000'
          SOURCE_PROBE_CONCURRENCY: '12'
          SOURCE_PROBE_CLASSIFY: 'true'
        run: bun run source:endpoints:probe

      - name: Strict source certification audit
        run: node scripts/audit-source-certification-100.mjs --strict

      - name: Live Risk Gate testnet acceptance
        run: bun scripts/accept-risk-gate-testnet.mjs

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geomacro-commercial-acceptance-${{ github.run_id }}
          path: |
            artifacts/source-certification-100
            artifacts/global-source-endpoint-probe
            artifacts/risk-gate-testnet-acceptance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record acceptance proof
        if: always() && github.ref == 'refs/heads/hardening/source-network-risk-gate-production'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-proofs
          cat > ".ci-proofs/commercial-acceptance-${GITHUB_SHA}.json" <<EOF
          {
            "suite": "geomacro-commercial-production-acceptance",
            "status": "${{ job.status == 'success' && 'PASS' || 'FAIL' }}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "replay_command": "supabase db reset --local --no-seed",
            "staging_migration": "supabase db push --db-url ...",
            "strict_source_audit": "node scripts/audit-source-certification-100.mjs --strict",
            "risk_gate_acceptance": "bun scripts/accept-risk-gate-testnet.mjs"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".ci-proofs/commercial-acceptance-${GITHUB_SHA}.json"
          git commit -m "ci: record commercial acceptance result [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
