name: Temporary Verify Live After Publish

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-verify-after-publish.yml"

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEOMACRO_LIVE_PERF_BASE_URL: https://geomacro.live
      GEOMACRO_LIVE_PERF_EXPECTED_HOST: geomacro.live
      GEOMACRO_LIVE_PERF_SAMPLES: '5'
      GEOMACRO_LIVE_PERF_ARTIFACT_DIR: artifacts/live-after-publish
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify live routes after publish
        run: timeout 8m bun scripts/ops/live-performance-slo.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-after-publish-${{ github.run_id }}
          path: artifacts/live-after-publish/*.json
          if-no-files-found: warn
          retention-days: 7
