name: Commercial DB Plan Closeout Probe

on:
  push:
    branches:
      - feat/commercial-prelaunch-closeout
    paths:
      - ".github/workflows/commercial-db-plan-closeout-temp.yml"

permissions:
  contents: read

jobs:
  production-dry-run-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-prelaunch-closeout
          persist-credentials: false
      - name: Validate authoritative target without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_PROJECT_ID SUPABASE_DB_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "MISSING_PRELAUNCH_INPUT=$name"
              exit 2
            fi
          done
          if [[ "$SUPABASE_PROJECT_ID" != "$EXPECTED_SUPABASE_PROJECT_REF" ]]; then
            echo "ERROR: wrong Supabase production project" >&2
            exit 1
          fi
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const raw = process.env.SUPABASE_DB_URL;
          const url = new URL(raw);
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) throw new Error('invalid DB URL protocol');
          const direct = url.hostname === `db.${ref}.supabase.co` && url.username === 'postgres';
          const pooler = url.hostname.endsWith('.pooler.supabase.com') && url.username === `postgres.${ref}`;
          if (!direct && !pooler) throw new Error('DB URL is not the authoritative Geomacro project');
          if (!url.password || url.pathname !== '/postgres') throw new Error('DB URL lacks password or postgres database target');
          console.log('PASS: authoritative production DB identity verified.');
          NODE
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0
      - name: Dry-run production migration plan only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee artifacts/commercial-production-db-plan.txt
          echo 'PRODUCTION_DB_MUTATION_PERFORMED=false' >> artifacts/commercial-production-db-plan.txt
      - name: Assert this workflow cannot apply migrations
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/commercial-db-plan-closeout-temp.yml
          if grep -Eq 'supabase db push --db-url "\$SUPABASE_DB_URL"[[:space:]]*$' "$file"; then
            echo 'ERROR: mutation-capable db push detected' >&2
            exit 1
          fi
          grep -q -- '--dry-run' "$file"
      - name: Upload redacted migration plan
        uses: actions/upload-artifact@v4
        with:
          name: commercial-production-db-plan-${{ github.sha }}
          path: artifacts/commercial-production-db-plan.txt
          if-no-files-found: error
          retention-days: 30
