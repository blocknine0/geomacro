name: Global Coverage Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-global-production-coverage.mjs"
      - "scripts/audit-source-certification-census.mjs"
      - "scripts/audit-hot-topic-family-readiness.ts"
      - "src/lib/hot-topic-taxonomy.ts"
      - "supabase/migrations/**"
      - ".github/workflows/global-production-coverage-gate.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch

permissions:
  contents: read

jobs:
  production-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      GLOBAL_COVERAGE_AUDIT_OUTPUT: artifacts/global-production-coverage/coverage.json
      HOT_TOPIC_FAMILY_READINESS_OUTPUT: artifacts/global-production-coverage/hot-topic-family-readiness.json
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative production identity
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "${EXPECTED_SUPABASE_PROJECT_REF}"

      - name: Audit hot-topic taxonomy and realtime freshness
        if: github.event_name != 'push'
        run: bunx tsx scripts/audit-hot-topic-family-readiness.ts --require-taxonomy-complete --require-pipeline-healthy

      - name: Record post-merge freshness deferral
        if: github.event_name == 'push'
        run: |
          echo "INFO: post-merge structural coverage validation is running before the first scheduled intelligence cycle."
          echo "INFO: realtime/hot-topic freshness remains fail-closed on scheduled and manual production audits."

      - name: Audit exact source certification census
        run: bun run source:certification:census

      - name: Audit global country, corridor and source coverage
        run: bun run coverage:global:audit

      - name: Enforce structural global coverage readiness
        run: bun run coverage:global:strict

      - name: Upload permanent coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-production-coverage-${{ github.run_id }}
          path: |
            artifacts/global-production-coverage/
            artifacts/source-certification-census/
          if-no-files-found: error
          retention-days: 30
