name: Global Production Coverage Gate\n\non:\n  push:\n    branches: [main]\n    paths:\n      - "scripts/audit-global-production-coverage.mjs"\n      - "scripts/audit-hot-topic-family-readiness.ts"\n      - "src/lib/hot-topic-taxonomy.ts"\n      - "supabase/migrations/**"\n      - ".github/workflows/global-production-coverage-gate.yml"\n  schedule:\n    - cron: "17 * * * *"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  production-coverage:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    environment: production\n    env:\n      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}\n      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}\n      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}\n      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}\n      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx\n      GLOBAL_COVERAGE_AUDIT_OUTPUT: artifacts/global-production-coverage/coverage.json\n      HOT_TOPIC_FAMILY_READINESS_OUTPUT: artifacts/global-production-coverage/hot-topic-family-readiness.json\n    steps:\n      - name: Checkout canonical main\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1\n        with:\n          persist-credentials: false\n\n      - name: Setup Bun\n        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6\n        with:\n          bun-version: "1.4.2"\n\n      - name: Install locked dependencies\n        run: bun install --frozen-lockfile --ignore-scripts\n\n      - name: Validate authoritative production identity\n        run: |\n          set -euo pipefail\n          test -n "${APP_SUPABASE_URL:-}"\n          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"\n          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "${EXPECTED_SUPABASE_PROJECT_REF}"\n\n      - name: Audit hot-topic taxonomy and realtime freshness\n        run: bunx tsx scripts/audit-hot-topic-family-readiness.ts --require-taxonomy-complete --require-pipeline-healthy\n\n      - name: Audit global country, corridor and source coverage\n        run: bun run coverage:global:audit\n\n      - name: Enforce global production coverage gate\n        run: bun run coverage:global:strict\n\n      - name: Upload permanent coverage evidence\n        if: always()\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a\n        with:\n          name: global-production-coverage-${{ github.run_id }}\n          path: artifacts/global-production-coverage/\n          if-no-files-found: error\n          retention-days: 30\n