# Testnet-first global readiness control plane. Mainnet activation remains owner-gated.
name: Global Coverage Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest-world-bank-live.mjs"
      - "scripts/ingest-usgs-mcs-live.mjs"
      - "scripts/sync-gdelt-gal-production.mjs"
      - "scripts/run-gdelt-gal-cycle.mjs"
      - "scripts/refresh-global-canonical-risk-objects.ts"
      - "scripts/refresh-canonical-strategic-corridors.ts"
      - "scripts/audit-global-production-coverage.mjs"
      - "scripts/audit-source-certification-census.mjs"
      - "scripts/audit-hot-topic-family-readiness.ts"
      - "scripts/agentic/verify-live-x402-prelaunch-availability.mjs"
      - "src/lib/hot-topic-taxonomy.ts"
      - "supabase/migrations/**"
      - ".github/workflows/global-production-coverage-gate.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geomacro-global-commercial-readiness
  cancel-in-progress: false

jobs:
  production-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      GLOBAL_CANONICAL_REFRESH_OUTPUT: artifacts/global-production-coverage/canonical-risk-objects.json
      GLOBAL_CANONICAL_MIN_SOVEREIGN_DENOMINATOR: "190"
      GLOBAL_CANONICAL_MIN_READY: "100"
      GLOBAL_COVERAGE_AUDIT_OUTPUT: artifacts/global-production-coverage/coverage.json
      HOT_TOPIC_FAMILY_READINESS_OUTPUT: artifacts/global-production-coverage/hot-topic-family-readiness.json

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative production identity
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${RISK_OBJECT_SIGNING_KEY_ID:-}"
          test -n "${RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64:-}"
          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "${EXPECTED_SUPABASE_PROJECT_REF}"

      - name: Refresh governed global World Bank macro, fiscal and external observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/global-production-coverage
          node scripts/ingest-world-bank-live.mjs 2>&1 | tee artifacts/global-production-coverage/world-bank-live-refresh.log
          grep -q 'PASS: WORLD BANK LIVE MACRO INGESTION COMPLETE' artifacts/global-production-coverage/world-bank-live-refresh.log

      - name: Refresh governed global USGS critical-mineral observations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ingest-usgs-mcs-live.mjs 2>&1 | tee artifacts/global-production-coverage/usgs-mcs-live-refresh.log
          grep -q 'PASS: USGS CURRENT CRITICAL-MINERAL INGESTION CLEAN' artifacts/global-production-coverage/usgs-mcs-live-refresh.log

      - name: Refresh every enabled sovereign CANONICAL Risk Object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/global-production-coverage
          set +e
          bun scripts/refresh-global-canonical-risk-objects.ts
          refresh_status=$?
          set -e
          jq -e '
            .schema_version == "geomacro-global-canonical-refresh-v1"
            and .boundaries.all_enabled_sovereigns_evaluated == true
            and .boundaries.payment_not_performed_by_refresh == true
            and .boundaries.raw_source_material_emitted == false
            and .boundaries.raw_exception_messages_emitted == false
            and .boundaries.execution_authorized == false
            and .denominator.count >= 190
          ' "$GLOBAL_CANONICAL_REFRESH_OUTPUT" >/dev/null
          if [ "$refresh_status" -ne 0 ]; then
            echo "Global CANONICAL refresh completed fail-closed with status ${refresh_status}."
            jq '{denominator,summary,failure_summary,boundaries}' "$GLOBAL_CANONICAL_REFRESH_OUTPUT"
            exit "$refresh_status"
          fi
          jq -e '.summary.ready_floor_met == true' "$GLOBAL_CANONICAL_REFRESH_OUTPUT" >/dev/null

      - name: Refresh canonical strategic corridor Risk Objects
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/refresh-canonical-strategic-corridors.ts 2>&1 | tee artifacts/global-production-coverage/canonical-strategic-corridors.json
          grep -q '"schema_version": "geomacro-canonical-strategic-corridor-refresh-v1"' artifacts/global-production-coverage/canonical-strategic-corridors.json
          grep -q '"payment_performed": false' artifacts/global-production-coverage/canonical-strategic-corridors.json
          grep -q '"mainnet_activation_changed": false' artifacts/global-production-coverage/canonical-strategic-corridors.json

      - name: Self-heal GDELT GAL freshness before coverage gate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";
          const url = String(process.env.APP_SUPABASE_URL ?? "").trim();
          const key = String(process.env.APP_SUPABASE_SERVICE_ROLE_KEY ?? "").trim();
          if (!url || !key) throw new Error("AUTHORITATIVE_SUPABASE_CREDENTIALS_REQUIRED");
          if (new URL(url).hostname.split(".")[0] !== "ldpwajisioljyjtojvfx") throw new Error("NON_AUTHORITATIVE_SUPABASE_PROJECT");
          const db = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
          const { data, error } = await db.from("live_ingestion_cursors").select("status,last_success_at,consecutive_failures").eq("source_key","gdelt_gal").eq("stream_key","global-relevant").maybeSingle();
          if (error) throw error;
          const lastSuccessMs = Date.parse(String(data?.last_success_at ?? ""));
          const ageSeconds = Number.isFinite(lastSuccessMs) ? Math.max(0, (Date.now() - lastSuccessMs) / 1000) : Number.POSITIVE_INFINITY;
          const fresh = Number.isFinite(lastSuccessMs) && ageSeconds <= 1200 && String(data?.status ?? "") === "healthy" && Number(data?.consecutive_failures ?? 0) === 0;
          console.log(JSON.stringify({source_key:"gdelt_gal",stream_key:"global-relevant",status:data?.status ?? null,last_success_at:data?.last_success_at ?? null,age_seconds:Number.isFinite(ageSeconds)?Math.round(ageSeconds):null,repair_required:!fresh,repair_threshold_seconds:1200},null,2));
          process.exit(fresh ? 0 : 2);
          NODE
          probe_status=$?
          set -e
          if [ "$probe_status" -eq 2 ]; then
            echo "GDELT GAL is outside the repair buffer; running the canonical fresh cycle before the production coverage audit."
            node scripts/run-gdelt-gal-cycle.mjs 2>&1 | tee gdelt-gal-coverage-repair.log
            grep -q 'PASS: GDELT GAL FRESH CYCLE COMPLETE; CURSOR, FRAGMENT, STRUCTURE, RIGHTS AND HOT-TOPIC HEALTH VERIFIED' gdelt-gal-coverage-repair.log
          elif [ "$probe_status" -ne 0 ]; then
            exit "$probe_status"
          fi

      - name: Audit hot-topic taxonomy and realtime freshness
        run: bunx tsx scripts/audit-hot-topic-family-readiness.ts --require-taxonomy-complete --require-pipeline-healthy

      - name: Audit exact source certification census
        run: bun run source:certification:census

      - name: Audit global country, corridor and source coverage
        run: bun run coverage:global:audit

      - name: Enforce structural global coverage readiness
        run: bun run coverage:global:strict

      - name: Verify live x402 no-charge safety across representative surfaces
        run: node scripts/agentic/verify-live-x402-prelaunch-availability.mjs

      - name: Upload permanent coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-production-coverage-${{ github.run_id }}
          path: |
            artifacts/global-production-coverage/
            artifacts/source-certification-census/
          if-no-files-found: error
          retention-days: 30
