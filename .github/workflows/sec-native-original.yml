name: SEC EDGAR native original filing verification
on:
  pull_request:
    paths:
      - "global-intelligence/adapters/sec-edgar-original-filing.mjs"
      - "scripts/tests/sec-edgar-original-filing.test.mjs"
      - "scripts/ops/verify-sec-original.mjs"
      - ".github/workflows/sec-native-original.yml"
  push:
    branches: [main]
    paths:
      - "global-intelligence/adapters/sec-edgar-original-filing.mjs"
      - "scripts/tests/sec-edgar-original-filing.test.mjs"
      - "scripts/ops/verify-sec-original.mjs"
      - ".github/workflows/sec-native-original.yml"
  workflow_dispatch:
  schedule:
    - cron: "12 8 * * *"
permissions:
  contents: read
concurrency:
  group: sec-native-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: |
          set -euo pipefail
          node --check global-intelligence/adapters/sec-edgar-original-filing.mjs
          node --check scripts/ops/verify-sec-original.mjs
          node --test scripts/tests/sec-edgar-original-filing.test.mjs
  original-read:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node scripts/ops/verify-sec-original.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sec-native-original-${{ github.run_id }}
          path: artifacts/sec-original/receipt.json
          if-no-files-found: warn
          retention-days: 7
