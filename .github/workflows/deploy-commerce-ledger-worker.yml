name: Deploy Commerce Ledger Worker

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-commerce-ledger-production-deploy
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Cloudflare production deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEDGER_SHARED_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 2; }
          test "${#LEDGER_SHARED_TOKEN}" -ge 32 || { echo "GEOMACRO_COMMERCE_LEDGER_TOKEN must be at least 32 characters"; exit 2; }

      - name: Deploy Cloudflare Durable Object commerce ledger
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/commerce-ledger
          wranglerVersion: "4.136.3"
          command: deploy
          secrets: |
            LEDGER_SHARED_TOKEN
        env:
          LEDGER_SHARED_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}

      - name: Require HTTPS deployment origin
        id: origin
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "Wrangler did not return a valid HTTPS deployment URL"; exit 3 ;;
          esac
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Run no-funds production ledger acceptance
        env:
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origin.outputs.url }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/verify-commerce-ledger-worker.mjs

      - name: Confirm real-funds activation remains separate
        shell: bash
        run: |
          set -euo pipefail
          echo "Commerce ledger deployment/acceptance completed without provider settlement."
          echo "Do not set GEOMACRO_COMMERCE_LEDGER_BACKEND=durable_object or enable production funds solely because this workflow passed; app-runtime wiring and Supabase-off route acceptance remain separate gates."
