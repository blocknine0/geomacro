name: Deploy Commerce Ledger Worker

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "workers/commerce-ledger/**"
      - "src/lib/capability-pricing-catalog.ts"
      - "scripts/ops/wait-commerce-ledger-health.mjs"
      - "scripts/ops/verify-commerce-ledger-worker.mjs"
      - "scripts/ops/verify-commerce-control-plane-worker.mjs"
      - "scripts/ops/verify-capability-prequote-ledger-no-funds.mjs"
      - "scripts/ops/prepare-first-qualified-country-digest.ts"
      - "src/lib/qualified-mcs-country-digest.server.ts"
      - "src/lib/mcs-digest-source-identity.ts"
      - ".github/workflows/deploy-commerce-ledger-worker.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-commerce-ledger-production-deploy
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24 for the shared pure TypeScript price catalogue
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '24'

      - name: Verify immutable WDI prequote worker contracts locally (no secrets, no funds)
        run: node --test scripts/ops/verify-wdi-durable-ledger.test.mjs scripts/ops/verify-capability-durable-ledger.test.mjs scripts/ops/verify-structural-candidate-vault.test.mjs

      - name: Require Cloudflare production deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEDGER_SHARED_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 2; }
          test "${#LEDGER_SHARED_TOKEN}" -ge 32 || { echo "GEOMACRO_COMMERCE_LEDGER_TOKEN must be at least 32 characters"; exit 2; }

      - name: Deploy Cloudflare Durable Object commerce ledger
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/commerce-ledger
          packageManager: yarn
          wranglerVersion: "4.136.3"
          command: deploy
          secrets: |
            LEDGER_SHARED_TOKEN
        env:
          LEDGER_SHARED_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}

      - name: Require HTTPS deployment origin
        id: origin
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "Wrangler did not return a valid HTTPS deployment URL"; exit 3 ;;
          esac
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for deployed WDI-capable Worker version propagation
        env:
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origin.outputs.url }}
          GEOMACRO_COMMERCE_LEDGER_EXPECTED_WDI_VERSION: geomacro.wdi-prequote-worker.v1
          GEOMACRO_COMMERCE_LEDGER_EXPECTED_CAPABILITY_VERSION: geomacro.capability-prequote-worker.v1
        run: node scripts/ops/wait-commerce-ledger-health.mjs

      - name: Run no-funds delivery-ledger acceptance
        env:
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origin.outputs.url }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/verify-commerce-ledger-worker.mjs

      - name: Run no-funds usage and audit control-plane acceptance
        env:
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origin.outputs.url }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/verify-commerce-control-plane-worker.mjs

      - name: Verify deployed WDI prequote vault and authenticated readback (synthetic no funds)
        env:
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origin.outputs.url }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/verify-wdi-prequote-ledger-no-funds.mjs

      - name: Verify deployed capability prequote freeze/readback (synthetic no funds)
        env:
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origin.outputs.url }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: node scripts/ops/verify-capability-prequote-ledger-no-funds.mjs

      - name: Setup Bun for canonical source-qualified structural preparation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Install canonical locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Freeze genuine qualified digest and independently read exact private bytes (no B2 or funds)
        env:
          NODE_ENV: production
          GEOMACRO_SUPABASE_RUNTIME_MODE: standby
          GEOMACRO_FIRST_DIGEST_COUNTRY: CHN
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origin.outputs.url }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: bun scripts/ops/prepare-first-qualified-country-digest.ts --freeze-private

      - name: Keep sanitized genuine digest receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-structural-private-vault-receipt
          path: artifacts/first-qualified-structural-digest-receipt.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Confirm real-funds activation remains separate
        shell: bash
        run: |
          set -euo pipefail
          echo "Commerce control-plane deployment/acceptance completed without provider settlement."
          echo "This deploy proves durable delivery, usage limits, and audit state only. Coinbase/Circle mainnet payment activation remains separately gated by the existing launch authorization and acknowledgement controls."
