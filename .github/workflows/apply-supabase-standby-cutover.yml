name: Apply Supabase Standby Cutover

on:
  push:
    branches:
      - ops/supabase-standby-cutover-20261002
    paths:
      - "scripts/ops/apply-supabase-standby-cutover.mjs"
      - ".github/workflows/apply-supabase-standby-cutover.yml"

permissions:
  contents: write

concurrency:
  group: geomacro-supabase-standby-cutover
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'blocknine0/geomacro' && github.actor == 'blocknine0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cutover branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/supabase-standby-cutover-20261002
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Apply exact-match codemod
        run: node scripts/ops/apply-supabase-standby-cutover.mjs

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/commerce-ledger/src/index.mjs
          node --check scripts/ops/apply-supabase-standby-cutover.mjs

      - name: Existing no-Supabase ledger regression
        run: bun test src/__tests__/agent-commerce-delivery-ledger-static.test.ts src/__tests__/commerce-ledger-no-supabase-acceptance-static.test.ts

      - name: Commit only generated cutover changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-supabase-standby-cutover.yml scripts/ops/apply-supabase-standby-cutover.mjs
          git add src/lib/structural-context.server.ts src/lib/agent-commerce-delivery.server.ts src/lib/coinbase-x402.server.ts workers/commerce-ledger/src/index.mjs
          git diff --cached --check
          git commit -m "Apply Supabase standby production cutover"
          git push origin HEAD:ops/supabase-standby-cutover-20261002
