name: Risk Stream Isolated Shadow Provider Audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/risk-stream-shadow-provider-audit.yml"
      - "workers/risk-stream-shadow/src/**"
      - "scripts/tests/risk-stream-shadow-index-source-fk.test.mjs"
      - "scripts/lib/risk-stream-shadow-discovery.mjs"
      - "scripts/ops/provision-risk-stream-shadow-attester-keys.mjs"
      - "scripts/lib/risk-stream-original-manifest.mjs"
      - "docs/schemas/risk-stream-real-original-candidate.schema.json"
      - "docs/examples/risk-stream-real-originals.UNVERIFIED.template.jsonl"
      - "scripts/ops/score-risk-stream-shadow-provider-audit.mjs"
      - "scripts/ops/run-risk-stream-shadow-provider-audit.mjs"
      - "scripts/tests/risk-stream-shadow-recovery.test.mjs"
      - "scripts/ops/deploy-risk-stream-governor-candidate.mjs"
      - "scripts/ops/ingest-risk-stream-shadow-originals.mjs"
      - "scripts/ops/verify-risk-stream-governor-candidate.mjs"
      - "workers/risk-stream-governor-candidate/**"
  workflow_dispatch:
    inputs:
      approval:
        description: "Type RUN_ISOLATED_SHADOW_INDEX_ONLY_NO_FUNDS"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: geomacro-risk-stream-isolated-shadow-provider
  cancel-in-progress: false
jobs:
  provider-shadow-audit:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      RISK_STREAM_MACHINE_FACTS_SPKI_B64: ${{ secrets.RISK_STREAM_MACHINE_FACTS_SPKI_B64 }}
      RISK_STREAM_MACHINE_RIGHTS_SPKI_B64: ${{ secrets.RISK_STREAM_MACHINE_RIGHTS_SPKI_B64 }}
      RISK_STREAM_SHADOW_ORIGINALS_GZIP_B64: ${{ secrets.RISK_STREAM_SHADOW_ORIGINALS_GZIP_B64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Strict scope and original requested SHA
        shell: bash
        env:
          REQUEST_APPROVAL: ${{ inputs.approval }}
          EVENT_KIND: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_KIND" == workflow_dispatch ]]; then
            test "$REQUEST_APPROVAL" = "RUN_ISOLATED_SHADOW_INDEX_ONLY_NO_FUNDS" || exit 9
          fi
          git merge-base --is-ancestor 39bf93c5a48a187f0653cae9558a99ba71c58792 HEAD
          test -f config/d1-hotspot-v2-canary.hold || {
            echo "::error::EXISTING_CANARY_HOLD_INVARIANT_MISSING"
            exit 10
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::SHADOW_CLOUDFLARE_API_TOKEN_MISSING"
            exit 11
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 11
          node --check scripts/ops/provision-risk-stream-shadow-attester-keys.mjs
          node --check scripts/ops/score-risk-stream-shadow-provider-audit.mjs
          node --check scripts/ops/run-risk-stream-shadow-provider-audit.mjs
          node --check workers/risk-stream-shadow/src/index.mjs
          node --test scripts/tests/risk-stream-pipeline.test.mjs scripts/tests/risk-stream-shadow-contract.test.mjs scripts/tests/risk-stream-shadow-recovery.test.mjs scripts/tests/risk-stream-shadow-index-source-fk.test.mjs
      - name: Provision dedicated D1, private R2 and Queue/DLQ; audit schema
        run: node scripts/ops/run-risk-stream-shadow-provider-audit.mjs provision
      - name: Deploy isolated 0%-traffic candidate and verify source quota policy against shadow D1
        continue-on-error: true
        run: node scripts/ops/deploy-risk-stream-governor-candidate.mjs
      - name: Compare existing B2 account D1 governor against live Worker
        # Preserve governor HOLD but allow the isolated R2-only feeder and
        # D1 receipt observation to run. Final step fails if parity is missing.
        # This does NOT authorize B2 traffic or a commercial release.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHmac} from "node:crypto";
          import {spawnSync} from "node:child_process";
          import {writeFileSync} from "node:fs";
          const root=process.env.GEOMACRO_COMMERCE_LEDGER_TOKEN||"";
          if(root.length<32)throw Error("B2_SHADOW_AUTH_UNAVAILABLE");
          const token=createHmac("sha256",root).update("geomacro-control-plane-v1").digest("hex");
          const child=spawnSync("node",["scripts/ops/verify-risk-stream-b2-live-governor.mjs"],{
            env:{...process.env,GEOMACRO_STREAM_ADMIN_BEARER:token},
            encoding:"utf8",timeout:40000,maxBuffer:500000});
          if(child.status!==0)throw Error("B2_SHADOW_LIVE_GOVERNOR_PARITY_HOLD: "+(child.stderr||"").slice(-2000));
          const report=JSON.parse((child.stdout||"").trim().split("\n").at(-1));
          if(report.status!=="D1_SHARED_GOVERNOR_MATCH"||report.expected_b2_network_ops_for_shadow!==0)
            throw Error("B2_SHADOW_QUOTA_POLICY_DRIFT");
          writeFileSync(".shadow-audit/b2-governor-parity.json",JSON.stringify(report,null,2));
          console.log(JSON.stringify({status:report.status,mode:report.mode,
            verified_route:report.verified_route,dns_fallback_used:report.dns_fallback_used,
            expected_b2_network_ops_for_shadow:0,
            provider_b2_telemetry_verified:false}));
          NODE
      - name: Read Cloudflare production D1 B2 ledger without modifying it
        continue-on-error: true
        run: node scripts/ops/verify-risk-stream-b2-d1-shadow-readonly.mjs
      - name: Submit 20-30 real GDELT or news RSS hints with D1 100-bind-safe atomic microbatches
        shell: bash
        run: |
          set -euo pipefail
          test -s .shadow-audit/worker-url.txt || exit 14
          GEOMACRO_SHADOW_WORKERS_DEV_URL="$(tr -d '\r\n' < .shadow-audit/worker-url.txt)"
          export GEOMACRO_SHADOW_WORKERS_DEV_URL
          node scripts/ops/run-risk-stream-shadow-provider-audit.mjs ingest
      - name: Ingest ten genuinely independent signed original pairs using source registry authority
        if: env.RISK_STREAM_SHADOW_ORIGINALS_GZIP_B64 != ''
        continue-on-error: true
        run: node scripts/ops/ingest-risk-stream-shadow-originals.mjs
      - name: Read isolated Queue and D1 canonical/receipt census (diagnostic only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "SHADOW_QUEUE_CONSUMER_INVENTORY_READONLY"
          npx -y wrangler@4.136.3 queues info geomacro-risk-stream-shadow
          echo "SHADOW_DLQ_INVENTORY_READONLY"
          npx -y wrangler@4.136.3 queues info geomacro-risk-stream-shadow-dlq
          echo "SHADOW_CANONICAL_AND_RECEIPT_COUNTS_READONLY"
          npx -y wrangler@4.136.3 d1 execute geomacro-risk-stream-shadow \
            --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM risk_stream_evidence) AS evidence_rows,(SELECT COUNT(*) FROM risk_stream_shadow_audit_receipts) AS audit_receipt_rows,(SELECT COUNT(*) FROM risk_stream_sources WHERE commercial_rights_approved=0 AND enabled=0) AS disabled_untrusted_index_sources,(SELECT COUNT(*) FROM risk_stream_signed_gro) AS signed_gros,(SELECT COUNT(*) FROM risk_stream_delivery_outbox) AS internal_outbox_rows"
          npx -y wrangler@4.136.3 d1 execute geomacro-risk-stream-shadow \
            --remote --json --command \
            "SELECT batch_id,event_count,corroborated_and_signed,verified_signature_readbacks,d1_calls,d1_503_observed,d1_write_p95_ms,result_status FROM risk_stream_shadow_audit_receipts ORDER BY started_at DESC LIMIT 10"
      - name: Final scope receipt (never release canary)
        if: always()
        shell: bash
        run: |
          echo "SHADOW_RELEASE_SCOPE=NO_FUNDS_NO_CUSTOMER_DELIVERY"
          echo "SHADOW_PRODUCTION_D1_MUTATIONS=NONE"
          echo "SHADOW_SIGNED_GRO_ACCEPTANCE=NOT_PROVEN_UNTIL_REAL_ORIGINALS"
          echo "SHADOW_CANARY_HOLD=RETAINED"
          if test -s .shadow-audit/candidate-governor-parity.json; then
            node -e "const p=require('./.shadow-audit/candidate-governor-parity.json');if(p.status!=='SHADOW_CANDIDATE_D1_POLICY_MATCH'||p.production_d1_ledger_verified!==false)process.exit(1);console.log('ISOLATED_SHADOW_GOVERNOR_POLICY_PARITY=PASS_LIVE_PRODUCTION_NOT_INFERRED')"
          else
            echo "ISOLATED_SHADOW_GOVERNOR_POLICY_PARITY=HOLD"
          fi
          if test -s .shadow-audit/b2-governor-parity.json; then
            node -e "const p=require('./.shadow-audit/b2-governor-parity.json');if(p.status!=='D1_SHARED_GOVERNOR_MATCH')process.exit(1);console.log('SHADOW_B2_WORKER_LIVE_PARITY=PASS route='+p.verified_route)"
          else
            echo "SHADOW_B2_WORKER_LIVE_PARITY=HOLD_NO_AUTHENTICATED_D1_READBACK"
          fi
          if test -f .shadow-audit/metadata.json; then
            node -e "const p=require('./.shadow-audit/metadata.json');console.log('PROVISIONED_ISOLATED_SHADOW_RESOURCES='+p.shadow_db+','+p.shadow_bucket+','+p.shadow_queue)"
          fi
          if test -f .shadow-audit/live-telemetry.json; then
            cat .shadow-audit/live-telemetry.json
          fi
          # A queued index URL cannot be counted as a signed original GRO.
          # Always emit the terminal scorecard, retaining HOLD on missing proof.
          score_status=0
          node scripts/ops/score-risk-stream-shadow-provider-audit.mjs || score_status=$?
          if ! test -s .shadow-audit/b2-governor-parity.json; then
            echo "::error::SHADOW_GOVERNOR_PARITY_UNPROVEN_RELEASE_HOLD_RETAINED"
            exit 18
          fi
          exit "$score_status"
      - name: Upload redacted terminal shadow audit scorecard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: risk-stream-shadow-provider-scorecard
          path: |
            .shadow-audit/metadata.json
            .shadow-audit/b2-governor-parity.json
            .shadow-audit/candidate-governor-parity.json
            .shadow-audit/live-telemetry.json
            .shadow-audit/scorecard.json
          if-no-files-found: warn
          retention-days: 7
