name: GOAT Testnet3 Paid Proof Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goat-testnet3-paid-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: goat-testnet3-paid-proof
    env:
      GEOMACRO_GOAT_PILOT_BASE_URL: ${{ secrets.GEOMACRO_GOAT_PILOT_BASE_URL }}
      GEOMACRO_GOAT_PILOT_EXPECTED_HOST: ${{ secrets.GEOMACRO_GOAT_PILOT_EXPECTED_HOST }}
      GEOMACRO_GOAT_PILOT_ACCESS_TOKEN: ${{ secrets.GEOMACRO_GOAT_PILOT_ACCESS_TOKEN }}
      GEOMACRO_GOAT_TEST_PAYER_PRIVATE_KEY: ${{ secrets.GEOMACRO_GOAT_TEST_PAYER_PRIVATE_KEY }}
      GEOMACRO_GOAT_TEST_PAYER_ADDRESS: ${{ secrets.GEOMACRO_GOAT_TEST_PAYER_ADDRESS }}
      GEOMACRO_GOAT_READINESS_ARTIFACT_DIR: artifacts/goat-testnet3-readiness

    steps:
      - name: Validate required protected secrets without printing them
        shell: bash
        run: |
          missing=0
          for name in \
            GEOMACRO_GOAT_PILOT_BASE_URL \
            GEOMACRO_GOAT_PILOT_EXPECTED_HOST \
            GEOMACRO_GOAT_PILOT_ACCESS_TOKEN \
            GEOMACRO_GOAT_TEST_PAYER_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the protected goat-testnet3-paid-proof environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout exact workflow ref
        uses: actions/checkout@v7

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Run offline paid-proof readiness validation
        run: node scripts/goat/testnet3-paid-readiness.mjs

      - name: Upload sanitized readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: goat-testnet3-paid-readiness-${{ github.run_id }}
          path: artifacts/goat-testnet3-readiness/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Record hard safety boundary
        if: always()
        shell: bash
        run: |
          echo "Network request executed by readiness script: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Payment submitted: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution authorization from Risk Gate: false" >> "$GITHUB_STEP_SUMMARY"
