name: Dan Commercial Readiness Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dan-commercial-readiness.yml"

permissions:
  contents: read

concurrency:
  group: dan-commercial-readiness-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      LIVE_BASE_URL: https://geomacro.live

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production signing configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY RISK_OBJECT_SIGNING_KEY_ID RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done

          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require('node:crypto');
          const fs = require('node:fs');
          const privateKey = createPrivateKey({
            key: Buffer.from(process.env.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64.trim(), 'base64'),
            format: 'der',
            type: 'pkcs8',
          });
          if (privateKey.asymmetricKeyType !== 'ed25519') {
            throw new Error('Risk Object signing key must be Ed25519');
          }
          const publicB64 = Buffer.from(
            createPublicKey(privateKey).export({ format: 'der', type: 'spki' }),
          ).toString('base64');
          fs.appendFileSync(process.env.GITHUB_ENV, `RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64=${publicB64}\n`);
          NODE

      - name: Run scoped trust-boundary regression tests
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            src/__tests__/risk-object-signing.test.ts \
            src/__tests__/risk-object-public-verification.test.ts \
            src/__tests__/risk-object-key-lifecycle.test.ts \
            src/__tests__/testnet-public-developer-page-static.test.ts

      - name: Publish fresh commercially eligible country proofs
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/publish-country-risk-object.ts CHN | tee dan-country-chn.json
          bun scripts/publish-country-risk-object.ts BRA | tee dan-country-bra.json

          node <<'NODE'
          const fs = require('node:fs');
          for (const [country, path] of [['CHN', 'dan-country-chn.json'], ['BRA', 'dan-country-bra.json']]) {
            const result = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (result?.published !== true || result?.context?.published !== true) {
              throw new Error(`${country}: immutable publication was not confirmed`);
            }
            if (result?.integrity?.signature_present !== true || result?.integrity?.signature_valid !== true) {
              throw new Error(`${country}: signed Risk Object verification failed`);
            }
            if (result?.integrity?.signing_key_id !== process.env.RISK_OBJECT_SIGNING_KEY_ID) {
              throw new Error(`${country}: signing key id does not match the configured production key`);
            }
            if (result?.commercial_eligibility?.status !== 'VERIFIED') {
              throw new Error(`${country}: commercial eligibility is ${result?.commercial_eligibility?.status ?? 'missing'}`);
            }
            if (result?.verification?.status !== 'VERIFIED') {
              throw new Error(`${country}: verification is ${result?.verification?.status ?? 'missing'}`);
            }
          }
          console.log('PASS: CHN and BRA fresh signed country Risk Objects are commercially eligible and verified.');
          NODE

      - name: Run live-data USA to CHN corridor preflight
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/test-corridor-risk-gate-preflight.ts USA CHN | tee dan-corridor-preflight.log

          grep -q '"signature_valid": true' dan-corridor-preflight.log
          grep -q 'PASS: SIGNED CORRIDOR RISK GATE BLOCKED EXECUTOR FAIL-CLOSED' dan-corridor-preflight.log

          python <<'PY'
          import json
          from pathlib import Path

          text = Path('dan-corridor-preflight.log').read_text()
          decoder = json.JSONDecoder()
          objects = []
          pos = 0
          while len(objects) < 2:
              start = text.find('{', pos)
              if start < 0:
                  break
              try:
                  obj, end = decoder.raw_decode(text, start)
              except json.JSONDecodeError:
                  pos = start + 1
                  continue
              objects.append(obj)
              pos = end

          if len(objects) < 2:
              raise SystemExit('Could not parse corridor preflight evidence')

          published, blocked = objects[0], objects[1]
          if published.get('integrity', {}).get('signature_valid') is not True:
              raise SystemExit('Corridor signature was not valid')
          if blocked.get('status') != 'corridor_automatic_execution_blocked':
              raise SystemExit('Corridor did not exercise the fail-closed blocked path')
          if blocked.get('execution_authorized') is not False or blocked.get('executor_called') is not False:
              raise SystemExit('Corridor execution boundary failed')

          redacted = {
              'proof': 'PASS',
              'scope': 'live_data_corridor_private_pilot',
              'corridor_id': published.get('corridor_id'),
              'methodology_version': published.get('methodology_version'),
              'risk': published.get('risk'),
              'confidence': published.get('confidence'),
              'evidence_summary': published.get('evidence_summary'),
              'verification': published.get('verification'),
              'commercial_eligibility': published.get('commercial_eligibility'),
              'corridor_context': published.get('corridor_context'),
              'endpoint_object_ids': published.get('endpoint_objects'),
              'integrity': {
                  'calculation_hash': published.get('integrity', {}).get('calculation_hash'),
                  'payload_hash': published.get('integrity', {}).get('payload_hash'),
                  'signing_key_id': published.get('integrity', {}).get('signing_key_id'),
                  'signature_valid': published.get('integrity', {}).get('signature_valid'),
              },
              'risk_gate': {
                  'decision': blocked.get('decision'),
                  'reason_codes': blocked.get('reason_codes'),
                  'risk_object_id': blocked.get('risk_object_id'),
                  'score': blocked.get('score'),
                  'confidence': blocked.get('confidence'),
                  'verification_status': blocked.get('verification_status'),
                  'commercial_eligibility_status': blocked.get('commercial_eligibility_status'),
                  'execution_authorized': blocked.get('execution_authorized'),
                  'executor_called': blocked.get('executor_called'),
              },
              'limitation': 'Corridor v0.1 remains a pilot endpoint-composition methodology and intentionally fails closed when commercial verification is insufficient.',
          }
          Path('dan-corridor-proof.json').write_text(json.dumps(redacted, indent=2) + '\n')
          PY

      - name: Verify public Risk Object trust endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
            "${LIVE_BASE_URL%/}/api/risk-object-keys" > dan-risk-object-keys.json

          jq -e --arg key_id "$RISK_OBJECT_SIGNING_KEY_ID" '
            .ok == true and
            .signature_scheme == "Ed25519" and
            (.keys | any(.key_id == $key_id and .status != "revoked"))
          ' dan-risk-object-keys.json >/dev/null

      - name: Verify live Risk Gate readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
            "${LIVE_BASE_URL%/}/api/risk-gate-readiness" > dan-risk-gate-readiness.json

          jq -e '
            .status == "ready" and
            .checks.database == true and
            .checks.audit_store == true and
            .checks.verification_keys == true and
            .checks.fresh_country_risk_object == true and
            .checks.publisher_signing == true
          ' dan-risk-gate-readiness.json >/dev/null

      - name: Verify live Testnet wallet-first route
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/check-testnet-wallet-first.js <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dan-testnet-access.html', 'utf8');
          const walletFirst = html.indexOf('/testnet-wallet-first-v2.js');
          const legacy = html.indexOf('/testnet-access.js');
          if (walletFirst < 0 || legacy < 0 || walletFirst >= legacy) process.exit(1);
          NODE

          ok=0
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
              "${LIVE_BASE_URL%/}/testnet-access" > dan-testnet-access.html; then
              if node /tmp/check-testnet-wallet-first.js; then
                ok=1
                break
              fi
            fi
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Live /testnet-access did not expose wallet-first auth before legacy behavior"
            exit 1
          fi

      - name: Build Dan readiness summary
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --slurpfile chn dan-country-chn.json \
            --slurpfile bra dan-country-bra.json \
            --slurpfile corridor dan-corridor-proof.json \
            --slurpfile readiness dan-risk-gate-readiness.json \
            --slurpfile keys dan-risk-object-keys.json \
            '{
              proof:"PASS",
              purpose:"Dan Griffith pre-conversation commercial readiness evidence",
              generated_at:$generated_at,
              commit:$commit,
              country_private_pilot:[
                {
                  country:"CHN",
                  object_id:$chn[0].object_id,
                  score:$chn[0].risk.score,
                  confidence:$chn[0].confidence,
                  commercial_eligibility:$chn[0].commercial_eligibility.status,
                  verification:$chn[0].verification.status,
                  signing_key_id:$chn[0].integrity.signing_key_id,
                  signature_valid:$chn[0].integrity.signature_valid
                },
                {
                  country:"BRA",
                  object_id:$bra[0].object_id,
                  score:$bra[0].risk.score,
                  confidence:$bra[0].confidence,
                  commercial_eligibility:$bra[0].commercial_eligibility.status,
                  verification:$bra[0].verification.status,
                  signing_key_id:$bra[0].integrity.signing_key_id,
                  signature_valid:$bra[0].integrity.signature_valid
                }
              ],
              corridor_pilot:$corridor[0],
              public_verification:{
                endpoint:"/api/risk-object-keys",
                issuer:$keys[0].issuer,
                signature_scheme:$keys[0].signature_scheme,
                active_or_retired_key_count:([$keys[0].keys[] | select(.status != "revoked")] | length)
              },
              live_readiness:$readiness[0],
              testnet_access:{wallet_first_auth_live:true},
              claims_boundary:[
                "Country proof is Private Pilot acceptance evidence, not a GA or production-SLA claim.",
                "Corridor v0.1 is a separate pilot endpoint-composition methodology and is not independently commercially verified.",
                "Geomacro does not authorize or broadcast customer financial execution; execution_authorized remains false."
              ]
            }' > dan-commercial-readiness-summary.json

          cat dan-commercial-readiness-summary.json

      - name: Upload redacted Dan readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dan-commercial-readiness-evidence
          path: |
            dan-commercial-readiness-summary.json
            dan-corridor-proof.json
            dan-risk-gate-readiness.json
          if-no-files-found: warn
          retention-days: 30
