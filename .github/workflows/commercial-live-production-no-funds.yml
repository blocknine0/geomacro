name: Live Commercial Go-No-Go No Funds
# Public only, no payment; separate real production gate from static contracts.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 */6 * * *'
  workflow_run:
    workflows: ['Production Website Health']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/commercial-live-production-no-funds.yml'
      - 'scripts/lib/commercial-live-preflight.mjs'
      - 'scripts/ops/run-live-commercial-preflight-no-funds.mjs'
      - 'scripts/tests/commercial-live-preflight.test.mjs'
      - 'scripts/ops/phase2h-first-intelligence-query-no-funds.mjs'
      - 'scripts/tests/phase2h-first-intelligence-query-no-funds.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/commercial-live-production-no-funds.yml'
      - 'scripts/lib/commercial-live-preflight.mjs'
      - 'scripts/ops/run-live-commercial-preflight-no-funds.mjs'
      - 'scripts/tests/commercial-live-preflight.test.mjs'
      - 'scripts/ops/phase2h-first-intelligence-query-no-funds.mjs'
      - 'scripts/tests/phase2h-first-intelligence-query-no-funds.test.mjs'
permissions:
  contents: read
concurrency:
  group: geomacro-live-no-funds-go-no-go-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Reject any fake current proof, payment, rights or 195-country claim
        run: |
          node --check scripts/ops/run-live-commercial-preflight-no-funds.mjs
          node --test scripts/tests/commercial-live-preflight.test.mjs
          node --test scripts/tests/phase2h-first-intelligence-query-no-funds.test.mjs
  live-no-funds:
    needs: offline-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify actual checked-out canonical main SHA
        id: current
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Read public deployed SHA, signed 3/3 and x402 no-payment availability
        env:
          EXPECTED_CANONICAL_SHA: ${{ steps.current.outputs.sha }}
          GEOMACRO_COMMERCIAL_LAUNCH_ACK: ''
          COINBASE_X402_MAINNET_ACK: ''
        run: node scripts/ops/run-live-commercial-preflight-no-funds.mjs
      - name: One live customer-style macro question without payment or source approval
        if: always() && steps.current.outputs.sha != ''
        env:
          EXPECTED_CANONICAL_SHA: ${{ steps.current.outputs.sha }}
        run: node scripts/ops/phase2h-first-intelligence-query-no-funds.mjs
      - name: Keep separate actual exact-question HTTP evidence even when unqualified
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase2h-first-query-no-funds-${{ github.run_id }}
          path: artifacts/commercial/phase2h-first-intelligence-query-no-funds.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain safe blocked production receipt even on RED
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: commercial-live-no-funds-${{ github.run_id }}
          path: artifacts/commercial/live-no-funds-go-no-go.json
          if-no-files-found: warn
          retention-days: 14
