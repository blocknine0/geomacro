name: Deploy GeoMacro Web Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_GEOMACRO_WEB_PRODUCTION to authorize the production deployment
        required: true
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: geomacro-web-production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY_GEOMACRO_WEB_PRODUCTION')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'

      - name: Require exact-head Product CI and CodeQL success before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/blocknine0/geomacro/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA" || { echo 'WEB_PRODUCTION_DISPATCH_SHA_NOT_CURRENT_MAIN'; exit 2; }
          for attempt in $(seq 1 60); do
            product="$(gh api "repos/blocknine0/geomacro/actions/workflows/product-ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=20" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main")][0].conclusion // "pending"')"
            codeql="$(gh api "repos/blocknine0/geomacro/actions/workflows/codeql-security.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=20" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main")][0].conclusion // "pending"')"
            if [[ "$product" == success && "$codeql" == success ]]; then
              echo 'WEB_PRODUCTION_EXACT_SHA_CI_AND_CODEQL_PASS'
              exit 0
            fi
            if [[ "$product" != pending && "$product" != success ]]; then echo 'WEB_PRODUCTION_PRODUCT_CI_FAILED'; exit 2; fi
            if [[ "$codeql" != pending && "$codeql" != success ]]; then echo 'WEB_PRODUCTION_CODEQL_FAILED'; exit 2; fi
            if [[ "$attempt" -lt 60 ]]; then sleep 30; fi
          done
          echo 'WEB_PRODUCTION_EXACT_SHA_CHECKS_NOT_COMPLETE'
          exit 2

      - name: Build the production Workers app
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          node scripts/ops/prepare-web-production.mjs --target production

      - name: Require Cloudflare and approved B2 read credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
          B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_CUSTOMER_SSR_TOKEN: ${{ secrets.GEOMACRO_CUSTOMER_SSR_TOKEN }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          GEOMACRO_API_CREDENTIAL_PEPPER: ${{ secrets.GEOMACRO_API_CREDENTIAL_PEPPER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'WEB_PRODUCTION_CLOUDFLARE_API_TOKEN_REQUIRED'; exit 2; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo 'WEB_PRODUCTION_CLOUDFLARE_ACCOUNT_ID_INVALID'; exit 2; }
          test -n "$B2_ARCHIVE_READ_KEY_ID" || { echo 'WEB_PRODUCTION_B2_READ_KEY_ID_SECRET_REQUIRED'; exit 2; }
          test -n "$B2_ARCHIVE_READ_APPLICATION_KEY" || { echo 'WEB_PRODUCTION_B2_READ_APPLICATION_KEY_SECRET_REQUIRED'; exit 2; }
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || { echo 'WEB_PRODUCTION_COMMERCE_LEDGER_TOKEN_INVALID'; exit 2; }
          test "${#GEOMACRO_CUSTOMER_SSR_TOKEN}" -ge 64 || { echo 'WEB_PRODUCTION_CUSTOMER_SSR_TOKEN_INVALID'; exit 2; }
          test -n "${CDP_API_KEY_ID:-}" || { echo 'WEB_PRODUCTION_CDP_API_KEY_ID_MISSING'; exit 2; }
          test -n "${CDP_API_KEY_SECRET:-}" || { echo 'WEB_PRODUCTION_CDP_API_KEY_SECRET_MISSING'; exit 2; }
          test "${#GEOMACRO_API_CREDENTIAL_PEPPER}" -ge 64 || { echo 'WEB_PRODUCTION_API_CREDENTIAL_PEPPER_INVALID'; exit 2; }
          echo 'WEB_PRODUCTION_REQUIRED_CREDENTIALS_PRESENT'

      - name: Inspect existing production Worker bindings without exposing secret values
        id: production-bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          settings_file="$(mktemp)"
          status="$(curl -sS -o "$settings_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/geomacro-web-production/settings")"
          if [[ "$status" == 404 ]]; then
            echo 'b2_key_id_present=false' >> "$GITHUB_OUTPUT"
            echo 'b2_application_key_present=false' >> "$GITHUB_OUTPUT"
            echo 'fingerprint_pepper_present=false' >> "$GITHUB_OUTPUT"
            echo 'commerce_ledger_token_present=false' >> "$GITHUB_OUTPUT"
            echo 'customer_ssr_token_present=false' >> "$GITHUB_OUTPUT"
            echo 'customer_worker_url_present=false' >> "$GITHUB_OUTPUT"
            echo 'customer_trusted_edge_present=false' >> "$GITHUB_OUTPUT"
            echo 'cdp_id_present=false' >> "$GITHUB_OUTPUT"
            echo 'cdp_secret_present=false' >> "$GITHUB_OUTPUT"
            echo 'coinbase_env_present=false' >> "$GITHUB_OUTPUT"
            echo 'coinbase_ack_present=false' >> "$GITHUB_OUTPUT"
            echo 'coinbase_pay_to_present=false' >> "$GITHUB_OUTPUT"
            echo 'commercial_launch_ack_present=false' >> "$GITHUB_OUTPUT"
            echo 'groq_api_key_present=false' >> "$GITHUB_OUTPUT"
            echo 'central_security_mode_present=false' >> "$GITHUB_OUTPUT"
            echo 'real_funds_ack_present=false' >> "$GITHUB_OUTPUT"
            echo 'api_credential_pepper_present=false' >> "$GITHUB_OUTPUT"
            echo 'WEB_PRODUCTION_WORKER_NOT_YET_DEPLOYED'
          elif [[ "$status" == 200 ]]; then
            jq -e '.success == true and (.result.bindings | type == "array")' "$settings_file" >/dev/null || { echo 'WEB_PRODUCTION_BINDING_INVENTORY_INVALID'; exit 2; }
            jq -e 'all(.result.bindings[]; if .type == "assets" then .name == "ASSETS" elif .type == "plain_text" then (.name == "GEOMACRO_SUPABASE_RUNTIME_MODE" and .text == "standby") or (.name == "GEOMACRO_ASK_FREE_GROQ_ENABLED" and .text == "true") elif .type == "secret_text" then (.name as $name | ["B2_ARCHIVE_READ_KEY_ID", "B2_ARCHIVE_READ_APPLICATION_KEY", "GEOMACRO_SECURITY_FINGERPRINT_PEPPER", "GEOMACRO_COMMERCE_LEDGER_TOKEN", "GROQ_API_KEY", "GEOMACRO_CUSTOMER_SSR_TOKEN", "GEOMACRO_CUSTOMER_WORKER_URL", "GEOMACRO_CUSTOMER_TRUSTED_EDGE", "CDP_API_KEY_ID", "CDP_API_KEY_SECRET", "COINBASE_X402_ENVIRONMENT", "COINBASE_X402_MAINNET_ACK", "COINBASE_X402_PAY_TO", "GEOMACRO_COMMERCIAL_LAUNCH_ACK", "GEOMACRO_CENTRAL_SECURITY_MODE", "GEOMACRO_REAL_FUNDS_SECURITY_ACK", "GEOMACRO_API_CREDENTIAL_PEPPER"] | index($name) != null) else false end)' "$settings_file" >/dev/null || { echo 'WEB_PRODUCTION_UNKNOWN_OR_UNSAFE_BINDING_PRESENT'; exit 2; }
            for binding in B2_ARCHIVE_READ_KEY_ID B2_ARCHIVE_READ_APPLICATION_KEY GEOMACRO_SECURITY_FINGERPRINT_PEPPER GEOMACRO_COMMERCE_LEDGER_TOKEN GEOMACRO_CUSTOMER_SSR_TOKEN GEOMACRO_CUSTOMER_WORKER_URL GEOMACRO_CUSTOMER_TRUSTED_EDGE CDP_API_KEY_ID CDP_API_KEY_SECRET COINBASE_X402_ENVIRONMENT COINBASE_X402_MAINNET_ACK COINBASE_X402_PAY_TO GEOMACRO_COMMERCIAL_LAUNCH_ACK GROQ_API_KEY GEOMACRO_CENTRAL_SECURITY_MODE GEOMACRO_REAL_FUNDS_SECURITY_ACK GEOMACRO_API_CREDENTIAL_PEPPER; do
              present="$(jq -r --arg name "$binding" 'any(.result.bindings[]; .type == "secret_text" and .name == $name)' "$settings_file")"
              case "$binding" in
                B2_ARCHIVE_READ_KEY_ID) echo "b2_key_id_present=$present" >> "$GITHUB_OUTPUT" ;;
                B2_ARCHIVE_READ_APPLICATION_KEY) echo "b2_application_key_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_SECURITY_FINGERPRINT_PEPPER) echo "fingerprint_pepper_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_COMMERCE_LEDGER_TOKEN) echo "commerce_ledger_token_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_CUSTOMER_SSR_TOKEN) echo "customer_ssr_token_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_CUSTOMER_WORKER_URL) echo "customer_worker_url_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_CUSTOMER_TRUSTED_EDGE) echo "customer_trusted_edge_present=$present" >> "$GITHUB_OUTPUT" ;;
                CDP_API_KEY_ID) echo "cdp_id_present=$present" >> "$GITHUB_OUTPUT" ;;
                CDP_API_KEY_SECRET) echo "cdp_secret_present=$present" >> "$GITHUB_OUTPUT" ;;
                COINBASE_X402_ENVIRONMENT) echo "coinbase_env_present=$present" >> "$GITHUB_OUTPUT" ;;
                COINBASE_X402_MAINNET_ACK) echo "coinbase_ack_present=$present" >> "$GITHUB_OUTPUT" ;;
                COINBASE_X402_PAY_TO) echo "coinbase_pay_to_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_COMMERCIAL_LAUNCH_ACK) echo "commercial_launch_ack_present=$present" >> "$GITHUB_OUTPUT" ;;
                GROQ_API_KEY) echo "groq_api_key_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_CENTRAL_SECURITY_MODE) echo "central_security_mode_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_REAL_FUNDS_SECURITY_ACK) echo "real_funds_ack_present=$present" >> "$GITHUB_OUTPUT" ;;
                GEOMACRO_API_CREDENTIAL_PEPPER) echo "api_credential_pepper_present=$present" >> "$GITHUB_OUTPUT" ;;
              esac
            done
            echo 'WEB_PRODUCTION_EXISTING_BINDINGS_VALIDATED'
          else
            echo "WEB_PRODUCTION_BINDING_INVENTORY_HTTP_$status"
            exit 2
          fi
          rm -f "$settings_file"

      - name: Deploy geomacro-web-production with both custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
          B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          B2_KEY_ID_PRESENT: ${{ steps.production-bindings.outputs.b2_key_id_present }}
          B2_APPLICATION_KEY_PRESENT: ${{ steps.production-bindings.outputs.b2_application_key_present }}
          FINGERPRINT_PEPPER_PRESENT: ${{ steps.production-bindings.outputs.fingerprint_pepper_present }}
          GEOMACRO_CUSTOMER_SSR_TOKEN: ${{ secrets.GEOMACRO_CUSTOMER_SSR_TOKEN }}
          COMMERCE_LEDGER_TOKEN_PRESENT: ${{ steps.production-bindings.outputs.commerce_ledger_token_present }}
          CUSTOMER_SSR_TOKEN_PRESENT: ${{ steps.production-bindings.outputs.customer_ssr_token_present }}
          CUSTOMER_WORKER_URL_PRESENT: ${{ steps.production-bindings.outputs.customer_worker_url_present }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          CUSTOMER_TRUSTED_EDGE_PRESENT: ${{ steps.production-bindings.outputs.customer_trusted_edge_present }}
          CDP_ID_PRESENT: ${{ steps.production-bindings.outputs.cdp_id_present }}
          CDP_SECRET_PRESENT: ${{ steps.production-bindings.outputs.cdp_secret_present }}
          COINBASE_ENV_PRESENT: ${{ steps.production-bindings.outputs.coinbase_env_present }}
          COINBASE_ACK_PRESENT: ${{ steps.production-bindings.outputs.coinbase_ack_present }}
          COINBASE_PAY_TO_PRESENT: ${{ steps.production-bindings.outputs.coinbase_pay_to_present }}
          GEOMACRO_API_CREDENTIAL_PEPPER: ${{ secrets.GEOMACRO_API_CREDENTIAL_PEPPER }}
          COMMERCIAL_LAUNCH_ACK_PRESENT: ${{ steps.production-bindings.outputs.commercial_launch_ack_present }}
          CENTRAL_SECURITY_MODE_PRESENT: ${{ steps.production-bindings.outputs.central_security_mode_present }}
          REAL_FUNDS_ACK_PRESENT: ${{ steps.production-bindings.outputs.real_funds_ack_present }}
          API_CREDENTIAL_PEPPER_PRESENT: ${{ steps.production-bindings.outputs.api_credential_pepper_present }}
          GROQ_API_KEY_PRESENT: ${{ steps.production-bindings.outputs.groq_api_key_present }}
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4.136.3 deploy --config .output/server/production-wrangler.json
          if [[ "$B2_KEY_ID_PRESENT" != true ]]; then
            printf '%s' "$B2_ARCHIVE_READ_KEY_ID" | npx -y wrangler@4.136.3 secret put B2_ARCHIVE_READ_KEY_ID --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_B2_READ_KEY_ID_PROVISIONED'
          else echo 'WEB_PRODUCTION_B2_READ_KEY_ID_RETAINED'; fi
          if [[ "$B2_APPLICATION_KEY_PRESENT" != true ]]; then
            printf '%s' "$B2_ARCHIVE_READ_APPLICATION_KEY" | npx -y wrangler@4.136.3 secret put B2_ARCHIVE_READ_APPLICATION_KEY --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_B2_READ_APPLICATION_KEY_PROVISIONED'
          else echo 'WEB_PRODUCTION_B2_READ_APPLICATION_KEY_RETAINED'; fi
          if [[ "$FINGERPRINT_PEPPER_PRESENT" != true ]]; then
            node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))' |
              npx -y wrangler@4.136.3 secret put GEOMACRO_SECURITY_FINGERPRINT_PEPPER --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_FINGERPRINT_PEPPER_PROVISIONED'
          else echo 'WEB_PRODUCTION_FINGERPRINT_PEPPER_RETAINED'; fi
          if [[ "$COMMERCE_LEDGER_TOKEN_PRESENT" != true ]]; then
            printf '%s' "$GEOMACRO_COMMERCE_LEDGER_TOKEN" | npx -y wrangler@4.136.3 secret put GEOMACRO_COMMERCE_LEDGER_TOKEN --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_COMMERCE_LEDGER_TOKEN_PROVISIONED'
          else echo 'WEB_PRODUCTION_COMMERCE_LEDGER_TOKEN_RETAINED'; fi
          if [[ "$CUSTOMER_SSR_TOKEN_PRESENT" != true ]]; then
            printf '%s' "$GEOMACRO_CUSTOMER_SSR_TOKEN" | npx -y wrangler@4.136.3 secret put GEOMACRO_CUSTOMER_SSR_TOKEN --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_CUSTOMER_SSR_TOKEN_PROVISIONED'
          else echo 'WEB_PRODUCTION_CUSTOMER_SSR_TOKEN_RETAINED'; fi
          if [[ "$CUSTOMER_WORKER_URL_PRESENT" != true ]]; then
            printf '%s' 'https://geomacro-control-plane.daspallab202391.workers.dev/' | npx -y wrangler@4.136.3 secret put GEOMACRO_CUSTOMER_WORKER_URL --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_CUSTOMER_WORKER_URL_PROVISIONED'
          else echo 'WEB_PRODUCTION_CUSTOMER_WORKER_URL_RETAINED'; fi
          if [[ "$CUSTOMER_TRUSTED_EDGE_PRESENT" != true ]]; then
            printf '%s' 'cloudflare' | npx -y wrangler@4.136.3 secret put GEOMACRO_CUSTOMER_TRUSTED_EDGE --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_CUSTOMER_TRUSTED_EDGE_PROVISIONED'
          else echo 'WEB_PRODUCTION_CUSTOMER_TRUSTED_EDGE_RETAINED'; fi
          if [[ "$CDP_ID_PRESENT" != true ]]; then
            printf '%s' "$CDP_API_KEY_ID" | npx -y wrangler@4.136.3 secret put CDP_API_KEY_ID --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_CDP_API_KEY_ID_PROVISIONED'
          else echo 'WEB_PRODUCTION_CDP_API_KEY_ID_RETAINED'; fi
          if [[ "$CDP_SECRET_PRESENT" != true ]]; then
            printf '%s' "$CDP_API_KEY_SECRET" | npx -y wrangler@4.136.3 secret put CDP_API_KEY_SECRET --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_CDP_API_KEY_SECRET_PROVISIONED'
          else echo 'WEB_PRODUCTION_CDP_API_KEY_SECRET_RETAINED'; fi
          if [[ "$COINBASE_ENV_PRESENT" != true ]]; then
            printf '%s' 'production' | npx -y wrangler@4.136.3 secret put COINBASE_X402_ENVIRONMENT --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_COINBASE_X402_ENVIRONMENT_PROVISIONED'
          else echo 'WEB_PRODUCTION_COINBASE_X402_ENVIRONMENT_RETAINED'; fi
          if [[ "$COINBASE_ACK_PRESENT" != true ]]; then
            printf '%s' 'I_ACCEPT_REAL_USDC' | npx -y wrangler@4.136.3 secret put COINBASE_X402_MAINNET_ACK --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_COINBASE_X402_MAINNET_ACK_PROVISIONED'
          else echo 'WEB_PRODUCTION_COINBASE_X402_MAINNET_ACK_RETAINED'; fi
          if [[ "$COINBASE_PAY_TO_PRESENT" != true ]]; then
            printf '%s' '0x95ba71d21c41bda8bba9533f96d25f793e4137b5' | npx -y wrangler@4.136.3 secret put COINBASE_X402_PAY_TO --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_COINBASE_X402_PAY_TO_PROVISIONED'
          else echo 'WEB_PRODUCTION_COINBASE_X402_PAY_TO_RETAINED'; fi
          if [[ "$COMMERCIAL_LAUNCH_ACK_PRESENT" != true ]]; then
            printf '%s' 'I_AUTHORIZE_COORDINATED_GEOMACRO_LAUNCH' | npx -y wrangler@4.136.3 secret put GEOMACRO_COMMERCIAL_LAUNCH_ACK --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_COMMERCIAL_LAUNCH_ACK_PROVISIONED'
          else echo 'WEB_PRODUCTION_COMMERCIAL_LAUNCH_ACK_RETAINED'; fi
          if [[ "$CENTRAL_SECURITY_MODE_PRESENT" != true ]]; then
            printf '%s' 'enforce' | npx -y wrangler@4.136.3 secret put GEOMACRO_CENTRAL_SECURITY_MODE --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_CENTRAL_SECURITY_MODE_PROVISIONED'
          else echo 'WEB_PRODUCTION_CENTRAL_SECURITY_MODE_RETAINED'; fi
          if [[ "$REAL_FUNDS_ACK_PRESENT" != true ]]; then
            printf '%s' 'I_ACCEPT_REAL_FUNDS_SECURITY_GATES' | npx -y wrangler@4.136.3 secret put GEOMACRO_REAL_FUNDS_SECURITY_ACK --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_REAL_FUNDS_ACK_PROVISIONED'
          else echo 'WEB_PRODUCTION_REAL_FUNDS_ACK_RETAINED'; fi
          if [[ "$API_CREDENTIAL_PEPPER_PRESENT" != true ]]; then
            printf '%s' "$GEOMACRO_API_CREDENTIAL_PEPPER" | npx -y wrangler@4.136.3 secret put GEOMACRO_API_CREDENTIAL_PEPPER --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_API_CREDENTIAL_PEPPER_PROVISIONED'
          else echo 'WEB_PRODUCTION_API_CREDENTIAL_PEPPER_RETAINED'; fi
          if [[ -n "$GROQ_API_KEY" && "$GROQ_API_KEY_PRESENT" != true ]]; then
            printf '%s' "$GROQ_API_KEY" | npx -y wrangler@4.136.3 secret put GROQ_API_KEY --config .output/server/production-wrangler.json >/dev/null
            echo 'WEB_PRODUCTION_GROQ_API_KEY_PROVISIONED'
          elif [[ "$GROQ_API_KEY_PRESENT" == true ]]; then echo 'WEB_PRODUCTION_GROQ_API_KEY_RETAINED'
          else echo 'WEB_PRODUCTION_GROQ_API_KEY_OPTIONAL_UNSET'; fi

      - name: Verify exact SHA and audit production DNS, Worker domains, and public serving
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_CANONICAL_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/blocknine0/geomacro/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA" || { echo 'WEB_PRODUCTION_SUPERSEDED_AFTER_DEPLOY'; exit 2; }
          report=""
          for i in 1 2 3 4; do
            sleep 5
            report="$(node scripts/ops/audit-cloudflare-production-domain.mjs || true)"
            if printf '%s' "$report" | jq -e '.production_hostname_cloudflare_serving_verified == true' >/dev/null 2>&1; then break; fi
          done
          printf '%s\n' "$report"
          printf '%s' "$report" | jq -e '.production_hostname_cloudflare_serving_verified == true' >/dev/null || { echo 'WEB_PRODUCTION_DOMAIN_AUDIT_FAILED'; exit 2; }
          echo 'WEB_PRODUCTION_CUSTOM_DOMAINS_AND_PUBLIC_SHA_VERIFIED'
