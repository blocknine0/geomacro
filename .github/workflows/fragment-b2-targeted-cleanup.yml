name: Fragment B2 Targeted Cleanup
on:
  workflow_dispatch:
    inputs:
      fragment_id:
        description: "Exact archived/eligible fragment UUID"
        required: true
        type: string
      delete_source:
        description: "Delete verified Supabase Storage source after all gates pass"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      confirmation:
        description: "For delete_source=true, type DELETE_VERIFIED_FRAGMENT_SOURCE"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: fragment-b2-targeted-cleanup
  cancel-in-progress: false
jobs:
  targeted-cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_FRAGMENT_TARGET_ID: ${{ inputs.fragment_id }}
      B2_FRAGMENT_TARGET_DELETE: ${{ inputs.delete_source == 'true' && '1' || '0' }}
      B2_FRAGMENT_MIN_AGE_HOURS: "168"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Require explicit destructive confirmation
        if: ${{ inputs.delete_source == 'true' }}
        shell: bash
        run: test "${{ inputs.confirmation }}" = "DELETE_VERIFIED_FRAGMENT_SOURCE"
      - name: Verify archive and run bounded target operation
        run: node scripts/ops/b2-fragment-targeted-cleanup.mjs
