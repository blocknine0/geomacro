name: One-Time UK DESNZ Critical Minerals Source Readback
on:
  push:
    branches:
      - diag/free-minerals-uk-desnz-20261013
permissions:
  contents: read
jobs:
  real-network:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test scripts/tests/operator-commercial-free-source-lineup.test.mjs
      - name: Actual no-key three-domain group 2 original-source transport
        run: FREE_SOURCE_GROUP=2 node scripts/ops/probe-commercial-free-source-lineup.mjs
