name: Propose and Approve AgentArena V2 Upgrade

on:
  workflow_dispatch:
    inputs:
      new_implementation:
        description: "Fresh deployed AgentArenaV2 implementation address"
        required: true
        type: string

jobs:
  propose-and-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Safety guard
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing V2 upgrade proposal from ${GITHUB_REF_NAME}"
            echo "Run this workflow from main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ethers
        run: npm install --no-save --package-lock=false ethers@6

      - name: Propose and approve fresh V2 implementation
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          TREASURY_PRIVATE_KEY_1: ${{ secrets.TREASURY_PRIVATE_KEY_1 }}
          TREASURY_PRIVATE_KEY_2: ${{ secrets.TREASURY_PRIVATE_KEY_2 }}
          CONTRACT_ADDRESS: ${{ vars.ARC_V2_PROXY_ADDRESS }}
          NEW_IMPLEMENTATION: ${{ inputs.new_implementation }}

        run: |
          node --input-type=module <<'NODE'
          import { ethers } from "ethers";

          const EXPECTED_CHAIN_ID = 5042002n;
          const ZERO = ethers.ZeroAddress;

          const {
            ARC_RPC_URL,
            TREASURY_PRIVATE_KEY_1,
            TREASURY_PRIVATE_KEY_2,
            CONTRACT_ADDRESS,
            NEW_IMPLEMENTATION,
          } = process.env;

          if (
            !ARC_RPC_URL ||
            !TREASURY_PRIVATE_KEY_1 ||
            !TREASURY_PRIVATE_KEY_2 ||
            !CONTRACT_ADDRESS ||
            !NEW_IMPLEMENTATION
          ) {
            throw new Error(
              "Missing ARC_RPC_URL, treasury signer keys, proxy address, or new implementation"
            );
          }

          if (!ethers.isAddress(CONTRACT_ADDRESS)) {
            throw new Error(
              `Invalid ARC_V2_PROXY_ADDRESS: ${CONTRACT_ADDRESS}`
            );
          }

          if (!ethers.isAddress(NEW_IMPLEMENTATION)) {
            throw new Error(
              `Invalid new implementation address: ${NEW_IMPLEMENTATION}`
            );
          }

          if (
            CONTRACT_ADDRESS.toLowerCase() ===
            NEW_IMPLEMENTATION.toLowerCase()
          ) {
            throw new Error(
              "Implementation address cannot equal proxy address"
            );
          }

          const provider = new ethers.JsonRpcProvider(
            ARC_RPC_URL
          );

          const network = await provider.getNetwork();

          console.log(
            "Chain ID:",
            network.chainId.toString()
          );

          if (network.chainId !== EXPECTED_CHAIN_ID) {
            throw new Error(
              `Wrong network. Expected Arc Testnet ${EXPECTED_CHAIN_ID}, got ${network.chainId}`
            );
          }

          const [
            proxyCode,
            implementationCode,
          ] = await Promise.all([
            provider.getCode(CONTRACT_ADDRESS),
            provider.getCode(NEW_IMPLEMENTATION),
          ]);

          if (proxyCode === "0x") {
            throw new Error(
              `Proxy has no deployed bytecode: ${CONTRACT_ADDRESS}`
            );
          }

          if (implementationCode === "0x") {
            throw new Error(
              `New implementation has no deployed bytecode: ${NEW_IMPLEMENTATION}`
            );
          }

          console.log(
            "Proxy:",
            CONTRACT_ADDRESS
          );

          console.log(
            "Fresh V2 implementation:",
            NEW_IMPLEMENTATION
          );

          console.log(
            "Implementation runtime code size:",
            (implementationCode.length - 2) / 2,
            "bytes"
          );

          const signer1 = new ethers.Wallet(
            TREASURY_PRIVATE_KEY_1,
            provider
          );

          const signer2 = new ethers.Wallet(
            TREASURY_PRIVATE_KEY_2,
            provider
          );

          if (
            signer1.address.toLowerCase() ===
            signer2.address.toLowerCase()
          ) {
            throw new Error(
              "TREASURY_PRIVATE_KEY_1 and TREASURY_PRIVATE_KEY_2 resolve to the same address"
            );
          }

          const arenaAbi = [
            "function treasury() view returns (address)",
            "function proposeUpgrade(address)",
            "function approveUpgrade(address)",
            "function pendingImplementation() view returns (address)",
            "function upgradeUnlockTime() view returns (uint256)",
            "function upgradeApprovalCount() view returns (uint256)",
            "function upgradeApprovedBy(address) view returns (bool)"
          ];

          const treasuryAbi = [
            "function isSigner(address) view returns (bool)",
            "function getSigners() view returns (address[3])"
          ];

          const arena1 = new ethers.Contract(
            CONTRACT_ADDRESS,
            arenaAbi,
            signer1
          );

          const arena2 = new ethers.Contract(
            CONTRACT_ADDRESS,
            arenaAbi,
            signer2
          );

          const treasuryAddress =
            await arena1.treasury();

          if (
            !ethers.isAddress(treasuryAddress) ||
            treasuryAddress === ZERO
          ) {
            throw new Error(
              `Invalid treasury returned by proxy: ${treasuryAddress}`
            );
          }

          const treasury = new ethers.Contract(
            treasuryAddress,
            treasuryAbi,
            provider
          );

          const [
            configuredSigners,
            signer1Allowed,
            signer2Allowed,
          ] = await Promise.all([
            treasury.getSigners(),
            treasury.isSigner(signer1.address),
            treasury.isSigner(signer2.address),
          ]);

          console.log(
            "Treasury:",
            treasuryAddress
          );

          console.log(
            "Configured treasury signers:",
            configuredSigners
          );

          console.log(
            "Signer 1:",
            signer1.address
          );

          console.log(
            "Signer 2:",
            signer2.address
          );

          if (!signer1Allowed) {
            throw new Error(
              `TREASURY_PRIVATE_KEY_1 address ${signer1.address} is not an authorized treasury signer`
            );
          }

          if (!signer2Allowed) {
            throw new Error(
              `TREASURY_PRIVATE_KEY_2 address ${signer2.address} is not an authorized treasury signer`
            );
          }

          const [
            beforePending,
            beforeUnlock,
            beforeCount,
          ] = await Promise.all([
            arena1.pendingImplementation(),
            arena1.upgradeUnlockTime(),
            arena1.upgradeApprovalCount(),
          ]);

          console.log(
            "Before pendingImplementation:",
            beforePending
          );

          console.log(
            "Before upgradeApprovalCount:",
            Number(beforeCount)
          );

          console.log(
            "Before upgradeUnlockTime:",
            beforeUnlock.toString()
          );

          let proposalTxHash = null;

          if (
            beforePending === ZERO
          ) {
            console.log(
              "No pending implementation. Creating fresh V2 proposal."
            );

            const tx =
              await arena1.proposeUpgrade(
                NEW_IMPLEMENTATION
              );

            proposalTxHash = tx.hash;

            console.log(
              "proposeUpgrade tx:",
              tx.hash
            );

            const receipt = await tx.wait();

            if (
              !receipt ||
              receipt.status !== 1
            ) {
              throw new Error(
                "V2 proposal transaction failed"
              );
            }
          } else if (
            beforePending.toLowerCase() !==
            NEW_IMPLEMENTATION.toLowerCase()
          ) {
            console.log(
              `Replacing stale pending implementation ${beforePending}`
            );

            console.log(
              `New V2 implementation: ${NEW_IMPLEMENTATION}`
            );

            const tx =
              await arena1.proposeUpgrade(
                NEW_IMPLEMENTATION
              );

            proposalTxHash = tx.hash;

            console.log(
              "replacement proposeUpgrade tx:",
              tx.hash
            );

            const receipt = await tx.wait();

            if (
              !receipt ||
              receipt.status !== 1
            ) {
              throw new Error(
                "Replacement V2 proposal transaction failed"
              );
            }
          } else {
            console.log(
              "Fresh V2 implementation is already the pending target."
            );
          }

          const [
            pendingAfterProposal,
            countAfterProposal,
            unlockAfterProposal,
            signer1ApprovedAfterProposal,
          ] = await Promise.all([
            arena1.pendingImplementation(),
            arena1.upgradeApprovalCount(),
            arena1.upgradeUnlockTime(),
            arena1.upgradeApprovedBy(
              signer1.address
            ),
          ]);

          if (
            pendingAfterProposal.toLowerCase() !==
            NEW_IMPLEMENTATION.toLowerCase()
          ) {
            throw new Error(
              `Pending implementation mismatch after proposal. Expected ${NEW_IMPLEMENTATION}, got ${pendingAfterProposal}`
            );
          }

          if (
            countAfterProposal < 1n
          ) {
            throw new Error(
              "Proposal did not register the first treasury approval"
            );
          }

          if (
            !signer1ApprovedAfterProposal
          ) {
            throw new Error(
              "Treasury signer 1 was not recorded as approving the fresh V2 proposal"
            );
          }

          if (
            unlockAfterProposal === 0n
          ) {
            throw new Error(
              "Fresh V2 proposal did not set an upgrade timelock"
            );
          }

          console.log(
            "Pending after proposal:",
            pendingAfterProposal
          );

          console.log(
            "Approval count after proposal:",
            Number(countAfterProposal)
          );

          console.log(
            "Unlock after proposal:",
            unlockAfterProposal.toString()
          );

          let approvalTxHash = null;

          const signer2AlreadyApproved =
            await arena1.upgradeApprovedBy(
              signer2.address
            );

          if (
            !signer2AlreadyApproved
          ) {
            console.log(
              "Submitting treasury signer 2 approval."
            );

            const tx =
              await arena2.approveUpgrade(
                NEW_IMPLEMENTATION
              );

            approvalTxHash = tx.hash;

            console.log(
              "approveUpgrade tx:",
              tx.hash
            );

            const receipt = await tx.wait();

            if (
              !receipt ||
              receipt.status !== 1
            ) {
              throw new Error(
                "Second treasury approval transaction failed"
              );
            }
          } else {
            console.log(
              "Treasury signer 2 already approved this exact V2 implementation."
            );
          }

          const [
            finalPending,
            finalUnlock,
            finalCount,
            signer1Approved,
            signer2Approved,
          ] = await Promise.all([
            arena1.pendingImplementation(),
            arena1.upgradeUnlockTime(),
            arena1.upgradeApprovalCount(),
            arena1.upgradeApprovedBy(
              signer1.address
            ),
            arena1.upgradeApprovedBy(
              signer2.address
            ),
          ]);

          if (
            finalPending.toLowerCase() !==
            NEW_IMPLEMENTATION.toLowerCase()
          ) {
            throw new Error(
              `Final pendingImplementation mismatch: ${finalPending}`
            );
          }

          if (
            finalCount < 2n
          ) {
            throw new Error(
              `Expected at least 2 treasury approvals, got ${finalCount}`
            );
          }

          if (
            !signer1Approved ||
            !signer2Approved
          ) {
            throw new Error(
              "Both configured treasury signers must approve the exact V2 implementation"
            );
          }

          if (
            finalUnlock === 0n
          ) {
            throw new Error(
              "Final upgradeUnlockTime is zero"
            );
          }

          const latestBlock =
            await provider.getBlock(
              "latest"
            );

          if (!latestBlock) {
            throw new Error(
              "Unable to read latest Arc block"
            );
          }

          const unlockDate =
            new Date(
              Number(finalUnlock) * 1000
            );

          console.log("");
          console.log(
            "========================================"
          );

          console.log(
            "V2 UPGRADE PROPOSAL READY"
          );

          console.log(
            "========================================"
          );

          console.log(
            "Permanent proxy:",
            CONTRACT_ADDRESS
          );

          console.log(
            "Pending V2 implementation:",
            finalPending
          );

          console.log(
            "Upgrade approval count:",
            Number(finalCount)
          );

          console.log(
            "Signer 1 approved:",
            signer1Approved
          );

          console.log(
            "Signer 2 approved:",
            signer2Approved
          );

          console.log(
            "Upgrade unlock timestamp:",
            finalUnlock.toString()
          );

          console.log(
            "Upgrade unlock ISO:",
            unlockDate.toISOString()
          );

          console.log(
            "Current block timestamp:",
            latestBlock.timestamp
          );

          if (proposalTxHash) {
            console.log(
              "Proposal tx:",
              proposalTxHash
            );
          }

          if (approvalTxHash) {
            console.log(
              "Second approval tx:",
              approvalTxHash
            );
          }

          console.log("");
          console.log(
            "WAIT: Do not run execute-v2-upgrade until this new 48h timelock has elapsed."
          );

          console.log(
            "V2 ONLY: no V3 initializer or V3 implementation is used."
          );
          NODE