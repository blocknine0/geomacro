name: ADB Key Indicators Fiscal Discovery

on:
  pull_request:
    paths:
      - "scripts/audit-adb-key-indicators-fiscal-discovery.mjs"
      - ".github/workflows/adb-key-indicators-fiscal-discovery.yml"
      - "docs/MULTI_SOURCE_ACTIVATION_MATRIX.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run live ADB Key Indicators 2026 fiscal discovery
        id: discovery
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-adb-key-indicators-fiscal-discovery.mjs 2>&1 | tee adb-key-indicators-fiscal-discovery.log

      - name: Enforce discovery and activation boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s adb-key-indicators-fiscal-discovery.json
          jq -e '.writes_performed == false' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.production_activation_allowed == false' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.scoring_changed == false' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.methodology_boundary.discovery_only == true' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.methodology_boundary.debt_definition_harmonised == false' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.methodology_boundary.cross_source_value_pooling_allowed == false' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.sample.failure_count == 0' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.sample.resource_verified_country_count == .sample.requested_country_count' adb-key-indicators-fiscal-discovery.json >/dev/null
          jq -e '.sample.fiscal_vocabulary_country_count > 0' adb-key-indicators-fiscal-discovery.json >/dev/null
          echo "PASS: ADB Key Indicators discovery verified exact resources without enabling production scoring"

      - name: Upload ADB discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adb-key-indicators-fiscal-discovery
          path: |
            adb-key-indicators-fiscal-discovery.json
            adb-key-indicators-fiscal-discovery.log
          if-no-files-found: warn
          retention-days: 30
