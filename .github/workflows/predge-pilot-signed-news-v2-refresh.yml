name: Predge Signed Pilot News Context v2 - protected opt-in refresh
# Disabled by default. Founder approval and partner validator acceptance required.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "One-time owner approval (PREDGE_V2_SIGN_ONCE_NO_FUNDS)"
        type: string
        required: true
  schedule:
    - cron: "11,41 * * * *"
  # Independent publisher completion wakes signer if GitHub drops its cron.
  # Signed recency and 48/day cap prevent two publishers per 30m slot.
  workflow_run:
    workflows: ["Three-Domain 30-Minute Original Publisher Pulse"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: predge-signed-pilot-context-production
  cancel-in-progress: false
jobs:
  refresh:
    # Manual execution requires an explicit one-time owner authorization input.
    # Scheduled execution requires an explicit opt-in: GitHub variable YES or
    # a protected production secret with the exact recurring approval phrase.
    # Never gate on vars at job-if evaluation (environment scope not yet loaded).
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      ROOT_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      PREDGE_RESEARCH_NEWS_TOKEN_OVERRIDE: ${{ secrets.PREDGE_RESEARCH_NEWS_TOKEN_OVERRIDE }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
    steps:
      - name: Confirm production preview opt-in before accessing secrets
        id: opt_in
        shell: bash
        env:
          PREVIEW_ENABLED: ${{ vars.GEOMACRO_PREDGE_SIGNED_PREVIEW_ENABLED }}
          RECURRING_APPROVAL: ${{ secrets.GEOMACRO_PREDGE_RECURRING_REFRESH_APPROVAL }}
          MANUAL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            if test "$MANUAL_CONFIRMATION" != "PREDGE_V2_SIGN_ONCE_NO_FUNDS"; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::error::PREDGE_MANUAL_SIGNING_APPROVAL_REQUIRED"
              exit 2
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "PREDGE_ONE_TIME_OWNER_SIGNING_APPROVED"
          elif { test "$GITHUB_EVENT_NAME" = "schedule" || test "$GITHUB_EVENT_NAME" = "workflow_run"; } &&
            { test "$PREVIEW_ENABLED" = "YES" ||
              test "$RECURRING_APPROVAL" = "PREDGE_V2_RECURRING_NO_FUNDS_APPROVED"; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "PREDGE_SCHEDULED_PREVIEW_OPT_IN_CONFIRMED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PREDGE_PREVIEW_DISABLED_NO_SIGNING_OR_PUBLICATION"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.opt_in.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.opt_in.outputs.enabled == 'true'
        with:
          node-version: "24"
      - name: Verify prior signed-readback freshness and remaining daily quota
        if: steps.opt_in.outputs.enabled == 'true'
        id: cadence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/check-predge-signed-refresh-cadence.mjs
      - name: Derive owner-only control-plane token without printing it
        if: steps.opt_in.outputs.enabled == 'true' && steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ROOT_LEDGER_TOKEN:-}" || { echo "::error::ROOT_SECRET_REQUIRED"; exit 2; }
          test -n "${PREDGE_RESEARCH_NEWS_TOKEN_OVERRIDE:-}" || { echo "::error::PREDGE_RESEARCH_TOKEN_REQUIRED"; exit 2; }
          test -n "${RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64:-}" || { echo "::error::PINNED_SIGNING_KEY_REQUIRED"; exit 2; }
          TOKEN="$(node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.ROOT_LEDGER_TOKEN).update('geomacro-control-plane-v1').digest('hex'))")"
          echo "::add-mask::$TOKEN"
          echo "CONTROL_PLANE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Generate, locally verify, publish and independently read back real signed envelope
        if: steps.opt_in.outputs.enabled == 'true' && steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          FILE="$RUNNER_TEMP/predge-pilot-context-$(date -u +%s).json"
          trap 'shred -u "$FILE" 2>/dev/null || rm -f "$FILE"' EXIT
          node scripts/ops/sign-predge-pilot-check-v2.mjs "$FILE"
          node scripts/ops/publish-predge-pilot-check-v2.mjs "$FILE"
