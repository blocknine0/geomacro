name: Predge Signed Market Public Contract Discovery (No Funds)
on:
  pull_request:
    paths:
      - "scripts/ops/inspect-predge-public-verification.mjs"
      - "scripts/ops/verify-predge-signed-market.mjs"
      - "scripts/ops/verify-predge-signed-market.test.mjs"
      - "scripts/ops/verify-predge-key-rotation.mjs"
      - "scripts/ops/verify-predge-key-rotation.test.mjs"
      - ".github/workflows/predge-signed-market-public-verification.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ops/inspect-predge-public-verification.mjs"
      - "scripts/ops/verify-predge-signed-market.mjs"
      - "scripts/ops/verify-predge-signed-market.test.mjs"
      - "scripts/ops/verify-predge-key-rotation.mjs"
      - "scripts/ops/verify-predge-key-rotation.test.mjs"
      - ".github/workflows/predge-signed-market-public-verification.yml"
  workflow_dispatch: {}
  schedule:
    # Recheck when Predge eventually re-signs the known public market.
    - cron: "37 3,9,15,21 * * *"
permissions:
  contents: read
concurrency:
  group: predge-public-market-independent-verifier
  cancel-in-progress: false
jobs:
  inspect-public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ""
      CLOUDFLARE_API_TOKEN: ""
      PREDGE_RESEARCH_NEWS_TOKEN: ""
      PREDGE_RISK_GATE_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Inspect only Amir's exact public endpoints
        run: |
          set -euo pipefail
          node --check scripts/ops/inspect-predge-public-verification.mjs
          node scripts/ops/inspect-predge-public-verification.mjs
      - name: Offline crypto, tamper and revoked-key tests
        run: |
          set -euo pipefail
          node --check scripts/ops/verify-predge-signed-market.mjs
          node --check scripts/ops/verify-predge-key-rotation.mjs
          node --test scripts/ops/verify-predge-signed-market.test.mjs scripts/ops/verify-predge-key-rotation.test.mjs
      - name: Live key rotation and all three signatures
        run: |
          set -euo pipefail
          node scripts/ops/verify-predge-key-rotation.mjs
      - name: No payments, signing, GRO issuance or execution
        run: echo "PREDGE_PUBLIC_NO_FUNDS_INTEGRITY_VERIFIED_ONLY"
