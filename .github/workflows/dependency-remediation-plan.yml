name: Dependency Remediation Plan

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dependency-remediation-plan.yml"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Inspect latest Circle package metadata
        shell: bash
        run: |
          set -euo pipefail
          echo '=== @circle-fin/app-kit latest ==='
          npm view @circle-fin/app-kit@latest version dependencies --json
          echo '=== @circle-fin/adapter-ethers-v6 latest ==='
          npm view @circle-fin/adapter-ethers-v6@latest version dependencies peerDependencies --json
          echo '=== @circle-fin/adapter-viem-v2 latest ==='
          npm view @circle-fin/adapter-viem-v2@latest version dependencies peerDependencies --json
          echo '=== vulnerable owners ==='
          npm view @coral-xyz/anchor@latest version dependencies --json
          npm view jayson@latest version dependencies --json

      - name: Install canonical lockfile
        run: bun install --frozen-lockfile

      - name: Generate latest safe remediation plan
        id: remediation
        shell: bash
        run: |
          set +e
          cp package.json package.json.before
          cp bun.lock bun.lock.before
          bun audit fix --latest
          fix_exit=$?
          git diff -- package.json bun.lock > dependency-remediation.diff
          echo "bun_audit_fix_exit=${fix_exit}" | tee remediation-summary.txt
          echo "Changed package.json entries:"
          git diff -- package.json || true
          bun audit 2>&1 | tee audit-after.txt
          audit_exit=${PIPESTATUS[0]}
          echo "bun_audit_after_exit=${audit_exit}" | tee -a remediation-summary.txt
          exit 0

      - name: Validate remediated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun audit
          bunx vitest run src/__tests__/risk-gate-api-parser.test.ts src/__tests__/risk-gate-api-hardening.test.ts src/__tests__/risk-gate-runtime-fail-closed.test.ts src/__tests__/risk-gate-verification-fail-closed.test.ts src/__tests__/risk-supabase-timeout.test.ts
          bun run db:safety
          bun run build

      - name: Upload remediation files and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-remediation-${{ github.run_id }}
          path: |
            package.json
            bun.lock
            dependency-remediation.diff
            remediation-summary.txt
            audit-after.txt
          if-no-files-found: error
          retention-days: 7
