name: Coinbase x402 Base Sepolia Paid E2E Proof

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly COINBASE_X402_BASE_SEPOLIA_USDC to authorize one 0.05 USDC-max Base Sepolia test payment'
        required: true
        type: string
      client_request_id:
        description: 'Optional deterministic client request ID for reconciliation/retry'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: coinbase-x402-base-sepolia-paid-e2e
  cancel-in-progress: false

jobs:
  paid-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: coinbase-x402-base-sepolia-paid-proof
    env:
      GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY: ${{ secrets.GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY }}
      GEOMACRO_COINBASE_X402_BUYER_ADDRESS: ${{ secrets.GEOMACRO_COINBASE_X402_BUYER_ADDRESS }}
      GEOMACRO_COINBASE_X402_BASE_SEPOLIA_RPC: ${{ secrets.GEOMACRO_COINBASE_X402_BASE_SEPOLIA_RPC }}
      GEOMACRO_COINBASE_X402_E2E_ACK: ${{ inputs.confirmation }}
      GEOMACRO_COINBASE_X402_CLIENT_REQUEST_ID: ${{ inputs.client_request_id }}
      GEOMACRO_COINBASE_X402_E2E_ARTIFACT_DIR: artifacts/coinbase-x402-base-sepolia-paid

    steps:
      - name: Validate explicit Base Sepolia payment acknowledgement
        shell: bash
        run: |
          if [ "$GEOMACRO_COINBASE_X402_E2E_ACK" != "COINBASE_X402_BASE_SEPOLIA_USDC" ]; then
            echo "::error::Paid Base Sepolia proof requires the exact acknowledgement COINBASE_X402_BASE_SEPOLIA_USDC."
            exit 1
          fi
          echo "Explicit Base Sepolia test payment acknowledgement accepted." >> "$GITHUB_STEP_SUMMARY"
          echo "Hard per-run payment cap: 0.05 test USDC." >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate protected buyer secret without printing it
        shell: bash
        run: |
          if [ -z "$GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY" ]; then
            echo "::error::GEOMACRO_COINBASE_X402_BUYER_PRIVATE_KEY is not configured in the protected coinbase-x402-base-sepolia-paid-proof environment."
            exit 1
          fi

      - name: Checkout exact workflow ref
        uses: actions/checkout@v7

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Execute one explicitly acknowledged paid Base Sepolia E2E plus replay proof
        run: node scripts/agentic/coinbase-x402-base-sepolia-e2e.mjs

      - name: Upload sanitized paid-proof evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coinbase-x402-base-sepolia-paid-proof-${{ github.run_id }}
          path: artifacts/coinbase-x402-base-sepolia-paid/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Record proof boundary
        if: always()
        shell: bash
        run: |
          echo "Network: Base Sepolia / eip155:84532" >> "$GITHUB_STEP_SUMMARY"
          echo "Asset: Base Sepolia USDC" >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum authorized payment per run: 0.05 test USDC" >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Private key persisted in evidence: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw PAYMENT-SIGNATURE persisted in evidence: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution authorization from Risk Gate: false" >> "$GITHUB_STEP_SUMMARY"
