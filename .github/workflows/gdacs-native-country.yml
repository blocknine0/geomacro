name: GDACS native country and IMF PortWatch daily reference verification
on:
  pull_request:
    paths:
      - "global-intelligence/adapters/gdacs-native-country.mjs"
      - "scripts/tests/gdacs-native-country.test.mjs"
      - "global-intelligence/adapters/gdacs-official-eq-rss.mjs"
      - "scripts/tests/gdacs-official-eq-rss.test.mjs"
      - "scripts/ops/verify-gdacs-native-country.mjs"
      - "scripts/lib/rbi-official-macro-release.mjs"
      - "scripts/lib/rbi-official-macro-release.test.mjs"
      - "scripts/ops/observe-rbi-official-macro-reference.mjs"
      - "scripts/lib/imf-portwatch-daily-corridors.mjs"
      - "scripts/tests/imf-portwatch-daily-corridors.test.mjs"
      - "scripts/ops/observe-imf-portwatch-corridors.mjs"
      - "scripts/lib/wdi-195-batch-reference.mjs"
      - "scripts/tests/wdi-195-batch-reference.test.mjs"
      - "scripts/lib/two-official-mineral-release-indices.mjs"
      - "scripts/tests/two-official-mineral-release-indices.test.mjs"
      - "scripts/ops/observe-free-batched-macro-minerals-195.mjs"
      - "scripts/lib/imf-195-country-reference-gap.mjs"
      - "scripts/tests/imf-195-country-reference-gap.test.mjs"
      - "scripts/ops/observe-imf-195-reference.mjs"
      - "scripts/lib/wdi-195-last-nonempty.mjs"
      - "scripts/tests/wdi-195-last-nonempty.test.mjs"
      - "scripts/lib/chile-copper-official-monthly.mjs"
      - "scripts/tests/chile-copper-official-monthly.test.mjs"
      - "scripts/ops/observe-chile-copper-official.mjs"
      - "scripts/lib/indonesia-esdm-official-index.mjs"
      - "scripts/tests/indonesia-esdm-official-index.test.mjs"
      - "scripts/ops/observe-indonesia-esdm.mjs"
      - "scripts/lib/ons-lms-official-release.mjs"
      - "scripts/tests/ons-lms-official-release.test.mjs"
      - "scripts/ops/observe-ons-lms-official-release.mjs"
      - "scripts/lib/comtrade-195-actual-mineral-reference.mjs"
      - "scripts/tests/comtrade-195-actual-mineral-reference.test.mjs"
      - "scripts/ops/observe-comtrade-195-minerals.mjs"
      - "scripts/ops/audit-all-source-product-contract.mjs"
      - "config/operator-country-source-crosswalk.v1.json"
      - "config/operator-corridor-source-crosswalk.v1.json"
      - "global-intelligence/sources/national-minerals-authority.v1.json"
      - ".github/workflows/gdacs-native-country.yml"
  push:
    branches: [main]
    paths:
      - "global-intelligence/adapters/gdacs-native-country.mjs"
      - "scripts/tests/gdacs-native-country.test.mjs"
      - "global-intelligence/adapters/gdacs-official-eq-rss.mjs"
      - "scripts/tests/gdacs-official-eq-rss.test.mjs"
      - "scripts/ops/verify-gdacs-native-country.mjs"
      - "scripts/lib/rbi-official-macro-release.mjs"
      - "scripts/lib/rbi-official-macro-release.test.mjs"
      - "scripts/ops/observe-rbi-official-macro-reference.mjs"
      - "scripts/lib/imf-portwatch-daily-corridors.mjs"
      - "scripts/tests/imf-portwatch-daily-corridors.test.mjs"
      - "scripts/ops/observe-imf-portwatch-corridors.mjs"
      - "scripts/lib/wdi-195-batch-reference.mjs"
      - "scripts/tests/wdi-195-batch-reference.test.mjs"
      - "scripts/lib/two-official-mineral-release-indices.mjs"
      - "scripts/tests/two-official-mineral-release-indices.test.mjs"
      - "scripts/ops/observe-free-batched-macro-minerals-195.mjs"
      - "scripts/lib/imf-195-country-reference-gap.mjs"
      - "scripts/tests/imf-195-country-reference-gap.test.mjs"
      - "scripts/ops/observe-imf-195-reference.mjs"
      - "scripts/lib/wdi-195-last-nonempty.mjs"
      - "scripts/tests/wdi-195-last-nonempty.test.mjs"
      - "scripts/lib/chile-copper-official-monthly.mjs"
      - "scripts/tests/chile-copper-official-monthly.test.mjs"
      - "scripts/ops/observe-chile-copper-official.mjs"
      - "scripts/lib/indonesia-esdm-official-index.mjs"
      - "scripts/tests/indonesia-esdm-official-index.test.mjs"
      - "scripts/ops/observe-indonesia-esdm.mjs"
      - "scripts/lib/ons-lms-official-release.mjs"
      - "scripts/tests/ons-lms-official-release.test.mjs"
      - "scripts/ops/observe-ons-lms-official-release.mjs"
      - "scripts/lib/comtrade-195-actual-mineral-reference.mjs"
      - "scripts/tests/comtrade-195-actual-mineral-reference.test.mjs"
      - "scripts/ops/observe-comtrade-195-minerals.mjs"
      - "scripts/ops/audit-all-source-product-contract.mjs"
      - "config/operator-country-source-crosswalk.v1.json"
      - "config/operator-corridor-source-crosswalk.v1.json"
      - "global-intelligence/sources/national-minerals-authority.v1.json"
      - ".github/workflows/gdacs-native-country.yml"
  workflow_dispatch:
  schedule:
    - cron: "51 3 * * *"
permissions:
  contents: read
concurrency:
  group: gdacs-country-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: |
          set -euo pipefail
          node --check global-intelligence/adapters/gdacs-native-country.mjs
          node --check scripts/ops/verify-gdacs-native-country.mjs
          node --test scripts/tests/gdacs-native-country.test.mjs
          node --check global-intelligence/adapters/gdacs-official-eq-rss.mjs
          node --test scripts/tests/gdacs-official-eq-rss.test.mjs
          node --check scripts/lib/rbi-official-macro-release.mjs
          node --check scripts/ops/observe-rbi-official-macro-reference.mjs
          node --test scripts/lib/rbi-official-macro-release.test.mjs
          node --check scripts/lib/imf-portwatch-daily-corridors.mjs
          node --check scripts/ops/observe-imf-portwatch-corridors.mjs
          node --test scripts/tests/imf-portwatch-daily-corridors.test.mjs
          node --check scripts/lib/wdi-195-batch-reference.mjs
          node --check scripts/lib/two-official-mineral-release-indices.mjs
          node --check scripts/ops/observe-free-batched-macro-minerals-195.mjs
          node --test scripts/tests/wdi-195-batch-reference.test.mjs
          node --check scripts/lib/imf-195-country-reference-gap.mjs
          node --check scripts/ops/observe-imf-195-reference.mjs
          node --test scripts/tests/imf-195-country-reference-gap.test.mjs
          node --check scripts/lib/wdi-195-last-nonempty.mjs
          node --test scripts/tests/wdi-195-last-nonempty.test.mjs
          node --test scripts/tests/two-official-mineral-release-indices.test.mjs
          node --check scripts/lib/chile-copper-official-monthly.mjs
          node --check scripts/ops/observe-chile-copper-official.mjs
          node --test scripts/tests/chile-copper-official-monthly.test.mjs
          node --check scripts/lib/indonesia-esdm-official-index.mjs
          node --check scripts/ops/observe-indonesia-esdm.mjs
          node --test scripts/tests/indonesia-esdm-official-index.test.mjs
          node --check scripts/lib/ons-lms-official-release.mjs
          node --check scripts/ops/observe-ons-lms-official-release.mjs
          node --test scripts/tests/ons-lms-official-release.test.mjs
          node --check scripts/lib/comtrade-195-actual-mineral-reference.mjs
          node --check scripts/ops/observe-comtrade-195-minerals.mjs
          node --test scripts/tests/comtrade-195-actual-mineral-reference.test.mjs
          node --check scripts/ops/audit-all-source-product-contract.mjs
          node scripts/ops/audit-all-source-product-contract.mjs
      - name: Create private per-source product qualification ledger
        if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/ops/audit-all-source-product-contract.mjs --write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: private-three-domain-source-census-${{ github.run_id }}
          path: artifacts/all-source-product-contract/*.json
          retention-days: 3
          if-no-files-found: error

  live-upstream:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node scripts/ops/verify-gdacs-native-country.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gdacs-native-country-${{ github.run_id }}
          path: artifacts/gdacs-native-country/receipt.json
          retention-days: 7
          if-no-files-found: warn

  rbi-india-official-macro-reference:
    # Existing GDACS/PortWatch daily cron, ONE issuer RSS read and at most
    # ONE exact same-publisher DNS/www fallback on transient transport/5xx.
    # First-party feed transport is NOT commercial source rights/signing.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify RBI issuer press RSS original link metadata (research only)
        run: node scripts/ops/observe-rbi-official-macro-reference.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rbi-india-macro-reference-${{ github.run_id }}
          path: artifacts/rbi-official-macro-reference/receipt.json
          retention-days: 3
          if-no-files-found: warn

  portwatch-daily:
    # Shares GDACS's existing once-per-day schedule; no new cron or duplicate
    # chokepoint collector. Independent from the hazard live-upstream verdict.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Read daily first-party chokepoint reference observations without payment
        run: node scripts/ops/observe-imf-portwatch-corridors.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portwatch-corridor-daily-${{ github.run_id }}
          path: artifacts/portwatch-corridor-daily/receipt.json
          retention-days: 3
          if-no-files-found: warn

  free-macro-mineral-global-daily:
    # Reuse GDACS/PortWatch's existing 03:51 UTC free scheduling slot.
    # Precisely THREE bounded no-key first-party GETs, no new cron trigger.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Read 195 WDI reference country rows + two national minerals indices
        run: node scripts/ops/observe-free-batched-macro-minerals-195.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: free-batched-macro-minerals-195-${{ github.run_id }}
          path: artifacts/free-global-source-budget/daily-observation.json
          if-no-files-found: warn
          retention-days: 3

  chile-cochilco-monthly-reference:
    # Extra country-specific critical-mineral evidence on existing daily cron;
    # never treat reference month as new mine incident or commercial rights.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Read Chile central-bank COCHILCO copper reference month
        run: node scripts/ops/observe-chile-copper-official.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: chile-official-copper-monthly-${{ github.run_id }}
          path: artifacts/chile-copper-official/reference.json
          retention-days: 3
          if-no-files-found: warn

  indonesia-esdm-official-mineral-index:
    # Extend official national mines news discovery on same 03:51 UTC slot.
    # Index dates are not corroborated incidents nor commercial rights.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check bounded Ministry ESDM press index
        run: node scripts/ops/observe-indonesia-esdm.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: indonesia-esdm-private-index-${{ github.run_id }}
          path: artifacts/official-national-mineral-index/indonesia-esdm.json
          retention-days: 3
          if-no-files-found: warn

  imf-weo-195-reference:
    # Two no-key, bounded WEO reference-series requests on the existing
    # 03:51 UTC source schedule. No extra cron, no current FX/price claim.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Probe 195 canonical country IMF WEO reference presence
        run: node scripts/ops/observe-imf-195-reference.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: imf-weo-195-private-reference-${{ github.run_id }}
          path: artifacts/imf-195-reference/receipt.json
          retention-days: 3
          if-no-files-found: warn



  ons-lms-national-release:
    # Exact first-party UK Macro release-date health, once per existing daily slot.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Inspect native UK ONS national labour-market release day
        run: node scripts/ops/observe-ons-lms-official-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ons-lms-national-release-${{ github.run_id }}
          path: artifacts/ons-labour-market-daily/receipt.json
          retention-days: 3
          if-no-files-found: warn


  comtrade-195-actual-mineral-reference:
    # Reuse the same daily free cron. Verify actual country reporter catalogue
    # and three scoped annual mineral trade numeric observations; missing is red.
    # NO raw article, Supabase, B2, D1 writes, settlement or paid entitlement.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify live UN Comtrade reporters and scoped reported mineral exports
        run: node scripts/ops/observe-comtrade-195-minerals.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: actual-comtrade-mineral-reference-${{ github.run_id }}
          path: artifacts/official-mineral-trade/comtrade-195-reference.json
          retention-days: 3
          if-no-files-found: warn
