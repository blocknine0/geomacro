name: Recover D1 daily-row quota deployment after reset

on:
  schedule:
    # Cloudflare D1 daily row counters reset at 00:00 UTC; wait ten minutes.
    - cron: "10 0 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: geomacro-d1-quota-deploy-recovery
  cancel-in-progress: false

jobs:
  retry-quota-blocked-deployment:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect only a confirmed D1 daily row-read quota deployment failure
        id: diagnose
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          workflow_file="$RUNNER_TEMP/deploy-workflow.json"
          runs_file="$RUNNER_TEMP/deploy-runs.json"

          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/workflows/deploy-d1-control-plane.yml" -o "$workflow_file"; then
            echo "::warning::D1_QUOTA_RECOVERY_WORKFLOW_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          workflow_id="$(jq -r '.id // empty' "$workflow_file")"
          if [[ -z "$workflow_id" ]]; then
            echo "::warning::D1_QUOTA_RECOVERY_WORKFLOW_ID_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/workflows/$workflow_id/runs?branch=main&per_page=50" -o "$runs_file"; then
            echo "::warning::D1_QUOTA_RECOVERY_RUN_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id="$(jq -r '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | last | .id // empty' "$runs_file")"
          conclusion="$(jq -r --argjson id "${run_id:-0}" '[.workflow_runs[] | select(.id == $id)][0].conclusion // empty' "$runs_file")"
          failed_sha="$(jq -r --argjson id "${run_id:-0}" '[.workflow_runs[] | select(.id == $id)][0].head_sha // empty' "$runs_file")"
          if [[ -z "$run_id" || "$conclusion" != "failure" ]]; then
            echo "No failed latest canonical D1 deployment requires quota recovery."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Do not replay a failed deployment of a superseded main revision.
          if [[ "$failed_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::D1_QUOTA_RECOVERY_STALE_MAIN_SHA_HOLD"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jobs_file="$RUNNER_TEMP/deploy-jobs.json"
          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/runs/$run_id/jobs?per_page=100" -o "$jobs_file"; then
            echo "::warning::D1_QUOTA_RECOVERY_JOB_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          job_id="$(jq -r '[.jobs[] | select(.name == "bootstrap-deploy-accept")][0].id // empty' "$jobs_file")"
          migration_conclusion="$(jq -r '[.jobs[] | select(.name == "bootstrap-deploy-accept")][0].steps[] | select(.name == "Apply committed D1 migrations remotely") | .conclusion' "$jobs_file" 2>/dev/null || true)"
          preflight_conclusion="$(jq -r '[.jobs[] | select(.name == "bootstrap-deploy-accept")][0].steps[] | select(.name == "Require verified D1 Free-tier daily row headroom before migrations") | .conclusion' "$jobs_file" 2>/dev/null || true)"
          if [[ -z "$job_id" || ( "$migration_conclusion" != "failure" && "$preflight_conclusion" != "failure" ) ]]; then
            echo "Latest deployment did not fail at the migration step or explicit D1 quota-headroom gate; no automatic retry."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub's *job* logs API returns plain text (workflow-*run* logs
          # are ZIP archives). Do not run unzip on an ordinary job log.
          # Never print log contents: migrations may contain private SQL.
          log_text="$RUNNER_TEMP/deploy-job-logs.txt"
          if ! curl --fail --location --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/jobs/$job_id/logs" -o "$log_text"; then
            echo "::warning::D1_QUOTA_RECOVERY_LOG_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse truncated, unexpectedly oversized, binary or HTML logs.
          log_bytes="$(wc -c < "$log_text")"
          migration_log=false
          preflight_log=false
          grep -aFq 'Apply committed D1 migrations remotely' "$log_text" && migration_log=true
          grep -aFq 'Require verified D1 Free-tier daily row headroom before migrations' "$log_text" && preflight_log=true
          if (( log_bytes < 100 || log_bytes > 2000000 )) ||
             [[ "$migration_log" != "true" && "$preflight_log" != "true" ]]; then
            echo "::warning::D1_QUOTA_RECOVERY_JOB_LOG_NOT_VERIFIABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read_quota=false
          write_quota=false
          preflight_hold=false
          if grep -aFq "Your account has exceeded D1's free tier daily row read limit" "$log_text" &&
             grep -aFq "code: 7500" "$log_text"; then
            read_quota=true
          fi
          if grep -aFq "Your account has exceeded D1's free tier daily row write limit" "$log_text"; then
            write_quota=true
          fi
          if [[ "$preflight_conclusion" == "failure" ]] &&
             grep -aFq "D1_QUOTA_HEADROOM_UNVERIFIED_OR_BELOW_SAFE_RESERVE" "$log_text"; then
            # No D1 SQL ran: the next dispatch must pass a new live account-wide
            # quota audit before it is allowed to apply migrations.
            preflight_hold=true
          fi
          if [[ "$read_quota" == "true" || "$write_quota" == "true" || "$preflight_hold" == "true" ]]; then
            if [[ "$preflight_hold" == "true" ]]; then
              echo "Confirmed explicit D1 quota-headroom gate failure before any D1 SQL; eligible for a fresh post-reset headroom check."
            elif [[ "$read_quota" == "true" && "$write_quota" == "true" ]]; then
              echo "Confirmed both D1 daily row-read and row-write quota exhaustion; eligible for one post-reset retry."
            elif [[ "$read_quota" == "true" ]]; then
              echo "Confirmed D1 daily row-read quota exhaustion on the latest canonical deploy; eligible for one post-reset retry."
            else
              echo "Confirmed D1 daily row-write quota exhaustion on the latest canonical deploy; eligible for one post-reset retry."
            fi
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest D1 deploy failure is not a recognised daily row quota or explicit preflight hold; no automatic retry."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch canonical Worker deployment after quota reset
        if: steps.diagnose.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-d1-control-plane.yml/dispatches" \
            --data '{"ref":"main","inputs":{"confirmation":"DEPLOY_D1_CONTROL_PLANE_MAIN_NO_FUNDS"}}'
          echo "Dispatched the existing protected deployment workflow; its own migration, secret, Worker and D1 acceptance gates remain mandatory."
