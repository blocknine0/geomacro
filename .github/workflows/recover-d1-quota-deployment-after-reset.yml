name: Recover D1 daily-row quota deployment after reset

on:
  schedule:
    # Cloudflare D1 daily row counters reset at 00:00 UTC; wait ten minutes.
    - cron: "10 0 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: geomacro-d1-quota-deploy-recovery
  cancel-in-progress: false

jobs:
  retry-quota-blocked-deployment:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect only a confirmed D1 daily row-read quota deployment failure
        id: diagnose
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          workflow_file="$RUNNER_TEMP/deploy-workflow.json"
          runs_file="$RUNNER_TEMP/deploy-runs.json"

          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/workflows/deploy-d1-control-plane.yml" -o "$workflow_file"; then
            echo "::warning::D1_QUOTA_RECOVERY_WORKFLOW_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          workflow_id="$(jq -r '.id // empty' "$workflow_file")"
          if [[ -z "$workflow_id" ]]; then
            echo "::warning::D1_QUOTA_RECOVERY_WORKFLOW_ID_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/workflows/$workflow_id/runs?branch=main&per_page=50" -o "$runs_file"; then
            echo "::warning::D1_QUOTA_RECOVERY_RUN_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id="$(jq -r '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | last | .id // empty' "$runs_file")"
          conclusion="$(jq -r --argjson id "${run_id:-0}" '[.workflow_runs[] | select(.id == $id)][0].conclusion // empty' "$runs_file")"
          failed_sha="$(jq -r --argjson id "${run_id:-0}" '[.workflow_runs[] | select(.id == $id)][0].head_sha // empty' "$runs_file")"
          if [[ -z "$run_id" || "$conclusion" != "failure" ]]; then
            echo "No failed latest canonical D1 deployment requires quota recovery."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A D1 7500 deployment can fail before later GeoMacro-only merges.
          # Exact-SHA comparison alone would prevent any post-reset recovery.
          # Fail closed unless the *failed main revision* is an ancestor of
          # the current main commit. Never redeploy a fork or divergent tree.
          # Critically, refuse any intervening Worker deploy, Worker source or
          # PREDGE path changes: locked PREDGE deployment behavior stays put.
          if ! [[ "$failed_sha" =~ ^[a-f0-9]{40}$ ]] ||
             ! [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::warning::D1_QUOTA_RECOVERY_SHA_UNVERIFIED"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$failed_sha" != "$GITHUB_SHA" ]]; then
            compare_file="$RUNNER_TEMP/deploy-main-ancestry.json"
            if ! curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api/compare/$failed_sha...$GITHUB_SHA" -o "$compare_file"; then
              echo "::warning::D1_QUOTA_RECOVERY_ANCESTRY_UNAVAILABLE"
              echo "retry=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! jq -e --arg failed "$failed_sha" --arg head "$GITHUB_SHA" '
              (.status == "ahead") and
              (.behind_by == 0) and
              (.ahead_by | type == "number" and . > 0) and
              (.base_commit.sha == $failed) and
              (.merge_base_commit.sha == $failed) and
              (.files | type == "array" and length < 300) and
              ([.files[].filename | select(test(
                "(^workers/control-plane/|^\\.github/workflows/deploy-d1-control-plane\\.yml$|predge)";
                "i"
              ))] | length == 0)
            ' "$compare_file" >/dev/null; then
              echo "::warning::D1_QUOTA_RECOVERY_DIVERGENT_MAIN_HOLD"
              echo "retry=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::D1_QUOTA_RECOVERY_FAILED_COMMIT_IS_MAIN_ANCESTOR"
          fi

          jobs_file="$RUNNER_TEMP/deploy-jobs.json"
          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/runs/$run_id/jobs?per_page=100" -o "$jobs_file"; then
            echo "::warning::D1_QUOTA_RECOVERY_JOB_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          job_id="$(jq -r '[.jobs[] | select(.name == "bootstrap-deploy-accept")][0].id // empty' "$jobs_file")"
          migration_conclusion="$(jq -r '[.jobs[] | select(.name == "bootstrap-deploy-accept")][0].steps[] | select(.name == "Apply committed D1 migrations remotely") | .conclusion' "$jobs_file" 2>/dev/null || true)"
          schema_conclusion="$(jq -r '[.jobs[] | select(.name == "bootstrap-deploy-accept")][0].steps[] | select(.name == "Verify D1 schema directly") | .conclusion' "$jobs_file" 2>/dev/null || true)"
          if [[ -z "$job_id" ]] || [[ "$migration_conclusion" != "failure" && "$schema_conclusion" != "failure" ]]; then
            echo "Latest deployment did not fail at a D1 migration/schema step; no automatic retry."
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub's *job* logs API returns plain text (workflow-*run* logs
          # are ZIP archives). Do not run unzip on an ordinary job log.
          # Never print log contents: migrations may contain private SQL.
          log_text="$RUNNER_TEMP/deploy-job-logs.txt"
          if ! curl --fail --location --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/jobs/$job_id/logs" -o "$log_text"; then
            echo "::warning::D1_QUOTA_RECOVERY_LOG_LOOKUP_UNAVAILABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The jobs API above proves the failed migration/schema step.
          # GitHub job logs contain timestamped command output, not necessarily
          # the step's display name. Requiring that name blocks valid recovery.
          # Refuse undersized/oversized or non-timestamped responses; the two
          # exact provider quota markers below remain mandatory.
          log_bytes="$(wc -c < "$log_text")"
          if (( log_bytes < 100 || log_bytes > 2000000 )) ||
             ! grep -aEq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+Z ' "$log_text"; then
            echo "::warning::D1_QUOTA_RECOVERY_JOB_LOG_NOT_VERIFIABLE"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -aFq "Your account has exceeded D1's free tier daily row read limit" "$log_text" &&
             grep -aFq "code: 7500" "$log_text"; then
            echo "Confirmed D1 daily row-read quota exhaustion on the latest canonical deploy; eligible for one post-reset retry."
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest D1 deploy failure is not the specific daily row-read quota class; no automatic retry."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch canonical Worker deployment after quota reset
        if: steps.diagnose.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-d1-control-plane.yml/dispatches" \
            --data '{"ref":"main","inputs":{"confirmation":"DEPLOY_D1_CONTROL_PLANE_MAIN_NO_FUNDS"}}'
          echo "Dispatched the existing protected deployment workflow; its own migration, secret, Worker and D1 acceptance gates remain mandatory."

      - name: Wake the existing quota-guarded source publisher after UTC reset
        # A quota-held publisher can be green with every source step skipped.
        # Do not require a failed deployment to resume news. The publisher
        # independently verifies today's account quota and actual due clock.
        if: always() && steps.diagnose.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/five-minute-original-news-fastlane.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "SOURCE_RESET_WAKEUP_DISPATCHED; publication/readback not yet asserted."
