name: GRI Pinned Historical Version Recovery
# Owner-authorized B2 read-only recovery + one existing D1 historical-ring insert.
# No cron, B2 mutation, current hot promotion or source-clock refresh.
on:
  # One retry per UTC day, after the account-wide B2 quota rolls over.
  # The preflight does not reserve B2 tickets or read provider data.
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/ops/recover-gri-pinned-b2-version.mjs"
      - "scripts/ops/restore-gri-verified-version-to-d1.mjs"
      - "scripts/ops/preflight-gri-historical-shared-quota.mjs"
      - "scripts/ops/preflight-gri-historical-existing-d1.mjs"
      - "scripts/ops/preflight-phase2-reviewed-history.mjs"
      - ".github/workflows/gri-pinned-version-recovery.yml"
  pull_request:
    paths:
      - "scripts/ops/recover-gri-pinned-b2-version.mjs"
      - "scripts/ops/restore-gri-verified-version-to-d1.mjs"
      - "src/__tests__/gri-pinned-version-recovery.test.ts"
      - "src/__tests__/gri-verified-version-d1-restore.test.ts"
      - "scripts/ops/preflight-gri-historical-shared-quota.mjs"
      - "src/__tests__/gri-historical-quota-aware-recovery.test.ts"
      - "src/__tests__/gri-historical-d1-idempotent-before-b2.test.ts"
      - "scripts/ops/preflight-phase2-reviewed-history.mjs"
      - "src/__tests__/gri-phase2-reviewed-history.test.ts"
      - ".github/workflows/gri-pinned-version-recovery.yml"
permissions:
  contents: read
concurrency:
  group: geomacro-gri-b2-historical-readback
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx vitest run src/__tests__/gri-pinned-version-recovery.test.ts src/__tests__/gri-b2-historical-live-readback.test.ts src/__tests__/gri-verified-version-d1-restore.test.ts src/__tests__/gri-historical-quota-aware-recovery.test.ts src/__tests__/gri-historical-d1-idempotent-before-b2.test.ts src/__tests__/gri-phase2-reviewed-history.test.ts
  pinned-original-version:
    needs: contract
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      EXPECTED_CANONICAL_MAIN_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      B2_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: historical_gri_version_recovery
      B2_REQUEST_BUDGET: "4"
      GEOMACRO_GRI_RESTORE_WEBSITE_HISTORY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Fail closed on nonmatching protected main or funds/Supabase config
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "blocknine0/geomacro"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$EXPECTED_CANONICAL_MAIN_SHA" = "$(git rev-parse HEAD)" || {
            echo "::error::GRI_HISTORY_SOURCE_SHA_NOT_MAIN"; exit 2;
          }
          test "$B2_ACCOUNT_QUOTA_REQUIRED" = "1"
          test "$B2_ACCOUNT_QUOTA_WORKFLOW_ID" = "historical_gri_version_recovery"
          test "$B2_REQUEST_BUDGET" = "4"
          for key in SUPABASE_URL SUPABASE_DB_URL APP_SUPABASE_URL APP_SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY APP_SUPABASE_SERVICE_ROLE_KEY COINBASE_API_KEY COINBASE_X402_MAINNET_ACK GEOMACRO_COMMERCIAL_LAUNCH_ACK; do
            test -z "$(printenv "$key" || true)" || {
              echo "::error::GRI_HISTORY_NO_FUNDS_AND_NO_SUPABASE_REQUIRED"; exit 2;
            }
          done
      - name: Resolve the existing D1 account-wide quota ledger
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/.test(account??'')||!token)throw Error('GRI_VERSION_D1_CONFIG_REQUIRED');
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?per_page=100',{
            headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('GRI_VERSION_D1_DISCOVERY_UNAVAILABLE');
          const d=await r.json();const rows=d.success===true&&Array.isArray(d.result)?d.result.filter(x=>x.name==='geomacro-control-plane'):[];
          if(rows.length!==1||!/^[a-f0-9-]{36}$/.test(rows[0].uuid??''))throw Error('GRI_VERSION_D1_LEDGER_REQUIRED');
          appendFileSync(process.env.GITHUB_ENV,'D1_DATABASE_ID='+rows[0].uuid+'\n');
          JS
      - name: Check whether the exact D1-pinned historical proof is already recorded
        id: gri_history_existing
        run: node scripts/ops/preflight-gri-historical-existing-d1.mjs
      - name: Avoid replaying an already recorded historical B2 version
        if: steps.gri_history_existing.outputs.already_restored == 'true'
        run: |
          echo "::notice::GRI_HISTORY_PINNED_D1_ALREADY_RESTORED_NO_B2_REPLAY"
          echo "Exact prior D1 historical anchor recorded; B2 re-read not attempted. No current signed GRI claim." >> "$GITHUB_STEP_SUMMARY"
      - name: Preflight authenticated D1 account-wide B2 quota without using any B2 ticket
        if: steps.gri_history_existing.outputs.already_restored != 'true'
        id: gri_history_quota
        run: node scripts/ops/preflight-gri-historical-shared-quota.mjs
      - name: Disclose quota-held historical recovery without claiming restored lineage
        if: steps.gri_history_existing.outputs.already_restored != 'true' && steps.gri_history_quota.outputs.ready != 'true'
        run: |
          echo "::notice::GRI_HISTORY_SHARED_QUOTA_HELD_NO_RESTORE"
          echo "GRI historical B2 immutable version was NOT read. No current product was promoted." >> "$GITHUB_STEP_SUMMARY"
      - name: Restore the exact pinned original to D1 history and independently verify the historical website view
        if: steps.gri_history_existing.outputs.already_restored != 'true' && steps.gri_history_quota.outputs.ready == 'true'
        run: node scripts/ops/restore-gri-verified-version-to-d1.mjs
      - name: Preserve only sanitized historical readback metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gri-pinned-version-readback-${{ github.run_id }}
          path: artifacts/gri-b2-history/historical-d1-restore.json
          if-no-files-found: warn
          retention-days: 14

  phase2-readonly-review-and-history:
    needs: contract
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: production
    permissions:
      contents: read
    env:
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: historical_gri_version_recovery
      GEOMACRO_GRI_RESTORE_WEBSITE_HISTORY: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GRI_READY_REVIEWED_SHA256: ${{ vars.GRI_READY_REVIEWED_SHA256 }}
      GRI_READY_CERTIFICATES_SHA256: ${{ vars.GRI_READY_CERTIFICATES_SHA256 }}
      GRI_READY_APPROVED_AT: ${{ vars.GRI_READY_APPROVED_AT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Require exact protected main and no payment or Supabase
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          for key in SUPABASE_URL SUPABASE_DB_URL APP_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY COINBASE_API_KEY COINBASE_X402_MAINNET_ACK GEOMACRO_COMMERCIAL_LAUNCH_ACK; do
            test -z "${!key:-}" || { echo "::error::PHASE2_NO_FUNDS_SUPABASE"; exit 2; }
          done
      - name: Resolve existing Cloudflare D1 database for metadata-only SELECT
        shell: bash
        run: |
          set -euo pipefail
          json="$(npx -y wrangler@4.136.3 d1 list --json)"
          id="$(printf '%s' "$json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const a=JSON.parse(s).filter(x=>x.name==="geomacro-control-plane");if(a.length!==1)process.exit(2);process.stdout.write(a[0].uuid??a[0].id??"")})')"
          test -n "$id"
          echo "D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
      - name: Phase2 historical multi-snapshot and signed approval read-only admission
        run: node scripts/ops/preflight-phase2-reviewed-history.mjs
