name: Direct Publisher Structured Intelligence (no funds)
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/direct-publisher-intelligence-acceptance.yml'
      - 'scripts/ops/verify-direct-publisher-intelligence.ts'
      - 'scripts/ops/verify-direct-canada-day-observation.ts'
      - 'scripts/ops/verify-country-macro-production-readback.mjs'
      - 'scripts/ops/verify-country-macro-production-readback.test.mjs'
      - 'src/lib/live-structured-on-demand.server.ts'
      - 'src/lib/ask-on-demand-original.server.ts'
      - 'src/lib/direct-publisher-intelligence.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-publisher-intelligence-acceptance.yml'
      - 'scripts/ops/verify-direct-publisher-intelligence.ts'
      - 'scripts/ops/verify-direct-canada-day-observation.ts'
      - 'scripts/ops/verify-country-macro-production-readback.mjs'
      - 'scripts/ops/verify-country-macro-production-readback.test.mjs'
      - 'src/lib/live-structured-on-demand.server.ts'
      - 'src/lib/ask-on-demand-original.server.ts'
permissions:
  contents: read
concurrency:
  group: geomacro-direct-publisher-real-acceptance
  cancel-in-progress: false
jobs:
  actual-publisher-derived-output:
    if: github.repository == 'blocknine0/geomacro' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'blocknine0/geomacro')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Offline routing and output checks
        run: bun x vitest run src/lib/direct-publisher-intelligence.test.ts src/lib/live-structured-on-demand.server.test.ts src/lib/ask-on-demand-original.test.ts src/lib/on-demand-nrcan-day-only-rescue.test.ts src/lib/live-structured-deep-health.server.test.ts
      - name: Verify real outside-in annual country acceptance contract offline
        run: |
          node --check scripts/ops/verify-country-macro-production-readback.mjs
          node --test scripts/ops/verify-country-macro-production-readback.test.mjs
      - name: Read actual originals and generate own structured observations
        run: bun scripts/ops/verify-direct-publisher-intelligence.ts
      - name: Verify actual Canada calendar-day observation without inventing time
        run: bun scripts/ops/verify-direct-canada-day-observation.ts
      - name: Save sanitized proof only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: direct-publisher-structured-receipt
          path: |
            artifacts/direct-publisher-intelligence-receipt.json
            artifacts/direct-canada-day-observation-receipt.json
          if-no-files-found: error
          retention-days: 3

  actual-production-country-macro:
    # Outside-in means an actual geomacro.live POST; passes only when native
    # numerical observations are served. Do not conflate green PR tests with
    # an actual deployed site. PRs do not query/charge production.
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify actually deployed annual Macro API for India and USA
        run: node scripts/ops/verify-country-macro-production-readback.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: actual-live-country-macro-readback-${{ github.run_id }}
          path: artifacts/live-country-macro/production-readback.json
          retention-days: 3
          if-no-files-found: warn
