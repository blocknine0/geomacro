name: Validate country flash intelligence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "workers/telegram-flash/**"
      - "scripts/ingest-reliefweb-live.mjs"
      - "scripts/corroborate-live-flashes.mjs"
      - "supabase/functions/live-flash-ingest/**"
      - "supabase/functions/live-flash-corroborate/**"
      - "supabase/migrations/036_country_flash_intelligence.sql"
      - "supabase/migrations/037_breaking_news_source_registry.sql"
      - "supabase/migrations/038_telegram_flash_channel_registry.sql"
      - "supabase/migrations/039_flash_corroboration_graph.sql"
      - "supabase/migrations/040_critical_minerals_news_candidates.sql"
      - "supabase/migrations/041_country_flash_live_smoke_hardening.sql"
      - "supabase/migrations/955_realtime_event_family_lifecycle.sql"
      - "supabase/migrations/956_event_family_version_ledger.sql"
      - "supabase/isolated-signal/**"
      - "supabase/migrations/946_telegram_manual_review_gate.sql"
      - "src/__tests__/telegram-raw-signal-manual-review.test.ts"
      - "src/__tests__/telegram-signal-supabase-isolation.test.ts"
      - ".github/workflows/country-flash-validation.yml"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            workers/telegram-flash/worker.py \
            workers/telegram-flash/production_entrypoint.py \
            workers/telegram-flash/corroboration_loop.py \
            workers/telegram-flash/supervisor.py \
            workers/telegram-flash/generate_session.py

      - name: Validate Node scripts syntax
        run: |
          node --check scripts/ingest-reliefweb-live.mjs
          node --check scripts/corroborate-live-flashes.mjs

      - name: Set up Deno 2.9.6
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Validate Supabase Edge Functions
        run: |
          deno check supabase/functions/live-flash-ingest/index.ts
          deno check supabase/functions/live-flash-corroborate/index.ts

      - name: Confirm migration ordering
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/036_country_flash_intelligence.sql
          test -f supabase/migrations/037_breaking_news_source_registry.sql
          test -f supabase/migrations/038_telegram_flash_channel_registry.sql
          test -f supabase/migrations/039_flash_corroboration_graph.sql
          test -f supabase/migrations/040_critical_minerals_news_candidates.sql
          test -f supabase/migrations/041_country_flash_live_smoke_hardening.sql
          test -f supabase/migrations/946_telegram_manual_review_gate.sql
                                        
      - name: Verify Telegram manual-review contract
        run: bunx vitest run src/__tests__/telegram-raw-signal-manual-review.test.ts

      - name: Verify Telegram realtime lifecycle contract
        run: bunx vitest run src/__tests__/telegram-signal-supabase-isolation.test.ts
