name: Production Canary Cohort Acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact canonical main SHA shared by all three provider canaries"
        required: true
        type: string
      coinbase_run_id:
        description: "Successful Production Provider Canary run ID for Coinbase"
        required: true
        type: string
      circle_run_id:
        description: "Successful Production Provider Canary run ID for Circle"
        required: true
        type: string
      nevermined_run_id:
        description: "Successful Production Provider Canary run ID for Nevermined"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-canary-cohort-acceptance
  cancel-in-progress: false

jobs:
  verify-cohort:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Require exact current main SHA and numeric source runs
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          COINBASE_RUN: ${{ inputs.coinbase_run_id }}
          CIRCLE_RUN: ${{ inputs.circle_run_id }}
          NEVERMINED_RUN: ${{ inputs.nevermined_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Full candidate SHA required."; exit 1; }
          [[ "${CANDIDATE_SHA,,}" == "${DISPATCH_SHA,,}" ]] || { echo "::error::Cohort candidate must equal workflow dispatch SHA."; exit 1; }
          for run in "$COINBASE_RUN" "$CIRCLE_RUN" "$NEVERMINED_RUN"; do
            [[ "$run" =~ ^[0-9]+$ ]] || { echo "::error::All provider run IDs must be numeric."; exit 1; }
          done
          [[ "$COINBASE_RUN" != "$CIRCLE_RUN" && "$COINBASE_RUN" != "$NEVERMINED_RUN" && "$CIRCLE_RUN" != "$NEVERMINED_RUN" ]] || {
            echo "::error::Each provider must have its own canary run."; exit 1;
          }

      - name: Verify all three provider workflow runs are successful and same-SHA
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          COINBASE_RUN: ${{ inputs.coinbase_run_id }}
          CIRCLE_RUN: ${{ inputs.circle_run_id }}
          NEVERMINED_RUN: ${{ inputs.nevermined_run_id }}
        with:
          script: |
            const expected = String(process.env.EXPECTED_SHA).toLowerCase();
            const entries = [
              ['coinbase', Number(process.env.COINBASE_RUN)],
              ['circle', Number(process.env.CIRCLE_RUN)],
              ['nevermined', Number(process.env.NEVERMINED_RUN)],
            ];
            const { owner, repo } = context.repo;
            for (const [provider, runId] of entries) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              if (run.path !== '.github/workflows/production-provider-canary.yml') core.setFailed(`${provider}: wrong workflow path`);
              if (run.event !== 'workflow_dispatch' || run.head_branch !== 'main') core.setFailed(`${provider}: canary must be a manual main run`);
              if (String(run.head_sha || '').toLowerCase() !== expected) core.setFailed(`${provider}: canary SHA mismatch`);
              if (run.status !== 'completed' || run.conclusion !== 'success') core.setFailed(`${provider}: canary run is not successful`);
            }

      - name: Download Coinbase sanitized evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.coinbase_run_id }}
          path: /tmp/cohort/coinbase

      - name: Download Circle sanitized evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.circle_run_id }}
          path: /tmp/cohort/circle

      - name: Download Nevermined sanitized evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.nevermined_run_id }}
          path: /tmp/cohort/nevermined

      - name: Resolve exact sanitized canary and reconciliation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cohort/resolved
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            const out = [];
            for (const item of fs.readdirSync(dir, { withFileTypes:true })) {
              const p = path.join(dir, item.name);
              if (item.isDirectory()) out.push(...walk(p));
              else if (item.isFile() && item.name.endsWith('.json')) out.push(p);
            }
            return out;
          }

          for (const provider of ['coinbase','circle','nevermined']) {
            const files = walk('/tmp/cohort/' + provider);
            const parsed = files.map(file => ({ file, value: JSON.parse(fs.readFileSync(file,'utf8')) }));
            const canaries = parsed.filter(x => x.value?.schema_version === 'geomacro.production-provider-canary.v1');
            const reconciliations = parsed.filter(x => x.value?.schema_version === 'geomacro.production-payment-reconciliation.v1');
            if (canaries.length !== 1) throw new Error(`${provider}: expected exactly one sanitized canary evidence file`);
            if (reconciliations.length !== 1) throw new Error(`${provider}: expected exactly one reconciliation evidence file`);
            fs.copyFileSync(canaries[0].file, `/tmp/cohort/resolved/${provider}-canary.json`);
            fs.copyFileSync(reconciliations[0].file, `/tmp/cohort/resolved/${provider}-reconciliation.json`);
          }
          NODE

      - name: Verify exact-SHA three-provider cohort and non-revenue classification
        env:
          GEOMACRO_PRODUCTION_ACCEPTANCE_SHA: ${{ inputs.candidate_sha }}
          GEOMACRO_COINBASE_CANARY_EVIDENCE: /tmp/cohort/resolved/coinbase-canary.json
          GEOMACRO_COINBASE_RECONCILIATION_EVIDENCE: /tmp/cohort/resolved/coinbase-reconciliation.json
          GEOMACRO_CIRCLE_CANARY_EVIDENCE: /tmp/cohort/resolved/circle-canary.json
          GEOMACRO_CIRCLE_RECONCILIATION_EVIDENCE: /tmp/cohort/resolved/circle-reconciliation.json
          GEOMACRO_NEVERMINED_CANARY_EVIDENCE: /tmp/cohort/resolved/nevermined-canary.json
          GEOMACRO_NEVERMINED_RECONCILIATION_EVIDENCE: /tmp/cohort/resolved/nevermined-reconciliation.json
          GEOMACRO_PRODUCTION_CANARY_ACCEPTANCE_OUTPUT: /tmp/cohort/initial-cohort-acceptance.json
        run: node scripts/commerce/verify-production-provider-canaries.mjs

      - name: Upload sanitized cohort acceptance only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-canary-cohort-acceptance-${{ github.run_id }}
          path: /tmp/cohort/initial-cohort-acceptance.json
          if-no-files-found: error
          retention-days: 14
