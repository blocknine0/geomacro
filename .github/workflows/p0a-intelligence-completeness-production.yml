name: P0-A Permanent Three-Category Intelligence Completeness Acceptance
# Permanent production read-only audit, not a synthetic CI pass. No B2 calls,
# new provider, payment operation, source mutation or PREDGE touch.
on:
  pull_request:
    paths:
      - "scripts/lib/p0a-evidence-quality.mjs"
      - "scripts/lib/p0b-event-grounded-projection.mjs"
      - "scripts/lib/p0b-live-global-search.mjs"
      - "scripts/tests/p0b-live-global-search.test.mjs"
      - "scripts/tests/p0a-evidence-quality.test.mjs"
      - "scripts/ops/p0a-intelligence-completeness-production.mjs"
      - ".github/workflows/p0a-intelligence-completeness-production.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/p0a-evidence-quality.mjs"
      - "scripts/lib/p0b-event-grounded-projection.mjs"
      - "scripts/lib/p0b-live-global-search.mjs"
      - "scripts/tests/p0b-live-global-search.test.mjs"
      - "scripts/tests/p0a-evidence-quality.test.mjs"
      - "scripts/ops/p0a-intelligence-completeness-production.mjs"
      - ".github/workflows/p0a-intelligence-completeness-production.yml"
  schedule:
    - cron: "27 1,7,13,19 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: geomacro-p0a-evidence-read-only
  cancel-in-progress: false
jobs:
  quality-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: |
          node --check scripts/lib/p0a-evidence-quality.mjs
          node --check scripts/ops/p0a-intelligence-completeness-production.mjs
          node --check scripts/lib/p0b-live-global-search.mjs
          node --check scripts/lib/p0b-event-grounded-projection.mjs
          node --check workers/control-plane/src/phase2h-private-raw-news.mjs
          node --test scripts/tests/p0a-evidence-quality.test.mjs scripts/tests/p0b-live-global-search.test.mjs scripts/tests/phase2h-country-archived-question.test.mjs
  independent-live-acceptance:
    needs: quality-contract
    if: github.ref == 'refs/heads/main' && github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Read actual canonical D1, reject unsourced analysis and compare deployed authenticated five-part JSON
        run: node scripts/ops/p0a-intelligence-completeness-production.mjs
      - name: Preserve private-data-free category acceptance metrics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p0a-intelligence-real-production-${{ github.run_id }}
          path: artifacts/derived-news/p0a-production-intelligence-completeness.json
          if-no-files-found: warn
          retention-days: 30
