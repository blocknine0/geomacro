name: Cleanup Obsolete Failed Action Runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete-failed-runs.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-obsolete-failed-action-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete only obsolete or superseded failed runs
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // The GOAT 20-window acceptance program is still intentionally
            // accumulating evidence. Never prune it until that program is done.
            const protectedPaths = new Set([
              '.github/workflows/goat-acceptance-windows.yml',
            ]);

            const [failedRuns, queuedRuns, activeRuns] = await Promise.all([
              github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status: 'failure', per_page: 100 },
              ),
              github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status: 'queued', per_page: 100 },
              ),
              github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status: 'in_progress', per_page: 100 },
              ),
            ]);

            // If a workflow is currently running in the background, leave all
            // of its history alone. This avoids cleaning evidence while a new
            // result is still being produced.
            const activeWorkflowIds = new Set(
              [...queuedRuns, ...activeRuns].map((run) => run.workflow_id),
            );

            const latestMainCache = new Map();
            async function latestMainRuns(workflowId) {
              if (latestMainCache.has(workflowId)) {
                return latestMainCache.get(workflowId);
              }
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'main',
                per_page: 25,
              });
              const runs = response.data.workflow_runs || [];
              latestMainCache.set(workflowId, runs);
              return runs;
            }

            const deletable = [];
            const preserved = {
              active: 0,
              protected: 0,
              unresolvedMain: 0,
              currentFailure: 0,
            };
            const preservedGroups = {
              active: new Map(),
              protected: new Map(),
              unresolvedMain: new Map(),
              currentFailure: new Map(),
            };

            function remember(group, run, note = '') {
              const key = String(run.workflow_id);
              const existing = preservedGroups[group].get(key) || {
                workflow_id: run.workflow_id,
                name: run.name,
                path: run.path,
                count: 0,
                newest_run_id: run.id,
                newest_created_at: run.created_at,
                note,
              };
              existing.count += 1;
              if (new Date(run.created_at).getTime() > new Date(existing.newest_created_at).getTime()) {
                existing.newest_run_id = run.id;
                existing.newest_created_at = run.created_at;
              }
              if (note) existing.note = note;
              preservedGroups[group].set(key, existing);
            }

            for (const run of failedRuns) {
              if (activeWorkflowIds.has(run.workflow_id)) {
                preserved.active += 1;
                remember('active', run, 'workflow currently queued/in_progress');
                continue;
              }

              if (protectedPaths.has(run.path)) {
                preserved.protected += 1;
                remember('protected', run, 'ongoing GOAT acceptance evidence');
                continue;
              }

              // Closed/obsolete feature-branch failures are disposable once
              // no run from that workflow is currently active.
              if (run.head_branch && run.head_branch !== 'main') {
                deletable.push(run);
                continue;
              }

              if (run.head_branch !== 'main') {
                preserved.currentFailure += 1;
                remember('currentFailure', run, 'failure is not attributable to canonical main');
                continue;
              }

              const mainRuns = await latestMainRuns(run.workflow_id);
              const latest = mainRuns[0];
              if (!latest || latest.status !== 'completed') {
                preserved.active += 1;
                remember('active', run, 'latest main run is not completed');
                continue;
              }

              const laterSuccess = mainRuns.find(
                (candidate) =>
                  candidate.status === 'completed' &&
                  candidate.conclusion === 'success' &&
                  new Date(candidate.created_at).getTime() > new Date(run.created_at).getTime(),
              );

              if (laterSuccess) {
                // A later canonical-main success proves this older failure is
                // superseded. It can be removed without hiding an unresolved
                // current regression.
                deletable.push(run);
              } else if (latest.id === run.id) {
                preserved.currentFailure += 1;
                remember('currentFailure', run, `latest main run is still ${latest.conclusion}`);
              } else {
                preserved.unresolvedMain += 1;
                remember('unresolvedMain', run, `no later successful main run in latest ${mainRuns.length} runs`);
              }
            }

            let deleted = 0;
            const errors = [];
            for (const run of deletable) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted += 1;
              } catch (error) {
                errors.push({ id: run.id, name: run.name, message: error.message });
                core.warning(`Could not delete run ${run.id} (${run.name}): ${error.message}`);
              }
            }

            function emitGroup(label, map) {
              const rows = [...map.values()].sort((a, b) => b.count - a.count);
              core.info(`PRESERVED_GROUP ${label}: ${rows.length} workflow(s)`);
              for (const row of rows) {
                core.info(
                  `PRESERVED ${label} | workflow_id=${row.workflow_id} | count=${row.count} | name=${row.name} | path=${row.path} | newest_run=${row.newest_run_id} | newest_at=${row.newest_created_at} | note=${row.note}`,
                );
              }
              return rows;
            }

            const activeRows = emitGroup('active', preservedGroups.active);
            const protectedRows = emitGroup('protected', preservedGroups.protected);
            const unresolvedRows = emitGroup('unresolvedMain', preservedGroups.unresolvedMain);
            const currentRows = emitGroup('currentFailure', preservedGroups.currentFailure);

            const markdownRows = [
              ...activeRows.map((row) => ['active', row]),
              ...protectedRows.map((row) => ['protected', row]),
              ...unresolvedRows.map((row) => ['unresolved main', row]),
              ...currentRows.map((row) => ['current failure', row]),
            ];

            core.summary
              .addHeading('Obsolete failed Action run cleanup')
              .addRaw(`Failed runs scanned: ${failedRuns.length}\n\n`)
              .addRaw(`Deleted obsolete/superseded failures: ${deleted}\n\n`)
              .addRaw(`Preserved because workflow is active: ${preserved.active}\n\n`)
              .addRaw(`Preserved protected acceptance evidence: ${preserved.protected}\n\n`)
              .addRaw(`Preserved unresolved main failures: ${preserved.unresolvedMain}\n\n`)
              .addRaw(`Preserved latest current failures: ${preserved.currentFailure}\n\n`)
              .addRaw(`Delete errors: ${errors.length}\n\n`)
              .addHeading('Preserved workflow groups', 2)
              .addTable([
                [
                  { data: 'Reason', header: true },
                  { data: 'Workflow', header: true },
                  { data: 'Path', header: true },
                  { data: 'Failures', header: true },
                  { data: 'Newest run', header: true },
                ],
                ...markdownRows.map(([reason, row]) => [
                  reason,
                  row.name,
                  row.path || '—',
                  String(row.count),
                  String(row.newest_run_id),
                ]),
              ])
              .write();

            if (errors.length) {
              core.setFailed(`${errors.length} obsolete failed run(s) could not be deleted.`);
            }
