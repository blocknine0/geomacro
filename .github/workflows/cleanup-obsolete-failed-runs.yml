name: Cleanup Obsolete Failed Action Runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete-failed-runs.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-obsolete-failed-action-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete only obsolete or superseded failed runs
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Ongoing GOAT acceptance/payment work is explicitly out of scope
            // until its evidence program is complete.
            const isProtectedOngoing = (run) =>
              String(run.path || '').startsWith('.github/workflows/goat-');

            // These one-shot/v1 workflows have canonical successors and are
            // retired from main. Their old red runs are historical noise, not
            // unresolved current failures.
            const retiredPaths = new Set([
              '.github/workflows/bootstrap-global-country-readiness-production.yml',
              '.github/workflows/dan-commercial-readiness.yml',
            ]);

            // Both AgentArena V2 workflows are now manual verify-only entries.
            // Old push-triggered failures were produced by superseded workflow
            // definitions and can never occur under the current trigger contract.
            const isSupersededTriggerFailure = (run) =>
              run.event === 'push' && new Set([
                '.github/workflows/execute-v2-upgrade.yml',
                '.github/workflows/deploy-v2-implementation.yml',
              ]).has(run.path);

            const [failedRuns, queuedRuns, activeRuns] = await Promise.all([
              github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status: 'failure', per_page: 100 },
              ),
              github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status: 'queued', per_page: 100 },
              ),
              github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status: 'in_progress', per_page: 100 },
              ),
            ]);

            // User-requested boundary: if a workflow is currently running in
            // the background, leave every one of its failed runs untouched.
            const activeWorkflowIds = new Set(
              [...queuedRuns, ...activeRuns].map((run) => run.workflow_id),
            );

            const latestMainCache = new Map();
            async function latestMainRuns(workflowId) {
              if (latestMainCache.has(workflowId)) return latestMainCache.get(workflowId);
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'main',
                per_page: 25,
              });
              const runs = response.data.workflow_runs || [];
              latestMainCache.set(workflowId, runs);
              return runs;
            }

            const deletable = [];
            const preservedGroups = {
              active: new Map(),
              protected: new Map(),
              unresolvedMain: new Map(),
              currentFailure: new Map(),
            };

            function remember(group, run, note) {
              const key = String(run.workflow_id);
              const row = preservedGroups[group].get(key) || {
                workflow_id: run.workflow_id,
                name: run.name,
                path: run.path,
                count: 0,
                newest_run_id: run.id,
                newest_created_at: run.created_at,
                note,
              };
              row.count += 1;
              if (new Date(run.created_at) > new Date(row.newest_created_at)) {
                row.newest_run_id = run.id;
                row.newest_created_at = run.created_at;
              }
              row.note = note;
              preservedGroups[group].set(key, row);
            }

            for (const run of failedRuns) {
              if (activeWorkflowIds.has(run.workflow_id)) {
                remember('active', run, 'workflow currently queued/in_progress');
                continue;
              }

              if (isProtectedOngoing(run)) {
                remember('protected', run, 'ongoing GOAT evidence/payment program');
                continue;
              }

              if (retiredPaths.has(run.path) || isSupersededTriggerFailure(run)) {
                deletable.push(run);
                continue;
              }

              if (run.head_branch && run.head_branch !== 'main') {
                deletable.push(run);
                continue;
              }

              if (run.head_branch !== 'main') {
                remember('currentFailure', run, 'failure is not attributable to canonical main');
                continue;
              }

              const mainRuns = await latestMainRuns(run.workflow_id);
              const latest = mainRuns[0];
              if (!latest || latest.status !== 'completed') {
                remember('active', run, 'latest main run is not completed');
                continue;
              }

              const laterSuccess = mainRuns.find(
                (candidate) =>
                  candidate.status === 'completed' &&
                  candidate.conclusion === 'success' &&
                  new Date(candidate.created_at) > new Date(run.created_at),
              );

              if (laterSuccess) {
                deletable.push(run);
              } else if (latest.id === run.id) {
                remember('currentFailure', run, `latest main run is still ${latest.conclusion}`);
              } else {
                remember(
                  'unresolvedMain',
                  run,
                  `no later successful main run in latest ${mainRuns.length} runs`,
                );
              }
            }

            let deleted = 0;
            const errors = [];
            for (const run of deletable) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deleted += 1;
              } catch (error) {
                errors.push({ id: run.id, name: run.name, message: error.message });
                core.warning(`Could not delete run ${run.id} (${run.name}): ${error.message}`);
              }
            }

            function rowsFor(label, map) {
              const rows = [...map.values()].sort((a, b) => b.count - a.count);
              core.info(`PRESERVED_GROUP ${label}: ${rows.length} workflow(s)`);
              for (const row of rows) {
                core.info(
                  `PRESERVED ${label} | workflow_id=${row.workflow_id} | count=${row.count} | name=${row.name} | path=${row.path} | newest_run=${row.newest_run_id} | newest_at=${row.newest_created_at} | note=${row.note}`,
                );
              }
              return rows;
            }

            const activeRows = rowsFor('active', preservedGroups.active);
            const protectedRows = rowsFor('protected', preservedGroups.protected);
            const unresolvedRows = rowsFor('unresolvedMain', preservedGroups.unresolvedMain);
            const currentRows = rowsFor('currentFailure', preservedGroups.currentFailure);

            core.summary
              .addHeading('Obsolete failed Action run cleanup')
              .addRaw(`Failed runs scanned: ${failedRuns.length}\n\n`)
              .addRaw(`Deleted obsolete/superseded failures: ${deleted}\n\n`)
              .addRaw(`Preserved active workflow failures: ${activeRows.reduce((n, r) => n + r.count, 0)}\n\n`)
              .addRaw(`Preserved ongoing GOAT failures: ${protectedRows.reduce((n, r) => n + r.count, 0)}\n\n`)
              .addRaw(`Preserved unresolved main failures: ${unresolvedRows.reduce((n, r) => n + r.count, 0)}\n\n`)
              .addRaw(`Preserved current failures: ${currentRows.reduce((n, r) => n + r.count, 0)}\n\n`)
              .addRaw(`Delete errors: ${errors.length}\n\n`)
              .addHeading('Preserved workflow groups', 2)
              .addTable([
                [
                  { data: 'Reason', header: true },
                  { data: 'Workflow', header: true },
                  { data: 'Path', header: true },
                  { data: 'Failures', header: true },
                  { data: 'Newest run', header: true },
                ],
                ...[
                  ...activeRows.map((row) => ['active', row]),
                  ...protectedRows.map((row) => ['protected', row]),
                  ...unresolvedRows.map((row) => ['unresolved main', row]),
                  ...currentRows.map((row) => ['current failure', row]),
                ].map(([reason, row]) => [
                  reason,
                  row.name,
                  row.path || '—',
                  String(row.count),
                  String(row.newest_run_id),
                ]),
              ])
              .write();

            if (errors.length) {
              core.setFailed(`${errors.length} obsolete failed run(s) could not be deleted.`);
            }
