name: Unified Commercial and Federico Launch Guard 1827

on:
  issues:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-1827-closure-guard
  cancel-in-progress: false

jobs:
  enforce-master-acceptance:
    if: ${{ github.repository == 'blocknine0/geomacro' && (github.event_name != 'issues' || github.event.issue.number == 1827) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical guard logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Reopen incomplete master tracker if required
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/enforce-issue-1414-closure.mjs
