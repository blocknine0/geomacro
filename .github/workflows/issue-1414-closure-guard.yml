name: Issue 1414 Closure Guard

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  enforce-master-acceptance:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.event.issue.number == 1414 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical guard logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Reopen incomplete master tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/enforce-issue-1414-closure.mjs
