name: P0-B Permanent Source-First Global Research Production Acceptance
# No funds; exact deployed canonical main, source-first real responses only.
on:
  # A main push can run acceptance BEFORE the Worker deployment completes.
  # Re-verify when its actual deploy run completes, even if a later unrelated
  # deployment smoke step fails; the deployed SHA check remains authoritative.
  workflow_run:
    workflows: ["Deploy D1 Control Plane"]
    types: [completed]
  pull_request:
    paths:
      - "scripts/lib/p0b-event-grounded-projection.mjs"
      - "scripts/lib/p0b-live-global-search.mjs"
      - "scripts/lib/p0b-first-party-rss.mjs"
      - "scripts/lib/p0b-reliefweb-ukraine.mjs"
      - "scripts/tests/p0b-first-party-rss.test.mjs"
      - "scripts/tests/p0b-reliefweb-ukraine.test.mjs"
      - "scripts/tests/p0b-live-global-search.test.mjs"
      - "scripts/ops/p0b-source-first-production-acceptance.mjs"
      - "scripts/ops/p0b-publish-acceptance-receipt.mjs"
      - "workers/control-plane/src/phase2h-private-raw-news.mjs"
      - "workers/control-plane/wrangler.example.jsonc"
      - ".github/workflows/p0b-source-first-production-acceptance.yml"
      - "scripts/ops/verify-actual-d1-deploy-receipt.mjs"
      - "scripts/tests/verify-actual-d1-deploy-receipt.test.mjs"
  push:
    branches: [main]
    paths:
      - "scripts/lib/p0b-event-grounded-projection.mjs"
      - "scripts/lib/p0b-live-global-search.mjs"
      - "scripts/lib/p0b-first-party-rss.mjs"
      - "scripts/lib/p0b-reliefweb-ukraine.mjs"
      - "scripts/tests/p0b-first-party-rss.test.mjs"
      - "scripts/tests/p0b-reliefweb-ukraine.test.mjs"
      - "scripts/tests/p0b-live-global-search.test.mjs"
      - "scripts/ops/p0b-source-first-production-acceptance.mjs"
      - "scripts/ops/p0b-publish-acceptance-receipt.mjs"
      - "workers/control-plane/src/phase2h-private-raw-news.mjs"
      - "workers/control-plane/wrangler.example.jsonc"
      - ".github/workflows/p0b-source-first-production-acceptance.yml"
      - "scripts/ops/verify-actual-d1-deploy-receipt.mjs"
      - "scripts/tests/verify-actual-d1-deploy-receipt.test.mjs"
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: geomacro-p0b-production-source-first
  cancel-in-progress: false
jobs:
  deploy_receipt:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      actual_deploy: ${{ steps.confirm.outputs.actual_deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify source-first acceptance follows an actual Worker deploy
        id: confirm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ops/verify-actual-d1-deploy-receipt.mjs

  source-first-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Prove grounded events and immutable original boundary
        run: |
          node --check scripts/lib/p0b-event-grounded-projection.mjs
          node --check scripts/lib/p0b-live-global-search.mjs
          node --check scripts/lib/p0b-first-party-rss.mjs
          node --check scripts/lib/p0b-reliefweb-ukraine.mjs
          node --check scripts/ops/p0b-source-first-production-acceptance.mjs
          node --check scripts/ops/p0b-publish-acceptance-receipt.mjs
          node --check workers/control-plane/src/phase2h-private-raw-news.mjs
          node --test scripts/tests/p0b-reliefweb-ukraine.test.mjs scripts/tests/p0b-live-global-search.test.mjs scripts/tests/p0b-first-party-rss.test.mjs scripts/tests/p0a-evidence-quality.test.mjs scripts/tests/phase2h-country-archived-question.test.mjs scripts/tests/verify-actual-d1-deploy-receipt.test.mjs
  independent-production:
    needs: [source-first-contract, deploy_receipt]
    if: >-
      always() &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      needs.source-first-contract.result == 'success' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        needs.deploy_receipt.result == 'success' &&
        needs.deploy_receipt.outputs.actual_deploy == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      EXPECTED_DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify deployed SHA and 3 production source-first responses
        run: node scripts/ops/p0b-source-first-production-acceptance.mjs
      - name: Publish redacted proof to P0-B tracking issue (no raw evidence)
        if: always() && github.event_name == 'workflow_run'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ops/p0b-publish-acceptance-receipt.mjs
      - name: Preserve redacted three-category real acceptance receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p0b-source-first-production-${{ github.run_id }}
          path: artifacts/derived-news/p0b-source-first-live-acceptance.json
          if-no-files-found: warn
          retention-days: 30
