name: No-card x402 facilitator read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-funds-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Policy tests, offline, no funds
        run: node --test scripts/tests/no-card-x402-facilitator-policy.test.mjs
      - name: GET-only capability probes, no credentials
        run: node scripts/ops/audit-no-card-x402-facilitators.mjs
