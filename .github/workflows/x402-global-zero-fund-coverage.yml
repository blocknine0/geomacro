name: x402 Global Zero-Fund Coverage

on:
  pull_request:
    paths:
      - "scripts/agentic/verify-live-x402-global-zero-fund-coverage.mjs"
      - ".github/workflows/x402-global-zero-fund-coverage.yml"
      - "src/__tests__/x402-global-zero-fund-coverage-static.test.ts"
  push:
    branches:
      - main
    paths:
      - "scripts/agentic/verify-live-x402-global-zero-fund-coverage.mjs"
      - ".github/workflows/x402-global-zero-fund-coverage.yml"
      - "src/__tests__/x402-global-zero-fund-coverage-static.test.ts"
      - "src/lib/agent-query-plan.ts"
      - "src/lib/agent-query-deliverability.server.ts"
      - "src/routes/api.x402.risk_.availability.ts"
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-x402-global-zero-fund-coverage
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify zero-fund coverage contract
        run: bunx vitest run src/__tests__/x402-global-zero-fund-coverage-static.test.ts

  live-production-coverage:
    needs: static-contract
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      GEOMACRO_LIVE_HOST: https://geomacro.live
      GRI_DB_MODE: direct_postgres
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require read-only census configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "${GRI_DB_MODE}" = "direct_postgres"
      - name: Verify all-country and corridor paid-product availability without funds
        run: node scripts/agentic/verify-live-x402-global-zero-fund-coverage.mjs | tee /tmp/x402-global-zero-fund.json
      - name: Record no-funds boundary
        if: always()
        run: |
          {
            echo "## x402 Global Zero-Fund Coverage"
            echo
            echo "- Real payment performed: **false**"
            echo "- Settlement attempted: **false**"
            echo "- Production activation changed: **false**"
            echo "- Canonical price expected: **0.05 USDC**"
            echo "- Country baseline: **195**"
            echo "- Corridor proof: registry census + every baseline country in live directional ring"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized coverage proof
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: x402-global-zero-fund-coverage-${{ github.run_id }}
          path: /tmp/x402-global-zero-fund.json
          if-no-files-found: error
          retention-days: 30
