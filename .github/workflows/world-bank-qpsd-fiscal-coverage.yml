name: World Bank QPSD Fiscal Coverage Proof

on:
  pull_request:
    paths:
      - "scripts/audit-world-bank-qpsd-sovereign-fiscal-coverage.mjs"
      - "scripts/audit-world-bank-ppg-debt-stock-ratio.mjs"
      - "scripts/audit-world-bank-sovereign-fiscal-path-union.mjs"
      - "src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.ts"
      - "src/__tests__/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.test.ts"
      - "docs/WORLD_BANK_QPSD_SOURCE_REVIEW.md"
      - ".github/workflows/world-bank-qpsd-fiscal-coverage.yml"
      - "docs/MULTI_SOURCE_ACTIVATION_MATRIX.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORLD_BANK_QPSD_BULK_CSV: qpsd-bulk/QPSDCSV.csv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download official QPSD bulk CSV contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qpsd-bulk qpsd-bulk-structure.txt
          mkdir -p qpsd-bulk
          curl --fail --show-error --silent --location --retry 3 \
            'https://databank.worldbank.org/data/download/QPSD_CSV.zip' \
            --output qpsd-bulk.zip
          sha256sum qpsd-bulk.zip | tee qpsd-bulk-structure.txt
          unzip -l qpsd-bulk.zip | tee -a qpsd-bulk-structure.txt
          unzip -q qpsd-bulk.zip -d qpsd-bulk
          test -s "$WORLD_BANK_QPSD_BULK_CSV"
          head -n 1 "$WORLD_BANK_QPSD_BULK_CSV" | tee -a qpsd-bulk-structure.txt
          grep -m 1 -F '"Gross PSD, General Gov., All maturities, All instruments, Nominal Value, % of GDP"' "$WORLD_BANK_QPSD_BULK_CSV" | tee -a qpsd-bulk-structure.txt
          grep -m 1 -F '"Gross PSD, Central Gov., All maturities, All instruments, Nominal Value, % of GDP"' "$WORLD_BANK_QPSD_BULK_CSV" | tee -a qpsd-bulk-structure.txt

      - name: Run live World Bank QPSD fiscal coverage audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-world-bank-qpsd-sovereign-fiscal-coverage.mjs | tee world-bank-qpsd-sovereign-fiscal-coverage.log
          grep -q 'PASS: WORLD BANK QPSD FISCAL COVERAGE AUDIT COMPLETE - NO WRITES' world-bank-qpsd-sovereign-fiscal-coverage.log

      - name: Run live World Bank PPG external-debt pressure audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-world-bank-ppg-debt-stock-ratio.mjs | tee world-bank-ppg-debt-stock-ratio.log
          grep -q 'PASS: WORLD BANK PPG EXTERNAL DEBT STOCK RATIO AUDIT COMPLETE - NO WRITES' world-bank-ppg-debt-stock-ratio.log

      - name: Measure distinct source-path country union
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-world-bank-sovereign-fiscal-path-union.mjs | tee world-bank-sovereign-fiscal-path-union.log
          grep -q 'PASS: WORLD BANK SOVEREIGN FISCAL SOURCE-PATH UNION AUDIT COMPLETE - NO WRITES' world-bank-sovereign-fiscal-path-union.log

      - name: Enforce discovery-only source and methodology boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s world-bank-qpsd-sovereign-fiscal-coverage.json
          jq -e '.writes_performed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.source.transport == "official_databank_bulk_csv"' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.source.exact_dataset_license == "CC BY 4.0"' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.discovery_only == true' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.raw_cross_source_value_pooling_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.cross_concept_peer_pooling_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.direct_production_fallback_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.activation_boundary.production_activation_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.activation_boundary.scoring_changed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.activation_boundary.country_payability_changed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.coverage_summary.production_supported_country_count_added == 0' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.series | length == 2' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.series[] | .peer_universe_eligible == true' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null

          jq -e '.writes_performed == false and .source_activation_changed == false and .scoring_changed == false and .country_payability_changed == false' world-bank-ppg-debt-stock-ratio.json >/dev/null
          jq -e '.derived_metric.semantic_boundary == "PUBLIC_AND_PUBLICLY_GUARANTEED_EXTERNAL_DEBT_STOCK_PRESSURE_NOT_TOTAL_GOVERNMENT_DEBT"' world-bank-ppg-debt-stock-ratio.json >/dev/null
          jq -e '.derived_metric.raw_cross_concept_peer_pooling_allowed == false' world-bank-ppg-debt-stock-ratio.json >/dev/null
          jq -e '.activation_boundary.production_activation_allowed == false and .activation_boundary.production_supported_country_count_added == 0' world-bank-ppg-debt-stock-ratio.json >/dev/null

          jq -e '.writes_performed == false and .scoring_changed == false and .country_payability_changed == false and .production_activation_allowed == false' world-bank-sovereign-fiscal-path-union.json >/dev/null
          jq -e '.methodology_boundary.raw_values_combined == false' world-bank-sovereign-fiscal-path-union.json >/dev/null
          jq -e '.methodology_boundary.peer_distributions_combined == false' world-bank-sovereign-fiscal-path-union.json >/dev/null
          jq -e '.methodology_boundary.semantic_concepts_treated_as_interchangeable == false' world-bank-sovereign-fiscal-path-union.json >/dev/null
          jq -e '.methodology_boundary.source_path_presence_is_not_production_support == true' world-bank-sovereign-fiscal-path-union.json >/dev/null
          jq -e '.methodology_boundary.source_path_presence_is_not_payability == true' world-bank-sovereign-fiscal-path-union.json >/dev/null
          jq -e '.activation_boundary.production_supported_country_count_added == 0' world-bank-sovereign-fiscal-path-union.json >/dev/null
          echo 'PASS: World Bank source-path audits remain no-write and cannot promote countries.'

      - name: Enforce source-specific shadow implementation boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DP.DOD.DECT.CR.GG.Z1' src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.ts
          grep -q 'DP.DOD.DECT.CR.CG.Z1' src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.ts
          grep -q 'cross_concept_pooling_allowed: false' src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.ts
          grep -q 'raw_cross_source_pooling_allowed: false' src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.ts
          grep -q 'coverage: "LIMITED"' src/lib/risk-gate-v2-world-bank-qpsd-sovereign-fiscal.ts
          grep -q 'production_activation_allowed=false' docs/WORLD_BANK_QPSD_SOURCE_REVIEW.md
          echo 'PASS: QPSD source-specific shadow methodology exists but production remains locked.'

      - name: Print source-path coverage result
        shell: bash
        run: |
          jq '{generated_at,source_path_union,methodology_boundary,activation_boundary}' world-bank-sovereign-fiscal-path-union.json

      - name: Upload World Bank source-path coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-bank-qpsd-sovereign-fiscal-coverage
          path: |
            qpsd-bulk-structure.txt
            world-bank-qpsd-sovereign-fiscal-coverage.json
            world-bank-qpsd-sovereign-fiscal-coverage.log
            world-bank-ppg-debt-stock-ratio.json
            world-bank-ppg-debt-stock-ratio.log
            world-bank-sovereign-fiscal-path-union.json
            world-bank-sovereign-fiscal-path-union.log
          if-no-files-found: warn
          retention-days: 30
