name: World Bank QPSD Fiscal Coverage Proof

on:
  pull_request:
    paths:
      - "scripts/audit-world-bank-qpsd-sovereign-fiscal-coverage.mjs"
      - ".github/workflows/world-bank-qpsd-fiscal-coverage.yml"
      - "docs/MULTI_SOURCE_ACTIVATION_MATRIX.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run live World Bank QPSD fiscal coverage audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-world-bank-qpsd-sovereign-fiscal-coverage.mjs | tee world-bank-qpsd-sovereign-fiscal-coverage.log
          grep -q 'PASS: WORLD BANK QPSD FISCAL COVERAGE AUDIT COMPLETE - NO WRITES' world-bank-qpsd-sovereign-fiscal-coverage.log

      - name: Enforce discovery-only source and methodology boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s world-bank-qpsd-sovereign-fiscal-coverage.json
          jq -e '.writes_performed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.discovery_only == true' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.raw_cross_source_value_pooling_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.cross_concept_peer_pooling_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.direct_production_fallback_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.activation_boundary.production_activation_allowed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.activation_boundary.scoring_changed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.activation_boundary.country_payability_changed == false' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.coverage_summary.production_supported_country_count_added == 0' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.series | length == 2' world-bank-qpsd-sovereign-fiscal-coverage.json >/dev/null
          echo 'PASS: QPSD discovery remains no-write and cannot promote countries.'

      - name: Upload QPSD source coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-bank-qpsd-sovereign-fiscal-coverage
          path: |
            world-bank-qpsd-sovereign-fiscal-coverage.json
            world-bank-qpsd-sovereign-fiscal-coverage.log
          if-no-files-found: warn
          retention-days: 30
