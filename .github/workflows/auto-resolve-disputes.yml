name: Auto-resolve Agent Arena disputes
# Runs every 15 minutes — disputes have a 48h jury window (JURY_VOTE_WINDOW
# in AgentArenaV2.sol), so this needs a tighter cadence than the 2h main
# lifecycle jobs to give the 5-agent jury a real chance to converge before
# the inconclusive-fallback (uphold AI verdict) kicks in.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  # Same reasoning as the other auto-* workflows: each of the 5 jury wallets
  # has its own nonce, but overlapping runs racing to submit votes on the
  # same dispute is still worth avoiding — cancel the older run.
  group: auto-resolve-disputes
  cancel-in-progress: true
jobs:
  resolve-disputes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install ethers @supabase/supabase-js groq-sdk node-fetch
      - name: Run dispute resolution script
        env:
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_2: ${{ secrets.ARC_RPC_URL_2 }}
          ARC_RPC_URL_3: ${{ secrets.ARC_RPC_URL_3 }}
          ARC_RPC_URL_4: ${{ secrets.ARC_RPC_URL_4 }}
          ARC_RPC_URL_5: ${{ secrets.ARC_RPC_URL_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          JURY_PRIVATE_KEY_1: ${{ secrets.JURY_PRIVATE_KEY_1 }}
          JURY_PRIVATE_KEY_2: ${{ secrets.JURY_PRIVATE_KEY_2 }}
          JURY_PRIVATE_KEY_3: ${{ secrets.JURY_PRIVATE_KEY_3 }}
          JURY_PRIVATE_KEY_4: ${{ secrets.JURY_PRIVATE_KEY_4 }}
          JURY_PRIVATE_KEY_5: ${{ secrets.JURY_PRIVATE_KEY_5 }}
          MAX_DISPUTES_PER_RUN: "5"
          MAX_MARKETS_SCANNED_PER_RUN: "100"
          RUN_TIME_BUDGET_MS: "360000"
        run: node scripts/resolve-disputes.js
