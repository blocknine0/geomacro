name: Owner Telegram Desktop Export Derived JSON (No Funds)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 1,7,13,19 * * *"
  pull_request:
    paths:
      - ".github/workflows/owner-telegram-export-derived-json.yml"
      - "scripts/lib/telegram-export-derived-json.mjs"
      - "scripts/lib/telegram-export-derived-json.test.mjs"
      - "scripts/lib/telegram-export-network-audit.mjs"
      - "scripts/ops/telegram-export-ingest.mjs"
      - "scripts/ops/telegram-export-ingest.test.mjs"
      - "workers/control-plane/src/telegram-export-derived-json.mjs"
      - "workers/control-plane/migrations/0028_telegram_export_derived_json.sql"
      - "docs/adr/ADR-TELEGRAM-DERIVED-COMMERCIAL-USE.md"
permissions:
  contents: read
concurrency:
  group: owner-telegram-desktop-export-file-only
  cancel-in-progress: false
jobs:
  contract-no-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Check private owner export and network safety
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/telegram-export-derived-json.mjs
          node --check scripts/ops/telegram-export-ingest.mjs
          node --check workers/control-plane/src/telegram-export-derived-json.mjs
          node --test scripts/lib/telegram-export-derived-json.test.mjs
          node --test scripts/ops/telegram-export-ingest.test.mjs
          grep -q 'OWNER_DECLARED_TELEGRAM_DERIVED_ONLY' docs/adr/ADR-TELEGRAM-DERIVED-COMMERCIAL-USE.md
          grep -q 'telegram_export_derived_items' workers/control-plane/migrations/0028_telegram_export_derived_json.sql
  private-ingest:
    needs: contract-no-network
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: production
    env:
      GEOMACRO_TELEGRAM_EXPORT_PREFIX: ${{ vars.GEOMACRO_TELEGRAM_EXPORT_PREFIX }}
      GEOMACRO_TELEGRAM_EXPORT_LIFECYCLE_CONFIRMED: ${{ vars.GEOMACRO_TELEGRAM_EXPORT_LIFECYCLE_CONFIRMED }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: "owner_telegram_export_json"
      B2_REQUEST_BUDGET: "4"
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: No input means no Telegram or B2 network activity
        id: configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GEOMACRO_TELEGRAM_EXPORT_PREFIX:-}" ]]; then
            echo "ingest=false" >> "$GITHUB_OUTPUT"
            echo "NO_OWNER_EXPORT_PREFIX_CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
          else
            test "$GEOMACRO_TELEGRAM_EXPORT_PREFIX" = "telegram/owner-exports/" || exit 2
            test "$GEOMACRO_TELEGRAM_EXPORT_LIFECYCLE_CONFIRMED" = "YES" || exit 3
            echo "ingest=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve existing quota-governed Cloudflare D1 database
        if: steps.configured.outputs.ingest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          ids="$(npx -y wrangler@4.136.3 d1 list --json)"
          id="$(printf '%s' "$ids" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s); const x=d.find(r=>r.name==="geomacro-control-plane"); process.stdout.write(x?.uuid??x?.id??"")})')"
          test -n "$id"
          echo "D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
      - name: Produce source-neutral structured JSON directly in private D1
        if: steps.configured.outputs.ingest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEOMACRO_COMMERCE_LEDGER_TOKEN"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          bun scripts/ops/telegram-export-ingest.mjs
      # No actions/upload-artifact: zero owner content in Github.
