name: GeoMacro Protected Hot50 0-to-100 Worker Rollout (NO FUNDS)
# Manual protected release only; never activated by push/schedule/PR.
# Existing D1/B2 quotas, signing authority, source polling and payment OFF stay authoritative.
on:
  pull_request:
    paths:
      - ".github/workflows/geomacro-protected-hot50-worker-rollout.yml"
      - "scripts/ops/verify-protected-worker-promotion.mjs"
      - "scripts/tests/verify-protected-worker-promotion.test.mjs"
  workflow_dispatch:
    inputs:
      baseline_version_id:
        description: "Existing canonical 100% production Worker version UUID"
        required: true
        type: string
      candidate_version_id:
        description: "Exact-main candidate version UUID, uploaded WITHOUT deployment"
        required: true
        type: string
      confirmation:
        description: "Type PROMOTE_HOT50_NO_FUNDS (does not authorize payments)"
        required: true
        type: string
      stage2_run_id:
        description: "Real signed exact-main Stage2 production run ID required before any traffic mutation"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: geomacro-d1-control-plane-production
  cancel-in-progress: false
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: node --test scripts/tests/verify-protected-worker-promotion.test.mjs

  protected-zero-and-gradual-rollout:
    needs: offline-contract
    if: github.event_name == 'workflow_dispatch' && github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      BASELINE_VERSION_ID: ${{ inputs.baseline_version_id }}
      CANDIDATE_VERSION_ID: ${{ inputs.candidate_version_id }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_STEP3_TRUSTED_SIGNER_PUBLIC_JWK: ${{ secrets.GEOMACRO_STEP3_TRUSTED_SIGNER_PUBLIC_JWK }}
      GEOMACRO_STEP3_APPROVED_PRODUCTION_RUN_ID: ${{ inputs.stage2_run_id }}
      SIGNING_JWK: ${{ secrets.SIGNING_JWK }}
      CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_SPOOL_ENCRYPTION_KEY: ${{ secrets.B2_SPOOL_ENCRYPTION_KEY }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: "hot50_release_parity"
      B2_REQUEST_BUDGET: "500"
      P0B_PRIVATE_R2_BUCKET: ${{ secrets.P0B_PRIVATE_R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PARITY_MAX_B2_READS: "250"
      GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_PEM }}
      GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256: ${{ vars.GEOMACRO_MACHINE_FACTS_PUBLIC_KEY_SHA256 }}
      GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_PEM: ${{ secrets.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_PEM }}
      GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256: ${{ vars.GEOMACRO_MACHINE_RIGHTS_PUBLIC_KEY_SHA256 }}
      WRANGLER_VERSION: "4.136.3"
      WORKER_ORIGIN: https://geomacro-control-plane.daspallab202391.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Require exact current main, mandatory hold and no-funds authority
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_CONFIRMATION" = "PROMOTE_HOT50_NO_FUNDS"
          test -f config/d1-hotspot-v2-canary.hold
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/blocknine0/geomacro.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node --test scripts/tests/verify-protected-worker-promotion.test.mjs scripts/tests/owner-d1-total-140k-policy.test.mjs
      - name: Verify D1 Time Travel backup and remote 0204/0211/P1 physical schema
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const get=async path=>{
            const r=await fetch(root+path,{headers:{
              Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
              redirect:'error',signal:AbortSignal.timeout(15000)});
            const j=await r.json();
            if(!r.ok||j.success!==true||!j.result)throw Error('CANARY_D1_PROVIDER_UNAVAILABLE');
            return j.result;
          };
          const databases=await get('/d1/database?per_page=100');
          const match=databases.filter(x=>x.name==='geomacro-control-plane');
          if(match.length!==1||!/^[0-9a-f-]{36}$/i.test(match[0].uuid))
            throw Error('CANARY_D1_CANONICAL_DATABASE_UNKNOWN');
          const db=match[0].uuid;
          const backup=await get('/d1/database/'+db+'/time_travel/bookmark');
          if(!/^[0-9a-f-]{20,100}$/i.test(backup.bookmark??''))
            throw Error('CANARY_D1_BACKUP_BOOKMARK_UNVERIFIED');
          const expected=[
            'materialized_cache','idx_private_osint_country_category_clock_v2',
            'idx_private_osint_check_category_status_v2',
            'idx_website_derived_hot_order_v2','p0b_committed_day_totals',
            'trg_p0b_day_committed_insert','trg_p0b_day_committed_delete',
            'trg_p0b_day_committed_clock_change','p1_source_poll_bundles',
            'idx_p1_source_poll_bundles_expiry','p1_source_poll_dispatch_mutex'
          ];
          const sql='SELECT name FROM sqlite_master WHERE name IN ('+
            expected.map(x=>"'"+x+"'").join(',')+')';
          const response=await fetch(root+'/d1/database/'+db+'/query',{
            method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
             'Content-Type':'application/json'},
            body:JSON.stringify({sql,params:[]}),
            redirect:'error',signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          const batch=data?.result?.[0],got=new Set(batch?.results?.map(x=>x.name)??[]);
          if(!response.ok||data.success!==true||
             expected.some(x=>!got.has(x))||got.size!==expected.length||
             !Number.isSafeInteger(batch?.meta?.rows_read)||
             batch.meta.rows_read>200||batch.meta.rows_written!==0)
            throw Error('CANARY_0204_0211_P1_SCHEMA_READBACK_NOT_VERIFIED');
          mkdirSync('artifacts/protected-canary',{recursive:true});
          writeFileSync('artifacts/protected-canary/worker-schema-preflight.json',
            JSON.stringify({schema:'geomacro.hot50.worker-release-schema.v1',
              database_uuid_confirmed:true,bookmark_verified:true,
              object_count:got.size,rows_read:batch.meta.rows_read,
              rows_written:batch.meta.rows_written,no_funds:true}));
          console.log('CANARY_0204_0211_P1_REMOTE_SCHEMA_AND_BACKUP_VERIFIED');
          NODE
      - name: Upload NO Worker here; protect rollout by exact remote versions
        shell: bash
        run: |
          set -euo pipefail
          test -f config/d1-hotspot-v2-canary.hold
          # Version must already be present, annotated geomacro-main:SHA,
          # and have EXACT matching production binding names and types.
          # Never call "wrangler deploy", "wrangler secret put" or create a D1 here.
          echo "CANARY_VERSION_UPLOAD_NOT_PERFORMED_BY_PROMOTION_WORKFLOW=true"
      - name: Verify exact-main authenticated real Stage2 workflow identity and both provider jobs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PROOF_RUN_ID: ${{ inputs.stage2_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            const id=String(process.env.PROOF_RUN_ID||'');
            if(!/^[1-9][0-9]{5,20}$/.test(id)){
              core.setFailed('CANARY_STAGE2_REAL_RUN_ID_REQUIRED');return;
            }
            const {owner,repo}=context.repo;
            const {data:run}=await github.rest.actions.getWorkflowRun({
              owner,repo,run_id:Number(id)});
            if(run.path!=='.github/workflows/production-rollout-orchestrator.yml'||
               run.event!=='workflow_dispatch'||run.head_branch!=='main'||
               run.head_sha!==process.env.EXPECTED_SHA||
               run.status!=='completed'||run.conclusion!=='success'){
              core.setFailed('CANARY_STAGE2_WORKFLOW_IDENTITY_OR_CONCLUSION_UNVERIFIED');return;
            }
            const {data:jobs}=await github.rest.actions.listJobsForWorkflowRun({
              owner,repo,run_id:Number(id),per_page:100});
            const stage2=jobs.jobs.filter(j=>j.name==='stage2-production');
            const shadow=jobs.jobs.filter(j=>j.name==='shadow-physical');
            if(stage2.length!==1||shadow.length!==1||
               stage2[0].conclusion!=='success'||shadow[0].conclusion!=='success')
              core.setFailed('CANARY_REAL_SHADOW_AND_STAGE2_JOBS_NOT_BOTH_SUCCESS');
      - name: Download signed physical production evidence (not a local CI receipt)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: geomacro-step3-production
          path: artifacts/release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.stage2_run_id }}
          github-token: ${{ github.token }}
      - name: Verify genuine signed Stage2 R2/B2, HMAC and migration readback before mutation
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {admitSignedStep3ProductionFile}
            from './scripts/lib/d1-step3-production-canary-admission.mjs';
          const a=admitSignedStep3ProductionFile();
          if(a.status!=='PASS_REAL_PROVIDER_PRODUCTION'||a.canary_traffic_altered!==false)
            throw Error('CANARY_STAGE2_REAL_SIGNED_PROOF_MISSING');
          console.log(JSON.stringify(a));
          NODE
      - name: Verify provider version parity and account D1 headroom at stage zero
        run: |
          set -euo pipefail
          export TARGET_PERCENT=0
          node scripts/ops/verify-protected-worker-promotion.mjs
      - name: Use canonical six-stage rollback-capable promoter (not minute-long fast path)
        run: |
          set -euo pipefail
          # Cloudflare "versions deploy" traffic mutations happen only inside
          # the canonical verified canary-promoter.ts, not this workflow.
          node --experimental-strip-types scripts/apply-d1-migrations.ts --verify
          node --experimental-strip-types scripts/canary-promoter.ts --promote
          # Canonical observations: stage 0=15m, 1%=30m, 5/25/50/100%=15m.
          # Signed Stage2, per-version p95/p99, provider D1 monthly pace,
          # rollback and no-funds holds remain mandatory.
      - name: Persist non-secret, source-free provider receipts even on HOLD
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-protected-hot50-worker-rollout
          path: artifacts/protected-canary/*.json
          if-no-files-found: warn
          retention-days: 7
