name: Protected Hot50 Worker Binding Delta (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/hot50-binding-delta-readonly.yml'
      - 'scripts/ops/inspect-hot50-binding-delta.mjs'
      - 'scripts/lib/canary-additive-binding-parity.mjs'
      - 'scripts/tests/hot50-binding-readonly-inspector.test.mjs'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed current main SHA
        type: string
        required: true
      baseline_version_id:
        description: Current 100% provider baseline UUID
        type: string
        required: true
      candidate_version_id:
        description: Previously uploaded zero-traffic candidate UUID
        type: string
        required: true
      reviewed_additive_secret_names:
        description: Exact comma-separated reviewed secret additions; never enter values
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: geomacro-hot50-binding-provider-readonly
  cancel-in-progress: false
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify read-only protected audit and strict binding parity
        run: |
          set -euo pipefail
          node --check scripts/ops/inspect-hot50-binding-delta.mjs
          node --test scripts/tests/hot50-binding-readonly-inspector.test.mjs scripts/tests/canary-additive-binding-parity.test.mjs
  binding-diff:
    needs: offline-contract
    if: github.event_name == 'workflow_dispatch' && github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GITHUB_REPOSITORY: blocknine0/geomacro
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      BASELINE_VERSION_ID: ${{ inputs.baseline_version_id }}
      CANDIDATE_VERSION_ID: ${{ inputs.candidate_version_id }}
      REVIEWED_ADDITIVE_SECRET_NAMES: ${{ inputs.reviewed_additive_secret_names }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Compare existing Cloudflare Worker versions without uploading or deploying
        run: node scripts/ops/inspect-hot50-binding-delta.mjs
      - name: Upload secret-free binding-delta receipt even on HOLD
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hot50-binding-delta-readonly-${{ github.run_id }}
          path: artifacts/protected-canary/candidate-binding-readonly-audit.json
          if-no-files-found: warn
          retention-days: 14
