name: Verify AgentArena V2 Liquidity Funding Readiness

on:
  workflow_dispatch:
    inputs:
      amount:
        description: "Planned native USDC amount for an offline/manual funding transaction"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-v2-liquidity-funding
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate planned amount
        env:
          LIQUIDITY_AMOUNT: ${{ inputs.amount }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.LIQUIDITY_AMOUNT ?? "";
          if (!/^\d+(\.\d{1,18})?$/.test(raw)) {
            throw new Error("Amount must be a positive decimal with at most 18 decimal places.");
          }
          const value = Number(raw);
          if (!Number.isFinite(value) || value <= 0) {
            throw new Error("Amount must be greater than zero.");
          }
          console.log(`Planned amount validated: ${raw} USDC`);
          NODE
      - name: Verify Arc Testnet and V2 proxy
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ vars.ARC_V2_PROXY_ADDRESS }}
        run: node scripts/ops/verify-arc-testnet-target.mjs
      - name: Verify V2 economics before offline/manual funding
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ vars.ARC_V2_PROXY_ADDRESS }}
        run: bun run economics:verify

# Security boundary: hosted CI intentionally has no liquidity signing key and
# does not transfer funds. Funding is performed outside CI after this read-only
# readiness check according to the onchain admin signing runbook.
