name: Step3 Failed Shadow Promotion State — Independent Read-Only Reconciliation
on:
  pull_request:
    paths:
      - ".github/workflows/step3-shadow-failed-promotion-readonly.yml"
      - "scripts/ops/diagnose-step3-shadow-failed-promotion-readonly.mjs"
      - "scripts/tests/step3-shadow-failed-promotion-readonly.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/step3-shadow-failed-promotion-readonly.yml"
      - "scripts/ops/diagnose-step3-shadow-failed-promotion-readonly.mjs"
      - "scripts/tests/step3-shadow-failed-promotion-readonly.test.mjs"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: geomacro-step3-shadow-post-failure-readonly
  cancel-in-progress: false
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: node --check scripts/ops/diagnose-step3-shadow-failed-promotion-readonly.mjs
      - run: node --test scripts/tests/step3-shadow-failed-promotion-readonly.test.mjs
  provider-readonly:
    needs: offline-contract
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
      GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_CONTROL_PLANE_TOKEN: ${{ secrets.GEOMACRO_STEP3_SHADOW_CONTROL_PLANE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Exact-main safety hold; no production mutation or D1 query
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/blocknine0/geomacro.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -f config/d1-hotspot-v2-canary.hold
          test "$D1_DATABASE_ID" != "$GEOMACRO_D1_SHADOW_DATABASE_ID"
      - name: Collect real Shadow deployment list and detail twice, host HTTP only
        run: node scripts/ops/diagnose-step3-shadow-failed-promotion-readonly.mjs
      - name: Save sanitized provider incident receipt even on HOLD
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-shadow-failed-promotion-readonly-${{ github.run_id }}
          path: artifacts/release/step3-shadow-failed-promotion-readonly-incident.json
          retention-days: 14
          if-no-files-found: warn
