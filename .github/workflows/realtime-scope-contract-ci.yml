name: Realtime Scope Contract CI

on:
  pull_request:
    paths:
      - "supabase/migrations/967_global_raw_source_coverage_mesh.sql"
      - "supabase/migrations/970_realtime_scope_fanout_mesh.sql"
      - "scripts/sync-country-raw-source-mesh.mjs"
      - "scripts/sync-gdelt-gal-production.mjs"
      - "scripts/sync-realtime-scope-fanout.mjs"
      - "scripts/audit-realtime-scope-fanout.mjs"
      - "src/__tests__/global-raw-realtime-acquisition-static.test.ts"
      - "src/__tests__/gdelt-gal-freshness-truth-static.test.ts"
      - "src/__tests__/realtime-scope-fanout-static.test.ts"
      - ".github/workflows/realtime-scope-contract-ci.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/967_global_raw_source_coverage_mesh.sql"
      - "supabase/migrations/970_realtime_scope_fanout_mesh.sql"
      - "scripts/sync-country-raw-source-mesh.mjs"
      - "scripts/sync-gdelt-gal-production.mjs"
      - "scripts/sync-realtime-scope-fanout.mjs"
      - "scripts/audit-realtime-scope-fanout.mjs"
      - "src/__tests__/global-raw-realtime-acquisition-static.test.ts"
      - "src/__tests__/gdelt-gal-freshness-truth-static.test.ts"
      - "src/__tests__/realtime-scope-fanout-static.test.ts"
      - ".github/workflows/realtime-scope-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run realtime acquisition and scope tests
        run: >
          bunx vitest run
          src/__tests__/global-raw-realtime-acquisition-static.test.ts
          src/__tests__/gdelt-gal-freshness-truth-static.test.ts
          src/__tests__/realtime-scope-fanout-static.test.ts

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          bun --check scripts/sync-country-raw-source-mesh.mjs
          bun --check scripts/sync-gdelt-gal-production.mjs
          bun --check scripts/sync-realtime-scope-fanout.mjs
          bun --check scripts/audit-realtime-scope-fanout.mjs

      - name: Verify migration function quoting
        shell: bash
        run: |
          set -euo pipefail
          as_count="$(grep -Fxc 'as $' supabase/migrations/970_realtime_scope_fanout_mesh.sql || true)"
          dollar_count="$(grep -Fxc '$;' supabase/migrations/970_realtime_scope_fanout_mesh.sql || true)"
          test "$as_count" -ge 2
          test "$dollar_count" -ge 2
          if grep -Fqx 'as ' supabase/migrations/970_realtime_scope_fanout_mesh.sql; then
            echo 'Malformed PL/pgSQL function terminator detected.'
            exit 1
          fi
