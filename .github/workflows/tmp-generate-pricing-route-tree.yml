name: Temporary Generate Pricing Route Tree

on:
  push:
    branches:
      - fix/public-runtime-pricing-20261002

permissions:
  contents: write

concurrency:
  group: tmp-generate-pricing-route-tree-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: fix/public-runtime-pricing-20261002

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate canonical TanStack route tree
        run: bun run build

      - name: Commit generated route tree if changed
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate pricing route tree"
          git push origin HEAD:fix/public-runtime-pricing-20261002
