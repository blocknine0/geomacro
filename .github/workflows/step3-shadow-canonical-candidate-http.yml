name: Step3 Shadow Canonical Candidate HTTP 404-401-400 Read-Only
on:
  pull_request:
    paths:
      - ".github/workflows/step3-shadow-canonical-candidate-http.yml"
      - "scripts/ops/verify-step3-shadow-canonical-candidate-http.mjs"
      - "scripts/tests/step3-shadow-canonical-candidate-http.test.mjs"
  workflow_dispatch:
    inputs:
      approval:
        description: "Type VERIFY_TWO_CANONICAL_SHADOW_CANDIDATES_READ_ONLY"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: geomacro-step3-shadow-candidate-http-readonly
  cancel-in-progress: false
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: node --check scripts/ops/verify-step3-shadow-canonical-candidate-http.mjs
      - run: node --test scripts/tests/step3-shadow-canonical-candidate-http.test.mjs
  provider-readonly:
    needs: offline-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      inputs.approval == 'VERIFY_TWO_CANONICAL_SHADOW_CANDIDATES_READ_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      SHADOW_CANDIDATE_HTTP_APPROVAL: ${{ inputs.approval }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      GEOMACRO_D1_SHADOW_DATABASE_ID: ${{ vars.GEOMACRO_D1_SHADOW_DATABASE_ID || secrets.GEOMACRO_D1_SHADOW_DATABASE_ID }}
      GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET: ${{ vars.GEOMACRO_STEP3_SHADOW_PRIVATE_R2_BUCKET }}
      GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_VERIFIED_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST: ${{ vars.GEOMACRO_STEP3_SHADOW_LEGACY_WORKER_HOST }}
      GEOMACRO_STEP3_SHADOW_CONTROL_PLANE_TOKEN: ${{ secrets.GEOMACRO_STEP3_SHADOW_CONTROL_PLANE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Require current main and unchanged protected canary hold
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/blocknine0/geomacro.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -f config/d1-hotspot-v2-canary.hold
          test "$D1_DATABASE_ID" != "$GEOMACRO_D1_SHADOW_DATABASE_ID"
      - name: Verify both immutable Shadow candidate APIs without D1 reads or promotion
        run: node scripts/ops/verify-step3-shadow-canonical-candidate-http.mjs
      - name: Archive redacted candidate HTTP/identity receipt even on HOLD
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-step3-shadow-canonical-http-${{ github.run_id }}
          path: artifacts/release/step3-shadow-canonical-candidate-http-acceptance.json
          retention-days: 14
          if-no-files-found: warn
