name: Temporary Canonical Commercial Event Filter Patch

on:
  push:
    branches:
      - fix/canonical-commercial-event-filter
    paths:
      - ".github/workflows/tmp-patch-canonical-commercial-event-filter.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/canonical-commercial-event-filter
          fetch-depth: 0

      - name: Apply exact publisher patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/lib/country-risk-publisher.server.ts")
          text = path.read_text()
          old = '''  const eligibleEventIds =\n    deliveryProfile ===\n      "PUBLIC_DEMO"\n      ? new Set(\n'''
          new = '''  const eligibleEventIds =\n    deliveryProfile === "PUBLIC_DEMO" ||\n    deliveryProfile === "CANONICAL"\n      ? new Set(\n'''
          if text.count(old) != 1:
              raise SystemExit(f"EXPECTED_EXACT_PATCH_SITE_ONCE_FOUND_{text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/lib/country-risk-publisher.server.ts

      - name: Commit branch-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/country-risk-publisher.server.ts
          git commit -m "Filter canonical risk objects to commercially admissible events"
          git push origin HEAD:fix/canonical-commercial-event-filter
