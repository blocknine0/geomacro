name: Live Testnet API Smoke

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/live-testnet-api-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://geomacro.live
    steps:
      - name: Verify Testnet access page is live
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          code="$(curl --retry 4 --retry-all-errors --retry-delay 3 -sS -D "$headers" -o "$body" -w '%{http_code}' "$BASE_URL/testnet-access")"
          test "$code" = "200"
          grep -Fq 'Verify once. Pay only for the API call you use.' "$body"
          grep -Fq '500-credit usage cap' "$body"
          grep -Fq 'API Key + API Secret' "$body"
          grep -Fq 'Receive HTTP 402' "$body"
          grep -Fqi 'cache-control: no-store' "$headers"
          grep -Fqi 'x-content-type-options: nosniff' "$headers"
          echo "PASS: /testnet-access is live with pay-per-call copy and security headers."

      - name: Verify tester config fails closed without a session
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/testnet-tester/config")"
          test "$code" = "401"
          if grep -Eqi 'receiver_address|capability_prices|gmk_test_|gms_test_' "$body"; then
            echo "::error title=Unauthenticated tester data leak::Protected Testnet config fields appeared in an unauthenticated response."
            cat "$body"
            exit 1
          fi
          echo "PASS: protected tester config returns 401 without session data leakage."

      - name: Verify developer API fails closed without credentials
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"request_id":"live-smoke-unauth-001","capability":"gri_read","subject":{"type":"global"}}' \
            "$BASE_URL/api/testnet/intelligence")"
          test "$code" = "401"
          grep -Fq 'COMMERCIAL_API_KEY_REQUIRED' "$body"
          if grep -Eqi 'display_score|raw_score|risk_object|payment_event_id|credits_remaining' "$body"; then
            echo "::error title=Unauthenticated premium data leak::Protected intelligence fields appeared in an unauthenticated response."
            cat "$body"
            exit 1
          fi
          echo "PASS: developer API returns 401 and no premium intelligence without credentials."

      - name: Verify paired Testnet credentials are enforced
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-geomacro-api-key: gmk_test_invalid_but_long_enough_1234567890' \
            --data '{"request_id":"live-smoke-half-auth-001","capability":"gri_read","subject":{"type":"global"}}' \
            "$BASE_URL/api/testnet/intelligence")"
          test "$code" = "401"
          grep -Fq 'TESTNET_API_KEY_SECRET_REQUIRED' "$body"
          echo "PASS: Testnet API requires API Key + API Secret as a pair."

      - name: Summary
        run: |
          echo "Live Testnet API unauthenticated boundary smoke passed."
          echo "This smoke intentionally does not sign a wallet message, move Testnet USDC, or consume credits."
