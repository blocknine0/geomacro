name: CodeQL High-Severity Alert Location Readback (No Dismissal)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codeql-alert-location-readback.yml"
      - "scripts/security/inspect-codeql-alert-locations.mjs"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  read-actual-alerts:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read authenticated live alert paths and line numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security/inspect-codeql-alert-locations.mjs
