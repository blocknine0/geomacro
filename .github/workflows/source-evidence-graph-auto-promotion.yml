name: Source Evidence Graph and Automated Certification Promotion

on:
  workflow_run:
    workflows: ["Deploy country flash intelligence to Supabase"]
    types: [completed]
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence-promotion:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      APP_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SOURCE_EVIDENCE_CONCURRENCY: "16"
      SOURCE_EVIDENCE_TIMEOUT_MS: "12000"
      SOURCE_EVIDENCE_MAX_BODY_BYTES: "65536"
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative production identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${APP_SUPABASE_URL:-}"
          test -n "\${SUPABASE_SERVICE_ROLE_KEY:-}"
          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "\${EXPECTED_SUPABASE_PROJECT_REF}"

      - name: Build evidence graph and run guarded promotion
        run: bun run source:certification:evidence-graph

      - name: Upload permanent evidence graph
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-certification-evidence-graph-${{ github.run_id }}
          path: artifacts/source-certification-evidence-graph
          if-no-files-found: error
          retention-days: 30
