name: RSS canonical private D1 originals every 15 minutes

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/rss-private-d1-15m.yml"
      - "scripts/run-rss-live-cycle.mjs"
      - "scripts/ops/plan-rss-category-lanes.py"
      - "scripts/ops/test-rss-category-lanes.py"
      - "workers/telegram-flash/worker.py"
      - "scripts/ops/test-rss-native-clock.py"
      - "scripts/ops/test-official-ogl-atom-feeds.py"
      - "config/official-ogl-atom-sources.json"
      - "config/global-first-party-rss-rights.v1.json"
      - "scripts/ops/report-global-195-rss-source-readiness.py"
      - "config/india-pib-official-reuse-rights.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rss-private-d1-15m.yml"
      - "scripts/run-rss-live-cycle.mjs"
      - "scripts/lib/private-unscored-source-d1.mjs"
      - "workers/telegram-flash/worker.py"
      - "scripts/ops/test-rss-native-clock.py"
      - "scripts/ops/plan-rss-category-lanes.py"
      - "scripts/ops/test-rss-category-lanes.py"
      - "scripts/ops/test-official-ogl-atom-feeds.py"
      - "config/official-ogl-atom-sources.json"
      - "config/global-first-party-rss-rights.v1.json"
      - "scripts/ops/report-global-195-rss-source-readiness.py"
      - "config/india-pib-official-reuse-rights.json"
  schedule:
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-private-rss-d1-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact source without secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify private D1 source-level diagnostic source parses without secret access
        run: node --check scripts/run-rss-live-cycle.mjs
      - name: Verify every configured RSS source maps to exactly one category
        run: python scripts/ops/test-rss-category-lanes.py -v
      - name: Verify publisher-native publication precision without invented clock
        run: python scripts/ops/test-rss-native-clock.py
      - name: Verify OGL publisher provenance, three-domain relevance and no Telegram collection
        run: python scripts/ops/test-official-ogl-atom-feeds.py
      - name: Audit 195-country source configuration without false live claims
        run: python scripts/ops/report-global-195-rss-source-readiness.py

  ingest:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        category: [GEOPOLITICS, MACRO, CRITICAL_MINERALS]
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      RSS_LIVE_CYCLE_TRANSPORT: d1_private
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      TELEGRAM_ENABLED: "false"
      TELEGRAM_CHANNELS: ""
      BREAKING_RSS_ENABLED: "true"
      BREAKING_RSS_RUN_ONCE: "true"
      BREAKING_RSS_BOOTSTRAP_MAX_ITEMS: "10"
      BREAKING_FEED_USER_AGENT: "GeoMacro-Research-Bot/1.0 (+https://geomacro.live)"
    steps:
      - name: Checkout canonical source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Auto-partition authoritative RSS feed registry for this category
        env:
          RSS_CATEGORY: ${{ matrix.category }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/plan-rss-category-lanes.py --category "$RSS_CATEGORY" --github-env "$GITHUB_ENV"
      - name: Install RSS worker dependencies
        run: python -m pip install --disable-pip-version-check -r workers/telegram-flash/requirements.txt
      - name: Verify private D1 adapters and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-rss-live-cycle.mjs
          node --check scripts/lib/private-unscored-source-d1.mjs
          node --test scripts/lib/private-unscored-source-d1.test.mjs
          python scripts/ops/test-rss-native-clock.py
      - name: Require canonical private D1 credential
        shell: bash
        run: |
          set -euo pipefail
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || { echo "::error::PRIVATE_D1_AUTH_REQUIRED"; exit 2; }
      - name: Fetch independently, deduplicate and verify this category in D1
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-rss-live-cycle.mjs
