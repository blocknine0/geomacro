name: RSS canonical private D1 originals every 15 minutes

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/rss-private-d1-15m.yml"
      - "scripts/run-rss-live-cycle.mjs"
      - "scripts/lib/private-unscored-source-d1.mjs"
      - "workers/telegram-flash/worker.py"
      - "scripts/ops/test-rss-native-clock.py"
  schedule:
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-private-rss-d1
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      RSS_LIVE_CYCLE_TRANSPORT: d1_private
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      TELEGRAM_ENABLED: "false"
      TELEGRAM_CHANNELS: ""
      BREAKING_RSS_ENABLED: "true"
      BREAKING_RSS_RUN_ONCE: "true"
      BREAKING_RSS_BOOTSTRAP_MAX_ITEMS: "10"
      BREAKING_FEED_USER_AGENT: "Geomacro/1.0 (+https://geomacro.live; contact=contact@geomacro.live)"
    steps:
      - name: Checkout canonical source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install RSS worker dependencies
        run: python -m pip install --disable-pip-version-check -r workers/telegram-flash/requirements.txt
      - name: Verify private D1 adapters and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-rss-live-cycle.mjs
          node --check scripts/lib/private-unscored-source-d1.mjs
          node --test scripts/lib/private-unscored-source-d1.test.mjs
          python scripts/ops/test-rss-native-clock.py
      - name: Require canonical private D1 credential
        shell: bash
        run: |
          set -euo pipefail
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || { echo "::error::PRIVATE_D1_AUTH_REQUIRED"; exit 2; }
      - name: Fetch original RSS, deduplicate and verify D1 private readback
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-rss-live-cycle.mjs
