name: GRI Provider Model Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Discover Groq models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          echo "===== GROQ MODELS ====="

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -H "Content-Type: application/json" \
          | python -c '
          import json, sys
          payload = json.load(sys.stdin)
          for row in payload.get("data", []):
              model_id = row.get("id")
              if model_id:
                  print(model_id)
          '

      - name: Discover Cerebras models
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          set -euo pipefail

          echo "===== CEREBRAS MODELS ====="

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            https://api.cerebras.ai/v1/models \
            -H "Authorization: Bearer ${CEREBRAS_API_KEY}" \
            -H "Content-Type: application/json" \
          | python -c '
          import json, sys
          payload = json.load(sys.stdin)
          for row in payload.get("data", []):
              model_id = row.get("id")
              if model_id:
                  print(model_id)
          '
