name: Exact-Head Commercial Launch Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character main SHA to certify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: geomacro-exact-head-launch-readiness
  cancel-in-progress: false

jobs:
  readiness:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Confirm exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "${#CANDIDATE_SHA}" -eq 40
          test "${#DISPATCH_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "${CANDIDATE_SHA}" = "${DISPATCH_SHA}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test -n "$main_sha"
            test "${CANDIDATE_SHA}" = "${main_sha}"
          fi

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Production build
        run: bun run build

      - name: Launch contract tests
        run: >-
          bunx vitest run
          src/lib/commercial-launch-gate.server.test.ts
          src/__tests__/production-launch-safety-static.test.ts
          src/__tests__/agent-commerce-delivery-ledger-static.test.ts
          src/__tests__/agent-commerce-discovery-static.test.ts
          src/__tests__/goat-mainnet-readiness-static.test.ts
          src/__tests__/goat-mainnet-revenue-semantics-static.test.ts
          src/__tests__/commercial-source-rights-evidence-parity.test.js
          src/__tests__/commercial-source-rights-runtime-migration.test.js
          src/__tests__/source-endpoint-disposition-933.test.ts

      - name: Exact-head readiness gate
        env:
          GEOMACRO_LAUNCH_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-launch-readiness.mjs

      - name: Build frozen commercial RC evidence
        env:
          COMMERCIAL_RC_GIT_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: node scripts/build-commercial-release-candidate.mjs artifacts/commercial-release-candidate.json

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: commercial-launch-readiness-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/commercial-launch-readiness.json
            artifacts/commercial-release-candidate.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Geomacro exact-head commercial launch readiness"
            echo
            echo "- Candidate SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}"
            echo "- Repository-side result: READY_FOR_OWNER_ACTIVATION when all steps pass"
            echo "- Production funds: disabled"
            echo "- Official launch announcement: disabled"
            echo "- Real payment settlement: not performed by this workflow"
            echo "- Revenue claim: requires reconciled external production purchase"
          } >> "$GITHUB_STEP_SUMMARY"
