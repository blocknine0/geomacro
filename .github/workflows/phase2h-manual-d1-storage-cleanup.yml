name: Phase 2H Manual Archived-Only D1 Storage Cleanup
# NO schedule. Automatic 60h/72h raw-news deletion is paused.
# Operator must explicitly opt in to a bounded, provider-admitted delete.
# Never deletes unarchived Phase2H originals, PREDGE, or historical data.
on:
  pull_request:
    paths:
      - '.github/workflows/phase2h-manual-d1-storage-cleanup.yml'
      - 'scripts/ops/phase2h-72h-d1-cleanup.mjs'
      - 'scripts/tests/phase2h-retention-72h.test.mjs'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'D1 archived-only manual cleanup; default does NOT delete anything'
        type: choice
        required: true
        default: DO_NOT_DELETE
        options:
          - DO_NOT_DELETE
          - DELETE_B2_ACKED_ONLY

permissions:
  contents: read

concurrency:
  group: geomacro-phase2h-manual-archived-only-storage-cleanup
  cancel-in-progress: false

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify no automatic expiry or unauthorised originals deletion
        run: |
          node --check scripts/ops/phase2h-72h-d1-cleanup.mjs
          node --test scripts/tests/phase2h-retention-72h.test.mjs
  operator-cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'DELETE_B2_ACKED_ONLY' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - id: provider
        name: Verify shared provider quota before ANY D1 delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase2h
          node scripts/ops/plan-d1-bundled-work.mjs | tee artifacts/phase2h/manual-provider-admission.log
      - name: Execute at most the provider-authorized number of archived-only deletes
        if: steps.provider.outputs.retention_cleanup == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PHASE2H_PROVIDER_RETENTION_CLEANUP: ${{ steps.provider.outputs.retention_cleanup }}
          PHASE2H_PROVIDER_CLEANUP_MAX_ROWS: ${{ steps.provider.outputs.retention_cleanup_max_rows }}
          PHASE2H_MANUAL_CLEANUP_CONFIRM: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/u.test(account??'')||(token??'').length<20)
            throw Error('PHASE2H_MANUAL_D1_PROVIDER_AUTH_REQUIRED');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?per_page=100',{
            headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          const rows=data?.result?.filter(x=>x.name==='geomacro-control-plane')??[];
          if(!response.ok||data.success!==true||rows.length!==1||
             !/^[a-f0-9-]{36}$/iu.test(rows[0]?.uuid??''))
            throw Error('PHASE2H_MANUAL_CANONICAL_D1_NOT_VERIFIED');
          appendFileSync(process.env.GITHUB_ENV,'D1_DATABASE_ID='+rows[0].uuid+'\n');
          NODE
          node scripts/ops/phase2h-72h-d1-cleanup.mjs | tee artifacts/phase2h/manual-archived-only-cleanup.json
      - name: Report a quota HOLD as no deletion
        if: steps.provider.outputs.retention_cleanup != 'true'
        run: |
          echo "::warning::Phase2H D1 manual cleanup NOT ADMITTED by shared free-tier quota; zero D1 records deleted."
          echo "Phase2H archived-only manual cleanup: quota HELD. No deletion attempted." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve metadata-only manual cleanup and quota receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase2h-manual-archived-only-cleanup-${{ github.run_id }}
          path: |
            artifacts/phase2h/manual-provider-admission.log
            artifacts/phase2h/manual-archived-only-cleanup.json
          if-no-files-found: warn
          retention-days: 30
