name: Validate legacy public risk indices recovery edge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan validates the recovery target only; apply explicitly deploys the read-only legacy Supabase recovery Edge Function."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  pull_request:
    paths:
      - ".github/workflows/deploy-public-risk-indices-edge.yml"
      - "supabase/functions/public-risk-indices/**"
      - "src/lib/public-risk-edge.server.ts"
      - "src/lib/risk-indices.types.ts"

permissions:
  contents: read

jobs:
  validate-workflow:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate recovery guardrails
        shell: bash
        run: |
          set -euo pipefail
          file=".github/workflows/deploy-public-risk-indices-edge.yml"
          function="supabase/functions/public-risk-indices/index.ts"

          grep -q 'workflow_dispatch:' "$file"
          grep -q "github.ref == 'refs/heads/main'" "$file"
          grep -q 'ldpwajisioljyjtojvfx' "$file"
          grep -q 'supabase functions deploy public-risk-indices' "$file"
          grep -q -- '--no-verify-jwt' "$file"
          grep -q 'version: 2.117.0' "$file"
          grep -q 'request.method !== "GET"' "$function"
          grep -q 'gri-v1.2.0' "$function"
          grep -q 'gri-proof-v1.2.0' "$function"
          grep -q 'verified-category-projection' "$function"

          if grep -Eq '\.(insert|upsert|update|delete)\(' "$function"; then
            echo "::error title=Read-only boundary violated::Recovery Edge Function contains a database mutation call."
            exit 1
          fi

          if grep -q '^  push:' "$file"; then
            echo "::error title=Production boundary violated::Legacy Supabase recovery edge must never auto-deploy from a push."
            exit 1
          fi

          echo "Legacy public risk edge is manual recovery only."

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-public-risk-indices-recovery
      cancel-in-progress: false
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate recovery target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error title=Missing recovery secret::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID are required."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_ID" != "$EXPECTED_SUPABASE_PROJECT_REF" ]]; then
            echo "::error title=Wrong recovery target::Refusing to deploy outside the pinned Geomacro Supabase project."
            exit 1
          fi
          echo "PASS: pinned recovery project confirmed."

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Stop after recovery deployment plan
        if: ${{ inputs.mode == 'plan' }}
        shell: bash
        run: |
          echo "Plan completed. No recovery function was deployed."

      - name: Deploy read-only recovery function
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy public-risk-indices \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Smoke-check recovery function
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/public-risk-indices"
          code="$(curl --silent --show-error --fail-with-body \
            --output /tmp/public-risk-indices.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            "$endpoint")"

          cat /tmp/public-risk-indices.json
          echo

          if [[ "$code" != "200" ]]; then
            echo "::error title=Recovery risk indices smoke failed::Expected HTTP 200 from the explicitly deployed recovery function."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/public-risk-indices.json', 'utf8'));
          if (body?.ok !== true) throw new Error('payload is not ok');
          if (body?.data?.contractVersion !== 'risk-indices-v1.1.0') throw new Error('contract version mismatch');
          if (body?.data?.parentMethodologyVersion !== 'gri-v1.2.0') throw new Error('methodology mismatch');
          if (body?.data?.proofVersion !== 'gri-proof-v1.2.0') throw new Error('proof version mismatch');
          if (body?.data?.verificationStatus !== 'verified') throw new Error('snapshot is not verified');
          const indices = body?.data?.indices;
          if (!Array.isArray(indices) || indices.length !== 3) throw new Error('expected exactly three indices');
          const keys = indices.map((item) => item.key).sort().join(',');
          if (keys !== 'critical_minerals,geopolitics,macro') throw new Error(`unexpected index keys: ${keys}`);
          console.log('PASS: explicit recovery three-index payload verified.');
          NODE
