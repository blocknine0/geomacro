name: Hot 50 Risk Stream Daily Read-Only Audit

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-hot50-risk-stream-daily-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Read-only daily Risk Stream and paid delivery counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ops/audit-hot50-risk-stream-daily.mjs > hot50-risk-stream-daily-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hot50-risk-stream-daily-audit-${{ github.run_id }}
          path: hot50-risk-stream-daily-audit.json
          retention-days: 30
          if-no-files-found: error
