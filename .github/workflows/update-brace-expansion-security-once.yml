name: Update brace-expansion security once
on:
  push:
    branches:
      - fix/archive-sidecar-legacy-constraint-20260930
permissions:
  contents: write
concurrency:
  group: update-brace-expansion-security-once
  cancel-in-progress: false
jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/archive-sidecar-legacy-constraint-20260930
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Update only brace-expansion transitive versions within declared dependency ranges
        run: bun update brace-expansion --lockfile-only
      - name: Verify vulnerable brace-expansion versions are gone
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          set +e
          bun audit > /tmp/audit.txt 2>&1
          audit_code=$?
          set -e
          cat /tmp/audit.txt
          ! grep -Fq 'brace-expansion@1.1.18' /tmp/audit.txt
          ! grep -Fq 'brace-expansion@5.0.9' /tmp/audit.txt
          ! grep -Fq 'GHSA-qhr7-859c-m2p7' /tmp/audit.txt
          ! grep -Fq 'GHSA-6j4f-fj2g-mc7p' /tmp/audit.txt
          ! grep -Fq 'GHSA-q2hr-2g5m-vwhr' /tmp/audit.txt
          if [ "$audit_code" -ne 0 ]; then
            grep -Fq 'elliptic@6.6.1' /tmp/audit.txt
            grep -Fq 'GHSA-848j-6mx2-7j84' /tmp/audit.txt
            grep -Fq '1 vulnerability (1 low)' /tmp/audit.txt
          fi
      - name: Commit canonical lockfile update if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "No lockfile update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Patch brace-expansion transitive advisories"
          git push origin HEAD:fix/archive-sidecar-legacy-constraint-20260930
