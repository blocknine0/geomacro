name: Telegram public source discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram discovery dependencies
        run: python -m pip install -r workers/telegram-flash/requirements.txt

      - name: Discover public Telegram channels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_DISCOVERY_COUNTRIES_PER_RUN: "194"
          TELEGRAM_DISCOVERY_SEARCH_LIMIT: "50"
          TELEGRAM_DISCOVERY_MAX_CANDIDATES_PER_COUNTRY: "4"
          TELEGRAM_DISCOVERY_MIN_SCORE: "55"
          TELEGRAM_DISCOVERY_SLEEP_SECONDS: "1.5"
        run: python workers/telegram-flash/discover.py
