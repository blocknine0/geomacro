name: Country 195 Rolling Original Proof Audit

# READ only prior owner-approved GitHub Actions country-proof artifacts.
# Daily aggregation never re-polls countries or treats routing as coverage.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "53 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/country-195-rolling-original-proof-audit.yml"
      - "scripts/lib/continent-country-195-rotation.mjs"
      - "scripts/lib/continent-country-resume.mjs"
      - "scripts/lib/continent-country-full-sweep.mjs"
      - "scripts/ops/run-full-continent-country-sweep.mjs"
      - "scripts/tests/continent-country-full-sweep.test.mjs"
      - "scripts/ops/restore-continent-country-cursor.mjs"
      - "scripts/tests/continent-country-resume.test.mjs"
      - "scripts/ops/plan-continent-country-195-rotation.mjs"
      - "scripts/tests/continent-country-195-rotation.test.mjs"
      - ".github/workflows/continent-country-original-probe-reusable.yml"
      - ".github/workflows/continent-country-*-2h.yml"
      - "scripts/lib/country-195-proof-rollup.mjs"
      - "scripts/lib/country-195-commercial-original-review-join.mjs"
      - "scripts/ops/report-country-195-commercial-readiness.mjs"
      - "scripts/tests/country-195-commercial-original-review-join.test.mjs"
      - "scripts/tests/report-country-195-commercial-readiness-cli.test.mjs"
      - "scripts/ops/aggregate-country-195-proofs.mjs"
      - "scripts/tests/country-195-proof-rollup.test.mjs"
      - "scripts/tests/reconcile-country-195-publication.test.mjs"
      - "scripts/ops/audit-country-195-source-website.mjs"
      - "scripts/lib/reconcile-country-195-publication.mjs"
  pull_request:
    paths:
      - ".github/workflows/country-195-rolling-original-proof-audit.yml"
      - "scripts/lib/continent-country-195-rotation.mjs"
      - "scripts/lib/continent-country-resume.mjs"
      - "scripts/lib/continent-country-full-sweep.mjs"
      - "scripts/ops/run-full-continent-country-sweep.mjs"
      - "scripts/tests/continent-country-full-sweep.test.mjs"
      - "scripts/ops/restore-continent-country-cursor.mjs"
      - "scripts/tests/continent-country-resume.test.mjs"
      - "scripts/ops/plan-continent-country-195-rotation.mjs"
      - "scripts/tests/continent-country-195-rotation.test.mjs"
      - ".github/workflows/continent-country-original-probe-reusable.yml"
      - ".github/workflows/continent-country-*-2h.yml"
      - "scripts/lib/country-195-proof-rollup.mjs"
      - "scripts/lib/country-195-commercial-original-review-join.mjs"
      - "scripts/ops/report-country-195-commercial-readiness.mjs"
      - "scripts/tests/country-195-commercial-original-review-join.test.mjs"
      - "scripts/tests/report-country-195-commercial-readiness-cli.test.mjs"
      - "scripts/ops/aggregate-country-195-proofs.mjs"
      - "scripts/tests/country-195-proof-rollup.test.mjs"
      - "scripts/tests/reconcile-country-195-publication.test.mjs"
      - "scripts/ops/audit-country-195-source-website.mjs"
      - "scripts/lib/reconcile-country-195-publication.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: geomacro-country-195-rolling-original-proof-audit
  cancel-in-progress: false

jobs:
  offline-trust-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify one authentic calendar-cycle receipt cannot assert 585 without actual country proofs
        run: |
          node --check scripts/lib/country-195-proof-rollup.mjs
          node --check scripts/ops/aggregate-country-195-proofs.mjs
          node --check scripts/lib/continent-country-195-rotation.mjs
          node --check scripts/ops/plan-continent-country-195-rotation.mjs
          node --test scripts/tests/continent-country-195-rotation.test.mjs scripts/tests/continent-country-resume.test.mjs scripts/tests/continent-country-full-sweep.test.mjs
          node --test scripts/tests/country-195-proof-rollup.test.mjs
          node --test scripts/tests/country-195-commercial-original-review-join.test.mjs
          node --test scripts/tests/report-country-195-commercial-readiness-cli.test.mjs
          node --check scripts/lib/reconcile-country-195-publication.mjs
          node --check scripts/ops/audit-country-195-source-website.mjs
          node --test scripts/tests/reconcile-country-195-publication.test.mjs

  read-only-coverage-aggregation:
    needs: offline-trust-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Aggregate only real last-90d schedule-success checkpoint artifacts
        run: node scripts/ops/aggregate-country-195-proofs.mjs
      - name: Reconcile all 585 real source probes against independent signed event proof boundary (no funds)
        run: |
          set -euo pipefail
          node scripts/ops/report-country-195-commercial-readiness.mjs
          # Required REAL artifact, not merely a successful empty process.
          test -s artifacts/country-195/commercial-original-review-gaps.v1.json
          node -e 'const x=require("./artifacts/country-195/commercial-original-review-gaps.v1.json");if(x.exact_cells_evaluated!==585||x.exact_canonical_country_count!==195||x.paid_delivery_enabled!==false||x.x402_charge_authorized!==false)process.exit(3)'
      - name: Reconcile actual 585 customer-visible country cells with retained country-original proofs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/audit-country-195-source-website.mjs
      - name: Observe current website latency independently without funds
        continue-on-error: true
        run: |
          mkdir -p artifacts/website-latency
          node scripts/ops/derived-news-latency-audit.mjs --website-observed > artifacts/website-latency/served-samples.json
      - name: Report current source-proof and signed-serving launch gaps without funds
        run: node scripts/ops/three-launch-blockers-report.mjs
      - name: Keep source-free trusted coverage-gap rollup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: country-195-rolling-original-proof-${{ github.run_id }}
          path: artifacts/country-195/rolling-proof-summary.v1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Keep exact 585 source-to-independent-review readiness gaps, no source material
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: country-195x3-prepublication-review-gaps-${{ github.run_id }}
          path: artifacts/country-195/commercial-original-review-gaps.v1.json
          retention-days: 7
          if-no-files-found: warn
      - name: Retain private 195x3 source-to-website coverage reconciliation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: country-195x3-source-publication-reconciliation-${{ github.run_id }}
          path: artifacts/country-195/live-195x3-source-website-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep independent three-requirement launch gap report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: three-launch-blockers-${{ github.run_id }}
          path: artifacts/launch-acceptance/three-blockers.json
          if-no-files-found: warn
          retention-days: 7
