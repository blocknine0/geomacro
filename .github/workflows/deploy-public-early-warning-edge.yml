name: Deploy public early warning edge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-public-early-warning-edge.yml"
      - "supabase/functions/public-early-warning/**"
      - "src/routes/api.early-warning.ts"
      - "src/__tests__/public-early-warning-edge-static.test.ts"
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan validates the target only; apply deploys the read-only public Early Warning Edge Function and runs a live smoke check."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  pull_request:
    paths:
      - ".github/workflows/deploy-public-early-warning-edge.yml"
      - "supabase/functions/public-early-warning/**"
      - "src/routes/api.early-warning.ts"
      - "src/__tests__/public-early-warning-edge-static.test.ts"

permissions:
  contents: read

jobs:
  validate-workflow:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment and privacy guardrails
        shell: bash
        run: |
          set -euo pipefail
          file=".github/workflows/deploy-public-early-warning-edge.yml"
          function="supabase/functions/public-early-warning/index.ts"

          grep -q "github.ref == 'refs/heads/main'" "$file"
          grep -q 'ldpwajisioljyjtojvfx' "$file"
          grep -q 'supabase functions deploy public-early-warning' "$file"
          grep -q -- '--no-verify-jwt' "$file"
          grep -q 'version: 2.117.0' "$file"
          grep -q 'request.method !== "GET"' "$function"
          grep -q '.eq("visibility", "public")' "$function"
          grep -q '.eq("public_eligible", true)' "$function"
          grep -q '.in("status", PUBLIC_STATUSES)' "$function"
          grep -q '.limit(limit)' "$function"

          if grep -Eq '\.(insert|upsert|update|delete)\(' "$function"; then
            echo "::error title=Read-only boundary violated::Public Early Warning Edge Function contains a database mutation call."
            exit 1
          fi

          if grep -Eq 'cews_inputs|cews_contributions|evidence_refs|source_event_ids|outcome_evidence_refs|early_warning_distribution_receipts' "$function"; then
            echo "::error title=Private field boundary violated::Public Early Warning Edge Function references a private ledger field or table."
            exit 1
          fi

          echo "Public Early Warning deployment guardrails are present."

  deploy:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-public-early-warning-production
      cancel-in-progress: false
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error title=Missing production secret::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID are required."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_ID" != "$EXPECTED_SUPABASE_PROJECT_REF" ]]; then
            echo "::error title=Wrong production target::Refusing to deploy outside the authoritative Geomacro Supabase project."
            exit 1
          fi
          echo "PASS: authoritative production project confirmed."

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Stop after manual deployment plan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'plan' }}
        shell: bash
        run: |
          echo "Plan completed. No production function was deployed."

      - name: Deploy read-only public Early Warning function
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy public-early-warning \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Smoke-check bounded public Early Warning feed
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/public-early-warning?limit=1"
          code="$(curl --silent --show-error \
            --output /tmp/public-early-warning.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            "$endpoint")"

          cat /tmp/public-early-warning.json
          echo

          if [[ "$code" != "200" ]]; then
            echo "::error title=Public Early Warning smoke failed::Expected HTTP 200 from the authoritative Edge Function."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/public-early-warning.json', 'utf8'));
          if (body?.ok !== true) throw new Error('payload is not ok');
          if (body?.contract_version !== 'public-early-warning-edge-v1') throw new Error('contract version mismatch');
          if (!Array.isArray(body?.rows) || body.rows.length > 1) throw new Error('bounded row contract mismatch');
          const forbidden = ['cews_inputs','cews_contributions','evidence_refs','source_event_ids','outcome_evidence_refs'];
          for (const row of body.rows) {
            if (row.visibility !== 'public' || row.public_eligible !== true) throw new Error('non-public row leaked');
            if (!['WARNING','CRITICAL'].includes(row.status)) throw new Error('non-distributable status leaked');
            for (const key of forbidden) if (key in row) throw new Error(`private field leaked: ${key}`);
          }
          console.log('PASS: bounded public Early Warning payload verified.');
          NODE
