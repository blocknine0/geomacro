name: OECD Sovereign Fiscal Coverage Proof

on:
  pull_request:
    paths:
      - "scripts/audit-oecd-sovereign-fiscal-coverage.mjs"
      - "docs/MULTI_SOURCE_ACTIVATION_MATRIX.md"
      - "supabase/migrations/920_multi_source_commercial_registry.sql"
      - ".github/workflows/oecd-sovereign-fiscal-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run live OECD D3/D4 coverage audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-oecd-sovereign-fiscal-coverage.mjs | tee oecd-sovereign-fiscal-coverage.log
          grep -q 'PASS: OECD SOVEREIGN FISCAL COVERAGE AUDIT COMPLETE - NO WRITES' oecd-sovereign-fiscal-coverage.log
          jq -e '.writes_performed == false' oecd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.methodology_boundary.direct_merge_allowed == false' oecd-sovereign-fiscal-coverage.json >/dev/null
          jq -e '.concepts | length == 2' oecd-sovereign-fiscal-coverage.json >/dev/null

      - name: Guard commercial and methodology boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'oecd_public_finance'" supabase/migrations/920_multi_source_commercial_registry.sql
          grep -q "'eia_international_energy'" supabase/migrations/920_multi_source_commercial_registry.sql
          grep -q "'usgs_earthquake_hazards'" supabase/migrations/920_multi_source_commercial_registry.sql
          grep -q "where source_id = 'un_comtrade'" supabase/migrations/920_multi_source_commercial_registry.sql
          grep -q "where source_id = 'imf_data'" supabase/migrations/920_multi_source_commercial_registry.sql
          if grep -A18 "'oecd_public_finance'" supabase/migrations/920_multi_source_commercial_registry.sql | grep -q "enabled_for_commercial_signals.*true"; then
            echo "::error::OECD must not be promoted to commercial Risk Gate signals before harmonisation evidence"
            exit 1
          fi
          echo "PASS: multi-source activation remains fail-closed until adapter + methodology evidence exists"

      - name: Upload source coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oecd-sovereign-fiscal-coverage
          path: |
            oecd-sovereign-fiscal-coverage.json
            oecd-sovereign-fiscal-coverage.log
          if-no-files-found: warn
          retention-days: 30
