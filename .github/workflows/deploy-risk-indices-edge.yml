name: Deploy Risk Indices Edge

# Redeploy Risk Indices only with an existing successful full B2 readback
# artifact. A narrowly scoped Worker-code push may trigger that recovery;
# no recurring polling, arbitrary source deploy or synthetic GRI proof.
# Manual and successful upstream publisher triggers retain strict proof checks.
on:
  workflow_dispatch: {}
  # A worker-code-only redeploy is independent of a NEW publisher snapshot.
  # It must still materialize an already full-B2-readback-verified main-run
  # artifact before secrets are used or Cloudflare deployment is attempted.
  # Never deploy for ordinary source/workflow commits or on a schedule.
  push:
    branches: [main]
    paths:
      - "workers/risk-indices-edge/src/index.mjs"
      - "workers/risk-indices-edge/wrangler.jsonc"
      - "workers/shared/current-source-clock.mjs"
      - "workers/shared/b2-origin-negative-cache.mjs"
      - "scripts/ops/configure-risk-indices-edge-d1-quota.mjs"
      - ".github/workflows/deploy-risk-indices-edge.yml"
  workflow_run:
    workflows: ["Risk Indices Realtime Direct Postgres"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: geomacro-risk-indices-edge-production
  cancel-in-progress: false

jobs:
  deploy-accept:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      WRANGLER_VERSION: "4.136.3"
      EXPECTED_URL: https://geomacro-risk-indices.daspallab202391.workers.dev
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Require existing production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 2; }
          test -n "$B2_ARCHIVE_READ_KEY_ID" || { echo "B2_ARCHIVE_READ_KEY_ID is required"; exit 2; }
          test -n "$B2_ARCHIVE_READ_APPLICATION_KEY" || { echo "B2_ARCHIVE_READ_APPLICATION_KEY is required"; exit 2; }

      - name: Materialize latest B2-readback-verified Risk Indices continuity
        id: continuity
        # The triggering successful source run is mandatory for workflow_run,
        # avoiding fallback to a different/stale artifact on production re-deploy.
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          TRIGGER_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/ops/prepare-edge-continuity.sh \
            risk-indices \
            risk-indices-realtime-direct-postgres.yml \
            geomacro.public-risk-indices-direct-postgres-publish.v1 \
            workers/risk-indices-edge/src/continuity.mjs; then
            echo "VERIFIED_RISK_INDICES_CONTINUITY_MATERIALIZED"
            echo "code_only=false" >> "$GITHUB_OUTPUT"
          elif [ "$TRIGGER_EVENT" = "push" ]; then
            # Do not accidentally overwrite a still healthy previously
            # materialized static continuity package with null when the
            # original artifact has merely aged out of GitHub retention.
            # A verified currently serving 200 requires preservation
            # through a separately reviewed/manual recovery path.
            # A bare HTTP 200 is insufficient: old continuity can be
            # historically verified but outside the native 60m live window.
            # A genuinely fresh verified response is preserved; an expired
            # or unproven old 200 must not block a fail-closed code patch.
            EXISTING_CODE="$(curl -sS -D /tmp/indices-existing.headers -o /tmp/indices-existing.json -w '%{http_code}' --max-time 10 "$EXPECTED_URL/risk-indices" || true)"
            DECISION="$(node scripts/ops/assess-risk-indices-code-deploy.mjs "$EXISTING_CODE" /tmp/indices-existing.headers /tmp/indices-existing.json)" || {
              echo "::error::RISK_INDICES_EXISTING_EDGE_UNVERIFIED"
              exit 13
            }
            if [ "$DECISION" = "PRESERVE_VERIFIED_CURRENT_EDGE" ]; then
              echo "PRESERVE_VERIFIED_CURRENT_EDGE; refusing to overwrite recent original-source continuity without proof"
              exit 13
            fi
            test "$DECISION" = "SAFE_CODE_ONLY_NULL_CONTINUITY" || exit 13
            # A code-only deployment must not depend on a new/frozen
            # Supabase publisher. Deploy code with an explicitly EMPTY
            # backup; the Worker can still serve any independently
            # verified D1 hot/POP/B2 proof. If all are unavailable it
            # returns 503, never manufactured risk nor payable data.
            printf 'export default null;\n' > workers/risk-indices-edge/src/continuity.mjs
            test "$(cat workers/risk-indices-edge/src/continuity.mjs)" = 'export default null;'
            echo "SAFE_CODE_ONLY_DEPLOY_WITH_NO_STATIC_CONTINUITY; hot proof remains unavailable"
            echo "code_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "FULL_B2_READBACK_PROOF_REQUIRED_FOR_SOURCE_RUN_OR_MANUAL_DEPLOY"
            exit 12
          fi

      - name: Bind existing main-owned D1 budget and verify v5 shared quota schema
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          D1_DATABASE_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let data="";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const databases=JSON.parse(data);
              const matched=databases.filter(db => db.name === "geomacro-control-plane");
              if (matched.length !== 1) process.exit(2);
              process.stdout.write(String(matched[0].uuid ?? matched[0].id ?? ""));
            });
          ')"
          test -n "$D1_DATABASE_ID" || { echo "Existing main-owned D1 quota database unavailable"; exit 2; }
          export D1_DATABASE_ID
          node scripts/ops/configure-risk-indices-edge-d1-quota.mjs
          PROOF="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 execute B2_QUOTA_DB \
            --remote --json \
            --config workers/risk-indices-edge/wrangler.runtime.jsonc \
            --command "SELECT (SELECT version FROM schema_meta WHERE name='control-plane') AS version, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='b2_account_daily_request_quota') AS quota_table;")"
          printf '%s' "$PROOF" | node -e '
            let data="";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const body=JSON.parse(data);
              const results=Array.isArray(body) ? body : body?.result;
              const rows=Array.isArray(results) ? results.flatMap(x => x?.results ?? []) : [];
              if (rows.length !== 1 || Number(rows[0].version) < 5 || Number(rows[0].quota_table) !== 1) {
                throw new Error("SHARED_B2_D1_QUOTA_SCHEMA_V5_REQUIRED");
              }
              console.log("PASS: Risk Indices B2 fallback shares existing D1 atomic quota ledger.");
            });
          '

      - name: Deploy read-only Risk Indices Worker with pinned Wrangler
        id: deploy
        working-directory: workers/risk-indices-edge
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_LOG="$(mktemp)"
          npx -y "wrangler@${WRANGLER_VERSION}" deploy --config wrangler.runtime.jsonc 2>&1 | tee "$DEPLOY_LOG"
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)"
          test -n "$DEPLOYMENT_URL" || { echo "Wrangler deploy did not emit a workers.dev URL"; exit 3; }
          test "$DEPLOYMENT_URL" = "$EXPECTED_URL" || { echo "Unexpected worker URL: $DEPLOYMENT_URL"; exit 3; }
          printf '%s' "$B2_ARCHIVE_READ_KEY_ID" | npx -y "wrangler@${WRANGLER_VERSION}" secret put B2_KEY_ID --config wrangler.runtime.jsonc >/tmp/risk-indices-edge-b2-key.log
          printf '%s' "$B2_ARCHIVE_READ_APPLICATION_KEY" | npx -y "wrangler@${WRANGLER_VERSION}" secret put B2_APPLICATION_KEY --config wrangler.runtime.jsonc >/tmp/risk-indices-edge-b2-secret.log
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Risk Indices code separately from signed-product availability
        if: steps.continuity.outputs.code_only != 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geomacro-edge-code-check
          headers="/tmp/geomacro-edge-code-check/risk-indices.headers"
          body="/tmp/geomacro-edge-code-check/risk-indices.json"
          code="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$DEPLOYMENT_URL/risk-indices" || true)"
          node scripts/ops/verify-signed-edge-code-only.mjs "risk-indices" "$code" "$headers" "$body"
          echo "PASS: deployed Worker code verified; the next signed-product step remains independently fail-closed."

      - name: Require verified package through Risk Indices edge
        if: steps.continuity.outputs.code_only != 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          CODE=''
          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -sS -D /tmp/risk-indices-edge.headers -o /tmp/risk-indices-edge.json -w '%{http_code}' --max-time 15 "$DEPLOYMENT_URL/risk-indices" || true)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep $((attempt * 2))
          done
          test "$CODE" = "200" || { echo "Risk Indices edge acceptance failed: HTTP $CODE"; cat /tmp/risk-indices-edge.json || true; exit 4; }
          grep -qi '^x-geomacro-authority: backblaze-b2-risk-indices-edge' /tmp/risk-indices-edge.headers || { echo "Risk Indices verified authority header missing"; exit 4; }
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/risk-indices-edge.json', 'utf8'));
          const data = body?.data;
          if (body?.schema !== 'geomacro.public-risk-indices-live.v1') throw new Error('EDGE_SCHEMA_INVALID');
          if (body?.source_project !== 'ldpwajisioljyjtojvfx') throw new Error('EDGE_PROJECT_INVALID');
          if (data?.contractVersion !== 'risk-indices-v1.1.0' || data?.parentMethodologyVersion !== 'gri-v1.2.0' || data?.verificationStatus !== 'verified') {
            throw new Error('EDGE_RISK_INDICES_NOT_VERIFIED');
          }
          const required = new Set(['geopolitics','macro','critical_minerals']);
          for (const index of data?.indices ?? []) {
            if (!required.delete(index?.key) || index?.status !== 'available') throw new Error('EDGE_RISK_INDEX_INVALID');
            if (!Array.isArray(index?.series?.['7D']?.buckets) || index.series['7D'].buckets.length < 2) throw new Error(`EDGE_7D_HISTORY_INVALID:${index?.key}`);
            if (!Array.isArray(index?.series?.['30D']?.buckets) || index.series['30D'].buckets.length < index.series['7D'].buckets.length) throw new Error(`EDGE_30D_HISTORY_INVALID:${index?.key}`);
          }
          if (required.size) throw new Error('EDGE_RISK_INDEX_MISSING');
          console.log(JSON.stringify({ ok: true, snapshot_id: data.snapshotId, snapshot_as_of: data.snapshotAsOf }));
          NODE

      - name: Verify actual source freshness and new Worker revision
        if: steps.continuity.outputs.code_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {originalSourceIsCurrent} from "./workers/shared/current-source-clock.mjs";
          const body=JSON.parse(fs.readFileSync("/tmp/risk-indices-edge.json","utf8"));
          const raw=fs.readFileSync("/tmp/risk-indices-edge.headers","utf8");
          const header=(name)=>raw.split(/\r?\n/).filter(s=>s.toLowerCase().startsWith(name+":")).at(-1)?.slice(name.length+1).trim()??"";
          const native=body?.data?.snapshotAsOf;
          if(header("x-geomacro-native-clock-contract")!=="live-60m-v1")throw Error("INDICES_WORKER_CODE_NOT_ACTIVE");
          if(!originalSourceIsCurrent(native)||!originalSourceIsCurrent(header("x-geomacro-source-as-of"))||
             Date.parse(native)!==Date.parse(header("x-geomacro-source-as-of")))
            throw Error("INDICES_SOURCE_OLDER_THAN_60M");
          if(!(
             header("x-geomacro-b2-verification")==="full-readback-hash-exact-restore"||
             /^(github-actions-b2-readback-verified|d1-b2-readback-verified-hot-snapshot)$/.test(header("x-geomacro-continuity"))
          ))throw Error("INDICES_PUBLIC_PROOF_MISSING");
          if(/stale-while-revalidate|stale-if-error/.test(header("cache-control")))
            throw Error("INDICES_EXPIRED_CDN_REPLAY_ENABLED");
          console.log("PASS: current native Risk Indices source, new Worker code and B2/D1 proof");
          NODE

      - name: Verify code-only serving boundary without hot B2 GET
        if: steps.continuity.outputs.code_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for entry in 'GET /not-allowed 404' 'POST /risk-indices 405'; do
            read -r method route expected <<< "$entry"
            code="$(curl -sS -X "$method" -D /tmp/indices-code.headers -o /tmp/indices-code.json -w '%{http_code}' --max-time 12 "$EXPECTED_URL$route" || true)"
            test "$code" = "$expected" || { echo "::error::INDICES_CODE_ONLY_ROUTE_UNVERIFIED"; exit 4; }
            grep -qi '^x-geomacro-worker-code-contract: source-clock-guard-v1' /tmp/indices-code.headers ||
              { echo "::error::INDICES_DEPLOYED_CLOCK_GUARD_MISSING"; exit 4; }
          done
          echo "::notice::RISK_INDICES_CODE_ONLY_DEPLOYED_HOT_SIGNED_DATA_NOT_VERIFIED"
          echo "Worker code deployed, no B2 GET or signed-product HTTP 200 asserted." >> "$GITHUB_STEP_SUMMARY"

      - name: Check historical-only D1 Risk Indices metadata independently
        if: steps.continuity.outputs.code_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          history="https://geomacro-control-plane.daspallab202391.workers.dev/v1/public/historical-continuity/risk-indices"
          code="$(curl -sS --max-time 12 -o /tmp/indices-history.json -w '%{http_code}' "$history" || true)"
          if [ "$code" = "200" ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const v=JSON.parse(fs.readFileSync('/tmp/indices-history.json','utf8'));
          if(v.schema!=='geomacro.public-risk-indices-historical-continuity.v1'||
             v.product!=='risk-indices'||v.historical_only!==true||
             v.current_snapshot_available!==false||v.commercial_eligible!==false||
             v.x402_chargeable!==false||v.independently_rechecked_b2_now!==false)
            throw Error('HISTORICAL_INDICES_CONTRACT_INVALID');
          console.log('HISTORICAL_INDICES_CONTEXT_VERIFIED_ONLY_NOT_CURRENT');
          NODE
          elif [ "$code" = "503" ]; then
            echo "::notice::HISTORICAL_INDICES_READBACK_NOT_AVAILABLE; current signed indices remain 503"
          else
            echo "::error::HISTORICAL_INDICES_ROUTE_TRANSPORT_UNVERIFIED"
            exit 4
          fi

      - name: Confirm narrow non-destructive serving boundary
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/risk-indices-edge-deny.json -w '%{http_code}' --max-time 10 "$EXPECTED_URL/not-allowed" || true)"
          test "$CODE" = "404" || { echo "Unexpected generic read surface: HTTP $CODE"; exit 5; }
          CODE="$(curl -sS -X POST -o /tmp/risk-indices-edge-post.json -w '%{http_code}' --max-time 10 "$EXPECTED_URL/risk-indices" || true)"
          test "$CODE" = "405" || { echo "Unexpected write surface: HTTP $CODE"; exit 5; }
          echo "Risk Indices edge serves live B2 or bounded B2-readback-verified continuity only; no deploy-time B2 publish, Supabase mutation, or payment action occurred."
