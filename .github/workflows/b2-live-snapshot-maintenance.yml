name: B2 live public snapshot maintenance

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-b2-live-snapshot
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.repository == 'blocknine0/geomacro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish and read back verified B2 live snapshots
        run: bun scripts/ops/publish-b2-live-snapshots.ts
