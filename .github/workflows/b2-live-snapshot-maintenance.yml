name: B2 live public snapshot maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Quota-controlled maintenance path"
        required: true
        type: choice
        options: [rights-only, live-public]
        default: rights-only
  push:
    branches: [main]
    paths:
      - ".github/workflows/b2-live-snapshot-maintenance.yml"
      - "scripts/ops/publish-b2-live-snapshots.ts"
      - "scripts/ops/run-b2-snapshot-maintenance-with-preservation.mjs"
      - "src/lib/b2-live.server.ts"
      - "src/lib/commercial-source-eligibility.server.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-b2-live-snapshot
  cancel-in-progress: true

jobs:
  publish:
    # Frozen-Supabase recovery is an explicitly approved, main-only action.
    # Do not re-run legacy public snapshot writes for source-code pushes.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'live-public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish or preserve verified B2 live snapshots
        run: bun scripts/ops/run-b2-snapshot-maintenance-with-preservation.mjs live-public
  rights-only:
    # No new workflow or cron: a bounded, explicit dispatch of THIS workflow.
    # Its existing source registry still has to be read successfully; never
    # manufacture a fresh rights clock from an old B2 object.
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'rights-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # Read-only trusted project pooler / direct-Postgres path, never REST.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: rights_only_refresh
      B2_REQUEST_BUDGET: "6"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve D1 shared B2 quota ledger before any B2 request
        shell: bash
        run: |
          set -euo pipefail
          test "${B2_ACCOUNT_QUOTA_REQUIRED:-}" = "1"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Shared D1 quota token missing"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Shared D1 quota account missing"; exit 2; }
          list="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          id="$(printf '%s' "$list" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const row=JSON.parse(s).find(x=>x.name===process.env.D1_DATABASE_NAME);
              process.stdout.write(row?.uuid??row?.id??"");
            });
          ')"
          test -n "$id" || { echo "Shared D1 quota database missing"; exit 2; }
          echo "D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
      - name: Verify read-only project Postgres transport and existing B2 credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL B2_KEY_ID B2_APPLICATION_KEY; do
            test -n "${!name:-}" || { echo "$name absent: fail closed"; exit 2; }
          done
          command -v psql >/dev/null || { echo "psql unavailable: fail closed"; exit 2; }
          # Direct Postgres adapter validates project target and only allows
          # SELECT queries against enumerated source/certification relations.
      - name: Refresh full certified rights inventory independently of public hot snapshots
        run: bun scripts/ops/publish-b2-live-snapshots.ts rights-only

