name: Hosting Alignment

on:
  pull_request:
    paths:
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "src/**"
      - "server/**"
      - "docs/HOSTING_ALIGNMENT.md"
      - "docs/TESTNET_TESTER_DEPLOYMENT_CONFIG.md"
      - "scripts/ops/verify-hosting-alignment.mjs"
      - ".github/workflows/hosting-alignment.yml"
      - ".github/workflows/sync-lovable-main.yml"
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "src/**"
      - "server/**"
      - "docs/HOSTING_ALIGNMENT.md"
      - "docs/TESTNET_TESTER_DEPLOYMENT_CONFIG.md"
      - "scripts/ops/verify-hosting-alignment.mjs"
      - ".github/workflows/hosting-alignment.yml"
      - ".github/workflows/sync-lovable-main.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify GitHub Supabase Lovable alignment
        run: bun run hosting:verify

      - name: Verify public data boundary
        run: bunx vitest run src/__tests__/public-data-proxy-contract.test.ts

      - name: Verify Lovable-compatible production build
        run: bun run build
