name: Pre-Mainnet x402 Zero-Fund Acceptance

on:
  pull_request:
    paths:
      - "src/lib/coinbase-x402.server.ts"
      - "src/lib/coinbase-x402.server.test.ts"
      - "src/lib/geomacro-intelligence-contract.ts"
      - "src/lib/agent-query-*.ts"
      - "src/lib/agent-commerce-delivery.server.ts"
      - "src/routes/api.x402.intelligence.ts"
      - "src/routes/api.x402.risk_.availability.ts"
      - "scripts/agentic/coinbase-x402-adaptive-base-sepolia-e2e.mjs"
      - "scripts/verify-launch-readiness.mjs"
      - "scripts/agentic/verify-live-x402-prelaunch-availability.mjs"
      - "scripts/ops/probe-structural-serving-production.mjs"
      - "scripts/ops/probe-structural-base-tables-production.mjs"
      - "scripts/ops/probe-risk-object-production.mjs"
      - "supabase/migrations/927_coinbase_x402_delivery_ledger.sql"
      - "supabase/migrations/947_agent_commerce_production_reconciliation.sql"
      - ".github/workflows/pre-mainnet-x402-zero-fund-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-mainnet-x402-zero-fund-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies without install scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build candidate
        run: bun run build

      - name: Run payment and structured-delivery contract suite
        run: >-
          bunx vitest run
          src/lib/coinbase-x402.server.test.ts
          src/__tests__/coinbase-x402-mainnet-zero-fund-rehearsal.test.ts
          src/__tests__/coinbase-x402-adaptive-availability-static.test.ts
          src/__tests__/pre-mainnet-x402-readiness.test.ts
          src/__tests__/agent-commerce-delivery-ledger-static.test.ts
          src/__tests__/production-agent-commerce-reconciliation-static.test.ts
          src/__tests__/public-intelligence-machine-surfaces-static.test.ts

      - name: Verify database migration safety
        run: bun run db:safety

      - name: Verify hosting/source alignment
        run: bun run hosting:verify

      - name: Verify source launch policy remains locked
        run: node scripts/verify-launch-readiness.mjs

      - name: Verify live public x402 prelaunch safety and no-charge deliverability
        id: live_preflight
        continue-on-error: true
        run: node scripts/agentic/verify-live-x402-prelaunch-availability.mjs

      - name: Classify production data probe configuration
        id: data_config
        shell: bash
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HISTORICAL_SUPABASE_URL: ${{ secrets.HISTORICAL_SUPABASE_URL }}
          HISTORICAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HISTORICAL_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          configured=true
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY HISTORICAL_SUPABASE_URL HISTORICAL_SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              configured=false
            fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ "$configured" == "true" ]]; then
            echo "Production structural data probe configuration is present."
          else
            echo "::notice::Production structural data probe configuration is incomplete. PR validation remains zero-fund; explicit manual pre-mainnet acceptance stays blocked until configuration is complete."
          fi

      - name: Verify production structural serving dependencies
        if: ${{ steps.data_config.outputs.configured == 'true' }}
        id: data_probes
        continue-on-error: true
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HISTORICAL_SUPABASE_URL: ${{ secrets.HISTORICAL_SUPABASE_URL }}
          HISTORICAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HISTORICAL_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node scripts/ops/probe-structural-serving-production.mjs
          s1=$?
          node scripts/ops/probe-structural-base-tables-production.mjs
          s2=$?
          node scripts/ops/probe-risk-object-production.mjs
          s3=$?
          if ((s1 != 0 || s2 != 0 || s3 != 0)); then exit 1; fi

      - name: Final zero-fund acceptance gate
        id: final_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          LIVE_OUTCOME: ${{ steps.live_preflight.outcome }}
          DATA_CONFIGURED: ${{ steps.data_config.outputs.configured }}
          DATA_OUTCOME: ${{ steps.data_probes.outcome }}
        run: |
          set -euo pipefail
          if [[ "$LIVE_OUTCOME" != "success" ]]; then
            echo "::error::Live public x402 preflight did not pass."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DATA_CONFIGURED" != "true" ]]; then
              echo "::error::Explicit pre-mainnet acceptance requires the authoritative app and historical production data credentials."
              exit 1
            fi
            if [[ "$DATA_OUTCOME" != "success" ]]; then
              echo "::error::Production data-serving dependency probes did not pass."
              exit 1
            fi
            echo "PASS: explicit zero-fund pre-mainnet acceptance verified live safety and production data-serving dependencies."
            exit 0
          fi

          if [[ "$DATA_CONFIGURED" == "true" && "$DATA_OUTCOME" != "success" ]]; then
            echo "::error::Configured production data-serving dependency probes failed on this PR."
            exit 1
          fi

          if [[ "$DATA_CONFIGURED" != "true" ]]; then
            echo "PASS: PR zero-fund code/safety validation passed; production data configuration remains an explicit manual launch blocker."
          else
            echo "PASS: PR zero-fund validation and configured production data probes passed."
          fi

      - name: Record zero-fund boundary
        if: always()
        run: |
          {
            echo "## Pre-Mainnet x402 Zero-Fund Acceptance"
            echo
            echo "- Mainnet activation: **false**"
            echo "- Real payment attempted: **false**"
            echo "- Production funds authorized: **false**"
            echo "- External revenue claimed: **false**"
            echo "- Structured response validated before settlement: **true**"
            echo "- Replay/no-double-charge contract validated: **true**"
            echo "- Live no-charge preflight: **${{ steps.live_preflight.outcome }}**"
            echo "- Production data credentials configured: **${{ steps.data_config.outputs.configured }}**"
            echo "- Production data dependency probes: **${{ steps.data_probes.outcome }}**"
            echo "- Explicit manual acceptance requires production data probes: **true**"
          } >> "$GITHUB_STEP_SUMMARY"
