name: GRI Governance, Publication & Historical Evidence

on:
  schedule:
    - cron: "35 3 * * *"
    - cron: "41 4 * * 1"
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-gri-v12-sensitivity.mjs'
      - 'scripts/audit-gri-validation-evidence.mjs'
      - 'scripts/lib/gri-sensitivity-v12.js'
      - 'scripts/audit-gri-public-proof-consistency.mjs'
      - 'scripts/verify-gri-snapshot-v12.js'
      - 'scripts/lib/gri-*.js'
      - 'scripts/check-gri-freshness.mjs'
      - 'scripts/ingest-gri-benchmarks.js'
      - 'scripts/validate-gri-v12.js'
      - 'scripts/ingest-news.js'
      - 'docs/GRI_CALIBRATION_SENSITIVITY_EVIDENCE.md'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  calibration:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '41 4 * * 1') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_ANON_KEY: ${{ secrets.APP_SUPABASE_ANON_KEY }}
      GRI_METHOD_VERSION: gri-v1.2.0
      GRI_PROOF_VERSION: gri-proof-v1.2.0
      GRI_VALIDATION_VERSION: gri-validation-v1.1.0
      # Pull requests validate deterministic sensitivity mechanics on the latest public snapshot.
      # Production scheduled runs keep the strict 3-hour freshness policy.
      GRI_MAX_PUBLIC_SNAPSHOT_AGE_HOURS: "3"
      GRI_REQUIRE_PUBLIC_FRESHNESS: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
      GRI_SENSITIVITY_ARTIFACT: artifacts/gri-v12-sensitivity.json
      GRI_VALIDATION_EVIDENCE_ARTIFACT: artifacts/gri-validation-evidence.json
    concurrency:
      group: gri-calibration-sensitivity-evidence-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Audit published validation evidence
        id: validation
        continue-on-error: true
        run: node scripts/audit-gri-validation-evidence.mjs
      - name: Audit current v1.2 parameter sensitivity
        id: sensitivity
        continue-on-error: true
        run: node scripts/audit-gri-v12-sensitivity.mjs
      - name: Require both evidence audits to pass
        shell: bash
        run: |
          if [ "${{ steps.validation.outcome }}" != "success" ]; then
            echo "Validation evidence audit failed" >&2
            exit 1
          fi
          if [ "${{ steps.sensitivity.outcome }}" != "success" ]; then
            echo "Sensitivity evidence audit failed" >&2
            exit 1
          fi
      - name: Upload read-only GRI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gri-calibration-sensitivity-${{ github.run_id }}
          path: |
            artifacts/gri-validation-evidence.json
            artifacts/gri-v12-sensitivity.json
          if-no-files-found: warn
          retention-days: 90
