name: Fragment B2 Verified Cleanup
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VERIFIED_RESTORE_PASSED after restore canary succeeds"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fragment-b2-verified-cleanup
  cancel-in-progress: false
jobs:
  cleanup-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APP_SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_FRAGMENT_ARCHIVE_LIMIT: "1"
      B2_FRAGMENT_MIN_AGE_HOURS: "168"
      B2_FRAGMENT_DELETE_SOURCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Require verified restore acknowledgement
        run: test "${{ inputs.confirmation }}" = "VERIFIED_RESTORE_PASSED"
      - name: Run fail-closed verified cleanup canary
        run: node scripts/ops/b2-fragment-archive-offload.mjs
