name: Bootstrap Base Sepolia Owner Gas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-base-sepolia-owner-gas.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bootstrap-base-sepolia-owner-gas
  cancel-in-progress: false

jobs:
  fund-owner:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      TARGET_ADDRESS: '0x0C8fb1055C22dF132659f3C453dd7B2093f7AD58'
      TARGET_MIN_WEI: '500000000000000'
      A2AWIRE_FAUCET_URL: https://a2awire.com/agents/faucet/invoke

    steps:
      - name: Validate bounded testnet-only configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_ADDRESS" != "0x0C8fb1055C22dF132659f3C453dd7B2093f7AD58" ]; then
            echo "::error::Unexpected Base Sepolia faucet target."
            exit 1
          fi
          echo "Network: Base Sepolia / eip155:84532" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $TARGET_ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Purpose: testnet deployment gas only" >> "$GITHUB_STEP_SUMMARY"
          echo "Maximum requested faucet amount: 0.0005 test ETH" >> "$GITHUB_STEP_SUMMARY"
          echo "Commercial revenue: false" >> "$GITHUB_STEP_SUMMARY"
          echo "Mainnet enabled: false" >> "$GITHUB_STEP_SUMMARY"

      - name: Read current Base Sepolia balance
        id: before
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(curl -fsS --max-time 15 \
            -H 'content-type: application/json' \
            -H 'user-agent: geomacro-testnet-bootstrap/1.0' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBalance","params":["'"$TARGET_ADDRESS"'","latest"]}' \
            "$BASE_SEPOLIA_RPC_URL" | jq -r '.result')"
          if ! [[ "$RESULT" =~ ^0x[0-9a-fA-F]+$ ]]; then
            echo "::error::Unable to read Base Sepolia owner balance."
            exit 1
          fi
          BALANCE_WEI="$((RESULT))"
          echo "balance_wei=$BALANCE_WEI" >> "$GITHUB_OUTPUT"
          echo "Base Sepolia ETH before bootstrap (wei): $BALANCE_WEI"

      - name: Request one public Base Sepolia faucet drip when needed
        if: ${{ fromJSON(steps.before.outputs.balance_wei) < 500000000000000 }}
        shell: bash
        run: |
          set -euo pipefail

          BODY_FILE="$RUNNER_TEMP/a2awire-faucet-response.json"
          HTTP_CODE="$(curl -sS --max-time 30 \
            -o "$BODY_FILE" \
            -w '%{http_code}' \
            -X POST "$A2AWIRE_FAUCET_URL" \
            -H 'content-type: application/json' \
            -H 'user-agent: geomacro-testnet-bootstrap/1.0' \
            --data '{"task":"request_testnet_eth","input":{"address":"'"$TARGET_ADDRESS"'"}}')"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            SAFE_ERROR="$(jq -r '.error.code // .error // .message // "unknown faucet error"' "$BODY_FILE" 2>/dev/null || echo 'unknown faucet error')"
            echo "::error::Public Base Sepolia faucet failed with HTTP $HTTP_CODE: $SAFE_ERROR"
            exit 1
          fi

          TX_HASH="$(jq -r '.output.tx_hash // .tx_hash // empty' "$BODY_FILE")"
          AMOUNT_WEI="$(jq -r '.output.amount_wei // .amount_wei // empty' "$BODY_FILE")"
          if ! [[ "$TX_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Faucet response did not contain a valid Base Sepolia transaction hash."
            exit 1
          fi
          if [ -n "$AMOUNT_WEI" ] && [ "$AMOUNT_WEI" != "$TARGET_MIN_WEI" ]; then
            echo "::error::Faucet returned an unexpected test ETH amount."
            exit 1
          fi

          echo "Base Sepolia faucet transaction: $TX_HASH"
          echo "Faucet transaction: \`$TX_HASH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify owner received enough Base Sepolia gas
        shell: bash
        run: |
          set -euo pipefail
          BALANCE_WEI=0
          for attempt in $(seq 1 45); do
            RESULT="$(curl -fsS --max-time 15 \
              -H 'content-type: application/json' \
              -H 'user-agent: geomacro-testnet-bootstrap/1.0' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBalance","params":["'"$TARGET_ADDRESS"'","latest"]}' \
              "$BASE_SEPOLIA_RPC_URL" | jq -r '.result')"
            if [[ "$RESULT" =~ ^0x[0-9a-fA-F]+$ ]]; then
              BALANCE_WEI="$((RESULT))"
              if [ "$BALANCE_WEI" -ge "$TARGET_MIN_WEI" ]; then
                break
              fi
            fi
            sleep 2
          done

          if [ "$BALANCE_WEI" -lt "$TARGET_MIN_WEI" ]; then
            echo "::error::Base Sepolia owner balance remains below deployment minimum after faucet settlement wait."
            exit 1
          fi

          echo "PASS: Base Sepolia owner deployment gas ready at $BALANCE_WEI wei"
          echo "Verified Base Sepolia deployment gas (wei): $BALANCE_WEI" >> "$GITHUB_STEP_SUMMARY"
          echo "Mainnet transaction executed: false" >> "$GITHUB_STEP_SUMMARY"
