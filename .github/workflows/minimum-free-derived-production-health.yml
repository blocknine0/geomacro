name: Minimum Free Derived Production Health (No Funds)

# Primary website acceptance for the currently offered free-source, unscored product.
# No signing / paid-source dependency; never green-lights paid GRI/GRO or x402.
on:
  workflow_dispatch: {}
  schedule:
    # Best-effort, 12 small public readbacks/day. Zero B2, D1 writes or payments.
    - cron: "23 */2 * * *"
    # Single daily actual Chromium QA; do not download a browser every 2h.
    - cron: "49 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/minimum-free-derived-production-health.yml"
      - "scripts/ops/verify-minimum-free-production-health.mjs"
      - "scripts/ops/verify-minimum-free-production-health.test.mjs"
      - "scripts/ops/verify-website-real-browser.mjs"
      - "scripts/ops/verify-website-real-browser.test.mjs"
      - "scripts/ops/derived-news-latency-audit.mjs"
      - "scripts/ops/derived-news-latency-audit.test.mjs"
      - "scripts/ops/verify-three-domain-outside-in.mjs"
      - "scripts/ops/verify-three-domain-outside-in.test.mjs"
      - "src/lib/free-derived-deep-health.server.ts"
      - "src/lib/free-derived-deep-health.server.test.ts"
      - "src/routes/api.health.ts"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geomacro-minimum-free-production-health
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify minimum mode does not greenwash signed products or paid readiness
        run: |
          node --check scripts/ops/verify-minimum-free-production-health.mjs
          node --check scripts/ops/verify-website-real-browser.mjs
          node --test scripts/ops/verify-minimum-free-production-health.test.mjs scripts/ops/derived-news-latency-audit.test.mjs scripts/ops/verify-website-real-browser.test.mjs
          node --check scripts/ops/verify-three-domain-outside-in.mjs
          node --test scripts/ops/verify-three-domain-outside-in.test.mjs

  independent-three-domain-parity:
    # Read-only acceptance of source-neutral D1 IDs -> static archive ->
    # actual public website SSR; never a payable or partner acceptance.
    # Reuse existing 2h website-health cadence, with no new cron or writers.
    needs: offline-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Require matching public D1 IDs, native dates, static archive and three website categories
        env:
          # Ordinary schedules permit truthful empty categories. A requested
          # one-time push/PR acceptance requires positive three-domain proof.
          GEOMACRO_REQUIRE_THREE_CATEGORY_POSITIVE: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: node scripts/ops/verify-three-domain-outside-in.mjs

  public-free-site:
    needs: offline-contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact-main permanent static archive and first HTML without funds
        env:
          GITHUB_SHA: ${{ github.sha }}
          # Default ephemeral, read-only Actions token. Used only for an exact
          # canonical compare when the deployed site SHA is an older ancestor.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ops/verify-minimum-free-production-health.mjs

      - name: Verify static-archive free-product health endpoint without implying signed readiness
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch("https://geomacro.live/api/health?deep=1&profile=free-derived",{
            headers:{Accept:"application/json"},redirect:"error",
            signal:AbortSignal.timeout(15000),
          });
          if(!(response.headers.get("content-type")??"").includes("application/json"))
            throw Error("FREE_PRODUCT_HEALTH_NON_JSON");
          const v=await response.json();
          // Only shape, status and fixed/sanitized reason codes; never log
          // Archive story bodies, source identity, API headers or paid credentials.
          const safe=x=>String(x??"missing").replace(/[^A-Za-z0-9_.-]/g,"").slice(0,64);
          console.log(JSON.stringify({
            schema:"geomacro.free-product-hosting-route-diagnostic.v1",
            http_status:response.status,returned_schema:safe(v.schema),
            returned_reason:safe(v.reason??v.error),
            eligible_derived_rows:Number.isSafeInteger(v.current_72h_derived_rows)
              ?v.current_72h_derived_rows:null,
            valid_free_profile_contract:v.schema==="geomacro.free-derived-deep-health.v1",
            private_stories_logged:false,payments:0,
          }));
          // Static archive reads are the product path. Archive transport or
          // current-row failures are real free-product failures, not a waiver.
          if(response.status!==200||v.ok!==true||
             v.schema!=="geomacro.free-derived-deep-health.v1"||
             v.current_72h_derived_rows<1||
             v.current_signed_hot_snapshots_attested!==false||
             v.legacy_signed_intelligence_gri_risk_indices!=="NOT_EVALUATED_IN_THIS_PROFILE"||
             v.current_numerical_gri_verified!==false||
             v.free_website_ssr_attested!==false||
             v.x402_payment_authorized!==false||
             v.chargeable!==false||v.settlement_performed!==false)
            throw Error("FREE_PRODUCT_HEALTH_NOT_READY_OR_MISREPRESENTED");
          console.log(JSON.stringify({schema:"geomacro.free-derived-deep-health-outside-in.v1",
            status:response.status,free_rows:v.current_72h_derived_rows,
            category_counts:v.categories,legacy_signed_attested:false,payments:0}));
          NODE

      # Run independently even when the health endpoint fails, so the language
      # regression is never hidden behind an earlier product-health blocker.
      - name: Verify published language pack uses the single route-preserving controller
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://geomacro.live';
          const [pageResponse,scriptResponse]=await Promise.all([
            fetch(base+'/',{headers:{Accept:'text/html','Cache-Control':'no-cache'},
              redirect:'error',signal:AbortSignal.timeout(12000)}),
            fetch(base+'/geomacro-language.js?health='+Date.now(),{
              headers:{Accept:'text/javascript','Cache-Control':'no-cache'},
              redirect:'error',signal:AbortSignal.timeout(12000)}),
          ]);
          if(!pageResponse.ok||!scriptResponse.ok)throw Error('LIVE_LANGUAGE_PACK_HTTP_UNAVAILABLE');
          const html=await pageResponse.text();
          const script=await scriptResponse.text();
          if(!html.includes('/geomacro-language.js')||
             !script.includes('window.GeomacroLanguage')||
             !script.includes('new URL("https://translate.google.com/translate")')||
             !script.includes('translated.searchParams.set("tl", code)')||
             !script.includes('translated.searchParams.set("u", source.toString())')||
             script.includes('handleMenuLanguage')||
             script.includes('geomacro-live.translate.goog'))
            throw Error('LIVE_LANGUAGE_PACK_SINGLE_CONTROLLER_OR_ROUTE_PRESERVATION_INVALID');
          console.log(JSON.stringify({schema:'geomacro.website-language-pack-live.v1',
            homepage_script_reference:true,shared_controller:true,canonical_translate_redirect:true,
            competing_menu_handlers:false,paid_services:0,payments:0}));
          NODE

  independent-real-browser:
    needs: public-free-site
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event.schedule == '49 2 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install sandboxed temporary Chromium harness without changing project dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/geomacro-browser-qa
          npm install --prefix /tmp/geomacro-browser-qa --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/geomacro-browser-qa/node_modules/.bin/playwright install chromium
      - name: Verify published desktop/mobile JavaScript, navigation, Ask and source parity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEOMACRO_PLAYWRIGHT_MODULE: /tmp/geomacro-browser-qa/node_modules/playwright/index.mjs
        run: node scripts/ops/verify-website-real-browser.mjs
