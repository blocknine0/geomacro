name: Production Testnet Retirement Health

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-testnet-health.yml"
      - "server/middleware/05-retire-public-testnet-surfaces.ts"
      - "src/routes/data-api.tsx"
      - "src/routes/api.health.ts"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-production-testnet-retirement-health
  cancel-in-progress: true

jobs:
  production-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://geomacro.live
    steps:
      - name: Verify current production serving alignment
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/health")"
          echo "Final HTTP status: $code"
          test "$code" = "200"
          for marker in \
            '"alignment_contract":"github-main-b2-primary-supabase-standby-lovable-v2"' \
            '"production_data_authority":"backblaze-b2"' \
            '"commerce_control_plane":"cloudflare-durable-objects"' \
            '"supabase_role":"ingestion-recovery-standby"'
          do
            grep -Fq "$marker" "$body"
          done
          echo "PASS: current production alignment is B2/Durable-Objects serving with Supabase standby."

      - name: Verify retired buyer-facing Testnet deep links
        shell: bash
        run: |
          set -euo pipefail
          for path in /testnet-access /testnet-console; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -D "$headers" -o "$body" -w '%{http_code}' "$BASE_URL$path")"
            echo "$path HTTP=$code"
            if [[ "$code" != "308" ]]; then
              echo "::error title=Retired Testnet surface reachable::$path must permanently redirect to /data-api; got HTTP $code."
              head -c 800 "$body" || true
              exit 1
            fi
            if ! grep -Eqi '^location:[[:space:]]*/data-api([?#].*)?[[:space:]]*$' "$headers"; then
              echo "::error title=Retired Testnet redirect target invalid::$path did not redirect to /data-api."
              cat "$headers"
              exit 1
            fi
          done
          echo "PASS: buyer-facing legacy Testnet deep links are permanently retired to /data-api."

      - name: Verify canonical governed-data landing page
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' "$BASE_URL/data-api")"
          test "$code" = "200"
          python - "$body" <<'PY'
          import html
          import pathlib
          import sys
          text = html.unescape(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if "GOVERNED DATA" not in text:
              raise SystemExit("/data-api did not render the governed-data marker")
          PY
          echo "PASS: retired Testnet entrypoints resolve to the governed commercial data surface."

      - name: Verify public Risk Object trust registry remains available
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/risk-object-keys")"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const active = Array.isArray(body?.keys) ? body.keys.filter((item) => item?.status === 'active') : [];
          if (body?.ok !== true || active.length === 0) {
            throw new Error('Public Risk Object trust registry has no active key');
          }
          NODE
          echo "PASS: public Risk Object trust registry remains reachable after Testnet retirement."

      - name: Summary
        run: |
          echo "PASS: legacy buyer-facing Testnet routes are retired without weakening production trust or serving boundaries."
          echo "Source-level Testnet contracts remain in the repository for technical validation and recovery; they are not launch-critical public product surfaces."
