name: Global P0 source endpoint probe

on:
  workflow_dispatch:
  schedule:
    # Ten existing P0 source endpoints, one bounded private read each per day.
    - cron: "33 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-p0-source-probe.yml"
      - "config/global-p0-source-expansion.json"
      - "scripts/ops/observe-p0-private-source-runtime.mjs"
      - "global-intelligence/adapters/china-mofcom.mjs"
      - "scripts/tests/existing-source-runtime-activation.test.mjs"
      - "scripts/lib/mofcom-ministry-2026-announcements.mjs"
      - "scripts/tests/mofcom-ministry-2026-announcements.test.mjs"
      - "scripts/tests/mofcom-clock-no-crawl-imputation.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "config/global-p0-source-expansion.json"
      - "global-intelligence/adapters/**"
      - "scripts/tests/cochilco-observation-clock.test.mjs"
      - "scripts/test-p0-adapters.mjs"
      - "scripts/tests/macro-statistical-reference-clock.test.mjs"
      - "scripts/test-p0-adapter-certification.mjs"
      - "scripts/test-p0-live-schema-certification.mjs"
      - "scripts/test-p0-registry-alignment.mjs"
      - "scripts/ops/observe-p0-private-source-runtime.mjs"
      - "global-intelligence/adapters/china-mofcom.mjs"
      - "scripts/lib/mofcom-ministry-2026-announcements.mjs"
      - "scripts/tests/mofcom-ministry-2026-announcements.test.mjs"
      - "scripts/tests/mofcom-clock-no-crawl-imputation.test.mjs"
      - "scripts/test-global-p0-source-endpoints.mjs"
      - "global-intelligence/sources/source-registry.v1.json"
      - "global-intelligence/sources/free-source-catalog.v1.json"
      - "global-intelligence/sources/source-gap-matrix.v1.md"
      - "supabase/migrations/974_global_source_p0_expansion.sql"
      - ".github/workflows/global-p0-source-probe.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-existing-p0-source-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    # Preserve legacy PR certification; protected runs use bounded private reads.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Probe authoritative source endpoints
        run: |
          mkdir -p artifacts
          node scripts/test-global-p0-source-endpoints.mjs > artifacts/global-p0-source-probe.json

      - name: Test MOFCOM original clock is never borrowed from crawl time
        run: node --test scripts/tests/mofcom-clock-no-crawl-imputation.test.mjs

      - name: Test free official Chinese ministry reference fails closed
        run: node --test scripts/tests/mofcom-ministry-2026-announcements.test.mjs

      - name: Test P0 registry alignment
        run: node scripts/test-p0-registry-alignment.mjs

      - name: Test P0 normalization adapters
        run: node scripts/test-p0-adapters.mjs
      - name: Require Macro reference periods are not publisher dates
        run: node --test scripts/tests/macro-statistical-reference-clock.test.mjs
      - name: Verify COCHILCO monthly reference clock is never a release clock
        run: node --test scripts/tests/cochilco-observation-clock.test.mjs

      - name: Test P0 certification gates
        run: node scripts/test-p0-adapter-certification.mjs

      - name: Test live P0 transport and schema
        run: node scripts/test-p0-live-schema-certification.mjs

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: global-p0-source-probe
          path: artifacts/global-p0-source-probe.json
          if-no-files-found: error

  private-source-runtime:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Test bounded existing-source activation
        run: node --test scripts/tests/existing-source-runtime-activation.test.mjs
      - name: Verify MOFCOM crawl clock cannot masquerade as original release
        run: node --test scripts/tests/mofcom-clock-no-crawl-imputation.test.mjs
      - name: Verify Ministry same-publisher alternate never grants commercial rights
        run: node --test scripts/tests/mofcom-ministry-2026-announcements.test.mjs
      - name: Read all ten existing P0 sources with canonical private parsers
        run: node scripts/ops/observe-p0-private-source-runtime.mjs
      - name: Preserve source-free aggregate findings, including upstream failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p0-private-source-runtime-${{ github.run_id }}
          path: artifacts/p0-private-source-runtime/receipt.json
          if-no-files-found: error
          retention-days: 3
