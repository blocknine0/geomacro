name: GOAT Coordinated Launch Lock Sync

on:
  push:
    branches:
      - feat/commercial-distribution-foundation
    paths:
      - ".github/workflows/goat-global-lock-sync-temp.yml"

permissions:
  contents: write

jobs:
  patch-goat-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-distribution-foundation
      - name: Apply exact GOAT global launch lock patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/goat-flow.server.ts")
          text = path.read_text()

          import_anchor = 'import {\n  createHmac,\n  randomUUID,\n} from "node:crypto";\n\n'
          import_insert = import_anchor + 'import { assertCommercialLaunchAuthorized } from "./commercial-launch-gate.server";\n\n'
          if 'assertCommercialLaunchAuthorized } from "./commercial-launch-gate.server"' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("GOAT import anchor mismatch; refusing non-exact patch")
              text = text.replace(import_anchor, import_insert, 1)

          gate_anchor = '''  if (!environment) {
            throw new Error("GOATX402_ENVIRONMENT must be testnet3 or mainnet");
          }

          const expected = GOAT_FLOW_ENVIRONMENTS[environment];
          '''
          gate_insert = '''  if (!environment) {
            throw new Error("GOATX402_ENVIRONMENT must be testnet3 or mainnet");
          }

          if (environment === "mainnet") {
            assertCommercialLaunchAuthorized("goat_x402");
          }

          const expected = GOAT_FLOW_ENVIRONMENTS[environment];
          '''
          if 'assertCommercialLaunchAuthorized("goat_x402")' not in text:
              if text.count(gate_anchor) != 1:
                  raise SystemExit("GOAT config gate anchor mismatch; refusing non-exact patch")
              text = text.replace(gate_anchor, gate_insert, 1)

          path.write_text(text)
          PY
      - name: Verify patch scope and syntax anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assertCommercialLaunchAuthorized } from "./commercial-launch-gate.server"' src/lib/goat-flow.server.ts
          grep -q 'assertCommercialLaunchAuthorized("goat_x402")' src/lib/goat-flow.server.ts
          grep -q 'GOATX402_MAINNET_COMMERCIAL_ENABLED' src/lib/goat-pilot-service.server.ts
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/lib/goat-flow.server.ts"
      - name: Commit GOAT global launch lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/goat-flow.server.ts
          git commit -m "security: add GOAT coordinated launch lock"
          git push origin HEAD:feat/commercial-distribution-foundation
