name: GOAT Coordinated Launch Lock Format

on:
  push:
    branches:
      - feat/commercial-distribution-foundation
    paths:
      - ".github/workflows/goat-global-lock-sync-temp.yml"

permissions:
  contents: write

jobs:
  format-goat-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-distribution-foundation
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format only GOAT Flow source
        run: bunx prettier --write src/lib/goat-flow.server.ts
      - name: Verify lock survived formatting and scope is exact
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assertCommercialLaunchAuthorized } from "./commercial-launch-gate.server"' src/lib/goat-flow.server.ts
          grep -q 'assertCommercialLaunchAuthorized("goat_x402")' src/lib/goat-flow.server.ts
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -n "$changed" && "$changed" != "src/lib/goat-flow.server.ts" ]]; then
            echo "ERROR: formatter changed unexpected files: $changed" >&2
            exit 1
          fi
      - name: Commit formatted GOAT lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/goat-flow.server.ts; then
            echo 'GOAT Flow source is already formatted.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/goat-flow.server.ts
          git commit -m "style: format GOAT coordinated launch lock"
          git push origin HEAD:feat/commercial-distribution-foundation
