name: Verify Native Source Replacements (No Funds)
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "config/retired-source-replacements.v1.json"
      - "scripts/lib/*retired*sources*"
      - "scripts/lib/retired-source-replacements*"
      - "scripts/lib/native-feed-xml-normalizer*"
      - "scripts/ops/probe-retired-source-replacements.mjs"
      - ".github/workflows/verify-native-source-replacements.yml"
  push:
    branches: [main]
    paths:
      - "config/retired-source-replacements.v1.json"
      - "scripts/lib/retired-source-replacements*"
      - "scripts/lib/native-feed-xml-normalizer*"
      - "scripts/ops/probe-retired-source-replacements.mjs"
      - ".github/workflows/verify-native-source-replacements.yml"
permissions:
  contents: read
concurrency:
  group: native-source-replacements-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify retirement, provenance, XML and production source budgets
        run: >-
          node --test
          scripts/lib/retired-source-replacements.test.mjs
          scripts/lib/native-feed-xml-normalizer.test.mjs
          scripts/lib/private-osint-retired-sources.test.mjs
          scripts/lib/private-osint-country-rotation.test.mjs
          scripts/lib/hot-50-direct-20m-sources.test.mjs
          scripts/lib/three-domain-global-direct-20m-sources.test.mjs
      - name: Check actual replacement feeds and native item clocks without D1 or B2
        run: node scripts/ops/probe-retired-source-replacements.mjs
      - name: Save counts-only replacement receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-source-replacement-probe-${{ github.run_id }}
          path: /tmp/geomacro-source-replacement-probe.json
          if-no-files-found: warn
          retention-days: 7
