name: Temporary Early Access operating-term links

on:
  push:
    branches:
      - commercial/finalize-early-access-operating-terms

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[early-access-links]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical operating-term references
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
            'docs/EARLY_ACCESS_COMMERCIAL_PACKAGE.md': [
              (
                'This is the canonical founder-use source of truth for the first paid Geomacro Early Access engagements. It is not public pricing, a general-availability announcement, or an enterprise SLA.\n',
                'This is the canonical founder-use source of truth for the first paid Geomacro Early Access engagements. It is not public pricing, a general-availability announcement, or an enterprise SLA.\n\nCanonical pricing, support, incident and customer-use operating boundaries: `docs/EARLY_ACCESS_OPERATING_TERMS.md`.\n',
              ),
            ],
            'docs/FOUNDING_PILOT_PRICING_GUARDRAILS.md': [
              (
                'Internal founder-use only. Do not publish these numbers as general pricing until Geomacro has enough paid-pilot evidence to support a stable public plan.\n',
                'Internal founder-use only. Do not publish these numbers as general pricing until Geomacro has enough paid-pilot evidence to support a stable public plan.\n\nUse `docs/EARLY_ACCESS_OPERATING_TERMS.md` for the canonical support, incident, service-level and customer-use boundaries that accompany these quote anchors.\n',
              ),
            ],
            'docs/INDIA_PILOT_SOW_TEMPLATE.md': [
              (
                'Last reviewed: 2026-09-14.\n',
                'Last reviewed: 2026-09-15.\nCanonical operating standard: `docs/EARLY_ACCESS_OPERATING_TERMS.md`.\n',
              ),
              (
                'Normal support window: `[window]`.\n',
                'Normal support window: `[buyer-specific window; if omitted, use the current default in docs/EARLY_ACCESS_OPERATING_TERMS.md]`.\n',
              ),
            ],
          }

          for raw_path, replacements in patches.items():
            path = Path(raw_path)
            text = path.read_text()
            for old, new in replacements:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'expected exactly one anchor in {raw_path}, found {count}: {old!r}')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY
          git diff --check
      - name: Commit exact links
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EARLY_ACCESS_COMMERCIAL_PACKAGE.md docs/FOUNDING_PILOT_PRICING_GUARDRAILS.md docs/INDIA_PILOT_SOW_TEMPLATE.md
          git commit -m "docs: link canonical Early Access operating terms [early-access-links]"
          git push origin HEAD:commercial/finalize-early-access-operating-terms
