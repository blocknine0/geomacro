name: Auto Distribution Check

on:
  pull_request:
    paths:
      - "config/auto-distribution.json"
      - "scripts/marketing/**"
      - "docs/AUTO_DISTRIBUTION.md"
      - ".github/workflows/auto-distribution-check.yml"
  push:
    branches:
      - main
    paths:
      - "config/auto-distribution.json"
      - "scripts/marketing/**"
      - ".github/workflows/auto-distribution-check.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render sample alert without external writes
        run: node scripts/marketing/auto-distribute-alert.mjs --input=scripts/marketing/fixtures/sample-alert.json
      - name: Verify live public publishing fails closed in prelaunch
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/marketing/auto-distribute-alert.mjs \
            --input=scripts/marketing/fixtures/sample-alert.json \
            --live; then
            echo "ERROR: live distribution unexpectedly succeeded while live_publish_enabled=false" >&2
            exit 1
          fi
          echo "PASS: prelaunch live distribution is blocked."
