name: One-Time Typed Open-Data Three-Category Real Transport
on:
  push:
    branches:
      - diag/open-data-5-real-source-20261013
permissions:
  contents: read
jobs:
  sources:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install pinned repository dependencies
        run: bun install --frozen-lockfile
      - name: No-funds typed official-data unit contracts
        run: bunx vitest run src/lib/category-open-data.server.test.ts src/lib/category-intelligence-alias.server.test.ts
      - name: Real read-only source data per domain, aggregate-only metrics
        run: bun scripts/ops/probe-three-category-open-data.ts
