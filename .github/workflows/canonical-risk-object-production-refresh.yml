name: Canonical Risk Object Production Refresh

on:
  workflow_dispatch:
    inputs:
      iso3:
        description: "Country ISO3 to publish as the paid-delivery CANONICAL Risk Object"
        required: true
        default: "USA"
        type: string
      authorization:
        description: "Exact acknowledgement required for a production data publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-risk-object-production-refresh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EXPECTED_PROJECT_REF: ldpwajisioljyjtojvfx
      EXPECTED_KEY_ID: geomacro-risk-2026-03
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      REFRESH_AUTHORIZATION: ${{ inputs.authorization }}

    steps:
      - name: Require explicit data-publication acknowledgement
        run: |
          test "${REFRESH_AUTHORIZATION}" = "I_AUTHORIZE_CANONICAL_RISK_OBJECT_REFRESH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL}"
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY}"
          test -n "${RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64}"
          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "${EXPECTED_PROJECT_REF}"
          test "${RISK_OBJECT_SIGNING_KEY_ID}" = "${EXPECTED_KEY_ID}"

      - name: Validate country
        id: country
        shell: bash
        env:
          RAW_ISO3: ${{ inputs.iso3 }}
        run: |
          set -euo pipefail
          ISO3="$(printf '%s' "${RAW_ISO3}" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          [[ "${ISO3}" =~ ^[A-Z]{3}$ ]]
          echo "iso3=${ISO3}" >> "$GITHUB_OUTPUT"

      - name: Publish fresh canonical signed Risk Object
        env:
          ISO3: ${{ steps.country.outputs.iso3 }}
        run: |
          set -euo pipefail
          bun scripts/publish-country-risk-object.ts "${ISO3}" CANONICAL > /tmp/canonical-risk-object.json
          cat /tmp/canonical-risk-object.json

      - name: Verify paid-delivery readiness
        env:
          ISO3: ${{ steps.country.outputs.iso3 }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e             --arg iso3 "${ISO3}"             --arg key_id "${EXPECTED_KEY_ID}"             '
            .published == true
            and .context.published == true
            and .subject.type == "country"
            and .subject.id == $iso3
            and .schema_version == "gro-1.1"
            and .delivery_profile == "CANONICAL"
            and .integrity.signing_key_id == $key_id
            and .integrity.signature_present == true
            and .integrity.signature_valid == true
            and .verification.status == "VERIFIED"
            and .commercial_eligibility.status == "VERIFIED"
            ' /tmp/canonical-risk-object.json >/dev/null

          jq -e '
            .context.published == true
            and .integrity.signature_valid == true
            and .commercial_eligibility.status == "VERIFIED"
            and .verification.status == "VERIFIED"
          ' /tmp/canonical-risk-object.json >/dev/null

          jq '{published,object_id,delivery_profile,subject,confidence,commercial_eligibility,verification,integrity:{signing_key_id,signature_valid,payload_hash,calculation_hash}}' /tmp/canonical-risk-object.json
