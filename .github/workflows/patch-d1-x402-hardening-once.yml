name: Patch D1 x402 hardening once
on:
  push:
    branches:
      - fix/d1-x402-ledger-hardening-current
permissions:
  contents: write
concurrency:
  group: patch-d1-x402-hardening-once
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/d1-x402-ledger-hardening-current
          fetch-depth: 1
      - run: node scripts/ops/patch-d1-x402-hardening-once.mjs
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- workers/x402-ledger/src/index.mjs src/__tests__/x402-d1-ledger-static.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/x402-ledger/src/index.mjs src/__tests__/x402-d1-ledger-static.test.ts
          git commit -m "Harden D1 x402 ledger request authentication"
          git push origin HEAD:fix/d1-x402-ledger-hardening-current
