name: Predge Token-Only Encrypted Handoff (No Funds)
# Owner-dispatched ONLY. The artifact is RSA OAEP ciphertext encrypted to
# a public key held locally by the owner; no plaintext token in GH logs/files.
on:
  workflow_dispatch:
    inputs:
      recipient_rsa_public_key_base64:
        description: "Base64-encoded RSA 3072+ PUBLIC PEM. Keep private key locally; never supply a private key."
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: geomacro-predge-owner-token-handoff
  cancel-in-progress: false
jobs:
  seal-research-token:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: production
    env:
      ROOT_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      # Match exact live Worker grant when founder has explicitly configured
      # Predge's preexisting dedicated research token. Optional otherwise.
      PREDGE_RESEARCH_NEWS_TOKEN_OVERRIDE: ${{ secrets.PREDGE_RESEARCH_NEWS_TOKEN_OVERRIDE }}
      RECIPIENT_RSA_PUBKEY_B64: ${{ inputs.recipient_rsa_public_key_base64 }}
    steps:
      - name: Checkout immutable canonical main (no stored credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: '22'}
      - name: Validate sealed research handoff offline
        run: node --test scripts/ops/predge-sealed-token-handoff.test.mjs
      - name: Verify live Predge auth then seal token to owner's public key
        run: node scripts/ops/predge-sealed-token-handoff.mjs --seal-after-live-auth
      - name: Upload ciphertext ONLY (expires in one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: predge-owner-research-token-encrypted-${{ github.run_id }}
          path: artifacts/predge-research-token/predge-research-token.rsa-oaep-sha256.bin
          if-no-files-found: error
          retention-days: 1
