name: Global Realtime Intelligence 100 Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-global-realtime-intelligence-100
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      GLOBAL_REALTIME_100_OUTPUT: artifacts/global-realtime-intelligence-100/gate.json
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate authoritative production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL:-}"
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY:-}"
          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "${EXPECTED_SUPABASE_PROJECT_REF}"
          node --check scripts/audit-global-realtime-intelligence-100.mjs
      - name: Run strict global realtime intelligence gate
        run: bun run realtime:intelligence:100 -- --strict
      - name: Upload canonical gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-realtime-intelligence-100-${{ github.run_id }}
          path: artifacts/global-realtime-intelligence-100/gate.json
          if-no-files-found: error
          retention-days: 30
