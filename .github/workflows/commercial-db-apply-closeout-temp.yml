name: Commercial DB Apply Closeout

on:
  push:
    branches:
      - feat/commercial-prelaunch-closeout
    paths:
      - ".github/workflows/commercial-db-apply-closeout-temp.yml"

permissions:
  contents: read

jobs:
  apply-exact-commercial-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-prelaunch-closeout
          persist-credentials: false
      - name: Validate authoritative production database target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_PROJECT_ID:-}" && -n "${SUPABASE_DB_URL:-}" ]]
          [[ "$SUPABASE_PROJECT_ID" == "$EXPECTED_SUPABASE_PROJECT_REF" ]]
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const url = new URL(process.env.SUPABASE_DB_URL);
          const direct = url.hostname === `db.${ref}.supabase.co` && url.username === 'postgres';
          const pooler = url.hostname.endsWith('.pooler.supabase.com') && url.username === `postgres.${ref}`;
          if (!direct && !pooler) throw new Error('DB URL is not authoritative Geomacro production');
          if (!url.password || url.pathname !== '/postgres') throw new Error('invalid database target');
          NODE
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0
      - name: Prove pending set is exactly 934 and 935
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee /tmp/plan.txt
          mapfile -t pending < <(sed -n 's/^ • \([0-9][^ ]*\.sql\)$/\1/p' /tmp/plan.txt)
          printf 'PENDING=%s\n' "${pending[*]:-none}"
          expected=(934_agent_commerce_delivery_ledger.sql 935_commercial_marketing_draft_queue.sql)
          if [[ "${pending[*]:-}" != "${expected[*]}" ]]; then
            echo 'ERROR: refusing apply because pending migration set is not exactly 934 + 935' >&2
            exit 1
          fi
      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Verify production is fully migration-current
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee /tmp/post.txt
          if grep -Eq '^ • [0-9].*\.sql$|Would push these migrations' /tmp/post.txt; then
            echo 'ERROR: migrations remain pending after scoped commercial apply' >&2
            exit 1
          fi
          echo 'PASS: 934 and 935 are applied; no migrations remain pending.'
      - name: Record non-payment boundary
        shell: bash
        run: |
          echo 'PRODUCTION_PAYMENT_RAIL_ACTIVATED=false'
          echo 'MAINNET_PAYMENT_PERFORMED=false'
          echo 'SCHEMA_ONLY_CHANGE=true'
