name: Marketplace Listing Observation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact canonical main SHA already verified on public production"
        required: true
        type: string
      public_prelisting_run_id:
        description: "Successful Public Production Prelisting Health run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: marketplace-listing-observation
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace-observation
    env:
      GEOMACRO_PRODUCTION_ACCEPTANCE_SHA: ${{ inputs.candidate_sha }}
      GEOMACRO_MARKETPLACE_OBSERVATION_OUTPUT: /tmp/marketplace-observation.json
      GEOMACRO_COINBASE_BAZAAR_OBSERVATION_URL: ${{ vars.GEOMACRO_COINBASE_BAZAAR_OBSERVATION_URL }}
      GEOMACRO_COINBASE_BAZAAR_OBSERVATION_AUTHORIZATION: ${{ secrets.GEOMACRO_COINBASE_BAZAAR_OBSERVATION_AUTHORIZATION }}
      GEOMACRO_CIRCLE_MARKETPLACE_OBSERVATION_URL: ${{ vars.GEOMACRO_CIRCLE_MARKETPLACE_OBSERVATION_URL }}
      GEOMACRO_CIRCLE_MARKETPLACE_OBSERVATION_AUTHORIZATION: ${{ secrets.GEOMACRO_CIRCLE_MARKETPLACE_OBSERVATION_AUTHORIZATION }}
      GEOMACRO_NEVERMINED_REGISTRY_OBSERVATION_URL: ${{ vars.GEOMACRO_NEVERMINED_REGISTRY_OBSERVATION_URL }}
      GEOMACRO_NEVERMINED_REGISTRY_OBSERVATION_AUTHORIZATION: ${{ secrets.GEOMACRO_NEVERMINED_REGISTRY_OBSERVATION_AUTHORIZATION }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Require exact current main SHA and configured independent provider observations
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${CANDIDATE_SHA,,}" == "${DISPATCH_SHA,,}" ]]
          for name in             GEOMACRO_COINBASE_BAZAAR_OBSERVATION_URL             GEOMACRO_CIRCLE_MARKETPLACE_OBSERVATION_URL             GEOMACRO_NEVERMINED_REGISTRY_OBSERVATION_URL; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing independent marketplace observation URL: $name"; exit 1; }
          done

      - name: Verify public exact-SHA production health happened first
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          PRELISTING_RUN: ${{ inputs.public_prelisting_run_id }}
        with:
          script: |
            const runId = Number(process.env.PRELISTING_RUN);
            if (!Number.isInteger(runId) || runId <= 0) core.setFailed('public_prelisting_run_id must be numeric');
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.path !== '.github/workflows/public-production-prelisting-health.yml') core.setFailed('Referenced run is not Public Production Prelisting Health');
            if (run.event !== 'workflow_dispatch' || run.head_branch !== 'main') core.setFailed('Public prelisting health must be a manual main run');
            if (String(run.head_sha || '').toLowerCase() !== String(process.env.EXPECTED_SHA).toLowerCase()) core.setFailed('Public prelisting health SHA mismatch');
            if (run.status !== 'completed' || run.conclusion !== 'success') core.setFailed('Public prelisting health is not successful');

      - name: Independently observe all three provider listings
        run: node scripts/commerce/observe-marketplace-listings.mjs

      - name: Upload sanitized listing observation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketplace-listing-observation-${{ github.run_id }}
          path: /tmp/marketplace-observation.json
          if-no-files-found: error
          retention-days: 14
