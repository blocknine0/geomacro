name: WDI Commercial Signal Self-Heal

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/ensure-world-bank-commercial-signal-state.mjs"
      - ".github/workflows/wdi-commercial-signal-self-heal.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-wdi-commercial-signal-self-heal
  cancel-in-progress: false

jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify and repair governed WDI commercial signal state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ensure-world-bank-commercial-signal-state.mjs | tee /tmp/wdi-commercial-signal-state.json.log
          grep -q 'PASS: WORLD BANK COMMERCIAL SIGNAL STATE VERIFIED' /tmp/wdi-commercial-signal-state.json.log

      - name: Publish safe summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WDI commercial signal state"
            echo
            echo "This control may restore only the reviewed operational flag when all governed source preconditions remain intact."
            echo "It does not broaden rights, change raw redistribution permissions, perform payment, or alter mainnet activation."
          } >> "$GITHUB_STEP_SUMMARY"
