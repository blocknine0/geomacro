name: One-time reconcile absent archived fragment a59a0f82

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-reconcile-absent-fragment-a59a0f82-20261001.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: one-time-reconcile-absent-fragment-a59a0f82-20261001
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_FRAGMENT_TARGET_ID: a59a0f82-9deb-4d33-b537-f0d4d9b48a7f
      B2_FRAGMENT_RESTORE_ID: a59a0f82-9deb-4d33-b537-f0d4d9b48a7f
      B2_FRAGMENT_TARGET_DELETE: "1"
      B2_FRAGMENT_MIN_AGE_HOURS: "168"
      B2_REQUEST_BUDGET: "20"
      EXPECTED_SOURCE_PATH: live/v1/2026/09/21/05/gdelt-gal/20260921051700-6b4315aaa8ff1e74.ndjson.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Require exact production target and determinate source state
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test "$B2_FRAGMENT_TARGET_ID" = "a59a0f82-9deb-4d33-b537-f0d4d9b48a7f"
          test "$B2_FRAGMENT_RESTORE_ID" = "$B2_FRAGMENT_TARGET_ID"
          test "$EXPECTED_SOURCE_PATH" = "live/v1/2026/09/21/05/gdelt-gal/20260921051700-6b4315aaa8ff1e74.ndjson.gz"
          node --input-type=module <<'NODE'
          const base = String(process.env.APP_SUPABASE_URL).replace(/\/$/, '');
          const role = process.env.APP_SUPABASE_SERVICE_ROLE_KEY;
          const bucket = 'geomacro-live-intelligence';
          const path = process.env.EXPECTED_SOURCE_PATH;
          const encoded = path.split('/').map(encodeURIComponent).join('/');
          const response = await fetch(`${base}/storage/v1/object/info/${bucket}/${encoded}`, {
            headers: { apikey: role, authorization: `Bearer ${role}` },
            signal: AbortSignal.timeout(15000),
          });
          if (response.ok) {
            console.log(JSON.stringify({ ok: true, source_state: 'present', fragment_id: process.env.B2_FRAGMENT_TARGET_ID }));
            process.exit(0);
          }
          const body = await response.json().catch(() => null);
          const structuredStatus = String(body?.statusCode ?? '');
          const structuredError = String(body?.error ?? body?.message ?? '');
          const absent = response.status === 404 ||
            (response.status === 400 && structuredStatus === '404' && /not.?found|no.?such.?key/i.test(structuredError));
          if (!absent) throw new Error(`SOURCE_STATE_INDETERMINATE_${response.status}_${structuredStatus || 'none'}`);
          console.log(JSON.stringify({ ok: true, source_state: 'absent', fragment_id: process.env.B2_FRAGMENT_TARGET_ID }));
          NODE

      - name: Restore or verify exact source bytes from B2
        run: node scripts/ops/b2-fragment-restore.mjs

      - name: Run normal audited targeted cleanup after verified restore
        run: node scripts/ops/b2-fragment-targeted-cleanup.mjs
