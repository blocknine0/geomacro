name: One-Time Earlier Supabase Source API Readback
on:
  push:
    branches: [feat/reuse-legacy-supabase-unhcr-mcs-20261013]
permissions:
  contents: read
jobs:
  no-funds-probe:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Validate legacy schemas, source privacy and existing 3-category GETs
        run: bunx vitest run src/lib/category-open-data.server.test.ts src/lib/category-intelligence-alias.server.test.ts
      - name: Real network native UNHCR BGS USGS readback (metadata-only)
        run: node scripts/ops/diag-previous-supabase-sources.mjs
      - name: Integrated category sources (aggregate-only; no payment)
        run: bun scripts/ops/probe-three-category-open-data.ts
