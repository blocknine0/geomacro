name: One-Time Earlier Supabase Source API Readback
on:
  push:
    branches: [feat/reuse-legacy-supabase-unhcr-mcs-20261013]
permissions:
  contents: read
jobs:
  no-funds-probe:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: node scripts/ops/diag-previous-supabase-sources.mjs
