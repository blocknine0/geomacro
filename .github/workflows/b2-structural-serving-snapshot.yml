name: B2 structural serving snapshot maintenance

# Quota-held historical Supabase producer. Previously a scheduled/push
# workflow instantiated an active Supabase service-role reader and performed
# ungoverned B2 Class-B operations. Preserve its code for forensic recovery
# but forbid automatic or operator-triggered production execution until a
# separate, reviewed Supabase-free + account-quota-governed successor exists.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-b2-structural-serving
  cancel-in-progress: true

jobs:
  publish:
    # Absolute production hold. Neither a push, a cron, nor a manual
    # dispatch can resume the historical Supabase reader by accident.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      HISTORICAL_SUPABASE_URL: https://nqvpcbnnvjsrlvyxxevk.supabase.co
      HISTORICAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HISTORICAL_SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ARCHIVE_WRITE_KEY_ID: ${{ secrets.B2_ARCHIVE_WRITE_KEY_ID }}
      B2_ARCHIVE_WRITE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_WRITE_APPLICATION_KEY }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require dedicated B2 readback credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${B2_ARCHIVE_READ_KEY_ID:-}" || { echo "B2_ARCHIVE_READ_KEY_ID is required for structural readback"; exit 2; }
          test -n "${B2_ARCHIVE_READ_APPLICATION_KEY:-}" || { echo "B2_ARCHIVE_READ_APPLICATION_KEY is required for structural readback"; exit 2; }

      - name: Publish and fully read back structural serving snapshot
        run: bun scripts/ops/publish-b2-structural-serving-snapshot.ts
