name: B2 structural serving snapshot (account-governed)

# Independent historical Supabase is the source; existing shared D1/B2
# reservation authority caps every B2 network attempt. Never read main Supabase.
on:
  pull_request:
    paths:
      - scripts/ops/publish-b2-structural-serving-snapshot.ts
      - .github/workflows/b2-structural-serving-snapshot.yml
      - src/__tests__/historical-bundled-recovery-static.test.ts
  push:
    branches: [main]
    paths:
      - scripts/ops/publish-b2-structural-serving-snapshot.ts
      - .github/workflows/b2-structural-serving-snapshot.yml
  schedule:
    - cron: "12 1 * * 0"
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Run one D1/B2 account-governed structural snapshot"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: geomacro-b2-structural-serving-account
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce immutable history and central account quota controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MAX_TOTAL_DB_READS = 96' scripts/ops/publish-b2-structural-serving-snapshot.ts
          grep -q 'MAX_TOTAL_SOURCE_ROWS = 18_000' scripts/ops/publish-b2-structural-serving-snapshot.ts
          grep -q 'B2_STRUCTURAL_HISTORICAL_DB_QUERY_CAP' scripts/ops/publish-b2-structural-serving-snapshot.ts
          grep -q 'const b2 = createB2Client' scripts/ops/publish-b2-structural-serving-snapshot.ts
          grep -q 'B2_ACCOUNT_QUOTA_REQUIRED: "1"' .github/workflows/b2-structural-serving-snapshot.yml

  publish:
    needs: contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_now == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      HISTORICAL_SUPABASE_URL: https://nqvpcbnnvjsrlvyxxevk.supabase.co
      HISTORICAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HISTORICAL_SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ARCHIVE_WRITE_KEY_ID: ${{ secrets.B2_ARCHIVE_WRITE_KEY_ID }}
      B2_ARCHIVE_WRITE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_WRITE_APPLICATION_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      B2_REQUEST_BUDGET: "12"
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: structural_snapshot
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require explicit historical and B2 credentials
        shell: bash
        run: |
          set -euo pipefail
          for k in HISTORICAL_SUPABASE_SERVICE_ROLE_KEY B2_KEY_ID B2_APPLICATION_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!k:-}" || { echo "::notice::STRUCTURAL_PUBLISH_HELD_MISSING_CREDENTIAL"; exit 3; }
          done
      - name: Require central maintenance D1 budget
        id: budget
        run: node scripts/ops/plan-d1-bundled-work.mjs
      - name: Quota-held report
        if: steps.budget.outputs.maintenance != 'true'
        run: echo "::notice::STRUCTURAL_PUBLISH_QUOTA_HELD; no historical read or B2 write"
      - name: Resolve EXISTING central D1 account quota ledger
        if: steps.budget.outputs.maintenance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(npx -y wrangler@4.136.3 d1 list --json)"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s="";process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const rows=JSON.parse(s);const matched=rows.filter(r=>r.name==="geomacro-control-plane");
              if(matched.length!==1)process.exit(3);
              process.stdout.write(matched[0].uuid??matched[0].id??"");
            });')"
          test -n "$DB_ID" || { echo "::error::Missing central D1 quota governor"; exit 3; }
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Publish and SHA-readback historical structural snapshot
        if: steps.budget.outputs.maintenance == 'true'
        run: bun scripts/ops/publish-b2-structural-serving-snapshot.ts
