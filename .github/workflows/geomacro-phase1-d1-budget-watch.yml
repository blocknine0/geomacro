name: GeoMacro D1 Paid Internal Budget — Read-only Watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geomacro-d1-paid-account-budget-observer
  cancel-in-progress: false
jobs:
  account-d1-provider-budget:
    if: github.repository == 'blocknine0/geomacro'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify provider Paid and evaluate GeoMacro's 180k internal budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/phase1-provider-check.mjs
      # A failing run is an operational alert, NOT a provider D1 write block.
