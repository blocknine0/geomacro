name: Dry Run Multi-Source News

on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/gri-multi-source-ingestion
    paths:
      - "scripts/ingest-news.js"
      - ".github/workflows/dry-run-multisource-news.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-save --ignore-scripts

      - name: Run multi-source ingestion dry-run
        env:
          SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}

          GDELT_MIN_INTERVAL_MS: "6000"

        run: node scripts/ingest-news.js --dry-run
