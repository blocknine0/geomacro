name: First qualified country digest (no funds)
on:
  pull_request:
    paths:
      - src/lib/qualified-mcs-country-digest.server.ts
      - scripts/ops/prepare-first-qualified-country-digest.ts
      - src/lib/qualified-mcs-country-digest.server.test.ts
      - src/lib/canonical-country-registry-195.ts
      - .github/workflows/first-qualified-country-digest.yml
  push:
    branches: [main]
    paths:
      - src/lib/qualified-mcs-country-digest.server.ts
      - scripts/ops/prepare-first-qualified-country-digest.ts
      - src/lib/qualified-mcs-country-digest.server.test.ts
      - src/lib/canonical-country-registry-195.ts
      - .github/workflows/first-qualified-country-digest.yml
  # One bounded, source-native CC0 + canonical customer-byte recheck daily.
  # Failures are observable, not transformed into new articles or risk scores.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      country_iso3:
        description: 'Canonical country ISO3; real 2024+2025 USGS mineral rows required; no funds'
        type: string
        required: true
        default: 'CHN'
permissions:
  contents: read
concurrency:
  group: first-qualified-country-digest
  cancel-in-progress: false
jobs:
  real-source-no-secrets:
    if: github.event_name == 'pull_request' || (github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify no-funds 195-country original mineral source census contract
        run: bun x vitest run src/lib/qualified-mcs-country-digest.server.test.ts
      - name: Real source qualification and canonical byte preparation, no secrets or durable writes
        env:
          NODE_ENV: production
          GEOMACRO_SUPABASE_RUNTIME_MODE: standby
          GEOMACRO_FIRST_DIGEST_COUNTRY: CHN
        run: bun scripts/ops/prepare-first-qualified-country-digest.ts
      - name: Assert genuine structured customer bytes proof without funds
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {readFileSync}=require("node:fs");
          const r=JSON.parse(readFileSync("artifacts/first-qualified-structural-digest-receipt.json","utf8"));
          if(r.schema!=="geomacro.first-qualified-structural-digest-receipt.v1"||
             r.capability!=="structural_country_digest"||r.amount_usdc!=="0.02"||
             r.country_iso3!=="CHN"||r.source_rights_verified!==true||
             r.original_file_sha256_verified!==true||
             r.canonical_engine_deliverable!==true||
             r.private_vault_admission_validated!==true||
             r.mcs_195_source_census?.canonical_country_count!==195||
             r.mcs_195_source_census?.country_coverage?.length!==195||
             r.mcs_195_source_census?.source_rights_grant_is_exact_scoped_dataset_only!==true||
             r.mcs_195_source_census?.current_country_mineral_events_verified!==false||
             r.mcs_195_source_census?.paid_entitlements_or_mainnet_settlements_verified!==false||
             r.mcs_195_source_census?.canonical_product_preflight_per_country_not_assessed!==true||
             r.current_news_or_risk_score!==false||
             !/^[a-f0-9]{64}$/.test(r.prepared_customer_bytes_sha256)||
             r.payable_offer_issued!==false||r.merchant_acceptance_verified!==false||
             r.settlement_attempts!==0||r.execution_authorized!==false)
            throw Error("FIRST_DIGEST_GENUINE_NO_FUNDS_ACCEPTANCE_FAILED");
          console.log("PASS: exact CC0 source, real derived customer bytes, 0.02 USDC catalog and zero settlement");
          NODE
      - name: Preserve sanitized source-only acceptance (no customer/source bytes)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-qualified-digest-source-only-${{ github.run_id }}
          path: artifacts/first-qualified-structural-digest-receipt.json
          if-no-files-found: ignore
          retention-days: 3
  qualify-and-archive:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify scoped source qualification and negative rights/clock cases
        run: bun x vitest run src/lib/qualified-mcs-country-digest.server.test.ts src/__tests__/earn-first-structural-pilot.test.ts
      - name: Real original and CC0 qualification, canonical engine, private exact archive readback
        env:
          NODE_ENV: production
          GEOMACRO_SUPABASE_RUNTIME_MODE: standby
          GEOMACRO_FIRST_DIGEST_COUNTRY: ${{ inputs.country_iso3 }}
          B2_ACCOUNT_QUOTA_REQUIRED: '1'
          B2_ACCOUNT_QUOTA_WORKFLOW_ID: first_qualified_country_digest
          B2_REQUEST_BUDGET: '8'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
          B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
          B2_ARCHIVE_WRITE_KEY_ID: ${{ secrets.B2_ARCHIVE_WRITE_KEY_ID }}
          B2_ARCHIVE_WRITE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_WRITE_APPLICATION_KEY }}
        run: bun scripts/ops/prepare-first-qualified-country-digest.ts --archive-private
      - name: Retain sanitized result only, never source or customer bytes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-qualified-country-digest-receipt
          path: artifacts/first-qualified-structural-digest-receipt.json
          if-no-files-found: ignore
          retention-days: 14
