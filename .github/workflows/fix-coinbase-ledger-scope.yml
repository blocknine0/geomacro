name: Fix Coinbase Ledger Scope

on:
  push:
    branches:
      - ops/supabase-standby-cutover-20261002
    paths:
      - "scripts/ops/fix-coinbase-ledger-scope.mjs"
      - ".github/workflows/fix-coinbase-ledger-scope.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'blocknine0/geomacro' && github.actor == 'blocknine0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/supabase-standby-cutover-20261002
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Apply exact scope fix
        run: node scripts/ops/fix-coinbase-ledger-scope.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Regression and syntax checks
        run: |
          node --check workers/commerce-ledger/src/index.mjs
          bun test src/__tests__/agent-commerce-delivery-ledger-static.test.ts src/__tests__/commerce-ledger-no-supabase-acceptance-static.test.ts
      - name: Commit generated fix only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-coinbase-ledger-scope.yml scripts/ops/fix-coinbase-ledger-scope.mjs
          git add src/lib/coinbase-x402.server.ts
          git diff --cached --check
          git commit -m "Fix Coinbase durable ledger environment scope"
          git push origin HEAD:ops/supabase-standby-cutover-20261002
