name: Temporary B2 Data Parity Patch

on:
  push:
    branches:
      - fix/b2-data-parity-20261003
    paths:
      - ".github/workflows/temp-b2-data-parity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/b2-data-parity-20261003
          fetch-depth: 0
      - name: Restore verified-data visibility alongside live B2 observations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/use-intelligence.ts")
          text = path.read_text()

          old = '''  usedFallbackWindow: boolean;\n  hasLiveObserved: boolean;'''
          new = '''  usedFallbackWindow: boolean;\n  /** True when current live observations are supplemented with recent verified scored B2 context. */\n  usesVerifiedContext: boolean;\n  hasLiveObserved: boolean;'''
          if old not in text:
              raise SystemExit("type insertion anchor missing")
          text = text.replace(old, new, 1)

          old = '''  const in24h = markedRows.filter((r) => r.isCurrent);\n  const usedFallbackWindow = in24h.length === 0;\n  const recent = [...markedRows]\n    .filter((r) => Number.isFinite(timeOf(r)) && timeOf(r) <= now)\n    .sort((a, b) => timeOf(b) - timeOf(a))\n    .slice(0, 24);\n  const domainRows = usedFallbackWindow ? recent : in24h;\n\n  const currentScored = in24h.filter((r) => r.severity !== null);\n  const topRisks = [...currentScored]\n    .sort((a, b) => (b.severity ?? 0) - (a.severity ?? 0))\n    .slice(0, 8);'''
          new = '''  const in24h = markedRows.filter((r) => r.isCurrent);\n  const usedFallbackWindow = in24h.length === 0;\n  const recent = [...markedRows]\n    .filter((r) => Number.isFinite(timeOf(r)) && timeOf(r) <= now)\n    .sort((a, b) => timeOf(b) - timeOf(a))\n    .slice(0, 24);\n\n  // B2 continuity can be verified and scored while today's open-source overlay is\n  // intentionally unscored. Keep both visible: current observations preserve\n  // freshness, and the latest verified B2 rows preserve the rich scored context\n  // the Supabase-backed public workspace exposed before the production cutover.\n  // Never rewrite timestamps or synthesize scores to make stale evidence look current.\n  const currentDefault = [...in24h]\n    .sort((a, b) => timeOf(b) - timeOf(a))\n    .slice(0, 12);\n  const verifiedContext = [...markedRows]\n    .filter((r) => r.publicStatus === "verified_b2" && !r.isCurrent)\n    .sort((a, b) => timeOf(b) - timeOf(a));\n  const verifiedContextDefault = verifiedContext.slice(\n    0,\n    Math.max(0, 24 - currentDefault.length),\n  );\n  const usesVerifiedContext = currentDefault.length > 0 && verifiedContextDefault.length > 0;\n  const domainRows = usedFallbackWindow\n    ? recent\n    : [...currentDefault, ...verifiedContextDefault];\n\n  const currentScored = in24h.filter((r) => r.severity !== null);\n  const latestVerifiedScored = verifiedContext.filter((r) => r.severity !== null).slice(0, 24);\n  const riskRankingPool = [...currentScored, ...latestVerifiedScored].filter(\n    (row, index, rows) => rows.findIndex((candidate) => candidate.id === row.id) === index,\n  );\n  const topRisks = [...riskRankingPool]\n    .sort((a, b) => (b.severity ?? 0) - (a.severity ?? 0))\n    .slice(0, 8);'''
          if old not in text:
              raise SystemExit("build block anchor missing")
          text = text.replace(old, new, 1)

          old = '''    usedFallbackWindow,\n    hasLiveObserved: markedRows.some((row) => row.publicStatus === "live_observed"),'''
          new = '''    usedFallbackWindow,\n    usesVerifiedContext,\n    hasLiveObserved: markedRows.some((row) => row.publicStatus === "live_observed"),'''
          if old not in text:
              raise SystemExit("return block anchor missing")
          text = text.replace(old, new, 1)

          old = '''  const explicitResearch = Boolean(q) || category !== "all";\n  const current = rows.filter((r) => r.isCurrent);\n  let out = explicitResearch\n    ? rows\n    : current.length > 0\n      ? current\n      : [...rows]\n          .filter((r) => Number.isFinite(timeOf(r)))\n          .sort((a, b) => timeOf(b) - timeOf(a))\n          .slice(0, 24);'''
          new = '''  const explicitResearch = Boolean(q) || category !== "all";\n  const current = [...rows]\n    .filter((r) => r.isCurrent)\n    .sort((a, b) => timeOf(b) - timeOf(a))\n    .slice(0, 12);\n  const latestVerifiedContext = [...rows]\n    .filter((r) => !r.isCurrent && r.publicStatus === "verified_b2")\n    .sort((a, b) => timeOf(b) - timeOf(a))\n    .slice(0, 12);\n  let out = explicitResearch\n    ? rows\n    : current.length > 0\n      ? [...current, ...latestVerifiedContext]\n      : [...rows]\n          .filter((r) => Number.isFinite(timeOf(r)))\n          .sort((a, b) => timeOf(b) - timeOf(a))\n          .slice(0, 24);'''
          if old not in text:
              raise SystemExit("filter block anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text)

          route = Path("src/routes/intelligence.tsx")
          text = route.read_text()
          old = '''  const latestVerifiedFallback = Boolean(intel.data?.usedFallbackWindow);\n  const hasLiveObserved = Boolean(intel.data?.hasLiveObserved);'''
          new = '''  const latestVerifiedFallback = Boolean(intel.data?.usedFallbackWindow);\n  const usesVerifiedContext = Boolean(intel.data?.usesVerifiedContext);\n  const hasLiveObserved = Boolean(intel.data?.hasLiveObserved);'''
          if old not in text:
              raise SystemExit("route state anchor missing")
          text = text.replace(old, new, 1)

          text = text.replace(
            '''                ? "Fresh live observations + verified B2 continuity"''',
            '''                ? usesVerifiedContext\n                  ? "Fresh live observations + latest verified scored B2 context"\n                  : "Fresh live observations + verified B2 continuity"''',
            1,
          )
          text = text.replace(
            '''                  {hasLiveObserved ? "Fresh observed + verified event set" : latestVerifiedFallback ? "Latest verified event set" : "Current event set"}''',
            '''                  {hasLiveObserved && usesVerifiedContext ? "Fresh observed + latest verified scored set" : hasLiveObserved ? "Fresh observed + verified event set" : latestVerifiedFallback ? "Latest verified event set" : "Current event set"}''',
            1,
          )
          text = text.replace(
            '''                    : hasLiveObserved\n                      ? "Current intelligence"''',
            '''                    : hasLiveObserved && usesVerifiedContext\n                      ? "Current + latest verified intelligence"\n                      : hasLiveObserved\n                        ? "Current intelligence"''',
            1,
          )
          route.write_text(text)

          workspace = Path("src/components/institutional/workspace.tsx")
          text = workspace.read_text()
          text = text.replace(
            '''          <h3 className="type-meta text-muted-foreground">Top risks</h3>''',
            '''          <h3 className="type-meta text-muted-foreground">Top verified risk context</h3>''',
            1,
          )
          text = text.replace(
            '''                description="Top risks appear once the pipeline scores new events."''',
            '''                description="Verified risk context appears once the durable pipeline has scored events."''',
            1,
          )
          workspace.write_text(text)

          test = Path("src/__tests__/b2-public-data-parity-static.test.ts")
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\n\nconst read = (path: string) => readFileSync(path, "utf8");\n\ndescribe("B2 public data parity", () => {\n  it("keeps fresh observations and latest verified scored context visible together", () => {\n    const source = read("src/lib/use-intelligence.ts");\n    expect(source).toContain("usesVerifiedContext");\n    expect(source).toContain('r.publicStatus === "verified_b2" && !r.isCurrent');\n    expect(source).toContain("latestVerifiedScored");\n    expect(source).toContain("[...current, ...latestVerifiedContext]");\n    expect(source).not.toContain("publishedAt: new Date().toISOString()");\n  });\n\n  it("labels mixed freshness truthfully instead of presenting stale verified rows as current", () => {\n    const route = read("src/routes/intelligence.tsx");\n    expect(route).toContain("Fresh live observations + latest verified scored B2 context");\n    expect(route).toContain("Current + latest verified intelligence");\n  });\n});\n''')
          PY

      - name: Commit parity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "geomacro-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/use-intelligence.ts src/routes/intelligence.tsx src/components/institutional/workspace.tsx src/__tests__/b2-public-data-parity-static.test.ts
          git commit -m "fix: restore verified B2 data context in public views"
          git push origin HEAD:fix/b2-data-parity-20261003
