name: Phase 2H Permanent Private Raw B2 and Exact-Question Acceptance
# User-selected ONE monthly Phase2H production run at 00:29 UTC day 1.
# This is a low-frequency best-effort quota check/archival, NOT continuous
# 72-hour capture. The archive only reads still-eligible 72-hour raw rows;
# a month of incoming originals cannot be recovered by this workflow.
# Automatic D1 raw-news deletion is PAUSED; no monthly cleanup job.
# Backblaze B2 has its OWN independent provider lifecycle rule and must be
# changed by the bucket owner; this workflow cannot disable provider rules.
# Archive evidence/rights and PREDGE protected capacity remain unchanged.
# Existing provider-approved maintenance=true admission and atomic B2 reserve are mandatory.
on:
  pull_request:
    paths:
      - ".github/workflows/phase2h-private-raw-archive.yml"
      - "scripts/ops/phase2h-canonical-census-receipt.mjs"
      - "scripts/tests/phase2h-canonical-census-receipt.test.mjs"
      - "scripts/tests/phase2h-country-archived-question.test.mjs"
      - "scripts/lib/phase2h-country-originals-195.mjs"
      - "scripts/lib/country-news-mentions-195.mjs"
      - "workers/control-plane/src/phase2h-private-raw-news.mjs"
      - "scripts/ops/phase2h-permanent-production-acceptance.mjs"
      - "scripts/ops/phase2h-verify-b2-72h-lifecycle.mjs"
      - "scripts/ops/phase2h-archive-private-raw-news.mjs"
      - "scripts/tests/phase2h-raw-news.test.mjs"
      - "scripts/lib/phase2h-retention-72h.mjs"
      - "scripts/tests/phase2h-retention-72h.test.mjs"
      - "scripts/lib/phase2h-raw-original-records.mjs"
      - "scripts/lib/phase2ib-fastlane-private-staging.mjs"
      - "scripts/lib/phase2i-osint-country-fair-raw-staging.mjs"
      - "scripts/tests/phase2ib-fastlane-private-staging.test.mjs"
      - "scripts/tests/phase2i-osint-country-fair-raw-staging.test.mjs"
  schedule:
    - cron: "29 0 1 * *"

permissions:
  contents: read

concurrency:
  group: geomacro-phase2h-governed-b2-production
  cancel-in-progress: false

jobs:
  offline-census-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify scoped metadata-only census and strict B2 admission (offline)
        run: node --test scripts/tests/phase2h-canonical-census-receipt.test.mjs scripts/tests/phase2h-maintenance-gate.test.mjs scripts/tests/phase2h-country-archived-question.test.mjs scripts/tests/phase2h-raw-news.test.mjs scripts/tests/phase2h-retention-72h.test.mjs scripts/tests/phase2ib-fastlane-private-staging.test.mjs scripts/tests/phase2i-osint-country-fair-raw-staging.test.mjs
  quota-admission:
    if: >-
      github.event_name == 'schedule' &&
      github.event.schedule == '29 0 1 * *' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: production
    outputs:
      maintenance: ${{ steps.provider.outputs.maintenance }}
      raw_archive: ${{ steps.provider.outputs.phase2h_raw_archive }}
      retention_cleanup: ${{ steps.provider.outputs.retention_cleanup }}
      retention_cleanup_max_rows: ${{ steps.provider.outputs.retention_cleanup_max_rows }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Disclose paused D1 cleanup and monthly archive coverage honestly
        shell: bash
        run: |
          echo "::warning::Phase2H automatic D1 deletion is PAUSED. Monthly archival is not continuous; B2 provider lifecycle must be disabled separately by bucket owner."
          echo "### Phase2H cadence limitation" >> "$GITHUB_STEP_SUMMARY"
          echo "Monthly archive is not 72-hour continuous capture. Automatic D1 cleanup is PAUSED; no D1 delete SQL runs here. Backblaze B2 native lifecycle remains external and MUST be disabled separately for the raw-news prefix. PREDGE is unchanged." >> "$GITHUB_STEP_SUMMARY"
      - id: provider
        name: Verify provider-approved D1 maintenance=true admission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/derived-news
          node scripts/ops/plan-d1-bundled-work.mjs | tee artifacts/derived-news/phase2h-provider-admission.log
      - name: Publish Phase2H archive admission truth without an extra provider request
        if: always()
        env:
          RAW_ARCHIVE_GRANTED: ${{ steps.provider.outputs.phase2h_raw_archive }}
          RETENTION_GRANTED: ${{ steps.provider.outputs.retention_cleanup }}
          CLEANUP_MAX_ROWS: ${{ steps.provider.outputs.retention_cleanup_max_rows }}
          ADMISSION_STEP_OUTCOME: ${{ steps.provider.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RAW_ARCHIVE_GRANTED}" = true ]; then
            status="ADMITTED_PENDING_B2_PROOF"
          elif [ "${ADMISSION_STEP_OUTCOME}" != success ]; then
            status="QUOTA_MEASUREMENT_FAILED_NO_ARCHIVE_PROOF"
            echo "::warning::Phase2H provider quota measurement failed; no B2/D1 proof"
          else
            status="ARCHIVE_HELD_NOT_VERIFIED"
            echo "::warning::Phase2H D1 quota held: B2 archive and D1 cleanup cannot run; green workflow is NOT end-to-end archival acceptance"
          fi
          {
            echo "### Phase 2H — production quota admission"
            echo "| Evidence | Result |"
            echo "|---|---|"
            echo "| Actual archive eligibility | ${status} |"
            echo "| D1 archive grant | ${RAW_ARCHIVE_GRANTED:-unknown} |"
            echo "| D1 cleanup grant | ${RETENTION_GRANTED:-unknown} |"
            echo "| Maximum authorized D1 cleanup rows | ${CLEANUP_MAX_ROWS:-0} |"
            echo "| Actual B2 PUT/GET + D1 ack | Requires separate successful archive receipt |"
            echo ""
            echo "A green GitHub Actions run is **not** proof of archival. Read the provider receipt and independent B2 result before claiming production PASS."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep actual provider admission receipt even when maintenance is held
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase2h-provider-maintenance-admission-${{ github.run_id }}
          path: artifacts/derived-news/phase2h-provider-admission.log
          retention-days: 90
          if-no-files-found: warn

  raw-b2-to-production-question:
    needs: quota-admission
    if: >-
      needs.quota-admission.result == 'success' &&
      needs.quota-admission.outputs.raw_archive == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment: production
    env:
      # This legacy variable is scoped to the Phase2H archive scripts only.
      # Its value is the new archive-only governor grant, NOT the general
      # maintenance lane. Other workflows still receive the original grant.
      PHASE2H_PROVIDER_MAINTENANCE: ${{ needs.quota-admission.outputs.raw_archive }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: derived_news_backup
      B2_REQUEST_BUDGET: "12"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout trusted current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify Phase 2H regression and strict immutable formats
        run: |
          node --test scripts/tests/phase2h-raw-news.test.mjs scripts/tests/phase2h-maintenance-gate.test.mjs scripts/tests/phase2h-canonical-census-receipt.test.mjs scripts/tests/phase2h-country-archived-question.test.mjs
          node --check scripts/ops/phase2h-permanent-production-acceptance.mjs
      - name: Resolve existing canonical D1 database for archive read and quota governor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/.test(account??"")||(token??"").length<20)
            throw Error("PHASE2H_CANONICAL_D1_CREDENTIALS_MISSING");
          const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+
            account+"/d1/database?per_page=100",{
            headers:{Authorization:"Bearer "+token},signal:AbortSignal.timeout(15000)});
          const data=await r.json();
          const matches=data?.result?.filter(x=>x.name==="geomacro-control-plane")??[];
          const id=matches[0]?.uuid;
          if(!r.ok||data.success!==true||matches.length!==1||
             !/^[a-f0-9-]{36}$/i.test(id??""))
            throw Error("PHASE2H_CANONICAL_D1_NOT_VERIFIED");
          appendFileSync(process.env.GITHUB_ENV,"D1_DATABASE_ID="+id+"\n");
          NODE
      - name: Preserve independently read canonical D1 category census before B2 attempt
        run: node scripts/ops/phase2h-canonical-census-receipt.mjs
      - name: Actual private B2 PUT, two GETs, D1 same-ID and deployed question JSON
        run: node scripts/ops/phase2h-permanent-production-acceptance.mjs
      - name: Preserve redacted permanent acceptance receipt (never original content)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase2h-real-b2-question-production-proof-${{ github.run_id }}
          path: |
            artifacts/derived-news/phase2h-permanent-production-acceptance.json
            artifacts/derived-news/phase2h-canonical-census-receipt.json
          retention-days: 90
          if-no-files-found: warn

  phase2ib-durable-archive-cycle:
    name: Retain real governed B2 result or quota hold on 585-cell evidence branch
    needs: [quota-admission, raw-b2-to-production-question]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      github.event.schedule == '29 0 1 * *' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      PHASE2IB_MAINTENANCE: ${{ needs.quota-admission.outputs.raw_archive || 'unknown' }}
      PHASE2IB_ARCHIVE_JOB: ${{ needs.raw-b2-to-production-question.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact immutable main SHA, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Read optional same-run Phase 2H production archive acceptance artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/derived-news artifacts/phase2i
          # Missing/failed original archiving never becomes a positive archive receipt.
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "phase2h-real-b2-question-production-proof-${GITHUB_RUN_ID}" \
            --dir artifacts/derived-news \
            >/dev/null 2>&1 || true
          test ! -f artifacts/derived-news/phase2h-permanent-production-acceptance.json || \
            jq -e '.schema == "geomacro.phase2h.permanent-raw-b2-production-acceptance.v1"' \
              artifacts/derived-news/phase2h-permanent-production-acceptance.json >/dev/null
      - name: Load previous durable real archive receipt without modifying source probes
        shell: bash
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch origin refs/heads/phase2i-source-evidence:refs/remotes/origin/phase2i-source-evidence
          git show refs/remotes/origin/phase2i-source-evidence:data/phase2i/raw-archive-cycle.latest.json > artifacts/phase2i/previous-raw-archive-cycle.json || rm -f artifacts/phase2i/previous-raw-archive-cycle.json
      - name: Fail-closed real B2 receipts, category D1 census and held backlog
        run: |
          node --test scripts/tests/phase2i-b-evidence-bridge.test.mjs
          node scripts/ops/phase2i-b-evidence-bridge.mjs --cycle
      - name: Commit metadata-only protected archive-cycle receipt to existing evidence branch
        shell: bash
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch origin refs/heads/phase2i-source-evidence:refs/remotes/origin/phase2i-source-evidence
          evidence="$RUNNER_TEMP/phase2i-source-evidence"
          git worktree add --detach "$evidence" refs/remotes/origin/phase2i-source-evidence
          mkdir -p "$evidence/data/phase2i"
          cp artifacts/phase2i/raw-archive-cycle.latest.json "$evidence/data/phase2i/raw-archive-cycle.latest.json"
          git -C "$evidence" add data/phase2i/raw-archive-cycle.latest.json
          if ! git -C "$evidence" diff --cached --quiet; then
            git -C "$evidence" config user.name "github-actions[bot]"
            git -C "$evidence" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$evidence" commit -m "Retain strict Phase 2I-B D1/B2 governed archive cycle evidence"
            git -C "$evidence" -c http.extraheader="$auth" push origin HEAD:refs/heads/phase2i-source-evidence
          fi

