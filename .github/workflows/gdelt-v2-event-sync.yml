name: GDELT V2 Event B2 + D1 Governed Sync

# The retired Supabase-only path is NOT executed.
# 15m: pin and verify GDELT Event ZIP -> bounded private B2 archive
# -> B2 full GET/hash -> private canonical D1 event index + readback.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gdelt-v2-event-sync.yml"
      - "scripts/ops/publish-risk-gate-gdelt-wide-net.mjs"
      - "scripts/lib/risk-gate-gdelt-wide-net.test.mjs"
      - "lib/risk-gate-gdelt-event-wide-net.mjs"
      - "workers/control-plane/src/risk-gate-gdelt-event-index.mjs"
      - "workers/control-plane/migrations/0104_risk_gate_gdelt_b2_d1_manifest.sql"
      - "src/__tests__/gdelt-v2-certified-runtime-governance.test.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gdelt-v2-event-sync.yml"
      - "scripts/ops/publish-risk-gate-gdelt-wide-net.mjs"
      - "scripts/lib/risk-gate-gdelt-wide-net.test.mjs"
      - "lib/risk-gate-gdelt-event-wide-net.mjs"
      - "workers/control-plane/src/risk-gate-gdelt-event-index.mjs"
      - "workers/control-plane/migrations/0104_risk_gate_gdelt_b2_d1_manifest.sql"
      - "src/__tests__/gdelt-v2-certified-runtime-governance.test.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-gdelt-v2-b2-d1-production
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Validate B2+D1 and no funds contracts
        run: |
          set -euo pipefail
          node --check scripts/ops/publish-risk-gate-gdelt-wide-net.mjs
          node --check lib/risk-gate-gdelt-event-wide-net.mjs
          node --check workers/control-plane/src/risk-gate-gdelt-event-index.mjs
          node --test scripts/lib/risk-gate-gdelt-wide-net.test.mjs
      - name: No Supabase client, DB URL or credentials
        run: |
          set -euo pipefail
          ! grep -qi 'SUPABASE_' .github/workflows/gdelt-v2-event-sync.yml
          ! grep -q 'ingest-gdelt-v2-events-live.mjs' .github/workflows/gdelt-v2-event-sync.yml
          grep -q 'B2_ACCOUNT_QUOTA_REQUIRED: "1"' .github/workflows/gdelt-v2-event-sync.yml

  sync:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: gdelt_v2_event_sync
      B2_REQUEST_BUDGET: "4"
    steps:
      - name: Checkout exact main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Resolve existing canonical D1 UUID for B2 quota governor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[0-9a-f]{32}$/iu.test(account??"")||(token??"").length<20)
            throw Error("GDELT_B2_D1_ACCOUNT_CONFIGURATION_REQUIRED");
          const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+
            account+"/d1/database?per_page=100",{
            headers:{authorization:"Bearer "+token,accept:"application/json"},
            redirect:"error",signal:AbortSignal.timeout(15000)
          });
          if(!response.ok)throw Error("GDELT_CANONICAL_D1_DISCOVERY_FAILED");
          const payload=await response.json();
          const match=(payload.result??[]).filter(x=>x?.name==="geomacro-control-plane");
          if(payload.success!==true||match.length!==1||
            !/^[0-9a-f-]{36}$/iu.test(match[0]?.uuid??""))
            throw Error("GDELT_CANONICAL_D1_NOT_UNIQUE");
          appendFileSync(process.env.GITHUB_ENV,
            "D1_DATABASE_ID="+match[0].uuid+String.fromCharCode(10));
          NODE
      - name: Verify GDELT ZIP, B2 full readback then D1 PUT+GET
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/direct-corridor-intake
          node scripts/ops/publish-risk-gate-gdelt-wide-net.mjs
      - name: Upload private-safe receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gdelt-v2-b2-d1-verified-receipt
          path: artifacts/direct-corridor-intake/risk-gate-gdelt-wide-net.json
          if-no-files-found: warn
          retention-days: 3
