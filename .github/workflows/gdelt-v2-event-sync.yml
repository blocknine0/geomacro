name: GDELT V2 Event Governed Sync

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingest-gdelt-v2-events-live.mjs"
      - ".github/workflows/gdelt-v2-event-sync.yml"
      - "src/__tests__/gdelt-v2-certified-runtime-governance.test.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Guard certified source, mapping and commercial boundaries
        shell: bash
        run: |
          set -euo pipefail
          file=scripts/ingest-gdelt-v2-events-live.mjs
          grep -q 'EXPECTED_COLUMN_COUNT = 61' "$file"
          grep -q 'OFFICIAL_GDELT_FIPS_LOOKUP_TO_CANONICAL_COUNTRY_REGISTRY' "$file"
          grep -q 'CONFLICT_ROOT_CODES' "$file"
          grep -q 'enabled_for_commercial_signals === true' "$file"
          grep -q 'certification.certification_state === "CERTIFIED"' "$file"
          grep -q 'certification.endpoint_status === "PASS"' "$file"
          grep -q 'GDELT_WRITE_GOVERNANCE_CERTIFICATION_INVALID' "$file"
          grep -q 'risk_gate_signal_activation: false' "$file"
          echo 'PASS: GDELT write path requires current certified commercial governance and still cannot bypass the Risk Gate evidence boundary.'

  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GRI_DB_MODE: direct_postgres
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify unzip and authoritative database target
        shell: bash
        run: |
          set -euo pipefail
          command -v unzip >/dev/null
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_SUPABASE_PROJECT_REF" || { echo "::error::Wrong production project id"; exit 1; }
          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const db = new URL(process.env.SUPABASE_DB_URL);
          const direct = db.hostname === `db.${ref}.supabase.co` && db.username === 'postgres';
          const pooler = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          if (!['postgres:', 'postgresql:'].includes(db.protocol) || (!direct && !pooler) || !db.password || db.pathname !== '/postgres') {
            throw new Error('SUPABASE_DB_URL is not the authoritative production database');
          }
          NODE
      - name: Verify exact certified GDELT V2 production governance
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "select concat_ws('|',s.commercial_usage_status,s.enabled_for_ingestion::text,s.enabled_for_commercial_signals::text,c.certification_state,c.rights_status,c.endpoint_status,c.schema_status,c.freshness_status,c.provenance_status,c.independence_status,c.adapter_status,c.runtime_status,c.fallback_status) from public.live_external_sources s join public.live_source_certification_records c using(source_id) where s.source_id='gdelt_v2_events'")"
          expected='COMMERCIAL_OK|true|true|CERTIFIED|COMMERCIAL_OK|PASS|PASS|FRESH|PASS|PASS|TESTED|PASS|READY'
          test "$state" = "$expected" || { echo "::error::GDELT certified production state is not eligible: $state"; exit 1; }
          echo 'PASS: GDELT source is explicitly certified and commercially eligible.'
      - name: Dry-run latest GDELT Event batch before write
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ingest-gdelt-v2-events-live.mjs 2>&1 | tee gdelt-v2-event-dry-run.log
          grep -q 'PASS: GDELT V2 EVENT DRY RUN CLEAN; DATABASE UNCHANGED' gdelt-v2-event-dry-run.log
          grep -q '"risk_gate_signal_activation": false' gdelt-v2-event-dry-run.log
      - name: Persist normalized observations and release manifest
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ingest-gdelt-v2-events-live.mjs --write 2>&1 | tee gdelt-v2-event-write.log
          grep -q 'PASS: GDELT V2 EVENT GOVERNED OBSERVATIONS + RELEASE MANIFEST WRITTEN' gdelt-v2-event-write.log
      - name: Verify latest governed production release
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "select verified_rows || '|' || unmapped_rows || '|' || rejected_rows || '|' || write_completed::text from public.live_source_release_manifests where source_id='gdelt_v2_events' order by retrieved_at desc limit 1")"
          test -n "$manifest" || { echo "::error::No GDELT release manifest found"; exit 1; }
          verified="${manifest%%|*}"
          rest="${manifest#*|}"
          unmapped="${rest%%|*}"
          rest="${rest#*|}"
          rejected="${rest%%|*}"
          written="${rest##*|}"
          test "$written" = 'true' || { echo "::error::Latest GDELT manifest is not write-complete"; exit 1; }
          printf '{"manifest_verified_rows":%s,"manifest_unmapped_rows":%s,"manifest_rejected_rows":%s,"write_completed":true,"source_certification_required":true,"risk_gate_signal_activation":false}\n' "$verified" "$unmapped" "$rejected" | tee gdelt-v2-event-production-evidence.json
          echo 'PASS: certified GDELT release verified; direct Risk Gate activation remains prohibited.'
      - name: Upload governed production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gdelt-v2-event-governed-sync
          path: |
            gdelt-v2-event-dry-run.log
            gdelt-v2-event-write.log
            gdelt-v2-event-production-evidence.json
          if-no-files-found: warn
          retention-days: 30
