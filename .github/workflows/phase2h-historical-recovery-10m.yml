name: Phase 2H Historical Original Archive Recovery (10-Minute)
on:
  schedule:
    - cron: "*/10 * * * *"
  pull_request:
    paths:
      - ".github/workflows/phase2h-historical-recovery-10m.yml"
      - "scripts/ops/phase2h-archive-private-raw-news.mjs"
      - "scripts/ops/plan-d1-bundled-work.mjs"
      - "scripts/tests/phase2h-historical-recovery.test.mjs"
permissions:
  contents: read
concurrency:
  group: geomacro-phase2h-governed-b2-production
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: node --test scripts/tests/phase2h-historical-recovery.test.mjs scripts/tests/phase2h-bulk-worker-archive.test.mjs
  quota-admission:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      approved: ${{ steps.provider.outputs.historical_recovery }}
      max_rows: ${{ steps.provider.outputs.historical_recovery_max_rows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Observe account-wide quota before history-only drain
        id: provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs
  historical-drain:
    needs: quota-admission
    if: needs.quota-admission.outputs.approved == 'true' && needs.quota-admission.outputs.max_rows == '200' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment: production
    env:
      PHASE2H_PROVIDER_MAINTENANCE: ${{ needs.quota-admission.outputs.approved }}
      PHASE2H_HISTORICAL_RECOVERY: "1"
      PHASE2H_BULK_WORKER_ARCHIVE_V2: "1"
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: derived_news_backup
      B2_REQUEST_BUDGET: "12"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Strict historical and bounded ACK schema checks
        run: node --test scripts/tests/phase2h-historical-recovery.test.mjs scripts/tests/phase2h-atomic-bulk-archive-ack.test.mjs scripts/tests/phase2h-bulk-worker-archive.test.mjs
      - name: Resolve canonical production D1 database ID
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/.test(account??"")||(token??"").length<20)
            throw Error("PHASE2H_HISTORICAL_D1_CREDENTIALS_REQUIRED");
          const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+
            "/d1/database?per_page=100",{headers:{Authorization:"Bearer "+token},
            signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          const rows=data?.result?.filter(x=>x.name==="geomacro-control-plane")??[];
          if(!response.ok||data.success!==true||rows.length!==1||
             !/^[a-f0-9-]{36}$/i.test(rows[0]?.uuid??""))
            throw Error("PHASE2H_HISTORICAL_D1_UNVERIFIED");
          appendFileSync(process.env.GITHUB_ENV,"D1_DATABASE_ID="+rows[0].uuid+"\n");
          NODE
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install exact locked Zod v4 dependency for historical schema validation
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Independent original D1 census before archive attempt
        run: |
          set -euo pipefail
          node scripts/ops/phase2h-canonical-census-receipt.mjs
          cp artifacts/derived-news/phase2h-canonical-census-receipt.json \
            artifacts/derived-news/phase2h-historical-census-before.json
      - name: Archive at most 200 oldest unarchived D1 originals regardless of publication age
        run: node scripts/ops/phase2h-archive-private-raw-news.mjs
      - name: Independent original D1 census and remaining backlog acceptance
        run: |
          set -euo pipefail
          node scripts/ops/phase2h-canonical-census-receipt.mjs
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from "node:fs";
          const before=JSON.parse(readFileSync("artifacts/derived-news/phase2h-historical-census-before.json"));
          const after=JSON.parse(readFileSync("artifacts/derived-news/phase2h-canonical-census-receipt.json"));
          if(before.schema!=="geomacro.phase2h.production-canonical-census-receipt.v1"||
             after.schema!==before.schema||
             !Number.isSafeInteger(before.pending_total)||
             !Number.isSafeInteger(after.pending_total)||
             !Number.isSafeInteger(after.pending_expired_72h_total))
            throw Error("HISTORICAL_CENSUS_BEFORE_AFTER_INVALID");
          const delta=before.pending_total-after.pending_total;
          const fullyDrained=after.pending_total===0&&after.pending_expired_72h_total===0;
          const report={
            schema:"geomacro.phase2h.historical-10m-backlog-acceptance.v1",
            initial_pending:before.pending_total,
            final_pending:after.pending_total,
            archival_pending_reduction_observed:delta,
            historical_unarchived_remaining:after.pending_expired_72h_total,
            full_zero_backlog_accepted:fullyDrained,
            real_remote_object_proof_in_separate_archive_receipt:true
          };
          console.log(JSON.stringify(report));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "Historical pending before: "+before.pending_total+
            ", after: "+after.pending_total+
            ", older than 72h remaining: "+after.pending_expired_72h_total+
            ", zero backlog: "+fullyDrained+"\n");
          if(!fullyDrained)
            console.log("::warning::PHASE2H_HISTORICAL_BACKLOG_NOT_YET_ZERO");
          NODE
      - name: Preserve metadata-only B2 and D1 ACK receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase2h-historical-drain-${{ github.run_id }}
          path: |
            artifacts/derived-news/phase2h-private-raw-b2-verified.json
            artifacts/derived-news/phase2h-historical-census-before.json
            artifacts/derived-news/phase2h-canonical-census-receipt.json
          if-no-files-found: warn
          retention-days: 30
