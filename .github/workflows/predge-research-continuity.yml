name: Predge Research Continuity and Pilot Renewal (No Funds)
on:
  schedule:
    # Four protected research reads/day, not every minute.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch: {}
  # One read-only acceptance immediately after first reviewed main merge.
  push:
    branches: [main]
    paths:
      - ".github/workflows/predge-research-continuity.yml"
      - "scripts/ops/verify-predge-pilot-continuity.mjs"
  pull_request:
    paths:
      - ".github/workflows/predge-research-continuity.yml"
      - "scripts/ops/verify-predge-pilot-continuity.mjs"
      - "scripts/ops/verify-predge-pilot-continuity.test.mjs"
permissions:
  contents: read
concurrency:
  group: geomacro-predge-research-continuity
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: "22"}
      - name: Offline no-funds contract tests
        run: |
          node --check scripts/ops/verify-predge-pilot-continuity.mjs
          node --test scripts/ops/verify-predge-pilot-continuity.test.mjs
  protected-live-check:
    needs: contract
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      PREDGE_RESEARCH_NEWS_TOKEN_OVERRIDE: ${{ secrets.PREDGE_RESEARCH_NEWS_TOKEN_OVERRIDE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: "22"}
      - name: Authenticated D1 parity and 90-day renewal warning
        run: node scripts/ops/verify-predge-pilot-continuity.mjs
