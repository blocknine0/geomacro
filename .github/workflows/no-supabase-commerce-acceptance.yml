name: No-Supabase Commerce Acceptance

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-no-supabase-commerce-acceptance
  cancel-in-progress: false

jobs:
  accept:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Require durable ledger token
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || { echo "GEOMACRO_COMMERCE_LEDGER_TOKEN must be at least 32 characters"; exit 2; }

      - name: Install locked runtime dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify commerce ordering and durable fail-closed invariants
        run: bun test src/__tests__/agent-commerce-delivery-ledger-static.test.ts src/__tests__/commerce-ledger-no-supabase-acceptance-static.test.ts

      - name: Run actual server commerce adapter with Supabase absent
        env:
          GEOMACRO_COMMERCE_LEDGER_BACKEND: durable_object
          GEOMACRO_COMMERCE_LEDGER_URL: https://geomacro-commerce-ledger.daspallab202391.workers.dev
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: bun scripts/ops/verify-commerce-no-supabase.ts

      - name: Confirm acceptance remains no-funds
        shell: bash
        run: |
          set -euo pipefail
          echo "No-Supabase commerce adapter acceptance completed with synthetic ledger transitions only."
          echo "No Circle, Coinbase, Nevermined, x402 or other provider settlement was executed."
          echo "Real-funds activation remains separately owner-authorized."
