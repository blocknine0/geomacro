name: Sync Stakes
# Stake indexing is retained for existing Arc Testnet technical-proof markets,
# but it no longer needs a 30-minute production-style cadence while market
# creation is manual-only.
on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-stakes
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify Arc Testnet and contract target
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: bun scripts/ops/verify-arc-testnet-target.mjs
      - name: Verify authoritative Supabase target
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
        run: bun scripts/db/assert-authoritative-supabase.mjs
      - name: Sync stake index
        run: bun scripts/sync-stakes.js
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OLD_CONTRACT_ADDRESS: ${{ secrets.OLD_CONTRACT_ADDRESS }}
          DEPLOY_BLOCK_V2: ${{ vars.DEPLOY_BLOCK_V2 }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOY_BLOCK: ${{ vars.DEPLOY_BLOCK }}
