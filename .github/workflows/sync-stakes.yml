name: Sync Stakes
# Stake indexing is retained for existing Arc Testnet technical-proof markets,
# but it no longer needs a 30-minute production-style cadence while market
# creation is manual-only.
on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch: {}
concurrency:
  group: sync-stakes
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-stakes.js
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          OLD_CONTRACT_ADDRESS: ${{ secrets.OLD_CONTRACT_ADDRESS }}
          DEPLOY_BLOCK_V2: ${{ vars.DEPLOY_BLOCK_V2 }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOY_BLOCK: ${{ vars.DEPLOY_BLOCK }}
