name: Structured Evidence B2 Archive Canary Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/structured-evidence-b2-archive-canary-once.yml"

permissions:
  contents: read

concurrency:
  group: structured-evidence-b2-archive-canary
  cancel-in-progress: false

jobs:
  archive-canary:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      STRUCTURED_EVIDENCE_ARCHIVE_OLDER_DAYS: "7"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "1.4.2" }

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify required archive configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SUPABASE_URL" = "https://ldpwajisioljyjtojvfx.supabase.co"
          test -n "$APP_SUPABASE_SERVICE_ROLE_KEY"
          test "$B2_S3_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"

      - name: Archive exactly one old evidence row without deletion
        run: node scripts/ops/b2-archive-structured-evidence-canary.mjs
