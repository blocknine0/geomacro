name: Website Derived News Continuity

# This is the missing unattended ingestion that the old Supabase-backed
# Intelligence page had. Free, derived ONLY, no Supabase or paid API writes.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/lib/global-official-release-feeds.mjs"
      - ".github/workflows/website-derived-news-continuity.yml"
      - "scripts/ops/publish-website-derived-news.ts"
      - "src/lib/stateless-intelligence-model.ts"
      - "src/lib/stateless-public-intelligence.server.ts"
      - "src/lib/stateless-pib-mines-original.server.ts"
      - "workers/control-plane/src/website-derived-intelligence.mjs"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-website-derived-news-continuity
  cancel-in-progress: false

jobs:
  refresh-derived-news:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Require existing control-plane authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || {
            echo "::error::Derived news D1 publisher authorization unavailable"
            exit 2
          }
      - name: Read three domains and write only derived news to existing D1
        shell: bash
        run: bun scripts/ops/publish-website-derived-news.ts
      - name: Independently verify public derived-news journal
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl -sS --max-time 12 -o "$body" -w '%{http_code}' https://geomacro-control-plane.daspallab202391.workers.dev/v1/public/website-derived-news || true)"
          test "$code" = "200" || { echo "::error::Derived D1 website feed unavailable"; exit 3; }
          node - "$body" <<'NODE'
          const fs = require("fs");
          const doc=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(doc.ok!==true || doc.schema!=="geomacro.website-derived-news-feed.v1" ||
             doc.original_release_delay_minutes!==15 ||
             doc.delivery_scope!=="free_website_only" ||
             !Array.isArray(doc.signals) ||
             doc.signals.some(s=>s.severity!==null||s.same_event_corrob_verified!==false||
                /https?:\/\//u.test(JSON.stringify(s))))
            throw Error("DERIVED_NEWS_PUBLIC_SCHEMA_OR_PRIVACY_MISMATCH");
          console.log(JSON.stringify({schema:"geomacro.website-derived-news-readback-receipt.v1",
            verified:true,derived_rows:doc.signals.length,release_delay_minutes:15,
            raw_upstream_disclosed:false,supabase_dependency:false}));
          NODE
