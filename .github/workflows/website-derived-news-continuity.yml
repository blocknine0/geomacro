name: Website Derived News Continuity

# Supabase-free hourly collection for all three public derived-news categories.
# GitHub cron is best effort; only owned structured news is written to Cloudflare D1.
# Signed Finds/B2 backup retain the existing quota governor and rights boundary.
on:
  pull_request:
    paths:
      # Re-run recovery smoke for each changed canonical archive/catch-up contract.
      - "scripts/lib/website-news-canonical-reconciliation.mjs"
      - "scripts/ops/reconcile-website-news-to-d1.ts"
      - "scripts/tests/website-news-canonical-reconciliation.test.mjs"
      - "scripts/tests/website-news-archive-admission.test.mjs"
      - "scripts/ops/publish-website-derived-news.ts"
      - "scripts/lib/phase2g-per-id-d1-reconciliation.mjs"
      - "scripts/lib/phase2h-raw-original-records.mjs"
      - "scripts/ops/phase2h-archive-private-raw-news.mjs"
      - "scripts/ops/phase2h-verify-private-question-delivery.mjs"
      - "scripts/tests/phase2h-raw-news.test.mjs"
      - "workers/control-plane/src/phase2h-private-raw-news.mjs"
      - "workers/control-plane/migrations/0035_phase2h_private_raw_news.sql"
      - "scripts/tests/phase2g-per-id-d1-reconciliation.test.mjs"
      - "scripts/ops/publish-permanent-derived-news-archive.mjs"
      - "scripts/ops/publish-permanent-derived-news-archive.test.mjs"
      - "scripts/lib/derived-news-b2-readwrite-backup.mjs"
      - "scripts/ops/archive-live-derived-news-to-b2.mjs"
      - "scripts/tests/derived-news-b2-readwrite-backup.test.mjs"
      - "scripts/lib/derived-news-readback-policy.mjs"
      - "scripts/lib/derived-news-d1-failure.mjs"
      - "scripts/tests/derived-news-readback-policy.test.mjs"
      - "scripts/tests/derived-news-worker-policy.test.mjs"
      - "scripts/tests/derived-news-deploy-order.test.mjs"
      - "scripts/ops/verify-derived-news-public-readback.mjs"
      - "scripts/tests/derived-news-public-readback.test.mjs"
      - "scripts/ops/verify-production-observed-195x3.mjs"
      - "scripts/tests/verify-production-observed-195x3.test.mjs"
      - ".github/workflows/website-derived-news-continuity.yml"
      - "scripts/ops/plan-d1-bundled-work.mjs"
      - "scripts/tests/plan-d1-bundled-work.test.mjs"
      - "scripts/lib/phase2f-category-source-receipt.mjs"
      - "scripts/tests/phase2f-category-source-receipt.test.mjs"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Deploy D1 Control Plane", "Deploy Permanent Public Finds Archive"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/lib/original-verification-policy.ts"
      - "src/lib/release-news-observation.ts"
      - "scripts/ops/refresh-derived-news-editorial.ts"
      - "scripts/tests/actor-action-news.test.mjs"
      - "scripts/lib/global-official-release-feeds.mjs"
      - ".github/workflows/website-derived-news-continuity.yml"
      - "scripts/ops/publish-website-derived-news.ts"
      - "scripts/lib/phase2g-per-id-d1-reconciliation.mjs"
      - "scripts/tests/phase2g-per-id-d1-reconciliation.test.mjs"
      - "scripts/ops/publish-automated-intelligence-inputs.ts"
      - "scripts/lib/derived-news-b2-readwrite-backup.mjs"
      - "scripts/ops/archive-live-derived-news-to-b2.mjs"
      - "scripts/tests/derived-news-b2-readwrite-backup.test.mjs"
      - "scripts/ops/verify-production-observed-195x3.mjs"
      - "scripts/tests/verify-production-observed-195x3.test.mjs"
      - "scripts/ops/verify-all-news-signed-publications.mjs"
      - "scripts/tests/public-signed-news.test.mjs"
      - "workers/control-plane/src/public-signed-news.mjs"
      - "src/lib/automated-intelligence-input.ts"
      - "src/lib/stateless-public-intelligence.server.ts"
      - "src/lib/stateless-intelligence-model.ts"
      - "src/lib/stateless-public-intelligence.server.ts"
      - "src/lib/stateless-canada-original.server.ts"
      - "src/lib/stateless-pib-mines-original.server.ts"
      - "workers/control-plane/src/website-derived-intelligence.mjs"
      - "workers/control-plane/src/index.mjs"
      - "scripts/lib/derived-news-readback-policy.mjs"
      - "scripts/lib/derived-news-d1-failure.mjs"
      - "scripts/tests/derived-news-readback-policy.test.mjs"
      - "scripts/tests/derived-news-worker-policy.test.mjs"
      - "scripts/tests/derived-news-deploy-order.test.mjs"
      - "scripts/ops/verify-derived-news-public-readback.mjs"
      - "scripts/tests/derived-news-public-readback.test.mjs"
      - "src/lib/automated-finds*"
      - "src/lib/low-authority-source-review.ts"
      - "scripts/ops/review-derived-inputs-low-authority.ts"
      - "scripts/lib/derived-original-reference-pins.mjs"
      - "scripts/lib/derived-original-reference-pins.test.mjs"
      - "scripts/lib/geomacro-original-page-readback.mjs"
      - "scripts/lib/all-news-original-evidence-audit.mjs"
      - "scripts/lib/automatic-news-qualification-coverage.mjs"
      - "scripts/lib/automatic-news-qualification-coverage.test.mjs"
      - "scripts/lib/bundled-original-source-quota.mjs"
      - "scripts/ops/emit-low-source-review-status.mjs"
      - "scripts/tests/emit-low-source-review-status.test.mjs"
      - "scripts/ops/persist-private-source-handoffs.ts"
      - "scripts/ops/read-private-source-handoffs.ts"
      - "src/lib/private-source-handoff.ts"
      - "workers/control-plane/src/private-source-handoffs.ts"
      - "src/lib/risk-object-signing.server.ts"
      - "scripts/ops/publish-automated-finds.ts"
      - "scripts/lib/automated-finds-run-health.mjs"
      - "scripts/lib/derived-news-source-health.mjs"
      - "scripts/lib/facts-only-derived-news-regression.test.mjs"
      - "scripts/lib/bundled-original-source-quota.test.mjs"
      - "scripts/lib/all-news-original-evidence-audit.test.mjs"
      - "scripts/lib/material-gri-news-review.mjs"
      - "scripts/tests/material-gri-news-review.test.mjs"
      - "scripts/lib/material-gri-country-evidence-worklist.mjs"
      - "scripts/ops/build-material-gri-country-worklist.mjs"
      - "scripts/tests/material-gri-country-evidence-worklist.test.mjs"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-website-derived-news-continuity
  cancel-in-progress: false

jobs:
  observed-195x3-static-contract:
    # PR smoke has no production environment or customer credentials.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify shared Website archive and PREDGE journal recovery contracts
        run: |
          node --check scripts/lib/website-news-canonical-reconciliation.mjs
          node --test scripts/tests/website-news-canonical-reconciliation.test.mjs scripts/tests/website-news-archive-admission.test.mjs
          node --check scripts/ops/publish-permanent-derived-news-archive.mjs
      - name: Verify permanent archive append-only behavior without production credentials
        run: |
          node --check scripts/ops/publish-permanent-derived-news-archive.mjs
          node --test scripts/ops/publish-permanent-derived-news-archive.test.mjs
      - name: Validate truthful 195-country observed-source matrix without network
        run: |
          node --check scripts/ops/verify-production-observed-195x3.mjs
          node --test scripts/tests/plan-d1-bundled-work.test.mjs
          node --test scripts/tests/phase2f-category-source-receipt.test.mjs
          node --test scripts/tests/verify-production-observed-195x3.test.mjs
          node --check scripts/lib/derived-news-b2-readwrite-backup.mjs
          node --check scripts/lib/derived-news-readback-policy.mjs
          node --check scripts/ops/archive-live-derived-news-to-b2.mjs
          node --test scripts/tests/derived-news-readback-policy.test.mjs
          node --test scripts/tests/derived-news-worker-policy.test.mjs
          node --test scripts/tests/derived-news-deploy-order.test.mjs
          node --check scripts/ops/verify-derived-news-public-readback.mjs
          node --test scripts/tests/derived-news-public-readback.test.mjs
          node --test scripts/tests/derived-news-b2-readwrite-backup.test.mjs
          node --test scripts/tests/phase2g-per-id-d1-reconciliation.test.mjs
          node --test scripts/tests/phase2h-raw-news.test.mjs
          node --check scripts/ops/phase2h-verify-private-question-delivery.mjs

  # Push-only quota counter evidence for this scoped recovery repair.
  # Existing production ingestion still refuses push-triggered publication.
  # Cloudflare GraphQL usage observation is read-only and consumes ZERO D1 rows.
  phase2f-readonly-quota-diagnostic:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify bounded quota classification offline
        run: |
          node --check scripts/ops/plan-d1-bundled-work.mjs
          node --test scripts/tests/plan-d1-bundled-work.test.mjs
      - name: Emit actual provider-readonly Phase 2F quota cause receipt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs

  quota-admission:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    outputs:
      research: ${{ steps.budget.outputs.research }}
      maintenance: ${{ steps.budget.outputs.maintenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - id: budget
        name: Reserve D1 account-wide headroom for core original ingestion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs

  archive-only-when-d1-held:
    needs: quota-admission
    # Same hourly publisher; an existing successful production-archive deploy
    # can also wake archive-only collection while the protected D1 lane is HELD.
    # Never bypass the quota governor or run from an untrusted PR/branch.
    # No paid/provider/PREDGE mutations and no additional cron.
    if: >-
      needs.quota-admission.result == 'success' &&
      needs.quota-admission.outputs.research == 'false' &&
      github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.path == '.github/workflows/deploy-permanent-public-finds-archive.yml' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Collect derived originals and archive candidate only (zero D1)
        env:
          GEOMACRO_DERIVED_ARCHIVE_ONLY: "1"
        run: bun scripts/ops/publish-website-derived-news.ts
      - name: Publish append-only permanent Finds archive without D1 dependency
        id: permanent-archive
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::PERMANENT_ARCHIVE_CLOUDFLARE_TOKEN_MISSING"; exit 2; }
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32 || { echo "::error::PERMANENT_ARCHIVE_CLOUDFLARE_ACCOUNT_MISSING"; exit 2; }
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          archive_ref="refs/remotes/origin/geomacro-permanent-finds-archive"
          git -c http.extraheader="$auth_header" fetch origin "refs/heads/geomacro-permanent-finds-archive:$archive_ref"
          archive_dir="$RUNNER_TEMP/geomacro-permanent-finds-archive"
          git worktree add --detach "$archive_dir" "$archive_ref"
          assets_dir="$GITHUB_WORKSPACE/workers/public-finds-archive/assets"
          node scripts/ops/publish-permanent-derived-news-archive.mjs \
            "$archive_dir" "$assets_dir" artifacts/derived-news/permanent-archive-candidates.json
          result_file="$RUNNER_TEMP/permanent-derived-news-archive-result.json"
          test -s "$result_file" || { echo "::error::PERMANENT_ARCHIVE_RESULT_MISSING"; exit 2; }
          deploy_needed="$(jq -r '.deploy_needed == true' "$result_file")"
          git -C "$archive_dir" add data
          if ! git -C "$archive_dir" diff --cached --quiet; then
            git -C "$archive_dir" config user.name "github-actions[bot]"
            git -C "$archive_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$archive_dir" commit -m "Append permanent Geomacro Finds archive"
            git -C "$archive_dir" -c http.extraheader="$auth_header" push origin HEAD:refs/heads/geomacro-permanent-finds-archive
          fi
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          if [[ "$deploy_needed" != "true" ]]; then
            echo "Permanent static archive has no new state to deploy."
            exit 0
          fi
          cd workers/public-finds-archive
          npx -y wrangler@4.136.3 deploy --config wrangler.jsonc

  refresh-derived-news:
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    needs: quota-admission
    # Never race a producer against any repository push. Source-only changes
    # are handled by the existing schedule/manual trigger; Worker changes resume
    # from the trusted main deployment completion. The live policy handshake is
    # the final fail-closed guard, even when downstream signature audit fails.
    if: >-
      needs.quota-admission.outputs.research == 'true' &&
      github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' &&
      github.event_name != 'push' &&
      (github.event_name != 'workflow_run' ||
       ( (github.event.workflow_run.path == '.github/workflows/deploy-d1-control-plane.yml' ||
         github.event.workflow_run.path == '.github/workflows/deploy-permanent-public-finds-archive.yml') &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: write
    env:
      GEOMACRO_AUTOMATED_FINDS_PUBLICATION: "1"
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: automated_finds
      B2_REQUEST_BUDGET: "12"
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
      RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Verify canonical Website-to-partner archive catch-up contract
        run: | 
          node --check scripts/lib/website-news-canonical-reconciliation.mjs
          node --test scripts/tests/website-news-canonical-reconciliation.test.mjs
          node --test scripts/tests/phase2g-per-id-d1-reconciliation.test.mjs
      - name: Verify append-only permanent archive retains old items and tolerates D1 outage
        run: |
          node --check scripts/ops/publish-permanent-derived-news-archive.mjs
          node --test scripts/ops/publish-permanent-derived-news-archive.test.mjs
      - name: Test individual news original-byte evidence vs unverified and commercial boundaries
        run: |
          node --test scripts/lib/bundled-original-source-quota.test.mjs
          node --test scripts/lib/all-news-original-evidence-audit.test.mjs
          node --test scripts/lib/automatic-news-qualification-coverage.test.mjs scripts/lib/derived-original-reference-pins.test.mjs
          node --test scripts/lib/facts-only-derived-news-regression.test.mjs
          node --test scripts/lib/geomacro-original-page-readback.test.mjs
      - name: Require existing control-plane authorization
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || {
            echo "::error::Derived news D1 publisher authorization unavailable"
            exit 2
          }
      - name: Resolve existing D1 shared B2 quota ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!/^[a-f0-9]{32}$/.test(account||''))throw Error('FINDS_D1_ACCOUNT_MISSING');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?per_page=100',{
            headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          const id=data.result?.find(x=>x.name==='geomacro-control-plane')?.uuid;
          if(!response.ok||data.success!==true||!/^[a-f0-9-]{36}$/.test(id||''))throw Error('FINDS_D1_LEDGER_UNAVAILABLE');
          appendFileSync(process.env.GITHUB_ENV,'D1_DATABASE_ID='+id+'\n');
          NODE
      - name: Read three domains and write only derived news to existing D1
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
          B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
          RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
          GEOMACRO_LOW_SOURCE_REVIEW: "1"
          GEOMACRO_LOW_REVIEW_REFS_FILE: ${{ runner.temp }}/geomacro-source-review-refs.json
        shell: bash
        run: bun scripts/ops/publish-website-derived-news.ts
      - name: Publish append-only permanent Finds archive without D1 dependency
        id: permanent-archive
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::PERMANENT_ARCHIVE_CLOUDFLARE_TOKEN_MISSING"; exit 2; }
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32 || { echo "::error::PERMANENT_ARCHIVE_CLOUDFLARE_ACCOUNT_MISSING"; exit 2; }
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          archive_ref="refs/remotes/origin/geomacro-permanent-finds-archive"
          git -c http.extraheader="$auth_header" fetch origin "refs/heads/geomacro-permanent-finds-archive:$archive_ref"
          archive_dir="$RUNNER_TEMP/geomacro-permanent-finds-archive"
          git worktree add --detach "$archive_dir" "$archive_ref"
          assets_dir="$GITHUB_WORKSPACE/workers/public-finds-archive/assets"
          node scripts/ops/publish-permanent-derived-news-archive.mjs \
            "$archive_dir" "$assets_dir" artifacts/derived-news/permanent-archive-candidates.json
          result_file="$RUNNER_TEMP/permanent-derived-news-archive-result.json"
          test -s "$result_file" || { echo "::error::PERMANENT_ARCHIVE_RESULT_MISSING"; exit 2; }
          deploy_needed="$(jq -r '.deploy_needed == true' "$result_file")"
          git -C "$archive_dir" add data
          if ! git -C "$archive_dir" diff --cached --quiet; then
            git -C "$archive_dir" config user.name "github-actions[bot]"
            git -C "$archive_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$archive_dir" commit -m "Append permanent Geomacro Finds archive"
            git -C "$archive_dir" -c http.extraheader="$auth_header" push origin HEAD:refs/heads/geomacro-permanent-finds-archive
          fi
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          if [[ "$deploy_needed" != "true" ]]; then
            echo "Permanent static archive has no new state to deploy."
            exit 0
          fi
          cd workers/public-finds-archive
          npx -y wrangler@4.136.3 deploy --config wrangler.jsonc
      - name: Catch up 72h archived Website IDs to the common D1 partner journal
        if: ${{ steps.permanent-archive.outcome == 'success' && success() }}
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: bun scripts/ops/reconcile-website-news-to-d1.ts
      - name: Verify all eligible Website archive IDs have canonical D1 readback
        if: ${{ success() }}
        run: node --test scripts/tests/website-news-canonical-reconciliation.test.mjs
      - name: Refresh retained actor-action news from existing private originals without changing clocks
        if: always()
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_LOW_REVIEW_PUBLIC_PEM: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_PEM }}
          GEOMACRO_LOW_REVIEW_PUBLIC_SHA256: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_SHA256 }}
        run: bun scripts/ops/refresh-derived-news-editorial.ts
      - name: Automatically approve and sign every unique retained derived input
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
        if: always()
        run: bun scripts/ops/publish-automated-intelligence-inputs.ts
      - name: Preserve private original references for automated review continuation
        if: always()
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_LOW_REVIEW_REFS_FILE: ${{ runner.temp }}/geomacro-source-review-refs.json
        run: bun scripts/ops/persist-private-source-handoffs.ts
      - name: Prepare restricted internal source-review capability
        if: always()
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {createHmac} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const root=(process.env.GEOMACRO_COMMERCE_LEDGER_TOKEN||'').trim();
          if(root.length<32)throw Error('LOW_REVIEW_SCOPED_CHANNEL_UNAVAILABLE');
          const control=createHmac('sha256',root).update('geomacro-control-plane-v1').digest('hex');
          const token=createHmac('sha256',control).update('geomacro-low-source-review-v1').digest('hex');
          console.log('::add-mask::'+token);
          const registry=JSON.parse(process.env.RISK_OBJECT_VERIFY_KEYS_JSON||'{}');
          const keys=[...Object.values(registry).map(v=>typeof v==='string'?v:v.public_key_spki_b64),
            process.env.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64].filter(Boolean);
          appendFileSync(process.env.GITHUB_ENV,'GEOMACRO_LOW_REVIEW_TOKEN='+token+'\n'+
            'GEOMACRO_LOW_REVIEW_ISSUER_PUBLIC_KEYS_JSON='+JSON.stringify([...new Set(keys)])+'\n');
          NODE
      - name: Review real source evidence with the separate low authority
        if: always()
        env:
          GEOMACRO_LOW_REVIEW_PRIVATE_PKCS8_B64: ${{ secrets.GEOMACRO_LOW_REVIEW_PRIVATE_PKCS8_B64 }}
          GEOMACRO_LOW_REVIEW_PUBLIC_PEM: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_PEM }}
          GEOMACRO_LOW_REVIEW_PUBLIC_SHA256: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_SHA256 }}
        run: |
          umask 077
          bun scripts/ops/review-derived-inputs-low-authority.ts > "$RUNNER_TEMP/geomacro-source-review-result.json"
      - name: Verify every retained newsroom signature against the approved issuer key
        if: ${{ !cancelled() }}
        run: bun scripts/ops/verify-all-news-signed-publications.mjs
      - name: Verify and emit only safe source-review aggregates
        run: node scripts/ops/emit-low-source-review-status.mjs "$RUNNER_TEMP/geomacro-source-review-result.json"
      - name: Remove private review handoff and internal verdicts from the runner
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/geomacro-source-review-refs.json" "$RUNNER_TEMP/geomacro-source-review-result.json" "$RUNNER_TEMP/geomacro-private-source-crosswalk.json"
      - name: Produce country-scoped high-impact GRI evidence worklist (zero scoring)
        run: |
          node --test scripts/tests/material-gri-country-evidence-worklist.test.mjs
          node scripts/ops/build-material-gri-country-worklist.mjs
      - name: Independently verify signed Finds across combined and category reads
        if: always()
        # A held B2/archive signer is a separately monitored signed-product
        # degradation, not a failure of the independently verified free D1 feed.
        continue-on-error: true
        shell: bash
        run: |
          bun - <<'TS'
          import {loadRiskObjectVerificationKeysFromEnv} from './src/lib/risk-object-signing.server';
          import {verifyAutomatedFindsEnvelope,FINDS_CATEGORIES} from './src/lib/automated-finds-contract';
          const keys=loadRiskObjectVerificationKeysFromEnv();
          const root='https://geomacro-control-plane.daspallab202391.workers.dev/v1/public/automated-finds';
          for(const category of [null,...FINDS_CATEGORIES]){
            const response=await fetch(root+(category?'?category='+category:''),{
              redirect:'error',cache:'no-store',signal:AbortSignal.timeout(12000)});
            if(!response.ok)throw Error('AUTOMATED_FINDS_INDEPENDENT_READBACK_UNAVAILABLE');
            const raw=await response.text();if(raw.length>300000)throw Error('AUTOMATED_FINDS_READBACK_OVERSIZE');
            const doc=JSON.parse(raw);
            if(doc.ok!==true||doc.schema!=='geomacro.automated-finds-feed.v1'||doc.chargeable!==false||
               doc.independent_reviewed!==false||!Array.isArray(doc.batches)||doc.batches.length!==(category?1:3))
              throw Error('AUTOMATED_FINDS_PUBLIC_READBACK_INVALID');
            for(const envelope of doc.batches){
              await verifyAutomatedFindsEnvelope(envelope,keys);
              if(envelope.payload.source_sha!==process.env.GITHUB_SHA||
                 (category&&envelope.payload.category!==category))throw Error('AUTOMATED_FINDS_EXACT_SOURCE_MISMATCH');
            }
            console.log(JSON.stringify({schema:'geomacro.automated-finds-independent-readback.v1',
              scope:category??'combined',http_status:response.status,signatures_verified:doc.batches.length,
              exact_source_sha:true,current_batch_b2_verified:doc.full_b2_readback_verified,
              prior_archive_available:doc.archive_checkpoint!==null,categories:doc.categories,
              independent_reviewed:false,chargeable:false,supabase_requests:0,payments:0}));
          }
          TS
      - name: Independently verify public derived-news journal with bounded transport retries
        if: always()
        shell: bash
        run: node scripts/ops/verify-derived-news-public-readback.mjs

      - name: Verify actual 195-by-3 website country/category observed-news readback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/verify-production-observed-195x3.test.mjs
          node scripts/ops/verify-production-observed-195x3.mjs
      - name: Retain private actual 195-by-3 counts-only website readback
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actual-195x3-observed-news-${{ github.run_id }}
          path: artifacts/derived-news/actual-195x3-coverage.json
          if-no-files-found: warn
          retention-days: 3

      - name: Confirm partner structured JSON equals the live retained Intelligence journal
        # On main push, Worker deployment may still be in progress; scheduled
        # collection and successful Worker-deploy wakeups verify exact parity.
        if: always() && github.event_name != 'push'
        shell: bash
        run: node scripts/ops/verify-shared-derived-news-live.mjs

      - name: Save exact acknowledged derived-news D1 ID reconciliation (source-neutral only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase2g-per-id-d1-reconciliation-${{ github.run_id }}
          path: artifacts/derived-news/phase2g-per-id-d1-reconciliation.json
          if-no-files-found: warn
          retention-days: 3

      - name: Save sanitized hourly three-category source health receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: derived-news-source-health-${{ github.run_id }}
          path: artifacts/derived-news/source-health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve redacted ORIGINAL-evidence status for EVERY incoming news item
        # Every card has a status: actual publisher HTML byte proof or
        # explicit unverified/quota-deferred. No raw HTML, source URL or
        # original article SHA; a receipt is NOT source licensing.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: derived-news-original-evidence-${{ github.run_id }}
          path: artifacts/derived-news/all-original-evidence-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save canonical country-scoped GRI evidence worklist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: primary-gri-country-review-${{ github.run_id }}
          path: artifacts/derived-news/material-gri-country-evidence-worklist.json
          if-no-files-found: warn
          retention-days: 3

      - name: Save bounded high-impact GRI evidence-review candidates (no scoring)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: material-gri-original-review-${{ github.run_id }}
          path: artifacts/derived-news/material-gri-review.json
          if-no-files-found: warn
          retention-days: 3

  private-b2-derived-news-acceptance:
    # Dedicated red/green storage job: B2 failure must not hide inside a
    # successful hourly public newsroom workflow, nor stop the D1 website.
    needs: [refresh-derived-news, quota-admission]
    # Independently archive only the VALID 72h public D1 journal even if
    # unrelated signed-Finds, website SHA or GRI checks failed earlier.
    # Source scope / native publication time / 72h must pass again before any B2 PUT.
    if: >-
      always() &&
      needs.quota-admission.outputs.maintenance == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    permissions:
      contents: read
    env:
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: derived_news_backup
      B2_REQUEST_BUDGET: "12"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Resolve existing production D1 atomic B2 quota governor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/.test(account||'')||!token||token.length<20)
            throw Error('B2_NEWS_D1_LEDGER_CREDENTIALS_MISSING');
          const response=await fetch(
            'https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?per_page=100',{
            headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
          const doc=await response.json();
          const id=doc.result?.find(x=>x.name==='geomacro-control-plane')?.uuid;
          if(!response.ok||doc.success!==true||!/^[a-f0-9-]{36}$/.test(id||''))
            throw Error('B2_NEWS_D1_QUOTA_LEDGER_UNAVAILABLE');
          appendFileSync(process.env.GITHUB_ENV,'D1_DATABASE_ID='+id+'\n');
          NODE
      # Derived-only backup retains its original D1 maintenance gate.
      # Phase 2H raw originals now use the independent *structural_snapshot*
      # admission and four 6h slots. Never run two raw B2 drainers.
      - name: Archive real website Intelligence records to private B2 with exact full GET
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/archive-live-derived-news-to-b2.mjs
      - name: Keep private 3-day actual B2 storage acceptance receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b2-actual-intelligence-derived-news-readback-${{ github.run_id }}
          path: artifacts/derived-news/b2-archive-verified-readback.json
          retention-days: 3
          if-no-files-found: warn
