name: Five-Minute Original News Fastlane

# Best-effort 5-minute original-source intake for ONE pre-reviewed publisher
# per category. NOT 195x3 live sources or a guaranteed 20-minute SLA.
# All genuine articles stay source-private; only the original-dated Geomacro
# derived cards enter the EXISTING 72-hour D1 journal. No Supabase, B2 or x402.
on:
  workflow_dispatch: {}
  schedule:
    # Change the schedule's clock offset to re-register the source-workflow
    # actor after observed no scheduled runs since protected push acceptance.
    # GitHub may still delay/drop; companion existing-backstop watchdog detects it.
    - cron: "2-57/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/five-minute-original-news-fastlane.yml"
      - "scripts/ops/publish-original-news-five-minute-fastlane.ts"
      - "scripts/ops/verify-original-to-website-visible-20m.mjs"
      - "scripts/ops/verify-original-to-website-visible-20m.test.mjs"
      - "src/lib/stateless-public-intelligence.server.ts"
      - "scripts/lib/global-official-release-feeds.mjs"
      - "src/lib/stateless-intelligence-model.ts"
      - "src/__tests__/five-minute-original-news-fastlane.test.ts"
      - "scripts/lib/five-minute-news-cadence-watch.mjs"
      - "scripts/ops/recover-stalled-five-minute-news.mjs"
      - "scripts/tests/five-minute-news-cadence-watch.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/five-minute-original-news-fastlane.yml"
      - "scripts/ops/publish-original-news-five-minute-fastlane.ts"
      - "scripts/ops/verify-original-to-website-visible-20m.mjs"
      - "scripts/ops/verify-original-to-website-visible-20m.test.mjs"
      - "src/lib/stateless-public-intelligence.server.ts"
      - "scripts/lib/global-official-release-feeds.mjs"
      - "src/lib/stateless-intelligence-model.ts"
      - "src/__tests__/five-minute-original-news-fastlane.test.ts"
      - "scripts/lib/five-minute-news-cadence-watch.mjs"
      - "scripts/ops/recover-stalled-five-minute-news.mjs"
      - "scripts/tests/five-minute-news-cadence-watch.test.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-five-minute-original-news-fastlane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fastlane-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install pinned repository dependencies without ad-hoc packages
        run: bun install --frozen-lockfile
      - name: Validate original-only fastlane, actual source clocks and no funds
        run: |
          bun run vitest run src/__tests__/five-minute-original-news-fastlane.test.ts
          node --test scripts/ops/verify-original-to-website-visible-20m.test.mjs

  original-five-minute-derived-news:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Verify existing D1 derived-news authorization is configured
        run: |
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || {
            echo "::error::Five-minute existing derived journal authorization absent"
            exit 2
          }
      - name: Publish bounded current original-dated three-category derived news
        run: bun scripts/ops/publish-original-news-five-minute-fastlane.ts
      - name: Observe actual served website latency after publication without funds
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts/website-latency
          bun scripts/ops/derived-news-latency-audit.mjs --website-observed > artifacts/website-latency/served-samples.json
          cat artifacts/website-latency/served-samples.json
      - name: Retain source-free website observation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actual-website-latency-${{ github.run_id }}
          path: artifacts/website-latency/served-samples.json
          retention-days: 7
      - name: Independently observe true original-to-website HTML visibility
        # The 15-minute release delay and 5-minute Actions clock are not a
        # guaranteed SLA. This public readback checks genuine original clocks
        # and the actual served SSR headings after each ingest without funds.
        # An unavailable website must not stop intake; its negative evidence
        # remains visible in Actions logs instead of being called success.
        if: always()
        continue-on-error: true
        run: |
          node --check scripts/ops/verify-original-to-website-visible-20m.mjs
          node scripts/ops/verify-original-to-website-visible-20m.mjs
