      - "scripts/tests/gri-news-wakeup.test.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-five-minute-original-news-fastlane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continue-private-source-review:
    needs: original-five-minute-derived-news
    if: >-
      always() && !cancelled() &&
      needs.original-five-minute-derived-news.outputs.quota_admitted == 'true' &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    concurrency:
      group: geomacro-private-low-review-continuation
      cancel-in-progress: false
    env:
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
      RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify trusted D1 deployment ancestry before restricted source review
        run: node scripts/ops/verify-gri-news-wakeup.mjs --original-news-deploy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Derive only the restricted review capability
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {createHmac} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const root=(process.env.GEOMACRO_COMMERCE_LEDGER_TOKEN||'').trim();
          if(root.length<32)throw Error('LOW_REVIEW_SCOPED_CHANNEL_UNAVAILABLE');
          const control=createHmac('sha256',root).update('geomacro-control-plane-v1').digest('hex');
          const token=createHmac('sha256',control).update('geomacro-low-source-review-v1').digest('hex');
          console.log('::add-mask::'+token);
          const registry=JSON.parse(process.env.RISK_OBJECT_VERIFY_KEYS_JSON||'{}');
          const keys=[...Object.values(registry).map(v=>typeof v==='string'?v:v.public_key_spki_b64),
            process.env.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64].filter(Boolean);
          appendFileSync(process.env.GITHUB_ENV,'GEOMACRO_LOW_REVIEW_TOKEN='+token+'\n'+
            'GEOMACRO_LOW_REVIEW_ISSUER_PUBLIC_KEYS_JSON='+JSON.stringify([...new Set(keys)])+'\n');
          NODE
      - name: Check retained originals with the independent low authority
        env:
          GEOMACRO_LOW_REVIEW_PRIVATE_PKCS8_B64: ${{ secrets.GEOMACRO_LOW_REVIEW_PRIVATE_PKCS8_B64 }}
          GEOMACRO_LOW_REVIEW_PUBLIC_PEM: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_PEM }}
          GEOMACRO_LOW_REVIEW_PUBLIC_SHA256: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_SHA256 }}
        run: |
          umask 077
          bun scripts/ops/review-derived-inputs-low-authority.ts > "$RUNNER_TEMP/geomacro-source-review-result.json"
      - name: Verify every retained newsroom signature against the approved issuer key
        if: ${{ !cancelled() }}
        run: bun scripts/ops/verify-all-news-signed-publications.mjs
      - name: Verify and emit only safe source-review aggregates
        run: node scripts/ops/emit-low-source-review-status.mjs "$RUNNER_TEMP/geomacro-source-review-result.json"
      - name: Remove private review results
        if: always()
        run: rm -f -- "$RUNNER_TEMP/geomacro-source-review-result.json"

  fastlane-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install pinned repository dependencies without ad-hoc packages
        run: bun install --frozen-lockfile
      - name: Validate original-only fastlane, actual source clocks and no funds
        run: |
          bun run vitest run src/__tests__/five-minute-original-news-fastlane.test.ts src/__tests__/automated-intelligence-input.test.ts src/__tests__/low-authority-source-review.test.ts
          bun test scripts/tests/private-source-handoff-sqlite.test.ts
          bun test scripts/tests/macro-fastlane.test.mjs
          node --test scripts/tests/plan-d1-bundled-work.test.mjs scripts/tests/bounded-news-intake-publication.test.mjs scripts/tests/fastlane-source-checkpoints.test.mjs
          bun build scripts/ops/publish-original-news-five-minute-fastlane.ts --target=bun --outfile=/tmp/geomacro-bundled-news-fastlane.js
          node --test scripts/tests/derived-news-readback-policy.test.mjs
          node --test scripts/tests/derived-news-worker-policy.test.mjs
          node --test scripts/tests/derived-news-deploy-order.test.mjs
          node --test scripts/ops/verify-original-to-website-visible-20m.test.mjs
          node --test scripts/tests/emit-low-source-review-status.test.mjs
          node --test scripts/lib/automatic-news-qualification-coverage.test.mjs
          bun test scripts/tests/public-signed-news.test.mjs
          node --test scripts/tests/actor-action-news.test.mjs
          node --test scripts/tests/gri-news-wakeup.test.mjs
          bun run vitest run src/__tests__/release-news-observation.test.ts

  original-five-minute-derived-news:
    permissions:
      contents: write
    concurrency:
      group: geomacro-permanent-news-publication
      cancel-in-progress: false
    outputs:
      quota_admitted: ${{ steps.budget.outputs.critical }}
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64: ${{ secrets.RISK_OBJECT_SIGNING_PUBLIC_KEY_SPKI_B64 }}
      RISK_OBJECT_VERIFY_KEYS_JSON: ${{ secrets.RISK_OBJECT_VERIFY_KEYS_JSON }}
      RISK_OBJECT_SIGNING_KEY_NOT_BEFORE: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_BEFORE }}
      RISK_OBJECT_SIGNING_KEY_NOT_AFTER: ${{ secrets.RISK_OBJECT_SIGNING_KEY_NOT_AFTER }}
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      # Inline avoids an extra Actions runner per five-minute tick.
      - name: Observe paced D1 Free account headroom before source fetch
        id: budget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs
      - name: Report held source slot without falsifying source events
        if: steps.budget.outputs.source_intake != 'true'
        run: echo "::notice::FIVE_MINUTE_NEWS_QUOTA_HELD; no original source fetch or D1 news write."
      - name: Verify trusted D1 deployment ancestry before any producer write or signature
        id: wakeup
        if: steps.budget.outputs.source_intake == 'true'
        run: node scripts/ops/verify-gri-news-wakeup.mjs --original-news-deploy
      - if: steps.budget.outputs.source_intake == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies for the existing issuer signer
        if: steps.budget.outputs.source_intake == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify existing D1 derived-news authorization is configured
        if: steps.budget.outputs.source_intake == 'true'
        run: |
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || {
            echo "::error::Five-minute existing derived journal authorization absent"
            exit 2
          }
      - name: Publish bounded current original-dated three-category derived news
        if: steps.budget.outputs.source_intake == 'true'
        env:
          GEOMACRO_SOURCE_INTAKE_ONLY: ${{ steps.budget.outputs.critical == 'true' && '0' || '1' }}
          GEOMACRO_LOW_SOURCE_REVIEW: ${{ steps.budget.outputs.critical == 'true' && '1' || '0' }}
          GEOMACRO_LOW_REVIEW_REFS_FILE: ${{ runner.temp }}/geomacro-source-review-refs.json
        run: bun scripts/ops/publish-original-news-five-minute-fastlane.ts
      - name: Publish append-only permanent Finds archive without D1 dependency
        id: permanent-archive
        if: ${{ !cancelled() && steps.budget.outputs.source_intake == 'true' && steps.wakeup.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/derived-news/permanent-archive-candidates.json || { echo "::notice::NO_VERIFIED_INTAKE_ARCHIVE_BATCH"; exit 0; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::PERMANENT_ARCHIVE_CLOUDFLARE_TOKEN_MISSING"; exit 2; }
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32 || { echo "::error::PERMANENT_ARCHIVE_CLOUDFLARE_ACCOUNT_MISSING"; exit 2; }
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          archive_ref="refs/remotes/origin/geomacro-permanent-finds-archive"
          git -c http.extraheader="$auth_header" fetch origin "refs/heads/geomacro-permanent-finds-archive:$archive_ref"
          archive_dir="$RUNNER_TEMP/geomacro-permanent-finds-archive"
          git worktree add --detach "$archive_dir" "$archive_ref"
          assets_dir="$GITHUB_WORKSPACE/workers/public-finds-archive/assets"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; if(JSON.parse(readFileSync(process.argv[1],"utf8")).seed_complete!==true)throw Error("PERMANENT_ARCHIVE_SEED_REQUIRED");' "$archive_dir/data/index.json"
          node scripts/ops/publish-permanent-derived-news-archive.mjs \
            "$archive_dir" "$assets_dir" artifacts/derived-news/permanent-archive-candidates.json
          result_file="$RUNNER_TEMP/permanent-derived-news-archive-result.json"
          test -s "$result_file" || { echo "::error::PERMANENT_ARCHIVE_RESULT_MISSING"; exit 2; }
          deploy_needed="$(jq -r '.deploy_needed == true' "$result_file")"
          git -C "$archive_dir" add data
          if ! git -C "$archive_dir" diff --cached --quiet; then
            git -C "$archive_dir" config user.name "github-actions[bot]"
            git -C "$archive_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$archive_dir" commit -m "Append permanent Geomacro Finds archive"
            git -C "$archive_dir" -c http.extraheader="$auth_header" push origin HEAD:refs/heads/geomacro-permanent-finds-archive
          fi
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          if [[ "$deploy_needed" != "true" ]]; then
            echo "Permanent static archive has no new state to deploy."
            exit 0
          fi
          cd workers/public-finds-archive
          npx -y wrangler@4.136.3 deploy --config wrangler.jsonc
      - name: Publish current verified source-neutral D1 snapshot to optional R2
        # Reuses one admitted 5-minute runner; no extra cron, source fetch,
        # D1 write or B2 request. Failure is visible but cannot block originals.
        if: ${{ steps.budget.outputs.critical == 'true' && steps.wakeup.outcome == 'success' && vars.GEOMACRO_PUBLIC_NEWS_R2_BUCKET != '' }}
        continue-on-error: true
        run: node scripts/ops/publish-public-news-r2-snapshot.mjs
      - name: Refresh retained actor-action news from existing private originals without changing clocks
        if: ${{ steps.budget.outputs.critical == 'true' && !cancelled() && steps.wakeup.outcome == 'success' }}
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
          GEOMACRO_LOW_REVIEW_PUBLIC_PEM: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_PEM }}
          GEOMACRO_LOW_REVIEW_PUBLIC_SHA256: ${{ secrets.GEOMACRO_LOW_REVIEW_PUBLIC_SHA256 }}
        run: bun scripts/ops/refresh-derived-news-editorial.ts
      - name: Automatically approve and sign every unique retained derived input
        if: ${{ steps.budget.outputs.critical == 'true' && !cancelled() && steps.wakeup.outcome == 'success' }}
        run: bun scripts/ops/publish-automated-intelligence-inputs.ts
      - name: Preserve private originals for the separate automated reviewer
        if: ${{ steps.budget.outputs.critical == 'true' && !cancelled() && steps.wakeup.outcome == 'success' }}
        env:
          GEOMACRO_LOW_REVIEW_REFS_FILE: ${{ runner.temp }}/geomacro-source-review-refs.json
        run: bun scripts/ops/persist-private-source-handoffs.ts
      - name: Remove private original references from the producer runner
        if: always() && steps.budget.outputs.critical == 'true'
        run: rm -f -- "$RUNNER_TEMP/geomacro-source-review-refs.json"
      - name: Observe actual served website latency after publication without funds
        if: always() && steps.budget.outputs.critical == 'true'
        continue-on-error: true
        run: |
          mkdir -p artifacts/website-latency
          bun scripts/ops/derived-news-latency-audit.mjs --website-observed > artifacts/website-latency/served-samples.json
          cat artifacts/website-latency/served-samples.json
      - name: Retain source-free website observation receipt
        if: always() && steps.budget.outputs.critical == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actual-website-latency-${{ github.run_id }}
          path: artifacts/website-latency/served-samples.json
          retention-days: 7
      - name: Independently observe true original-to-website HTML visibility
        # The zero added release delay and 5-minute Actions clock are not a
        # guaranteed SLA. This public readback checks genuine original clocks
        # and the actual served SSR headings after each ingest without funds.
        # An unavailable website must not stop intake; its negative evidence
        # remains visible in Actions logs instead of being called success.
        if: always() && steps.budget.outputs.critical == 'true'
        continue-on-error: true
        run: |
          node --check scripts/ops/verify-original-to-website-visible-20m.mjs
          node scripts/ops/verify-original-to-website-visible-20m.mjs
