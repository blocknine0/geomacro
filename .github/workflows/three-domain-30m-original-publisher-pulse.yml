      - "workers/control-plane/src/source-pulse-public.mjs"
      - "src/__tests__/three-domain-30m-d1-status.test.ts"
      - "src/lib/current-30min-original-source-pulse.server.ts"
      - "src/lib/category-intelligence-alias.server.ts"

permissions:
  contents: read
concurrency:
  group: geomacro-30m-original-source-pulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    # PR/main-push source changes are tested once. Avoid repeating a full
    # offline suite every scheduled/workflow_run production source pulse.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: "22"
      - name: Validate three-domain official publisher read-only poll contract
        run: |
          set -euo pipefail
          node --check scripts/lib/private-original-publisher-candidates.mjs
          node --check scripts/ops/probe-30min-three-domain-pulse.mjs
          node --check scripts/lib/private-original-cross-poll-dedupe.mjs
          node --check scripts/ops/write-30min-source-pulse-d1.mjs
          node --test scripts/tests/auto-private-scoring-trigger.test.mjs
          node --test scripts/tests/official-sanctions-listings-observer.test.mjs
          node --test scripts/lib/private-classifier-retry-ledger.test.mjs
          node --check scripts/ops/private-classifier-retry-lifecycle.mjs
          node --test scripts/lib/pulse-rotated-original-scorer.test.mjs
          node --check workers/control-plane/src/source-pulse-public.mjs
          node --check scripts/ops/probe-expanded-official-source-mesh.mjs
          test -f src/__tests__/three-domain-30m-source-pulse.test.ts

  original-publisher-pulse:
    needs: source-contract
    outputs:
      private_scoring_needed: ${{ steps.d1.outputs.private_scoring_needed }}
    if: >-
      always() &&
      (needs.source-contract.result == 'success' ||
       (needs.source-contract.result == 'skipped' &&
        github.event_name != 'push')) &&
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: production
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One preflight within this same production runner, not an extra job.
      - name: Govern source pulse with paced Free D1 account budget
        id: budget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/plan-d1-bundled-work.mjs
      - name: Report held source slot without fictitious zero original events
        if: steps.budget.outputs.research != 'true'
        run: echo "::notice::HALF_HOUR_SOURCE_PULSE_QUOTA_HELD; no D1 or original-fetch proof."
      - name: Setup Node.js 22
        # This setup is shared with a source-only monitor. It runs even when
        # quota admission denies D1 writes or the main official source pulse.
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: "22"
      - name: Observe official OFAC sanctions list independent of D1 quota
        # Existing 12/42 UTC workflow, one read per UTC hour at most.
        # An upstream 403/429/202 or missed slot is recorded, never upgraded
        # to a signed/current country event or paid customer response.
        if: ${{ !cancelled() }}
        run: node scripts/ops/probe-official-sanctions-listings.mjs --live --ofac-hourly-slot
      - name: Bounded, origin-validated half-hour source observation across all 3 domains
        if: steps.budget.outputs.research == 'true'
        run: |
          set -uo pipefail
          rc=0
          node scripts/ops/probe-30min-three-domain-pulse.mjs || rc=$?
          file=artifacts/private-intake/three-domain-30m-source-pulse.json
          test -s "$file" || exit 2
          jq -e '.schema=="geomacro.private-three-domain-source-pulse-30m.v1" and
            .target_poll_minutes==30 and .schedule_guaranteed==false and
            (.actual_original_publisher_rows|length)==3 and
            ([.actual_original_publisher_rows[].domain]|sort)==["geopolitics","macro","rare_earth"] and
            (.independent_origin_pairs_healthy | type)=="boolean" and
            .independent_origin_pairs_healthy ==
              ([.actual_original_publisher_rows[].independent_origin_pair_transport_healthy] | all) and
            ([.actual_original_publisher_rows[] |
              (.independent_origin_crosscheck_attempted | type)=="boolean" and
              (.independent_origin_pair_transport_healthy | type)=="boolean" and
              .independent_origin_pair_transport_healthy == (.publisher_pair_sample_complete==true) and
              (.original_publishers_attempted<=2) and
              (.original_publishers_successful<=2) and
              .event_same_subject_independent_corroboration_verified==false] | all) and
            .source_catalog_entries_are_not_events==true and
            .open_original_discovery_enabled==true and
            .undated_observation_only==true and
            .undated_entry_publication_clock_verified==false and
            .original_article_keyword_admission_required==false and
            .original_article_source_native_clock_required==true and
            ([.actual_original_publisher_rows[] |
              .open_discovery_keyword_gate_enabled==false and
              .articles_captured_before_relevance_classification==true and
              .unclassified_original_articles_are_verified_events==false and
              .undated_feed_publication_verified==false and
              (.undated_first_party_feed_observed_count>=0) and
              (.source_item_provenance_diagnostics | type)=="array" and
              (.source_item_provenance_diagnostics|length)<=2 and
              (.source_feed_recovery_diagnostics | type)=="array" and
              (.source_feed_recovery_diagnostics | length)<=2 and
              ([.source_feed_recovery_diagnostics[] |
                (.original_page_checked==null or .original_page_checked>=0) and
                (.original_page_verified==null or .original_page_verified>=0) and
                (.original_page_result_codes|type)=="object"] | all) and
              ([.source_item_provenance_diagnostics[] |
                ((.entries_parsed==null) or (.entries_parsed>=0)) and
                ((.item_native_published_missing==null) or
                  (.item_native_published_missing>=0)) and
                ((.original_article_link_rejected==null) or
                  (.original_article_link_rejected>=0))] | all) and
              ((.original_publisher_all_topics_24h_count==null) or
                (.original_publisher_all_topics_24h_count>=0)) and
              ((.original_publisher_all_topics_7d_count==null) or
                (.original_publisher_all_topics_7d_count>=0))] | all) and
            .independently_verified_current_intelligence_count==0 and
            .user_api_delivery_verified==false and
            .publisher_rights_verified==false and
            .b2_reads==0 and .b2_writes==0 and .d1_writes==0 and
            .supabase_requests==0 and .payments_performed==0' "$file" >/dev/null || exit 2
          # Even on upstream rate limiting, persist a truthful DEGRADED
          # receipt while the action stays red for production monitoring.
          if test "$rc" -ne 0; then
            echo "::warning::Original-source pulse degraded; not scored current intelligence."
            exit "$rc"
          fi
      - name: Publish compact observation-only D1 checkpoints and read them back
        id: d1
        if: always() && steps.budget.outputs.research == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -s artifacts/private-intake/three-domain-30m-source-pulse.json
          node scripts/ops/write-30min-source-pulse-d1.mjs
          # New source-native fingerprints justify PRIVATE scoring only.
          node scripts/lib/auto-private-scoring-trigger.mjs
      - name: Verify direct three-domain continuity Worker status (no funds)
        if: steps.budget.outputs.research == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          code="$(curl -fsS --max-time 12 -o "$payload" -w '%{http_code}' https://geomacro-control-plane.daspallab202391.workers.dev/v1/public/three-domain-continuity || true)"
          if test "$code" != "200"; then
            echo "::error::THREE_DOMAIN_CONTINUITY_UNAVAILABLE"
            exit 3
          fi
          node - "$payload" <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(v.schema!=='geomacro.three-domain-evidence-continuity.v1'||
            v.three_domains_returned!==true||v.chargeable!==false||
            v.upstream_new_event_guaranteed!==false||
            JSON.stringify(Object.keys(v.categories).sort())!==
              JSON.stringify(['geopolitics','macro','rare_earth'].sort()))
            throw Error('THREE_DOMAIN_CONTINUITY_CONTRACT_INVALID');
          console.log(JSON.stringify({
            schema:'geomacro.three-domain-continuity-canary.v1',
            all_categories_have_observation:v.all_categories_have_observation,
            all_categories_source_check_current:v.all_categories_source_check_current,
            per_category:Object.fromEntries(Object.entries(v.categories).map(([k,s])=>
              [k,{service_state:s.service_state,news_72h:s.native_news_event_count_72h}])),
            real_money_touched:false,
          }));
          NODE
      - name: Preserve two-day source-native counts, never raw news or session tokens
        # OFAC reachability survives D1 quota-held cycles independently.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: original-source-pulse-${{ github.run_id }}
          path: |
            artifacts/private-intake/three-domain-30m-source-pulse.json
            artifacts/private-intake/three-domain-30m-d1-readback.json
            artifacts/official-sanctions-listings/receipt.json
          if-no-files-found: warn
          retention-days: 2

  # Canonical private classifier recovery runs ONLY when a novel, dated,
  # original article fingerprint is independently persisted and read from D1.
  # There is no Supabase write, public publish, settlement or paid unlock.
  private-scoring-from-new-originals:
    needs: original-publisher-pulse
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.original-publisher-pulse.outputs.private_scoring_needed == 'true'
    uses: ./.github/workflows/restricted-private-current-scoring.yml
    with:
      bounded_automatic_private_stage: true
    secrets: inherit
