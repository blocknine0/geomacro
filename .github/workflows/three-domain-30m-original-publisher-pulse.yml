      - "src/__tests__/statcan-unknown-path-shapes.test.ts"
      - "src/__tests__/source-pulse-transport-failure-diagnostics.test.ts"
      - "src/__tests__/capture-undated-first-party-feeds-before-publication-proof.test.ts"
