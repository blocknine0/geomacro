name: Three-Domain 30-Minute Original Publisher Pulse

# This is a lightweight source-native transport observation. It is NOT a
# signed GRO producer or permission to invoice when source qualification lacks.
on:
  workflow_dispatch: {}
  schedule:
    # Intended UTC 30-minute checks; GitHub Actions cron is best-effort.
    - cron: "12,42 * * * *"
  # GitHub's best-effort cron has missed multiple intended 30-minute
  # windows. Use an ALREADY scheduled free producer as an alternate wakeup.
  # Do not download or trust its artifacts; recheck canonical source-native
  # publishers and new D1 fingerprints in this workflow itself.
  workflow_run:
    workflows: ["Three-Domain Unified Private Source Intake"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/three-domain-30m-original-publisher-pulse.yml"
      - "scripts/ops/probe-30min-three-domain-pulse.mjs"
      - "scripts/lib/official-sanctions-listings-observer.mjs"
