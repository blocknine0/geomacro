name: Direct Global Corridor Intake (Isolated)
# Strict corridor-only native news and upstream polling. Never feeds Website Intelligence.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "6,21,36,51 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/direct-global-corridor-intake.yml"
      - "scripts/lib/direct-global-corridor-sources.mjs"
      - "config/global-corridor-supplied-links.v1.json"
      - "scripts/lib/direct-global-corridor-ingestion.mjs"
      - "scripts/lib/direct-corridor-native-news.mjs"
      - "scripts/lib/corridor-official-reference-adapters.mjs"
      - "scripts/lib/corridor-official-reference-adapters.test.mjs"
      - "scripts/lib/corridor-official-reference-d1.test.mjs"
      - "scripts/lib/direct-corridor-native-news.test.mjs"
      - "scripts/ops/ingest-direct-global-corridors.mjs"
      - "scripts/ops/publish-private-corridor-native-news.mjs"
      - "scripts/ops/publish-private-corridor-official-references.mjs"
      - "workers/control-plane/src/corridor-native-news.mjs"
      - "workers/control-plane/src/corridor-official-reference.mjs"
      - "workers/control-plane/migrations/0097_corridor_official_reference_context.sql"
      - "workers/control-plane/migrations/0096_corridor_native_news_candidates.sql"
  pull_request:
    paths:
      - ".github/workflows/direct-global-corridor-intake.yml"
      - "scripts/lib/direct-global-corridor-sources.mjs"
      - "config/global-corridor-supplied-links.v1.json"
      - "scripts/lib/direct-global-corridor-sources.test.mjs"
      - "scripts/lib/direct-global-corridor-ingestion.mjs"
      - "scripts/lib/direct-corridor-native-news.mjs"
      - "scripts/lib/corridor-official-reference-adapters.mjs"
      - "scripts/lib/corridor-official-reference-adapters.test.mjs"
      - "scripts/lib/corridor-official-reference-d1.test.mjs"
      - "scripts/lib/direct-corridor-native-news.test.mjs"
      - "scripts/lib/direct-global-corridor-ingestion.test.mjs"
      - "scripts/ops/ingest-direct-global-corridors.mjs"
      - "scripts/ops/publish-private-corridor-native-news.mjs"
      - "scripts/ops/publish-private-corridor-official-references.mjs"
      - "workers/control-plane/src/corridor-native-news.mjs"
      - "workers/control-plane/src/corridor-official-reference.mjs"
      - "workers/control-plane/migrations/0097_corridor_official_reference_context.sql"
      - "workers/control-plane/migrations/0096_corridor_native_news_candidates.sql"
permissions:
  contents: read
concurrency:
  group: geomacro-direct-corridor-intake
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify direct corridor isolation
        run: |
          set -euo pipefail
          node --check scripts/lib/direct-global-corridor-sources.mjs
          node --check scripts/lib/direct-global-corridor-ingestion.mjs
          node --check scripts/lib/direct-corridor-native-news.mjs
          node --check scripts/lib/corridor-official-reference-adapters.mjs
          node --check workers/control-plane/src/corridor-official-reference.mjs
          node --check scripts/ops/publish-private-corridor-official-references.mjs
          node --check scripts/ops/ingest-direct-global-corridors.mjs
          node --check scripts/ops/publish-private-corridor-native-news.mjs
          node --check workers/control-plane/src/corridor-native-news.mjs
          node --test scripts/lib/direct-global-corridor-sources.test.mjs
          node --test scripts/lib/direct-global-corridor-ingestion.test.mjs
          node --test scripts/lib/direct-corridor-native-news.test.mjs
          node --test scripts/lib/corridor-native-d1.test.mjs
          node --test scripts/lib/corridor-official-reference-adapters.test.mjs
          node --test scripts/lib/corridor-official-reference-d1.test.mjs
  source-intake:
    needs: contracts
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Collect independent corridor source evidence only
        run: |
          set -euo pipefail
          node scripts/ops/ingest-direct-global-corridors.mjs
      - name: Publish original-link corridor metadata to private D1 with exact readback
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEOMACRO_COMMERCE_LEDGER_TOKEN" || {
            echo "::error::CORRIDOR_PRIVATE_D1_ROOT_CREDENTIAL_MISSING"
            exit 2
          }
          node scripts/ops/publish-private-corridor-native-news.mjs
          node scripts/ops/publish-private-corridor-official-references.mjs
      - name: Upload separate bounded corridor receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-direct-corridor-source-intake
          path: |
            artifacts/direct-corridor-intake/receipt.json
            artifacts/direct-corridor-intake/news-candidates.json
            artifacts/direct-corridor-intake/d1-readback.json
            artifacts/direct-corridor-intake/official-references.json
            artifacts/direct-corridor-intake/official-d1-readback.json
          if-no-files-found: error
          retention-days: 3
