      - "workers/control-plane/src/index.mjs"
      - "scripts/lib/corridor-derived-structured-research.mjs"
      - "scripts/lib/corridor-source-evidence-proof.mjs"
      - "scripts/lib/corridor-private-research-d1.test.mjs"
      - "scripts/ops/publish-private-corridor-research.mjs"
      - "workers/control-plane/src/corridor-private-research.mjs"
      - "workers/control-plane/migrations/0098_corridor_private_derived_research.sql"
      - "scripts/lib/corridor-derived-structured-research.test.mjs"
      - "scripts/lib/corridor-credential-context.test.mjs"
      - "scripts/lib/corridor-official-reference-adapters.test.mjs"
      - "scripts/lib/corridor-official-reference-d1.test.mjs"
      - "scripts/lib/direct-corridor-native-news.test.mjs"
      - "scripts/lib/direct-global-corridor-ingestion.test.mjs"
      - "scripts/ops/ingest-direct-global-corridors.mjs"
      - "scripts/ops/publish-private-corridor-native-news.mjs"
      - "scripts/ops/publish-private-corridor-official-references.mjs"
      - "workers/control-plane/src/corridor-native-news.mjs"
      - "workers/control-plane/src/corridor-official-reference.mjs"
      - "workers/control-plane/migrations/0097_corridor_official_reference_context.sql"
      - "workers/control-plane/migrations/0096_corridor_native_news_candidates.sql"
      - "workers/control-plane/migrations/0100_corridor_exact_original_dedup.sql"
permissions:
  contents: read
concurrency:
  group: geomacro-direct-corridor-intake
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify direct corridor isolation
        run: |
          set -euo pipefail
          node --check scripts/lib/direct-global-corridor-sources.mjs
          node --check scripts/lib/direct-global-corridor-ingestion.mjs
          node --check scripts/lib/risk-gate-supplied-source-rules.mjs
          node --check lib/risk-gate-source-pack.mjs
          node --check lib/risk-gate-corridor-first.mjs
          node --check workers/control-plane/src/corridor-risk-gate-jit.mjs
          node --check scripts/ops/publish-risk-gate-corridor-continuity.mjs
          node --check workers/control-plane/src/corridor-risk-gate-source-pack.mjs
          node --check scripts/ops/publish-private-risk-gate-source-packs.mjs
          node --check scripts/lib/direct-corridor-native-news.mjs
          node --check scripts/lib/direct-corridor-official-news-feeds.mjs
          node --check scripts/lib/corridor-official-reference-adapters.mjs
          node --check scripts/lib/corridor-credential-context.mjs
          node --check lib/crypto-news-individual-structured.mjs
          node --check workers/control-plane/src/corridor-crypto-individual-research.mjs
          node --check scripts/ops/publish-private-crypto-individual-research.mjs
          node --check scripts/lib/corridor-derived-structured-research.mjs
          node --check scripts/lib/corridor-source-evidence-proof.mjs
          node --check workers/control-plane/src/corridor-private-research.mjs
          node --check scripts/ops/publish-private-corridor-research.mjs
          node --check workers/control-plane/src/corridor-official-reference.mjs
          node --check scripts/ops/publish-private-corridor-official-references.mjs
          node --check scripts/ops/ingest-direct-global-corridors.mjs
          node --check scripts/ops/publish-private-corridor-native-news.mjs
          node --check workers/control-plane/src/corridor-native-news.mjs
          node --test scripts/lib/direct-global-corridor-sources.test.mjs
          node --test scripts/lib/direct-global-corridor-ingestion.test.mjs
          node --test scripts/lib/risk-gate-supplied-source-rules.test.mjs
          node --test scripts/lib/risk-gate-source-pack.test.mjs
          node --test scripts/lib/risk-gate-corridor-first.test.mjs
          node --test scripts/lib/direct-corridor-native-news.test.mjs
          node --test scripts/lib/direct-corridor-official-news-feeds.test.mjs
          node --test scripts/lib/corridor-native-d1.test.mjs
          node --test scripts/lib/corridor-official-reference-adapters.test.mjs
          node --test scripts/lib/corridor-credential-context.test.mjs
          node --test scripts/lib/corridor-crypto-individual-research.test.mjs
          node --test scripts/lib/corridor-derived-structured-research.test.mjs
          node --test scripts/lib/corridor-private-research-d1.test.mjs
          node --test scripts/lib/corridor-official-reference-d1.test.mjs
  source-intake:
    needs: contracts
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Collect independent corridor source evidence only
        env:
          GEOMACRO_FRED_API_KEY: ${{ secrets.GEOMACRO_FRED_API_KEY }}
          GEOMACRO_RELIEFWEB_APPNAME: ${{ secrets.GEOMACRO_RELIEFWEB_APPNAME }}
          GEOMACRO_CRYPTOCOMPARE_API_KEY: ${{ secrets.GEOMACRO_CRYPTOCOMPARE_API_KEY }}
          GEOMACRO_CRYPTO_HOURLY_TICK: ${{ github.event_name == 'schedule' && github.event.schedule == '6 * * * *' }}
        run: |
          set -euo pipefail
          node scripts/ops/ingest-direct-global-corridors.mjs
      - name: Publish original-link corridor metadata to private D1 with exact readback
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEOMACRO_COMMERCE_LEDGER_TOKEN" || {
            echo "::error::CORRIDOR_PRIVATE_D1_ROOT_CREDENTIAL_MISSING"
            exit 2
          }
          node scripts/ops/publish-private-corridor-native-news.mjs
          node scripts/ops/publish-private-corridor-official-references.mjs
          node scripts/ops/publish-private-corridor-research.mjs

      # Independent private product lane: an unrelated official/derived D1
      # write failure must not suppress this exact source's acceptance test.
      # Keep failed status for any failed lane; no continue-on-error.
      - name: Publish individual CryptoCompare five-part research to private D1
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEOMACRO_COMMERCE_LEDGER_TOKEN" || {
            echo "::error::CRYPTO_INDIVIDUAL_D1_ROOT_CREDENTIAL_MISSING"
            exit 2
          }
          node scripts/ops/publish-private-crypto-individual-research.mjs
      - name: Materialize all three locked-price Risk Gate evidence packs in private D1
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEOMACRO_COMMERCE_LEDGER_TOKEN" || {
            echo "::error::RG_SOURCE_PACK_D1_ROOT_CREDENTIAL_MISSING"
            exit 2
          }
          node scripts/ops/publish-private-risk-gate-source-packs.mjs
      - name: Continuously verify five strategic corridors in private D1 and JIT
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEOMACRO_COMMERCE_LEDGER_TOKEN" || {
            echo "::error::RG_STRATEGIC_ROOT_CREDENTIAL_MISSING"
            exit 2
          }
          node scripts/ops/publish-risk-gate-corridor-continuity.mjs
      - name: Upload separate bounded corridor receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geomacro-direct-corridor-source-intake
          path: |
            artifacts/direct-corridor-intake/receipt.json
            artifacts/direct-corridor-intake/news-candidates.json
            artifacts/direct-corridor-intake/d1-readback.json
            artifacts/direct-corridor-intake/official-references.json
            artifacts/direct-corridor-intake/official-d1-readback.json
            artifacts/direct-corridor-intake/structured-research.json
            artifacts/direct-corridor-intake/research-d1-readback.json
            artifacts/direct-corridor-intake/crypto-individual-research.json
            artifacts/direct-corridor-intake/crypto-individual-d1-readback.json
            artifacts/direct-corridor-intake/risk-gate-source-pack.json
            artifacts/direct-corridor-intake/risk-gate-source-d1-readback.json
            artifacts/direct-corridor-intake/risk-gate-corridor-continuity.json
          if-no-files-found: error
          retention-days: 3
