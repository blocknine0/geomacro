      - "scripts/lib/direct-corridor-official-news-feeds.mjs"
      - "scripts/lib/direct-corridor-official-news-feeds.test.mjs"
      - "scripts/lib/corridor-official-reference-adapters.mjs"
      - "scripts/lib/corridor-credential-context.mjs"
      - "lib/crypto-news-individual-structured.mjs"
      - "scripts/lib/corridor-crypto-individual-research.test.mjs"
