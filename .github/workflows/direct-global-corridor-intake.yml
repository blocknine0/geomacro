      - "docs/RISK_GATE_SUPPLIED_SOURCE_RULES.md"
      - "scripts/lib/direct-corridor-native-news.mjs"
      - "scripts/lib/direct-corridor-official-news-feeds.mjs"
      - "scripts/lib/direct-corridor-official-news-feeds.test.mjs"
      - "scripts/lib/corridor-official-reference-adapters.mjs"
      - "scripts/lib/corridor-credential-context.mjs"
      - "lib/crypto-news-individual-structured.mjs"
      - "scripts/lib/corridor-crypto-individual-research.test.mjs"
      - "scripts/ops/publish-private-crypto-individual-research.mjs"
      - "workers/control-plane/src/corridor-crypto-individual-research.mjs"
      - "workers/control-plane/migrations/0099_corridor_crypto_individual_research.sql"
      - "workers/control-plane/src/index.mjs"
      - "scripts/lib/corridor-derived-structured-research.mjs"
      - "scripts/lib/corridor-source-evidence-proof.mjs"
      - "scripts/lib/corridor-private-research-d1.test.mjs"
      - "scripts/ops/publish-private-corridor-research.mjs"
      - "workers/control-plane/src/corridor-private-research.mjs"
      - "workers/control-plane/migrations/0098_corridor_private_derived_research.sql"
      - "scripts/lib/corridor-derived-structured-research.test.mjs"
      - "scripts/lib/corridor-credential-context.test.mjs"
      - "scripts/lib/corridor-official-reference-adapters.test.mjs"
      - "scripts/lib/corridor-official-reference-d1.test.mjs"
      - "scripts/lib/direct-corridor-native-news.test.mjs"
      - "scripts/ops/ingest-direct-global-corridors.mjs"
      - "scripts/ops/publish-private-corridor-native-news.mjs"
      - "scripts/ops/publish-private-corridor-official-references.mjs"
      - "workers/control-plane/src/corridor-native-news.mjs"
      - "workers/control-plane/src/corridor-official-reference.mjs"
      - "workers/control-plane/migrations/0097_corridor_official_reference_context.sql"
      - "workers/control-plane/migrations/0096_corridor_native_news_candidates.sql"
      - "workers/control-plane/migrations/0100_corridor_exact_original_dedup.sql"
  pull_request:
    paths:
      - ".github/workflows/direct-global-corridor-intake.yml"
      - "scripts/lib/direct-global-corridor-sources.mjs"
      - "config/global-corridor-supplied-links.v1.json"
      - "scripts/lib/direct-global-corridor-sources.test.mjs"
      - "scripts/lib/direct-global-corridor-ingestion.mjs"
      - "scripts/lib/risk-gate-supplied-source-rules.mjs"
      - "lib/risk-gate-source-pack.mjs"
      - "lib/risk-gate-corridor-first.mjs"
      - "workers/control-plane/src/corridor-risk-gate-jit.mjs"
      - "workers/control-plane/migrations/0102_corridor_risk_gate_strategic_continuity.sql"
      - "scripts/ops/publish-risk-gate-corridor-continuity.mjs"
