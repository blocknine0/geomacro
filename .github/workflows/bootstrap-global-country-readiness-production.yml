name: Bootstrap Global Country Readiness Production

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-global-country-readiness-production.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-global-country-readiness-production.yml"

permissions:
  contents: read

concurrency:
  group: global-country-readiness-production-bootstrap
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate one-shot production boundary
        shell: bash
        run: |
          set -euo pipefail
          file=".github/workflows/bootstrap-global-country-readiness-production.yml"
          grep -q '919_risk_gate_v2_global_source_manifests.sql' "$file"
          grep -q 'EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx' "$file"
          grep -q 'SUPABASE_URL:.*APP_SUPABASE_URL' "$file"
          grep -q 'SUPABASE_SERVICE_ROLE_KEY:.*SUPABASE_SERVICE_ROLE_KEY' "$file"
          grep -q 'ingest-world-bank-live.mjs' "$file"
          grep -q 'PASS: WORLD BANK LIVE MACRO INGESTION COMPLETE' "$file"
          grep -q 'ingest-wgi-political-stability-live.ts --write' "$file"
          grep -q 'EXPLICIT GAP MANIFEST WRITTEN' "$file"
          grep -q 'record-ucdp-candidate-release-manifest.mjs --write' "$file"
          grep -q 'global-risk-gate-country-census.ts --require-any-accepted' "$file"
          forbidden="supabase db"' push'
          if grep -Fq "$forbidden" "$file"; then
            echo "::error::This bootstrap must never apply unrelated pending migrations."
            exit 1
          fi
          echo "PASS: one-shot bootstrap is scoped to migration 919 and governed evidence jobs only."

  bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GLOBAL_RISK_GATE_CENSUS_OUTPUT: global-risk-gate-country-census.json
      GLOBAL_RISK_GATE_CENSUS_CONCURRENCY: "3"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate authoritative production database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }
          test -n "${APP_SUPABASE_URL:-}" || { echo "::error::APP_SUPABASE_URL is missing"; exit 1; }
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::APP_SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL alias is missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY alias is missing"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_SUPABASE_PROJECT_REF" || { echo "::error::Wrong production project id"; exit 1; }
          test "$SUPABASE_URL" = "$APP_SUPABASE_URL" || { echo "::error::Supabase API aliases diverged"; exit 1; }
          test "$SUPABASE_SERVICE_ROLE_KEY" = "$APP_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Supabase service-role aliases diverged"; exit 1; }

          node <<'NODE'
          const ref = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          const db = new URL(process.env.SUPABASE_DB_URL);
          const api = new URL(process.env.APP_SUPABASE_URL);
          const directHost = `db.${ref}.supabase.co`;
          const poolerMatch = db.hostname.endsWith('.pooler.supabase.com') && db.username === `postgres.${ref}`;
          const directMatch = db.hostname === directHost && db.username === 'postgres';
          if (!['postgres:', 'postgresql:'].includes(db.protocol) || (!directMatch && !poolerMatch)) {
            throw new Error('SUPABASE_DB_URL is not the authoritative production database');
          }
          if (!db.password || db.pathname !== '/postgres') throw new Error('Invalid production database URL');
          if (api.hostname !== `${ref}.supabase.co`) throw new Error('APP_SUPABASE_URL is not the authoritative production API');
          console.log('PASS: authoritative production database and API identities confirmed.');
          NODE

      - name: Apply only country-readiness manifest migration 919
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/919_risk_gate_v2_global_source_manifests.sql"
          test -f "$migration"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"

          table_name="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select coalesce(to_regclass('public.live_source_release_manifests')::text,'')")"
          test "$table_name" = "live_source_release_manifests" || test "$table_name" = "public.live_source_release_manifests"
          echo "PASS: production release-manifest schema is present."

      - name: Refresh governed World Bank macro and fiscal observations
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ingest-world-bank-live.mjs | tee world-bank-macro-write.log
          grep -q 'PASS: WORLD BANK LIVE MACRO INGESTION COMPLETE' world-bank-macro-write.log

      - name: Write governed WGI global observations and release manifest
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ingest-wgi-political-stability-live.ts --write | tee wgi-global-write.log
          grep -q 'PASS: WGI GLOBAL GOVERNANCE INGESTION + EXPLICIT GAP MANIFEST WRITTEN' wgi-global-write.log

      - name: Record current governed UCDP Candidate release manifest
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/record-ucdp-candidate-release-manifest.mjs --write | tee ucdp-release-manifest.log
          grep -q 'PASS: UCDP CANDIDATE GLOBAL RELEASE MANIFEST RECORDED' ucdp-release-manifest.log

      - name: Verify both governed release manifests exist
        shell: bash
        run: |
          set -euo pipefail
          count="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(distinct source_id) from public.live_source_release_manifests where write_completed = true and source_id in ('world_bank_wgi_political_stability','ucdp_candidate')")"
          test "$count" = "2" || { echo "::error::Expected clean WGI and UCDP release manifests, found $count"; exit 1; }
          echo "PASS: WGI and UCDP governed release manifests are present."

      - name: Generate live global country readiness census
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/global-risk-gate-country-census.ts --require-any-accepted
          jq '{generated_at,denominator,summary,claim_boundary}' global-risk-gate-country-census.json | tee global-country-summary.json

      - name: Upload production bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: global-country-readiness-production-bootstrap
          path: |
            world-bank-macro-write.log
            wgi-global-write.log
            ucdp-release-manifest.log
            global-risk-gate-country-census.json
            global-country-summary.json
          if-no-files-found: warn
          retention-days: 30
