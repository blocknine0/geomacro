name: One-time Federico fresh GRO authentication handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-federico-ind-auth-handoff.yml"
      - "scripts/invinoveritas-signed-gro-authentication.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-federico-fresh-gro-auth-handoff
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INVINO_API_KEY: ${{ secrets.INVINO_API_KEY }}
      INVINO_REQUEST_OUT: /tmp/federico-auth-review-request.json
      INVINO_REVIEW_OUT: /tmp/federico-auth-review-response.json
      FEDERICO_GRO_OBJECT_ID: gro_country_IND_7c000b05502b92600dc26f3d

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate handoff configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_SUPABASE_URL APP_SUPABASE_SERVICE_ROLE_KEY INVINO_API_KEY FEDERICO_GRO_OBJECT_ID; do
            test -n "${!name:-}" || { echo "::error::$name missing"; exit 1; }
          done

      - name: Export exact persisted fresh production GRO
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { createClient } = require('@supabase/supabase-js');
          (async () => {
            const db = createClient(process.env.APP_SUPABASE_URL, process.env.APP_SUPABASE_SERVICE_ROLE_KEY, {
              auth: { persistSession: false, autoRefreshToken: false },
            });
            const { data, error } = await db
              .from('geomacro_risk_objects')
              .select('object_id,payload')
              .eq('object_id', process.env.FEDERICO_GRO_OBJECT_ID)
              .maybeSingle();
            if (error) throw error;
            if (!data?.payload || data.object_id !== process.env.FEDERICO_GRO_OBJECT_ID) {
              throw new Error('Exact persisted Federico GRO unavailable');
            }
            fs.writeFileSync('/tmp/federico-auth-risk-object.json', JSON.stringify(data.payload, null, 2) + '\n', { mode: 0o600 });
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify exact GRO and attempt live Federico review
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/invinoveritas-signed-gro-authentication.ts /tmp/federico-auth-risk-object.json | tee /tmp/federico-auth-summary.json
          jq -e --arg object_id "$FEDERICO_GRO_OBJECT_ID" '
            .ok == true and
            .handoff_ready == true and
            .object.object_id == $object_id and
            .object.schema_version == "gro-1.1" and
            .object.subject.id == "IND" and
            .object.signing_key_id == "geomacro-risk-2026-03" and
            .local_gates.deployed_original_verification == "PASS" and
            .local_gates.deployed_tamper_rejection == "PASS" and
            .local_gates.local_payload_hash == "PASS" and
            .local_gates.local_ed25519_signature == "PASS" and
            .local_gates.freshness == "PASS" and
            (
              (
                .partner_review_completed == true and
                .partner_gates.partner_review_http == "PASS" and
                .partner_gates.partner_signed_proof == "PASS" and
                .partner_gates.partner_proof_verification == "PASS" and
                .live_review.proof_present == true and
                .live_review.proof_verified == true
              ) or
              (
                .partner_review_completed == false and
                .partner_gates.partner_review_http == "PAYMENT_REQUIRED" and
                .partner_gates.partner_signed_proof == "NOT_RUN" and
                .partner_gates.partner_proof_verification == "NOT_RUN" and
                .live_review.http_status == 402 and
                .live_review.required_sats > 0 and
                .live_review.proof_present == false
              )
            )
          ' /tmp/federico-auth-summary.json >/dev/null

      - name: Build proof-sealed handoff artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/federico-auth-handoff
          cp /tmp/federico-auth-risk-object.json /tmp/federico-auth-handoff/federico-risk-object.json
          cp /tmp/federico-auth-review-request.json /tmp/federico-auth-handoff/review-request.json
          cp /tmp/federico-auth-review-response.json /tmp/federico-auth-handoff/review-response.json
          cp /tmp/federico-auth-summary.json /tmp/federico-auth-handoff/verification-summary.json
          cp schemas/gro-1.1.schema.json /tmp/federico-auth-handoff/gro-1.1.schema.json
          cp docs/GRO_CANONICAL_JSON_V1.md /tmp/federico-auth-handoff/GRO_CANONICAL_JSON_V1.md
          cp docs/examples/gro-1.1-canonical-v1-test-vector.json /tmp/federico-auth-handoff/gro-1.1-canonical-v1-test-vector.json
          cp docs/examples/gro-1.1-canonical-v1-edge-vectors.json /tmp/federico-auth-handoff/gro-1.1-canonical-v1-edge-vectors.json
          (
            cd /tmp/federico-auth-handoff
            sha256sum GRO_CANONICAL_JSON_V1.md gro-1.1-canonical-v1-edge-vectors.json gro-1.1-canonical-v1-test-vector.json gro-1.1.schema.json federico-risk-object.json review-request.json review-response.json verification-summary.json > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload Federico authentication handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: federico-auth-handoff-${{ github.run_id }}
          path: /tmp/federico-auth-handoff/
          if-no-files-found: error
          retention-days: 8

      - name: Publish sanitized summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Federico fresh production GRO authentication handoff"
            echo
            jq '{object, local_gates, partner_gates, live_review}' /tmp/federico-auth-summary.json
            echo
            echo "The fresh signed GRO handoff is complete. If live review is PAYMENT_REQUIRED, no payment was made automatically and partner proof remains pending."
            echo "No payment or irreversible execution is authorized by this authentication-only handoff."
          } >> "$GITHUB_STEP_SUMMARY"
