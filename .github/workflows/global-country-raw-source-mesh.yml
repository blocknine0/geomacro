name: Global Country Raw Source Mesh

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-global-country-raw-source-mesh-v2
  cancel-in-progress: false

jobs:
  raw-source-mesh:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      RAW_SOURCE_SYNC_MAX_TARGETS: "650"
      RAW_SOURCE_SYNC_CONCURRENCY: "16"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL:-}"
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${LIVE_STRUCTURE_TOKEN:-}"
          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "ldpwajisioljyjtojvfx"
          timeout 30s node --check scripts/sync-country-raw-source-mesh.mjs
          timeout 30s node --check scripts/audit-global-raw-source-coverage.mjs
          timeout 30s node --check scripts/audit-global-raw-source-runtime.mjs

      - name: Reconcile and capture country web/API sources
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/sync-country-raw-source-mesh.mjs | tee country-raw-source-sync.json
          jq -e '.country_contract.countries == 195' country-raw-source-sync.json >/dev/null
          jq -e '.country_contract.categories | length == 3' country-raw-source-sync.json >/dev/null

      - name: Verify 195-country three-category raw mesh
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-global-raw-source-coverage.mjs

      - name: Structure captured country fragments directly
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(jq -r '.fragment_ids[]?' country-raw-source-sync.json)
          if [ "${#ids[@]}" -eq 0 ]; then
            echo '{"structured_fragments":0,"note":"No new country fragments produced in this cycle."}' | tee country-raw-structure-summary.json
            exit 0
          fi
          : > country-raw-structure-summary.ndjson
          for id in "${ids[@]}"; do
            response="country-raw-structure-${id}.json"
            curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 90               -X POST "${APP_SUPABASE_URL%/}/functions/v1/live-structure-intelligence"               -H "x-geomacro-structure-token: ${LIVE_STRUCTURE_TOKEN}"               -H "content-type: application/json"               -d "{\"fragment_id\":\"$id\"}"               -o "$response"
            jq -e '.ok == true' "$response" >/dev/null
            jq -c '{fragment_id,ok,status,evidence_structured,evidence_excluded,events_created,events_updated,remaining,has_more}' "$response" | tee -a country-raw-structure-summary.ndjson
          done
          jq -n --argjson count "${#ids[@]}" '{structured_fragments:$count}' | tee country-raw-structure-summary.json

      - name: Verify fresh raw runtime coverage
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-global-raw-source-runtime.mjs

      - name: Prove raw source health boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f country-raw-source-sync.json
          jq -e '.selected_targets >= 1' country-raw-source-sync.json >/dev/null
          if [ -f country-raw-structure-summary.ndjson ]; then
            while IFS= read -r line; do jq -e '.ok == true' <<<"$line" >/dev/null; done < country-raw-structure-summary.ndjson
          fi

      - name: Upload private raw-source operational evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-country-raw-source-mesh-${{ github.run_id }}
          path: |
            country-raw-source-sync.json
            country-raw-structure-summary.json
            country-raw-structure-summary.ndjson
            country-raw-structure-*.json
          if-no-files-found: warn
          retention-days: 30
