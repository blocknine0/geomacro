name: Global Country Raw Source Mesh

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  raw-source-mesh:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres
      LIVE_STRUCTURE_EXECUTION_MODE: local_direct_postgres
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      B2_ARCHIVE_WRITE_KEY_ID: ${{ secrets.B2_ARCHIVE_WRITE_KEY_ID }}
      B2_ARCHIVE_WRITE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_WRITE_APPLICATION_KEY }}
      DIRECT_NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
      LIVE_STRUCTURE_TOKEN: ${{ secrets.LIVE_STRUCTURE_TOKEN }}
      RAW_SOURCE_SYNC_MAX_TARGETS: "650"
      RAW_SOURCE_SYNC_CONCURRENCY: "16"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_SUPABASE_URL:-}"
          test -n "${APP_SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${LIVE_STRUCTURE_TOKEN:-}"
          test "$(node -e 'console.log(new URL(process.env.APP_SUPABASE_URL).hostname.split(".")[0])')" = "ldpwajisioljyjtojvfx"
          timeout 30s node --check scripts/sync-country-raw-source-mesh.mjs
          timeout 30s node --check scripts/audit-global-raw-source-coverage.mjs
          timeout 30s node --check scripts/audit-global-raw-source-runtime.mjs
          timeout 30s node --check scripts/reconcile-structured-event-commercial-rights.mjs

      - name: Reconcile and capture country web/API sources
        shell: bash
        run: |
          set -euo pipefail
          COUNTRY_RAW_SOURCE_SYNC_OUTPUT=country-raw-source-sync.json \
            bun scripts/sync-country-raw-source-mesh.mjs > country-raw-source-sync.log 2>&1
          cat country-raw-source-sync.json
          jq -e '.country_contract.countries == 195' country-raw-source-sync.json >/dev/null
          jq -e '.country_contract.categories | length == 3' country-raw-source-sync.json >/dev/null

      - name: Verify 195-country three-category raw mesh
        env:
          NODE_OPTIONS: ${{ env.DIRECT_NODE_OPTIONS }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-global-raw-source-coverage.mjs

      - name: Structure captured country fragments directly
        shell: bash
        run: |
          set -euo pipefail
          node scripts/drain-live-structure.mjs --fragment-ids-file country-raw-source-sync.json 2>&1 | tee country-raw-structure-drain.log
          echo '{"structured_via":"local_direct_postgres_b2"}' > country-raw-structure-summary.json

      - name: Reconcile structured event commercial rights
        shell: bash
        env:
          NODE_OPTIONS: ${{ env.DIRECT_NODE_OPTIONS }}
          RECONCILE_SOURCE_KEYS: country_raw_web_mesh
          RECONCILE_LOOKBACK_MINUTES: "120"
        run: |
          set -euo pipefail
          node scripts/reconcile-structured-event-commercial-rights.mjs 2>&1 | tee country-raw-rights-reconcile.log
          grep -q '"ok": true' country-raw-rights-reconcile.log

      - name: Verify fresh raw runtime coverage
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-global-raw-source-runtime.mjs

      - name: Prove raw source health boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f country-raw-source-sync.json
          jq -e '.selected_targets >= 1' country-raw-source-sync.json >/dev/null
          if [ -f country-raw-structure-summary.ndjson ]; then
            while IFS= read -r line; do jq -e '.ok == true' <<<"$line" >/dev/null; done < country-raw-structure-summary.ndjson
          fi
          test -f country-raw-rights-reconcile.log

      - name: Upload private raw-source operational evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-country-raw-source-mesh-${{ github.run_id }}
          path: |
            country-raw-source-sync.json
            country-raw-structure-summary.json
            country-raw-structure-drain.log
            country-raw-rights-reconcile.log
          if-no-files-found: warn
          retention-days: 30
