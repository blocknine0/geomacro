name: Live Signed GRO Bridge Proof

# Bounded operator/merge canary; NO cron, payment, database mutation, or B2 GET.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-signed-gro-bridge-proof.yml"

permissions:
  contents: read

concurrency:
  group: geomacro-live-signed-gro-bridge-proof
  cancel-in-progress: false

jobs:
  compare-live:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge #1848'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Select any already current signed-hot GRO country from protected D1
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Source-free, read-only auditor refuses administrative ledger credentials.
          GEOMACRO_COMMERCE_LEDGER_TOKEN: ""
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/signed-gro-live-bridge
          bun scripts/ops/audit-country-gro-d1-hot-readonly.ts --read-only > artifacts/signed-gro-live-bridge/existing-current-gro-audit.json
          iso3="$(jq -r '.first_verified_current_country_iso3 // empty' artifacts/signed-gro-live-bridge/existing-current-gro-audit.json)"
          if ! [[ "$iso3" =~ ^[A-Z]{3}$ ]]; then
            echo "::error::SIGNED_GRO_NO_EXISTING_CURRENT_VERIFIED_D1_HOT"
            exit 2
          fi
          echo "GRO_CONTINUITY_COUNTRY_ISO3=$iso3" >> "$GITHUB_ENV"
      - name: Prove authenticated D1 hot signed GRO with full signature and commercial policy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEOMACRO_COMMERCE_LEDGER_TOKEN:-}" || {
            echo "::error::SIGNED_GRO_BACKEND_CONTROL_PLANE_TOKEN_MISSING"
            exit 2
          }
          mkdir -p artifacts/signed-gro-live-bridge
          chmod 700 artifacts/signed-gro-live-bridge
          if ! bun scripts/ops/verify-country-gro-hot-serving.ts > artifacts/signed-gro-live-bridge/backend-country-canary.json 2>"$RUNNER_TEMP/gro-backend-private-stderr.log"; then
            diagnostic="$(grep -E '^SAFE_GRO_DIAGNOSTIC=[A-Z0-9_]+$' "$RUNNER_TEMP/gro-backend-private-stderr.log" | head -n 1 | cut -d= -f2 || true)"
            # Fixed-code allowlist. No raw stderr, GRO payload, token, URL or source identity is printed.
            case "${diagnostic:-}" in
              SUBJECT_INVALID|REQUEST_TIME_INVALID|AUTH_ROOT_UNAVAILABLE|CONTROL_PLANE_ORIGIN_INVALID|CONTROL_PLANE_HTTP_401|CONTROL_PLANE_HTTP_403|CONTROL_PLANE_HTTP_404|CONTROL_PLANE_HTTP_503|CONTROL_PLANE_HTTP_OTHER|HOT_OBJECT_MISSING|HOT_ENVELOPE_INVALID|HOT_CLOCK_INVALID|HOT_OBJECT_EXPIRED|HOT_OBJECT_SHA_MISMATCH|PUBLIC_SIGNER_REGISTRY_UNAVAILABLE|HOT_SIGNATURE_INVALID|HOT_COMMERCIAL_INELIGIBLE|CONTROL_PLANE_TRANSPORT_OR_JSON_INVALID)
                echo "::error::SIGNED_GRO_BACKEND_${diagnostic}"
                ;;
              *) echo "::error::SIGNED_GRO_BACKEND_CANARY_NOT_VERIFIED" ;;
            esac
            rm -f "$RUNNER_TEMP/gro-backend-private-stderr.log" artifacts/signed-gro-live-bridge/backend-country-canary.json
            exit 2
          fi
          rm -f "$RUNNER_TEMP/gro-backend-private-stderr.log"
          echo "PASS: authenticated country GRO D1 hot, public trust signing and commercial policy verified; no secret or GRO body logged."

      - name: Compare live website no-charge signed-GRO availability
        run: node scripts/ops/verify-signed-gro-live-bridge.mjs

      - name: Upload safe source-free bridge status only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-gro-live-bridge-${{ github.run_id }}
          path: |
            artifacts/signed-gro-live-bridge/bridge-evidence.json
            artifacts/signed-gro-live-bridge/existing-current-gro-audit.json
          if-no-files-found: warn
          retention-days: 7
