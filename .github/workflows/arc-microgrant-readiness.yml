name: Arc Microgrants readiness

on:
  pull_request:
    paths:
      - 'public/arc-microgrant.html'
      - 'docs/ARC_MICROGRANTS_SUBMISSION.md'
      - 'scripts/ops/verify-arc-microgrant-static.mjs'
      - 'src/lib/arc.ts'
      - 'src/lib/x402-discovery.server.ts'
      - '.github/workflows/arc-microgrant-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'public/arc-microgrant.html'
      - 'scripts/ops/verify-arc-microgrant-static.mjs'
      - 'src/lib/arc.ts'
      - 'src/lib/x402-discovery.server.ts'

permissions:
  contents: read

jobs:
  static-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Arc mainnet proof safety and reproducibility
        run: node scripts/ops/verify-arc-microgrant-static.mjs
