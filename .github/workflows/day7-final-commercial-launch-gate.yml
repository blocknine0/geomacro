name: Final Commercial Launch Gate

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/ops/final-launch-gate-core.mjs"
      - "scripts/ops/simulate-final-launch-failures.mjs"
      - "scripts/ops/verify-generic-production-risk-object.ts"
      - "workers/control-plane/**"
      - ".github/workflows/exact-head-commercial-launch-readiness.yml"
      - ".github/workflows/day7-final-commercial-launch-gate.yml"
      - "src/__tests__/final-commercial-launch-gate-generic-static.test.ts"
  workflow_run:
    workflows:
      - B2 country GRO continuity
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  static-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Simulate D1 B2 trust payment signing scheduler failures
        run: node scripts/ops/simulate-final-launch-failures.mjs

      - name: Run generic final launch scope contracts
        run: >-
          bunx vitest run
          src/__tests__/final-commercial-launch-gate-generic-static.test.ts
          src/__tests__/risk-object-signing.test.ts
          src/__tests__/risk-object-key-lifecycle.test.ts
          src/__tests__/risk-object-independent-trust.test.ts
          src/__tests__/risk-object-public-verification-route.test.ts
          src/__tests__/canonical-json-v1-test-vector.test.ts

  final-live-acknowledgement:
    needs: static-fail-closed
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ARCHIVE_READ_KEY_ID: ${{ secrets.B2_ARCHIVE_READ_KEY_ID }}
      B2_ARCHIVE_READ_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_READ_APPLICATION_KEY }}
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"
      GEOMACRO_ORIGIN: https://geomacro.live
    steps:
      - name: Checkout exact GRO-continuity-proven SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prove Supabase credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          if env | grep -E '^((APP_)?SUPABASE_|VITE_SUPABASE_)' >/dev/null; then
            echo "::error::Final launch gate must not receive Supabase credentials"
            exit 2
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32

      - name: Resolve D1 and verify primary compact authority marker
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          DB_ID="$(printf '%s' "$LIST" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
              const rows=JSON.parse(s); const row=rows.find(x=>x.name===process.env.D1_DATABASE_NAME);
              process.stdout.write(row?.uuid ?? row?.id ?? "");
            });
          ')"
          test -n "$DB_ID" || { echo "::error::D1 control-plane database missing"; exit 3; }
          D1_DATABASE_ID="$DB_ID" node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('workers/control-plane/wrangler.example.jsonc','utf8');
          const id=process.env.D1_DATABASE_ID;
          if (!/^[0-9a-f-]{20,}$/i.test(id)) throw new Error('INVALID_D1_DATABASE_ID');
          fs.writeFileSync('workers/control-plane/wrangler.runtime.jsonc', source.replace('REPLACE_WITH_D1_DATABASE_ID', id));
          NODE
          cd workers/control-plane
          SQL="SELECT CASE WHEN json_extract(value_json,'$.role')='primary' AND json_extract(value_json,'$.compact_metadata_only')=1 AND json_extract(value_json,'$.durable_payload_authority')='backblaze-b2' AND json_extract(value_json,'$.commerce_authority')='cloudflare-durable-objects' AND json_extract(value_json,'$.supabase_runtime_mode')='standby' AND json_extract(value_json,'$.supabase_required_for_serving')=0 THEN 'FINAL_D1_PRIMARY_PASS' ELSE 'FINAL_D1_PRIMARY_FAIL' END AS verdict FROM control_state WHERE key='runtime_authority';"
          PASS=false
          for attempt in $(seq 1 20); do
            OUT="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 execute DB --remote --config wrangler.runtime.jsonc --command "$SQL" 2>&1 || true)"
            if printf '%s' "$OUT" | grep -q 'FINAL_D1_PRIMARY_PASS'; then PASS=true; break; fi
            echo "Waiting for D1 primary-authority state: attempt $attempt/20"
            sleep 15
          done
          test "$PASS" = "true" || { printf '%s\n' "$OUT"; echo "::error::D1 primary compact authority marker not verified"; exit 3; }
          printf '{"ok":true,"store":"d1","control_plane_role":"primary","schema_version":1}\n' > /tmp/final-d1.json

      - name: Verify fresh production Intelligence publication owner
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/intelligence-scored-refresh.yml/runs?branch=main&per_page=20" \
            > /tmp/final-intelligence-runs.json
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/intelligence-fastlane-publication.yml/runs?branch=main&per_page=20" \
            > /tmp/final-fastlane-publication-runs.json
          node <<'NODE'
          const fs=require('fs');
          const now=Date.now();
          const maxAgeMs=6 * 60 * 60 * 1000;
          const futureToleranceMs=5 * 60 * 1000;
          const owners=[
            {
              owner:'intelligence-scored-refresh',
              workflow:'Intelligence Scored + Current Evidence',
              file:'/tmp/final-intelligence-runs.json',
              events:new Set(['schedule','workflow_dispatch','push']),
            },
            {
              owner:'intelligence-fastlane-publication',
              workflow:'Intelligence Fastlane Publication Sync',
              file:'/tmp/final-fastlane-publication-runs.json',
              events:new Set(['workflow_run','workflow_dispatch','push']),
            },
          ];
          const observed=[];
          const eligible=[];
          for (const source of owners) {
            const parsed=JSON.parse(fs.readFileSync(source.file,'utf8'));
            for (const run of parsed.workflow_runs ?? []) {
              if (run?.head_branch !== 'main' || !source.events.has(run?.event)) continue;
              const startedAt=Date.parse(String(run.run_started_at ?? run.created_at ?? ''));
              const ageMs=now-startedAt;
              const row={
                owner:source.owner,
                workflow:source.workflow,
                workflow_run_id:run.id,
                workflow_event:run.event,
                workflow_head_sha:run.head_sha,
                workflow_started_at:run.run_started_at ?? run.created_at ?? null,
                status:run.status,
                conclusion:run.conclusion,
                age_ms:Number.isFinite(ageMs)?ageMs:null,
              };
              observed.push(row);
              if (
                run.status === 'completed' &&
                run.conclusion === 'success' &&
                Number.isFinite(startedAt) &&
                ageMs >= -futureToleranceMs &&
                ageMs <= maxAgeMs
              ) eligible.push({...row, started_at_ms:startedAt});
            }
          }
          eligible.sort((a,b)=>b.started_at_ms-a.started_at_ms);
          const latest=eligible[0];
          if (!latest) {
            const recent=observed
              .sort((a,b)=>String(b.workflow_started_at??'').localeCompare(String(a.workflow_started_at??'')))
              .slice(0,8);
            throw new Error(`PRODUCTION_INTELLIGENCE_PUBLICATION_PROOF_MISSING:${JSON.stringify(recent)}`);
          }
          fs.writeFileSync('/tmp/final-scheduler.json', JSON.stringify({
            ok:true,
            fresh:true,
            fail_closed_on_stale:true,
            owner:latest.owner,
            workflow:latest.workflow,
            workflow_run_id:latest.workflow_run_id,
            workflow_event:latest.workflow_event,
            workflow_head_sha:latest.workflow_head_sha,
            workflow_started_at:latest.workflow_started_at,
            accepted_publication_owners:['intelligence-scored-refresh','intelligence-fastlane-publication'],
          })+'\n');
          NODE

      - name: Verify B2 directly with Supabase absent
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ops/verify-b2-public-no-supabase.ts | tee /tmp/final-b2.json
          node -e '
            const fs=require("fs"); const b=JSON.parse(fs.readFileSync("/tmp/final-b2.json","utf8"));
            if (b?.ok!==true || b?.authority!=="backblaze-b2" || b?.supabase_credentials_present!==false || b?.supabase_network_attempts!==0) process.exit(5);
            if (b?.risk_verification_status!=="verified") process.exit(5);
            for (const c of ["geopolitics","macro","rare_earth"]) if (!(b?.categories ?? []).includes(c)) process.exit(5);
          '

      - name: Verify deployed public boundary is B2 authoritative and Supabase standby
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 20 'https://geomacro.live/api/health?deep=1')"
          printf '%s' "$BODY" | tee /tmp/final-public-health.json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
              const b=JSON.parse(s); const p=b?.public_production ?? {};
              if (b?.ok!==true || b?.production_data_authority!=="backblaze-b2" || p?.serving_authority!=="backblaze-b2-durable-truth-cloudflare-d1-verified-hot") process.exit(6);
              const hot=Object.values(p?.hot_snapshot_serving??{}); if (hot.length!==3 || hot.some(x=>x?.ok!==true || x?.serving_store!=="cloudflare-d1")) process.exit(6);
              if (b?.supabase_runtime_mode!=="standby" || p?.supabase_required_for_serving!==false) process.exit(6);
              if (b?.commerce_control_plane!=="cloudflare-durable-objects") process.exit(6);
            });
          '

      - name: Resolve and verify Durable Object commerce authority
        id: origins
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
              const b=JSON.parse(s); const v=b?.result?.subdomain; if (b?.success!==true || typeof v!=="string" || !/^[a-z0-9-]+$/i.test(v)) process.exit(1); process.stdout.write(v);
            });
          ')"
          URL="https://geomacro-commerce-ledger.${SUBDOMAIN}.workers.dev"
          echo "ledger_url=$URL" >> "$GITHUB_OUTPUT"
          BODY="$(curl -fsS --max-time 15 "$URL/health")"
          printf '%s' "$BODY" > /tmp/final-commerce-health.json
          printf '%s' "$BODY" | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{
              const b=JSON.parse(s); const c=Array.isArray(b?.capabilities)?b.capabilities:[];
              if(b?.ok!==true||b?.storage!=="durable_objects_sqlite")process.exit(7);
              for(const x of ["delivery","usage_guard","product_audit"])if(!c.includes(x))process.exit(7);
            });
          '

      - name: Verify commerce adapter replay and outage behavior without Supabase
        env:
          GEOMACRO_COMMERCE_LEDGER_BACKEND: durable_object
          GEOMACRO_COMMERCE_LEDGER_URL: ${{ steps.origins.outputs.ledger_url }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ops/verify-commerce-no-supabase.ts | tee /tmp/final-commerce-acceptance.json
          node -e '
            const fs=require("fs");const b=JSON.parse(fs.readFileSync("/tmp/final-commerce-acceptance.json","utf8"));
            if(b?.ok!==true||b?.backend!=="durable_object"||b?.supabase_credentials_present!==false||b?.supabase_network_attempts!==0)process.exit(8);
            if(b?.exact_response_replay!==true||b?.duplicate_settlement_rejected!==true||b?.worker_outage_fails_closed!==true)process.exit(8);
            if(b?.external_payment_performed!==false||b?.execution_authorized!==false)process.exit(8);
          '

      - name: Resolve one fresh commercially verified GRO from D1
        working-directory: workers/control-plane
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT json_object('object_id',object_id,'verification_status',verification_status,'commercial_eligibility_status',commercial_eligibility_status,'archive_key',archive_key,'archive_sha256',archive_sha256,'record_sha256',record_sha256,'generated_at',generated_at,'expires_at',expires_at) AS payload FROM risk_object_index WHERE verification_status='VERIFIED' AND commercial_eligibility_status='VERIFIED' AND datetime(expires_at) > datetime('now','+5 minutes') ORDER BY datetime(generated_at) DESC LIMIT 1;"
          OUT="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 execute DB --remote --json --config wrangler.runtime.jsonc --command "$SQL")"
          D1_OUT="$OUT" node <<'NODE'
          const fs=require('fs');
          const parsed=JSON.parse(process.env.D1_OUT || '[]');
          const envelopes=Array.isArray(parsed)?parsed:[parsed];
          const rows=envelopes.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          if(!rows.length || !rows[0]?.payload) throw new Error('FINAL_FRESH_RISK_OBJECT_INDEX_MISSING');
          const payload=typeof rows[0].payload==='string'?JSON.parse(rows[0].payload):rows[0].payload;
          fs.writeFileSync('/tmp/final-risk-object-index.json',JSON.stringify(payload)+'\n',{mode:0o600});
          NODE

      - name: Verify generic production Risk Object trust from D1 B2 and deployed registry
        env:
          RISK_OBJECT_INDEX_FILE: /tmp/final-risk-object-index.json
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ops/verify-generic-production-risk-object.ts | tee /tmp/final-risk-object-trust.json

      - name: Require exact-head launch workflows green
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED='["Product CI","CodeQL Security Scan","Website Lock","Hosting Alignment","Live x402 Prelaunch Safety","Global Intelligence V1 CI","Exact-Head Commercial Launch Readiness","B2 country GRO continuity"]'
          PASS=false
          for attempt in $(seq 1 30); do
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
              > /tmp/final-exact-head-runs.json
            if REQUIRED="$REQUIRED" node <<'NODE'
          const fs=require('fs');
          const required=JSON.parse(process.env.REQUIRED);
          const runs=JSON.parse(fs.readFileSync('/tmp/final-exact-head-runs.json','utf8')).workflow_runs ?? [];
          const state=Object.fromEntries(required.map(name=>{
            const rows=runs.filter(x=>x.name===name).sort((a,b)=>String(b.created_at??"").localeCompare(String(a.created_at??"")));
            return [name, rows[0]?.conclusion ?? rows[0]?.status ?? "missing"];
          }));
          console.log(JSON.stringify(state));
          process.exit(required.every(name=>state[name]==="success") ? 0 : 1);
          NODE
            then PASS=true; break; fi
            echo "Exact-head launch workflows not all green yet: attempt $attempt/30"
            sleep 20
          done
          test "$PASS" = "true" || { echo "::error::Exact-head required launch workflows are not all successful"; exit 9; }
          printf '{"product_ci":true,"codeql":true,"website_lock":true,"hosting":true,"x402":true,"trust":true}\n' > /tmp/final-exact-head.json

      - name: Seal final no-funds commercial launch readiness acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/final-commercial-launch-gate
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          (async()=>{
            const { evaluateFinalLaunchGate }=await import('./scripts/ops/final-launch-gate-core.mjs');
            const d1=JSON.parse(fs.readFileSync('/tmp/final-d1.json','utf8'));
            const b2=JSON.parse(fs.readFileSync('/tmp/final-b2.json','utf8'));
            const publicHealth=JSON.parse(fs.readFileSync('/tmp/final-public-health.json','utf8'));
            const commerceHealth=JSON.parse(fs.readFileSync('/tmp/final-commerce-health.json','utf8'));
            const commerce=JSON.parse(fs.readFileSync('/tmp/final-commerce-acceptance.json','utf8'));
            const riskObjectTrust=JSON.parse(fs.readFileSync('/tmp/final-risk-object-trust.json','utf8'));
            const scheduler=JSON.parse(fs.readFileSync('/tmp/final-scheduler.json','utf8'));
            const exactHead=JSON.parse(fs.readFileSync('/tmp/final-exact-head.json','utf8'));
            const state={
              d1,
              b2,
              commerce:{
                ok:commerceHealth.ok===true && commerce.ok===true,
                storage:commerceHealth.storage,
                exact_response_replay:commerce.exact_response_replay,
                duplicate_settlement_rejected:commerce.duplicate_settlement_rejected,
                worker_outage_fails_closed:commerce.worker_outage_fails_closed,
              },
              supabase:{
                runtime_mode:publicHealth.supabase_runtime_mode,
                required_for_serving:publicHealth.public_production?.supabase_required_for_serving,
                network_attempts:(b2.supabase_network_attempts===0 && commerce.supabase_network_attempts===0) ? 0 : 1,
              },
              risk_object_trust:riskObjectTrust,
              scheduler,
              exact_head:exactHead,
            };
            const result=evaluateFinalLaunchGate(state);
            const evidence={
              ...result,
              schema:'geomacro.final-commercial-launch-acknowledgement.v2',
              head_sha:process.env.HEAD_SHA,
              gro_continuity_run_id:process.env.UPSTREAM_RUN_ID,
              acknowledged_at:new Date().toISOString(),
              owner_real_funds_ack_required_before_first_usdc:true,
              first_real_money_transaction_authorized:false,
              destructive_supabase_retirement_authorized:false,
            };
            if(!result.ready) throw new Error(`FINAL_LAUNCH_GATE_BLOCKED:${result.failed.join(',')}`);
            const canonical=JSON.stringify(evidence);
            evidence.evidence_sha256=crypto.createHash('sha256').update(canonical).digest('hex');
            fs.writeFileSync('artifacts/final-commercial-launch-gate/acknowledgement.json',JSON.stringify(evidence,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cat artifacts/final-commercial-launch-gate/acknowledgement.json

      - name: Upload final launch acknowledgement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-commercial-launch-gate-${{ github.run_id }}
          path: artifacts/final-commercial-launch-gate/acknowledgement.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm no-funds launch gate only
        run: |
          echo "Generic final commercial launch readiness is acknowledged for this exact head. Federico/partner-specific assurance is outside #1414. This gate does not authorize real funds; explicit owner real-money ACK remains mandatory before the first USDC transaction."
