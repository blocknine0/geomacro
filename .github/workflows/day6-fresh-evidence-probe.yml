name: Day 6 Global Strict Evidence Probe

on:
  workflow_dispatch:
    inputs:
      iso3:
        description: "Uppercase ISO3 country to evaluate under the same strict partner policy"
        required: true
        default: "USA"
        type: string

permissions:
  contents: read

concurrency:
  group: day6-global-strict-evidence-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GRI_DB_MODE: direct_postgres

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Normalize requested country
        id: country
        env:
          RAW_ISO3: ${{ inputs.iso3 }}
        shell: bash
        run: |
          set -euo pipefail
          ISO3="$(printf '%s' "$RAW_ISO3" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if ! [[ "$ISO3" =~ ^[A-Z]{3}$ ]]; then
            echo "::error::iso3 must be exactly three letters"
            exit 2
          fi
          echo "iso3=$ISO3" >> "$GITHUB_OUTPUT"

      - name: Probe strict country evidence without signing or partner review
        env:
          DAY6_COUNTRY_ISO3: ${{ steps.country.outputs.iso3 }}
          NODE_OPTIONS: --experimental-loader=./scripts/lib/direct-postgres-supabase-loader.mjs
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/probe-day6-federico-live-evidence.ts "$DAY6_COUNTRY_ISO3" | tee /tmp/day6-global-strict-probe.json
          jq -e '
            .ok == true and
            .country_iso3 == env.DAY6_COUNTRY_ISO3 and
            .policy.profile == "FEDERICO_STRICT" and
            .policy.country_scope == "any_enabled_iso3" and
            .policy.threshold_weakening == false and
            .signed_object_created == false and
            .b2_write_performed == false and
            .partner_review_attempted == false and
            .partner_allowance_spent == false and
            .payment_performed == false and
            .execution_authorized == false
          ' /tmp/day6-global-strict-probe.json >/dev/null
          if [ "$(jq -r '.ready' /tmp/day6-global-strict-probe.json)" = "true" ]; then
            echo "Strict evidence is currently ready for $DAY6_COUNTRY_ISO3. No Federico allowance was used."
          else
            echo "Strict evidence is currently not ready for $DAY6_COUNTRY_ISO3. Fail-closed; no Federico allowance was used."
          fi
