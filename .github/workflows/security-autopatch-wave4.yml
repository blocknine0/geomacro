name: Security autopatch wave 4

on:
  push:
    branches:
      - fix/codeql-credential-hashing-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted CodeQL fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # #3 Double escaping/unescaping: decode one entity layer in a single pass,
          # then remove any tags introduced by that decode. Double-encoded entities
          # remain encoded rather than being decoded twice.
          path = "scripts/ingest-news.js"
          old = '''function stripHtml(value) {\n  if (!value) return '';\n  return String(value)\n    .replace(/<[^>]*>/g, ' ')\n    .replace(/&nbsp;/gi, ' ')\n    .replace(/&amp;/gi, '&')\n    .replace(/&quot;/gi, '\"')\n    .replace(/&#39;|&apos;/gi, "'")\n    .replace(/&lt;/gi, '<')\n    .replace(/&gt;/gi, '>')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}'''
          new = '''function stripHtml(value) {\n  if (!value) return '';\n\n  const decoded = String(value).replace(\n    /&(nbsp|amp|quot|#39|apos|lt|gt);/gi,\n    (entity, name) => {\n      switch (String(name).toLowerCase()) {\n        case 'nbsp': return ' ';\n        case 'amp': return '&';\n        case 'quot': return '\"';\n        case '#39':\n        case 'apos': return "'";\n        case 'lt': return '<';\n        case 'gt': return '>';\n        default: return entity;\n      }\n    }\n  );\n\n  return decoded\n    .replace(/<[^>]*>/g, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}'''
          replace_once(path, old, new)

          # #5/#6 Stack trace/detail exposure: preserve detailed diagnostics only
          # in private DB run records, never in the HTTP response.
          replace_once(
              "supabase/functions/live-structure-intelligence/index.ts",
              '''        detail:\n          message,''',
              '''        detail:\n          "Internal structuring failure. See private run diagnostics.",''',
          )
          replace_once(
              "supabase/functions/live-gdelt-ingest/index.ts",
              '''        detail: message,''',
              '''        detail: "Internal ingestion failure. See private run diagnostics.",''',
          )

          # #4 Dynamic explorer href hardening. Only HTTPS explorer URLs and
          # canonical EVM transaction hashes are allowed into rendered hrefs.
          path = "src/components/sections/bridge-section.tsx"
          marker = '''function shortHash(hash: string) {\n  return `${hash.slice(0, 10)}…${hash.slice(-6)}`;\n}\n'''
          helper = marker + '''\nfunction safeExplorerTxUrl(explorerUrl: string, hash: string) {\n  if (!/^0x[0-9a-fA-F]{64}$/.test(hash)) return undefined;\n  try {\n    const base = new URL(explorerUrl);\n    if (base.protocol !== "https:") return undefined;\n    return new URL(`/tx/${hash}`, `${base.origin}/`).toString();\n  } catch {\n    return undefined;\n  }\n}\n'''
          replace_once(path, marker, helper)
          replace_once(path, 'href={`${source.explorerUrl}/tx/${burnTxHash}`}', 'href={safeExplorerTxUrl(source.explorerUrl, burnTxHash)}')
          replace_once(path, 'href={`${DEST.explorerUrl}/tx/${mintTxHash}`}', 'href={safeExplorerTxUrl(DEST.explorerUrl, mintTxHash)}')
          replace_once(path, 'href={`${DEST.explorerUrl}/tx/${feeTxHash}`}', 'href={safeExplorerTxUrl(DEST.explorerUrl, feeTxHash)}')

          # Remove this temporary workflow from the resulting source commit.
          Path('.github/workflows/security-autopatch-wave4.yml').unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): resolve CodeQL input and error exposure findings"
          git push origin HEAD:fix/codeql-credential-hashing-v1
