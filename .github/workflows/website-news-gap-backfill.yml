name: Website Intelligence Historical Gap Backfill

# First-party publication ORIGINAL dates, never search/update/fetch time.
# D1 stores only derived-only news cards; no raw feeds, Supabase, GRO or B2.
on:
  pull_request:
    paths:
      - ".github/workflows/website-news-gap-backfill.yml"
      - "scripts/ops/backfill-website-derived-news.ts"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-news-gap-backfill.yml"
      - "scripts/ops/backfill-website-derived-news.ts"
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

concurrency:
  group: geomacro-historical-derived-website-backfill
  cancel-in-progress: false

jobs:
  official-original-backfill:
    if: github.repository == 'blocknine0/geomacro' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      GEOMACRO_COMMERCE_LEDGER_TOKEN: ${{ secrets.GEOMACRO_COMMERCE_LEDGER_TOKEN }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Validate existing private D1 publisher token
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 0; fi
          test "${#GEOMACRO_COMMERCE_LEDGER_TOKEN}" -ge 32 || {
            echo "::error::DERIVED_HISTORY_CONTROL_PLANE_AUTH_MISSING"
            exit 2
          }
      - name: Independently probe archived original publishers without secrets or writes (PR)
        if: github.event_name == 'pull_request'
        env:
          BACKFILL_DRY_RUN: "1"
        run: bun scripts/ops/backfill-website-derived-news.ts
      - name: Reconstruct original-date-backed derived news from Oct 1 onwards (main)
        if: github.event_name != 'pull_request'
        run: bun scripts/ops/backfill-website-derived-news.ts
