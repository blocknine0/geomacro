name: Global Security Headers CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server.ts'
      - 'src/lib/security-headers.ts'
      - 'src/__tests__/global-security-headers.test.ts'
      - '.github/workflows/security-headers-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Security-header contract tests
        run: bun x vitest run src/__tests__/global-security-headers.test.ts

      - name: Full app tests
        run: bun run test:app

      - name: Production build
        run: bun run build
