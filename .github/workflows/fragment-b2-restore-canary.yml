name: Fragment B2 Restore Canary
on:
  workflow_dispatch:
    inputs:
      fragment_id:
        description: "Archived fragment UUID to verify/restore"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fragment-b2-restore-canary
  cancel-in-progress: false
jobs:
  restore-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APP_SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_FRAGMENT_RESTORE_ID: ${{ inputs.fragment_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bash scripts/ops/b2-fragment-restore-canary.sh
