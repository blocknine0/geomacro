name: Generate Hawk/Dove briefings (Technical Proof)
# Prediction-market briefings are a secondary Arc Testnet technical-proof
# artifact, not part of the flagship intelligence production pipeline.
# Keep this available for deliberate demo/testing runs without continuously
# spending Actions/LLM quota or generating new market-side artifacts.
on:
  workflow_dispatch: {}
concurrency:
  group: auto-generate-briefings
  cancel-in-progress: true
jobs:
  generate-briefings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install @supabase/supabase-js groq-sdk node-fetch
      - name: Run briefing generation script
        env:
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MAX_BRIEFINGS_PER_RUN: "30"
        run: node scripts/generate-briefings.js
