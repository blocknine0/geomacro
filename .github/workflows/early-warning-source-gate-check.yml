name: Early Warning Source Gate Check

on:
  pull_request:
    paths:
      - "src/lib/early-warning-source-eligibility.server.ts"
      - "src/lib/early-warning-source-eligibility.server.test.ts"
      - "src/lib/early-warning-event-family.ts"
      - "src/lib/early-warning-event-family.test.ts"
      - "src/lib/early-warning-governed-service.server.ts"
      - "src/lib/early-warning-governed-service.server.test.ts"
      - "config/early-warning-watchers.json"
      - "scripts/early-warning/**"
      - "docs/EARLY_WARNING_SOURCE_GOVERNANCE.md"
      - "docs/source-reviews/**"
      - ".github/workflows/early-warning-source-gate-check.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/early-warning-source-eligibility.server.ts"
      - "src/lib/early-warning-event-family.ts"
      - "src/lib/early-warning-governed-service.server.ts"
      - "config/early-warning-watchers.json"
      - "scripts/early-warning/**"
      - "docs/source-reviews/**"
      - ".github/workflows/early-warning-source-gate-check.yml"

permissions:
  contents: read

jobs:
  source-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run source policy and event-family tests
        run: bunx vitest run src/lib/early-warning-source-eligibility.server.test.ts src/lib/early-warning-event-family.test.ts src/lib/early-warning-governed-service.server.test.ts scripts/early-warning/ecb-rss-core.test.mjs
      - name: Verify watcher registry remains prelaunch and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/early-warning-watchers.json', 'utf8'));
          if (config.mode !== 'prelaunch') throw new Error('watcher registry must remain prelaunch');
          if (config.live_watcher_activation !== false) throw new Error('live watcher activation must remain false');
          const allowedAdapterStates = new Set(['NOT_IMPLEMENTED', 'DRY_RUN_IMPLEMENTED']);
          for (const [id, candidate] of Object.entries(config.official_source_candidates || {})) {
            if (candidate.enabled !== false) throw new Error(`${id} candidate must remain disabled`);
            if (candidate.rights_status !== 'REVIEW_REQUIRED') throw new Error(`${id} candidate must remain review-required`);
            if (!allowedAdapterStates.has(candidate.adapter_status)) throw new Error(`${id} has unsupported prelaunch adapter status`);
            if (candidate.adapter_status === 'DRY_RUN_IMPLEMENTED') {
              if (candidate.database_write !== false) throw new Error(`${id} dry-run adapter must not write database`);
              if (candidate.commercial_signal_activation !== false) throw new Error(`${id} dry-run adapter must not activate commercial signals`);
            }
          }
          for (const [id, source] of Object.entries(config.governed_existing_sources || {})) {
            if (source.runtime_commercial_signal_activation !== false) throw new Error(`${id} must not be promoted by config`);
          }
          console.log('PASS: watcher registry is prelaunch, disabled and review-gated.');
          NODE
      - name: Verify existing governed source migrations still keep commercial signals disabled
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enabled_for_commercial_signals = false' supabase/migrations/923_enable_gdelt_v2_event_ingestion.sql
          grep -q 'enabled_for_commercial_signals = false' supabase/migrations/922_multidomain_observation_and_usgs_ingestion.sql
          echo 'PASS: GDELT and USGS remain governed ingestion-only.'
      - name: Verify governed persistence cannot bypass source gate
        shell: bash
        run: |
          set -euo pipefail
          file=src/lib/early-warning-governed-service.server.ts
          grep -q 'assertEarlyWarningDerivedSourcesEligible' "$file"
          grep -q 'if (!sourceGate.eligible)' "$file"
          grep -q 'persistEarlyWarningAlert' "$file"
          grep -q 'public Early Warning requires a classified canonical event family' "$file"
          echo 'PASS: governed persistence gates sources and public event classification before ledger write.'
