name: Temporary B2 Parity Semantic Fix

on:
  push:
    branches:
      - fix/b2-data-parity-20261003
    paths:
      - ".github/workflows/temp-b2-parity-semantic-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/b2-data-parity-20261003
          fetch-depth: 0
      - name: Separate current top risks from latest verified context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/use-intelligence.ts")
          text = path.read_text()

          old = '''  topRisks: IntelEvent[];\n  /** null when no row in the window carries a real severity change. */'''
          new = '''  topRisks: IntelEvent[];\n  /** Latest scored verified B2 rows, kept separate from current-only topRisks. */\n  verifiedRiskContext: IntelEvent[];\n  /** null when no row in the window carries a real severity change. */'''
          if old not in text:
              raise SystemExit("type anchor missing")
          text = text.replace(old, new, 1)

          old = '''  const currentScored = in24h.filter((r) => r.severity !== null);\n  const latestVerifiedScored = verifiedContext.filter((r) => r.severity !== null).slice(0, 24);\n  const riskRankingPool = [...currentScored, ...latestVerifiedScored].filter(\n    (row, index, rows) => rows.findIndex((candidate) => candidate.id === row.id) === index,\n  );\n  const topRisks = [...riskRankingPool]\n    .sort((a, b) => (b.severity ?? 0) - (a.severity ?? 0))\n    .slice(0, 8);'''
          new = '''  // Current risk topics remain strictly current-only. Older verified B2 rows\n  // are exposed separately as context and never promoted into a current claim.\n  const currentScored = in24h.filter((r) => r.severity !== null);\n  const topRisks = [...currentScored]\n    .sort((a, b) => (b.severity ?? 0) - (a.severity ?? 0))\n    .slice(0, 8);\n  const verifiedRiskContext = [...verifiedContext]\n    .filter((r) => r.severity !== null)\n    .sort((a, b) => (b.severity ?? 0) - (a.severity ?? 0) || timeOf(b) - timeOf(a))\n    .slice(0, 8);'''
          if old not in text:
              raise SystemExit("risk ranking anchor missing")
          text = text.replace(old, new, 1)

          old = '''    topRisks,\n    fastestMoving: rising.length > 0 ? rising.slice(0, 5) : null,'''
          new = '''    topRisks,\n    verifiedRiskContext,\n    fastestMoving: rising.length > 0 ? rising.slice(0, 5) : null,'''
          if old not in text:
              raise SystemExit("return anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text)

          workspace = Path("src/components/institutional/workspace.tsx")
          text = workspace.read_text()
          old = '''          <h3 className="type-meta text-muted-foreground">Top verified risk context</h3>\n          <div className="mt-3">\n            {intel.status === "loading" ? (\n              <SectionLoadingState label="Loading top risks" />\n            ) : intel.status === "error" ? (\n              <ErrorState error={intel.error ?? undefined} onRetry={intel.retry} />\n            ) : intel.data && intel.data.topRisks.length > 0 ? (\n              <RankedPanel events={intel.data.topRisks.slice(0, 6)} />\n            ) : (\n              <UnavailableSurface\n                title="No scored events yet"\n                description="Verified risk context appears once the durable pipeline has scored events."\n              />\n            )}\n          </div>'''
          new = '''          <h3 className="type-meta text-muted-foreground">\n            {intel.data?.topRisks.length ? "Top current risks" : "Latest verified risk context"}\n          </h3>\n          <div className="mt-3">\n            {intel.status === "loading" ? (\n              <SectionLoadingState label="Loading risk context" />\n            ) : intel.status === "error" ? (\n              <ErrorState error={intel.error ?? undefined} onRetry={intel.retry} />\n            ) : intel.data && intel.data.topRisks.length > 0 ? (\n              <RankedPanel events={intel.data.topRisks.slice(0, 6)} />\n            ) : intel.data && intel.data.verifiedRiskContext.length > 0 ? (\n              <RankedPanel events={intel.data.verifiedRiskContext.slice(0, 6)} />\n            ) : (\n              <UnavailableSurface\n                title="No verified scored context yet"\n                description="Scored context appears once the durable verified pipeline has eligible events."\n              />\n            )}\n          </div>'''
          if old not in text:
              raise SystemExit("workspace anchor missing")
          text = text.replace(old, new, 1)
          workspace.write_text(text)

          test = Path("src/__tests__/b2-public-data-parity-static.test.ts")
          text = test.read_text()
          text = text.replace(
              'expect(source).toContain("latestVerifiedScored");',
              'expect(source).toContain("verifiedRiskContext");\n    expect(source).toContain("const topRisks = [...currentScored]");',
              1,
          )
          test.write_text(text)
          PY

      - name: Commit semantic parity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "geomacro-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/use-intelligence.ts src/components/institutional/workspace.tsx src/__tests__/b2-public-data-parity-static.test.ts
          git commit -m "fix: separate current risk from verified B2 context"
          git push origin HEAD:fix/b2-data-parity-20261003
