name: World Bank PPG Global Shadow Census

on:
  push:
    branches:
      - feat/ppg-production-fiscal-fallback
    paths:
      - "scripts/audit-world-bank-ppg-debt-stock-ratio.mjs"
      - "scripts/audit-world-bank-ppg-sovereign-fiscal-shadow.ts"
      - "scripts/global-risk-gate-country-ppg-shadow-census.ts"
      - "src/lib/risk-gate-v2-world-bank-ppg-sovereign-fiscal.ts"
      - ".github/workflows/world-bank-ppg-global-shadow-census.yml"
  pull_request:
    paths:
      - "scripts/audit-world-bank-ppg-debt-stock-ratio.mjs"
      - "scripts/audit-world-bank-ppg-sovereign-fiscal-shadow.ts"
      - "scripts/global-risk-gate-country-ppg-shadow-census.ts"
      - "src/lib/risk-gate-v2-world-bank-ppg-sovereign-fiscal.ts"
      - ".github/workflows/world-bank-ppg-global-shadow-census.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-bank-ppg-global-shadow-census-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-shadow-census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORLD_BANK_PPG_RATIO_OUTPUT: world-bank-ppg-debt-stock-ratio.json
      WORLD_BANK_PPG_SHADOW_OUTPUT: world-bank-ppg-sovereign-fiscal-shadow.json
      GLOBAL_RISK_GATE_PPG_SHADOW_CENSUS_OUTPUT: global-risk-gate-country-ppg-shadow-census.json
      GLOBAL_RISK_GATE_PPG_SHADOW_TARGET_COUNTRIES: "100"
      GLOBAL_RISK_GATE_CENSUS_CONCURRENCY: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate authoritative production read target
        run: node scripts/db/assert-authoritative-supabase.mjs

      - name: Reproduce World Bank PPG derived coverage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-world-bank-ppg-debt-stock-ratio.mjs | tee world-bank-ppg-debt-stock-ratio.log
          grep -q 'PASS: WORLD BANK PPG EXTERNAL DEBT STOCK RATIO AUDIT COMPLETE - NO WRITES' world-bank-ppg-debt-stock-ratio.log

      - name: Build source-specific sovereign-fiscal shadow states
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-world-bank-ppg-sovereign-fiscal-shadow.ts | tee world-bank-ppg-sovereign-fiscal-shadow.log
          grep -q 'PASS: WORLD BANK PPG SOVEREIGN-FISCAL SHADOW REACHES 100 COUNTRIES - NO PRODUCTION CHANGES' world-bank-ppg-sovereign-fiscal-shadow.log

      - name: Run full four-module country shadow census
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/global-risk-gate-country-ppg-shadow-census.ts --require-target | tee global-risk-gate-country-ppg-shadow-census.log
          grep -q 'PASS: GLOBAL PPG SHADOW COUNTRY CENSUS COMPLETE - NO PRODUCTION CHANGES' global-risk-gate-country-ppg-shadow-census.log

      - name: Enforce 100-country and no-production-change boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.writes_performed == false' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.summary.shadow_accepted_country_count >= 100' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.summary.target_reached == true' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.shadow_only == true' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.production_activation_allowed == false' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.production_country_payability_changed == false' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.production_scoring_changed == false' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.base_mainnet_gate_changed == false' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.execution_authorized_is_false == true' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.ppg_external_debt_not_relabelled_as_total_government_debt == true' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.claim_boundary.no_raw_cross_source_value_pooling == true' global-risk-gate-country-ppg-shadow-census.json >/dev/null

      - name: Upload sanitized shadow census evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-bank-ppg-global-shadow-census
          path: |
            world-bank-ppg-debt-stock-ratio.json
            world-bank-ppg-debt-stock-ratio.log
            world-bank-ppg-sovereign-fiscal-shadow.json
            world-bank-ppg-sovereign-fiscal-shadow.log
            global-risk-gate-country-ppg-shadow-census.json
            global-risk-gate-country-ppg-shadow-census.log
          if-no-files-found: warn
          retention-days: 30
