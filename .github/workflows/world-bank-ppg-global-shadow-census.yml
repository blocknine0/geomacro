name: World Bank PPG Supabase-Free Source Shadow Census

on:
  push:
    branches:
      - feat/ppg-production-fiscal-fallback
    paths:
      - "scripts/audit-world-bank-ppg-debt-stock-ratio.mjs"
      - "scripts/audit-world-bank-ppg-sovereign-fiscal-shadow.ts"
      - "scripts/global-risk-gate-country-ppg-shadow-census.ts"
      - "scripts/ops/world-bank-ppg-supabase-free-source-census.mjs"
      - "src/lib/risk-gate-v2-world-bank-ppg-sovereign-fiscal.ts"
      - ".github/workflows/world-bank-ppg-global-shadow-census.yml"
  pull_request:
    paths:
      - "scripts/audit-world-bank-ppg-debt-stock-ratio.mjs"
      - "scripts/audit-world-bank-ppg-sovereign-fiscal-shadow.ts"
      - "scripts/global-risk-gate-country-ppg-shadow-census.ts"
      - "scripts/ops/world-bank-ppg-supabase-free-source-census.mjs"
      - "src/lib/risk-gate-v2-world-bank-ppg-sovereign-fiscal.ts"
      - ".github/workflows/world-bank-ppg-global-shadow-census.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-bank-ppg-global-shadow-census-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-only-census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      WORLD_BANK_PPG_RATIO_OUTPUT: world-bank-ppg-debt-stock-ratio.json
      WORLD_BANK_PPG_SHADOW_OUTPUT: world-bank-ppg-sovereign-fiscal-shadow.json
      GLOBAL_RISK_GATE_PPG_SHADOW_CENSUS_OUTPUT: global-risk-gate-country-ppg-shadow-census.json
      GLOBAL_RISK_GATE_PPG_SHADOW_TARGET_COUNTRIES: "100"
      GLOBAL_RISK_GATE_CENSUS_CONCURRENCY: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prove source-only path has no Supabase credential
        env:
          SUPABASE_DB_URL: ""
          SUPABASE_URL: ""
          APP_SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          APP_SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL}${SUPABASE_URL}${APP_SUPABASE_URL}${SUPABASE_SERVICE_ROLE_KEY}${APP_SUPABASE_SERVICE_ROLE_KEY}"
          node --check scripts/ops/world-bank-ppg-supabase-free-source-census.mjs

      - name: Reproduce World Bank PPG derived coverage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-world-bank-ppg-debt-stock-ratio.mjs | tee world-bank-ppg-debt-stock-ratio.log
          grep -q 'PASS: WORLD BANK PPG EXTERNAL DEBT STOCK RATIO AUDIT COMPLETE - NO WRITES' world-bank-ppg-debt-stock-ratio.log

      - name: Build source-specific sovereign-fiscal shadow states
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/audit-world-bank-ppg-sovereign-fiscal-shadow.ts | tee world-bank-ppg-sovereign-fiscal-shadow.log
          grep -q 'PASS: WORLD BANK PPG SOVEREIGN-FISCAL SHADOW REACHES 100 COUNTRIES - NO PRODUCTION CHANGES' world-bank-ppg-sovereign-fiscal-shadow.log

      - name: Check real PPG fiscal country coverage without asserting missing Risk Gate modules
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ops/world-bank-ppg-supabase-free-source-census.mjs | tee global-risk-gate-country-ppg-shadow-census.log
          grep -q 'PASS: WORLD BANK PPG SUPABASE-FREE SOURCE-ONLY COUNTRY CENSUS - NO PRODUCTION CHANGES' global-risk-gate-country-ppg-shadow-census.log

      - name: Enforce 100-country fiscal-only target and no false four-module readiness
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema=="geomacro.ppg-supabase-free-source-shadow-census.v1"' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.country_count==195 and .ppg_fiscal_shadow_countries>=100 and .source_only_target_reached==true' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.four_module_accepted_country_count==null and .four_module_country_census_status=="NOT_ASSESSED_MISSING_INDEPENDENT_NON_SUPABASE_MODULE_SNAPSHOTS"' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.shadow_only==true and .production_activation_allowed==false and .production_country_payability_changed==false and .scoring_production_changed==false and .x402_chargeable==false' global-risk-gate-country-ppg-shadow-census.json >/dev/null
          jq -e '.supabase_connections==0 and .b2_gets==0 and .d1_writes==0 and .usdc_spent==0' global-risk-gate-country-ppg-shadow-census.json >/dev/null

      - name: Upload sanitized shadow census evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: world-bank-ppg-global-shadow-census
          path: |
            world-bank-ppg-debt-stock-ratio.json
            world-bank-ppg-debt-stock-ratio.log
            world-bank-ppg-sovereign-fiscal-shadow.json
            world-bank-ppg-sovereign-fiscal-shadow.log
            global-risk-gate-country-ppg-shadow-census.json
            global-risk-gate-country-ppg-shadow-census.log
          if-no-files-found: warn
          retention-days: 30
