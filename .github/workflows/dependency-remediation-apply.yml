name: Dependency Remediation Apply

on:
  push:
    branches:
      - "fix/security-dependabot-all"
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/security-dependabot-all
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Regenerate canonical lockfile
        run: bun install

      - name: Require high and moderate dependency findings to be gone
        shell: bash
        run: |
          set +e
          bun audit 2>&1 | tee dependency-audit-after-overrides.txt
          code=${PIPESTATUS[0]}
          set -e
          if grep -Eq '^toml@|^stream-json@| high: | moderate: ' dependency-audit-after-overrides.txt; then
            echo "::error title=Remediation incomplete::High or moderate dependency advisories remain after overrides."
            exit 1
          fi
          if [[ "$code" -ne 0 ]]; then
            if ! grep -Fq 'elliptic@6.6.1' dependency-audit-after-overrides.txt || ! grep -Fq '1 vulnerability (1 low)' dependency-audit-after-overrides.txt; then
              echo "::error title=Unexpected residual advisory::Only the upstream-unpatched elliptic low advisory is temporarily permitted."
              exit 1
            fi
          fi

      - name: Validate application after transitive overrides
        shell: bash
        run: |
          set -euo pipefail
          bunx vitest run src/__tests__/risk-gate-api-parser.test.ts src/__tests__/risk-gate-api-hardening.test.ts src/__tests__/risk-gate-runtime-fail-closed.test.ts src/__tests__/risk-gate-verification-fail-closed.test.ts src/__tests__/risk-supabase-timeout.test.ts
          bun run db:safety
          bun run build

      - name: Commit regenerated Bun lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches the remediated graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "security(deps): refresh Bun lock for patched transitives"
          git push origin HEAD:fix/security-dependabot-all
