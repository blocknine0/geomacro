name: Production Website Health

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-website-health.yml"
      - "server/middleware/05-retire-public-testnet-surfaces.ts"
      - "server/api/public/global-risk.get.ts"
      - "server/api/public/risk-indices.get.ts"
      - "server/api/public/intelligence.get.ts"
      - "src/lib/global-risk-edge.server.ts"
      - "src/lib/risk-indices-edge.server.ts"
      - "src/lib/global-risk-continuity.ts"
      - "src/lib/risk-indices-from-global-risk.ts"
      - "src/lib/public-intelligence-production.server.ts"
      - "src/lib/use-global-risk.ts"
      - "src/lib/use-risk-indices.ts"
      - "src/lib/use-intelligence.ts"
      - "src/routes/intelligence.tsx"
      - "src/routes/pricing.tsx"
      - "src/routes/institutional.tsx"
      - "src/routes/risk-gate.tsx"
      - "src/components/home/commercial-home.tsx"
      - "src/components/ask/ask-workspace.tsx"
      - "config/commercial-route-disposition.json"
      - "public/llms.txt"
      - "scripts/ops/publish-b2-public-intelligence-direct-postgres.mjs"
      - "scripts/ops/republish-b2-public-intelligence-scored-only.mjs"
      - "scripts/ops/sync-fastlane-scored-intelligence.mjs"
      - "scripts/ops/publish-b2-global-risk-direct-postgres.mjs"
      - "scripts/ops/publish-b2-risk-indices-direct-postgres.mjs"
      - ".github/workflows/gri-realtime-direct-postgres.yml"
      - ".github/workflows/risk-indices-realtime-direct-postgres.yml"
      - "src/__tests__/production-website-health-current-intelligence-static.test.ts"
      - "src/__tests__/global-risk-lock-production-health.test.ts"
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-production-website-health
  cancel-in-progress: true

jobs:
  public-production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_URL: https://geomacro.live
      GLOBAL_RISK_EDGE_URL: https://geomacro-global-risk.daspallab202391.workers.dev/global-risk
      RISK_INDICES_EDGE_URL: https://geomacro-risk-indices.daspallab202391.workers.dev/risk-indices
    steps:
      - name: Checkout canonical main acceptance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify locked production presentation and product truth
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Three risks. Three separate indices.' src/components/gri/global-risk-domain-indices.tsx
          grep -Fq 'Score dates remain the original verified evidence times.' src/routes/intelligence.tsx
          grep -Fq 'Feed refreshed ' src/routes/intelligence.tsx
          grep -Fq 'Ask Geomacro' src/components/ask/ask-workspace.tsx
          grep -Fq 'Global risk intelligence for humans and machines' src/components/home/commercial-home.tsx

          grep -Fq '0.05' src/routes/pricing.tsx
          grep -Fq 'USDC / successful delivery' src/routes/pricing.tsx
          grep -Fq 'first 20,000' src/routes/pricing.tsx
          grep -Fq 'No-charge failure boundary' src/routes/pricing.tsx
          grep -Fq 'real-money access remains fail-closed until separately authorized for production' src/routes/pricing.tsx

          grep -Fq 'COMMERCIAL RISK INTELLIGENCE' src/routes/institutional.tsx
          grep -Fq 'Risk Gate' src/routes/risk-gate.tsx
          grep -Fq '"classification": "PRODUCTION", "status": "LIVE"' config/commercial-route-disposition.json
          grep -Fq 'Risk API: PRIVATE PILOT' public/llms.txt
          grep -Fq 'Risk Gate: PRIVATE PILOT' public/llms.txt
          grep -Fq 'execution_authorized=false' public/llms.txt

          python - <<'PY'
          from pathlib import Path
          budgets = {
              "src/routes/pricing.tsx": 14000,
              "src/routes/institutional.tsx": 22000,
              "src/components/home/commercial-home.tsx": 26000,
              "src/components/ask/ask-workspace.tsx": 18000,
          }
          for path, maximum in budgets.items():
              size = len(Path(path).read_text(encoding="utf-8"))
              if size > maximum:
                  raise SystemExit(f"COMMERCIAL_COPY_SURFACE_BUDGET_EXCEEDED:{path}:{size}>{maximum}")
          print("PASS: commercial presentation source budgets remain bounded.")
          PY

      - name: Verify live build marker matches canonical main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/.well-known/geomacro-build.json")"
          cat "$body"
          echo
          if [[ "$code" != "200" ]]; then
            echo "::error title=Live build marker unavailable::Expected HTTP 200 from /.well-known/geomacro-build.json, got $code."
            exit 1
          fi
          node - "$body" <<'NODE'
          const fs = require('fs');
          const marker = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = String(process.env.EXPECTED_SHA ?? '').trim().toLowerCase();
          const observed = String(marker?.canonical_main_sha ?? '').trim().toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(expected)) throw new Error('EXPECTED_CANONICAL_SHA_INVALID');
          if (marker?.schema_version !== 'geomacro.deployment-build.v1') throw new Error('LIVE_BUILD_MARKER_SCHEMA_MISMATCH');
          if (marker?.canonical_repository !== 'blocknine0/geomacro') throw new Error('LIVE_BUILD_MARKER_REPOSITORY_MISMATCH');
          if (marker?.production_activation_performed !== false) throw new Error('LIVE_BUILD_MARKER_ACTIVATION_BOUNDARY_INVALID');
          if (observed !== expected) throw new Error(`LIVE_DEPLOYMENT_SHA_MISMATCH:expected=${expected}:observed=${observed || 'missing'}`);
          console.log(JSON.stringify({ok:true,canonical_main_sha:observed}));
          NODE

      - name: Verify B2 production serving health
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/health?deep=1")"
          cat "$body"
          echo
          if [[ "$code" != "200" ]]; then
            echo "::error title=Production data serving unavailable::Expected HTTP 200 from canonical /api/health?deep=1 B2 readiness check, got $code."
            exit 1
          fi
          for marker in \
            '"ok":true' \
            '"serving_authority":"backblaze-b2"' \
            '"supabase_required_for_serving":false' \
            '"b2_runtime_configured":true' \
            '"intelligence_ready":true' \
            '"risk_indices_ready":true' \
            '"risk_verification_status":"verified"'
          do
            grep -Fq "$marker" "$body"
          done

      - name: Verify production alignment contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/health")"
          if [[ "$code" != "200" ]]; then
            echo "::error title=Health endpoint unavailable::Expected HTTP 200 from /api/health, got $code."
            cat "$body"
            exit 1
          fi
          for marker in \
            '"alignment_contract":"github-main-b2-primary-supabase-standby-lovable-v2"' \
            '"production_data_authority":"backblaze-b2"' \
            '"production_data_runtime_configured":true' \
            '"commerce_control_plane":"cloudflare-durable-objects"' \
            '"supabase_role":"ingestion-recovery-standby"'
          do
            grep -Fq "$marker" "$body"
          done

      - name: Verify independent Global Risk and Risk Indices edges
        shell: bash
        run: |
          set -euo pipefail
          global_edge="$(mktemp)"
          global_headers="$(mktemp)"
          global_code="$(curl -sS -D "$global_headers" -o "$global_edge" -w '%{http_code}' --max-time 20 "$GLOBAL_RISK_EDGE_URL")"
          test "$global_code" = "200" || { echo "Global Risk edge HTTP $global_code"; cat "$global_edge"; exit 1; }
          grep -qi '^x-geomacro-authority: backblaze-b2-verified-edge' "$global_headers"
          grep -Fq '"schema":"geomacro.public-global-risk-live.v1"' "$global_edge"

          indices_edge="$(mktemp)"
          indices_headers="$(mktemp)"
          indices_code="$(curl -sS -D "$indices_headers" -o "$indices_edge" -w '%{http_code}' --max-time 20 "$RISK_INDICES_EDGE_URL")"
          test "$indices_code" = "200" || { echo "Risk Indices edge HTTP $indices_code"; cat "$indices_edge"; exit 1; }
          grep -qi '^x-geomacro-authority: backblaze-b2-risk-indices-edge' "$indices_headers"
          grep -Fq '"schema":"geomacro.public-risk-indices-live.v1"' "$indices_edge"

          if cmp -s "$global_edge" "$indices_edge"; then
            echo "::error::Global Risk and Risk Indices edges unexpectedly returned the same serving package."
            exit 1
          fi

      - name: Verify public production APIs and current Intelligence contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production-website-health
          intel="/tmp/production-website-health/intelligence.json"
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          intel_code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -o "$intel" -w '%{http_code}' \
            "$BASE_URL/api/public/intelligence?production_health=${nonce}")"
          if [[ "$intel_code" != "200" ]]; then
            echo "::error title=Public intelligence API unavailable::Expected HTTP 200, got $intel_code."
            cat "$intel"
            exit 1
          fi
          node - "$intel" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(body?.rows) ? body.rows : [];
          const required = ['geopolitics', 'macro', 'rare_earth'];
          const requiredSet = new Set(required);
          const latestScored = new Map();
          let verified = 0;
          let live = 0;
          let newestLive = -Infinity;
          let ok = body?.ok === true && rows.length > 0;
          const now = Date.now();
          const dayMs = 24 * 60 * 60 * 1000;
          const futureToleranceMs = 5 * 60 * 1000;
          for (const row of rows) {
            const category = String(row?.category ?? '');
            const title = String(row?.source_title ?? '');
            if ('source_name' in row || 'source_domain' in row || 'source_url' in row) ok = false;
            if (row?.public_status === 'verified_b2') {
              verified++;
              const severity = Number(row?.severity);
              const timestamp = Date.parse(String(row?.published_at ?? row?.created_at ?? ''));
              if (!Number.isFinite(severity) || severity < 0 || severity > 100 || !title.startsWith('Geomacro finds ')) ok = false;
              if (!Number.isFinite(timestamp) || timestamp > now + futureToleranceMs) ok = false;
              if (requiredSet.has(category) && Number.isFinite(timestamp)) {
                latestScored.set(category, Math.max(latestScored.get(category) ?? -Infinity, timestamp));
              }
            } else if (row?.public_status === 'live_observed') {
              live++;
              if (category !== 'geopolitics' || row?.severity !== null || row?.delta !== null || !title.startsWith('Geomacro observes ')) ok = false;
              const timestamp = Date.parse(String(row?.published_at ?? row?.created_at ?? ''));
              if (!Number.isFinite(timestamp) || timestamp > now + futureToleranceMs) ok = false;
              else newestLive = Math.max(newestLive, timestamp);
            } else {
              ok = false;
            }
          }
          for (const category of required) if (!latestScored.has(category)) ok = false;
          const scoredCurrentAcrossAllDomains = required.every((category) => {
            const timestamp = latestScored.get(category) ?? -Infinity;
            return Number.isFinite(timestamp) && timestamp <= now + futureToleranceMs && now - timestamp <= dayMs;
          });
          if (Number(body?.verified_rows) !== verified || Number(body?.live_observed_rows) !== live) ok = false;
          if (body?.current_within_24h !== true) ok = false;
          if (scoredCurrentAcrossAllDomains) {
            if (body?.mode !== 'verified_b2' || live !== 0) ok = false;
          } else {
            if (body?.mode !== 'verified_b2_plus_live_observed' || live < 1) ok = false;
            if (!Number.isFinite(newestLive) || newestLive > now + futureToleranceMs || now - newestLive > dayMs) ok = false;
          }
          if (!ok) {
            console.error(JSON.stringify({
              error: 'PUBLIC_INTELLIGENCE_CURRENT_CONTRACT_INVALID',
              mode: body?.mode ?? null,
              verified_rows: body?.verified_rows ?? null,
              live_observed_rows: body?.live_observed_rows ?? null,
              newest_at: body?.newest_at ?? null,
              current_within_24h: body?.current_within_24h ?? null,
              scored_current_across_all_domains: scoredCurrentAcrossAllDomains,
              latest_scored_at: Object.fromEntries(required.map((category) => [
                category,
                Number.isFinite(latestScored.get(category)) ? new Date(latestScored.get(category)).toISOString() : null,
              ])),
            }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            ok: true,
            mode: body.mode,
            newest_at: body.newest_at ?? null,
            verified_rows: verified,
            live_observed_rows: live,
            scored_current_across_all_domains: scoredCurrentAcrossAllDomains,
            latest_scored_at: Object.fromEntries(required.map((category) => [
              category,
              Number.isFinite(latestScored.get(category)) ? new Date(latestScored.get(category)).toISOString() : null,
            ])),
          }));
          NODE

          global_risk="$(mktemp)"
          global_risk_code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$global_risk" -w '%{http_code}' "$BASE_URL/api/public/global-risk")"
          if [[ "$global_risk_code" != "200" ]]; then
            echo "::error title=Public Global Risk API unavailable::Expected HTTP 200, got $global_risk_code."
            cat "$global_risk"
            exit 1
          fi
          grep -Fq '"ok":true' "$global_risk"
          grep -Fq '"verificationStatus":"verified"' "$global_risk"
          grep -Fq '"authority":"backblaze-b2-verified-edge"' "$global_risk"

          risk="$(mktemp)"
          risk_code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$risk" -w '%{http_code}' "$BASE_URL/api/public/risk-indices")"
          if [[ "$risk_code" != "200" ]]; then
            echo "::error title=Public Risk Indices API unavailable::Expected HTTP 200, got $risk_code."
            cat "$risk"
            exit 1
          fi
          grep -Fq '"ok":true' "$risk"
          grep -Fq '"verificationStatus":"verified"' "$risk"
          grep -Fq '"authority":"backblaze-b2-risk-indices-edge"' "$risk"

          ask="$(mktemp)"
          ask_code="$(curl -L --retry 2 --retry-all-errors --retry-delay 2 -sS -H 'Accept: application/json' -H 'Origin: https://geomacro.live' -H 'X-Geomacro-Question: What changed in the risk indices?' -o "$ask" -w '%{http_code}' "$BASE_URL/api/public-ask")"
          if [[ "$ask_code" != "200" ]]; then
            echo "::error title=Ask Geomacro functional probe failed::Expected HTTP 200, got $ask_code."
            cat "$ask"
            exit 1
          fi
          grep -Fq '"ok":true' "$ask"

      - name: Verify Ask Geomacro mobile rendering contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          decoded="$(mktemp)"
          code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS \
            -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1' \
            -o "$body" -w '%{http_code}' "$BASE_URL/ask-geomacro")"
          test "$code" = "200" || { echo "::error title=Ask mobile route unavailable::HTTP $code"; head -c 1000 "$body" || true; exit 1; }
          ! grep -Fq "This page didn't load" "$body" || { echo "::error title=Ask mobile route rendered error boundary::/ask-geomacro"; exit 1; }
          python - "$body" "$decoded" <<'PY'
          import html
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          pathlib.Path(sys.argv[2]).write_text(html.unescape(source), encoding='utf-8')
          PY
          grep -Fq 'Ask Geomacro' "$decoded"
          rm -f "$body" "$decoded"

      - name: Upload production Intelligence diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: production-intelligence-health-${{ github.run_id }}
          path: /tmp/production-website-health/intelligence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify rendered production page markers
        shell: bash
        run: |
          set -euo pipefail
          routes="$(cat <<'EOF'
          /|Global risk intelligence
          /intelligence|Risk Intelligence
          /global-risk|Geomacro Global Risk
          /risk-indices|Geomacro Risk Indices
          /ask-geomacro|Ask Geomacro
          /data-api|GOVERNED DATA
          /pricing|Access & pricing
          /institutional|COMMERCIAL RISK INTELLIGENCE
          /risk-gate|Risk Gate
          /ecosystem|Ecosystem & partnerships
          /research|Research & methodology
          /docs|Geomacro public documentation
          /about|About & trust
          /roadmap|What works today, and what comes next.
          /contact|Bring the workflow.
          /testnet-access|GOVERNED DATA
          /testnet-console|GOVERNED DATA
          /demo|Agentic Commerce Demo
          /pipeline|Intelligence Pipeline
          /onchain|Arc / Onchain
          EOF
          )"

          while IFS='|' read -r path marker; do
            path="$(printf '%s' "$path" | xargs)"
            marker="$(printf '%s' "$marker" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "$path" ]] && continue
            body="$(mktemp)"
            decoded="$(mktemp)"
            code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' "$BASE_URL$path")"
            if [[ "$code" != "200" ]]; then
              echo "::error title=Production page unavailable::$path returned HTTP $code"
              head -c 1000 "$body" || true
              exit 1
            fi
            if grep -Fq "This page didn't load" "$body"; then
              echo "::error title=Production route rendered error boundary::$path returned HTTP 200 but rendered the root error page."
              exit 1
            fi
            python - "$body" "$decoded" <<'PY'
          import html
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          pathlib.Path(sys.argv[2]).write_text(html.unescape(source), encoding="utf-8")
          PY
            if ! grep -Fq "$marker" "$decoded"; then
              echo "::error title=Production route content missing::$path returned HTTP 200 but did not render expected marker: $marker"
              exit 1
            fi
            rm -f "$body" "$decoded"
          done <<< "$routes"
