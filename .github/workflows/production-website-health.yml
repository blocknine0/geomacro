name: Production Website Health

# Manual-only diagnostics for the legacy signed Intelligence / GRI / Risk Indices
# products. This is NOT the free website launch gate. Free-source acceptance
# and current permanent Finds are verified by Minimum Free Derived Production
# Health (No Funds); legacy signed proofs are not required for that product.
on:
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  # Manual diagnostics must not cancel one another; this workflow is not
  # scheduled or run on ordinary pushes.
  group: geomacro-production-website-health-manual
  cancel-in-progress: false

jobs:
  public-production-smoke:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'blocknine0/geomacro' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha != '' &&
        (github.event.workflow_run.event == 'workflow_dispatch' ||
         github.event.workflow_run.event == 'repository_dispatch' ||
         (github.event.workflow_run.name == 'Risk Indices from Verified D1 Global Risk (No Funds)' &&
          github.event.workflow_run.event == 'workflow_run'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://geomacro.live
      GLOBAL_RISK_EDGE_URL: https://geomacro-global-risk.daspallab202391.workers.dev/global-risk
      RISK_INDICES_EDGE_URL: https://geomacro-risk-indices.daspallab202391.workers.dev/risk-indices
      CONTROL_PLANE_URL: https://geomacro-control-plane.daspallab202391.workers.dev
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Admit only trusted successful signed-publisher ancestor of checked-out main
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          TRUSTED_PUBLISHER_PARENT_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_PUBLISHER_PARENT_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRUSTED_PUBLISHER_PARENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRUSTED_PUBLISHER_PARENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRUSTED_PUBLISHER_PARENT_EVENT: ${{ github.event.workflow_run.event }}
          TRUSTED_PUBLISHER_PARENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          node --test scripts/ops/assert-website-publication-followup.test.mjs
          node scripts/ops/assert-website-publication-followup.mjs

      - name: Verify checked-out website lock on exact candidate SHA
        run: node scripts/ops/verify-website-lock.mjs

      - name: Verify exact-source customer truth contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const timestamp = event.publishedAt ?? event.createdAt;' src/components/intelligence/card.tsx
          grep -Fq 'function latestOriginalEvidenceAt(rows: IntelEvent[]): number | null' src/lib/use-intelligence.ts
          grep -Fq 'initialData ? latestOriginalEvidenceAt(initialData.all) : null' src/lib/use-intelligence.ts
          grep -Fq 'setUpdatedAt(latestOriginalEvidenceAt(next.all));' src/lib/use-intelligence.ts
          grep -Fq 'isCurrent: originalEvidenceTime(row) >= now - DAY' src/lib/use-intelligence.ts
          if grep -Fq 'isCurrent: timeOf(row) >= now - DAY' src/lib/use-intelligence.ts; then
            echo '::error::Database restore time must not qualify current scored news'
            exit 1
          fi
          if grep -Fq 'setUpdatedAt(Date.now())' src/lib/use-intelligence.ts; then
            echo "::error title=Browser refresh time leaked into Intelligence freshness::useIntelligence must display production evidence time."
            exit 1
          fi
          grep -Fq 'Earlier assessments retain their original dates.' src/routes/intelligence.tsx
          grep -Fq 'Geomacro Store' src/routes/pricing.tsx
          grep -Fq 'LowBarrierPricing' src/routes/pricing.tsx
          if grep -Fq '<CapabilityPriceSchedule />' src/routes/pricing.tsx; then
            echo '::error::Deferred structured product catalog must not appear on the public pricing page'
            exit 1
          fi
          grep -Fq 'ApiKeysNotice' src/routes/pricing.tsx
          grep -Fq 'CategoryApiPricing' src/routes/pricing.tsx
          grep -Fq 'redirect({ to: "/pricing", replace: true })' src/routes/data-api.tsx
          grep -Fq 'GEOMACRO_CAPABILITY_PRICES.intelligence_query' src/components/category-api-pricing.tsx
          grep -Fq 'There is no category surcharge.' src/components/category-api-pricing.tsx
          grep -Fq 'Self-service access and checkout are not open yet.' src/components/api-keys-notice.tsx
          grep -Fq 'Coming soon' src/components/api-keys-notice.tsx
          grep -Fq 'Each exact request must qualify before payment.' src/components/capability-price-schedule.tsx
          grep -Fq 'Enquire about this product' src/components/capability-price-schedule.tsx
          grep -Fq 'Risk Gate, paid agent/x402 production access and broader machine delivery remain roadmap or controlled capabilities until separately promoted.' src/routes/institutional.tsx
          echo "PASS: evidence-time and commercial-truth source contracts match the exact checked-out SHA."

      - name: Verify locked production presentation and product truth
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Three risks. Three separate indices.' src/components/gri/global-risk-domain-indices.tsx
          grep -Fq 'Earlier assessments retain their original dates.' src/routes/intelligence.tsx
          # Published UI shows the SOURCE evidence clock. A browser poll or B2
          # restore must not move the displayed event publication time.
          grep -Fq 'Latest original evidence ' src/routes/intelligence.tsx
          if grep -Fq 'Monitoring updated ' src/routes/intelligence.tsx; then
            echo '::error::Monitoring/restore clock masqueraded as original event time'
            exit 1
          fi
          grep -Fq 'Ask Geomacro' src/components/ask/ask-workspace.tsx
          grep -Fq 'Follow what matters to you' src/components/home/commercial-home.tsx

          grep -Fq 'LowBarrierPricing' src/routes/pricing.tsx
          grep -Fq 'GEOMACRO_CAPABILITY_PRICES' src/components/capability-price-schedule.tsx
          grep -Fq 'GEOMACRO_PUBLIC_PRICING_GROUPS' src/components/capability-price-schedule.tsx
          grep -Fq 'redirect({ to: "/pricing", replace: true })' src/routes/data-api.tsx
          grep -Fq 'Unavailable, stale or unqualified results are not chargeable.' src/components/capability-price-schedule.tsx
          grep -Fq 'A displayed price is not an available payment quote.' src/components/capability-price-schedule.tsx

          grep -Fq 'For teams' src/routes/institutional.tsx
          grep -Fq 'Risk Gate' src/routes/risk-gate.tsx
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('config/commercial-route-disposition.json', 'utf8'));
          const live = manifest?.routes?.['/'];
          if (live?.classification !== 'PRODUCTION' || live?.status !== 'LIVE') {
            throw new Error('COMMERCIAL_ROUTE_DISPOSITION_ROOT_NOT_LIVE');
          }
          NODE
          grep -Fq 'Risk API: PRIVATE PILOT' public/llms.txt
          grep -Fq 'Risk Gate: PRIVATE PILOT' public/llms.txt
          grep -Fq 'execution_authorized=false' public/llms.txt

          python - <<'PY'
          from pathlib import Path
          budgets = {
              "src/routes/pricing.tsx": 14000,
              "src/routes/institutional.tsx": 22000,
              "src/components/home/commercial-home.tsx": 26000,
              "src/components/ask/ask-workspace.tsx": 18000,
          }
          for path, maximum in budgets.items():
              size = len(Path(path).read_text(encoding="utf-8"))
              if size > maximum:
                  raise SystemExit(f"COMMERCIAL_COPY_SURFACE_BUDGET_EXCEEDED:{path}:{size}>{maximum}")
          print("PASS: commercial presentation source budgets remain bounded.")
          PY

      - name: Verify live build marker matches canonical main
        # Exact main SHA is required for website-affecting changes. Verified
        # backend/workflow/test-only commits do not rebuild or alter the UI bundle.
        # Preserve fail-closed behavior if the ancestry or path diff is untrusted.
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ops/verify-live-web-source-marker.test.mjs
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::EXPECTED_CANONICAL_SHA_INVALID"; exit 1; }
          mkdir -p /tmp/production-website-health
          body="/tmp/production-website-health/build-marker.json"
          matched=false
          last_code=""
          last_observed="missing"
          for attempt in $(seq 1 8); do
            last_code="$(curl -L --retry 2 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' "$BASE_URL/.well-known/geomacro-build.json" || true)"
            if [[ "$last_code" == "200" ]]; then
              if node - "$body" <<'NODE'
          const fs = require('fs');
          const marker = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = String(process.env.EXPECTED_SHA ?? '').trim().toLowerCase();
          const observed = String(marker?.canonical_main_sha ?? '').trim().toLowerCase();
          if (marker?.schema_version !== 'geomacro.deployment-build.v1') throw new Error('LIVE_BUILD_MARKER_SCHEMA_MISMATCH');
          if (marker?.canonical_repository !== 'blocknine0/geomacro') throw new Error('LIVE_BUILD_MARKER_REPOSITORY_MISMATCH');
          if (marker?.production_activation_performed !== false) throw new Error('LIVE_BUILD_MARKER_ACTIVATION_BOUNDARY_INVALID');
          if (observed !== expected) {
            const { spawnSync } = require('node:child_process');
            const check = spawnSync(process.execPath,
              ['scripts/ops/verify-live-web-source-marker.mjs', observed, expected],
              { encoding: 'utf8' });
            if (check.stdout) process.stdout.write(check.stdout);
            if (check.stderr) process.stderr.write(check.stderr);
            process.exitCode = check.status ?? 11;
          } else {
            console.log(JSON.stringify({schema:'geomacro.live-web-source-marker-check.v1',
              status:'exact',expected_sha:expected,published_sha:observed,
              live_web_source_verified:true,publish_required:false}));
          }
          NODE
              then
                matched=true
                last_observed="$(node -e 'const fs=require("fs");try{const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(b?.canonical_main_sha||"missing"))}catch{process.stdout.write("invalid")}' "$body")"
                break
              else
                status=$?
                if [[ "$status" -ne 10 ]]; then
                  echo "::error title=Invalid live build marker::Marker contract failed independently of deployment propagation."
                  cat "$body"
                  exit "$status"
                fi
                last_observed="$(node -e 'const fs=require("fs");try{const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(b?.canonical_main_sha||"missing"))}catch{process.stdout.write("invalid")}' "$body")"
              fi
            fi
            if [[ "$attempt" -lt 8 ]]; then
              echo "Waiting for production deployment SHA: attempt $attempt/8 expected=$EXPECTED_SHA observed=$last_observed http=$last_code"
              sleep 15
            fi
          done
          if [[ "$matched" != "true" ]]; then
            cat "$body" || true
            echo "::error title=Lovable Publish required or incomplete::LIVE_DEPLOYMENT_SHA_MISMATCH:expected=$EXPECTED_SHA:observed=$last_observed:http=$last_code; mirror source parity alone is not a deployed site"
            exit 1
          fi
          if [[ "$last_observed" == "$EXPECTED_SHA" ]]; then
            echo "PASS: live build marker matches exact canonical main $EXPECTED_SHA."
          else
            echo "PASS: published website source $last_observed remains compatible with canonical main $EXPECTED_SHA; no website build inputs changed after the published SHA." 
          fi

      - name: Verify Lovable mirror source parity
        # Independent outside-in diagnostic: preserve fail-closed job status,
        # but do not hide this failure when an earlier release gate is red.
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.LOVABLE_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error title=Lovable mirror credential missing::Cannot prove mirror parity without LOVABLE_MIRROR_TOKEN."
            exit 1
          fi
          matched=false
          observed="missing"
          for attempt in $(seq 1 8); do
            encoded="$(gh api 'repos/blocknine0/geomacro-160c8e56/contents/.geomacro-canonical-main?ref=main' --jq '.content' 2>/dev/null || true)"
            if [[ -n "$encoded" ]]; then
              observed="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode 2>/dev/null | tr -d '\r\n' || true)"
            fi
            if [[ "${observed,,}" == "${EXPECTED_SHA,,}" ]]; then
              matched=true
              break
            fi
            if [[ "$attempt" -lt 8 ]]; then
              echo "Waiting for Lovable mirror parity: attempt $attempt/8 expected=$EXPECTED_SHA observed=${observed:-missing}"
              sleep 15
            fi
          done
          if [[ "$matched" != "true" ]]; then
            echo "::error title=Lovable mirror SHA mismatch::expected=$EXPECTED_SHA observed=${observed:-missing}"
            exit 1
          fi
          mkdir -p /tmp/production-website-health
          printf '%s\n' "$observed" > /tmp/production-website-health/lovable-mirror-sha.txt
          echo "PASS: Lovable mirror source marker matches exact canonical main $EXPECTED_SHA."

      - name: Verify B2 production serving health
        # Independent outside-in diagnostic: preserve fail-closed job status,
        # but do not hide this failure when an earlier release gate is red.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production-website-health
          body="/tmp/production-website-health/public-health.json"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/health?deep=1")"
          cat "$body"
          echo
          if [[ "$code" != "200" ]]; then
            echo "::error title=Production data serving unavailable::Expected HTTP 200 from canonical /api/health?deep=1 B2 readiness check, got $code."
            exit 1
          fi
          for marker in \
            '"ok":true' \
            '"serving_authority":"backblaze-b2-durable-truth-cloudflare-d1-verified-hot"' \
            '"supabase_required_for_serving":false' \
            '"b2_runtime_configured":true' \
            '"intelligence_ready":true' \
            '"global_risk_ready":true' \
            '"risk_indices_ready":true' \
            '"risk_verification_status":"verified"' \
            '"hot_snapshot_serving"' \
            '"serving_store":"cloudflare-d1"'
          do
            grep -Fq "$marker" "$body"
          done

      - name: Verify live D1 control plane and fail-closed auth
        # Independent outside-in diagnostic: preserve fail-closed job status,
        # but do not hide this failure when an earlier release gate is red.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production-website-health

          health="/tmp/production-website-health/d1-health.json"
          health_code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS             --max-time 15             -o "$health" -w '%{http_code}'             "$CONTROL_PLANE_URL/health")"
          if [[ "$health_code" != "200" ]]; then
            echo "::error title=D1 control plane unavailable::Expected HTTP 200 from $CONTROL_PLANE_URL/health, got $health_code."
            cat "$health" || true
            exit 1
          fi
          node - "$health" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (
            body?.ok!==true ||
            body?.store!=='d1' ||
            Number(body?.schema_version)<2 ||
            body?.durable_payload_store!=='b2' ||
            body?.commerce_ledger!=='durable_object'
          ) {
            console.error(JSON.stringify({error:'D1_PRODUCTION_HEALTH_INVALID',body},null,2));
            process.exit(1);
          }
          NODE

          denied="/tmp/production-website-health/d1-unauthorized.json"
          denied_code="$(curl -L --retry 2 --retry-all-errors --retry-delay 2 -sS             --max-time 15             -X PUT             -H 'content-type: application/json'             --data '{"value":{"section11_probe":true}}'             -o "$denied" -w '%{http_code}'             "$CONTROL_PLANE_URL/v1/control/section11-health-probe")"
          if [[ "$denied_code" != "401" ]]; then
            echo "::error title=D1 fail-closed boundary invalid::Unauthenticated mutation expected HTTP 401, got $denied_code."
            cat "$denied" || true
            exit 1
          fi
          grep -Fq '"ok":false' "$denied"
          grep -Fq '"error":"UNAUTHORIZED"' "$denied"
          echo "PASS: D1 serving is healthy and unauthenticated state mutation fails closed."

      - name: Verify production alignment contract
        # Independent outside-in diagnostic: preserve fail-closed job status,
        # but do not hide this failure when an earlier release gate is red.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/health")"
          if [[ "$code" != "200" ]]; then
            echo "::error title=Health endpoint unavailable::Expected HTTP 200 from /api/health, got $code."
            cat "$body"
            exit 1
          fi
          # Shallow health intentionally does not run bounded B2/D1 origin probes;
          # only the deep 200 gate above can attest current data readiness.
          for marker in \
            '"alignment_contract":"github-main-b2-primary-supabase-standby-lovable-v2"' \
            '"production_data_authority":"backblaze-b2"' \
            '"production_data_runtime_configured":null' \
            '"commerce_control_plane":"cloudflare-durable-objects"' \
            '"supabase_role":"ingestion-recovery-standby"'
          do
            grep -Fq "$marker" "$body"
          done

      - name: Verify independent Global Risk and Risk Indices edges
        # Independent outside-in diagnostic: preserve fail-closed job status,
        # but do not hide this failure when an earlier release gate is red.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          global_edge="$(mktemp)"
          global_headers="$(mktemp)"
          global_code="$(curl -sS -D "$global_headers" -o "$global_edge" -w '%{http_code}' --max-time 20 "$GLOBAL_RISK_EDGE_URL")"
          test "$global_code" = "200" || { echo "Global Risk edge HTTP $global_code"; cat "$global_edge"; exit 1; }
          grep -qi '^x-geomacro-authority: backblaze-b2-verified-edge' "$global_headers"
          grep -qi '^x-geomacro-serving-store: cloudflare-d1' "$global_headers"
          global_mode="$(awk -F': ' 'tolower($1)=="x-geomacro-verification-mode" {gsub("\\r","",$2); print $2}' "$global_headers" | tail -n1)"
          global_b2_verification="$(awk -F': ' 'tolower($1)=="x-geomacro-b2-verification" {gsub("\\r","",$2); print $2}' "$global_headers" | tail -n1)"
          case "$global_mode:$global_b2_verification" in
            direct-b2-readback:full-readback-hash-exact-restore) ;;
            independent-gri-proof-over-b2-baseline:baseline-full-readback-current-gri-proof) ;;
            *) echo "Global Risk verification mode invalid: $global_mode / $global_b2_verification"; exit 1 ;;
          esac
          grep -Eqi '^x-geomacro-b2-sha256: [0-9a-f]{64}' "$global_headers"
          grep -Eqi '^x-geomacro-d1-payload-sha256: [0-9a-f]{64}' "$global_headers"
          grep -Fq '"schema":"geomacro.public-global-risk-live.v1"' "$global_edge"

          indices_edge="$(mktemp)"
          indices_headers="$(mktemp)"
          indices_code="$(curl -sS -D "$indices_headers" -o "$indices_edge" -w '%{http_code}' --max-time 20 "$RISK_INDICES_EDGE_URL")"
          test "$indices_code" = "200" || { echo "Risk Indices edge HTTP $indices_code"; cat "$indices_edge"; exit 1; }
          grep -qi '^x-geomacro-authority: backblaze-b2-risk-indices-edge' "$indices_headers"
          grep -qi '^x-geomacro-serving-store: cloudflare-d1' "$indices_headers"
          grep -qi '^x-geomacro-b2-verification: full-readback-hash-exact-restore' "$indices_headers"
          grep -Eqi '^x-geomacro-b2-sha256: [0-9a-f]{64}' "$indices_headers"
          grep -Eqi '^x-geomacro-d1-payload-sha256: [0-9a-f]{64}' "$indices_headers"
          grep -Fq '"schema":"geomacro.public-risk-indices-live.v1"' "$indices_edge"

          if cmp -s "$global_edge" "$indices_edge"; then
            echo "::error::Global Risk and Risk Indices edges unexpectedly returned the same serving package."
            exit 1
          fi

      - name: Verify public production APIs and current Intelligence contract
        # Independent outside-in diagnostic: preserve fail-closed job status,
        # but do not hide this failure when an earlier release gate is red.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production-website-health
          intel="/tmp/production-website-health/intelligence.json"
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          intel_code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -o "$intel" -w '%{http_code}' \
            "$BASE_URL/api/public/intelligence?production_health=${nonce}")"
          if [[ "$intel_code" != "200" ]]; then
            echo "::error title=Public intelligence API unavailable::Expected HTTP 200, got $intel_code."
            cat "$intel"
            exit 1
          fi
          node - "$intel" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(body?.rows) ? body.rows : [];
          const required = ['geopolitics', 'macro', 'rare_earth'];
          const requiredSet = new Set(required);
          const latestScored = new Map();
          let verified = 0;
          let live = 0;
          let newestLive = -Infinity;
          let ok = body?.ok === true && rows.length > 0;
          const now = Date.now();
          const dayMs = 24 * 60 * 60 * 1000;
          const futureToleranceMs = 5 * 60 * 1000;
          for (const row of rows) {
            const category = String(row?.category ?? '');
            const title = String(row?.source_title ?? '');
            if ('source_name' in row || 'source_domain' in row || 'source_url' in row) ok = false;
            if (row?.public_status === 'verified_b2') {
              verified++;
              const severity = Number(row?.severity);
              const timestamp = Date.parse(String(row?.published_at ?? ''));
              if (!Number.isFinite(severity) || severity < 0 || severity > 100 || !title.startsWith('Geomacro finds ')) ok = false;
              if (!Number.isFinite(timestamp) || timestamp > now + futureToleranceMs) ok = false;
              if (requiredSet.has(category) && Number.isFinite(timestamp)) {
                latestScored.set(category, Math.max(latestScored.get(category) ?? -Infinity, timestamp));
              }
            } else if (row?.public_status === 'live_observed') {
              live++;
              if (category !== 'geopolitics' || row?.severity !== null || row?.delta !== null || !title.startsWith('Geomacro observes ')) ok = false;
              const timestamp = Date.parse(String(row?.published_at ?? ''));
              if (!Number.isFinite(timestamp) || timestamp > now + futureToleranceMs) ok = false;
              else newestLive = Math.max(newestLive, timestamp);
            } else {
              ok = false;
            }
          }
          for (const category of required) if (!latestScored.has(category)) ok = false;
          const scoredCurrentAcrossAllDomains = required.every((category) => {
            const timestamp = latestScored.get(category) ?? -Infinity;
            return Number.isFinite(timestamp) && timestamp <= now + futureToleranceMs && now - timestamp <= dayMs;
          });
          if (Number(body?.verified_rows) !== verified || Number(body?.live_observed_rows) !== live) ok = false;
          if (body?.current_within_24h !== true) ok = false;
          if (scoredCurrentAcrossAllDomains) {
            if (body?.mode !== 'verified_b2' || live !== 0) ok = false;
          } else {
            if (body?.mode !== 'verified_b2_plus_live_observed' || live < 1) ok = false;
            if (!Number.isFinite(newestLive) || newestLive > now + futureToleranceMs || now - newestLive > dayMs) ok = false;
          }
          if (!ok) {
            console.error(JSON.stringify({
              error: 'PUBLIC_INTELLIGENCE_CURRENT_CONTRACT_INVALID',
              mode: body?.mode ?? null,
              verified_rows: body?.verified_rows ?? null,
              live_observed_rows: body?.live_observed_rows ?? null,
              newest_at: body?.newest_at ?? null,
              current_within_24h: body?.current_within_24h ?? null,
              scored_current_across_all_domains: scoredCurrentAcrossAllDomains,
              latest_scored_at: Object.fromEntries(required.map((category) => [
                category,
                Number.isFinite(latestScored.get(category)) ? new Date(latestScored.get(category)).toISOString() : null,
              ])),
            }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            ok: true,
            mode: body.mode,
            newest_at: body.newest_at ?? null,
            verified_rows: verified,
            live_observed_rows: live,
            scored_current_across_all_domains: scoredCurrentAcrossAllDomains,
            latest_scored_at: Object.fromEntries(required.map((category) => [
              category,
              Number.isFinite(latestScored.get(category)) ? new Date(latestScored.get(category)).toISOString() : null,
            ])),
          }));
          NODE

          global_risk="$(mktemp)"
          global_risk_code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$global_risk" -w '%{http_code}' "$BASE_URL/api/public/global-risk")"
          if [[ "$global_risk_code" != "200" ]]; then
            echo "::error title=Public Global Risk API unavailable::Expected HTTP 200, got $global_risk_code."
            cat "$global_risk"
            exit 1
          fi
          grep -Fq '"ok":true' "$global_risk"
          grep -Fq '"verificationStatus":"verified"' "$global_risk"
          grep -Fq '"authority":"backblaze-b2-verified-edge"' "$global_risk"

          risk="$(mktemp)"
          risk_code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$risk" -w '%{http_code}' "$BASE_URL/api/public/risk-indices")"
          if [[ "$risk_code" != "200" ]]; then
            echo "::error title=Public Risk Indices API unavailable::Expected HTTP 200, got $risk_code."
            cat "$risk"
            exit 1
          fi
          grep -Fq '"ok":true' "$risk"
          grep -Fq '"verificationStatus":"verified"' "$risk"
          grep -Fq '"authority":"backblaze-b2-risk-indices-edge"' "$risk"

          ask="$(mktemp)"
          ask_code="$(curl -L --retry 2 --retry-all-errors --retry-delay 2 -sS -H 'Accept: application/json' -H 'Origin: https://geomacro.live' -H 'X-Geomacro-Question: What changed in the risk indices?' -o "$ask" -w '%{http_code}' "$BASE_URL/api/public-ask")"
          if [[ "$ask_code" != "200" ]]; then
            echo "::error title=Ask Geomacro functional probe failed::Expected HTTP 200, got $ask_code."
            cat "$ask"
            exit 1
          fi
          grep -Fq '"ok":true' "$ask"

      - name: Verify Ask Geomacro desktop and mobile rendering contract
        # Website rendering is independent evidence. A B2/data-plane failure
        # above must not suppress desktop/mobile acceptance diagnostics.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          verify_ask_render() {
            local label="$1"
            local agent="$2"
            local body decoded code
            body="$(mktemp)"
            decoded="$(mktemp)"
            code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS \
              -A "$agent" \
              -o "$body" -w '%{http_code}' "$BASE_URL/ask-geomacro")"
            test "$code" = "200" || { echo "::error title=Ask $label route unavailable::HTTP $code"; head -c 1000 "$body" || true; exit 1; }
            ! grep -Fq "This page didn't load" "$body" || { echo "::error title=Ask $label route rendered error boundary::/ask-geomacro"; exit 1; }
            python - "$body" "$decoded" <<'PY'
          import html
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          pathlib.Path(sys.argv[2]).write_text(html.unescape(source), encoding='utf-8')
          PY
            grep -Fq 'Ask Geomacro' "$decoded"
            rm -f "$body" "$decoded"
          }
          verify_ask_render "desktop" 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36'
          verify_ask_render "mobile" 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          mkdir -p /tmp/production-website-health
          printf '%s\n' '{"desktop":true,"mobile":true,"route":"/ask-geomacro"}' > /tmp/production-website-health/ask-render.json
          echo "PASS: Ask Geomacro rendered on desktop and mobile user agents."

      - name: Upload production Intelligence diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: production-intelligence-health-${{ github.run_id }}
          path: /tmp/production-website-health/intelligence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify D1-derived Intelligence really renders on first HTML response
        # Independent of legacy B2 scoring and x402 readiness. Build SHA alone
        # is insufficient: an old page can retain a correct marker while the
        # user sees no current derived news. This check emits only booleans.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          journal="$(mktemp)"
          page="$(mktemp)"
          trap 'rm -f "$journal" "$page"' EXIT
          d1_code="$(curl --fail-with-body --silent --show-error --max-time 14 \
            -H 'Cache-Control: no-cache' \
            -o "$journal" -w '%{http_code}' \
            'https://geomacro-control-plane.daspallab202391.workers.dev/v1/public/website-derived-news-immediate' || true)"
          page_code="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' -o "$page" -w '%{http_code}' \
            "$BASE_URL/intelligence" || true)"
          if [[ "$d1_code" != "200" || "$page_code" != "200" ]]; then
            echo "::error::LIVE_DERIVED_NEWS_SSR_DEPENDENCY_UNAVAILABLE"
            exit 1
          fi
          python - "$journal" "$page" <<'PY'
          import html
          import json
          import pathlib
          import sys
          journal=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          rendered=html.unescape(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          stories=journal.get("signals")
          if (journal.get("ok") is not True or
              journal.get("schema")!="geomacro.website-derived-news-feed.v1" or
              (type(journal.get("original_release_delay_minutes")) is not int or journal.get("original_release_delay_minutes") not in (0,15)) or
              not isinstance(stories,list) or not stories):
              raise SystemExit("LIVE_DERIVED_NEWS_D1_READBACK_MISSING")
          if ("What changed in the world" not in rendered or
              "GEOMACRO FINDS" not in rendered or
              "Risk Intelligence" in rendered and
              "No current verified scored development" in rendered):
              raise SystemExit("LIVE_DERIVED_NEWS_OLD_SCORED_PAGE_STILL_PUBLISHED")
          titles=[x.get("title") for x in stories if
                  isinstance(x,dict) and isinstance(x.get("title"),str) and
                  x["title"].startswith("Geomacro finds ")]
          if not titles or not any(title in rendered for title in titles):
              raise SystemExit("LIVE_DERIVED_NEWS_MISSING_FROM_FIRST_HTML_PAINT")
          print(json.dumps({
              "schema":"geomacro.website-derived-news-ssr-live-acceptance.v1",
              "live_website_page":True,
              "first_html_contains_derived_story":True,
              "d1_derived_story_count":len(titles),
              "original_delay_minutes":journal.get("original_release_delay_minutes"),
              "source_urls_or_raw_feed_logged":False
          }))
          PY

      - name: Verify rendered production page markers
        # Keep route/UI evidence observable even when an upstream data-plane
        # gate fails. The overall workflow still fails closed on that gate.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          routes="$(cat <<'EOF'
          /|What changed.
          /intelligence|Risk Intelligence
          /global-risk|Geomacro Global Risk
          /risk-indices|Geomacro Risk Indices
          /ask-geomacro|Ask Geomacro
          /data-api|Geomacro Store
          /pricing|Geomacro Store
          /institutional|For teams
          /risk-gate|Risk Gate
          /ecosystem|Ecosystem
          /research|Research
          /docs|Documentation
          /about|Understand the world. Inspect the context.
          /roadmap|Use it today. See what’s next.
          /contact|Let’s talk about your workflow.
          EOF
          )"

          while IFS='|' read -r path marker; do
            path="$(printf '%s' "$path" | xargs)"
            marker="$(printf '%s' "$marker" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "$path" ]] && continue
            body="$(mktemp)"
            decoded="$(mktemp)"
            code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' "$BASE_URL$path")"
            if [[ "$code" != "200" ]]; then
              echo "::error title=Production page unavailable::$path returned HTTP $code"
              head -c 1000 "$body" || true
              exit 1
            fi
            if grep -Fq "This page didn't load" "$body"; then
              echo "::error title=Production route rendered error boundary::$path returned HTTP 200 but rendered the root error page."
              exit 1
            fi
            python - "$body" "$decoded" <<'PY'
          import html
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          pathlib.Path(sys.argv[2]).write_text(html.unescape(source), encoding="utf-8")
          PY
            if [[ "$path" == "/global-risk" ]]; then
              # The frozen route has two valid states: this recovery heading
              # while the signed package is unavailable, OR its main heading
              # after verified data loads. Do not make an error-state-only
              # marker the sole test for a healthy page; the independent B2,
              # deep-health and API checks remain strict launch blockers.
              if ! grep -Fq "Geomacro Global Risk" "$decoded" &&
                 ! grep -Fq "Three risks. Three separate indices." "$decoded"; then
                echo "::error title=Production route content missing::$path did not render either approved Global Risk route state."
                exit 1
              fi
            elif ! grep -Fq "$marker" "$decoded"; then
              echo "::error title=Production route content missing::$path returned HTTP 200 but did not render expected marker: $marker"
              exit 1
            fi
            rm -f "$body" "$decoded"
          done <<< "$routes"

          retired_routes="$(cat <<'EOF'
          /testnet-access|/data-api
          /testnet-console|/data-api
          /demo|/data-api
          /pipeline|/research
          /onchain|/data-api
          /arena|/intelligence
          /bridge|/data-api
          /bridge-swap|/data-api
          /portfolio|/intelligence
          /tameion|/data-api
          EOF
          )"

          while IFS='|' read -r legacy target; do
            legacy="$(printf '%s' "$legacy" | xargs)"
            target="$(printf '%s' "$target" | xargs)"
            [[ -z "$legacy" ]] && continue
            body="$(mktemp)"
            result="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}|%{url_effective}' "$BASE_URL$legacy")"
            code="${result%%|*}"
            effective="${result#*|}"
            if [[ "$code" != "200" ]]; then
              echo "::error title=Retired route unavailable::$legacy expected a commercial redirect ending in HTTP 200, got $code"
              exit 1
            fi
            if [[ "$effective" != "$BASE_URL$target" && "$effective" != "$BASE_URL$target/" ]]; then
              echo "::error title=Retired route did not resolve to commercial surface::$legacy resolved to $effective, expected $BASE_URL$target"
              exit 1
            fi
            rm -f "$body"
          done <<< "$retired_routes"

          mkdir -p /tmp/production-website-health
          printf '%s\n' '{"routes_rendered":true,"retired_routes_redirect_only":true}' > /tmp/production-website-health/rendered-routes.json
          echo "PASS: production commercial routes render and retired routes resolve only to current commercial surfaces."

      - name: Upload independent website surface diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: production-website-surfaces-${{ github.run_id }}
          path: |
            /tmp/production-website-health/ask-render.json
            /tmp/production-website-health/rendered-routes.json
          if-no-files-found: warn
          retention-days: 14

      - name: Seal Section 11 production deployment acceptance evidence
        shell: bash
        env:
          CANONICAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/section11-production-website
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const read=(path)=>JSON.parse(fs.readFileSync(path,'utf8'));
          const build=read('/tmp/production-website-health/build-marker.json');
          const publicHealth=read('/tmp/production-website-health/public-health.json');
          const d1=read('/tmp/production-website-health/d1-health.json');
          const denied=read('/tmp/production-website-health/d1-unauthorized.json');
          const ask=read('/tmp/production-website-health/ask-render.json');
          const mirrorSha=fs.readFileSync('/tmp/production-website-health/lovable-mirror-sha.txt','utf8').trim().toLowerCase();
          const sha=String(process.env.CANONICAL_SHA||'').toLowerCase();
          if(!/^[0-9a-f]{40}$/.test(sha)) throw new Error('SECTION11_CANONICAL_SHA_INVALID');
          const buildSha=String(build?.canonical_main_sha||'').trim().toLowerCase();
          const b2=publicHealth?.public_production??{};
          const evidence={
            schema_version:'geomacro.section11-production-deployment-acceptance.v1',
            canonical_main_sha:sha,
            verified_at:new Date().toISOString(),
            build_sha_matches_canonical_main:buildSha===sha,
            global_risk_presentation_lock:true,
            intelligence_freshness_uses_evidence_time:true,
            ask_geomacro_desktop_mobile:ask.desktop===true&&ask.mobile===true,
            commercial_pages_readable_and_concise:true,
            product_truth_consistent:true,
            production_health:{
              b2_serving_verified:
                publicHealth?.ok===true &&
                b2?.serving_authority==='backblaze-b2-durable-truth-cloudflare-d1-verified-hot' &&
                b2?.supabase_required_for_serving===false &&
                b2?.b2_runtime_configured===true &&
                b2?.intelligence_ready===true &&
                b2?.global_risk_ready===true &&
                b2?.risk_indices_ready===true &&
                Object.values(b2?.hot_snapshot_serving??{}).length===3 &&
                Object.values(b2?.hot_snapshot_serving??{}).every(proof=>proof.ok&&proof.serving_store==='cloudflare-d1'),
              d1_serving_verified:
                d1?.ok===true &&
                d1?.store==='d1' &&
                Number(d1?.schema_version)>=2 &&
                d1?.durable_payload_store==='b2' &&
                d1?.commerce_ledger==='durable_object',
              d1_unauthenticated_write_rejected:denied?.ok===false&&denied?.error==='UNAUTHORIZED',
              fail_closed:true,
            },
            lovable_mirror_matches_canonical_main:mirrorSha===sha,
            published_site_matches_canonical_main:buildSha===sha,
            real_payment_performed:false,
            destructive_change:false,
          };
          if(
            evidence.build_sha_matches_canonical_main!==true ||
            evidence.production_health.b2_serving_verified!==true ||
            evidence.production_health.d1_serving_verified!==true ||
            evidence.production_health.d1_unauthenticated_write_rejected!==true ||
            evidence.ask_geomacro_desktop_mobile!==true ||
            evidence.lovable_mirror_matches_canonical_main!==true ||
            evidence.published_site_matches_canonical_main!==true
          ) throw new Error('SECTION11_ACCEPTANCE_INCOMPLETE');
          const canonical=JSON.stringify(evidence);
          evidence.evidence_sha256=crypto.createHash('sha256').update(canonical).digest('hex');
          fs.writeFileSync(
            'artifacts/section11-production-website/acceptance.json',
            JSON.stringify(evidence,null,2)+'\n',
          );
          NODE
          cat artifacts/section11-production-website/acceptance.json

      - name: Upload Section 11 production deployment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: section11-production-deployment-${{ github.run_id }}
          path: artifacts/section11-production-website/acceptance.json
          if-no-files-found: error
          retention-days: 30

  free-finds-independent-canary:
    # Independent of strict signed-hot/deep-health job: a legacy paid 503
    # must not prevent observing real free homepage/API reachability.
    if: github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify free homepage, Ask and D1-derived Finds without credentials
        # Independent outside-in diagnostic: preserve fail-closed job status,
        # but do not hide this failure when an earlier release gate is red.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://geomacro.live';
          const d1='https://geomacro-control-plane.daspallab202391.workers.dev';
          async function read(path,type='html'){
            const url=path.startsWith('https://')?path:base+path;
            const r=await fetch(url,{method:'GET',redirect:'error',
              headers:{Accept:type==='json'?'application/json':'text/html'},
              signal:AbortSignal.timeout(22000)});
            if(r.status!==200)throw Error('PUBLIC_FREE_ROUTE_HTTP_'+r.status+':'+new URL(url).pathname);
            const raw=await r.text();
            if(raw.length>(type==='json'?512000:500000))throw Error('FREE_ROUTE_OVERSIZE');
            return type==='json'?JSON.parse(raw):raw;
          }
          const [home,ask,journal,finds]=await Promise.all([
            read('/'),read('/ask-geomacro'),
            read(d1+'/v1/public/website-derived-news-immediate','json'),
            read('/api/v1/finds','json'),
          ]);
          // Match the locked, currently rendered Geomacro homepage and Ask
          // content. An obsolete marketing headline must not make a working
          // free Finds route look offline. Keep every HTTP/API truth gate.
          for(const [label,html,marker] of [
            ['home-finds',home,'Geomacro Finds'],
            ['home-heading',home,'Understand global risk.'],
            ['home-message',home,'Know what matters.'],
            ['ask-heading',ask,'Ask Geomacro'],
          ]){
            if(!html.includes(marker))throw Error('PUBLIC_FREE_HTML_MISSING:'+label);
          }
          if(journal?.ok!==true||
             journal?.schema!=='geomacro.website-derived-news-feed.v1'||
             (journal?.original_release_delay_minutes!==0&&journal?.original_release_delay_minutes!==15)||
             !Array.isArray(journal?.signals))
             throw Error('PUBLIC_FREE_D1_JOURNAL_INVALID');
          if(finds?.ok!==true||finds?.schema!=='geomacro.find-card-feed.v1'||
             finds?.chargeable!==false||finds?.scored!==false||
             finds?.independent_same_event_verified!==false||
             finds?.source_metadata_returned!==false||
             (finds?.original_release_delay_minutes!==0&&finds?.original_release_delay_minutes!==15)||
             !Array.isArray(finds.cards))
             throw Error('PUBLIC_FREE_FINDS_CONTRACT_INVALID');
          if(finds.cards.some(card=>card?.schema!=='geomacro.find.v1'||
             card?.severity!==null||JSON.stringify(card).includes('https://')||JSON.stringify(card).includes('http://')))
             throw Error('PUBLIC_FINDS_PRIVATE_OR_SCORED_DATA');
          console.log(JSON.stringify({schema:'geomacro.free-website-live-canary.v1',
            homepage_http:200,ask_http:200,finds_http:200,d1_http:200,
            free_cards:finds.cards.length,derived_journal_rows:journal.signals.length,
            independent_review_claimed:false,paid_hot_verified:false,
            payment_performed:false,source_names_disclosed:false}));
          NODE
