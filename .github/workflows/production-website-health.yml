name: Production Website Health

on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-production-website-health
  cancel-in-progress: true

jobs:
  public-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://geomacro.live
    steps:
      - name: Verify B2 production serving health
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/health?deep=1")"
          cat "$body"
          echo
          if [[ "$code" != "200" ]]; then
            echo "::error title=Production data serving unavailable::Expected HTTP 200 from canonical /api/health?deep=1 B2 readiness check, got $code."
            exit 1
          fi
          for marker in \
            '"ok":true' \
            '"serving_authority":"backblaze-b2"' \
            '"supabase_required_for_serving":false' \
            '"b2_runtime_configured":true' \
            '"intelligence_ready":true' \
            '"risk_indices_ready":true' \
            '"risk_verification_status":"verified"'
          do
            grep -Fq "$marker" "$body"
          done

      - name: Verify production alignment contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -L --retry 4 --retry-all-errors --retry-delay 3 -sS -o "$body" -w '%{http_code}' "$BASE_URL/api/health")"
          if [[ "$code" != "200" ]]; then
            echo "::error title=Health endpoint unavailable::Expected HTTP 200 from /api/health, got $code."
            cat "$body"
            exit 1
          fi
          for marker in \
            '"alignment_contract":"github-main-b2-primary-supabase-standby-lovable-v2"' \
            '"production_data_authority":"backblaze-b2"' \
            '"production_data_runtime_configured":true' \
            '"commerce_control_plane":"cloudflare-durable-objects"' \
            '"supabase_role":"ingestion-recovery-standby"'
          do
            grep -Fq "$marker" "$body"
          done

      - name: Verify rendered production page markers
        shell: bash
        run: |
          set -euo pipefail
          routes="$(cat <<'EOF'
          /|Global risk intelligence
          /intelligence|Risk Intelligence
          /global-risk|Geomacro Risk Indices
          /ask-geomacro|Ask Geomacro
          /data-api|GOVERNED DATA
          /institutional|COMMERCIAL RISK INTELLIGENCE
          /risk-gate|Risk Gate
          /ecosystem|Ecosystem & partnerships
          /research|Research & methodology
          /docs|Geomacro public documentation
          /about|About & trust
          /roadmap|What works today, and what comes next.
          /contact|Bring the workflow.
          /testnet-access|Geomacro Testnet Access
          /demo|Agentic Commerce Demo
          /pipeline|Intelligence Pipeline
          /onchain|Arc / Onchain
          EOF
          )"

          while IFS='|' read -r path marker; do
            path="$(printf '%s' "$path" | xargs)"
            marker="$(printf '%s' "$marker" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "$path" ]] && continue

            body="$(mktemp)"
            code="$(curl -L --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$body" -w '%{http_code}' "$BASE_URL$path")"
            if [[ "$code" != "200" ]]; then
              echo "::error title=Production page unavailable::$path returned HTTP $code"
              head -c 1000 "$body" || true
              exit 1
            fi

            if grep -Fq "This page didn't load" "$body"; then
              echo "::error title=Production route rendered error boundary::$path returned HTTP 200 but rendered the root error page."
              head -c 1000 "$body" || true
              exit 1
            fi

            if ! grep -Fq "$marker" "$body"; then
              echo "::error title=Production route content missing::$path returned HTTP 200 but did not render expected marker: $marker"
              head -c 1500 "$body" || true
              exit 1
            fi

            rm -f "$body"
            echo "PASS: $path rendered expected production content."
          done <<< "$routes"
