name: Restricted Private Current Scoring Staging

# Original-article SHA-bound auto scoring is being regression tested.
# A single additional current-head private 3-domain canary on protected
# PR #1934 merge after FCDO geopolitical third-family source correction.
# Prior #1933/#1929/#1924 runs are historical. D1-gated reusable calls can
# stage canonical scoring automatically only after genuinely new original
# article fingerprints. No public projection, Supabase, money or GRO promotion;
# unverified originals fail BEFORE any B2 PUT.
on:
  workflow_call:
    inputs:
      bounded_automatic_private_stage:
        description: "Private scorer after novel D1 source fingerprints (never publication)"
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      private_gri_singleton:
        description: "Extra guarded private 3-domain GRI v1.2 singleton canary (no public release)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/restricted-private-current-scoring.yml"
      - "scripts/ops/preflight-private-griv12-singleton.mjs"
      - "scripts/tests/auto-private-gri-no-funds-continuation.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/restricted-private-current-scoring.yml"
      - "scripts/ingest-news.js"
      - "scripts/tests/auto-private-gri-no-funds-continuation.test.mjs"
      - "scripts/ops/preflight-private-griv12-singleton.mjs"
      - "scripts/lib/official-native-rss.mjs"
      - "scripts/lib/official-native-alternates.mjs"
      - "scripts/lib/official-native-third-fallback.mjs"

permissions:
  contents: read

concurrency:
  group: geomacro-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  private-gri-auto-continuation-contract:
    # Verify the protected no-funds gating on PRs as well as on production
    # source changes; this job never obtains source/provider secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify auto GRI continuation never promotes private news to public signed score
        run: |
          set -euo pipefail
          node --check scripts/ops/preflight-private-griv12-singleton.mjs
          node --test scripts/tests/auto-private-gri-no-funds-continuation.test.mjs

  private-stage:
    if: >-
      github.repository == 'blocknine0/geomacro' &&
      github.ref == 'refs/heads/main' &&
      (
        inputs.bounded_automatic_private_stage == true ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && (
          contains(github.event.head_commit.message, 'Merge pull request #1891') ||
          contains(github.event.head_commit.message, '(#1924)') ||
            contains(github.event.head_commit.message, '(#1929)') ||
            contains(github.event.head_commit.message, '(#1933)') ||
            contains(github.event.head_commit.message, '(#1934)') ||
            contains(github.event.head_commit.message, '(#1985)') ||
            contains(github.event.head_commit.message, '(#1999)')
        ))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      # Trusted reusable-workflow input; ONLY the D1-novel-article pulse
      # supplies true. Manual or historical push scorer paths remain false.
      # This applies the SHA-bound D1 restriction regardless of whether the
      # authorized caller woke via cron, push or a same-repo workflow_run.
      GEOMACRO_AUTOMATIC_D1_PULSE_STAGE: ${{ inputs.bounded_automatic_private_stage == true }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_REQUEST_BUDGET: "4"
      # Isolated manual private B2 staging: all B2 HTTP attempts must reserve
      # shared account-wide D1 tickets after the D1 migration is deployed.
      B2_ACCOUNT_QUOTA_REQUIRED: "1"
      B2_ACCOUNT_QUOTA_WORKFLOW_ID: restricted_private_scoring
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: geomacro-control-plane
      WRANGLER_VERSION: "4.136.3"

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MODEL_ORDER: ${{ vars.GEMINI_MODEL_ORDER }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      CLASSIFIER_PROVIDER_ORDER: ${{ vars.CLASSIFIER_PROVIDER_ORDER }}
      GEOMACRO_GDELT_ONLY: "true"
      GDELT_GAL_FALLBACK_ENABLED: "true"
      GUARDIAN_QUERY_BUDGET_PER_CATEGORY: "0"
      GDACS_ENABLED: "false"
      RELIEFWEB_ENABLED: "false"
      # One original item/domain is the maximum for the private singleton
      # pre-GRI path; no expression-valued job env on push (GitHub parser).
      MAX_CANDIDATES_PER_CATEGORY: "1"
      # Same 24h publication window as private SHA-only D1 source intake.
      # Non-original, unsigned or unlicensed items remain rejected.
      MAX_ARTICLE_AGE_MS: "86400000"
      GROQ_BATCH_SIZE: "1"
      GROQ_MAX_REQUESTS_PER_RUN: "3"
      GROQ_MAX_WAIT_MS: "45000"
      NEWS_QUERY_DELAY_MS: "0"

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve authorized production D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${B2_KEY_ID:-}" && test -n "${B2_APPLICATION_KEY:-}"
          test -n "${GROQ_API_KEY:-}"
          LIST_JSON="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json)"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const rows = JSON.parse(s);
              const row = rows.find(x => x.name === process.env.D1_DATABASE_NAME);
              process.stdout.write(row?.uuid ?? row?.id ?? "");
            });
          ')"
          test -n "$DB_ID" || { echo "D1 database not available"; exit 3; }
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Check shared D1 B2 headroom before any original claim or classifier call
        id: headroom
        run: node scripts/ops/check-private-scoring-b2-headroom.mjs

      - name: Explain the quota-held evidence stage without claiming readiness
        if: steps.headroom.outputs.admitted == 'false'
        run: echo "PRIVATE_SCORING_QUOTA_HELD_NO_EVENT_OR_COMMERCE_PROMOTION"

      - name: Score three bounded domains using canonical classifier, no Supabase
        if: steps.headroom.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${APP_SUPABASE_SERVICE_ROLE_KEY:-}"
          mkdir -p artifacts/restricted-current-scoring
          chmod 700 artifacts/restricted-current-scoring
          for domain in geopolitics macro rare_earth; do
            if [[ "${GEOMACRO_AUTOMATIC_D1_PULSE_STAGE}" == "true" ]]; then
              node scripts/ops/private-classifier-retry-lifecycle.mjs claim "$domain"
              HAS_CLAIM="$(DOMAIN="$domain" node --input-type=module -e '
                import {readFileSync} from "node:fs";
                const d=process.env.DOMAIN;
                const p=JSON.parse(readFileSync(`artifacts/restricted-current-scoring/${d}-claim.json`));
                process.stdout.write(p.claimed===true?"true":"false");')"
              if [[ "$HAS_CLAIM" == "false" ]]; then
                echo "PRIVATE_CLASSIFIER_NO_BOUND_WORK:$domain"
                continue
              fi
            fi
            # Upstream text and article URLs are PRIVATE. Never publish raw
            # classifier/discovery stdout in public GitHub Actions logs.
            if ! GDELT_FORCE_CATEGORY="$domain" node scripts/ingest-news.js --private-scored-stage \
              > "artifacts/restricted-current-scoring/$domain.log" 2>&1; then
              if [[ "${GEOMACRO_AUTOMATIC_D1_PULSE_STAGE}" == "true" ]]; then
                # Fail-closed D1 terminal ACK for unverified upstream 403/429,
                # preserving a bounded retry only for proven classifier failure.
                node scripts/ops/private-classifier-retry-lifecycle.mjs abort "$domain"
              fi
              echo "::error::PRIVATE_SCORING_CANONICAL_DOMAIN_FAILED:$domain"
              exit 1
            fi
            if [[ "${GEOMACRO_AUTOMATIC_D1_PULSE_STAGE}" == "true" ]]; then
              node scripts/ops/private-classifier-retry-lifecycle.mjs finish "$domain"
            fi
            DOMAIN="$domain" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const category = process.env.DOMAIN;
              const stage = JSON.parse(readFileSync(
                `artifacts/restricted-current-scoring/${category}.json`, "utf8"));
              console.log(JSON.stringify({
                domain: category,
                private_staged_candidates: stage.records?.length ?? 0,
                public_published: false,
              }));
            '
          done

      - name: Publish privacy-safe stage rejection diagnostics
        if: steps.headroom.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/summarize-restricted-private-scoring.mjs

      # Only the already authorized D1-novel-fingerprint reusable caller can
      # wake this automatic local preflight. It examines exactly one genuine
      # private stage+source candidate in EACH domain, without B2, D1, payment
      # or raw logs. Missing/partial domains are normal and MUST NOT promote.
      - name: Qualify automatic private GRI singleton without network or claims
        id: automatic_gri_singleton
        if: >-
          steps.headroom.outputs.admitted == 'true' &&
          inputs.bounded_automatic_private_stage == true
        shell: bash
        run: |
          set -euo pipefail
          if env -u B2_KEY_ID -u B2_APPLICATION_KEY \
              -u CLOUDFLARE_API_TOKEN -u GEOMACRO_COMMERCE_LEDGER_TOKEN \
              -u SUPABASE_DB_URL -u SUPABASE_SERVICE_ROLE_KEY \
              -u APP_SUPABASE_SERVICE_ROLE_KEY \
              node scripts/ops/preflight-private-griv12-singleton.mjs \
              >/tmp/geomacro-auto-private-gri-admission.json 2>/dev/null; then
            node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from "node:fs";
          const receipt=JSON.parse(readFileSync(
            "/tmp/geomacro-auto-private-gri-admission.json","utf8"));
          if(receipt.schema!=="geomacro.private-three-domain-gri-pre-b2-preflight.v1"||
             receipt.accepted!==true||receipt.private_only!==true||
             receipt.public_published!==false||
             receipt.commercial_eligible!==false||
             receipt.singleton_per_category!==true||
             receipt.independently_corroborated!==false||
             receipt.source_rights_verified!==false||
             receipt.source_authenticity_independently_verified!==false||
             receipt.remote_network_calls!==0||
             receipt.b2_requests!==0||receipt.d1_writes!==0||
             receipt.supabase_writes!==0||receipt.usdc_spent!==0||
             JSON.stringify(receipt.current_categories)!==
               JSON.stringify(["geopolitics","macro","rare_earth"]))
            throw Error("AUTOMATIC_PRIVATE_GRI_NOT_QUALIFIED");
          appendFileSync(process.env.GITHUB_OUTPUT,"eligible=true\n");
          console.log("PRIVATE_GRI_THREE_DOMAIN_SINGLETON_READY_NO_COMMERCIAL_RIGHTS");
          NODE
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_GRI_NOT_READY_THREE_GENUINE_SINGLETON_ORIGINALS_REQUIRED"
          fi

      - name: Prove genuine original-source three-domain singleton eligibility BEFORE B2 PUT
        if: >-
          steps.headroom.outputs.admitted == 'true' && (
          (github.event_name == 'push' && (
            contains(github.event.head_commit.message, 'Merge pull request #1891') ||
            contains(github.event.head_commit.message, '(#1924)') ||
            contains(github.event.head_commit.message, '(#1929)') ||
            contains(github.event.head_commit.message, '(#1933)') ||
            contains(github.event.head_commit.message, '(#1934)')
          )) ||
          (steps.automatic_gri_singleton.outputs.eligible == 'true') ||
          (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.private_gri_singleton == 'true')
          )
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/preflight-private-griv12-singleton.mjs

      - name: Verify one private B2 bundle then write compact D1 checkpoint
        if: steps.headroom.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/archive-restricted-private-scored-stage.mjs --private-stage-only
          if [[ "${GEOMACRO_AUTOMATIC_D1_PULSE_STAGE}" == "true" ]]; then
            for domain in geopolitics macro rare_earth; do
              HAS_CLAIM="$(DOMAIN="$domain" node --input-type=module -e '
                import {readFileSync} from "node:fs";
                const d=process.env.DOMAIN;
                const p=JSON.parse(readFileSync(`artifacts/restricted-current-scoring/${d}-claim.json`));
                process.stdout.write(p.claimed===true?"true":"false");')"
              if [[ "$HAS_CLAIM" == "true" ]]; then
                HAS_STAGE="$(DOMAIN="$domain" node --input-type=module -e '
                  import {readFileSync} from "node:fs";
                  const d=process.env.DOMAIN;
                  const p=JSON.parse(readFileSync(`artifacts/restricted-current-scoring/${d}.json`));
                  process.stdout.write(p.records?.length>0?"true":"false");')"
                if [[ "$HAS_STAGE" == "true" ]]; then
                  node scripts/ops/private-classifier-retry-lifecycle.mjs commit "$domain"
                fi
              fi
            done
          fi

      - name: Prepare source-bound canonical private GRI v1.2 proof locally (no network)
        if: >-
          steps.headroom.outputs.admitted == 'true' && (
          (github.event_name == 'push' && (
            contains(github.event.head_commit.message, 'Merge pull request #1891') ||
            contains(github.event.head_commit.message, '(#1924)') ||
            contains(github.event.head_commit.message, '(#1929)') ||
            contains(github.event.head_commit.message, '(#1933)') ||
            contains(github.event.head_commit.message, '(#1934)')
          )) ||
          (steps.automatic_gri_singleton.outputs.eligible == 'true') ||
          (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.private_gri_singleton == 'true')
          )
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/private-gri-v12
          chmod 700 artifacts/private-gri-v12
          # Explicitly strip all privileged credentials from offline validator.
          # Never print raw headline/source fields or upload proof JSON to Actions.
          env -u B2_KEY_ID -u B2_APPLICATION_KEY \
            -u CLOUDFLARE_API_TOKEN -u GEOMACRO_COMMERCE_LEDGER_TOKEN \
            -u SUPABASE_DB_URL -u SUPABASE_SERVICE_ROLE_KEY \
            -u APP_SUPABASE_SERVICE_ROLE_KEY \
            node scripts/ops/prepare-private-griv12-singleton-proof.mjs \
              --private-singleton-only > artifacts/private-gri-v12/prepare-receipt.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const receipt=JSON.parse(readFileSync(
            "artifacts/private-gri-v12/prepare-receipt.json","utf8"));
          if(receipt.ok!==true || receipt.private_only!==true ||
            receipt.public_published!==false ||
            receipt.commercial_eligible!==false ||
            receipt.b2_requests!==0 || receipt.d1_writes!==0 ||
            !/^[0-9a-f]{64}$/.test(String(receipt.original_input_sha256??"")) ||
            !/^[0-9a-f]{64}$/.test(String(receipt.portable_bundle_hash??""))) {
            throw new Error("GRI_PRIVATE_OFFLINE_COMPILATION_NOT_ACCEPTED");
          }
          appendFileSync(process.env.GITHUB_ENV,
            "GRI_PRIVATE_ADMISSION_SHA256="+receipt.original_input_sha256+"\n"+
            "GRI_PRIVATE_PROOF_INPUT=artifacts/private-gri-v12/"+
              receipt.portable_bundle_hash+".json\n");
          console.log(JSON.stringify({
            private_gri_offline_compiled:true,
            current_categories:receipt.current_categories,
            public_published:false,commercial_eligible:false,
            b2_requests:0,supabase_writes:0,usdc_spent:0,
          }));
          NODE

      - name: Independently verify private GRI proof B2 restore then D1 checkpoint
        if: >-
          steps.headroom.outputs.admitted == 'true' && (
          (github.event_name == 'push' && (
            contains(github.event.head_commit.message, 'Merge pull request #1891') ||
            contains(github.event.head_commit.message, '(#1924)') ||
            contains(github.event.head_commit.message, '(#1929)') ||
            contains(github.event.head_commit.message, '(#1933)') ||
            contains(github.event.head_commit.message, '(#1934)')
          )) ||
          (steps.automatic_gri_singleton.outputs.eligible == 'true') ||
          (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.private_gri_singleton == 'true')
          )
        shell: bash
        env:
          # Preserve strict global shared D1 account-level B2 tickets.
          B2_REQUEST_BUDGET: "2"
          B2_ACCOUNT_QUOTA_REQUIRED: "1"
          B2_ACCOUNT_QUOTA_WORKFLOW_ID: gri_private_v12
        run: |
          set -euo pipefail
          umask 077
          node scripts/ops/archive-supabase-free-private-gri-v12.mjs \
            --private-archive-only > artifacts/private-gri-v12/archive-receipt.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const p=JSON.parse(readFileSync(
            "artifacts/private-gri-v12/archive-receipt.json","utf8"));
          if(p.ok!==true || p.private_only!==true ||
            p.public_published!==false ||
            p.commercial_eligible!==false ||
            p.b2_full_readback_verified!==true ||
            p.b2_exact_gzip_restore_verified!==true ||
            p.d1_checkpoint_readback_verified!==true ||
            p.supabase_writes!==0 || p.usdc_spent!==0) {
            throw new Error("GRI_PRIVATE_B2_D1_ARCHIVE_NOT_VERIFIED");
          }
          console.log(JSON.stringify({
            private_gri_b2_d1_checkpoint_verified:true,
            source_as_of:p.source_as_of,
            public_published:false,commercial_eligible:false,
            supabase_writes:0,usdc_spent:0,
          }));
          NODE

      - name: Upload metadata-only staging proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: restricted-private-scored-proof-${{ github.run_id }}
          path: |
            artifacts/restricted-current-scoring/archive-proof.json
            artifacts/restricted-current-scoring/diagnostics-summary.json
            artifacts/private-gri-v12/archive-receipt.json
          if-no-files-found: warn
          retention-days: 7
