name: Verify AgentArena V2 Upgrade Execution Readiness

on:
  workflow_dispatch:
    inputs:
      new_implementation:
        description: "Approved AgentArenaV2 implementation address"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-v2-upgrade-execution
  cancel-in-progress: true

jobs:
  verify-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Verify execution readiness without signing
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          CONTRACT_ADDRESS: ${{ vars.ARC_V2_PROXY_ADDRESS }}
          NEW_IMPLEMENTATION: ${{ inputs.new_implementation }}
          VERIFY_MODE: execution-readiness
        run: node scripts/ops/verify-v2-upgrade-readiness.mjs

# Security boundary: hosted CI verifies the approved candidate, approval count,
# timelock and target only. It never receives an owner signing key and cannot
# call upgradeToAndCall. Final signing is an offline/manual admin operation.
