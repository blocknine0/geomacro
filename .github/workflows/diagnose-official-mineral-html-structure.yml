name: Diagnose Official Mineral Original HTML Structure
on:
  pull_request:
    paths:
      - "scripts/ops/probe-official-mineral-pages-readonly.ts"
      - ".github/workflows/diagnose-official-mineral-html-structure.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  bounded-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: 
          bun-version: "1.4.2"
      - name: Probe first-party metadata shape without publisher content
        run: bun scripts/ops/probe-official-mineral-pages-readonly.ts
