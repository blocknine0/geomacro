name: B2 canonical Global Risk maintenance

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/b2-global-risk-maintenance.yml"
      - "scripts/ops/publish-b2-global-risk-direct-postgres.mjs"
      - "scripts/ops/verify-global-risk-public-convergence.mjs"
      - "scripts/ops/b2-s3-client.mjs"
      - "src/lib/global-risk-assemble.ts"
      - "src/lib/global-risk-continuity.ts"
      - "src/lib/b2-live.server.ts"
      - "server/api/public/global-risk.get.ts"
      - "src/__tests__/global-risk-public-convergence-static.test.ts"

permissions:
  contents: read

concurrency:
  group: geomacro-b2-global-risk-maintenance
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.repository == 'blocknine0/geomacro' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ldpwajisioljyjtojvfx
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify required production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SUPABASE_PROJECT_REF" = "ldpwajisioljyjtojvfx"
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${B2_KEY_ID:-}"
          test -n "${B2_APPLICATION_KEY:-}"

      - name: Publish latest verified Global Risk continuity package
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bun scripts/ops/publish-b2-global-risk-direct-postgres.mjs | tee artifacts/global-risk-b2-publish.jsonl
          snapshot_as_of="$(node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('artifacts/global-risk-b2-publish.jsonl', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean);
          let result = null;
          for (const line of lines) {
            try {
              const value = JSON.parse(line);
              if (value?.schema === 'geomacro.public-global-risk-direct-postgres-publish.v1') result = value;
            } catch {}
          }
          if (!result?.ok || !result?.b2_readback_verified || typeof result?.snapshot_as_of !== 'string') process.exit(1);
          process.stdout.write(result.snapshot_as_of);
          NODE
          )"
          test -n "$snapshot_as_of"
          echo "snapshot_as_of=$snapshot_as_of" >> "$GITHUB_OUTPUT"

      - name: Verify exact published Global Risk snapshot reaches customer API
        env:
          GEOMACRO_EXPECTED_GLOBAL_RISK_SNAPSHOT_AS_OF: ${{ steps.publish.outputs.snapshot_as_of }}
        run: node scripts/ops/verify-global-risk-public-convergence.mjs

      - name: Upload Global Risk maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: global-risk-maintenance-${{ github.run_id }}
          path: artifacts/global-risk-b2-publish.jsonl
          if-no-files-found: warn
          retention-days: 30
